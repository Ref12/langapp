schema_version: 2
id: zh-hsk-curriculum-audit
audited_on: '2026-09-16'
claim: HSK exams can be passed using only knowledge available in the Chinese curriculum.
conclusion: unsupported
reason: The cumulative curriculum now contains every official HSK 1-6 vocabulary row and every recognized
  legacy-list headword in the audited papers by its cutoff, but the official grammar crosswalk and learner
  performance gates are not complete.
cutoff_semantics: For HSK level N, knowledge available by the cutoff is the union of all vocabulary and
  grammar introduced in the mapped course levels through that section. Official vocabulary rows and recognized
  practice-paper headwords must be present by that cutoff; later levels and optional branches do not count.
method:
  official_vocabulary: Read all 5,400 numbered vocabulary rows from the official November 2025 syllabus
    PDF, effective July 2026, using page coordinates and verify the published 300/200/500/1000/1600/1800
    incremental counts.
  legacy_vocabulary: Use old-1 through old-6 labels from the pinned Complete HSK Vocabulary dataset as
    a normalized legacy six-level reference.
  practice_papers: Extract question, option, listening-transcript, and writing-source text from five DigMandarin
    PDFs and five additional Mandarin Mania PDFs per level. Longest-match segmentation uses only the cumulative
    legacy reference lexicon. No paper or transcript is checked in.
  grammar: Count locally authored HSK-labelled constructs and compare the explicit crosswalk status with
    the 459 official HSK 1-6 grammar items. Candidate similarity is not counted as coverage without reviewed
    item mappings.
  skills_and_performance: Verify that readiness sections name the tested skills and explicit external
    performance gates. Curriculum inventory coverage never substitutes for timed listening, reading, writing,
    scoring, or learner evidence.
