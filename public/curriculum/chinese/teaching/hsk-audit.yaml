limitations:
- Coverage is inventory containment, not evidence that a learner has mastered the material.
- The official vocabulary extraction verifies all 5,400 numbered rows, but matching a headword cannot
  prove control of every listed part of speech or sense.
- All 60 practice papers use the legacy six-level format, not the July 2026 syllabus.
- Longest-match segmentation can miss unknown compounds or proper names and cannot determine the intended
  sense.
- PDF transcripts cover linguistic content but not audio speed, accent, noise, or listening performance.
- No automatic surface-text method can prove grammar coverage; reviewed item-level official grammar mappings
  remain incomplete.
- Passing also depends on task strategy, timing, comprehension, writing, and the learner's demonstrated
  performance.
- The external papers have no identified open redistribution license, so only URLs, retrieval dates, hashes,
  metadata, and aggregate non-substitutive coverage summaries are retained.
