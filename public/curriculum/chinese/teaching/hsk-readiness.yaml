- id: hsk-6-readiness
  title: HSK 6 readiness
  hsk_level: 6
  course_levels:
  - 25
  - 26
  - 27
  - 28
  - 29
  - 30
  outcome: Sustain precise listening, reading, synthesis, and writing across dense material while managing
    the longest HSK 1-6 paper.
  exam:
    official_url: https://www.chinesetest.cn/HSK/6
    questions: 101
    minutes: 140
    skills:
    - listening
    - reading
    - writing
  modules:
  - id: hsk-6-core-control
    title: Nuance and interpretation
    outcome: Integrate stance, register, imagery, abstraction, critical interpretation, and extended independent
      work.
    lessons:
    - id: hsk-6-stance-register
      title: Interpret stance, implication, and register
      objective: Distinguish literal content from commitment, attitude, audience positioning, and indirect
        meaning.
      success_criteria:
      - Support an interpretation with wording and context.
      - Compare formal and conversational alternatives.
      - Preserve meaning while changing tone.
    - id: hsk-6-critical-synthesis
      title: Produce a critical synthesis
      objective: Compare demanding material, weigh alternative readings, and produce a precise conclusion
        for a chosen audience.
      success_criteria:
      - Represent sources faithfully.
      - Explain a credible alternative.
      - Revise after substantive critique.
  - id: hsk-6-receptive-skills
    title: Listening and reading
    outcome: Process dense speech and prose for structure, implication, rhetorical framing, and fine-grained
      evidence.
    lessons:
    - id: hsk-6-listening
      title: Follow dense recorded discourse
      objective: Track topic shifts, examples, qualifications, and the speaker's final position at natural
        test pace.
      success_criteria:
      - Take sparse structural notes.
      - Preserve polarity and certainty.
      - Diagnose whether a miss came from language
      - memory
      - or inference.
    - id: hsk-6-reading
      title: Read for argument and implication
      objective: Identify thesis, evidence, concession, assumptions, tone, and local detail without losing
        pacing.
      success_criteria:
      - Map the argument before difficult details.
      - Cite text evidence for inferences.
      - Adjust speed by item purpose.
  - id: hsk-6-writing
    title: Source-faithful timed writing
    outcome: Reconstruct and condense supplied information accurately, coherently, and without adding
      unsupported claims.
    lessons:
    - id: hsk-6-source-notes
      title: Extract a source skeleton
      objective: Capture actors, chronology, causal relations, key details, and outcome in compact notes
        without copying whole sentences.
      success_criteria:
      - Preserve every central event.
      - Separate source facts from interpretation.
      - Use notes that support independent reconstruction.
    - id: hsk-6-source-reconstruction
      title: Reconstruct, condense, and check
      objective: Write a coherent source-faithful account, then check omissions, additions, chronology,
        reference, and character accuracy.
      success_criteria:
      - Retain central propositions and relationships.
      - Add no invented facts.
      - Complete a meaning-first final review.
  - id: hsk-6-mock-cycle
    title: Mock-test cycle
    outcome: Build stable performance across a 101-question, approximately 140-minute HSK 6 rehearsal.
    lessons:
    - id: hsk-6-diagnostic
      title: Diagnose precision and endurance
      objective: Complete one full set and locate failures of vocabulary, discourse tracking, inference,
        memory, writing fidelity, or stamina.
      success_criteria:
      - Analyze results by error mechanism.
      - Identify late-test decline.
      - Build an interleaved repair schedule.
    - id: hsk-6-simulation
      title: Rehearse the complete exam
      objective: Take a different current-format set under official timing, including the planned transition
        into source-based writing.
      success_criteria:
      - Follow all timing checkpoints.
      - Preserve writing fidelity under fatigue.
      - Confirm improvement on a later unseen set.
  mock_test:
    available_sets: 10
    sequence:
    - untimed diagnostic
    - precision repair
    - timed endurance drill
    - full simulation
    - unseen confirmation
    resource_ids:
    - digmandarin-hsk-practice
    - mandarinmania-hsk-practice
  knowledge_cutoff:
