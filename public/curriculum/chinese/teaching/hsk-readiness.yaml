advanced:
  id: hsk-7-9-orientation
  title: HSK 7-9 orientation
  status: reference-only
  official_url: https://www.chinesetest.cn/HSK/7-9
  skills:
  - listening
  - reading
  - writing
  - translation
  - speaking
  reason: The repository has a shared HSK 7-9 reference inventory, but the current app has no translation
    assessment, speaking capture, source-based writing scorer, or audited split among levels 7, 8, and
    9.
  recommendation: Keep HSK 7-9 outside the core readiness sequence until those modalities and a current
    official-syllabus mapping are implemented. Use the existing advanced reference and communicative levels
    only as preparation support, not an HSK 7-9 claim.
cutoff_semantics:
  rule: For HSK level N, available curriculum knowledge is the union of items introduced from course level
    1 through the final course level named by that HSK section. Later core levels and optional branches
    do not count.
  vocabulary: Every official November 2025 syllabus row and every recognized legacy-list headword observed
    in the ten audited papers for that level must be introduced by the cutoff.
  grammar: Only human-reviewed item-level mappings in hsk-grammar-crosswalk.yaml count as official grammar
    coverage.
  performance: Inventory coverage cannot satisfy listening, reading, writing, timing, scoring, or exam-condition
    gates.
