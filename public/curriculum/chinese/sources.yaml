- id: zh-vocab-adapted
  title: English-glossed 2021-standard-derived Chinese vocabulary adaptation
  url: https://github.com/drkameleon/complete-hsk-vocabulary/tree/7ac65bf1a6387d35f1ade478906172a19311c7f9
  license: CC-BY-SA-4.0 for adapted dictionary data; retain upstream MIT notices as well
  usage: All vocabulary.yaml rows, selected additional reference-senses.yaml records, and derived teaching
    vocabulary views, including the independent core, specialist branches, and tourist route.
    Teaching placements are curated separately from reference bands. Imports only new-1 through new-7 labels, simplified headwords, pinyin
    and meanings. Omits upstream frequency, radicals, classifiers and POS data. Processes all 32,430 imported
    source senses; removes balanced untranslated reference annotations and reference-dependent clauses,
    discards reference-only senses and readings without standalone senses, and preserves usable English
    definitions with applicable region/domain tags. Supplies 17 original headword gloss repairs plus 17
    explicit sense-rewrite rules recorded in the importer. Adds heuristic English topic labels. Not a
    certified transcription of either official standard or examination syllabus.
  attribution: Derived from Complete HSK Vocabulary by Yanis Zafiropulos, its Pleco/elkmovie HSK30 wordlist
    source, and CC-CEDICT contributors. Transformation, 17 headword repairs and 17 sense-rewrite rules
    are original AI-assisted work requiring human review. Retain this attribution, source URLs, MIT notices
    and CC-BY-SA license on redistribution.
