name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test published app and supported curricula
        run: npm run test:pages
      - name: Build the app (with PWA manifest and service worker)
        env:
          LANGAPP_BUILD_ID: ${{ github.sha }}
        run: npm run build
      # The Japanese build of Lab: the same commit and build id, its own output folder, published at lab/ja/.
      - name: Build the Japanese app (Lab, published at lab/ja/)
        env:
          LANGAPP_BUILD_ID: ${{ github.sha }}
          LANGAPP_LANGUAGE: ja
        run: npm run build:next -- --outDir dist-ja

      # Checked out after Lab's lint and tests so they never see Stable's files.
      # Stable is the same repository's `stable` branch, published at the site root.
      - name: Check that branch stable exists
        run: |
          if ! git ls-remote --exit-code --heads "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" stable >/dev/null; then
            echo "::error::Branch 'stable' does not exist in $GITHUB_REPOSITORY. Stable is published at the site root, so there is nothing to deploy."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-src

      - name: Build Stable (its build runs its own data checks and tsc)
        working-directory: stable-src
        run: |
          npm ci
          # The same Stable commit gives the same files, so a push to main does not make an open Stable tab show "App updated".
          LANGAPP_BUILD_ID=$(git rev-parse HEAD)
          export LANGAPP_BUILD_ID
          npm run build
      - name: Assemble the site (Stable at the root, Lab under lab/, Lab Japanese under lab/ja/)
        run: node scripts/assemble-site.mjs stable-src/dist dist site ja=dist-ja

      - name: Configure existing Pages site
        uses: actions/configure-pages@v5

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment5.outputs.page_url || steps.deployment4.outputs.page_url || steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub's side sometimes never finishes a deployment. Seen on 2026-11-10: one that works takes under half a minute (7 to 20 seconds),
      # one that hangs stays in syncing_files for ever, and the next deployment for the same commit can finish at once.
      # So an attempt is given up after 2 minutes and a new deployment is made: up to five attempts, the last with the full 10 minutes.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Deploy (second attempt)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Deploy (third attempt)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Deploy (fourth attempt)
        id: deployment4
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Deploy (fifth attempt)
        id: deployment5
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure' && steps.deployment4.outcome == 'failure'
        uses: actions/deploy-pages@v4
