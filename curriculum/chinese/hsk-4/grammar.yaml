- id: zh-hsk4-g001
  pattern: 不但…而且…
  english: not only one thing, but also another
  note: Use to strengthen an argument; subject placement depends on whether subjects are shared.
  examples:
  - target: 她不但会说汉语，而且会写汉字。
    english: She can not only speak Chinese but also write Chinese characters.
  - target: 这条路不但近，而且安全。
    english: This route is not only short but also safe.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g002
  pattern: 即使…也…
  english: even if a condition holds, the result remains
  note: The condition may be hypothetical; distinguish factual concession.
  examples:
  - target: 即使下雨，我们也会出发。
    english: Even if it rains, we will set out.
  - target: 即使很忙，他也每天读书。
    english: Even when he is busy, he reads every day.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g003
  pattern: 不管…都…
  english: regardless of a condition, the result remains
  note: Follow with an open alternative or question-word expression rather than one asserted fact.
  examples:
  - target: 不管谁来，都要登记。
    english: Whoever comes must register.
  - target: 不管天气怎么样，我们都去。
    english: Whatever the weather is like, we will go.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g004
  pattern: 既然…就…
  english: since an accepted fact holds, a conclusion follows
  note: Treat the first clause as shared or established information.
  examples:
  - target: 既然你有时间，就一起去吧。
    english: Since you have time, come along.
  - target: 既然已经决定了，就别再等了。
    english: Since it has been decided, do not wait any longer.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g005
  pattern: 无论…还是…都…
  english: whether one alternative or another, the same result
  note: Make the alternatives parallel in structure.
  examples:
  - target: 无论坐车还是走路，都能到。
    english: Whether you take a vehicle or walk, you can get there.
  - target: 无论白天还是晚上，这里都很安静。
    english: It is quiet here both by day and at night.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g006
  pattern: 不是…而是…
  english: not one interpretation, but another
  note: Correct a mistaken identification or explanation; this is not an either-or choice.
  examples:
  - target: 我不是生气，而是担心。
    english: I am not angry; I am worried.
  - target: 问题不是时间，而是费用。
    english: The problem is not time but cost.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g007
  pattern: 既…又…
  english: both one quality or action and another
  note: Coordinate compatible properties in balanced discourse.
  examples:
  - target: 这个办法既简单又有效。
    english: This method is both simple and effective.
  - target: 他既懂技术，又了解市场。
    english: He understands both technology and the market.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g008
  pattern: 一方面…另一方面…
  english: on the one hand, on the other hand
  note: Organize two considerations, which may complement or conflict.
  examples:
  - target: 一方面我想参加，另一方面我怕没时间。
    english: On the one hand I want to participate; on the other I worry I will not have time.
  - target: 这个计划一方面节省时间，另一方面减少费用。
    english: This plan saves time on the one hand and reduces costs on the other.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g009
  pattern: 把 + object + verb + 在 / 到 + place
  english: place or move a known object somewhere
  note: Specify the resulting location; not all verbs allow the same location complement.
  examples:
  - target: 请把行李放在门口。
    english: Please put the luggage by the door.
  - target: 他把车开到学校了。
    english: He drove the car to the school.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g010
  pattern: 被 + verb + 成 + result
  english: be transformed into a resulting state
  note: Use the transformation complement with an appropriate event.
  examples:
  - target: 这篇文章被改成了一个故事。
    english: This article was turned into a story.
  - target: 那座旧楼被改成了图书馆。
    english: That old building was converted into a library.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g011
  pattern: 把…当作…
  english: regard or treat one thing as another
  note: This is a treatment or categorization construction, not physical disposal.
  examples:
  - target: 我把他当作朋友。
    english: I regard him as a friend.
  - target: 别把玩笑当作事实。
    english: Do not take a joke as fact.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g012
  pattern: verb + 出来 for recognition
  english: discern or work out a result
  note: The complement may be abstract rather than literal outward motion.
  examples:
  - target: 我听出来是你的声音了。
    english: I recognized that it was your voice.
  - target: 你看出问题来了吗？
    english: Have you spotted the problem?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g013
  pattern: verb + 下来 for retention
  english: record or retain a result for later
  note: Distinguish resulting preservation from continuing an action onward.
  examples:
  - target: 请把地址写下来。
    english: Please write down the address.
  - target: 我把这个好消息记下来了。
    english: I noted down this good news.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g014
  pattern: verb + 得了 / 不了
  english: can / cannot manage an action
  note: The final character takes its completion reading in this potential construction, not its neutral-tone
    aspect reading.
  examples:
  - target: 这么多饭，我吃不了。
    english: I cannot eat this much food.
  - target: 这点儿工作，我做得了。
    english: I can manage this amount of work.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g015
  pattern: 差点儿 + verb
  english: almost did something
  note: The event normally failed to occur; negated variants require special pragmatic care.
  examples:
  - target: 我差点儿迟到。
    english: I was almost late.
  - target: 他差点儿忘了带票。
    english: He almost forgot to bring the ticket.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g016
  pattern: 来得及 / 来不及 + verb
  english: have / lack enough time to do something
  note: Judge feasibility before a deadline, not general speed.
  examples:
  - target: 现在出发还来得及。
    english: There is still enough time if we leave now.
  - target: 我来不及吃早饭了。
    english: I do not have time to eat breakfast now.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g017
  pattern: 才 + event or quantity
  english: not until; only as little as
  note: A low quantity and a late event share an expectation contrast; teach the readings separately.
  examples:
  - target: 他十点才起床。
    english: He did not get up until ten.
  - target: 这本书才十块钱。
    english: This book costs only ten yuan.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g018
  pattern: 就 + event or quantity
  english: as early as; as few as
  note: Context supplies the expected baseline; do not translate mechanically as then.
  examples:
  - target: 她六点就到了。
    english: She arrived as early as six.
  - target: 我就买一本。
    english: I will buy just one copy.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g019
  pattern: 再 + verb / 又 + verb
  english: do again later / something happened again
  note: This is a useful beginner contrast, though context and modal verbs can extend it.
  examples:
  - target: 请再说一遍。
    english: Please say it once more.
  - target: 他昨天又迟到了。
    english: He was late again yesterday.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g020
  pattern: 好像 / 似乎 + proposition
  english: it seems as though something is true
  note: Hedge an impression rather than assert confirmed knowledge.
  examples:
  - target: 他好像不太高兴。
    english: He seems not very happy.
  - target: 这个办法似乎更合适。
    english: This method seems more suitable.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g021
  pattern: 以为 + proposition
  english: believe or have assumed something
  note: Often introduces a belief later shown wrong; the verb itself need not always imply error.
  examples:
  - target: 我以为你已经走了。
    english: I thought you had already left.
  - target: 他以为今天不开会，其实要开。
    english: He thought there was no meeting today, but there is one.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g022
  pattern: 关于 + topic
  english: about or concerning a topic
  note: Introduce a discourse subject; distinguish the target of an attitude.
  examples:
  - target: 关于这个问题，我们明天再谈。
    english: We will discuss this issue tomorrow.
  - target: 我读了一本关于历史的书。
    english: I read a book about history.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g023
  pattern: 通过 + means + result
  english: achieve something through a method or channel
  note: Use an actual means rather than any accompanying circumstance.
  examples:
  - target: 通过练习，我的发音进步了。
    english: Through practice, my pronunciation improved.
  - target: 我们通过邮件联系。
    english: We communicate by email.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g024
  pattern: 由于…因此…
  english: because of a cause, consequently a result
  note: This is relatively written or formal causal organization.
  examples:
  - target: 由于天气不好，因此航班取消了。
    english: The flight was canceled because of bad weather.
  - target: 由于道路施工，因此我们换了路线。
    english: We changed routes because of roadwork.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
- id: zh-hsk4-g025
  pattern: 尽管…还是…
  english: despite a fact, something still occurs
  note: Concede an actual circumstance; distinguish hypothetical even-if conditions.
  examples:
  - target: 尽管很累，他还是完成了工作。
    english: Although he was tired, he still finished the work.
  - target: 尽管价格高，我还是买了。
    english: Although the price was high, I bought it anyway.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 4; not official grammar mapping
