- id: zh-hsk7-9-g001
  pattern: 鉴于…
  english: in view of an established consideration
  note: Formal rationale should name a verifiable circumstance; do not use as proof by itself.
  examples:
  - target: 鉴于时间有限，我们只讨论两个问题。
    english: In view of the limited time, we will discuss only two issues.
  - target: 鉴于需求变化，方案需要调整。
    english: In view of changing demand, the proposal needs adjustment.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g002
  pattern: 基于…
  english: based on an explicit foundation
  note: Identify an evidential or conceptual basis; distinguish correlation from causal proof.
  examples:
  - target: 这个判断基于现有证据。
    english: This judgment is based on the available evidence.
  - target: 我们基于共同目标展开合作。
    english: We began cooperating on the basis of shared goals.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g003
  pattern: 本着…的原则
  english: in accordance with a guiding principle
  note: Use for a declared policy or intention, not automatic evidence of compliance.
  examples:
  - target: 我们本着公平的原则分配资源。
    english: We allocate resources according to the principle of fairness.
  - target: 双方本着互相尊重的原则进行协商。
    english: The two sides negotiate on the principle of mutual respect.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g004
  pattern: 在…的前提下
  english: under the prerequisite that
  note: Make the condition for a claim or permission explicit.
  examples:
  - target: 在保证质量的前提下，可以缩短时间。
    english: The time may be shortened provided quality is assured.
  - target: 在获得同意的前提下，我们才会使用这些资料。
    english: We will use these materials only after consent is obtained.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g005
  pattern: 以…为前提
  english: take something as a prerequisite
  note: A requirement is not evidence that it has already been satisfied.
  examples:
  - target: 合作以互相信任为前提。
    english: Cooperation presupposes mutual trust.
  - target: 讨论以事实为前提。
    english: The discussion must be grounded in facts.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g006
  pattern: 与…相较 / 相比之下
  english: compared with something / by contrast
  note: Keep the populations, units and baseline comparable.
  examples:
  - target: 与去年相较，今年的成本较低。
    english: Compared with last year, costs are lower this year.
  - target: 第一种方案成本高，相比之下，第二种更可行。
    english: The first proposal is costly; by contrast, the second is more feasible.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g007
  pattern: 并非…而是…
  english: it is not the case that one explanation holds, but rather another
  note: Formal corrective contrast requires evidence for the replacement interpretation.
  examples:
  - target: 这并非偶然，而是长期积累的结果。
    english: This is not accidental but the result of long-term accumulation.
  - target: 争论并非关于目标，而是关于方法。
    english: The dispute concerns not the goal but the method.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g008
  pattern: 与其将…归因于…不如…
  english: rather than attribute something to one cause, better to another
  note: Compare causal accounts without presenting speculation as fact.
  examples:
  - target: 与其将变化归因于运气，不如考察具体条件。
    english: Rather than attribute the change to luck, it is better to examine the specific conditions.
  - target: 与其将失败归因于个人，不如分析制度问题。
    english: Rather than attribute the failure to an individual, it is better to analyze systemic problems.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g009
  pattern: 诚然…然而…
  english: it is true that one point holds; nevertheless
  note: Acknowledge a serious counterargument before responding.
  examples:
  - target: 诚然，样本不大，然而结果仍值得关注。
    english: Admittedly the sample is small, but the results still deserve attention.
  - target: 诚然，改革有成本，然而停滞也有代价。
    english: It is true that reform has costs, yet stagnation also has a price.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g010
  pattern: 纵然…亦…
  english: even if a condition holds, still
  note: A literary concession; retain its formal register in interpretation.
  examples:
  - target: 纵然困难重重，亦不应放弃沟通。
    english: Even if difficulties abound, communication should not be abandoned.
  - target: 纵然意见不同，亦可相互尊重。
    english: Even when opinions differ, mutual respect remains possible.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g011
  pattern: 倘使…则…
  english: if a hypothetical condition holds, then
  note: A formal hypothetical argument; state assumptions explicitly.
  examples:
  - target: 倘使数据可靠，则这一解释更有说服力。
    english: If the data are reliable, this explanation is more persuasive.
  - target: 倘使需求继续上升，则需要增加供给。
    english: If demand continues to rise, supply must be increased.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g012
  pattern: 若非…岂能…
  english: if not for something, how could a result be possible?
  note: A literary counterfactual rhetorical question strongly credits a prerequisite.
  examples:
  - target: 若非长期努力，岂能取得这样的进展？
    english: Without sustained effort, how could such progress have been achieved?
  - target: 若非亲眼所见，岂能相信？
    english: Without seeing it firsthand, how could one believe it?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g013
  pattern: 无论…抑或…均…
  english: whether one alternative or another, in either case
  note: A formal universal structure; the quantifier must cover the full alternative set.
  examples:
  - target: 无论个人抑或机构，均须遵守规定。
    english: Individuals and institutions alike must comply with the rules.
  - target: 无论线上抑或线下，均可提交申请。
    english: Applications may be submitted either online or in person.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g014
  pattern: 唯有…方能…
  english: only through a necessary condition can something occur
  note: Formal necessary-condition reasoning; do not confuse with a sufficient guarantee.
  examples:
  - target: 唯有充分协商，方能形成共识。
    english: Only through thorough consultation can consensus be reached.
  - target: 唯有核实事实，方能作出可靠判断。
    english: Only by verifying facts can a reliable judgment be made.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g015
  pattern: 不仅在于…更在于…
  english: lies not only in one aspect but more importantly in another
  note: Foreground a hierarchy of reasons rather than simple addition.
  examples:
  - target: 价值不仅在于结果，更在于过程。
    english: The value lies not only in the result but, more importantly, in the process.
  - target: 挑战不仅在于技术，更在于协调。
    english: The challenge lies not only in technology but, more importantly, in coordination.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g016
  pattern: 之于…
  english: in relation to; for
  note: A concise literary relation marker often occurs with abstract nouns.
  examples:
  - target: 语言之于文化，如同桥梁之于交流。
    english: Language relates to culture as a bridge relates to communication.
  - target: 这项研究之于实践，意义重大。
    english: This research is highly significant for practice.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g017
  pattern: 所…者
  english: that which; the person or thing that
  note: A literary nominalization; use sparingly in ordinary speech.
  examples:
  - target: 我们所重视者，是证据而非声望。
    english: What we value is evidence, not prestige.
  - target: 他所追求者，并非个人利益。
    english: What he seeks is not personal gain.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g018
  pattern: 为…所…
  english: be subjected to an action by an agent
  note: A formal passive; identify the agent and avoid forcing it onto every English passive.
  examples:
  - target: 这一观点为多数研究者所接受。
    english: This view is accepted by most researchers.
  - target: 他的贡献为人们所铭记。
    english: His contribution is remembered by people.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g019
  pattern: 有待 + verb
  english: remain to be done
  note: Marks unresolved work; it does not mean that completion is inevitable.
  examples:
  - target: 这一结论有待进一步验证。
    english: This conclusion remains to be verified further.
  - target: 具体细节有待双方协商。
    english: The specific details remain to be negotiated by both sides.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g020
  pattern: 尚不足以…
  english: is not yet sufficient to support or cause something
  note: Separate absence of sufficient evidence from evidence of absence.
  examples:
  - target: 现有证据尚不足以支持这一说法。
    english: The current evidence is not yet sufficient to support this claim.
  - target: 一次成功尚不足以证明方法可靠。
    english: One success is not enough to establish that the method is reliable.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g021
  pattern: 未可一概而论
  english: cannot be generalized across all cases
  note: Limit generalization; follow with relevant distinctions rather than empty caution.
  examples:
  - target: 各地条件不同，未可一概而论。
    english: Local conditions differ, so no blanket generalization can be made.
  - target: 这些案例背景各异，未可一概而论。
    english: These cases have different backgrounds and cannot all be treated alike.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g022
  pattern: 不无 + abstract noun
  english: not without; having some degree of
  note: A restrained double negative often qualifies praise or concern.
  examples:
  - target: 这种担心不无道理。
    english: This concern is not without reason.
  - target: 他的建议不无启发。
    english: His suggestion offers some insight.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g023
  pattern: 不乏…
  english: there is no lack of; there are quite a few
  note: A formal positive quantity expression; it does not mean all members.
  examples:
  - target: 相关研究中不乏反例。
    english: There is no shortage of counterexamples in the relevant research.
  - target: 这个团队不乏有经验的人。
    english: This team has quite a few experienced people.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g024
  pattern: 莫不…
  english: there is none that does not; all
  note: Literary universal affirmation; use only when the universal scope is justified.
  examples:
  - target: 在场者莫不赞同这一建议。
    english: Everyone present agreed with this suggestion.
  - target: 读过此信的人莫不感动。
    english: Everyone who read this letter was moved.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g025
  pattern: 难能可贵的是…
  english: what is especially commendable is
  note: An evaluative frame selects a rare or difficult positive quality.
  examples:
  - target: 难能可贵的是，他愿意承认错误。
    english: What is especially commendable is his willingness to admit mistakes.
  - target: 难能可贵的是，双方始终保持对话。
    english: What is especially commendable is that both sides maintained dialogue throughout.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g026
  pattern: 毋庸置疑的是…
  english: what is beyond doubt is
  note: A strong epistemic claim needs evidence and is inappropriate for disputed speculation.
  examples:
  - target: 毋庸置疑的是，文件已经签署。
    english: What is beyond doubt is that the document has been signed.
  - target: 毋庸置疑的是，这两组数字并不相同。
    english: What is beyond doubt is that these two sets of numbers are not identical.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g027
  pattern: 不言而喻…
  english: it goes without saying; self-evidently
  note: A rhetorical claim of obviousness; examine whether the audience actually shares the premise.
  examples:
  - target: 保护个人信息的重要性不言而喻。
    english: The importance of protecting personal information goes without saying.
  - target: 对初学者来说，清晰示范的价值不言而喻。
    english: For beginners, the value of a clear demonstration is self-evident.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g028
  pattern: 姑且…
  english: for the moment; provisionally
  note: Temporarily set a question aside or adopt an assumption without endorsing it.
  examples:
  - target: 我们姑且接受这个假设。
    english: Let us accept this hypothesis provisionally.
  - target: 细节姑且不谈，先看总体方向。
    english: Let us set aside the details for now and look at the overall direction.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g029
  pattern: 暂且不论…单就…
  english: leaving one matter aside, considering only another
  note: Scope an argument explicitly; the excluded dimension may still matter later.
  examples:
  - target: 暂且不论费用，单就时间而言也很困难。
    english: Leaving cost aside, it is difficult even just in terms of time.
  - target: 暂且不论动机，单就结果来看并不理想。
    english: Leaving motives aside, the result alone is unsatisfactory.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g030
  pattern: 进而…
  english: go on to a further stage or consequence
  note: Use for a logical or procedural progression rather than arbitrary chronological nextness.
  examples:
  - target: 先分析原因，进而提出建议。
    english: First analyze the causes, then go on to propose recommendations.
  - target: 理解差异，进而改善沟通。
    english: Understand the differences and thereby improve communication.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g031
  pattern: 从而…
  english: thereby; consequently enabling a result
  note: Connect a means or prior change with a logical consequence.
  examples:
  - target: 流程简化了，从而节省了时间。
    english: The process was simplified, thereby saving time.
  - target: 双方共享信息，从而减少误解。
    english: The two sides share information, thereby reducing misunderstandings.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g032
  pattern: 反之…
  english: conversely; if the opposite holds
  note: Specify which condition is reversed; a converse does not follow automatically in logic.
  examples:
  - target: 信息充分，判断就容易；反之，则更困难。
    english: With sufficient information, judgment is easier; otherwise, it is more difficult.
  - target: 条件成熟，可以推广；反之，应继续试验。
    english: If conditions are ready, it can be expanded; otherwise, trials should continue.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g033
  pattern: 综上所述…
  english: to summarize the preceding argument
  note: Synthesize evidence already presented; do not introduce a new unsupported conclusion.
  examples:
  - target: 综上所述，这一方案仍需完善。
    english: In summary, this proposal still needs improvement.
  - target: 综上所述，两种解释各有局限。
    english: In summary, both explanations have limitations.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g034
  pattern: 换言之…
  english: in other words
  note: Reformulate faithfully; do not strengthen the original claim during paraphrase.
  examples:
  - target: 结果尚不确定，换言之，我们需要更多数据。
    english: The outcome remains uncertain; in other words, we need more data.
  - target: 这只是建议，换言之，并非强制要求。
    english: This is only a suggestion; in other words, it is not a mandatory requirement.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
- id: zh-hsk7-9-g035
  pattern: 其…并不意味着…
  english: a property does not imply a further claim
  note: Track the antecedent of the formal pronoun and distinguish implication from association.
  examples:
  - target: 其规模较大，并不意味着效率较高。
    english: Its larger scale does not imply greater efficiency.
  - target: 其结果一致，并不意味着方法相同。
    english: Their consistent results do not imply that their methods are the same.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 7-9; not official grammar mapping
