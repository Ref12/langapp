- {id: zh-tourist-p001, ch: 您好。, pr: nín hǎo, ds: Hello. (polite)}
- {id: zh-tourist-p002, ch: 对不起，我不懂汉语。, pr: 'duì bu qǐ, wǒ bù dǒng Hàn yǔ', ds: 'Sorry, I do not understand Chinese.'}
- {id: zh-tourist-p003, ch: 请说慢一点儿。, pr: qǐng shuō màn yī diǎnr, ds: Please speak a little more slowly.}
- {id: zh-tourist-p004, ch: 请再说一次。, pr: qǐng zài shuō yī cì, ds: Please say it once more.}
- {id: zh-tourist-p005, ch: 请写下来。, pr: qǐng xiě xià lai, ds: Please write it down.}
- {id: zh-tourist-p006, ch: 我想喝水。, pr: wǒ xiǎng hē shuǐ, ds: I would like some water.}
- {id: zh-tourist-p007, ch: 请给我一杯茶。, pr: qǐng gěi wǒ yī bēi chá, ds: Please give me a cup of tea.}
- {id: zh-tourist-p008, ch: 请给我菜单。, pr: qǐng gěi wǒ cài dān, ds: Please give me the menu.}
- {id: zh-tourist-p009, ch: 我要米饭和鸡蛋。, pr: wǒ yào mǐ fàn hé jī dàn, ds: I would like rice and eggs.}
- {id: zh-tourist-p010, ch: 不要辣。, pr: bù yào là, ds: 'No spice, please.'}
- {id: zh-tourist-p011, ch: 请问，厕所在哪儿？, pr: 'qǐng wèn, cè suǒ zài nǎr', ds: 'Excuse me, where is the toilet?'}
- {id: zh-tourist-p012, ch: 我想去地铁站。, pr: wǒ xiǎng qù dì tiě zhàn, ds: I would like to go to the subway station.}
- {id: zh-tourist-p013, ch: 这里可以坐吗？, pr: zhè lǐ kě yǐ zuò ma, ds: 'May I sit here?'}
- {id: zh-tourist-p014, ch: 请帮我叫出租车。, pr: qǐng bāng wǒ jiào chū zū chē, ds: Please help me call a taxi.}
- {id: zh-tourist-p015, ch: 左边还是右边？, pr: zuǒ bian hái shi yòu bian, ds: 'Left or right?'}
- {id: zh-tourist-p016, ch: 可以用现金吗？, pr: kě yǐ yòng xiàn jīn ma, ds: 'May I pay in cash?'}
- {id: zh-tourist-p017, ch: 可以用信用卡吗？, pr: kě yǐ yòng xìn yòng kǎ ma, ds: 'May I use a credit card?'}
- {id: zh-tourist-p018, ch: 这个多少钱？, pr: zhè gè duō shao qián, ds: 'How much is this?'}
- {id: zh-tourist-p019, ch: 请给我发票。, pr: qǐng gěi wǒ fā piào, ds: Please give me a receipt.}
- {id: zh-tourist-p020, ch: 我想买这个。, pr: wǒ xiǎng mǎi zhè gè, ds: I would like to buy this.}
- {id: zh-tourist-p021, ch: 请帮我。, pr: qǐng bāng wǒ, ds: Please help me.}
- {id: zh-tourist-p022, ch: 我需要医生。, pr: wǒ xū yào yī shēng, ds: I need a doctor.}
- {id: zh-tourist-p023, ch: 我不舒服。, pr: wǒ bù shū fu, ds: I do not feel well.}
- {id: zh-tourist-p024, ch: 我的手机丢了。, pr: wǒ de shǒu jī diū le, ds: My phone is missing.}
- {id: zh-tourist-p025, ch: 请帮我报警。, pr: qǐng bāng wǒ bào jǐng, ds: Please help me contact the police.}
