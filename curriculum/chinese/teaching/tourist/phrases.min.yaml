- {id: zh-tourist-p001, ch: 您好。, pr: nín hǎo, ds: Hello. (polite)}
- {id: zh-tourist-p002, ch: 对不起，我不懂汉语。, pr: 'duì bu qǐ, wǒ bù dǒng Hàn yǔ', ds: 'Sorry, I do not understand Chinese.'}
- {id: zh-tourist-p003, ch: 请说慢一点儿。, pr: qǐng shuō màn yī diǎnr, ds: Please speak a little more slowly.}
- {id: zh-tourist-p004, ch: 请再说一次。, pr: qǐng zài shuō yī cì, ds: Please say it once more.}
- {id: zh-tourist-p005, ch: 请写下来。, pr: qǐng xiě xià lai, ds: Please write it down.}
- {id: zh-tourist-p006, ch: 我想喝水。, pr: wǒ xiǎng hē shuǐ, ds: I would like some water.}
- {id: zh-tourist-p007, ch: 请给我一杯茶。, pr: qǐng gěi wǒ yī bēi chá, ds: Please give me a cup of tea.}
- {id: zh-tourist-p008, ch: 请给我菜单。, pr: qǐng gěi wǒ cài dān, ds: Please give me the menu.}
- {id: zh-tourist-p009, ch: 我要米饭和鸡蛋。, pr: wǒ yào mǐ fàn hé jī dàn, ds: I would like rice and eggs.}
- {id: zh-tourist-p010, ch: 不要辣。, pr: bù yào là, ds: 'No spice, please.'}
- {id: zh-tourist-p011, ch: 请问，厕所在哪儿？, pr: 'qǐng wèn, cè suǒ zài nǎr', ds: 'Excuse me, where is the toilet?'}
- {id: zh-tourist-p012, ch: 我想去地铁站。, pr: wǒ xiǎng qù dì tiě zhàn, ds: I would like to go to the subway station.}
- {id: zh-tourist-p013, ch: 这里可以坐吗？, pr: zhè lǐ kě yǐ zuò ma, ds: 'May I sit here?'}
- {id: zh-tourist-p014, ch: 请帮我叫出租车。, pr: qǐng bāng wǒ jiào chū zū chē, ds: Please help me call a taxi.}
- {id: zh-tourist-p015, ch: 左边还是右边？, pr: zuǒ bian hái shi yòu bian, ds: 'Left or right?'}
- {id: zh-tourist-p016, ch: 可以用现金吗？, pr: kě yǐ yòng xiàn jīn ma, ds: 'May I pay in cash?'}
- {id: zh-tourist-p017, ch: 可以用信用卡吗？, pr: kě yǐ yòng xìn yòng kǎ ma, ds: 'May I use a credit card?'}
- {id: zh-tourist-p018, ch: 这个多少钱？, pr: zhè gè duō shao qián, ds: 'How much is this?'}
- {id: zh-tourist-p019, ch: 请给我发票。, pr: qǐng gěi wǒ fā piào, ds: Please give me a receipt.}
- {id: zh-tourist-p020, ch: 我想买这个。, pr: wǒ xiǎng mǎi zhè gè, ds: I would like to buy this.}
- {id: zh-tourist-p021, ch: 请帮我。, pr: qǐng bāng wǒ, ds: Please help me.}
- {id: zh-tourist-p022, ch: 我需要医生。, pr: wǒ xū yào yī shēng, ds: I need a doctor.}
- {id: zh-tourist-p023, ch: 我不舒服。, pr: wǒ bù shū fu, ds: I do not feel well.}
- {id: zh-tourist-p024, ch: 我的手机丢了。, pr: wǒ de shǒu jī diū le, ds: My phone is missing.}
- {id: zh-tourist-p025, ch: 请帮我报警。, pr: qǐng bāng wǒ bào jǐng, ds: Please help me contact the police.}
- {id: zh-tourist-p026, ch: 我预订了房间。, pr: wǒ yù dìng le fáng jiān, ds: I booked a room.}
- {id: zh-tourist-p027, ch: 我的房间在哪儿？, pr: wǒ de fáng jiān zài nǎr, ds: 'Where is my room?'}
- {id: zh-tourist-p028, ch: 请给我房间钥匙。, pr: qǐng gěi wǒ fáng jiān yào shi, ds: Please give me the room key.}
- {id: zh-tourist-p029, ch: 这里有热水吗？, pr: zhè lǐ yǒu rè shuǐ ma, ds: 'Is there hot water here?'}
- {id: zh-tourist-p030, ch: 我想换房间。, pr: wǒ xiǎng huàn fáng jiān, ds: I would like to change rooms.}
- {id: zh-tourist-p031, ch: 我对花生过敏。, pr: wǒ duì huā shēng guò mǐn, ds: I am allergic to peanuts.}
- {id: zh-tourist-p032, ch: 我不吃肉。, pr: wǒ bù chī ròu, ds: I do not eat meat.}
- {id: zh-tourist-p033, ch: 这个菜有牛奶吗？, pr: zhè gè cài yǒu niú nǎi ma, ds: 'Does this dish contain milk?'}
- {id: zh-tourist-p034, ch: 请不要放糖。, pr: qǐng bù yào fàng táng, ds: Please do not add sugar.}
- {id: zh-tourist-p035, ch: 我吃素食。, pr: wǒ chī sù shí, ds: I eat vegetarian food.}
- {id: zh-tourist-p036, ch: 去机场要多长时间？, pr: qù jī chǎng yào duō cháng shí jiān, ds: 'How long does it take to get to the airport?'}
- {id: zh-tourist-p037, ch: 我想买一张车票。, pr: wǒ xiǎng mǎi yī zhāng chē piào, ds: I would like to buy a bus or train ticket.}
- {id: zh-tourist-p038, ch: 火车几点开？, pr: huǒ chē jǐ diǎn kāi, ds: 'What time does the train leave?'}
- {id: zh-tourist-p039, ch: 我们在哪儿下车？, pr: wǒ men zài nǎr xià chē, ds: 'Where do we get off?'}
- {id: zh-tourist-p040, ch: 请在这里停车。, pr: qǐng zài zhè lǐ tíng chē, ds: Please stop here.}
- {id: zh-tourist-p041, ch: 我想参观博物馆。, pr: wǒ xiǎng cān guān bó wù guǎn, ds: I would like to visit the museum.}
- {id: zh-tourist-p042, ch: 门票多少钱？, pr: mén piào duō shao qián, ds: 'How much is admission?'}
- {id: zh-tourist-p043, ch: 这里可以拍照吗？, pr: zhè lǐ kě yǐ pāi zhào ma, ds: 'May I take photos here?'}
- {id: zh-tourist-p044, ch: 入口在哪儿？, pr: rù kǒu zài nǎr, ds: 'Where is the entrance?'}
- {id: zh-tourist-p045, ch: 几点关门？, pr: jǐ diǎn guān mén, ds: 'What time do you close?'}
- {id: zh-tourist-p046, ch: 可以试一下吗？, pr: kě yǐ shì yī xià ma, ds: 'May I try it?'}
- {id: zh-tourist-p047, ch: 有大一点儿的吗？, pr: yǒu dà yī diǎnr de ma, ds: 'Do you have a slightly larger one?'}
- {id: zh-tourist-p048, ch: 我想退这个。, pr: wǒ xiǎng tuì zhè gè, ds: I would like to return this.}
- {id: zh-tourist-p049, ch: 可以换吗？, pr: kě yǐ huàn ma, ds: 'May I exchange it?'}
- {id: zh-tourist-p050, ch: 我不要这个颜色。, pr: wǒ bù yào zhè gè yán sè, ds: I do not want this color.}
- {id: zh-tourist-p051, ch: 我们明天去公园吧。, pr: wǒ men míng tiān qù gōng yuán ba, ds: Let us go to the park tomorrow.}
- {id: zh-tourist-p052, ch: 现在几点？, pr: xiàn zài jǐ diǎn, ds: 'What time is it now?'}
- {id: zh-tourist-p053, ch: 从这里到车站要十分钟。, pr: cóng zhè lǐ dào chē zhàn yào shí fēn zhōng, ds: It takes ten minutes from here to the train station.}
- {id: zh-tourist-p054, ch: 请等一下。, pr: qǐng děng yī xià, ds: Please wait a moment.}
- {id: zh-tourist-p055, ch: 我今天离开酒店。, pr: wǒ jīn tiān lí kāi jiǔ diàn, ds: I am leaving the hotel today.}
- {id: zh-tourist-p056, ch: 我的行李在这里。, pr: wǒ de xíng li zài zhè lǐ, ds: My luggage is here.}
- {id: zh-tourist-p057, ch: 请给我收据。, pr: qǐng gěi wǒ shōu jù, ds: Please give me a receipt.}
- {id: zh-tourist-p058, ch: 我们现在去机场。, pr: wǒ men xiàn zài qù jī chǎng, ds: We are going to the airport now.}
- {id: zh-tourist-p059, ch: 谢谢，再见。, pr: 'xiè xie, zài jiàn', ds: Thank you. Goodbye.}
