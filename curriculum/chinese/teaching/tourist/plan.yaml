schema_version: 1
id: zh-tourist
title: Mandarin for a short visit
language: chinese
level_basis: Independent situation-based travel route with no prerequisite course. Reference IDs indicate
  provenance, not HSK competence or examination levels. The first five units form a self-contained quick
  start; later units extend it in order.
review_policy: Work in small sessions of about 5-8 new senses, not an entire unit at once. First recognize
  a sign or request, then use a phrase with a changed situation and less help. Retrieve the listed earlier
  items and anything fragile after the session and roughly 1, 3, 7, and 14 days later. Phrase pinyin retains
  dictionary tones for 一 and 不 rather than transcribing contextual tone sandhi; 儿 is attached as r. Text
  and pinyin are not audio practice or evidence of pronunciation. These phrases are learning aids, not
  assurances of safety, accessible facilities, accepted payment methods, dietary safety, or medical or
  legal accuracy. Confirm arrangements locally and seek appropriate human help for health or safety concerns.
quick_start:
- polite-repair
- food-basics
- finding-your-way
- paying
- asking-for-help
