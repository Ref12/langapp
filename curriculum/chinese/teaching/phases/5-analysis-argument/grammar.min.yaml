- {id: zh-hsk7-9-g020, ch: Evidence+尚不足以+VP, ds: current evidence is still insufficient for a conclusion}
- {id: zh-hsk5-g011, ch: 凡是+Category+都+P, ds: a rule applies to every member of a defined category}
- {id: zh-hsk5-g014, ch: 以+A+为+B, ds: take A as a role or basis B in formal language}
