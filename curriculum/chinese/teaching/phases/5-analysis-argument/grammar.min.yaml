- {id: zh-hsk7-9-g005, ch: A+以+B+为前提, ds: predicate a prerequisite rather than assert it is met}
- {id: zh-hsk7-9-g015, ch: 不仅在于+A+更在于+B, ds: locate a deeper or stronger basis beyond the first}
- {id: zh-hsk7-9-g033, ch: 综上所述+Conclusion, ds: synthesize the reasoning already presented}
