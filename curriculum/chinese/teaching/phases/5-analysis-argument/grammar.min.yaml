- {id: zh-hsk7-9-g006, ch: A+P+相比之下+B+Q, ds: contrast cases against a stated comparison baseline}
- {id: zh-hsk7-9-g019, ch: Subject+有待+V, ds: work remains unresolved rather than certain to finish}
- {id: zh-hsk5-g003, ch: 宁可+VP1+也不+VP2, ds: accept a cost rather than choose the rejected action}
