- {id: zh-hsk7-9-g009, ch: 诚然+P+然而+Q, ds: acknowledge a counterargument before responding}
- {id: zh-hsk5-g019, ch: 即便+P+也未必+Q, ds: concession does not make a consequence certain}
- {id: zh-hsk6-g009, ch: Topic+固然+P+但+Q, ds: formally acknowledge a point before limiting it}
