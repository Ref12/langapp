goals: &id001
- Adapt wording to an audience and relationship.
- Distinguish formal and conversational alternatives.
- Preserve meaning while changing tone.
checkpoint:
  task: Recast the same request or disagreement for two different audiences.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
