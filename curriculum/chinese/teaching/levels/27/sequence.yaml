goals: &id001
- Interpret commonly encountered figurative language.
- Explain imagery in ordinary language.
- Use an idiomatic expression only where its register and meaning fit.
checkpoint:
  task: Interpret a figurative passage and distinguish its effect from a literal paraphrase.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
