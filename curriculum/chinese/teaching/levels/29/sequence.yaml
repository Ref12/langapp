goals: &id001
- Support an interpretation with textual evidence.
- Compare alternative readings and assumptions.
- Evaluate a work or argument using explicit criteria.
checkpoint:
  task: Present and defend an interpretation while acknowledging a credible alternative.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
