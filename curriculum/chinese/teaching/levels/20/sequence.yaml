- zh-level-18
- zh-level-19
goals: &id001
- Explain a public or economic process.
- Compare stated aims with practical consequences.
- Discuss different stakeholders without assuming professional expertise.
checkpoint:
  task: Explain a policy or market change and compare two plausible effects.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
