schema_version: 3
id: zh-level-12
title: Sharing connected information
language: chinese
level_basis: Independent communicative teaching progression. Reference bands are provenance only, not competence or examination claims.
review_policy: Modules span several lessons of about 5-8 new senses. Select relevant earlier and fragile items for retrieval, revisit them on later days, and record the modality and assistance. Inventory coverage is not demonstrated mastery.
kind: level
number: 12
phase: stories-conversations
prerequisites:
- zh-level-01
- zh-level-02
- zh-level-03
- zh-level-04
- zh-level-05
- zh-level-06
- zh-level-07
- zh-level-08
- zh-level-09
- zh-level-10
- zh-level-11
goals: &id001
- Summarize a familiar source.
- Exchange information about learning and community life.
- Clarify a message or practical procedure.
checkpoint:
  task: Relay the useful information from a short notice or account and resolve follow-up questions.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
