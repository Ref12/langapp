  - {id: zh-hsk1-00036-s001, ch: 菜, pr: cài, ds: dish (food)}
  - {id: zh-hsk1-00036-s002, ch: 菜, pr: cài, ds: vegetable}
  - {id: zh-hsk1-00165-s001, ch: 鸡蛋, pr: jī dàn, ds: chicken egg}
  - {id: zh-hsk1-00314-s001, ch: 肉, pr: ròu, ds: meat}
  - {id: zh-hsk1-00350-s001, ch: 水果, pr: shuǐ guǒ, ds: fruit}
  - {id: zh-hsk3-00526-s001, ch: 苹果, pr: píng guǒ, ds: apple}
  - {id: zh-hsk1-00141-s001, ch: 好吃, pr: hǎo chī, ds: tasty}
  - {id: zh-hsk1-00129-s001, ch: 贵, pr: guì, ds: expensive}
  - {id: zh-hsk1-00017-s001, ch: 包子, pr: bāo zi, ds: steamed stuffed bun}
  - {id: zh-hsk1-00247-s001, ch: 面包, pr: miàn bāo, ds: bread}
  - {id: zh-hsk1-00098-s001, ch: 饿, pr: è, ds: to be hungry}
  - {id: zh-hsk1-00200-s001, ch: 渴, pr: kě, ds: thirsty}
