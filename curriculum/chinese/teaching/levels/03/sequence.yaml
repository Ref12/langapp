  - {id: zh-hsk1-00097-s004, ch: 多少, pr: duō shao, ds: 'how much or how many?'}
  - {id: zh-hsk1-00205-s003, ch: 块, pr: kuài, ds: currency-unit classifier (colloquial)}
  - {id: zh-hsk1-00390-s001, ch: 喜欢, pr: xǐ huan, ds: to like}
  review_grammar:
  - {id: zh-hsk1-g010, ch: Num+Cl+N, ds: counting with classifiers}
  - {id: zh-hsk1-g018, ch: N+和+N, ds: noun-phrase coordination}
