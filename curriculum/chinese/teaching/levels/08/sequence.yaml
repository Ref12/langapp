schema_version: 3
id: zh-level-08
title: Work, study, and social life
language: chinese
level_basis: Independent communicative teaching progression. Reference bands are provenance only, not competence or examination claims.
review_policy: Modules span several lessons of about 5-8 new senses. Select relevant earlier and fragile items for retrieval, revisit them on later days, and record the modality and assistance. Inventory coverage is not demonstrated mastery.
kind: level
number: 8
phase: everyday-life
prerequisites:
- zh-level-01
- zh-level-02
- zh-level-03
- zh-level-04
- zh-level-05
- zh-level-06
- zh-level-07
goals: &id001
- Describe a work or study routine.
- Arrange a shared activity.
- Explain familiar preferences and experiences.
checkpoint:
  task: Coordinate a shared task or invitation while accommodating another person's constraints.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
