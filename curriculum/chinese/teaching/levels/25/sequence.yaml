goals: &id001
- Distinguish literal content from implied stance.
- Express different degrees of commitment.
- Explain how context changes an interpretation.
checkpoint:
  task: Compare plausible interpretations of an indirect message and justify the most suitable reading.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
