goals: &id001
- Choose words that preserve subtle distinctions.
- Discuss relationships among abstract ideas.
- Qualify descriptions of degree and consequence.
checkpoint:
  task: Revise an imprecise explanation and justify the changes in meaning.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
