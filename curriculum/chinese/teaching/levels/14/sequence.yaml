schema_version: 3
id: zh-level-14
title: Unfamiliar everyday problems
language: chinese
level_basis: Independent communicative teaching progression. Reference bands are provenance only, not competence or examination claims.
review_policy: Modules span several lessons of about 5-8 new senses. Select relevant earlier and fragile items for retrieval, revisit them on later days, and record the modality and assistance. Inventory coverage is not demonstrated mastery.
kind: level
number: 14
phase: explanation-problems
prerequisites:
- zh-level-01
- zh-level-02
- zh-level-03
- zh-level-04
- zh-level-05
- zh-level-06
- zh-level-07
- zh-level-08
- zh-level-09
- zh-level-10
- zh-level-11
- zh-level-12
- zh-level-13
goals: &id001
- Explain a less predictable problem.
- Clarify requirements and constraints.
- Negotiate a workable response.
checkpoint:
  task: Resolve a simulated service, housing, or travel problem with incomplete initial information.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
