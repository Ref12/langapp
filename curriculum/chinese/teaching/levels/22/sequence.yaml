goals: &id001
- Explain a conflict between values.
- Compare cultural or personal perspectives.
- Avoid overgeneralizing from an individual example.
checkpoint:
  task: Discuss a dilemma while fairly representing two competing considerations.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
