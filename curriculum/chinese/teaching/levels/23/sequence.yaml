goals: &id001
- Build a supported argument.
- Anticipate objections and qualify claims.
- Explain tradeoffs under uncertainty.
checkpoint:
  task: Defend a recommendation and revise its scope when counterevidence is introduced.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
