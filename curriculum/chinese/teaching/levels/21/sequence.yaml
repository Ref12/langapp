- zh-level-17
- zh-level-18
- zh-level-19
- zh-level-20
goals: &id001
- Explain a general-audience scientific account.
- Compare explanations for a long-term change.
- Keep method and conclusion distinct.
checkpoint:
  task: Summarize an explanatory source and identify an unanswered question or limitation.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
