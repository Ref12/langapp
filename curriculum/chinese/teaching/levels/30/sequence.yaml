goals: &id001
- Synthesize demanding material for a chosen audience.
- Sustain a discussion or extended written project.
- Reflect on uncertainty and revise after substantive feedback.
checkpoint:
  task: Complete a sustained project with source comparison, a defended conclusion, and a revised response to critique.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
