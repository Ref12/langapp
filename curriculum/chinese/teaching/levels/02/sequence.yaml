  title: Colors and describing objects
  outcome: Identify a cup, bag, or book by pointing, name six basic colors, describe an object's size, and ask what something is.
  vocabulary:
  - {id: zh-hsk1-00007-s002, ch: 白, pr: bái, ds: white}
  - {id: zh-hsk2-00212-s001, ch: 黑, pr: hēi, ds: black}
  - {id: zh-hsk2-00215-s002, ch: 红, pr: hóng, ds: red}
  - {id: zh-hsk2-00229-s002, ch: 黄, pr: huáng, ds: yellow}
  - {id: zh-hsk2-00322-s002, ch: 蓝, pr: lán, ds: blue}
  - {id: zh-hsk2-00353-s001, ch: 绿, pr: lǜ, ds: green}
  - {id: zh-hsk2-00609-s001, ch: 颜色, pr: yán sè, ds: color}
  - {id: zh-hsk1-00148-s001, ch: 很, pr: hěn, ds: very (degree adverb)}
  - {id: zh-hsk1-00062-s001, ch: 大, pr: dà, ds: big or great}
  - {id: zh-hsk1-00405-s001, ch: 小, pr: xiǎo, ds: small}
  - {id: zh-hsk1-00140-s001, ch: 好, pr: hǎo, ds: good}
  - {id: zh-hsk1-00470-s003, ch: 这, pr: zhè, ds: this or these before a classifier}
  - {id: zh-hsk1-00258-s003, ch: 那, pr: nà, ds: 'that, the or those (specifier)'}
  - {id: zh-hsk1-00331-s001, ch: 什么, pr: shén me, ds: 'what?'}
  - {id: zh-hsk1-00348-s001, ch: 谁, pr: shéi, ds: who}
  - {id: zh-hsk1-00255-s001, ch: 哪儿, pr: nǎ r, ds: 'where?'}
  - {id: zh-hsk1-00016-s011, ch: 包, pr: bāo, ds: bag}
  - {id: zh-hsk1-00088-s002, ch: 东西, pr: dōng xi, ds: thing}
