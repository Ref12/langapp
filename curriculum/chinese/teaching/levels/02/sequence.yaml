  - {id: zh-hsk1-00122-s001, ch: 个, pr: gè, ds: general classifier}
  - {id: zh-hsk1-00217-s001, ch: 两, pr: liǎng, ds: two}
  - {id: zh-hsk1-00340-s001, ch: 是, pr: shì, ds: to be (before noun phrases)}
  - {id: zh-hsk1-00423-s001, ch: 学生, pr: xué sheng, ds: student}
  review_grammar:
  - {id: zh-hsk1-g001, ch: S+是+N, ds: noun-predicate identity}
  - {id: zh-hsk1-g010, ch: Num+Cl+N, ds: counting with classifiers}
