schema_version: 3
id: zh-level-07
title: Travel and arrangements
language: chinese
level_basis: Independent communicative teaching progression. Reference bands are provenance only, not competence or examination claims.
review_policy: Modules span several lessons of about 5-8 new senses. Select relevant earlier and fragile items for retrieval, revisit them on later days, and record the modality and assistance. Inventory coverage is not demonstrated mastery.
kind: level
number: 7
phase: everyday-life
prerequisites:
- zh-level-01
- zh-level-02
- zh-level-03
- zh-level-04
- zh-level-05
- zh-level-06
goals: &id001
- Describe transport and accommodation needs.
- Explain when an activity happened or will happen.
- Compare alternatives after a plan changes.
checkpoint:
  task: Revise a short itinerary after a transport or accommodation change.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
