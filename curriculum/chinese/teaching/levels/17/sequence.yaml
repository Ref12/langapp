schema_version: 3
id: zh-level-17
title: Technology and environment
language: chinese
level_basis: Independent communicative teaching progression. Reference bands are provenance only, not competence or examination claims.
review_policy: Modules span several lessons of about 5-8 new senses. Select relevant earlier and fragile items for retrieval, revisit them on later days, and record the modality and assistance. Inventory coverage is not demonstrated mastery.
kind: level
number: 17
phase: explanation-problems
prerequisites:
- zh-level-01
- zh-level-02
- zh-level-03
- zh-level-04
- zh-level-05
- zh-level-06
- zh-level-07
- zh-level-08
- zh-level-09
- zh-level-10
- zh-level-11
- zh-level-12
- zh-level-13
- zh-level-14
- zh-level-15
- zh-level-16
goals: &id001
- Explain a technology's use and limitations.
- Describe an environmental issue and its consequences.
- Compare possible responses for a general audience.
checkpoint:
  task: Explain a technical or environmental problem without relying on specialist expertise.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
