goals: &id001
- Organize a sustained explanation or proposal.
- Synthesize information from multiple sources.
- Use explicit criteria to compare approaches.
checkpoint:
  task: Produce a structured proposal or presentation that reconciles two partially conflicting sources.
  criteria: *id001
mastery_profile: zh-item-mastery
mastery_target: independent-use
