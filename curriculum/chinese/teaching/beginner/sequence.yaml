schema_version: 1
id: zh-beginner
title: Practical Mandarin beginner
language: chinese
level_basis: Independently authored teaching order for practical communication, not an HSK or exam-level assignment.
review_policy: Each module spans several small lessons; introduce a few senses per session, retrieve earlier material before adding more, and revisit it after about 1, 3, 7, and 14 days, shortening intervals after errors.
units:
- id: first-exchanges
  title: First exchanges and communication repair
  outcome: Greet someone politely, introduce yourself by name and as a student, return a question, and say that you do not understand.
  vocabulary:
  - zh-hsk1-00384-s001 # 我
  - zh-hsk1-00275-s001 # 你
  - zh-hsk1-00278-s001 # 您, polite you
  - zh-hsk1-00140-s009 # 好, greeting after a pronoun
  - zh-hsk1-00176-s005 # 叫, to be called
  - zh-hsk1-00249-s001 # 名字
  - zh-hsk1-00340-s001 # 是, identity before a noun
  - zh-hsk1-00423-s001 # 学生
  - zh-hsk1-00138-s001 # 汉语
  - zh-hsk1-00031-s002 # 不, predicate negation
  - zh-hsk2-00128-s001 # 懂, to understand
  - zh-hsk1-00365-s002 # 听, to listen or hear
