schema_version: 2
id: zh-beginner
title: Practical Mandarin beginner
language: chinese
level_basis: Independently authored teaching order for practical communication, not an HSK or exam-level assignment.
review_policy: Each module spans several small lessons; introduce a few senses per session, retrieve earlier material before adding more, and revisit it after about 1, 3, 7, and 14 days, shortening intervals after errors.
units:
- id: first-exchanges
  title: First exchanges and communication repair
  outcome: Greet someone politely, introduce yourself by name and as a student, return a question, and say that you do not understand.
  vocabulary:
  - {id: zh-hsk1-00384-s001, ch: 我, pr: wǒ, ds: 'I, me, my'}
  - {id: zh-hsk1-00275-s001, ch: 你, pr: nǐ, ds: you}
  - {id: zh-hsk1-00278-s001, ch: 您, pr: nín, ds: you (polite)}
  - {id: zh-hsk1-00140-s009, ch: 好, pr: hǎo, ds: hello (after a pronoun)}
  - {id: zh-hsk1-00176-s005, ch: 叫, pr: jiào, ds: to be called}
  - {id: zh-hsk1-00249-s001, ch: 名字, pr: míng zi, ds: name}
  - {id: zh-hsk1-00340-s001, ch: 是, pr: shì, ds: to be (before noun phrases)}
  - {id: zh-hsk1-00423-s001, ch: 学生, pr: xué sheng, ds: student}
  - {id: zh-hsk1-00138-s001, ch: 汉语, pr: Hàn yǔ, ds: Chinese language}
  - {id: zh-hsk1-00031-s002, ch: 不, pr: bù, ds: (bound form) not}
  - {id: zh-hsk2-00128-s001, ch: 懂, pr: dǒng, ds: to understand}
  - {id: zh-hsk1-00365-s002, ch: 听, pr: tīng, ds: to listen or hear}
  - {id: zh-hsk1-00353-s002, ch: 说, pr: shuō, ds: to speak or say}
  - {id: zh-hsk1-00095-s001, ch: 对不起, pr: duì bu qǐ, ds: I'm sorry}
  - {id: zh-hsk1-00236-s001, ch: 没关系, pr: méi guān xi, ds: it doesn't matter}
  - {id: zh-hsk1-00414-s002, ch: 谢谢, pr: xiè xie, ds: thanks}
  - {id: zh-hsk1-00460-s001, ch: 再见, pr: zài jiàn, ds: goodbye}
  - {id: zh-hsk1-00273-s001, ch: 呢, pr: ne, ds: what-about question particle}
  grammar:
  - {id: zh-hsk1-g001, ch: S+是+N, ds: noun-predicate identity}
  - {id: zh-hsk1-g003, ch: S+不+P, ds: predicate negation}
  - {id: zh-hsk1-g008, ch: N+呢, ds: what about}
  review_vocabulary: []
  review_grammar: []
