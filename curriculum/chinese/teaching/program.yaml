schema_version: 1
id: zh-practical
title: Practical Mandarin
language: chinese
level_basis: Independent communicative teaching progression. Reference bands are provenance only, not competence or examination claims.
module_size: 25
review_policy: Modules span several lessons of about 5-8 new senses. Select relevant earlier and fragile items for retrieval, revisit them on later days, and record the modality and assistance. Inventory coverage is not demonstrated mastery.
phases:
- {id: first-exchanges, title: First exchanges, levels: [1, 2, 3, 4], target_new_headwords: 200}
- {id: everyday-life, title: Everyday life, levels: [5, 6, 7, 8], target_new_headwords: 500}
- {id: stories-conversations, title: Stories and conversations, levels: [9, 10, 11, 12, 13], target_new_headwords: 800}
- {id: explanation-problems, title: Explanation and problem-solving, levels: [14, 15, 16, 17, 18], target_new_headwords: 1100}
- {id: analysis-argument, title: Analysis and argument, levels: [19, 20, 21, 22, 23, 24], target_new_headwords: 1400}
- {id: nuance-interpretation, title: Nuance and interpretation, levels: [25, 26, 27, 28, 29, 30], target_new_headwords: 1800}
levels:
- number: 1
  title: First contact
  goals: [Introduce yourself and repair a misunderstanding., Request a familiar drink politely., Ask about a small quantity or price.]
  checkpoint: Complete a short introduction and purchase with an unfamiliar partner and a changed quantity.
- number: 2
  title: People, belongings, and places
  goals: [Identify objects by color and size., Describe people and their belongings., Ask where a person or place is.]
  checkpoint: Identify a missing object and explain whose it is and where it might be.
- number: 3
  title: Daily activities
  goals: [Describe a daily schedule., Discuss interests and learned abilities., Choose food and clarify a purchase.]
  checkpoint: Arrange an activity and a meal using a new combination of times and preferences.
- number: 4
  title: Getting help and making plans
  goals: [Ask for directions and explain a destination., Request help or permission., Agree on a simple meeting plan.]
  checkpoint: Resolve a short travel or scheduling problem without an item-specific answer model.
- number: 5
  title: Home and personal life
  goals: [Describe a home and its contents., Explain clothing and personal needs., Coordinate familiar household activities.]
  checkpoint: Explain a household need and negotiate a practical arrangement with a housemate.
- number: 6
  title: Everyday transactions and care
  goals: [Handle ordinary shopping and services., Discuss meals and ingredients., Describe a common symptom or care need.]
  checkpoint: Explain a service or purchase problem and answer clarification questions.
- number: 7
  title: Travel and arrangements
  goals: [Describe transport and accommodation needs., Explain when an activity happened or will happen., Compare alternatives after a plan changes.]
  checkpoint: Revise a short itinerary after a transport or accommodation change.
- number: 8
  title: Work, study, and social life
  goals: [Describe a work or study routine., Arrange a shared activity., Explain familiar preferences and experiences.]
  checkpoint: Coordinate a shared task or invitation while accommodating another person's constraints.
- number: 9
  title: Relating events
  goals: [Sequence events with background detail., Distinguish an attempt from its result., Explain a straightforward consequence.]
  checkpoint: Recount an unfamiliar picture sequence and answer questions about what changed.
- number: 10
  title: Feelings and relationships
  goals: [Explain feelings and interpersonal concerns., Describe relationships and personal changes., Respond to another person's point of view.]
  checkpoint: Discuss a fictional misunderstanding and propose a considerate response.
- number: 11
  title: Processes and instructions
  goals: [Explain a multi-step process., Describe how a result was achieved., Clarify a failed attempt or unexpected outcome.]
  checkpoint: Explain an ordinary procedure to someone who encounters a new problem halfway through.
- number: 12
  title: Sharing connected information
  goals: [Summarize a familiar source., Exchange information about learning and community life., Clarify a message or practical procedure.]
  checkpoint: Relay the useful information from a short notice or account and resolve follow-up questions.
- number: 13
  title: Opinions and choices
  goals: [Support a preference with reasons., Compare plausible alternatives., Qualify an opinion and respond to disagreement.]
  checkpoint: Recommend an option while acknowledging a disadvantage and another person's preference.
- number: 14
  title: Unfamiliar everyday problems
  goals: [Explain a less predictable problem., Clarify requirements and constraints., Negotiate a workable response.]
  checkpoint: Resolve a simulated service, housing, or travel problem with incomplete initial information.
- number: 15
  title: Work and cooperation
  goals: [Explain responsibilities and professional goals., Describe an organizational workflow., Resolve a coordination problem constructively.]
  checkpoint: Present a task update and renegotiate responsibilities after a change.
- number: 16
  title: News and society
  goals: [Summarize a general-interest report., Distinguish events from a source's opinion., Explain how an issue affects different people.]
  checkpoint: Compare two short reports on the same event and explain what each emphasizes.
- number: 17
  title: Technology and environment
  goals: [Explain a technology's use and limitations., Describe an environmental issue and its consequences., Compare possible responses for a general audience.]
  checkpoint: Explain a technical or environmental problem without relying on specialist expertise.
- number: 18
  title: Presenting and negotiating
  goals: [Deliver a structured explanation., Clarify competing needs and propose a compromise., Respond to unanticipated follow-up questions.]
  checkpoint: Present a proposal and revise it in response to objections and newly revealed constraints.
- number: 19
  title: Evidence and explanations
  goals: [Explain what supports a claim., Distinguish observation from inference., Identify uncertainty and limitations.]
  checkpoint: Evaluate a short argument and explain which conclusion its evidence actually supports.
- number: 20
  title: Economics and institutions
  goals: [Explain a public or economic process., Compare stated aims with practical consequences., Discuss different stakeholders without assuming professional expertise.]
  checkpoint: Explain a policy or market change and compare two plausible effects.
- number: 21
  title: Science and long-term change
  goals: [Explain a general-audience scientific account., Compare explanations for a long-term change., Keep method and conclusion distinct.]
  checkpoint: Summarize an explanatory source and identify an unanswered question or limitation.
- number: 22
  title: Ethics and perspectives
  goals: [Explain a conflict between values., Compare cultural or personal perspectives., Avoid overgeneralizing from an individual example.]
  checkpoint: Discuss a dilemma while fairly representing two competing considerations.
- number: 23
  title: Qualified argument
  goals: [Build a supported argument., Anticipate objections and qualify claims., Explain tradeoffs under uncertainty.]
  checkpoint: Defend a recommendation and revise its scope when counterevidence is introduced.
- number: 24
  title: Formal synthesis
  goals: [Organize a sustained explanation or proposal., Synthesize information from multiple sources., Use explicit criteria to compare approaches.]
  checkpoint: Produce a structured proposal or presentation that reconciles two partially conflicting sources.
- number: 25
  title: Stance and implication
  goals: [Distinguish literal content from implied stance., Express different degrees of commitment., Explain how context changes an interpretation.]
  checkpoint: Compare plausible interpretations of an indirect message and justify the most suitable reading.
- number: 26
  title: Tone and register
  goals: [Adapt wording to an audience and relationship., Distinguish formal and conversational alternatives., Preserve meaning while changing tone.]
  checkpoint: Recast the same request or disagreement for two different audiences.
- number: 27
  title: Imagery and idiomatic expression
  goals: [Interpret commonly encountered figurative language., Explain imagery in ordinary language., Use an idiomatic expression only where its register and meaning fit.]
  checkpoint: Interpret a figurative passage and distinguish its effect from a literal paraphrase.
- number: 28
  title: Precision and abstraction
  goals: [Choose words that preserve subtle distinctions., Discuss relationships among abstract ideas., Qualify descriptions of degree and consequence.]
  checkpoint: Revise an imprecise explanation and justify the changes in meaning.
- number: 29
  title: Critical interpretation
  goals: [Support an interpretation with textual evidence., Compare alternative readings and assumptions., Evaluate a work or argument using explicit criteria.]
  checkpoint: Present and defend an interpretation while acknowledging a credible alternative.
- number: 30
  title: Extended independent projects
  goals: [Synthesize demanding material for a chosen audience., Sustain a discussion or extended written project., Reflect on uncertainty and revise after substantive feedback.]
  checkpoint: Complete a sustained project with source comparison, a defended conclusion, and a revised response to critique.
topics:
  people: {title: People and relationships, task: Describe people and relationships and respond to another person's perspective.}
  home: {title: Home and daily life, task: Explain needs and arrangements in a home or familiar daily setting.}
  clothing: {title: Clothing and appearance, task: Describe appearance and compare suitable choices for a context.}
  food: {title: Food and meals, task: Discuss ingredients and preferences and clarify a food-related request.}
  health: {title: Body and wellbeing, task: Explain a health-related experience or need without claiming clinical expertise.}
  travel: {title: Travel and transport, task: Explain a journey and negotiate a transport or accommodation arrangement.}
  services: {title: Services and transactions, task: Clarify requirements and resolve an ordinary transaction or service problem.}
  leisure: {title: Leisure and sport, task: Discuss an activity and explain participation or preferences.}
  learning: {title: Learning and education, task: Explain a learning experience or approach and respond to questions.}
  work: {title: Work and cooperation, task: Explain responsibilities and coordinate a shared task.}
  money: {title: Money and commerce, task: Explain a commercial choice or process and its practical implications.}
  communication: {title: Communication and information, task: Convey relevant information and repair ambiguity or misunderstanding.}
  time: {title: Time and events, task: Relate events and clarify their sequence and circumstances.}
  actions: {title: Actions and processes, task: Explain an action or process and distinguish intention from result.}
  description: {title: Description and comparison, task: Choose precise descriptions and explain meaningful differences.}
  feelings: {title: Feelings and attitudes, task: Explain an attitude or emotional response with appropriate context.}
  reasoning: {title: Reasons and connections, task: Explain a relationship between ideas and qualify the conclusion.}
  grammar: {title: Sentence construction, task: Use the selected constructions to communicate a new meaning and explain a relevant contrast.}
  society: {title: Society and community, task: Explain a social issue and compare different people's experiences.}
  institutions: {title: Institutions and public life, task: Explain an institutional process and distinguish its purpose from its effects.}
  media: {title: Media and sources, task: 'Summarize a source while distinguishing events, claims, and interpretation.'}
  technology: {title: Technology and systems, task: Explain a system or technical issue with explicit scope and limitations.}
  nature: {title: Nature and environment, task: Describe the natural world and explain a relevant change or relationship.}
  science: {title: Science and investigation, task: Interpret an explanatory account and distinguish observation from conclusion.}
  history: {title: History and change, task: Relate a development and explain its significance in context.}
  culture: {title: Culture and customs, task: Explain a cultural practice without turning a local example into a universal claim.}
  arts: {title: Arts and creative works, task: Discuss a work and support an interpretation with specific details.}
  argument: {title: Argument and decisions, task: Defend a position while addressing relevant qualifications or objections.}
  register: {title: Register and nuance, task: Adapt an expression to audience and context and explain its implied stance.}
  literature: {title: Literary and historical expression, task: Interpret the selected expressions in source context and paraphrase them in ordinary language.}
extensions:
- {id: professional, title: Professional and organizational language, after_level: 18, mastery_target: independent-use, description: 'Optional workplace and organizational language, not a professional qualification.'}
- {id: technical, title: Digital and technical terminology, after_level: 18, mastery_target: understand, description: 'Optional terminology for interpreting technical sources, not evidence of engineering competence.'}
- {id: scientific, title: Scientific terminology, after_level: 24, mastery_target: understand, description: 'Optional scientific and natural-world terminology, not scientific or clinical qualification.'}
- {id: literary, title: Literary and historical language, after_level: 24, mastery_target: understand, description: 'Optional contextual reading of literary and older usages, not ordinary modern speech requirements.'}
