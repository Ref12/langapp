- id: zh-hsk2-g001
  pattern: verb + 了 + object
  english: a completed event
  note: Perfective aspect marks an event boundary, not an English past tense in every context.
  examples:
  - target: 我买了一本书。
    english: I bought a book.
  - target: 她喝了两杯茶。
    english: She drank two cups of tea.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g002
  pattern: new situation + 了
  english: a situation has changed
  note: Sentence-final aspect highlights a current change; distinguish it from completed action.
  examples:
  - target: 天黑了。
    english: It has become dark.
  - target: 我不喝咖啡了。
    english: I no longer drink coffee.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g003
  pattern: 没 + verb
  english: an event did not happen
  note: Use for negating a completed event; normally omit the perfective suffix.
  examples:
  - target: 昨天我没去学校。
    english: I did not go to school yesterday.
  - target: 她没买那件衣服。
    english: She did not buy that item of clothing.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g004
  pattern: 正在 + verb + 呢
  english: an action is happening right now
  note: The final particle is optional; use with ongoing activities rather than static possession.
  examples:
  - target: 我正在做饭呢。
    english: I am cooking right now.
  - target: 他们正在上课。
    english: They are having a lesson right now.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g005
  pattern: verb + 过
  english: having had an experience
  note: Experiential aspect asks whether an event has occurred before, not about one scheduled event.
  examples:
  - target: 我去过北京。
    english: I have been to Beijing.
  - target: 你吃过这个菜吗？
    english: Have you ever eaten this dish?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g006
  pattern: 还没 + verb + 呢
  english: not having done something yet
  note: This frames noncompletion relative to an expected event.
  examples:
  - target: 我还没吃饭呢。
    english: I have not eaten yet.
  - target: 她还没回来。
    english: She has not come back yet.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g007
  pattern: 要 / 快要 + verb + 了
  english: something is about to happen
  note: Imminence is not the same as a distant plan; explicit time works naturally with the first form.
  examples:
  - target: 快要下雨了。
    english: It is about to rain.
  - target: 火车要开了。
    english: The train is about to depart.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g008
  pattern: 先…再…
  english: first do one thing, then another
  note: Sequence planned actions; the later event need not already have occurred.
  examples:
  - target: 先洗手，再吃饭。
    english: Wash your hands first, then eat.
  - target: 我先看书，再写字。
    english: I will read first, then write.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g009
  pattern: 一边…一边…
  english: doing two things at the same time
  note: Choose activities that can realistically overlap.
  examples:
  - target: 他一边走路，一边听音乐。
    english: He listens to music while walking.
  - target: 我们一边吃饭，一边聊天。
    english: We chat while eating.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g010
  pattern: 因为…所以…
  english: because of one thing, therefore another
  note: Both connectors can appear; in English normally translate with only one causal connector.
  examples:
  - target: 因为下雨，所以我没去。
    english: I did not go because it was raining.
  - target: 因为他很忙，所以没来。
    english: He did not come because he was busy.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g011
  pattern: 虽然…但是…
  english: although one thing is true, another contrasts
  note: Present an acknowledged condition followed by a contrast.
  examples:
  - target: 虽然很冷，但是我想出去。
    english: Although it is cold, I want to go out.
  - target: 虽然这本书很长，但是很好看。
    english: Although this book is long, it is a good read.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g012
  pattern: 如果…就…
  english: if a condition holds, a result follows
  note: Use hypothetical situations; do not treat the second connector as an automatic future marker.
  examples:
  - target: 如果明天下雨，我就不去。
    english: If it rains tomorrow, I will not go.
  - target: 如果你有时间，就来我家吧。
    english: If you have time, come to my home.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g013
  pattern: A + 比 + B + adjective
  english: A is more adjective than B
  note: The comparison adjective does not ordinarily take the neutral degree adverb used in simple predicates.
  examples:
  - target: 今天比昨天热。
    english: Today is hotter than yesterday.
  - target: 姐姐比我高。
    english: My older sister is taller than I am.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g014
  pattern: A + 没有 + B + adjective
  english: A is not as adjective as B
  note: Negate a comparison without implying the absolute opposite adjective.
  examples:
  - target: 我没有他高。
    english: I am not as tall as he is.
  - target: 这本书没有那本贵。
    english: This book is not as expensive as that one.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g015
  pattern: 最 + adjective
  english: the most adjective
  note: Establish the comparison set in context.
  examples:
  - target: 这三个苹果，哪个最大？
    english: Which of these three apples is the biggest?
  - target: 我最喜欢这个颜色。
    english: I like this color best.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g016
  pattern: 有点儿 + adjective
  english: somewhat adjective, often undesirably
  note: This often signals a mild complaint; distinguish it from a quantity after a verb.
  examples:
  - target: 今天有点儿冷。
    english: It is a little cold today.
  - target: 这件衣服有点儿贵。
    english: This item of clothing is a little expensive.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g017
  pattern: adjective + 一点儿
  english: a little more adjective
  note: Often used in requests and comparisons; the degree phrase follows the adjective.
  examples:
  - target: 请说慢一点儿。
    english: Please speak a little more slowly.
  - target: 我想买大一点儿的。
    english: I want to buy a slightly bigger one.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g018
  pattern: verb + 得 + degree description
  english: doing something in a particular manner or degree
  note: With an object, repeat or topicalize the verb as needed; do not confuse with ability.
  examples:
  - target: 他说得很快。
    english: He speaks very quickly.
  - target: 她唱歌唱得很好。
    english: She sings very well.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g019
  pattern: verb + 完
  english: finish doing something
  note: A result complement follows the action; negated completion differs from not starting.
  examples:
  - target: 我看完这本书了。
    english: I have finished reading this book.
  - target: 你写完了吗？
    english: Have you finished writing?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g020
  pattern: verb + 到
  english: successfully attain the result of an action
  note: The complement marks attainment, not merely making an attempt.
  examples:
  - target: 我买到票了。
    english: I managed to buy a ticket.
  - target: 你听到那个声音了吗？
    english: Did you hear that sound?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g021
  pattern: verb + 来 / 去
  english: motion toward / away from the reference point
  note: Choose the deictic center; direction depends on the speaker or narrative perspective.
  examples:
  - target: 请进来。
    english: Please come in.
  - target: 他走出去了。
    english: He walked out away from here.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g022
  pattern: 离 + place + distance description
  english: distance from a reference place
  note: Use for spatial distance, not departure from somewhere.
  examples:
  - target: 我家离学校很近。
    english: My home is very close to the school.
  - target: 这里离车站有多远？
    english: How far is it from here to the station?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g023
  pattern: 从…到…
  english: from one endpoint to another
  note: Use spatial or temporal endpoints consistently.
  examples:
  - target: 从我家到学校要十分钟。
    english: It takes ten minutes from my home to the school.
  - target: 我从九点工作到五点。
    english: I work from nine to five.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g024
  pattern: 给 + person + verb
  english: do something for or to a person
  note: The recipient phrase precedes the action; some verbs permit a postverbal recipient.
  examples:
  - target: 我给妈妈打电话。
    english: I call my mother.
  - target: 她给我买了一本书。
    english: She bought me a book.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
- id: zh-hsk2-g025
  pattern: 可以 / 能 + verb
  english: may do something / can do something under the circumstances
  note: Contrast permission with situational ability; context can allow overlap.
  examples:
  - target: 这里可以坐吗？
    english: May I sit here?
  - target: 我今天不能来。
    english: I cannot come today.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 2; not official grammar mapping
