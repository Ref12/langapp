- id: zh-hsk6-g001
  pattern: 尚且…何况…
  english: if even one case holds, how much more another
  note: Use an a-fortiori inference with an ordered comparison, not arbitrary contrast.
  examples:
  - target: 专家尚且会出错，何况初学者呢？
    english: Even experts make mistakes, let alone beginners.
  - target: 大人尚且觉得难，何况孩子呢？
    english: Even adults find it difficult, let alone children.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g002
  pattern: 与其说…不如说…
  english: it is more accurate to say one thing than another
  note: Reclassify an interpretation rather than simply choose an action.
  examples:
  - target: 与其说他生气，不如说他失望。
    english: It is more accurate to say he is disappointed than angry.
  - target: 与其说这是失败，不如说是一次试验。
    english: This is better described as an experiment than a failure.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g003
  pattern: 非…不可
  english: must do something; absolutely necessary
  note: This emphatic double-negative construction can sound insistent.
  examples:
  - target: 这个问题非解决不可。
    english: This problem absolutely must be solved.
  - target: 你为什么非今天走不可？
    english: Why must you leave today?
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g004
  pattern: 不…则…
  english: if not one course, then another follows
  note: A compact formal conditional; retain the logical dependency.
  examples:
  - target: 不提前准备，则容易出错。
    english: Without advance preparation, mistakes are likely.
  - target: 不及时处理，则会影响进度。
    english: If it is not handled promptly, progress will be affected.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g005
  pattern: 倘若…便…
  english: if hypothetically, then
  note: A relatively literary conditional; do not inflate certainty in translation.
  examples:
  - target: 倘若条件允许，我们便扩大试点。
    english: If conditions permit, we will expand the pilot.
  - target: 倘若他不同意，计划便难以实施。
    english: If he does not agree, the plan will be difficult to implement.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g006
  pattern: 尽可能 / 尽量 + verb
  english: as much as possible; to the extent practical
  note: These express effort within constraints, not guaranteed maximal success.
  examples:
  - target: 请尽可能提供具体信息。
    english: Please provide information that is as specific as possible.
  - target: 我们尽量减少对环境的影响。
    english: We try to minimize the impact on the environment.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g007
  pattern: 不免 / 难免…
  english: cannot help but; it is hard to avoid
  note: Distinguish an understandable reaction from an objectively difficult-to-avoid event.
  examples:
  - target: 第一次演讲，他不免紧张。
    english: He could not help feeling nervous giving his first speech.
  - target: 刚开始难免出错。
    english: Mistakes are hard to avoid at the beginning.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g008
  pattern: 未必… / 不见得…
  english: not necessarily; it may not be so
  note: Deny certainty rather than assert the opposite proposition.
  examples:
  - target: 贵的东西未必适合你。
    english: Expensive things are not necessarily suitable for you.
  - target: 他说得快，不见得说得清楚。
    english: Speaking quickly does not necessarily mean he speaks clearly.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g009
  pattern: 固然…但…
  english: admittedly one thing is true, but
  note: A formal concession acknowledges a point before limiting its relevance.
  examples:
  - target: 速度固然重要，但质量更重要。
    english: Speed is admittedly important, but quality matters more.
  - target: 这种办法固然方便，但成本较高。
    english: This method is convenient, admittedly, but relatively costly.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g010
  pattern: 无非是…
  english: it is nothing more than
  note: Restrict an explanation; often downplays complexity or significance.
  examples:
  - target: 他的目的无非是把事情做好。
    english: His aim is nothing more than to do the job well.
  - target: 差别无非是时间长短。
    english: The difference is merely the length of time.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g011
  pattern: 未尝不…
  english: it is not necessarily unwise or impossible to; indeed may
  note: A cautious double negative opens a possibility; avoid translating as never.
  examples:
  - target: 这未尝不是一个机会。
    english: This may well be an opportunity.
  - target: 换个角度看，未尝不可。
    english: It may be worth looking at it from another angle.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g012
  pattern: 之所以…是因为…
  english: the reason something is so is that
  note: Foreground an outcome and then explain its cause.
  examples:
  - target: 他之所以改变计划，是因为条件变了。
    english: He changed the plan because the conditions changed.
  - target: 这里之所以受欢迎，是因为交通方便。
    english: This place is popular because transportation is convenient.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g013
  pattern: 既…也…更…
  english: both one point and another, and even more importantly a third
  note: Build a parallel hierarchy with compatible predicates.
  examples:
  - target: 学习既需要耐心，也需要方法，更需要坚持。
    english: Learning requires patience and method, and above all persistence.
  - target: 这个项目既有机会，也有风险，更有责任。
    english: This project involves opportunity and risk, and above all responsibility.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g014
  pattern: 不是…就是…
  english: either one case or the other
  note: Usually presents a limited set of likely alternatives; distinguish corrective contrast.
  examples:
  - target: 他周末不是看书，就是去散步。
    english: On weekends he either reads or goes for a walk.
  - target: 钥匙不是在桌上，就是在包里。
    english: The keys are either on the table or in the bag.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g015
  pattern: 动不动就…
  english: do something all too readily or frequently
  note: Often conveys disapproval; not a neutral frequency expression.
  examples:
  - target: 他动不动就改计划。
    english: He changes the plan at the slightest prompting.
  - target: 这台机器动不动就出问题。
    english: This machine develops problems all the time.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g016
  pattern: 一味地…
  english: blindly or indiscriminately persist in something
  note: This adverb normally evaluates excessive one-sided behavior negatively.
  examples:
  - target: 不能一味地追求速度。
    english: We must not pursue speed blindly.
  - target: 她没有一味地责怪别人。
    english: She did not simply keep blaming others.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g017
  pattern: 就…而言 / 就…来说
  english: with respect to a specified dimension
  note: Explicitly scope an evaluation so that it does not become an absolute claim.
  examples:
  - target: 就成本而言，这个方案更好。
    english: In terms of cost, this proposal is better.
  - target: 就目前情况来说，还不能下结论。
    english: Given the current situation, we cannot yet draw a conclusion.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g018
  pattern: 从…来看
  english: judging from an evidence source or perspective
  note: The conclusion is bounded by the evidence named.
  examples:
  - target: 从数据来看，需求正在增加。
    english: Judging from the data, demand is increasing.
  - target: 从他的反应来看，他并不知情。
    english: Judging from his reaction, he was unaware of it.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g019
  pattern: 以至于…
  english: to the extent that a consequence follows
  note: Introduce an actual degree-related result; it often exceeds expectations.
  examples:
  - target: 他投入得太深，以至于忘了时间。
    english: He became so absorbed that he forgot the time.
  - target: 道路堵塞，以至于救援延迟了。
    english: The roads were blocked to such an extent that assistance was delayed.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g020
  pattern: 以便…
  english: so that a desired next action is possible
  note: Express facilitative purpose rather than actual consequence.
  examples:
  - target: 请留下联系方式，以便我们通知您。
    english: Please leave contact details so that we can notify you.
  - target: 先整理材料，以便讨论。
    english: Organize the materials first to facilitate discussion.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g021
  pattern: 非但…反而…
  english: not only did an expected thing fail, the opposite happened
  note: Use in a reversal; negative wording must match the intended polarity.
  examples:
  - target: 问题非但没有减少，反而增加了。
    english: The problems did not decrease; instead, they increased.
  - target: 他非但不反对，反而支持。
    english: He not only does not oppose it; he supports it.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g022
  pattern: 一来…二来…
  english: for one reason, and for another
  note: Enumerate two grounds for the same decision.
  examples:
  - target: 我不去，一来太远，二来没时间。
    english: 'I am not going: first it is too far, and second I have no time.'
  - target: 选择这里，一来交通方便，二来环境安静。
    english: We chose this place because transport is convenient and the environment is quiet.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g023
  pattern: 要不是…就…
  english: if it had not been for something, a different outcome would follow
  note: A counterfactual relies on an actual intervening condition.
  examples:
  - target: 要不是你提醒，我就忘了。
    english: If you had not reminded me, I would have forgotten.
  - target: 要不是下雨，我们就出发了。
    english: If it had not rained, we would have set out.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g024
  pattern: 被认为 / 被视为…
  english: be considered / be regarded as
  note: Attribute a classification rather than asserting objective truth; identify the judging group when
    relevant.
  examples:
  - target: 这个发现被认为很重要。
    english: This discovery is considered important.
  - target: 这次合作被视为新的起点。
    english: This cooperation is regarded as a new starting point.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
- id: zh-hsk6-g025
  pattern: 据… / 据说…
  english: according to a source / it is said that
  note: Distinguish attributable evidence from hearsay; never invent a source.
  examples:
  - target: 据报告，参与人数增加了。
    english: According to the report, participation increased.
  - target: 据说那家书店下周开门。
    english: It is said that that bookshop will open next week.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 6; not official grammar mapping
