- id: zh-hsk3-g001
  pattern: 把 + definite object + verb + result
  english: do something that affects a known object
  note: The object must be identifiable; a bare unbounded verb is usually insufficient.
  examples:
  - target: 请把门关上。
    english: Please close the door.
  - target: 我把作业写完了。
    english: I finished the homework.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g002
  pattern: 被 + agent + verb + result
  english: be affected by an action performed by an agent
  note: The agent may be omitted; provide an actual event or result rather than a bare verb.
  examples:
  - target: 我的杯子被他打破了。
    english: My cup was broken by him.
  - target: 自行车被偷走了。
    english: The bicycle was stolen.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g003
  pattern: verb + 着
  english: a continuing state or accompanying posture
  note: Distinguish maintained state from an activity currently in progress.
  examples:
  - target: 门开着。
    english: The door is open.
  - target: 她拿着一本书。
    english: She is holding a book.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g004
  pattern: verb + 得 / 不 + result complement
  english: be able / unable to achieve a result
  note: This is potential complement structure, distinct from describing performance quality.
  examples:
  - target: 我听得懂。
    english: I can understand what I hear.
  - target: 这个字太小，我看不清楚。
    english: This character is too small; I cannot see it clearly.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g005
  pattern: verb + 起来
  english: an action begins or moves upward
  note: Teach literal rising before extended onset meanings.
  examples:
  - target: 他站起来了。
    english: He stood up.
  - target: 孩子们笑起来了。
    english: The children started laughing.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g006
  pattern: verb + 下去
  english: continue an action onward
  note: A continuation complement can also express literal downward movement in other contexts.
  examples:
  - target: 请继续说下去。
    english: Please keep talking.
  - target: 这本书很有意思，我想读下去。
    english: This book is interesting; I want to keep reading.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g007
  pattern: 越来越 + adjective
  english: becoming more and more adjective
  note: Describe a developing trend without a separate comparison target.
  examples:
  - target: 天气越来越热了。
    english: The weather is getting hotter and hotter.
  - target: 他的汉语越来越好了。
    english: His Chinese is getting better and better.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g008
  pattern: 越…越…
  english: the more one condition changes, the more another does
  note: The two clauses covary; keep cause and comparison direction clear.
  examples:
  - target: 越练习，就越熟悉。
    english: The more you practice, the more familiar it becomes.
  - target: 这本书越看越有意思。
    english: This book becomes more interesting the more I read it.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g009
  pattern: 又…又…
  english: both one quality and another
  note: Coordinate compatible qualities rather than alternative choices.
  examples:
  - target: 这个房间又大又亮。
    english: This room is both large and bright.
  - target: 她又会唱歌，又会跳舞。
    english: She can both sing and dance.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g010
  pattern: 除了…以外，还…
  english: besides something, additionally something else
  note: Inclusive addition differs from an exception followed by an all-others statement.
  examples:
  - target: 除了汉语以外，我还学英语。
    english: Besides Chinese, I also study English.
  - target: 除了书以外，他还买了笔。
    english: Besides books, he also bought pens.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g011
  pattern: 只有…才…
  english: only if a necessary condition holds can a result occur
  note: A necessary condition is not automatically sufficient.
  examples:
  - target: 只有多练习，才能说得流利。
    english: Only with plenty of practice can you speak fluently.
  - target: 只有会员才能进入。
    english: Only members can enter.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g012
  pattern: 只要…就…
  english: as long as a sufficient condition holds, a result follows
  note: Contrast sufficient conditions with necessary conditions.
  examples:
  - target: 只要有时间，我就去看你。
    english: As long as I have time, I will visit you.
  - target: 只要按时出发，就不会迟到。
    english: As long as we leave on time, we will not be late.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g013
  pattern: 一…就…
  english: as soon as one event occurs, another follows
  note: Use for immediate sequences or habitual triggers.
  examples:
  - target: 我一到家就给你打电话。
    english: I will call you as soon as I get home.
  - target: 他一听到音乐就笑了。
    english: He smiled as soon as he heard the music.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g014
  pattern: 是…的 for circumstances
  english: highlighting when, where or how a known event occurred
  note: The occurrence is already established; focus on a circumstance rather than narrating a new event.
  examples:
  - target: 我是坐火车来的。
    english: I came by train.
  - target: 这本书是昨天买的。
    english: This book was bought yesterday.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g015
  pattern: 连…都 / 也…
  english: even an unexpected case has this property
  note: Choose a genuinely surprising extreme in the implied scale.
  examples:
  - target: 他连星期天都工作。
    english: He even works on Sundays.
  - target: 这么简单的题，连孩子也会做。
    english: Even a child can solve such a simple problem.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g016
  pattern: 一点儿 / 一个…也不 / 没…
  english: not at all / not even one
  note: The negative quantifier construction emphasizes zero quantity.
  examples:
  - target: 我一点儿也不累。
    english: I am not tired at all.
  - target: 今天一个客人也没来。
    english: Not a single guest came today.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g017
  pattern: 还是 / 或者
  english: or in a choice question / or in a statement
  note: Select the connector according to clause function, not English spelling alone.
  examples:
  - target: 你喝茶还是喝水？
    english: Will you have tea or water?
  - target: 周末我看书或者听音乐。
    english: On weekends I read or listen to music.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g018
  pattern: 应该 + verb
  english: should do something
  note: Express advice or expectation; do not equate it with guaranteed fact.
  examples:
  - target: 你应该早点休息。
    english: You should rest earlier.
  - target: 现在他应该到家了。
    english: He should be home by now.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g019
  pattern: 得 + verb
  english: have to do something
  note: This is the stressed obligation reading meaning 'have to', not the neutral-tone particle that
    links a verb to a complement.
  examples:
  - target: 我得走了。
    english: I have to leave now.
  - target: 明天得早点起床。
    english: We have to get up early tomorrow.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g020
  pattern: 让 + person + verb
  english: let or have someone do something
  note: The causative can express permission or a requested action; infer force from context.
  examples:
  - target: 老师让我们读课文。
    english: The teacher asked us to read the text.
  - target: 请让我试一试。
    english: Please let me try.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g021
  pattern: 对 + person or matter + attitude
  english: an attitude toward someone or something
  note: Place the target before an attitude or evaluation predicate.
  examples:
  - target: 我对音乐很感兴趣。
    english: I am very interested in music.
  - target: 他对朋友很好。
    english: He treats his friends very well.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g022
  pattern: 跟…一样 / 不一样
  english: the same as / different from something
  note: Name the comparison target and optionally specify the shared property.
  examples:
  - target: 我的书跟你的一样。
    english: My book is the same as yours.
  - target: 这里的天气跟我家乡不一样。
    english: The weather here is different from that in my hometown.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g023
  pattern: verb + 了 + duration + object
  english: spending a length of time doing something
  note: Duration follows the verb; distinguish elapsed activity from a clock time.
  examples:
  - target: 我学了三年汉语。
    english: I studied Chinese for three years.
  - target: 他等了半个小时。
    english: He waited for half an hour.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g024
  pattern: verb + 了 / 过 + (object) + number + 次
  english: having done something a certain number of times
  note: The aspect marker can indicate a completed event or experience; an object may intervene before
    the action count or be topicalized. The counter counts occurrences, not objects.
  examples:
  - target: 我去过那家店三次。
    english: I have been to that shop three times.
  - target: 这句话他读了两次。
    english: He read this sentence twice.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
- id: zh-hsk3-g025
  pattern: question word + 都…
  english: every possible member, place or option
  note: A question word can have universal rather than interrogative force with the right context.
  examples:
  - target: 这里的书我都喜欢，哪本都想看。
    english: I like all the books here; I want to read every one.
  - target: 谁都可以参加。
    english: Anyone can participate.
  source_id: original-zh
  level_basis: Original teaching selection for 2021-framework band 3; not official grammar mapping
