# HSK 5 additions to the v2 Chinese curriculum; not a cumulative standalone list.
# 2227 incremental senses after grammar/example-prerequisite additions and earlier moves.
# Baseline: 2218 senses, 2155 for numbered rows 2001-3600, then
# 63 new uses on 38 earlier rows. All 1600 new numbered rows are represented.
# Basis: November 2025 HSK exam syllabus, effective July 2026, not GF0025-2021.
# Numbered rows, written forms and selected senses are different counts.
# Parenthesized levels bind to the corresponding POS: later senses are excluded.
# Homograph numerals govern selection, but are not part of the Chinese spelling.
# English descriptions are an AI-assisted curated editorial draft, not an
# official sense list, independent human review, or a claim of exam readiness.
# Earlier-level senses are not repeated; shared authoring labels are unique.
# 客服 is curated as a noun; printed 形 (adjective) remains an unresolved
# syllabus POS discrepancy, not a reason to invent an adjective gloss.
# No lessons, grammar inventory, assessments or app wiring are added here.
#
# Fields: id/ch/pr/ds/lb = stable sense reference, simplified Chinese, citation
# pinyin, concise English description, human-readable authoring label.
# Labels: numbered citation tones, 5 = neutral, v = ü, r5 = erhua; no sandhi.
# Existing canonical IDs and matching established labels are retained.
# Their hskN prefixes identify old source inventories, not this exam level.
# 69 genuinely missing senses have original definitions and reserved IDs
# zh-hsk2026-ROW-s501..s599; unrelated source meanings are never repurposed.
# Pinyin follows the syllabus citation form; 一/不 sandhi is not encoded.
# 要不是 retains lexical neutral bu. Eleven dictionary neutral/full-tone
# variants now follow the syllabus; original readings are recorded in the
# review manifest. Formatting repairs to 没法儿 and 欧洲, and the 下载
# xià zài correction, preserve the matching canonical sense IDs.
#
# Exam reference: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
