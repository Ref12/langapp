- id: zh-hsk2026-g937
  pt: <preventive action>，以防 + <possible danger>
  pr: <preventive action>, yǐ fáng + <possible danger>
  ds: A precaution against a possible danger.
  lb: vp-yi3-fang2-risk--prevent

- id: zh-hsk2026-g1026
  pt: <means action>，以 + <intended result>
  pr: <means action>, yǐ + <intended result>
  ds: Formal purpose of the preceding action, not an actual-result assertion.
  lb: vp-yi3-result--purpose

- id: zh-hsk2026-g920
  pt: 万万 + <negative predicate>
  pr: wàn wàn + <negative predicate>
  ds: Strong emphatic negation; typically 不, 没 or 不可 follows.
  lb: wan4-wan4-pred--absolutely

- id: zh-hsk2026-g850
