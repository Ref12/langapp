  lb: yi1-lai2-a-er4-lai2-b-san1-lai2-c--reasons

- id: zh-hsk2026-g866
  pt: 一连 + <span> + <verb phrase>
  pr: yī lián + <span> + <verb phrase>
  ds: A continuous run across the stated time or count.
  lb: yi1-lian2-span-vp--in-row

- id: zh-hsk2026-g933
  pt: 依 + <rule> + <verb phrase>
  pr: yī + <rule> + <verb phrase>
  ds: Formal according to a rule or stated basis.
