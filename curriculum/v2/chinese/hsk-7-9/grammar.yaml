  lb: yin1-wei4-cause-suo3-yi3-result--cause-groups

- id: zh-hsk2026-g1001
  pt: 有何 + <queried matter>？
  pr: yǒu hé + <queried matter>?
  ds: Formal what exists/is available; context can make the question rhetorical.
  lb: you3-he2-n--what

- id: zh-hsk2026-g819
  pt: 有所 + <selected abstract verb>
  pr: yǒu suǒ + <selected abstract verb>
  ds: Some degree of abstract change or achievement; not any verb.
  lb: you3-suo3-v--some

- id: zh-hsk2026-g1010
