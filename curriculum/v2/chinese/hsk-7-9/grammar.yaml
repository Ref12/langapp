  pr: <preventive action>, miǎn de + <undesirable event>
  ds: Prevent an undesirable result; not an assertion it happened.
  lb: vp-mian3-de5-event--lest

- id: zh-hsk2026-g1040
  pt: <first action with omitted subject>，<shared subject> + <second predicate>
  pr: <first action with omitted subject>，<shared subject> + <second predicate>
  ds: Recover an earlier omitted subject from the following clause; require clear shared reference.
