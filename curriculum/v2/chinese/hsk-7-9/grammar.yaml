- id: zh-hsk2026-g820
  pt: 予以 + <formal action noun>
  pr: yǔ yǐ + <formal action noun>
  ds: Formally perform or grant the named action; restricted nominalized complements.
  lb: yu3-yi3-n--accord

- id: zh-hsk2026-g845
  pt: (愈加 / 越发) + <increasing predicate>
  pr: (yù jiā / yuè fā) + <increasing predicate>
  ds: An increasingly strong state or tendency.
  lb: yu4-jia1-or-yue4-fa1-pred--increasing

- id: zh-hsk2026-g867
  pt: 再度 + <verb phrase>
  pr: zài dù + <verb phrase>
  ds: A renewed occurrence; formal again.
  lb: zai4-du4-vp--again

- id: zh-hsk2026-g1002
