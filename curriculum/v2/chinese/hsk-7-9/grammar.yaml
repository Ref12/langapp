  pr: zhè me zhe + <verb phrase>
  ds: Colloquial in this way; 着 is lexical neutral zhe here.
  lb: zhe4-me5-zhe5-vp--this-way

- id: zh-hsk2026-g974
  pt: 这样一来，<resulting situation>
  pr: zhè yàng yī lái, <resulting situation>
  ds: The preceding development produces this consequence.
  lb: zhe4-yang4-yi1-lai2-state--thus

- id: zh-hsk2026-g975
  pt: 真是的！
  pr: zhēn shi de!
  ds: Colloquial annoyance or mild reproach; tone determines force.
  lb: zhen1-shi5-de5--annoyance

- id: zh-hsk2026-g1003
  pt: 值此 + <occasion> + 之际，<main statement>
  pr: zhí cǐ + <occasion> + zhī jì, <main statement>
