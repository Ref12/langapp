- id: zh-hsk2026-g921
  pt: 未免 + <excessive degree>
  pr: wèi miǎn + <excessive degree>
  ds: Critically judge a degree as rather excessive; not unavoidable 不免.
  lb: wei4-mian3-adjp--too

- id: zh-hsk2026-g1025
  pt: (为 / 为了) + <goal> + 起见，<means action>
  pr: (wèi / wèi le) + <goal> + qǐ jiàn, <means action>
