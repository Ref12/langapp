# HSK 7-9 grammar draft; combined advanced additions after HSK 1-6.
# Retained IDs preserve identities; new IDs are authoring allocations, not syllabus numbers.
# Source: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
# Published November 2025; effective July 2026; retrieved 2026-09-16.
# Shared HSK 7-9: printed pp. 400-403 (PDF pp. 403-406). PDF SHA256:
# ec74ce0439e837bbb15154be13e747ae798903b2fd3a331629df6c3b45504941
# Original editorial templates/cues; no protected examples, tests or transcripts copied.
# Reference only; not independently reviewed or evidence of exam readiness.
# Fixed forms/readings have vocabulary prerequisites; lesson introduction is still required.
# In particular: action-counter 通 tong4, warning 切 qie4, judgment 乃 nai3,
# nominalizing 头儿 tou5-r5, and result/extent 个 ge5 differ from other familiar uses.
# Pronunciation choices without matching vocabulary are editorial, not syllabus attestations.
# Repeated 我/不A不B leave advanced scope unspecified; ordinary earlier uses are not repeated.
# Bare 没什么好V的 belongs to HSK 4. V+得个 has unresolved reading/complement scope.
# Selected four-character/fixed frames are not freely productive substitution rules.
# Source category labels do not settle all readings, senses or admissible complements.
# Record order: ascending lb; lesson order is generated separately.
# Comments retain original source/editorial context; they do not define sorted ranges.

# Bound morphology (printed p. 400); selected established bases, not free word formation.

# Comparison and linked clauses (printed p. 403); no separate HSK 7, 8 or 9 cutoffs.
- id: zh-hsk2026-g1004
  pt: <comparison subject> + <compatible comparative adjective> + (于 / 过) + <comparison target>
  pr: <comparison subject> + <compatible comparative adjective> + (yú / guò) + <comparison target>
  ds: Compare in the adjective's direction; 于 is formal and adjective choice is restricted.
  lb: a-adj-yu2-or-guo4-b--compare
  ex:
    segments:
      - word: wo3--me
      - word: de5--possession
      - word: gong1-zi1--salary
      - word: di1--low
      - word: yu2--than
      - word: ta1--he
      - word: de5--possession
      - word: gong1-zi1--salary
      - punctuation: 。
    translation: My salary is lower than his.
    grammar:
      - a-adj-yu2-or-guo4-b--compare
      - owner-de5-n--possess

- id: zh-hsk2026-g1034
  pt: <earlier event>。<later event>
  pr: <earlier event>。<later event>
  ds: Organize a passage chronologically; establish event times across sentences.
  lb: a-b--chronology
  ex:
    segments:
      - word: zuo2-tian1--yesterday
      - word: shang4-wu3--morning
      - punctuation: ，
      - word: wo3-men5--we
      - word: can1-guan1--visit
      - word: le5--completed
      - word: bo2-wu4-guan3--museum
      - punctuation: 。
      - word: xia4-wu3--afternoon
      - punctuation: ，
      - word: wo3-men5--we
      - word: qu4--go
      - word: gong1-yuan2--park
      - word: san4-bu4--walk
      - punctuation: 。
    translation: Yesterday morning, we visited the museum. In the afternoon, we went for a walk in the park.
    grammar:
      - a-b--chronology
      - time-s-vp-or-s-time-vp--time
      - v-le5-obj--complete
      - qu4-or-lai2-loc-vp--purpose

# Nested clause relations and discourse organization (printed p. 403). Authored structural exemplars, not exhaustive rules.
- id: zh-hsk2026-g1029
  pt: <parallel clause group A>；<parallel clause group B>
  pr: <parallel clause group A>；<parallel clause group B>
  ds: Coordinate internally structured clause groups; distinguish inner links from the outer parallel relation.
  lb: a-b--parallel-groups
  ex:
    segments:
      - word: zhi3-yao4--as-long-as
      - word: lao3-shi1--teacher
      - word: nai4-xin1--patient
      - word: jie3-shi4--explain
      - punctuation: ，
      - word: xue2-sheng5--student
      - word: jiu4--then
      - word: rong2-yi4--easy
      - word: li3-jie3--understand
      - punctuation: ；
      - word: zhi3-yao4--as-long-as
      - word: fu4-mu3--parents
      - word: ren4-zhen1--serious
      - word: qing1-ting1--listen
      - punctuation: ，
      - word: hai2-zi5--child
      - word: jiu4--then
      - word: yuan4-yi4--willing
      - word: jiao1-liu2--communicate
      - punctuation: 。
    translation: As long as teachers explain patiently, students find it easy to understand; as long as parents listen attentively, children are willing to communicate.
    grammar:
      - a-b--parallel-groups
      - zhi3-yao4-clause-jiu4-clause--as-long-as
      - s-adj-vp--manner

