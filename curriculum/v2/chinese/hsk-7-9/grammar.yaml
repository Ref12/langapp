- id: zh-hsk2026-g855
  pt: 早日 + <desired event>
  pr: zǎo rì + <desired event>
  ds: Soon; typically a wished-for favorable event.
  lb: zao3-ri4-event--soon

- id: zh-hsk2026-g891
  pt: (照常 / 照例 / 照样) + <customary action>
  pr: (zhào cháng / zhào lì / zhào yàng) + <customary action>
  ds: Usual course, established precedent, or same manner respectively.
  lb: zhao4-chang2-or-zhao4-li4-or-zhao4-yang4-vp--as-usual

- id: zh-hsk2026-g973
  pt: 这不，<immediately evident fact>
  pr: zhè bù, <immediately evident fact>
  ds: Point to readily available evidence; 不 is not ordinary negation here.
  lb: zhe4-bu4-stmt--see

- id: zh-hsk2026-g822
