- id: zh-hsk2026-g923
  pt: 终究 + <ultimate outcome>
  pr: zhōng jiū + <ultimate outcome>
  ds: Ultimately, despite intervening circumstances or resistance.
  lb: zhong1-jiu1-result--ultimately

- id: zh-hsk2026-g893
  pt: 骤然 + <sudden event>
  pr: zhòu rán + <sudden event>
  ds: Abrupt change or occurrence, often marked in degree.
  lb: zhou4-ran2-event--abrupt

- id: zh-hsk2026-g895
  pt: 专程 + <visit action>
  pr: zhuān chéng + <visit action>
  ds: Make a journey specifically for this purpose.
  lb: zhuan1-cheng2-vp--special-trip

- id: zh-hsk2026-g823
  pt: 兹 + <announcement>
  pr: zī + <announcement>
  ds: Formal now/hereby, referring to the present occasion of an announcement.
  lb: zi1-stmt--hereby

