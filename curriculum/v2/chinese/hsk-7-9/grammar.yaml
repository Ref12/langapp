# Four-character frames (printed p. 401). Use established compatible one-syllable pairs, not arbitrary substitutions.
- id: zh-hsk2026-g943
  pt: 爱 + <single-syllable verb> + 不 + <same single-syllable verb>
  pr: ài + <single-syllable verb> + bù + <same single-syllable verb>
  ds: Dismissive do it or don't; not affection or a neutral question.
  lb: ai4-v-bu4-v--whatever
  ex:
    segments:
      - word: wo3--me
      - word: yi3-jing1--already
      - word: jie3-shi4--explain
      - word: le5--completed
      - word: san1--three
      - word: ci4--times
      - punctuation: ，
      - word: ni3--you
      - word: ai4--dismissive-choice
      - word: xin4--trust
      - word: bu4--not
      - word: xin4--trust
      - punctuation: 。
    translation: I've explained it three times already. Believe it or don't; that's up to you.
    grammar:
      - ai4-v-bu4-v--whatever
      - v-le5-or-guo5-obj-num-ci4--event-count

