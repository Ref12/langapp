- id: zh-hsk2026-g922
  pt: 务必 + <required action>
  pr: wù bì + <required action>
  ds: Strong injunction to ensure an action is carried out.
  lb: wu4-bi4-vp--ensure

- id: zh-hsk2026-g901
  pt: 勿 + <verb phrase>
  pr: wù + <verb phrase>
  ds: Concise formal prohibition, especially notices.
  lb: wu4-vp--dont

- id: zh-hsk2026-g887
  pt: 瞎 + <verb phrase>
  pr: xiā + <verb phrase>
  ds: Aimlessly or improperly; critical colloquial action modifier, not literal blindness.
