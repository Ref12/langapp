  lb: v-dou1-bu4-or-mei2-v--not-even

# Reviewed but unresolved (printed p. 402): V+得个 lacks a complement to distinguish de from de2; no general rule inferred.
- id: zh-hsk2026-g985
  pt: <verb> + 个 + <result or extent>
  pr: <verb> + ge + <result or extent>
  ds: Colloquial resultant state or extent; 个 ge need not count a noun.
  lb: v-ge5-result--extent

- id: zh-hsk2026-g979
