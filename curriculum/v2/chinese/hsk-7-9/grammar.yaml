- id: zh-hsk2026-g954
  pt: 无 + <single-syllable noun> + 不 + <single-syllable predicate>
  pr: wú + <single-syllable noun> + bù + <single-syllable predicate>
  ds: No member or place lacks the property; exhaustive assertion.
  lb: wu2-n-bu4-pred--all

- id: zh-hsk2026-g955
