  lb: zhi2-ci3-event-zhi1-ji4-stmt--occasion

- id: zh-hsk2026-g892
  pt: 执意 + <insisted action>
  pr: zhí yì + <insisted action>
  ds: Insist on acting despite contrary advice or wishes.
