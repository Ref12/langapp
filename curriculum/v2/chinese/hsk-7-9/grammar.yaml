  pr: wú + <single-syllable noun> + kě + <single-syllable transitive verb>
  ds: No suitable object or resource available for the action.
  lb: wu2-n-ke3-v--none

- id: zh-hsk2026-g899
  pt: 无须 + <needed action>
  pr: wú xū + <needed action>
  ds: Formal lack of necessity, not prohibition.
