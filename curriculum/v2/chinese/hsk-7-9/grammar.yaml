  pr: <verb> + jiù + <same verb> + ge + <satisfying result>
  ds: If doing it, do it thoroughly to the stated result.
  lb: v-jiu4-v-ge5-result--thoroughly

- id: zh-hsk2026-g1012
  pt: <verb> + 是 + <same verb> + 了，<reservation>
  pr: <verb> + shì + <same verb> + le, <reservation>
  ds: Concede a completed action while qualifying its value or result.
  lb: v-shi4-v-le5-stmt--done-but

- id: zh-hsk2026-g837
