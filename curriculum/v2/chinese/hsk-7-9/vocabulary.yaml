# Curated v2 Chinese vocabulary: combined HSK 7-9 advanced band.
# 6861 incremental senses including grammar prerequisites.
# Baseline: 6814 senses for numbered rows 5401-11000 and 22 earlier-row
# advanced extensions. Already-taught senses are not emitted again.
# The November 2025 examination syllabus, effective July 2026, defines one
# combined advanced inventory, NOT three separate level 7/8/9 word lists.
# Numbered rows are not unique spellings or senses. Before grammar reconciliation:
# 13807 senses and 10896 written forms across 11000 numbered rows.
# The current cumulative inventory has 13947 senses, including grammar additions.
#
# Fields: id, ch, pr, ds, lb. Pinyin is syllable-separated citation pronunciation;
# labels use numbered tones, neutral5, v for umlaut-u and r5 for erhua.
# Old hskN ID prefixes preserve source identity, not current exam placement.
# New source-backed references and independently authored missing meanings use
# zh-hsk2026-ORIGINALROW-s701+. Synonymous gloss fragments are consolidated.
# New numbered rows come first; earlier-word promotions follow in row order.
#
# Every assigned row has an AI-assisted editorial disposition. This is a
# vocabulary draft, not independent human proofreading, an official sense list,
# certification evidence, a pass prediction or an exam-readiness claim.
# Source disagreements remain unresolved where marked; matching a printed POS
# tag alone is not evidence that the associated grammar use has been taught.
# Grammar/skill crosswalks, cumulative lesson cutoffs, representative exam
# coverage, timing, scoring, listening conditions, writing review and unseen
# mocks remain separate, uncompleted gates. This file does not wire app lessons.
