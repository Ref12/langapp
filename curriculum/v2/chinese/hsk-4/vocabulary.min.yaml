# HSK 4 additions to the HSK 1-3 v2 vocabulary; not a cumulative list.
# 1,292 selected senses: 1,267 for 1,000 new numbered rows (1001-2000),
# followed by 25 level-4 uses on 19 earlier numbered rows.
# Basis: November 2025 exam syllabus, effective July 2026.
# Numbered rows, written forms, readings and senses are distinct counts.
# New entries follow official row order. Earlier-headword expansions follow
# in original row order; lower-level senses and higher-level POS are excluded.
# English descriptions are an AI-assisted editorial draft, not an official
# sense list, a completed curriculum, or a claim of exam readiness.
# No lessons, grammar inventory, assessments, or app wiring are added here.
#
# Fields: id = stable sense reference; ch = simplified Chinese; pr = citation
# pinyin; ds = concise English description; lb = human-readable authoring label.
# Labels use numbered citation tones (5 = neutral; v = ue/umlaut-u; r5 = erhua),
# not sandhi. Matching canonical IDs and established labels are retained.
# The hskN ID prefix identifies the old source inventory, NOT the exam level.
# New senses use reserved zh-hsk2026-ROW-s401 through s499 references.
# These include required POS uses absent from the dictionary, the official
# xie3 reading of blood, ng4 agreement, and shi-guan as embassy rather than
# the source's misleading consulate gloss. Existing IDs are not redefined.
#
# Exam reference: ChineseTest / Chinese Testing International,
# https://www.chinesetest.cn/syllabus
