# HSK 4 grammar draft; incremental additions to earlier v2 bands.
# Fixed forms have cumulative vocabulary support and selected lexical-sense bindings
# in grammar-vocabulary.yaml; lexical presence alone is not mastery.
# Source: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
# Published November 2025; effective July 2026; retrieved 2026-09-16.
# Printed pp. 392-394 (PDF pp. 395-397).
# PDF SHA256: ec74ce0439e837bbb15154be13e747ae798903b2fd3a331629df6c3b45504941
# Reference only; original editorial templates/cues, no protected examples or tests copied.
# Not independently reviewed or evidence of exam readiness.
# Source sense numerals are unspoken; uncertain mappings remain in private review metadata.
# 才4/还4 mappings are provisional; bare 把 + adverbial licensing is restricted.
# 就5 has no defined extra scope here; insistence is already taught in HSK 3.
# Unspecified unmarked compact clauses and additional double-negative scopes remain unresolved.
# Record order: ascending lb; lesson order is generated separately.
# Comments retain original source/editorial context; they do not define sorted ranges.
# Usage examples are original; no source or examination examples are reproduced.
# In the examples, refusal 才 corrects a competing judgment; surprise and dismissal
# with 还 use its emphatic sense, with pragmatic force supplied by the construction.
# These reviewed example bindings and the decimal-marker sense of 点 are pinned
# explicitly in the integrated grammar-vocabulary bindings.

# Modal verbs and demonstrative functions (printed p. 392).

- id: zh-hsk2026-g532
  pt: <first item> + 是 + <same first item>，<second item> + 是 + <same second item>
  pr: <first item> + shì + <same first item>, <second item> + shì + <same second item>
  ds: Keep two matters or categories distinct; do not conflate them.
  lb: a-shi4-a-b-shi4-b--separate
  ex:
    segments:
      - word: gong1-zuo4--job
      - word: shi4--identity
      - word: gong1-zuo4--job
      - punctuation: ，
      - word: sheng1-huo2--life
      - word: shi4--identity
      - word: sheng1-huo2--life
      - punctuation: 。
    translation: Work is work, and your personal life is a separate matter.
    grammar:
      - a-shi4-a-b-shi4-b--separate
      - s-shi4-n--identity

- id: zh-hsk2026-g516
  pt: 啊！/ 嗯。
  pr: ā! / ǹg.
  ds: 啊 expresses surprise; 嗯 acknowledges or agrees, with discourse-dependent intonation.
  lb: a1-or-ng4--response
  ex:
    segments:
      - word: ng4--agreement
      - punctuation: ，
      - word: wo3--me
      - word: tong2-yi4--agree
      - punctuation: 。
    translation: Mm, I agree.
    grammar:
      - a1-or-ng4--response
      - pron-pred--pronoun

- id: zh-hsk2026-g508
  pt: <adjective phrase> + 而 + <adjective phrase>
  pr: <adjective phrase> + ér + <adjective phrase>
  ds: Link compatible or contrasting descriptions within a phrase.
  lb: adjp-er2-adjp--link
  ex:
    segments:
      - word: zhe4--this
      - word: jian1--rooms
      - word: fang2-jian1--room
      - word: xiao3--small
      - word: er2--and
      - word: shu1-fu5--comfortable
      - punctuation: 。
    translation: This room is small and comfortable.
    grammar:
      - adjp-er2-adjp--link
      - zhe4-or-na4-mw-n--this-that

- id: zh-hsk2026-g506
  pt: (按 / 按照) + <rule or standard> + <verb phrase>
  pr: (àn / àn zhào) + <rule or standard> + <verb phrase>
  ds: Follow a specified rule, order or standard.
  lb: an4-or-an4-zhao4-rule-vp--according
  ex:
    segments:
      - word: qing3--please
      - word: an4-zhao4--according
      - word: shuo1-ming2--explanation
      - word: shi3-yong4--use
      - word: zhe4--this
      - word: tai2--machines
      - word: dian4-nao3--computer
      - punctuation: 。
    translation: Please follow the instructions when using this computer.
    grammar:
      - an4-or-an4-zhao4-rule-vp--according
      - qing3-vp--request
      - zhe4-or-na4-mw-n--this-that

