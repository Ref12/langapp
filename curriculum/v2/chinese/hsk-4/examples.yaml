# Original contextual usages supplementing the HSK 4 grammar examples.
# Vocabulary and grammar references resolve against cumulative Chinese v2 HSK 1-4.
# Authored for this curriculum; no examination questions or source examples reproduced.
# Coverage is not a claim of mastery or examination readiness.
# The retained dignified-conduct sense of zun1-zhong4--dignified is old-fashioned;
# its admonition is not an example of the common transitive respect sense.
# zui4-zhong1--end is used as an endpoint, not silently relabelled as an adverb.
# kong3-pa4--fear retains a written experiencer-plus-clause construction, distinct
# from the speaker-probability adverb. Affirmative jiu1-jing4--ultimately and
# adverbial ge4-ge4--separately likewise retain marked written/technical uses.
# The latter sense is also listed as "separately, one by one" in the dictionary
# entry at https://www.chinesepod.com/dictionary/%E5%90%84%E4%B8%AA
# (definition checked 2026-09-22; no source examples were reused).

