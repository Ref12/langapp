# HSK 1: 300 headwords, 355 selected senses.
# Basis: November 2025 exam syllabus, effective July 2026.
# Ordered by syllabus row, with distinct beginner senses adjacent.
# Level-specific parts of speech govern selection; higher-level senses are excluded.
# English descriptions are an editorial draft, not an official sense list or a
# claim of exam readiness. No lessons, grammar, assessments, or app wiring yet.
#
# Fields: id = stable sense reference; ch = simplified Chinese; pr = citation
# pinyin; ds = concise English description; lb = human-readable authoring label.
# Labels use numbered citation tones (5 = neutral; v = ü; r5 = erhua suffix),
# not sandhi.
# Existing matching IDs/labels are retained. Their hskN prefixes identify the old
# source inventory, NOT the exam level here. New senses use zh-hsk2026-ROW-sNNN.
# The ordinal-prefix sense of 第 is newly authored; its old literary senses
# are not reused or relabeled.
#
# Exam reference: ChineseTest / Chinese Testing International,
