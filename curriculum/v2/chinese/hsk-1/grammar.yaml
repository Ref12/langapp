# HSK 1 grammar draft; concise meaning cues for AI interpretation.
# Format and conventions: curriculum\v2\README.md. Fields: id, pt, pr, ds, lb.
# Source-family order, not lesson order or one record per official item.
# Retained IDs are provenance; new zh-hsk2026-gNNN IDs are authoring allocations.
# 没 and measure-word 杯 are explicit grammar additions to standalone vocabulary.
# 呢 uses are distinguished by function; official numeral correspondence is unverified.
#
# Source: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
# Published November 2025; effective July 2026; retrieved 2026-09-16.
# HSK 1: printed pp. 383-385 (PDF pp. 386-388). PDF SHA256:
# ec74ce0439e837bbb15154be13e747ae798903b2fd3a331629df6c3b45504941
# Reference only; no protected examples, exams or transcripts copied.
# Original editorial cues/templates; matching local grammar IDs retained.
# Not independently reviewed or evidence of exam readiness.

# Morphemes and location expressions (printed p. 383).
- id: zh-hsk2026-g001
  pt: 小 + <surname>
  pr: xiǎo + <surname>
  ds: Familiar surname prefix, often for someone younger.
  lb: xiao3-surname--address

- id: zh-hsk2026-g002
  pt: <personal pronoun or human noun> + 们
  pr: <personal pronoun or human noun> + men
  ds: Plural pronouns or human nouns; not ordinary numbered noun phrases.
  lb: pron-or-person-men5--plural

- id: zh-hsk2026-g003
  pt: <direction> + 边
  pr: <direction> + biān
  ds: Location suffix; established compounds may use neutral tone.
  lb: dir-bian1--side

- id: zh-hsk2026-g004
  pt: 第 + <number>
  pr: dì + <number>
  ds: Ordinal number; retain a measure word before a counted noun.
  lb: di4-num--ordinal

- id: zh-hsk2026-g005
  pt: <noun> + (上 / 下 / 里 / 外 / 前 / 后)
  pr: <noun> + (shàng / xià / lǐ / wài / qián / hòu)
  ds: Location relative to the preceding noun.
  lb: n-shang4-or-xia4-or-li3-or-wai4-or-qian2-or-hou4--loc

# Modal verbs and separable verb-object words (printed p. 383).
# Separable-word scope: 看病, 睡觉, 说话, 上课, 下课, 上班, 下班, 生病.
- id: zh-hsk1-g020
  pt: <subject> + 会 + <skill verb phrase>
  pr: <subject> + huì + <skill verb phrase>
  ds: Learned ability, not general ability or permission.
  lb: s-hui4-vp--skill

- id: zh-hsk2-g025
  pt: <subject> + (能 / 可以) + <verb phrase>
  pr: <subject> + (néng / kě yǐ) + <verb phrase>
  ds: '能: ability/circumstances; 可以: permission/possibility.'
  lb: s-neng2-or-ke3-yi3-vp--can-may

- id: zh-hsk1-g019
  pt: <subject> + 想 + <verb phrase>
  pr: <subject> + xiǎng + <verb phrase>
  ds: Want or intend to act.
  lb: s-xiang3-vp--want

- id: zh-hsk2026-g006
  pt: <subject> + 要 + <verb phrase>
  pr: <subject> + yào + <verb phrase>
  ds: Want, need or intend to act; often stronger than 想.
  lb: s-yao4-vp--intend

- id: zh-hsk2026-g007
  pt: <verb part> + <inserted phrase> + <object part>
  pr: <verb part> + <inserted phrase> + <object part>
  ds: Insert aspect or quantity inside a separable verb-object word; not all compounds separate.
  lb: v-insert-obj--separable

# Pronouns and interrogative expressions (printed p. 383).
- id: zh-hsk1-g007
  pt: <before answer> + (谁 / 什么 / 哪儿 / 哪里) + <after answer>？
  pr: <before answer> + (shéi / shén me / nǎ r / nǎ lǐ) + <after answer>?
  ds: Who/what/where in the answer slot; no extra 吗.
  lb: pre-shei2-or-shen2-me5-or-na3-r5-or-na3-li3-post--wh

- id: zh-hsk2026-g008
  pt: 哪 + <measure word> + <noun>？
  pr: nǎ + <measure word> + <noun>?
  ds: Which one, with the noun's measure word.
  lb: na3-mw-n--which

- id: zh-hsk2026-g009
  pt: 哪些 + <noun>？
  pr: nǎ xiē + <noun>?
  ds: Which ones; no extra individual measure word.
  lb: na3-xie1-n--which

- id: zh-hsk2026-g010
  pt: <subject> + 怎么 + <verb phrase>？
  pr: <subject> + zěn me + <verb phrase>?
  ds: How an action is performed.
  lb: s-zen3-me5-vp--how

- id: zh-hsk2026-g011
  pt: <topic> + 怎么样？
  pr: <topic> + zěn me yàng?
  ds: How is it? Request a description or assessment.
  lb: topic-zen3-me5-yang4--assess

- id: zh-hsk2026-g012
  pt: <subject> + 多 + <gradable adjective>？
  pr: <subject> + duō + <gradable adjective>?
  ds: 'Ask degree or measurement: how old, big, tall, etc.'
  lb: s-duo1-adj--degree

- id: zh-hsk1-g023
  pt: 几 + <measure word> + <noun> / 多少 + <noun>？
  pr: jǐ + <measure word> + <noun> / duō shao + <noun>?
  ds: 几 asks a usually small count with a measure word; 多少 an open quantity.
  lb: ji3-mw-n-or-duo1-shao5-n--how-many

- id: zh-hsk2026-g013
  pt: <personal pronoun> + <predicate>
  pr: <personal pronoun> + <predicate>
  ds: Personal pronouns keep their form as subjects and objects.
  lb: pron-pred--pronoun

- id: zh-hsk2026-g014
  pt: (这 / 那) + 是 + <noun phrase>
  pr: (zhè / nà) + shì + <noun phrase>
  ds: Identify this or that person/thing.
  lb: zhe4-or-na4-shi4-np--identify

- id: zh-hsk1-g011
  pt: (这 / 那) + <measure word> + <noun>
  pr: (zhè / nà) + <measure word> + <noun>
  ds: This/that counted thing; retain its measure word.
  lb: zhe4-or-na4-mw-n--this-that

- id: zh-hsk2026-g015
  pt: (这些 / 那些) + <noun>
  pr: (zhè xiē / nà xiē) + <noun>
  ds: These/those; omit an understood noun.
  lb: zhe4-xie1-or-na4-xie1-n--these-those

- id: zh-hsk2026-g016
  pt: (这里 / 这儿 / 那里 / 那儿) + <predicate>
  pr: (zhè lǐ / zhè r / nà li / nà r) + <predicate>
  ds: Here/there as a place expression.
  lb: zhe4-li3-or-zhe4-r5-or-na4-li5-or-na4-r5-pred--place

- id: zh-hsk2026-g017
  pt: (有的 / 有些) + <noun> + <predicate>
  pr: (yǒu de / yǒu xiē) + <noun> + <predicate>
  ds: Some members; 有的 permits an understood noun to be omitted.
  lb: you3-de5-or-you3-xie1-n-pred--some

# Numbers, quantity phrases and measure words (printed pp. 383-384).
# Core individual measure words: 本, 个, 家, 口, 块, 件, 只, 元.
# Their noun associations are also described in the HSK 1 vocabulary inventory.
- id: zh-hsk2026-g018
  pt: <digit> + <next digit>
  pr: <digit> + <next digit>
  ds: Read year or identifier digits individually.
  lb: digit-digit--serial

- id: zh-hsk2026-g019
  pt: <optional tens digit> + 十 + <optional ones digit>
  pr: <optional tens digit> + shí + <optional ones digit>
  ds: 10-99; omit initial 一 in 10-19 and a zero ones digit.
  lb: tens-shi2-ones--tens

- id: zh-hsk2026-g020
  pt: <hundreds digit> + 百 + <optional remainder>
  pr: <hundreds digit> + bǎi + <optional remainder>
  ds: Hundreds before the remainder; keep initial 一, omit trailing zeros.
  lb: digit-bai3-rest--hundreds

- id: zh-hsk2026-g021
  pt: <thousands digit> + 千 + <optional remainder>
  pr: <thousands digit> + qiān + <optional remainder>
  ds: Thousands before the remainder; keep initial 一.
  lb: digit-qian1-rest--thousands

- id: zh-hsk2026-g022
  pt: <higher place value> + 零 + <lower nonzero place value>
  pr: <higher place value> + líng + <lower nonzero place value>
  ds: Bridge skipped internal places with one 零; no trailing zero.
  lb: high-ling2-low--zero-gap

- id: zh-hsk2026-g023
  pt: 两 + <measure word> + <noun>
  pr: liǎng + <measure word> + <noun>
  ds: Two before most measure words; 二 for digits, ordinals and tens.
  lb: liang3-mw-n--two

- id: zh-hsk2026-g024
  pt: 半 + <measure word> + <noun>
  pr: bàn + <measure word> + <noun>
  ds: Half of a counted item or amount.
  lb: ban4-mw-n--half

- id: zh-hsk1-g010
  pt: <number> + <measure word> + <noun>
  pr: <number> + <measure word> + <noun>
  ds: Count with a noun-appropriate measure word; understood noun may drop.
  lb: num-mw-n--count

- id: zh-hsk2026-g025
  pt: <number> + 杯 + <drink noun>
  pr: <number> + bēi + <drink noun>
  ds: Cupful measure 杯, distinct from the container noun 杯子.
  lb: num-bei1-drink--cups

- id: zh-hsk2026-g026
  pt: 一点儿 + <mass noun>
  pr: yī diǎn r + <mass noun>
  ds: A small quantity of a mass noun.
  lb: yi1-dian3-r5-mass--a-little

# Adverbs, negation and prohibitions (printed p. 383).
- id: zh-hsk1-g002
  pt: <subject> + 很 + <adjective>
  pr: <subject> + hěn + <adjective>
  ds: Adjective description; unstressed 很 need not mean very.
  lb: s-hen3-adj--describe

- id: zh-hsk2026-g027
  pt: 非常 + <adjective>
  pr: fēi cháng + <adjective>
  ds: Very; high degree.
  lb: fei1-chang2-adj--very

- id: zh-hsk2026-g028
  pt: 太 + <adjective> + 了！
  pr: tài + <adjective> + le!
  ds: So/too; admiration or excess, not past tense.
  lb: tai4-adj-le5--so-too

- id: zh-hsk2026-g029
  pt: 真 + <adjective>！
  pr: zhēn + <adjective>!
  ds: Really/truly; emphatic evaluation.
  lb: zhen1-adj--really

- id: zh-hsk2-g016
  pt: (有点儿 / 有一点儿) + <adjective>
  pr: (yǒu diǎn r / yǒu yī diǎn r) + <adjective>
  ds: Somewhat, often undesirably; before the adjective.
  lb: you3-dian3-r5-or-you3-yi1-dian3-r5-adj--somewhat

- id: zh-hsk1-g017
  pt: <plural topic> + 都 + <predicate>
  pr: <plural topic> + dōu + <predicate>
  ds: All/both of the preceding group.
  lb: group-dou1-pred--all

- id: zh-hsk1-g016
  pt: <subject> + 也 + <predicate>
  pr: <subject> + yě + <predicate>
  ds: Also/too; precedes the predicate.
  lb: s-ye3-pred--also

- id: zh-hsk2026-g030
  pt: <subject> + 还 + <predicate>
  pr: <subject> + hái + <predicate>
  ds: Also/in addition, not still.
  lb: s-hai2-pred--add

- id: zh-hsk2026-g031
  pt: <subject> + 再 + <verb phrase>
  pr: <subject> + zài + <verb phrase>
  ds: Again for a future or intended repetition.
  lb: s-zai4-vp--again

- id: zh-hsk1-g003
  pt: <subject> + 不 + <predicate>
  pr: <subject> + bù + <predicate>
  ds: Negate habits, intentions or descriptions; not possession or completed events.
  lb: s-bu4-pred--not

- id: zh-hsk1-g005
  pt: <subject> + 没有 + <noun phrase>
  pr: <subject> + méi yǒu + <noun phrase>
  ds: Lack of possession or existence; negative of 有.
  lb: s-mei2-you3-np--absence

- id: zh-hsk2-g003
  pt: <subject> + (没 / 没有) + <verb phrase>
  pr: <subject> + (méi / méi yǒu) + <verb phrase>
  ds: Nonoccurrence; 没 abbreviates 没有. Normally omit completed-action 了.
  lb: s-mei2-or-mei2-you3-vp--no-event

- id: zh-hsk2026-g032
  pt: 不要 + <verb phrase>
  pr: bù yào + <verb phrase>
  ds: 'Prohibition: do not do something.'
  lb: bu4-yao4-vp--dont

# Prepositions, conjunctions and noun modification (printed pp. 383-384).
- id: zh-hsk1-g015
  pt: <subject> + 在 + <place> + <verb phrase>
  pr: <subject> + zài + <place> + <verb phrase>
  ds: Action location before the verb; not progressive 在.
  lb: s-zai4-loc-vp--location

- id: zh-hsk2026-g033
  pt: <subject> + 在 + <time expression> + <verb phrase>
  pr: <subject> + zài + <time expression> + <verb phrase>
  ds: Time before the action; 今天/明天 normally omit 在.
  lb: s-zai4-time-vp--time

- id: zh-hsk2026-g034
  pt: <subject> + 和 + <person> + <verb phrase>
  pr: <subject> + hé + <person> + <verb phrase>
  ds: The person an action is performed with.
  lb: s-he2-p-vp--with

- id: zh-hsk2026-g035
  pt: <subject> + 对 + <person> + <speech verb phrase>
  pr: <subject> + duì + <person> + <speech verb phrase>
  ds: The addressee of a compatible speech action.
  lb: s-dui4-p-vp--address

- id: zh-hsk3-g021
  pt: <subject> + 对 + <person or thing> + <attitude>
  pr: <subject> + duì + <person or thing> + <attitude>
  ds: Attitude toward a person or thing.
  lb: s-dui4-np-attitude--toward

- id: zh-hsk1-g018
  pt: <noun phrase> + 和 + <noun phrase>
  pr: <noun phrase> + hé + <noun phrase>
  ds: Join noun phrases, not full clauses.
  lb: np-he2-np--and

- id: zh-hsk1-g009
  pt: <possessor> + 的 + <noun>
  pr: <possessor> + de + <noun>
  ds: Possessive modifier; 的 may drop in close family relationships.
  lb: owner-de5-n--possess

- id: zh-hsk2026-g036
  pt: <adjective phrase> + 的 + <noun>
  pr: <adjective phrase> + de + <noun>
  ds: Descriptive noun modifier; some short combinations omit 的.
  lb: adjp-de5-n--describe

- id: zh-hsk2026-g037
  pt: <modifying noun> + <head noun>
  pr: <modifying noun> + <head noun>
  ds: A noun specifying the following noun's type or topic.
  lb: n-n--modifier

- id: zh-hsk2026-g038
  pt: <preposition> + <object phrase>
  pr: <preposition> + <object phrase>
  ds: A preposition and its object form a phrase.
  lb: prep-obj--phrase

# Phrase structure, sentence components and basic sentence types (printed p. 384).
- id: zh-hsk2026-g039
  pt: <verb> + <object phrase>
  pr: <verb> + <object phrase>
  ds: A transitive verb precedes its object.
  lb: v-obj--object

- id: zh-hsk2026-g040
  pt: <subject> + <predicate>
  pr: <subject> + <predicate>
  ds: Basic subject-predicate statement.
  lb: s-pred--statement

- id: zh-hsk2026-g041
  pt: <subject> + <verb phrase>
  pr: <subject> + <verb phrase>
  ds: Verbal statement; no auxiliary 是.
  lb: s-vp--verbal

- id: zh-hsk2026-g042
  pt: <subject> + <nominal predicate>
  pr: <subject> + <nominal predicate>
  ds: Context-supported nominal predicate, e.g. age/date/price; not arbitrary 是 omission.
  lb: s-np--nominal

- id: zh-hsk2026-g043
  pt: <contextual short expression>
  pr: <contextual short expression>
  ds: Context-supported utterance without a full subject-predicate structure.
  lb: expr--fragment

- id: zh-hsk1-g014
  pt: <time> + <subject> + <verb phrase> / <subject> + <time> + <verb phrase>
  pr: <time> + <subject> + <verb phrase> / <subject> + <time> + <verb phrase>
  ds: Time before the action, before or after the subject.
  lb: time-s-vp-or-s-time-vp--time

- id: zh-hsk2026-g044
  pt: <subject> + <manner adjective> + <verb phrase>
  pr: <subject> + <manner adjective> + <verb phrase>
  ds: Adjective used adverbially before a verb; construction-dependent.
  lb: s-adj-vp--manner

- id: zh-hsk2026-g045
  pt: <verb> + <number> + 下
  pr: <verb> + <number> + xià
  ds: Count brief actions; 一下 can soften a request.
  lb: v-num-xia4--count

# Questions, requests and interaction (printed pp. 383-384).
- id: zh-hsk1-g006
  pt: <statement> + 吗？
  pr: <statement> + ma?
  ds: Yes/no question; statement order. Not with question words or A-not-A.
  lb: stmt-ma5--yes-no

- id: zh-hsk1-g022
  pt: <verb or adjective> + 不 + <same verb or adjective>？
  pr: <verb or adjective> + bù + <same verb or adjective>?
  ds: A-not-A question; repeat the predicate, without 吗.
  lb: pred-bu4-pred--a-not-a

- id: zh-hsk2026-g046
  pt: <subject> + 有没有 + <noun phrase>？
  pr: <subject> + yǒu méi yǒu + <noun phrase>?
  ds: Ask whether something is possessed; negative part 没有, not 不有.
  lb: s-you3-mei2-you3-np--have

- id: zh-hsk1-g008
  pt: <person or thing> + 呢？
  pr: <person or thing> + ne?
  ds: What about this person or thing? Contextual follow-up.
  lb: np-ne5--followup

- id: zh-hsk2026-g047
  pt: <person or thing> + 呢？
  pr: <person or thing> + ne?
  ds: Where is this person or thing? Search context.
  lb: np-ne5--where

- id: zh-hsk1-g021
  pt: 请 + <verb phrase>
  pr: qǐng + <verb phrase>
  ds: Polite request.
  lb: qing3-vp--request

- id: zh-hsk2026-g048
  pt: <suggestion or request> + 吧
  pr: <suggestion or request> + ba
  ds: Suggestion or softened request, inviting agreement.
  lb: stmt-ba5--suggest

- id: zh-hsk2026-g049
  pt: 喂？
  pr: wéi?
  ds: Telephone greeting.
  lb: wei2--phone

# Identity, possession, location, serial verbs and double objects (printed p. 384).
- id: zh-hsk1-g001
  pt: <subject> + 是 + <noun>
  pr: <subject> + shì + <noun>
  ds: Identify or classify with a noun.
  lb: s-shi4-n--identity

- id: zh-hsk1-g004
  pt: <subject> + 有 + <noun phrase>
  pr: <subject> + yǒu + <noun phrase>
  ds: Possession; have something.
  lb: s-you3-np--have

- id: zh-hsk1-g012
  pt: <subject> + 在 + <place>
  pr: <subject> + zài + <place>
  ds: Be located at a place.
  lb: s-zai4-loc--at

- id: zh-hsk2026-g050
  pt: <place> + 是 + <noun phrase>
  pr: <place> + shì + <noun phrase>
  ds: Identify what occupies a location; distinct from existential 有.
  lb: loc-shi4-np--identify

- id: zh-hsk1-g013
  pt: <place> + 有 + <quantity phrase> + <noun>
  pr: <place> + yǒu + <quantity phrase> + <noun>
  ds: There is/are at a place; indefinite noun, quantity optional.
  lb: loc-you3-qty-n--exist

- id: zh-hsk1-g024
  pt: (去 / 来) + <place> + <verb phrase>
  pr: (qù / lái) + <place> + <verb phrase>
  ds: Go/come somewhere to act; shared subject.
  lb: qu4-or-lai2-loc-vp--purpose

- id: zh-hsk2026-g051
  pt: <subject> + <first action> + <purpose action>
  pr: <subject> + <first action> + <purpose action>
  ds: Shared-subject actions in sequence or purpose relation.
  lb: s-vp-vp--purpose

- id: zh-hsk2026-g052
  pt: <subject> + <means action> + <main action>
  pr: <subject> + <means action> + <main action>
  ds: Shared subject; first action supplies the means for the second.
  lb: s-vp-vp--means

- id: zh-hsk2026-g053
  pt: <subject> + <double-object verb> + <person> + <thing>
  pr: <subject> + <double-object verb> + <person> + <thing>
  ds: Person before thing with a double-object verb, such as 给.
  lb: s-v-p-obj--double-obj

# Linked clauses and aspect (printed p. 385).
- id: zh-hsk2026-g054
  pt: <clause one>，<clause two>
  pr: <clause one>, <clause two>
  ds: Contextually related clauses without an explicit connector.
  lb: clause-clause--linked

- id: zh-hsk2026-g055
  pt: <clause one>，<optional subject> + 也 + <predicate>
  pr: <clause one>, <optional subject> + yě + <predicate>
  ds: Parallel additional fact; repeated subject may be omitted.
  lb: clause-s-ye3-pred--also

- id: zh-hsk2026-g056
  pt: <clause one>，<optional subject> + 还 + <predicate>
  pr: <clause one>, <optional subject> + hái + <predicate>
  ds: Further fact/action; additive 还, not still.
  lb: clause-s-hai2-pred--add

- id: zh-hsk2-g001
  pt: <verb> + 了 + <object>
  pr: <verb> + le + <object>
  ds: Completed/bounded event, not past tense; object only when licensed.
  lb: v-le5-obj--complete

- id: zh-hsk2-g002
  pt: <new situation> + 了
  pr: <new situation> + le
  ds: New or changed situation; sentence-final 了.
  lb: state-le5--change

- id: zh-hsk2026-g057
  pt: <subject> + (在 / 正在) + <verb phrase>
  pr: <subject> + (zài / zhèng zài) + <verb phrase>
  ds: Ongoing activity; distinguish progressive 在 from location.
  lb: s-zai4-or-zheng4-zai4-vp--ongoing

- id: zh-hsk2-g004
  pt: <subject> + (在 / 正在) + <verb phrase> + 呢
  pr: <subject> + (zài / zhèng zài) + <verb phrase> + ne
  ds: Ongoing activity emphasized by 呢; not static possession.
  lb: s-zai4-or-zheng4-zai4-vp-ne5--ongoing

- id: zh-hsk2026-g058
  pt: <subject> + <verb phrase> + 呢
  pr: <subject> + <verb phrase> + ne
  ds: Contextual ongoing action marked by final 呢 alone.
  lb: s-vp-ne5--ongoing

# Money, dates, clock time and time units (printed pp. 383 and 385).
# 第 + number above also supplies the ordinal-number expression in this section.
- id: zh-hsk2026-g059
  pt: <amount> + (元 / 块 / 分)
  pr: <amount> + (yuán / kuài / fēn)
  ds: Yuan (元/块) or hundredths of a yuan (分).
  lb: amt-yuan2-or-kuai4-or-fen1--money

- id: zh-hsk2026-g060
  pt: <whole yuan> + 块 + <tenths digit>
  pr: <whole yuan> + kuài + <tenths digit>
  ds: 'Spoken fractional yuan: 三块五 means 3.50 yuan, not 3.05.'
  lb: yuan-kuai4-tenths--price

- id: zh-hsk2026-g061
  pt: <year digits> + 年 + <month number> + 月 + <day number> + (日 / 号)
  pr: <year digits> + nián + <month number> + yuè + <day number> + (rì / hào)
  ds: Year-month-day; year as digits, month/day as cardinal numbers.
  lb: year-nian2-month-yue4-day-ri4-or-hao4--date

- id: zh-hsk2026-g062
  pt: 星期 + <weekday>
  pr: xīng qī + <weekday>
  ds: '一-六: Monday-Saturday; 日/天: Sunday.'
  lb: xing1-qi1-day--weekday

- id: zh-hsk2026-g063
  pt: <time of day> + <hour> + 点 + <minutes> + 分
  pr: <time of day> + <hour> + diǎn + <minutes> + fēn
  ds: Hour then minutes; omit exact-hour minutes; time of day as needed.
  lb: time-hour-dian3-min-fen1--clock

- id: zh-hsk2026-g064
  pt: <hour> + 点 + 半
  pr: <hour> + diǎn + bàn
  ds: Half past the stated hour.
  lb: hour-dian3-ban4--half-past

- id: zh-hsk2026-g065
  pt: <person> + <age> + 岁
  pr: <person> + <age> + suì
  ds: Age in years; no 是 required.
  lb: p-age-sui4--age

- id: zh-hsk2026-g066
  pt: <number> + (年 / 天 / 分)
  pr: <number> + (nián / tiān / fēn)
  ds: Count years/days/minutes directly; other time units may differ.
  lb: num-nian2-or-tian1-or-fen1--duration
