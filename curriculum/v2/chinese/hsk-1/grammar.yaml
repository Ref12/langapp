# HSK 1 grammar draft; concise meaning cues for AI interpretation.
# Format and conventions: curriculum\v2\README.md. Fields: id, pt, pr, ds, lb, ex.
# Retained IDs are provenance; new zh-hsk2026-gNNN IDs are authoring allocations.
# 没 and measure-word 杯 are explicit grammar additions to standalone vocabulary.
# 呢 uses are distinguished by function; official numeral correspondence is unverified.
#
# Source: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
# Published November 2025; effective July 2026; retrieved 2026-09-16.
# HSK 1: printed pp. 383-385 (PDF pp. 386-388). PDF SHA256:
# ec74ce0439e837bbb15154be13e747ae798903b2fd3a331629df6c3b45504941
# Reference only; no protected examples, exams or transcripts copied.
# Original editorial cues/templates; matching local grammar IDs retained.
# Not independently reviewed or evidence of exam readiness.
# Record order: ascending lb; lesson order is generated separately.
# Comments retain original source/editorial context; they do not define sorted ranges.

# Morphemes and location expressions (printed p. 383).

- id: zh-hsk2026-g036
  pt: <adjective phrase> + 的 + <noun>
  pr: <adjective phrase> + de + <noun>
  ds: Descriptive noun modifier; some short combinations omit 的.
  lb: adjp-de5-n--describe
  ex:
    segments: [{word: wo3--me}, {word: xi3-huan5--like}, {word: xin1--new}, {word: de5--description}, {word: yi1-fu5--clothes}, {punctuation: 。}]
    translation: I like new clothes.
    grammar: [adjp-de5-n--describe, s-vp--verbal]

# Money, dates, clock time and time units (printed pp. 383 and 385).
# 第 + number above also supplies the ordinal-number expression in this section.
- id: zh-hsk2026-g059
  pt: <amount> + (元 / 块 / 分)
  pr: <amount> + (yuán / kuài / fēn)
  ds: Yuan (元/块) or hundredths of a yuan (分).
  lb: amt-yuan2-or-kuai4-or-fen1--money
  ex:
    segments: [{word: zhe4--this}, {word: ben3--books}, {word: shu1--book}, {word: wu3--five}, {word: yuan2--yuan}, {punctuation: 。}]
    translation: This book costs five yuan.
    grammar: [amt-yuan2-or-kuai4-or-fen1--money, zhe4-or-na4-mw-n--this-that, s-np--nominal]

- id: zh-hsk2026-g024
  pt: 半 + <measure word> + <noun>
  pr: bàn + <measure word> + <noun>
  ds: Half of a counted item or amount.
  lb: ban4-mw-n--half
  ex:
    segments: [{word: wo3--me}, {word: he1--drink}, {word: ban4--half}, {word: bei1--cupfuls}, {word: niu2-nai3--milk}, {punctuation: 。}]
    translation: I drink half a cup of milk.
    grammar: [ban4-mw-n--half, s-vp--verbal]

- id: zh-hsk2026-g032
  pt: 不要 + <verb phrase>
  pr: bù yào + <verb phrase>
  ds: 'Prohibition: do not do something.'
  lb: bu4-yao4-vp--dont
  ex:
    segments: [{word: bu4-yao4--dont}, {word: kai1--operate}, {word: dian4-shi4--television}, {punctuation: 。}]
    translation: Don't turn on the television.
    grammar: [bu4-yao4-vp--dont, v-obj--object]

# Linked clauses and aspect (printed p. 385).
- id: zh-hsk2026-g054
  pt: <clause one>，<clause two>
  pr: <clause one>, <clause two>
  ds: Contextually related clauses without an explicit connector.
  lb: clause-clause--linked
  ex:
    segments: [{word: wo3--me}, {word: xia4-ban1--finish}, {punctuation: ，}, {word: ni3--you}, {word: shang4-ban1--work}, {punctuation: 。}]
    translation: I finish work, and you go to work.
    grammar: [clause-clause--linked, s-vp--verbal]

- id: zh-hsk2026-g056
  pt: <clause one>，<optional subject> + 还 + <predicate>
  pr: <clause one>, <optional subject> + hái + <predicate>
  ds: Further fact/action; additive 还, not still.
  lb: clause-s-hai2-pred--add
  ex:
    segments: [{word: wo3--me}, {word: he1--drink}, {word: cha2--tea}, {punctuation: ，}, {word: hai2--also}, {word: he1--drink}, {word: niu2-nai3--milk}, {punctuation: 。}]
    translation: I drink tea, and I also drink milk.
    grammar: [clause-s-hai2-pred--add, s-vp--verbal]

- id: zh-hsk2026-g055
  pt: <clause one>，<optional subject> + 也 + <predicate>
  pr: <clause one>, <optional subject> + yě + <predicate>
  ds: Parallel additional fact; repeated subject may be omitted.
  lb: clause-s-ye3-pred--also
  ex:
    segments: [{word: wo3--me}, {word: ai4--love}, {word: ba4-ba5--dad}, {punctuation: ，}, {word: ye3--also}, {word: ai4--love}, {word: ma1-ma5--mom}, {punctuation: 。}]
    translation: I love Dad, and I love Mom too.
    grammar: [clause-s-ye3-pred--also, s-vp--verbal]

- id: zh-hsk2026-g004
  pt: 第 + <number>
  pr: dì + <number>
  ds: Ordinal number; retain a measure word before a counted noun.
  lb: di4-num--ordinal
  ex:
    segments: [{word: wo3--me}, {word: kan4--read}, {word: di4--ordinal}, {word: er4--two}, {word: ben3--books}, {word: shu1--book}, {punctuation: 。}]
    translation: I am reading the second book.
    grammar: [di4-num--ordinal, num-mw-n--count, s-vp--verbal]

- id: zh-hsk2026-g020
  pt: <hundreds digit> + 百 + <optional remainder>
  pr: <hundreds digit> + bǎi + <optional remainder>
  ds: Hundreds before the remainder; keep initial 一, omit trailing zeros.
  lb: digit-bai3-rest--hundreds
  ex:
    segments: [{word: zhe4--this}, {word: jian4--classifier}, {word: yi1-fu5--clothes}, {word: yi1--one}, {word: bai3--hundred}, {word: yuan2--yuan}, {punctuation: 。}]
    translation: This item of clothing costs one hundred yuan.
    grammar: [digit-bai3-rest--hundreds, amt-yuan2-or-kuai4-or-fen1--money, zhe4-or-na4-mw-n--this-that, s-np--nominal]

# Numbers, quantity phrases and measure words (printed pp. 383-384).
# Core individual measure words: 本, 个, 家, 口, 块, 件, 只, 元.
# Their noun associations are also described in the HSK 1 vocabulary inventory.
- id: zh-hsk2026-g018
  pt: <digit> + <next digit>
  pr: <digit> + <next digit>
  ds: Read year or identifier digits individually.
  lb: digit-digit--serial
  ex:
    segments: [{word: jin1-nian2--year}, {word: shi4--identity}, {word: er4--two}, {word: ling2--zero}, {word: er4--two}, {word: liu4--six}, {word: nian2--year}, {punctuation: 。}]
    translation: This year is 2026.
    grammar: [digit-digit--serial, s-shi4-n--identity]

- id: zh-hsk2026-g021
  pt: <thousands digit> + 千 + <optional remainder>
  pr: <thousands digit> + qiān + <optional remainder>
  ds: Thousands before the remainder; keep initial 一.
  lb: digit-qian1-rest--thousands
  ex:
    segments: [{word: dian4-nao3--computer}, {word: yi1--one}, {word: qian1--thousand}, {word: yuan2--yuan}, {punctuation: 。}]
    translation: The computer costs one thousand yuan.
    grammar: [digit-qian1-rest--thousands, amt-yuan2-or-kuai4-or-fen1--money, s-np--nominal]

- id: zh-hsk2026-g003
  pt: <direction> + 边
  pr: <direction> + biān
  ds: Location suffix; established compounds may use neutral tone.
  lb: dir-bian1--side
  ex:
    segments: [{word: mao1--cat}, {word: zai4--location}, {word: zhuo1-zi5--table}, {word: hou4--behind}, {word: bian1--side}, {punctuation: 。}]
    translation: The cat is behind the table.
    grammar: [dir-bian1--side, s-zai4-loc--at]

- id: zh-hsk2026-g043
  pt: <contextual short expression>
  pr: <contextual short expression>
  ds: Context-supported utterance without a full subject-predicate structure.
  lb: expr--fragment
  ex:
    segments: [{word: xie4-xie5--thanks}, {punctuation: ！}, {word: bu4-ke4-qi5--welcome}, {punctuation: 。}]
    translation: Thank you! You're welcome.
    grammar: [expr--fragment]

- id: zh-hsk2026-g027
  pt: 非常 + <adjective>
  pr: fēi cháng + <adjective>
  ds: Very; high degree.
  lb: fei1-chang2-adj--very
  ex:
    segments: [{word: fei1-chang2--very}, {word: hao3--good}, {punctuation: ！}]
    translation: Very good!
    grammar: [fei1-chang2-adj--very, expr--fragment]

- id: zh-hsk1-g017
  pt: <plural topic> + 都 + <predicate>
  pr: <plural topic> + dōu + <predicate>
  ds: All/both of the preceding group.
  lb: group-dou1-pred--all
  ex:
    segments: [{word: wo3-men5--we}, {word: dou1--all}, {word: shi4--identity}, {word: xue2-sheng5--student}, {punctuation: 。}]
    translation: We are all students.
    grammar: [group-dou1-pred--all, s-shi4-n--identity]

- id: zh-hsk2026-g022
  pt: <higher place value> + 零 + <lower nonzero place value>
  pr: <higher place value> + líng + <lower nonzero place value>
  ds: Bridge skipped internal places with one 零; no trailing zero.
  lb: high-ling2-low--zero-gap
  ex:
    segments: [{word: shou3-ji1--phone}, {word: yi1--one}, {word: qian1--thousand}, {word: ling2--zero}, {word: ba1--eight}, {word: yuan2--yuan}, {punctuation: 。}]
    translation: The mobile phone costs one thousand and eight yuan.
    grammar: [high-ling2-low--zero-gap, digit-qian1-rest--thousands, amt-yuan2-or-kuai4-or-fen1--money, s-np--nominal]

- id: zh-hsk2026-g064
  pt: <hour> + 点 + 半
  pr: <hour> + diǎn + bàn
  ds: Half past the stated hour.
  lb: hour-dian3-ban4--half-past
  ex:
    segments: [{word: wo3--me}, {word: ba1--eight}, {word: dian3--oclock}, {word: ban4--half}, {word: qi3-chuang2--get-up}, {punctuation: 。}]
    translation: I get up at half past eight.
    grammar: [hour-dian3-ban4--half-past, time-s-vp-or-s-time-vp--time]

- id: zh-hsk1-g023
  pt: 几 + <measure word> + <noun> / 多少 + <noun>？
  pr: jǐ + <measure word> + <noun> / duō shao + <noun>?
  ds: 几 asks a usually small count with a measure word; 多少 an open quantity.
  lb: ji3-mw-n-or-duo1-shao5-n--how-many
  ex:
    segments: [{word: ni3--you}, {word: you3--have}, {word: ji3--quantity}, {word: ben3--books}, {word: shu1--book}, {punctuation: ？}]
    translation: How many books do you have?
    grammar: [ji3-mw-n-or-duo1-shao5-n--how-many, s-you3-np--have]

- id: zh-hsk2026-g023
  pt: 两 + <measure word> + <noun>
  pr: liǎng + <measure word> + <noun>
  ds: Two before most measure words; 二 for digits, ordinals and tens.
  lb: liang3-mw-n--two
  ex:
    segments: [{word: wo3--me}, {word: you3--have}, {word: liang3--two}, {word: ge4--classifier}, {word: peng2-you5--friend}, {punctuation: 。}]
    translation: I have two friends.
    grammar: [liang3-mw-n--two, s-you3-np--have]

- id: zh-hsk2026-g050
  pt: <place> + 是 + <noun phrase>
  pr: <place> + shì + <noun phrase>
  ds: Identify what occupies a location; distinct from existential 有.
  lb: loc-shi4-np--identify
  ex:
    segments: [{word: qian2--front}, {word: bian1--side}, {word: shi4--identity}, {word: xue2-xiao4--school}, {punctuation: 。}]
    translation: The school is up ahead.
    grammar: [loc-shi4-np--identify, dir-bian1--side]

- id: zh-hsk1-g013
  pt: <place> + 有 + <quantity phrase> + <noun>
  pr: <place> + yǒu + <quantity phrase> + <noun>
  ds: There is/are at a place; indefinite noun, quantity optional.
  lb: loc-you3-qty-n--exist
  ex:
    segments: [{word: zhuo1-zi5--table}, {word: shang4--above}, {word: you3--have}, {word: yi1--one}, {word: ge4--classifier}, {word: bei1-zi5--cup}, {punctuation: 。}]
    translation: There is a cup on the table.
    grammar: [loc-you3-qty-n--exist, n-shang4-or-xia4-or-li3-or-wai4-or-qian2-or-hou4--loc, num-mw-n--count]

- id: zh-hsk2026-g037
  pt: <modifying noun> + <head noun>
  pr: <modifying noun> + <head noun>
  ds: A noun specifying the following noun's type or topic.
  lb: n-n--modifier
  ex:
    segments: [{word: wo3--me}, {word: shi4--identity}, {word: han4-yu3--chinese}, {word: lao3-shi1--teacher}, {punctuation: 。}]
    translation: I am a Chinese-language teacher.
    grammar: [n-n--modifier, s-shi4-n--identity]

- id: zh-hsk2026-g005
  pt: <noun> + (上 / 下 / 里 / 外 / 前 / 后)
  pr: <noun> + (shàng / xià / lǐ / wài / qián / hòu)
  ds: Location relative to the preceding noun.
  lb: n-shang4-or-xia4-or-li3-or-wai4-or-qian2-or-hou4--loc
  ex:
    segments: [{word: gou3--dog}, {word: zai4--location}, {word: zhuo1-zi5--table}, {word: xia4--below}, {punctuation: 。}]
    translation: The dog is under the table.
    grammar: [n-shang4-or-xia4-or-li3-or-wai4-or-qian2-or-hou4--loc, s-zai4-loc--at]

- id: zh-hsk2026-g008
  pt: 哪 + <measure word> + <noun>？
  pr: nǎ + <measure word> + <noun>?
  ds: Which one, with the noun's measure word.
  lb: na3-mw-n--which
  ex:
    segments: [{word: ni3--you}, {word: yao4--want}, {word: na3--which}, {word: ben3--books}, {word: shu1--book}, {punctuation: ？}]
    translation: Which book do you want?
    grammar: [na3-mw-n--which, s-vp--verbal]

- id: zh-hsk2026-g009
  pt: 哪些 + <noun>？
  pr: nǎ xiē + <noun>?
  ds: Which ones; no extra individual measure word.
  lb: na3-xie1-n--which
  ex:
    segments: [{word: ni3--you}, {word: xi3-huan5--like}, {word: na3-xie1--which}, {word: dian4-ying3--movie}, {punctuation: ？}]
    translation: Which movies do you like?
    grammar: [na3-xie1-n--which, s-vp--verbal]

- id: zh-hsk1-g018
  pt: <noun phrase> + 和 + <noun phrase>
  pr: <noun phrase> + hé + <noun phrase>
  ds: Join noun phrases, not full clauses.
  lb: np-he2-np--and
  ex:
    segments: [{word: wo3--me}, {word: xi3-huan5--like}, {word: cha2--tea}, {word: he2--and}, {word: shui3--water}, {punctuation: 。}]
    translation: I like tea and water.
    grammar: [np-he2-np--and, s-vp--verbal]

- id: zh-hsk1-g008
  pt: <person or thing> + 呢？
  pr: <person or thing> + ne?
  ds: What about this person or thing? Contextual follow-up.
  lb: np-ne5--followup
  ex:
    segments: [{word: wo3--me}, {word: shi4--identity}, {word: xue2-sheng5--student}, {punctuation: 。}, {word: ni3--you}, {word: ne5--reciprocal}, {punctuation: ？}]
    translation: I am a student. What about you?
    grammar: [np-ne5--followup, s-shi4-n--identity]

- id: zh-hsk2026-g047
  pt: <person or thing> + 呢？
  pr: <person or thing> + ne?
  ds: Where is this person or thing? Search context.
  lb: np-ne5--where
  ex:
    segments: [{word: wo3--me}, {word: zhao3--search}, {word: shou3-ji1--phone}, {punctuation: 。}, {word: shou3-ji1--phone}, {word: ne5--where}, {punctuation: ？}]
    translation: I am looking for my mobile phone. Where is it?
    grammar: [np-ne5--where, s-vp--verbal]

- id: zh-hsk2026-g025
  pt: <number> + 杯 + <drink noun>
  pr: <number> + bēi + <drink noun>
  ds: Cupful measure 杯, distinct from the container noun 杯子.
  lb: num-bei1-drink--cups
  ex:
    segments: [{word: wo3--me}, {word: yao4--want}, {word: yi1--one}, {word: bei1--cupfuls}, {word: cha2--tea}, {punctuation: 。}]
    translation: I would like a cup of tea.
    grammar: [num-bei1-drink--cups, s-vp--verbal]

- id: zh-hsk1-g010
  pt: <number> + <measure word> + <noun>
  pr: <number> + <measure word> + <noun>
  ds: Count with a noun-appropriate measure word; understood noun may drop.
  lb: num-mw-n--count
  ex:
    segments: [{word: wo3--me}, {word: you3--have}, {word: san1--three}, {word: ben3--books}, {word: shu1--book}, {punctuation: 。}]
    translation: I have three books.
    grammar: [num-mw-n--count, s-you3-np--have]

- id: zh-hsk2026-g066
  pt: <number> + (年 / 天 / 分)
  pr: <number> + (nián / tiān / fēn)
  ds: Count years/days/minutes directly; other time units may differ.
  lb: num-nian2-or-tian1-or-fen1--duration
  ex:
    segments: [{word: wo3--me}, {word: zai4--location}, {word: zhe4-li3--here}, {word: zhu4--stay}, {word: san1--three}, {word: tian1--day}, {punctuation: 。}]
    translation: I am staying here for three days.
    grammar: [num-nian2-or-tian1-or-fen1--duration, s-zai4-loc-vp--location]

- id: zh-hsk1-g009
  pt: <possessor> + 的 + <noun>
  pr: <possessor> + de + <noun>
  ds: Possessive modifier; 的 may drop in close family relationships.
  lb: owner-de5-n--possess
  ex:
    segments: [{word: wo3--me}, {word: de5--possession}, {word: lao3-shi1--teacher}, {word: shi4--identity}, {word: ni3--you}, {punctuation: 。}]
    translation: You are my teacher.
    grammar: [owner-de5-n--possess, s-shi4-n--identity]

- id: zh-hsk2026-g065
  pt: <person> + <age> + 岁
  pr: <person> + <age> + suì
  ds: Age in years; no 是 required.
  lb: p-age-sui4--age
  ex:
    segments: [{word: di4-di5--brother}, {word: jiu3--nine}, {word: sui4--age}, {punctuation: 。}]
    translation: My younger brother is nine years old.
    grammar: [p-age-sui4--age]

# Pronouns and interrogative expressions (printed p. 383).
- id: zh-hsk1-g007
  pt: <before answer> + (谁 / 什么 / 哪儿 / 哪里) + <after answer>？
  pr: <before answer> + (shéi / shén me / nǎ r / nǎ lǐ) + <after answer>?
  ds: Who/what/where in the answer slot; no extra 吗.
  lb: pre-shei2-or-shen2-me5-or-na3-r5-or-na3-li3-post--wh
  ex:
    segments: [{word: ni3--you}, {word: shi4--identity}, {word: shei2--who}, {punctuation: ？}]
    translation: Who are you?
    grammar: [pre-shei2-or-shen2-me5-or-na3-r5-or-na3-li3-post--wh, s-shi4-n--identity]

- id: zh-hsk1-g022
  pt: <verb or adjective> + 不 + <same verb or adjective>？
  pr: <verb or adjective> + bù + <same verb or adjective>?
  ds: A-not-A question; repeat the predicate, without 吗.
  lb: pred-bu4-pred--a-not-a
  ex:
    segments: [{word: ni3--you}, {word: he1--drink}, {word: bu4--not}, {word: he1--drink}, {word: shui3--water}, {punctuation: ？}]
    translation: Would you like some water?
    grammar: [pred-bu4-pred--a-not-a, v-obj--object]

- id: zh-hsk2026-g038
  pt: <preposition> + <object phrase>
  pr: <preposition> + <object phrase>
  ds: A preposition and its object form a phrase.
  lb: prep-obj--phrase
  ex:
    segments: [{word: wo3--me}, {word: zai4--location}, {word: jia1--home}, {word: xue2-xi2--study}, {punctuation: 。}]
    translation: I study at home.
    grammar: [prep-obj--phrase, s-zai4-loc-vp--location]

- id: zh-hsk2026-g002
  pt: <personal pronoun or human noun> + 们
  pr: <personal pronoun or human noun> + men
  ds: Plural pronouns or human nouns; not ordinary numbered noun phrases.
  lb: pron-or-person-men5--plural
  ex:
    segments: [{word: lao3-shi1--teacher}, {word: men5--plural}, {word: hao3--good}, {punctuation: ！}]
    translation: Hello, teachers!
    grammar: [pron-or-person-men5--plural, expr--fragment]

- id: zh-hsk2026-g013
  pt: <personal pronoun> + <predicate>
  pr: <personal pronoun> + <predicate>
  ds: Personal pronouns keep their form as subjects and objects.
  lb: pron-pred--pronoun
  ex:
    segments: [{word: wo3--me}, {word: ren4-shi5--know}, {word: ni3--you}, {punctuation: 。}]
    translation: I know you.
    grammar: [pron-pred--pronoun, v-obj--object]

- id: zh-hsk1-g021
  pt: 请 + <verb phrase>
  pr: qǐng + <verb phrase>
  ds: Polite request.
  lb: qing3-vp--request
  ex:
    segments: [{word: qing3--please}, {word: zuo4--sit}, {punctuation: 。}]
    translation: Please sit down.
    grammar: [qing3-vp--request]

- id: zh-hsk1-g024
  pt: (去 / 来) + <place> + <verb phrase>
  pr: (qù / lái) + <place> + <verb phrase>
  ds: Go/come somewhere to act; shared subject.
  lb: qu4-or-lai2-loc-vp--purpose
  ex:
    segments: [{word: wo3--me}, {word: qu4--go}, {word: shu1-dian4--bookstore}, {word: mai3--buy}, {word: shu1--book}, {punctuation: 。}]
    translation: I am going to the bookstore to buy books.
    grammar: [qu4-or-lai2-loc-vp--purpose, v-obj--object]

- id: zh-hsk2026-g044
  pt: <subject> + <manner adjective> + <verb phrase>
  pr: <subject> + <manner adjective> + <verb phrase>
  ds: Adjective used adverbially before a verb; construction-dependent.
  lb: s-adj-vp--manner
  ex:
