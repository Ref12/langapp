# HSK 3 incremental grammar draft; concise AI-facing meaning cues.
# Builds on HSK 1-2; recurring structures are accounted for, not repeated.
# Format: curriculum\v2\README.md. Fields: id, pt, pr, ds, lb, ex.
# Retained IDs preserve constructions; new IDs are authoring allocations.
#
# Source: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
# Published November 2025; effective July 2026; retrieved 2026-09-16.
# Printed pp. 389-391 (PDF pp. 392-394). PDF SHA256:
# ec74ce0439e837bbb15154be13e747ae798903b2fd3a331629df6c3b45504941
# Original editorial templates/cues; no protected examples, exams or transcripts.
# AI editorial coverage, not independent review or evidence of exam readiness.
# Numbered adverb senses and open 不A不B scope remain editorial interpretations.
# Record order: ascending lb; lesson order is generated separately.
# Comments retain original source/editorial context; they do not define sorted ranges.

# Morphemes, location and modal verbs (printed p. 389).

- id: zh-hsk2026-g367
  pt: <compared item> + 比 + <reference item> + (多 / 少) + <verb> + <quantity phrase>
  pr: <compared item> + bǐ + <reference item> + (duō / shǎo) + <verb> + <quantity phrase>
  ds: Difference in how much action or quantity occurs.
  lb: a-bi3-b-duo1-or-shao3-v-qty--amount-diff
  ex:
    segments:
      - word: wo3--me
      - word: bi3--than
      - word: ni3--you
      - word: duo1--more
      - word: he1--drink
      - word: yi1--one
      - word: bei1--cupfuls
      - word: cha2--tea
      - punctuation: 。
    translation: I drink one more cup of tea than you.
    grammar:
      - a-bi3-b-duo1-or-shao3-v-qty--amount-diff
      - num-bei1-drink--cups

- id: zh-hsk2026-g363
  pt: <compared item> + 比 + <reference item> + (更 / 还) + <adjective>
  pr: <compared item> + bǐ + <reference item> + (gèng / hái) + <adjective>
  ds: Even greater degree relative to the reference; not fairly-还.
  lb: a-bi3-b-geng4-or-hai2-adj--even-more
  ex:
    segments:
      - word: jin1-tian1--today
      - word: bi3--than
      - word: zuo2-tian1--yesterday
      - word: geng4--more
      - word: leng3--cold
      - punctuation: 。
    translation: Today is even colder than yesterday.
    grammar:
      - a-bi3-b-geng4-or-hai2-adj--even-more
      - a-bi3-b-adj--more

- id: zh-hsk2026-g368
  pt: <compared item> + 比 + <reference item> + (早 / 晚) + <verb> + <duration>
  pr: <compared item> + bǐ + <reference item> + (zǎo / wǎn) + <verb> + <duration>
  ds: Action occurs earlier/later by a stated interval.
  lb: a-bi3-b-zao3-or-wan3-v-duration--time-diff
  ex:
    segments:
      - word: wo3--me
      - word: bi3--than
      - word: ni3--you
      - word: wan3--late
      - word: hui2-lai5--return
      - word: shi2--ten
      - word: fen1-zhong1--minute
      - punctuation: 。
    translation: I came back ten minutes later than you.
    grammar:
      - a-bi3-b-zao3-or-wan3-v-duration--time-diff
      - num-nian2-or-tian1-or-fen1--duration
      - v-hui2-lai5-or-hui2-qu5--return

- id: zh-hsk2026-g366
  pt: <compared item> + 不比 + <reference item> + <adjective>
  pr: <compared item> + bù bǐ + <reference item> + <adjective>
  ds: Deny a greater degree; does not necessarily assert a lesser degree.
  lb: a-bu4-bi3-b-adj--not-more
  ex:
    segments:
      - word: jin1-tian1--today
      - word: bu4--not
      - word: bi3--than
      - word: zuo2-tian1--yesterday
      - word: leng3--cold
      - punctuation: 。
    translation: Today is not colder than yesterday.
    grammar:
      - a-bu4-bi3-b-adj--not-more

- id: zh-hsk2026-g364
  pt: <compared item> + 跟 + <reference item> + 一样
  pr: <compared item> + gēn + <reference item> + yī yàng
  ds: Same in a contextually understood respect.
  lb: a-gen1-b-yi1-yang4--same
  ex:
    segments:
      - word: zhe4--this
      - word: ben3--books
      - word: shu1--book
      - word: gen1--comparison
      - word: na4--that
      - word: ben3--books
      - word: shu1--book
      - word: yi1-yang4--same
      - punctuation: 。
    translation: This book is the same as that book.
    grammar:
      - a-gen1-b-yi1-yang4--same

- id: zh-hsk2026-g365
  pt: <compared item> + 跟 + <reference item> + 一样 + <adjective>
  pr: <compared item> + gēn + <reference item> + yī yàng + <adjective>
  ds: Equal degree of the stated quality.
  lb: a-gen1-b-yi1-yang4-adj--equally
  ex:
    segments:
      - word: wo3--me
      - word: gen1--comparison
      - word: ni3--you
      - word: yi1-yang4--same
      - word: mang2--busy
      - punctuation: 。
    translation: I am just as busy as you.
    grammar:
      - a-gen1-b-yi1-yang4-adj--equally

- id: zh-hsk2026-g354
  pt: <adjective> + 得很
  pr: <adjective> + de hěn
  ds: High degree after an adjective, not manner after a verb.
  lb: adj-de5-hen3--very
  ex:
    segments:
      - word: jin1-tian1--today
      - word: leng3--cold
      - word: de5--manner
      - word: hen3--very
      - punctuation: 。
    translation: It is very cold today.
    grammar:
      - adj-de5-hen3--very

- id: zh-hsk2026-g342
  pt: <adjective phrase> + <evaluation predicate>
  pr: <adjective phrase> + <evaluation predicate>
  ds: A quality or state itself serves as subject.
  lb: adjp-pred--quality-subject
  ex:
    segments:
      - word: tai4--too
      - word: wan3--late
      - word: bu4--not
      - word: hao3--good
      - punctuation: 。
    translation: Being too late is not good.
    grammar:
      - adjp-pred--quality-subject

# Degree, scope and time adverbs (printed p. 389).
# 一块儿 extends 一起's joint-activity pattern; 常常 extends 常/经常's frequency pattern.
# 回 is an occurrence-counter alternative to 次; no new action-count syntax.
- id: zh-hsk2026-g278
  pt: 比较 + <adjective>
  pr: bǐ jiào + <adjective>
  ds: Relatively or fairly; no explicit comparison object follows 比较.
  lb: bi3-jiao4-adj--fairly
  ex:
    segments:
      - word: zhe4--this
      - word: ge4--classifier
      - word: ban4-fa3--method
      - word: bi3-jiao4--relatively
      - word: jian3-dan1--simple
      - punctuation: 。
    translation: This method is fairly simple.
    grammar:
      - bi3-jiao4-adj--fairly
      - zhe4-or-na4-mw-n--this-that

- id: zh-hsk2026-g266
  pt: (别的 / 其他) + <noun>
  pr: (bié de / qí tā) + <noun>
  ds: Other members; understood nouns can be omitted.
  lb: bie2-de5-or-qi2-ta1-n--other
  ex:
    segments:
      - word: wo3--me
      - word: xiang3--want
      - word: kan4--watch
      - word: bie2-de5--other
      - word: dian4-ying3--movie
      - punctuation: 。
    translation: I want to watch another movie.
    grammar:
      - bie2-de5-or-qi2-ta1-n--other
      - s-xiang3-vp--want

- id: zh-hsk2026-g322
  pt: 不 + <first adjective> + 不 + <contrasting adjective>
  pr: bù + <first adjective> + bù + <contrasting adjective>
  ds: Neither extreme, in conventional paired descriptions; not every 不A不B idiom.
  lb: bu4-adj-bu4-adj--neither-extreme
  ex:
    segments:
      - word: zhe4--this
      - word: jia1--classifier
      - word: dian4--shop
      - word: bu4--not
      - word: da4--big
      - word: bu4--not
      - word: xiao3--small
      - punctuation: 。
    translation: This shop is neither big nor small.
    grammar:
      - bu4-adj-bu4-adj--neither-extreme

- id: zh-hsk4-g001
  pt: 不但 + <first clause>，而且 + <stronger clause>
  pr: bù dàn + <first clause>, ér qiě + <stronger clause>
  ds: Strengthen an added point; subject position follows shared versus distinct subjects.
  lb: bu4-dan4-clause-er2-qie3-clause--not-only
  ex:
    segments:
      - word: ta1--he
      - word: bu4-dan4--not-only
      - word: ai4--love
      - word: he1--drink
      - word: cha2--tea
      - punctuation: ，
      - word: er2-qie3--also
      - word: ai4--love
      - word: he1--drink
      - word: ka1-fei1--coffee
      - punctuation: 。
    translation: He not only likes tea, but also likes coffee.
    grammar:
      - bu4-dan4-clause-er2-qie3-clause--not-only

# Questions and special sentences (printed p. 391).
- id: zh-hsk2026-g358
  pt: 不是 + <statement> + 吗？
  pr: bù shì + <statement> + ma?
  ds: Rhetorical reminder expecting agreement with the underlying positive statement.
  lb: bu4-shi4-stmt-ma5--remind
  ex:
    segments:
      - word: ta1--he
      - word: bu4--not
      - word: shi4--identity
      - word: zhong1-guo2--china
      - word: ren2--person
      - word: ma5--question
      - punctuation: ？
    translation: Isn’t he Chinese?
    grammar:
      - bu4-shi4-stmt-ma5--remind
      - stmt-ma5--yes-no
      - s-shi4-n--identity
      - s-bu4-pred--not

- id: zh-hsk2026-g323
  pt: 不一会儿，<event clause>
  pr: bù yī huì r, <event clause>
  ds: 不一会儿 introduces an event after a short interval.
  lb: bu4-yi1-hui4-r5-clause--soon-after
  ex:
    segments:
      - word: bu4-yi1-hui4-r5--shortly
      - punctuation: ，
      - word: lao3-shi1--teacher
      - word: lai2--come
      - word: le5--completed
      - punctuation: 。
    translation: After a little while, the teacher came.
    grammar:
      - bu4-yi1-hui4-r5-clause--soon-after

- id: zh-hsk2026-g309
  pt: 才 + <quantity>
  pr: cái + <quantity>
  ds: An amount smaller than expected.
  lb: cai2-qty--only
  ex:
    segments:
      - word: ta1--he
      - word: cai2--only
      - word: er4--two
      - word: shi2--ten
      - word: sui4--age
      - punctuation: 。
    translation: He is only twenty years old.
    grammar:
      - cai2-qty--only
      - p-age-sui4--age

- id: zh-hsk2026-g300
  pt: 差不多 + <quantity>
  pr: chà bu duō + <quantity>
  ds: Approximately an amount; lexical 不 is neutral here.
  lb: cha4-bu5-duo1-qty--approximately
  ex:
    segments:
      - word: zhe4--this
      - word: tiao2--classifier
      - word: lu4--road
      - word: cha4-bu5-duo1--almost
      - word: yi1--one
      - word: bai3--hundred
      - word: mi3--meter
      - punctuation: 。
    translation: This road is about one hundred meters long.
    grammar:
      - cha4-bu5-duo1-qty--approximately

- id: zh-hsk2026-g330
  pt: 除了 + <exception> + 以外，<remaining group> + 都 + <predicate>
  pr: chú le + <exception> + yǐ wài, <remaining group> + dōu + <predicate>
  ds: Exclude an exception before a universal statement; 以外 optional.
  lb: chu2-le5-except-yi3-wai4-group-dou1-pred--except
  ex:
    segments:
      - word: chu2-le5--except
      - word: di4-di5--brother
      - word: yi3-wai4--apart
      - punctuation: ，
      - word: wo3-men5--we
      - word: dou1--all
      - word: he1--drink
      - word: ka1-fei1--coffee
      - punctuation: 。
    translation: Except for my younger brother, we all drink coffee.
    grammar:
      - chu2-le5-except-yi3-wai4-group-dou1-pred--except
      - group-dou1-pred--all

- id: zh-hsk3-g010
  pt: 除了 + <included item> + 以外，<subject> + (还 / 也) + <predicate>
  pr: chú le + <included item> + yǐ wài, <subject> + (hái / yě) + <predicate>
  ds: Inclusive addition of a fact or participant; 以外 may be omitted.
  lb: chu2-le5-np-yi3-wai4-s-hai2-or-ye3-pred--besides
  ex:
    segments:
      - word: chu2-le5--besides
      - word: cha2--tea
      - word: yi3-wai4--apart
      - punctuation: ，
      - word: ta1--he
      - word: ye3--also
      - word: he1--drink
      - word: ka1-fei1--coffee
      - punctuation: 。
    translation: Besides tea, he also drinks coffee.
    grammar:
      - chu2-le5-np-yi3-wai4-s-hai2-or-ye3-pred--besides
      - s-ye3-pred--also

- id: zh-hsk2026-g377
  pt: <condition clause> + 的话，就 + <result clause>
  pr: <condition clause> + de huà, jiù + <result clause>
  ds: 的话 follows the condition; not literal speech.
  lb: clause-de5-hua4-jiu4-clause--if
  ex:
    segments:
      - word: ni3--you
      - word: you3--have
      - word: shi2-jian1--time
      - word: de5-hua4--if
      - punctuation: ，
      - word: jiu4--then
      - word: gei3--to
      - word: wo3--me
      - word: da3-dian4-hua4--phone
      - punctuation: 。
    translation: If you have time, then call me.
    grammar:
      - clause-de5-hua4-jiu4-clause--if
      - clause-jiu4-clause--then
      - gei3-p-vp--for-to

- id: zh-hsk2026-g320
  pt: <clause one>，(可 / 可是) + <contrasting clause>
  pr: <clause one>, (kě / kě shì) + <contrasting clause>
  ds: Contrast; 可 is conjunction kě, not the possibility modal.
  lb: clause-ke3-or-ke3-shi4-clause--but
  ex:
    segments:
      - word: wo3--me
      - word: xiang3--want
      - word: qu4--go
      - punctuation: ，
      - word: ke3-shi4--but
      - word: jin1-tian1--today
      - word: mei2-you3--possession
      - word: shi2-jian1--time
      - punctuation: 。
    translation: I want to go, but I do not have time today.
    grammar:
      - clause-ke3-or-ke3-shi4-clause--but
      - s-mei2-you3-np--absence

- id: zh-hsk2026-g331
  pt: 从 + <starting time> + 起，<statement>
  pr: cóng + <starting time> + qǐ, <statement>
  ds: Mark the starting boundary explicitly with 起.
  lb: cong2-time-qi3-stmt--from-on
  ex:
    segments:
      - word: cong2--from
      - word: ming2-tian1--tomorrow
      - word: qi3--starting-from
      - punctuation: ，
      - word: wo3--me
      - word: zai4--location
      - word: jia1--home
      - word: gong1-zuo4--work
      - punctuation: 。
    translation: Starting tomorrow, I will work at home.
    grammar:
      - cong2-time-qi3-stmt--from-on
      - s-zai4-loc-vp--location

# Approximate numbers (printed p. 391).
- id: zh-hsk2026-g379
  pt: 大概 + <number> + <measure word> + <noun>
  pr: dà gài + <number> + <measure word> + <noun>
  ds: Approximate quantity rather than probability of a whole statement.
  lb: da4-gai4-num-mw-n--about
  ex:
    segments:
      - word: jin1-tian1--today
      - word: lai2--come
      - word: le5--completed
      - word: da4-gai4--roughly
      - word: shi2--ten
      - word: ge4--classifier
      - word: xue2-sheng5--student
      - punctuation: 。
    translation: About ten students came today.
    grammar:
      - da4-gai4-num-mw-n--about
      - num-mw-n--count

- id: zh-hsk2026-g306
  pt: 当然 + <statement>
  pr: dāng rán + <statement>
  ds: Present something as expected or unsurprising.
  lb: dang1-ran2-stmt--of-course
  ex:
    segments:
      - word: ni3--you
      - word: dang1-ran2--certainly
      - word: ke3-yi3--permission
      - word: lai2--come
      - punctuation: 。
    translation: Of course you can come.
    grammar:
      - dang1-ran2-stmt--of-course
      - s-neng2-or-ke3-yi3-vp--can-may

- id: zh-hsk2026-g256
  pt: (东方 / 南方 / 西方 / 北方) + <location predicate>
  pr: (dōng fāng / nán fāng / xī fāng / běi fāng) + <location predicate>
  ds: Direction or region as a nominal; 西方 need not mean Western countries.
  lb: dong1-fang1-or-nan2-fang1-or-xi1-fang1-or-bei3-fang1-pred--region
  ex:
    segments:
      - word: nan2-fang1--south
      - word: you3--have
      - word: hao3-duo1--many
      - word: xue2-xiao4--school
      - punctuation: 。
    translation: There are many schools in the south.
    grammar:
      - dong1-fang1-or-nan2-fang1-or-xi1-fang1-or-bei3-fang1-pred--region
      - loc-you3-qty-n--exist
      - hao3-duo1-n--many

- id: zh-hsk2026-g332
  pt: 对 + <reference noun phrase> + 来说，<judgement>
  pr: duì + <reference noun phrase> + lái shuō, <judgement>
  ds: Scope an evaluation to a person, group or relevant entity.
  lb: dui4-np-lai2-shuo1-stmt--for
  ex:
    segments:
      - word: dui4--toward
      - word: hai2-zi5--child
      - word: lai2-shuo1--perspective
      - punctuation: ，
      - word: zhe4--this
      - word: ge4--classifier
      - word: wen4-ti2--question
      - word: tai4--too
      - word: nan2--difficult
      - word: le5--intensify
      - punctuation: 。
    translation: For children, this question is too difficult.
    grammar:
      - dui4-np-lai2-shuo1-stmt--for
      - zhe4-or-na4-mw-n--this-that
      - tai4-adj-le5--so-too

- id: zh-hsk2026-g357
  pt: <bounded event> + <elapsed interval> + 了
  pr: <bounded event> + <elapsed interval> + le
  ds: Time since an event ended; not duration of the action itself.
  lb: event-duration-le5--since-event
  ex:
    segments:
      - word: ba4-ba5--dad
      - word: chu1-yuan4--discharged
      - word: liang3--two
      - word: tian1--day
      - word: le5--change
      - punctuation: 。
    translation: It has been two days since Dad left the hospital.
    grammar:
      - event-duration-le5--since-event
      - num-nian2-or-tian1-or-fen1--duration

- id: zh-hsk2026-g252
  pt: <field stem> + 家
  pr: <field stem> + jiā
  ds: Specialist or expert suffix in established words, not freely productive.
  lb: field-jia1--expert
  ex:
    segments:
      - word: ta1--she
      - word: shi4--identity
      - word: yin1-yue4--music
      - word: jia1--specialist
      - punctuation: 。
    translation: She is a musician.
    grammar:
      - field-jia1--expert
      - s-shi4-n--identity

- id: zh-hsk2026-g337
  pt: 该 + <verb phrase> + 了
  pr: gāi + <verb phrase> + le
  ds: It is time to act; not only general advice.
  lb: gai1-vp-le5--time-to
  ex:
    segments:
      - word: gai1--should
      - word: shui4-jiao4--sleep
      - word: le5--change
      - punctuation: 。
    translation: It is time to sleep.
    grammar:
      - gai1-vp-le5--time-to
      - state-le5--change

- id: zh-hsk2026-g318
  pt: 根据 + <basis>，<statement>
  pr: gēn jù + <basis>, <statement>
  ds: Ground a decision or inference in a stated basis.
  lb: gen1-ju4-basis-stmt--according-to
  ex:
    segments:
      - word: gen1-ju4--according
      - word: di4-tu2--map
      - punctuation: ，
      - word: ji1-chang3--airport
      - word: zai4--location
      - word: xue2-xiao4--school
      - word: bei3--north
      - word: bian1--side
      - punctuation: 。
    translation: According to the map, the airport is north of the school.
    grammar:
      - gen1-ju4-basis-stmt--according-to
      - loc-dong1-or-nan2-or-xi1-or-bei3--direction
      - dir-bian1--side

- id: zh-hsk2026-g280
  pt: 更 + <adjective>
  pr: gèng + <adjective>
  ds: Greater degree relative to an explicit or understood baseline.
  lb: geng4-adj--more
  ex:
    segments:
      - word: jin1-tian1--today
      - word: geng4--more
      - word: leng3--cold
      - word: le5--change
      - punctuation: 。
    translation: It is colder today.
    grammar:
      - geng4-adj--more
      - state-le5--change

- id: zh-hsk4-g022
  pt: 关于 + <topic>，<statement>
  pr: guān yú + <topic>, <statement>
  ds: Introduce a discourse topic; not the target of an attitude.
  lb: guan1-yu2-topic-stmt--about
  ex:
    segments:
      - word: guan1-yu2--about
      - word: zhe4--this
      - word: ge4--classifier
      - word: wen4-ti2--question
      - punctuation: ，
      - word: wo3-men5--we
      - word: ming2-tian1--tomorrow
      - word: zai4--again
      - word: shuo1--speak
      - punctuation: 。
    translation: About this question, we can talk tomorrow.
    grammar:
      - guan1-yu2-topic-stmt--about
      - s-zai4-vp--again

- id: zh-hsk2026-g279
  pt: 还 + <adjective>
  pr: hái + <adjective>
  ds: Fairly or acceptably; distinct from still and additive 还.
  lb: hai2-adj--fairly
  ex:
    segments:
      - word: zhe4--this
      - word: ge4--classifier
