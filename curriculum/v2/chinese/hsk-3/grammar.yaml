# 节 jie2 lessons/segments; 所 suo3 institutions; 班 ban1 scheduled services;
# 段 duan4 stretches; 头 tou2 livestock; 句 ju4 sentences.
# 公斤/斤/米 use earlier direct unit counting; 角/毛 extend money units, 刻 time units.
# Their quantity meanings and readings are established in cumulative vocabulary.
# 所 and measure-word 班 are explicit grammar introductions where vocabulary lacks that use.
