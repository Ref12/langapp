# HSK 3 additions to hsk-1 and hsk-2; not a standalone cumulative list.
# 639 incremental senses after grammar-prerequisite additions and earlier moves.
# Baseline: 604 senses, 593 for numbered rows 501-1000 and
# 11 for the seven earlier-row HSK 3 extensions (33, 55, 81, 86, 266,
# 445, 471). Numbered rows, written forms, readings, and senses are distinct.
# The 500 new rows contain 499 written forms (two readings of 得); eight forms
# appeared earlier with different uses, so 491 written forms are newly added.
# Basis: November 2025 examination syllabus, effective July 2026; not the
# 2021 educational standard or legacy HSK 2.0. Ordered by new syllabus row,
# followed by explicitly marked extensions to earlier headwords.
# Level-specific readings and parts of speech constrain each selection;
# parenthesized later-level uses and previously taught senses are excluded.
# English senses are an independently curated editorial draft, not an official
# sense list, reviewed teaching material, exam-readiness claim, or pass prediction.
# No lesson cutoffs, grammar/skill crosswalk, representative exam coverage,
# timing/scoring/listening/writing/unseen-mock evidence gates, or app wiring
# are established by this inventory.
#
# Fields: id = stable sense reference; ch = simplified Chinese; pr = citation
# pinyin; ds = concise English description; lb = human-readable authoring label.
# Labels use numbered citation tones (5 = neutral; v = umlaut u; r5 = erhua),
# not tone sandhi. IDs and labels are authoring references, not learner UI.
# Old hskN prefixes identify source provenance, NOT current exam membership.
# Canonical grouped sense IDs take precedence over their raw source aliases.
# Reserved original senses use zh-hsk2026-ROW-s301; their descriptions do not
# replace the meanings of any existing source IDs.
#
# Exam reference: ChineseTest / Chinese Testing International,
# https://www.chinesetest.cn/syllabus
