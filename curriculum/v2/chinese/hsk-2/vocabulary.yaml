# HSK 2 additions to hsk-1\vocabulary.yaml; not a standalone cumulative list.
# 280 incremental senses after grammar-prerequisite reconciliation.
# Baseline: 259 senses, 253 for rows 301-500 and six new uses of earlier words.
# Basis: November 2025 exam syllabus, effective July 2026.
# Covers numbered rows 301-500, then the new HSK 2 uses explicitly marked on
# earlier rows 46 (多), 61 (给), 71 (好), and 136 (那).
# The 200 numbered rows have 198 written forms: 过 and 花 each have two rows;
# 点 was already introduced with a different use in HSK 1. Together, the first
# 500 syllabus rows have 497 distinct written forms, not 500 distinct spellings.
# The baseline excludes later parts of speech; grammar prerequisites follow. Descriptions
# are a curated draft, not an official sense list or a claim of exam readiness.
# No lessons, grammar inventory, assessments, or app wiring are added here.
#
# Fields: id = stable sense reference; ch = simplified Chinese; pr = citation
# pinyin; ds = concise English description; lb = human-readable authoring label.
# Labels use numbered citation tones (5 = neutral; v = ü; r5 = erhua suffix),
# not sandhi. Matching source IDs and established labels are retained.
# The hskN ID prefix identifies the old source inventory, NOT the exam level.
# New sense references use zh-hsk2026-ROW-sNNN: 包 as a measure word (307),
# 高 as height (341), and 多 as an adverb meaning more (46).
#
# Exam reference: ChineseTest / Chinese Testing International,
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
