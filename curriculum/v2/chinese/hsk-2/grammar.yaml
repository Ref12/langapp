# HSK 2 incremental grammar draft; concise AI-facing meaning cues.
# Builds on frozen HSK 1; shared structures are not emitted again.
# Format: curriculum\v2\README.md. Fields: id, pt, pr, ds, lb, ex.
# Usage examples are original editorial sentences, not source quotations.
# Retained IDs preserve constructions; new IDs are authoring allocations.
#
# Source: ChineseTest / Chinese Testing International.
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
# Published November 2025; effective July 2026; retrieved 2026-09-16.
# Printed pp. 386-388 (PDF pp. 389-391). PDF SHA256:
# ec74ce0439e837bbb15154be13e747ae798903b2fd3a331629df6c3b45504941
# Original editorial templates/cues; no protected examples, exams or transcripts.
# AI editorial coverage, not independent review or evidence of exam readiness.
# Numbered adverb/particle senses lack definitions here; numeral mapping is provisional.
# Record order: ascending lb; lesson order is generated separately.
# Comments retain original source/editorial context; they do not define sorted ranges.

# Morphemes, location and verbs (printed p. 386).
# Separable 帮忙/游泳/跳舞/跑步 extend the lexical scope of HSK 1's separable pattern.

- id: zh-hsk2026-g115
  pt: <first adjective syllable> + <same first syllable> + <second adjective syllable> + <same second syllable>
  pr: <first adjective syllable> + <same first syllable> + <second adjective syllable> + <same second syllable>
  ds: AABB vivid description; only compatible disyllabic adjectives.
  lb: a-a-b-b--vivid
  ex:
    segments: [{word: ta1--he}, {word: gao1-gao1-xing4-xing4--cheerful}, {word: de5--adverbial}, {word: xiao4--smile}, {word: le5--completed}, {punctuation: 。}]
    translation: "He smiled happily."
    grammar: [a-a-b-b--vivid, adjp-de5-vp--manner, v-le5-obj--complete]

- id: zh-hsk2-g013
  pt: <compared item> + 比 + <reference item> + <adjective>
  pr: <compared item> + bǐ + <reference item> + <adjective>
  ds: Greater degree than a reference; normally no neutral 很.
  lb: a-bi3-b-adj--more
  ex:
    segments: [{word: nai3-cha2--tea}, {word: bi3--than}, {word: lv4-cha2--tea}, {word: gui4--expensive}, {punctuation: 。}]
    translation: "Milk tea is more expensive than green tea."
    grammar: [a-bi3-b-adj--more]

- id: zh-hsk2026-g176
  pt: <compared item> + 比 + <reference item> + <adjective> + 多了
  pr: <compared item> + bǐ + <reference item> + <adjective> + duō le
  ds: A much greater degree; 多了 is not an exact measurement.
  lb: a-bi3-b-adj-duo1-le5--much-more
  ex:
    segments: [{word: ji1-piao4--ticket}, {word: bi3--than}, {word: huo3-che1--train}, {word: piao4--ticket}, {word: gui4--expensive}, {word: duo1--many}, {word: le5--intensify}, {punctuation: 。}]
    translation: "Plane tickets are much more expensive than train tickets."
    grammar: [a-bi3-b-adj-duo1-le5--much-more, a-bi3-b-adj--more, n-n--modifier]

- id: zh-hsk2026-g175
  pt: <compared item> + 比 + <reference item> + <adjective> + <difference quantity>
  pr: <compared item> + bǐ + <reference item> + <adjective> + <difference quantity>
  ds: State how much the compared item exceeds the reference.
  lb: a-bi3-b-adj-qty--difference
  ex:
    segments: [{word: ge1-ge5--brother}, {word: bi3--than}, {word: wo3--me}, {word: da4--older}, {word: liang3--two}, {word: sui4--age}, {punctuation: 。}]
    translation: "My older brother is two years older than me."
    grammar: [a-bi3-b-adj-qty--difference, a-bi3-b-adj--more, adj-qty--difference]

- id: zh-hsk2026-g178
  pt: <compared item> + 比 + <reference item> + <verb> + 得 + <adjective>
  pr: <compared item> + bǐ + <reference item> + <verb> + de + <adjective>
  ds: Compare action performance rather than an object's quality.
  lb: a-bi3-b-v-de5-adj--performance
  ex:
    segments: [{word: mei4-mei5--sister}, {word: bi3--than}, {word: wo3--me}, {word: pao3--run}, {word: de5--manner}, {word: kuai4--fast}, {punctuation: 。}]
    translation: "My younger sister runs faster than me."
    grammar: [a-bi3-b-v-de5-adj--performance, v-de5-adjp--performance]

- id: zh-hsk2-g014
  pt: <compared item> + 没有 + <reference item> + <adjective>
  pr: <compared item> + méi yǒu + <reference item> + <adjective>
  ds: Less than the reference degree; 这么/那么 may precede the adjective.
  lb: a-mei2-you3-b-adj--not-as
  ex:
    segments: [{word: zhe4--this}, {word: tiao2--classifier}, {word: lu4--road}, {word: mei2-you3--less-than}, {word: na4--that}, {word: tiao2--classifier}, {word: lu4--road}, {word: chang2--long}, {punctuation: 。}]
    translation: "This road is not as long as that one."
    grammar: [a-mei2-you3-b-adj--not-as, zhe4-or-na4-mw-n--this-that]

- id: zh-hsk2026-g179
  pt: <compared item> + <verb> + 得 + 比 + <reference item> + <adjective>
  pr: <compared item> + <verb> + de + bǐ + <reference item> + <adjective>
  ds: Place the comparison inside a performance complement.
  lb: a-v-de5-bi3-b-adj--performance
  ex:
    segments: [{word: ta1--he}, {word: xie3--write}, {word: de5--manner}, {word: bi3--than}, {word: wo3--me}, {word: hao3--good}, {punctuation: 。}]
    translation: "He writes better than me."
    grammar: [a-v-de5-bi3-b-adj--performance, v-de5-adjp--performance]

- id: zh-hsk2026-g177
  pt: <compared item> + 有 + <reference item> + (这么 / 那么) + <adjective>
  pr: <compared item> + yǒu + <reference item> + (zhè me / nà me) + <adjective>
  ds: Reach the reference degree; 这么/那么 may be omitted.
  lb: a-you3-b-zhe4-me5-or-na4-me5-adj--as
  ex:
    segments: [{word: di4-di5--brother}, {word: you3--reach-degree}, {word: wo3--me}, {word: zhe4-me5--degree}, {word: gao1--tall}, {punctuation: 。}]
    translation: "My younger brother is as tall as me."
    grammar: [a-you3-b-zhe4-me5-or-na4-me5-adj--as]

- id: zh-hsk2026-g114
  pt: <monosyllabic adjective> + <same adjective> + 的
  pr: <monosyllabic adjective> + <same adjective> + de
  ds: Vivid AA description; 的 depends on syntactic position.
  lb: adj-adj-de5--vivid
  ex:
    segments: [{word: ta1--she}, {word: you3--have}, {word: da4--big}, {word: da4--big}, {word: de5--description}, {word: yan3-jing5--eye}, {punctuation: 。}]
    translation: "She has nice big eyes."
    grammar: [adj-adj-de5--vivid, s-you3-np--have, adjp-de5-n--describe]

- id: zh-hsk2026-g169
  pt: <gradable adjective> + <difference quantity>
  pr: <gradable adjective> + <difference quantity>
  ds: Measured difference after the adjective; comparison may be contextual.
  lb: adj-qty--difference
  ex:
    segments: [{word: zhe4--this}, {word: jian4--classifier}, {word: yi1-fu5--clothes}, {word: gui4--expensive}, {word: shi2--ten}, {word: kuai4--currency}, {punctuation: 。}]
    translation: "This item of clothing costs ten yuan more."
    grammar: [adj-qty--difference, zhe4-or-na4-mw-n--this-that, amt-yuan2-or-kuai4-or-fen1--money]

- id: zh-hsk2-g017
  pt: <adjective> + 一点儿
  pr: <adjective> + yī diǎn r
  ds: A little more; follows the adjective in comparisons or requests.
  lb: adj-yi1-dian3-r5--a-bit-more
  ex:
    segments: [{word: qing3--please}, {word: man4--slow}, {word: yi1-dian3-r5--little}, {punctuation: 。}]
    translation: "A little slower, please."
    grammar: [adj-yi1-dian3-r5--a-bit-more, qing3-vp--request]

# Particles and phrase building (printed pp. 386-387).
# 的 nominalization and certainty are distinct; numeral correspondence remains provisional.
- id: zh-hsk2026-g151
  pt: <manner adjective phrase> + 地 + <verb phrase>
  pr: <manner adjective phrase> + de + <verb phrase>
  ds: Explicit manner modification before the action.
  lb: adjp-de5-vp--manner
  ex:
    segments: [{word: ta1--he}, {word: gao1-xing4--happy}, {word: de5--adverbial}, {word: xiao4--smile}, {word: le5--completed}, {punctuation: 。}]
    translation: "He smiled happily."
    grammar: [adjp-de5-vp--manner, v-le5-obj--complete]

- id: zh-hsk1-g025
  pt: 别 + <verb phrase>
  pr: bié + <verb phrase>
  ds: Direct prohibition or preventive request.
  lb: bie2-vp--dont
  ex:
    segments: [{word: bie2--dont}, {word: ti1--kick}, {word: men2--door}, {punctuation: 。}]
    translation: "Don't kick the door."
    grammar: [bie2-vp--dont, v-obj--object]

- id: zh-hsk2026-g149
  pt: <clause one>，(但 / 但是) + <contrasting clause>
  pr: <clause one>, (dàn / dàn shì) + <contrasting clause>
  ds: Contrast without requiring an explicit concessive first marker.
  lb: clause-dan4-or-dan4-shi4-clause--but
  ex:
    segments: [{word: fan4-guan3--restaurant}, {word: hen3--very}, {word: xiao3--small}, {punctuation: ，}, {word: dan4--but}, {word: cai4--dish}, {word: hen3--very}, {word: hao3-chi1--tasty}, {punctuation: 。}]
    translation: "The restaurant is small, but the food is delicious."
    grammar: [clause-dan4-or-dan4-shi4-clause--but, s-hen3-adj--describe]

- id: zh-hsk2026-g137
  pt: <trigger clause>，就 + <result clause>
  pr: <trigger clause>, jiù + <result clause>
  ds: Contextual consequence or prompt next event.
  lb: clause-jiu4-clause--then
  ex:
    segments: [{word: wo3--me}, {word: dao4--arrive}, {word: jia1--home}, {word: jiu4--immediately-after}, {word: shui4-jiao4--sleep}, {punctuation: 。}]
    translation: "I go to sleep as soon as I get home."
    grammar: [clause-jiu4-clause--then, s-vp--verbal]

- id: zh-hsk2026-g153
  pt: <question clause> + 呢？
  pr: <question clause> + ne?
  ds: Context-sensitive questioning tone; not a universal substitute for 吗.
  lb: clause-ne5--question-tone
  ex:
    segments: [{word: ta1--he}, {word: wei4-shen2-me5--why}, {word: bu4--not}, {word: gao1-xing4--happy}, {word: ne5--question}, {punctuation: ？}]
    translation: "Why is he unhappy?"
    grammar: [clause-ne5--question-tone, s-wei4-shen2-me5-pred--why, s-bu4-pred--not]

- id: zh-hsk2026-g143
  pt: 从 + <starting place> + <motion phrase>
  pr: cóng + <starting place> + <motion phrase>
  ds: Spatial point of departure.
  lb: cong2-loc-vp--from
  ex:
    segments: [{word: ta1--he}, {word: cong2--from}, {word: jiao4-shi4--classroom}, {word: chu1-lai2--come-out}, {punctuation: 。}]
    translation: "He comes out of the classroom."
    grammar: [cong2-loc-vp--from, s-vp--verbal]

- id: zh-hsk2026-g145
  pt: 从 + <route> + <motion phrase>
  pr: cóng + <route> + <motion phrase>
  ds: Route through or past a place; not necessarily departure.
  lb: cong2-route-vp--via
  ex:
    segments: [{word: qing3--please}, {word: cong2--via}, {word: zhe4-bian1--this-side}, {word: zou3--walk}, {punctuation: 。}]
    translation: "Please walk this way."
    grammar: [cong2-route-vp--via, qing3-vp--request]

# Prepositions and conjunctions (printed p. 386).
- id: zh-hsk2026-g142
  pt: 从 + <starting time> + <verb phrase>
  pr: cóng + <starting time> + <verb phrase>
  ds: Starting time of a compatible continuing or repeated action.
  lb: cong2-time-vp--since
  ex:
    segments: [{word: wo3--me}, {word: cong2--from}, {word: qu4-nian2--year}, {word: kai1-shi3--begin}, {word: xue2--learn}, {word: han4-yu3--chinese}, {punctuation: 。}]
    translation: "I started learning Chinese last year."
    grammar: [cong2-time-vp--since, v-obj--object]
- id: zh-hsk2026-g101
  pt: <direction> + 面
  pr: <direction> + miàn
  ds: Location suffix; established compounds may reduce its tone.
  lb: dir-mian4--side
  ex:
    segments: [{word: qian2--front}, {word: mian4--side}, {word: shi4--identity}, {word: che1-zhan4--stop}, {punctuation: 。}]
    translation: "The bus stop is up ahead."
    grammar: [dir-mian4--side, loc-shi4-np--identify]

- id: zh-hsk2026-g138
  pt: 都 + <situation> + 了
  pr: dōu + <situation> + le
  ds: Emphatic already, often later or greater than expected; not all.
  lb: dou1-state-le5--already
  ex:
    segments: [{word: dou1--already}, {word: shi2--ten}, {word: yi1--one}, {word: dian3--oclock}, {word: le5--change}, {punctuation: ！}]
    translation: "It's already eleven o'clock!"
    grammar: [dou1-state-le5--already, tens-shi2-ones--tens, time-hour-dian3-min-fen1--clock, state-le5--change]

# Adverbs (printed p. 386).
# 常 and 有时候 are explicit frequency expressions; standalone 常 is later vocabulary.
- id: zh-hsk2026-g127
  pt: 多 + <adjective> + 啊！
  pr: duō + <adjective> + a!
  ds: Exclaim at a high degree, not ask a measurement.
  lb: duo1-adj-a5--how
  ex:
    segments: [{word: zhe4--this}, {word: zhi1--classifier}, {word: niao3--bird}, {word: duo1--how}, {word: piao4-liang5--pretty}, {word: a5--particle}, {punctuation: ！}]
    translation: "What a beautiful bird!"
    grammar: [duo1-adj-a5--how, zhe4-or-na4-mw-n--this-that]

- id: zh-hsk2-g024
  pt: 给 + <person> + <verb phrase>
  pr: gěi + <person> + <verb phrase>
  ds: Recipient or beneficiary before a compatible action.
  lb: gei3-p-vp--for-to
  ex:
    segments: [{word: wo3--me}, {word: gei3--for}, {word: nai3-nai5--grandmother}, {word: mai3--buy}, {word: yao4--medicine}, {punctuation: 。}]
    translation: "I buy medicine for Grandma."
    grammar: [gei3-p-vp--for-to, v-obj--object]

- id: zh-hsk2026-g129
  pt: <plural subject> + 一起 + <verb phrase>
  pr: <plural subject> + yī qǐ + <verb phrase>
  ds: Act together, not merely perform the same action separately.
  lb: group-yi1-qi3-vp--together
  ex:
    segments: [{word: wo3-men5--we}, {word: yi1-qi3--together}, {word: you2-yong3--swim}, {punctuation: 。}]
    translation: "We swim together."
    grammar: [group-yi1-qi3-vp--together, s-vp--verbal]

- id: zh-hsk2026-g140
  pt: 还是 + <verb phrase> + 吧
  pr: hái shi + <verb phrase> + ba
  ds: Prefer this action after considering alternatives.
  lb: hai2-shi5-vp-ba5--better
  ex:
    segments: [{word: hai2-shi5--better}, {word: zuo4--ride}, {word: di4-tie3--subway}, {word: ba5--suggestion}, {punctuation: 。}]
    translation: "We'd better take the subway."
    grammar: [hai2-shi5-vp-ba5--better, stmt-ba5--suggest, v-obj--object]

- id: zh-hsk2026-g128
  pt: 好 + <adjective>！
  pr: hǎo + <adjective>!
  ds: Emphatic high degree; often an immediate reaction.
  lb: hao3-adj--so
  ex:
    segments: [{word: zhe4-li3--here}, {word: hao3--very}, {word: shu1-fu5--comfortable}, {punctuation: ！}]
    translation: "It's so comfortable here!"
    grammar: [hao3-adj--so, zhe4-li3-or-zhe4-r5-or-na4-li5-or-na4-r5-pred--place]

- id: zh-hsk2026-g117
  pt: 好多 + <noun>
  pr: hǎo duō + <noun>
  ds: 好多 introduces an informal large unspecified quantity.
  lb: hao3-duo1-n--many
  ex:
    segments: [{word: men2-kou3--entrance}, {word: you3--have}, {word: hao3-duo1--many}, {word: che1--car}, {punctuation: 。}]
    translation: "There are lots of cars at the entrance."
    grammar: [hao3-duo1-n--many, loc-you3-qty-n--exist]

- id: zh-hsk2026-g120
  pt: 几 + <measure word> + <noun>
  pr: jǐ + <measure word> + <noun>
  ds: Several in an assertion, not an information-seeking question.
  lb: ji3-mw-n--several
  ex:
    segments: [{word: wo3--me}, {word: mai3--buy}, {word: le5--completed}, {word: ji3--several}, {word: ben3--books}, {word: ben3-zi5--notebook}, {punctuation: 。}]
    translation: "I bought a few notebooks."
    grammar: [ji3-mw-n--several, v-le5-obj--complete, num-mw-n--count]

- id: zh-hsk2026-g141
  pt: 就要 + <verb phrase> + 了
  pr: jiù yào + <verb phrase> + le
  ds: Event is imminent; compatible with an explicit near-future time.
  lb: jiu4-yao4-vp-le5--soon
  ex:
    segments: [{word: ming2-tian1--tomorrow}, {word: jiu4--earlier-than-expected}, {word: yao4--about-to}, {word: kai1-xue2--term}, {word: le5--change}, {punctuation: 。}]
    translation: "School starts as early as tomorrow."
    grammar: [jiu4-yao4-vp-le5--soon, time-jiu4-vp--early, state-le5--change]

- id: zh-hsk2026-g133
  pt: 快 + <verb phrase> + 了
  pr: kuài + <verb phrase> + le
  ds: Event will happen soon; 快 is imminence, not speed.
  lb: kuai4-vp-le5--soon
  ex:
    segments: [{word: dian4-ying3--movie}, {word: kuai4--soon}, {word: kai1-shi3--begin}, {word: le5--change}, {punctuation: 。}]
    translation: "The movie is about to begin."
    grammar: [kuai4-vp-le5--soon, state-le5--change]

- id: zh-hsk2026-g174
  pt: <place> + <verb> + 着 + <optional quantity> + <noun>
  pr: <place> + <verb> + zhe + <optional quantity> + <noun>
  ds: An entity exists in a maintained position or state.
  lb: loc-v-zhe5-qty-n--exist
  ex:
    segments: [{word: men2-kou3--entrance}, {word: zuo4--sit}, {word: zhe5--ongoing}, {word: yi1--one}, {word: wei4--people}, {word: lao3-shi1--teacher}, {punctuation: 。}]
    translation: "A teacher is sitting at the entrance."
    grammar: [loc-v-zhe5-qty-n--exist, v-zhe5--state, num-mw-n--count]

- id: zh-hsk2026-g113
  pt: 每 + <measure word> + <noun> + 都 + <predicate>
  pr: měi + <measure word> + <noun> + dōu + <predicate>
  ds: Every member; 一 may precede the measure word.
  lb: mei3-mw-n-dou1-pred--every
  ex:
    segments: [{word: mei3--every}, {word: ge4--classifier}, {word: xue2-sheng5--student}, {word: dou1--all}, {word: ren4-shi5--know}, {word: ta1--he}, {punctuation: 。}]
    translation: "Every student knows him."
    grammar: [mei3-mw-n-dou1-pred--every, group-dou1-pred--all, v-obj--object]

- id: zh-hsk2026-g157
  pt: <modifier> + 的
  pr: <modifier> + de
  ds: Nominal expression with an understood head noun.
  lb: mod-de5--nominal
  ex:
    segments: [{word: wo3--me}, {word: yao4--want}, {word: hong2-se4--red}, {word: de5--nominalizer}, {punctuation: 。}]
    translation: "I want the red one."
    grammar: [mod-de5--nominal, v-obj--object]

- id: zh-hsk2026-g102
  pt: <noun> + (左 / 右)
  pr: <noun> + (zuǒ / yòu)
  ds: Left or right relative to a reference noun.
  lb: n-zuo3-or-you4--side
  ex:
    segments: [{word: men2--door}, {word: zuo3--left}, {word: shi4--identity}, {word: jiao4-shi4--classroom}, {punctuation: ，}, {word: men2--door}, {word: you4--right}, {word: shi4--identity}, {word: xi3-shou3-jian1--restroom}, {punctuation: 。}]
    translation: "The classroom is to the left of the door, and the restroom is to the right."
    grammar: [n-zuo3-or-you4--side, loc-shi4-np--identify, clause-clause--linked]

- id: zh-hsk2026-g150
  pt: 那 + <consequent statement>
  pr: nà + <consequent statement>
  ds: In that case; discourse consequence, not a demonstrative noun modifier.
  lb: na4-stmt--then
  ex:
    segments: [{word: ni3--you}, {word: bu4--not}, {word: he1--drink}, {word: cha2--tea}, {punctuation: ？}, {word: na4--then}, {word: he1--drink}, {word: shui3--water}, {word: ba5--suggestion}, {punctuation: 。}]
    translation: "You don't drink tea? Then have some water."
    grammar: [na4-stmt--then, s-bu4-pred--not, stmt-ba5--suggest]

- id: zh-hsk2026-g148
  pt: <noun phrase> + 跟 + <noun phrase>
  pr: <noun phrase> + gēn + <noun phrase>
  ds: Coordinate noun phrases, not arbitrary complete clauses.
  lb: np-gen1-np--and
  ex:
    segments: [{word: ye2-ye5--grandfather}, {word: gen1--and}, {word: nai3-nai5--grandmother}, {word: dou1--all}, {word: zai4--location}, {word: jia1--home}, {punctuation: 。}]
    translation: "Grandpa and Grandma are both at home."
    grammar: [np-gen1-np--and, group-dou1-pred--all, s-zai4-loc--at]

- id: zh-hsk2026-g158
  pt: <example noun phrase> + 什么的
  pr: <example noun phrase> + shén me de
  ds: 什么的 means and similar things; not an actual what-question.
  lb: np-shen2-me5-de5--and-such
  ex:
    segments: [{word: wo3--me}, {word: xiang3--want}, {word: mai3--buy}, {word: bi3--pen}, {punctuation: 、}, {word: ben3-zi5--notebook}, {word: shen2-me5-de5--and-so-on}, {punctuation: 。}]
    translation: "I'd like to buy pens, notebooks, and things like that."
    grammar: [np-shen2-me5-de5--and-such, s-xiang3-vp--want, v-obj--object]

- id: zh-hsk2026-g118
  pt: <round number> + 多 + <measure word> + <noun>
