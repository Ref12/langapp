# HSK 6 additions to the earlier v2 levels; not a standalone cumulative list.
# 2272 incremental senses after grammar-prerequisite additions and earlier moves.
# Baseline: 2265 senses, 2245 for all 1,800 numbered rows 3601-5400,
# then 20 level-6 uses on 15 earlier numbered rows.
# Earlier extensions: 358, 431, 440, 492, 573, 630, 685, 775, 1139, 1480,
# 1754, 1999, 2497, 2677, and 2852. Numbered rows, spellings, readings, and
# selected senses are different counts. Repeated homographs remain distinct.
# Basis: November 2025 HSK exam syllabus, effective July 2026; not the
# 2021 educational bands or legacy HSK 2.0. Parenthesized parts of speech
# govern their marked levels. Later uses of 尽, 盘, and 则 are excluded.
# Every row has an explicit AI-assisted editorial selection; this is a draft
# requiring independent human semantic and pedagogical review, not an official
# sense list, certification, pass prediction, or claim of full exam readiness.
# Earlier-level senses are not repeated; shared authoring labels are unique.
# No lessons, grammar crosswalk, assessments, or app wiring are added here.
#
# Fields: id = stable sense reference; ch = simplified Chinese; pr = citation
# pinyin; ds = concise English description; lb = human-readable authoring label.
# Labels use numbered citation tones (5 = neutral; v = ü; r5 = erhua),
# not sandhi. Matching source IDs and established labels are retained.
# The hskN prefixes identify the old source inventory, not the exam level.
# Original missing senses use zh-hsk2026-ROW-s601 through s699; row numbers
# always refer to the official numbered entry, including earlier extensions.
# Original uses and repairs are recorded in the session review manifest.
# Source defects such as surname-only 怀/雷, narrow glosses, and corrupted
# supplemental pinyin are not used as fallback learner definitions.
#
# Exam reference: ChineseTest / Chinese Testing International,
# https://www.chinesetest.cn/syllabus
# https://hsk.cn-bj.ufileos.com/3.0/%E6%96%B0%E7%89%88HSK%E8%80%83%E8%AF%95%E5%A4%A7%E7%BA%B21219.pdf
