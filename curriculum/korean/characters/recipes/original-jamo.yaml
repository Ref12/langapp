review_notes:
- All coordinates and pen-down groupings are original AI-assisted candidates, not qualified Korean instruction.
- Compound and doubled letter placements preserve uniform component scale; no per-glyph bounding-box fitting occurs.
- Wide HIEUH and doubled/cluster forms can become dense at fixed width 5.5; inspect explicit clearance warnings before scaling.
- Short nonzero strokes approximate punctuation pen taps; no zero-length placeholder paths are used.
- Revision 2 uses the requested vertical-tick HIEUH/CHIEUCH handwriting variant; horizontal-cap variants also exist.
- Narrow paired masters retain component height instead of shrinking ordinary letters in both axes.
- Joined and lower-arm vowel forms preserve crossbar topology and distinguish WEO/WE from a continuous horizontal bar.
