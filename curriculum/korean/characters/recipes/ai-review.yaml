version: '1'
status: ai-reviewed-human-gate-open
human_reviewed: false
statement: >-
  An AI reviewer checked the letter, composite-letter and block-layout sheets and a contact sheet of the TOPIK 1
  syllables against standard Korean stroke order and direction. This is not a human review and does not lift the
  pilot's gate: the learner still looks over the sheets (scripts/korean-review-sheets.mjs, and the preview next to
  this file) and decides. Syllables made from these recipes are marked ai-reviewed, never reviewed.
reviewer:
  kind: vision-capable AI model, single reviewer, no helper sessions
  model: claude-opus-5.5
  date: '2026-11-08'
sheets:
  letter_masters: every consonant master with its contextual forms (isolated, side, wide, paired-*, hieuh-*), numbered strokes and direction arrows
  vowel_masters: every vowel master with joined, lower-arm and before-* forms
  composites: 5 doubled consonants, 11 compound vowels, 11 final clusters
  layouts: one sample per block layout (가 간 고 곤 과 괜) plus 값 깎 읊 횡
  syllables: contact sheets of all 514 TOPIK 1 syllables (10 images)
checked: stroke order, stroke direction (top to bottom, left to right, ㅇ from the top counter-clockwise), stroke counts, part order (initial, vowel, final), legibility
order_and_direction_findings: none. No letter, composite or layout was reported with a wrong stroke order or direction after the sheet numbering was made legible.
first_pass_findings_fixed:
  - cell: ㅎ hieuh-mixed (block 횡)
    issue: initial too crowded; its circle touched the vowel's first stroke
    fix: bar and circle raised, circle bottom moved from y112 to y100 in original-jamo.yaml
  - cell: ㅎ wide and paired-wide
    issue: flat circle almost touched the bar
    fix: circle lowered (gap 10 to 15 before the stroke width) in original-jamo.yaml
  - cell: 곤 (horizontal-final)
    issue: final ㄴ crowded the vowel ㅗ
    fix: horizontal-final medial moved up from y22 to y19 in original-layouts.yaml
  - cell: every sheet
    issue: start numbers hidden where strokes start at the same point; ㅇ direction unreadable
    fix: review-sheet renderer now offsets each number on a leader line and marks loop direction (not a data change)
reviewer_misreads:
  - Block-sample captions 값, 깎 and 읊 were read as other syllables; the drawings (ㅄ, ㄲ with ㅏ, ㄿ) are right.
  - Two syllable-sheet findings named 됩 and 쭉, which are not in the set; ignored.
  - Single-cell findings on 참 (ㅁ read as ㅇ) and 냉 were checked by eye and are not errors.
open_for_human_review:
  - Dense forms stay legible but tight: wide and paired-wide forms of ㅎ ㅍ ㅊ ㅂ, final clusters ㄼ ㄾ ㄿ ㄳ ㄵ ㄶ ㅀ ㅄ, doubled ㅃ ㅉ.
  - ㅅ and ㅈ paired-side forms are very narrow, nearly parallel strokes.
  - 횡 and other mixed-vowel blocks with ㅎ: the small initial sits close to the vowel.
  - 꽃, 닭, 짧 are crowded in the final area.
  - ㅈ is two strokes and ㄹ is three, both accepted by the reviewer as common handwriting; ㅓ writes its bar first.
excluded_syllables: []
