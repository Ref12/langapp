    notes:
      - "phrase 1:502 (lesson 43) dropped after 2 rewrites: Ungrammatical conjugation: 어리다 + 고 is fine, but the second clause 어려요 is the form of 어리다 as 어려요 (correct), however the tag 어려=ko-nikl-46392 is also used for 어리 and 어려 is actually the stem of 어렵다 (difficult), so the sentence reads as 'younger sister is difficult'. Write 언니는 어리고 여동생도 어려요 only if 어려요 is tagged as 어리다 + 어요 (어려요); otherwise use 언니는 어리고 여동생도 어려요 with correct tokens 어리 + 어요. Also, an older sister being young while the younger sister is too is a contrived line; prefer 여동생은 아주 어려요."
      - "phrase 1:1059 (lesson 43) dropped after 2 rewrites: Meaning mismatch and mistag: 어려요 as 'young' is 어려요 from 어리다, but a learner will read 어려요 as 'difficult' (어렵다 is 어려워요, not 어려요), so the tag 어려=ko-nikl-46392 is questionable. Also 'older sister is too young' is a contrived line. Write a natural line such as 동생은 너무 어려요 (The younger sibling is too young)."
