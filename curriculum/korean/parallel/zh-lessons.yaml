      - "phrase 1:1046 (lesson 35) dropped after 2 rewrites: '딸은 남자친구에게 감사해요' is unnatural and doesn't mean 'says thank you'. It is more like 'is grateful to'. Use 딸은 남자친구에게 고마워요 or 딸은 남자친구에게 고맙다고 말해요 (too advanced). Also 감사해요 with 에게 is a strained pairing."
