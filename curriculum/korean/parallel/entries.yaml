grammar:
  - id: ko-par-g001
    pattern: 평서문 + ?
    english: yes-no question with polite intonation
    note: Keep the statement word order and use a rising intonation; the polite present ending stays the same.
    source: parallel-authored
  - id: ko-par-g002
    pattern: 문맥에 분명한 주어는 생략해요
    english: omit a subject that is clear from context
    note: Korean often leaves out ‘you’; use a name or title when needed rather than a direct second-person pronoun.
    source: parallel-authored
  - id: ko-par-g003
    pattern: N + N
    english: a noun can modify the following noun
    note: The first noun specifies the type or topic of the second, as in 중국어 선생님.
    source: parallel-authored
  - id: ko-par-g004
    pattern: N은/는요?
    english: What about N?; a polite contextual follow-up question
    note: "Attach 요 to the topic-marked noun: 은 after a consonant, 는 after a vowel."
    source: parallel-authored
  - id: ko-par-g005
    pattern: N은/는 다 + predicate
    english: all N; place 다 before the predicate
    note: Korean commonly leaves plurality to context rather than marking every noun as plural.
    source: parallel-authored
  - id: ko-par-g006
    pattern: 아주 + 형용사
    english: very; a high degree before an adjective
    note: For example, 아주 좋아요 means “very good.”
    source: parallel-authored
  - id: ko-par-g007
    pattern: 조금 + 형용사
    english: a little; somewhat before an adjective
    note: For example, 조금 추워요 means “It's a little cold” or “I feel a little cold.”
    source: parallel-authored
  - id: ko-par-g008
    pattern: 시간 표현 + 주어 + 동사 / 주어 + 시간 표현 + 동사
    english: A time expression can come before the subject or after it, before the action.
    note: For example, 오늘 저는 요리해요 and 저는 오늘 요리해요.
    source: parallel-authored
  - id: ko-par-g009
    pattern: 시간이나 기간 + 동안 + 동사
    english: for a length of time; put 동안 after the duration and before the verb
    note: For example, 오 분 동안 쉬어요. In Korean, the duration phrase comes before the verb.
    source: parallel-authored
  - id: ko-par-g010
    pattern: N 조금
    english: a little of N; put 조금 after the noun
    note: For example, 밥 조금 주세요 means “A little rice, please.”
    source: parallel-authored
  - id: ko-par-g011
    pattern: 이
    english: this; before a noun
    source: parallel-authored
  - id: ko-par-g012
    pattern: N 전에
    english: before N
    note: Place 전에 after a noun, as in 수업 전에 (before class).
    source: parallel-authored
  - id: ko-par-g013
    pattern: 수사 + 년
    english: Express a calendar year with a number followed by 년.
    note: "Korean reads the complete number by place value: 이천이십육 년, not digit by digit."
    source: parallel-authored
  - id: ko-par-g014
    pattern: 수사 + 번
    english: Use 번 after a number to identify a numbered item, such as a room.
    note: For example, 삼 번 방 means room number three.
    source: parallel-authored
  - id: ko-par-g015
    pattern: 수사+시+반
    english: half past the stated hour
    note: "Put 반 after the hour: 여덟 시 반. Use a native Korean numeral before 시."
    source: parallel-authored
  - id: ko-par-g016
    pattern: N은/는 N이/가 있어요
    english: N has N; have something
    note: "For possession, mark the possessor with 은/는 and the thing possessed with 이/가: 저는 친구가 있어요."
    source: parallel-authored
  - id: ko-par-g017
    pattern: "열 + 하나~아홉 (수량 표현: 열한~열아홉)"
    english: form eleven to nineteen with native Korean numbers; use the counter forms before counters
    note: For example, 열다섯 권 and 열 시간.
    source: parallel-authored
  - id: ko-par-g018
    pattern: N을/를 얼마나 + V?
    english: ask how much of something someone does
    note: Use 얼마나 before the verb to ask about an open amount, as in 물을 얼마나 마셔요?
    source: parallel-authored
  - id: ko-par-g019
    pattern: N 앞/뒤/옆에 있다
    english: be in front of, behind, or beside N
    note: Korean uses location nouns followed by 에, rather than a location suffix.
    source: parallel-authored
  - id: ko-par-g020
    pattern: 의문사 + 문장 성분 + 서술어?
    english: Put 뭐, 누구, or 어디 in the part of the sentence being asked about; no extra question particle is needed.
    note: 누구 is 누가 when it is the subject.
    source: parallel-authored
  - id: ko-par-g021
    pattern: N을/를 N(으)로 부르다
    english: call N by the name N
    note: For example, 아이를 이 이름으로 불러요.
    source: parallel-authored
  - id: ko-par-g022
    pattern: 몇몇 + N은/는
    english: some N; a few members of a group
    note: 몇몇 comes before the noun. Korean often leaves plural marking unspoken when the meaning is clear.
    source: parallel-authored
  - id: ko-par-g023
    pattern: 이/저 + N
    english: this/these N; that/those N over there
    note: Korean often leaves plural marking unspoken when the meaning is clear. Use 그 for something near the listener or already mentioned.
    source: parallel-authored
  - id: ko-par-g024
    pattern: 이 / 그 + N
    english: this or that noun
    note: 이 points to something near the speaker; 그 points to something already known or being indicated.
    source: parallel-authored
  - id: ko-par-g025
    pattern: 인용한 말 + (이)라고 말하다
    english: say a quoted word or sentence
    note: For example, “감사해요!”라고 말해요.
    source: parallel-authored
  - id: ko-par-g026
    pattern: 너무 + A-아요 / -어요
    english: too; very; so A
    note: Use 너무 before an adjective to express excess or strong emphasis. In an exclamation, the emphasis can come from the wording and intonation.
    source: parallel-authored
  - id: ko-par-g027
    pattern: 정말 + 형용사
    english: really; truly, for emphasis
    note: Place 정말 before an adjective to emphasize an evaluation.
    source: parallel-authored
  - id: ko-par-g028
    pattern: N들
    english: plural marker for people, animals, or things
    note: Attach 들 to a noun to indicate more than one. Korean often leaves the plural unmarked when the meaning is clear.
    source: parallel-authored
  - id: ko-par-g029
    pattern: A-다고 생각하다
    english: think that something is A
    note: Use the quoted descriptive clause before 생각하다.
    source: parallel-authored
  - id: ko-par-g030
    pattern: 안 + V-았어요 / -었어요; V-지 않았어요
    english: did not V; have not V-ed
    note: Put 안 before a past-tense verb, or use -지 않았어요. For example, 어제 아침을 안 먹었어요 means “I didn’t eat breakfast yesterday.”
    source: parallel-authored
  - id: ko-par-g031
    pattern: 요일 이름 + 요일
    english: weekday names end in 요일
    note: For example, 월요일 is Monday and 일요일 is Sunday.
    source: parallel-authored
  - id: ko-par-g032
    pattern: 수사 + 백/천 + 나머지
    english: Form hundreds and thousands by placing the number before 백 or 천, then adding any remaining place values.
    note: Korean commonly says 백 원 and 천 원 without 일 before 백 or 천; for example, 이천오백 원 and 육백팔 원.
    source: parallel-authored
  - id: ko-par-g033
    pattern: 얼마나 + A-아요 / -어요?; N은/는 몇 살이에요?
    english: Ask how big or how much with 얼마나; ask someone's age with 몇 살이에요?
    note: Korean asks “How old?” with 몇 살이에요?, not a literal equivalent of “how big.”
    source: parallel-authored
  - id: ko-par-g034
    pattern: 이름 + 씨
    english: polite title attached after a name
    note: Use 씨 after a person’s name when addressing or referring to them politely; 씨 is not a standalone vocabulary item.
    source: parallel-authored
  - id: ko-par-g035
    pattern: N 후에
    english: after N
    note: Put 후에 after a noun to say what happens after it.
    source: parallel-authored
  - id: ko-par-g036
    pattern: 안
    english: inside
    source: parallel-authored
  - id: ko-par-g037
    pattern: 주어 + 어떻게 + 동사
    english: Ask how an action is done; put 어떻게 before the verb phrase.
    source: parallel-authored
  - id: ko-par-g038
    pattern: 이름 + 선생님
    english: use 선생님 after a name as a polite form of address
    note: For example, 왕 선생님.
    source: parallel-authored
  - id: ko-par-g039
    pattern: N은/는 어때요?
    english: ask how something is or what it is like
    source: parallel-authored
  - id: ko-par-g040
    pattern: 수사 + 번째
    english: "ordinal number: first, second, third, and so on"
    note: Put 번째 after a number, as in 첫 번째 책 and 두 번째 책.
    source: parallel-authored
  - id: ko-par-g041
    pattern: 어느 + N
    english: which N
    note: Place 어느 before the noun being asked about.
    source: parallel-authored
  - id: ko-par-g042
    pattern: 수사 + 월
    english: Form month names with a Sino-Korean number before 월
    note: For example, 일월 means January and 이월 means February.
    source: parallel-authored
  - id: ko-par-g043
    pattern: 큰 단위 + 작은 단위
    english: Korean number expressions usually omit zero place values; for example, 1,008 is 천팔.
    note: Unlike Chinese, Korean does not say a zero to bridge skipped place values.
    source: parallel-authored
  - id: ko-par-g044
    pattern: 명사 + 반 + 단위 명사
    english: half a unit of something; put 반 before the unit word
    note: For example, 우유 반 컵 means half a cup of milk.
    source: parallel-authored
  - id: ko-par-g045
    pattern: 우리 + V-아요/어요
    english: Let's V; a polite informal suggestion
    note: Use 우리 with a polite present-tense verb to make a suggestion.
    source: parallel-authored
  - id: ko-par-g046
    pattern: 이천 + 연도의 나머지 숫자
    english: Read a year as a Sino-Korean number written in Hangul.
    note: Use this for the year-number portion before 년, for example 이천이십육 년.
    source: parallel-authored
  - id: ko-par-g047
    pattern: 네 (답변)
    english: yes; okay
    note: A polite standalone affirmative response.
    source: parallel-authored
  - id: ko-par-g048
    pattern: N에 도착하다
    english: arrive at N
    note: Use 에 to mark the destination with 도착하다.
    source: parallel-authored
  - id: ko-par-g049
    pattern: 이 + 수 단위
    english: the Sino-Korean number two before a larger number unit
    note: Use 이 before 천 to form 이천.
    source: parallel-authored
  - id: ko-par-g050
    pattern: 금액 + 위안
    english: amount in Chinese yuan
    note: Use 위안 as the currency unit for prices in yuan.
    source: parallel-authored
  - id: ko-par-g051
    pattern: N 밖
    english: outside N
    note: Use 밖 after a noun to refer to its outside; add 에 when marking the location.
    source: parallel-authored
  - id: ko-par-g052
    pattern: N 밖에 있다
    english: be outside N
    note: Use 밖 after a noun to indicate a location outside it.
    source: parallel-authored
  - id: ko-par-g053
    pattern: 이십 분
    english: twenty minutes, using a Sino-Korean number
    note: Use 이 before 십 to form 이십 (20) in a minute expression.
    source: parallel-authored
  - id: ko-par-g054
    pattern: Place N에
    english: at, in, or on a place; location of an event or state
    note: Use 에 after a place expression to show where an event occurs or a state applies.
    source: parallel-authored
  - id: ko-par-g055
    pattern: 수사 + 일째
    english: the nth day
    note: Use 일째 after a number to count the day in a sequence.
    source: parallel-authored
  - id: ko-par-g056
    pattern: N에 (장소)
    english: at or in a place
    note: Use 에 to mark the place where people or things are; this use is not covered by the taught grammar points.
    source: parallel-authored
  - id: ko-par-g057
    pattern: 구 as a Sino-Korean numeral
    english: nine in Sino-Korean numbers
    note: Use 구 in dates and other Sino-Korean number expressions.
    source: parallel-authored
  - id: ko-par-g058
    pattern: 날짜의 한자어 수사
    english: Sino-Korean numerals used in dates
    note: Use Hangul numerals for date numbers, including forms not otherwise listed as vocabulary.
    source: parallel-authored
  - id: ko-par-g059
    pattern: 연도 + 년 + 월 + 일
    english: year, month, and day in a date
    note: Express a date in year-month-day order.
    source: parallel-authored
  - id: ko-par-g060
    pattern: 수사 + 월 + 수사 + 일 + 에
    english: on a calendar date
    note: Use a number with 월 for the month and a number with 일 for the day.
    source: parallel-authored
  - id: ko-par-g061
    pattern: N에 살다
    english: live in N
    note: Use 에 to mark the place where someone lives.
    source: parallel-authored
  - id: ko-par-g062
    pattern: V-(으)ㄹ게요
    english: I will; speaker's intention or promise
    note: Use this polite ending when saying what you will do.
    source: parallel-authored
