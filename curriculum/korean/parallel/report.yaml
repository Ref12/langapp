    zh: zh-hsk1-00361-s001
    note: "its item was dropped: The form 사람들 is 사람 (person) plus the plural suffix 들, so it is not a separate vocabulary word. The gloss 'they, those people' is also misleading, because 사람들 does not mean 'they' and it carries no female meaning, so it is a poor match for 她们. Teach 사람 'person' as the word. For 'they/them (female)', use 그녀들 or 그 사람들 in a sentence, and mention 들 as a grammar point."
