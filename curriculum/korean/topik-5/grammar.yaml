- id: ko-topik5-g001
  pattern: V/A-(으)ㄹ 수밖에 없다
  english: have no choice but to; necessarily
  note: Expresses necessity from circumstances rather than a mere rule or preference.
  examples:
  - target: 자료가 부족해서 판단을 미룰 수밖에 없습니다.
    english: We have no choice but to postpone judgment because the data are insufficient.
  - target: 비용이 오르면 가격도 오를 수밖에 없어요.
    english: If costs rise, prices inevitably have to rise too.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g002
  pattern: V/A-기 마련이다
  english: it is natural / expected that
  note: Presents a general tendency; avoid turning a stereotype into a supposedly universal rule.
  examples:
  - target: 처음에는 누구나 실수하기 마련이에요.
    english: Everyone naturally makes mistakes at first.
  - target: 준비가 부족하면 문제가 생기기 마련입니다.
    english: Problems are likely to arise when preparation is insufficient.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g003
  pattern: V/A-기 나름이다
  english: depend on how one V
  note: Highlights a controllable or varying factor that changes the result.
  examples:
  - target: 결과는 준비하기 나름이에요.
    english: The outcome depends on how you prepare.
  - target: 같은 말도 받아들이기 나름입니다.
    english: The same words can differ in meaning depending on how they are received.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g004
  pattern: V/A-(으)ㄴ/는 법이다
  english: it is generally the case; a principle
  note: States a general principle, often with a didactic tone; distinguish from practical knowledge of
    how to do something.
  examples:
  - target: 경험이 쌓이면 시야가 넓어지는 법이에요.
    english: As experience accumulates, one's perspective generally broadens.
  - target: 사람은 누구나 변하는 법입니다.
    english: It is the nature of people to change.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g005
  pattern: V/A-(으)ㄹ 만하다
  english: be worth V-ing; be reasonably A
  note: The action evaluation and tolerability readings must be distinguished from ability.
  examples:
  - target: 이 보고서는 읽어 볼 만합니다.
    english: This report is worth reading.
  - target: 이 정도 소음은 참을 만해요.
    english: This amount of noise is tolerable.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g006
  pattern: V/A-(으)ㄹ 정도로
  english: to the extent that; enough to
  note: Specifies degree by a result or benchmark, sometimes rhetorically rather than literally.
  examples:
  - target: 목소리가 떨릴 정도로 긴장했어요.
    english: I was so nervous that my voice shook.
  - target: 누구나 이해할 정도로 쉽게 설명했습니다.
    english: I explained it simply enough for anyone to understand.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g007
  pattern: V/A-다시피
  english: as you can see / know; virtually
  note: The basic connective points to an accessible fact; the auxiliary construction can mean practically
    or almost.
  examples:
  - target: 보시다시피 모든 좌석이 찼습니다.
    english: As you can see, all the seats are occupied.
  - target: 알다시피 이 문제는 단순하지 않아요.
    english: As you know, this issue is not simple.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g008
  pattern: V-다시피 하다
  english: practically V; almost do V
  note: An approximate characterization, not an exact identity or a literal report of another person's
    speech.
  examples:
  - target: 마감 때문에 밤을 새우다시피 했어요.
    english: I practically stayed up all night because of the deadline.
  - target: 그 소식을 듣고 뛰다시피 걸어왔어요.
    english: After hearing the news, I walked here almost at a run.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g009
  pattern: V-고 말다
  english: end up V-ing; regrettably / finally V
  note: Marks an eventual outcome often contrary to hopes; emotional force varies with context.
  examples:
  - target: 끝까지 참으려 했지만 울고 말았어요.
    english: I tried to hold back until the end, but I ended up crying.
  - target: 결국 계획을 취소하고 말았습니다.
    english: In the end, we had to cancel the plan.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g010
  pattern: V-아/어 내다
  english: manage to V; bring V to completion
  note: Emphasizes overcoming difficulty and achieving a result.
  examples:
  - target: 긴 협상 끝에 합의를 이끌어 냈습니다.
    english: After lengthy negotiations, we managed to reach an agreement.
  - target: 혼자서 어려운 일을 해냈어요.
    english: I managed to do the difficult work on my own.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g011
  pattern: V-고자 하다
  english: intend to; seek to V
  note: Formal statement of purpose; appropriate for proposals and presentations rather than ordinary
    casual chat.
  examples:
  - target: 이번 연구에서는 원인을 밝히고자 합니다.
    english: In this study, we seek to identify the cause.
  - target: 지역 주민의 의견을 듣고자 합니다.
    english: We would like to hear the opinions of local residents.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g012
  pattern: V/A-(으)므로
  english: because; since; formal reason
  note: A written causal connective, not the instrumental particle; select predicate inflection appropriately.
  examples:
  - target: 안전이 중요하므로 규정을 지켜야 합니다.
    english: Since safety is important, the rules must be followed.
  - target: 신청자가 많으므로 접수를 일찍 마감합니다.
    english: Because there are many applicants, registration closes early.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g013
  pattern: V-(으)ㅁ으로써
  english: by doing V; through V
  note: A nominalized action plus means marker, distinct from the similar-looking causal connective.
  examples:
  - target: 자료를 공개함으로써 신뢰를 높일 수 있습니다.
    english: Trust can be increased by disclosing the data.
  - target: 함께 토론함으로써 새로운 해결책을 찾았습니다.
    english: We found a new solution by discussing it together.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g014
  pattern: V-는 데 있어(서)
  english: in V-ing; when it comes to V
  note: Frames an area of relevance; avoid repetitive use when a simpler expression is clearer.
  examples:
  - target: 언어를 배우는 데 있어서 꾸준함이 중요합니다.
    english: Consistency is important in learning a language.
  - target: 정책을 평가하는 데 있어 자료의 질이 핵심입니다.
    english: Data quality is central to evaluating policy.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g015
  pattern: V/A-(으)ㄴ/는 이상
  english: now that; given that
  note: A premise creates an obligation or logical consequence; distinguish this from the noun meaning
    above or more.
  examples:
  - target: 약속한 이상 책임을 져야 합니다.
    english: Now that you have promised, you must take responsibility.
  - target: 문제가 확인된 이상 조치가 필요합니다.
    english: Given that the problem has been confirmed, action is necessary.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g016
  pattern: V/A-(으)ㄴ/는 한
  english: as long as; insofar as
  note: Limits the claim to the stated condition or scope.
  examples:
  - target: 규칙을 지키는 한 누구나 참여할 수 있습니다.
    english: Anyone may participate as long as they follow the rules.
  - target: 제가 아는 한 그 소문은 사실이 아닙니다.
    english: As far as I know, that rumor is not true.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g017
  pattern: V/A-(으)ㄴ/는 한편
  english: on the one hand; meanwhile
  note: Useful for parallel actions or contrasting aspects in expository writing.
  examples:
  - target: 시설을 확충하는 한편 직원 교육도 강화했습니다.
    english: We expanded the facilities while also strengthening staff training.
  - target: 편리한 한편 개인정보 보호 문제가 생길 수 있어요.
    english: It is convenient, but privacy issues can arise.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g018
  pattern: V/A-기는커녕
  english: far from V/A; let alone
  note: Rejects an expected positive outcome and often introduces a worse or more basic failure.
  examples:
  - target: 쉬기는커녕 점심 먹을 시간도 없었어요.
    english: Far from getting any rest, I did not even have time for lunch.
  - target: 도움이 되기는커녕 오히려 방해가 됐어요.
    english: Far from helping, it actually got in the way.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g019
  pattern: N은/는커녕
  english: let alone N; not even N
  note: The noun version can compare a less attainable thing with a more basic unmet requirement.
  examples:
  - target: 휴가는커녕 주말에도 일해요.
    english: Let alone taking a vacation, I work even on weekends.
  - target: 사과는커녕 설명도 없었습니다.
    english: There was not even an explanation, let alone an apology.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g020
  pattern: V/A-기에
  english: because; seeing that
  note: A reason used in narration and explanation; the evaluative use after an action has a different
    construction.
  examples:
  - target: 불이 켜져 있기에 누가 있는 줄 알았어요.
    english: Because the light was on, I thought someone was there.
  - target: 질문이 많기에 설명을 덧붙였습니다.
    english: Since there were many questions, I added an explanation.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g021
  pattern: V/A-길래
  english: because I noticed; so I reacted
  note: Conversational reason tied to the speaker's observation and response; do not make it an all-purpose
    formal causal connective.
  examples:
  - target: 사람들이 줄을 서 있길래 저도 기다렸어요.
    english: I saw people lining up, so I waited too.
  - target: 가격이 싸길래 두 개 샀어요.
    english: The price was low, so I bought two.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g022
  pattern: V-(으)ㄴ 김에
  english: while at it; taking the opportunity
  note: Uses an already planned or completed action as an opportunity for an additional action.
  examples:
  - target: 시내에 나온 김에 책도 샀어요.
    english: While I was downtown, I bought a book too.
  - target: 청소를 시작한 김에 창문도 닦읍시다.
    english: Since we have started cleaning, let's clean the windows too.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g023
  pattern: V-(으)ㄹ 바에야
  english: if one is going to V, better to
  note: The first option is dispreferred relative to the alternative; often strongly evaluative.
  examples:
  - target: 대충 할 바에야 시작하지 않는 게 낫겠어요.
    english: Rather than do it carelessly, it would be better not to start.
  - target: 계속 기다릴 바에야 다른 곳으로 갑시다.
    english: Rather than keep waiting, let's go somewhere else.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g024
  pattern: V/A-(으)ㄹ 따름이다
  english: merely; all one can do is
  note: A restrained formal conclusion, often expressing regret, gratitude, or lack of alternatives.
  examples:
  - target: 좋은 결과를 기대할 따름입니다.
    english: All we can do is hope for a good result.
  - target: 도와주신 분들께 감사할 따름입니다.
    english: I can only express gratitude to those who helped.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g025
  pattern: V-(으)ㄴ 끝에
  english: after; at the end of a long process
  note: Highlights a result reached through sustained activity or difficulty.
  examples:
  - target: 오랫동안 논의한 끝에 합의했습니다.
    english: After lengthy discussions, we reached an agreement.
  - target: 여러 번 시도한 끝에 문제를 해결했어요.
    english: After several attempts, I solved the problem.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g026
  pattern: V-는 대로
  english: as soon as; in accordance with
  note: Immediate succession with action verbs differs from following instructions or matching a manner.
  examples:
  - target: 결과가 나오는 대로 알려 드리겠습니다.
    english: I will let you know as soon as the results come out.
  - target: 들은 대로 정확히 적으세요.
    english: Write down exactly what you heard.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g027
  pattern: V/A-든지
  english: whether; whichever; regardless of choice
  note: Marks alternatives, not retrospective recollection; distinguish its spelling and meaning from
    the retrospective ending.
  examples:
  - target: 참여하든지 하지 않든지 알려 주세요.
    english: Please let us know whether you will participate or not.
  - target: 어디에 살든지 건강이 중요해요.
    english: Wherever you live, health is important.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g028
  pattern: V/A-거나 말거나
  english: whether or not; regardless of another's action
  note: Often sounds indifferent or dismissive; practice context and relational consequences.
  examples:
  - target: 사람들이 믿거나 말거나 사실은 변하지 않아요.
    english: Whether people believe it or not, the facts do not change.
  - target: 그가 듣거나 말거나 저는 설명을 계속했어요.
    english: Whether he listened or not, I continued explaining.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g029
  pattern: V/A-(으)ㄹ까 하다
  english: consider doing; tentatively think of
  note: A tentative intention; not the same as a firm plan or a fear construction.
  examples:
  - target: 이번에는 온라인으로 신청할까 해요.
    english: I am thinking of applying online this time.
  - target: 주말에는 집에서 쉴까 합니다.
    english: I am considering resting at home this weekend.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g030
  pattern: V/A-았/었더라면
  english: if it had been; if one had V-ed
  note: Counterfactual past condition; the result often uses a modal or conditional evaluation.
  examples:
  - target: 조금 일찍 출발했더라면 기차를 탔을 거예요.
    english: If I had left a little earlier, I would have caught the train.
  - target: 자료를 확인했더라면 실수를 줄일 수 있었겠죠.
    english: If we had checked the data, we could have reduced the mistakes.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g031
  pattern: V-았/었어야 했는데
  english: should have V-ed, but did not
  note: Retrospective unmet obligation or regret; state what actually happened when evaluating the meaning.
  examples:
  - target: 미리 예약했어야 했는데 깜빡했어요.
    english: I should have reserved in advance, but I forgot.
  - target: 그때 사실을 말했어야 했는데 그러지 못했어요.
    english: I should have told the truth then, but I could not.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g032
  pattern: V/A-(으)ㄹ 줄 알았다 / 몰랐다
  english: thought / did not expect that
  note: Reports an expectation that may be contradicted; distinguish from knowing how to perform an action.
  examples:
  - target: 이렇게 오래 걸릴 줄 몰랐어요.
    english: I did not expect it to take this long.
  - target: 금방 끝날 줄 알았는데 아직도 진행 중이에요.
    english: I thought it would finish quickly, but it is still ongoing.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g033
  pattern: V/A-다고 볼 수 있다
  english: can be regarded as; may be said to
  note: Useful for a qualified interpretation; it should be supported by evidence rather than merely sounding
    academic.
  examples:
  - target: 이 변화는 긍정적이라고 볼 수 있습니다.
    english: This change can be regarded as positive.
  - target: 두 요인이 함께 작용한다고 볼 수 있어요.
    english: It can be said that the two factors operate together.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g034
  pattern: V/A-는 것이 아니라
  english: not that V, but
  note: A corrective contrast; modifier form changes with predicate type and time.
  examples:
  - target: 비용을 줄이는 것이 아니라 사용 방식을 바꾸는 겁니다.
    english: We are not reducing costs; we are changing how it is used.
  - target: 관심이 없는 것이 아니라 시간이 부족한 거예요.
    english: It is not that I am uninterested; I do not have enough time.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g035
  pattern: N을/를 비롯해
  english: including N; starting with N
  note: Introduces a representative member of a larger group; the list should support the generalization.
  examples:
  - target: 학생을 비롯해 주민들도 참여했습니다.
    english: Residents participated as well as students.
  - target: 서울을 비롯해 여러 도시에서 행사가 열립니다.
    english: The event is held in several cities, including Seoul.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik5-g036
  pattern: N에 불과하다
  english: be no more than N; amount merely to N
  note: Downscales an amount or status; use carefully because it may dismiss someone's contribution.
  examples:
  - target: 그것은 여러 가능성 중 하나에 불과합니다.
    english: It is only one of several possibilities.
  - target: 현재 결과는 예비 조사 결과에 불과해요.
    english: The current results are merely preliminary survey results.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 5 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
