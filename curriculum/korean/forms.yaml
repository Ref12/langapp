# Korean word forms as data (option C of docs/languages.md): a lemma plus a class plus a form id builds the surface.
# Read by src/core/forms/ through src/data/forms/ko.json (scripts/generate-app-forms.mjs). Irregular forms that a lesson uses become lesson-scoped items ko:f:<lemma>:<form>.
version: 1
language: ko

# Classes. A stem is the dictionary form without the final 다. baseline: the class the stem would follow if it were regular (an irregular form is one whose surface differs from the baseline).
classes:
  regular-vowel:
    description: "stem ends in a vowel (가다, 보다, 마시다); contractions 오+아→와, 우+어→워, 이+어→여"
  regular-consonant:
    description: "stem ends in a consonant (먹다, 좋다, 있다); 아 after ㅏ/ㅗ, else 어; 으 before a consonant ending"
  l-stem:
    description: "stem ends in ㄹ (살다, 만들다); ㄹ drops before ㅅ, ㅂ, ㄴ"
    irregular: true
    baseline: regular-consonant
  eu-stem:
    description: "stem ends in ㅡ (쓰다, 아프다, 예쁘다); ㅡ drops before 아/어"
  hada:
    description: "하다 (공부하다): 하 + 여 → 해"
    itemised: false
    baseline: regular-vowel
  b-irregular:
    description: "ㅂ irregular (춥다 → 추워요, 돕다 → 도와요)"
    irregular: true
    baseline: regular-consonant
  d-irregular:
    description: "ㄷ irregular (듣다 → 들어요)"
    irregular: true
    baseline: regular-consonant
  s-irregular:
    description: "ㅅ irregular (낫다 → 나아요)"
    irregular: true
    baseline: regular-consonant
  reu-irregular:
    description: "르 irregular (모르다 → 몰라요)"
    irregular: true
    baseline: eu-stem
  h-irregular:
    description: "ㅎ irregular (그렇다 → 그래요)"
    irregular: true
    baseline: regular-consonant
  copula-ida:
    description: "이다 (예요 after a vowel, 이에요 after a consonant)"
    itemised: false
  copula-anida:
    description: "아니다"
    itemised: false

# Lemma lists by class (a lemma matches when its dictionary form ends with the entry). Everything else is classified from the stem.
lemmas:
  d-irregular: [듣다, 걷다, 묻다, 싣다, 깨닫다]
  s-irregular: [낫다, 짓다, 붓다, 잇다, 긋다, 젓다]
  b-irregular-verbs: [눕다, 굽다, 줍다, 돕다, 덥다, 깁다]
  b-regular: [좁다, 입다, 잡다, 씹다, 뽑다, 집다, 접다, 업다, 닙다]
  b-o: [돕다, 곱다]
  h-endings: [랗다, 갛다, 맣다, 렇다, 떻다, 얗다]
  reu-regular: [따르다, 치르다, 들르다, 으르다]

# Vowel harmony and the stem classes.
harmony_a: [ㅏ, ㅗ]
copulas:
  copula-ida:
    stem: 이
    forms:
      haeyo: { vowel: 예요, consonant: 이에요 }
      past: { vowel: 였어요, consonant: 이었어요 }
      future: { vowel: 일 거예요, consonant: 일 거예요 }
      honorific: { vowel: 이세요, consonant: 이세요 }
      dict: { vowel: 이다, consonant: 이다 }
      go: { vowel: 이고, consonant: 이고 }
      aseo: { vowel: 여서, consonant: 이어서 }
      lkka: { vowel: 일까요, consonant: 일까요 }
      formal: { vowel: 입니다, consonant: 입니다 }
  copula-anida:
    stem: 아니
    forms:
      haeyo: { all: 아니에요 }
      past: { all: 아니었어요 }
      future: { all: 아닐 거예요 }
      honorific: { all: 아니세요 }
      dict: { all: 아니다 }
      go: { all: 아니고 }
      aseo: { all: 아니어서 }
      lkka: { all: 아닐까요 }
      formal: { all: 아닙니다 }

# Forms. join: ao (아/어 contraction), eu-s (-(으)시), eu-l (-(으)ㄹ), eu-b (-(으)ㅂ/습), plain (stem as it is). past adds ㅆ. multiword: the form spans more than one word.
forms:
  dict:      { label: dictionary form, join: plain, add: 다, grammar: null }
  haeyo:     { label: 해요체 present, join: ao, add: 요, grammar: ko-topik1-g016 }
  past:      { label: past -았/었어요, join: ao-past, add: 어요, grammar: ko-topik1-g018 }
  future:    { label: future -(으)ㄹ 거예요, join: eu-l, add: " 거예요", grammar: ko-topik1-g019, multiword: true }
  wish:      { label: want to -고 싶어요, join: plain, add: 고 싶어요, grammar: ko-topik1-g020, multiword: true }
  honorific: { label: honorific -(으)세요, join: eu-s, add: 요, grammar: ko-topik1-g036 }
  neg-ji:    { label: -지 않아요, join: plain, add: 지 않아요, grammar: ko-topik2-g036, multiword: true }
  an-neg:    { label: 안 + verb, join: ao, add: 요, prefix: "안 ", grammar: ko-topik1-g021, multiword: true }
  lkka:      { label: shall we -(으)ㄹ까요, join: eu-l, add: 까요, grammar: ko-topik1-g030 }
  juseyo:    { label: please do for me -아/어 주세요, join: ao, add: " 주세요", grammar: ko-topik1-g024, multiword: true }
  go:        { label: connector -고, join: plain, add: 고, grammar: ko-topik1-g026 }
  aseo:      { label: connector -아서/어서, join: ao, add: 서, grammar: ko-topik1-g028 }
  prospective: { label: modifier -(으)ㄹ (before 수, 줄), join: eu-l, add: "", grammar: null }
  purpose:   { label: in order to -(으)러, join: eu, add: 러, grammar: ko-topik1-g029 }
  attr-neun: { label: verb before a noun -는, join: neun, add: 는, grammar: ko-topik2-g013 }
  attr-n:    { label: before a noun -(으)ㄴ, join: eu-n, add: "", grammar: ko-topik1-g034 }
  possible:  { label: can -(으)ㄹ 수 있어요, join: eu-l, add: " 수 있어요", grammar: ko-topik1-g032, multiword: true }
  impossible: { label: cannot -(으)ㄹ 수 없어요, join: eu-l, add: " 수 없어요", grammar: ko-topik1-g032, multiword: true }
  know-how:  { label: know how -(으)ㄹ 줄 알아요, join: eu-l, add: " 줄 알아요", grammar: ko-topik3-g024, multiword: true }
  progressive: { label: be -ing -고 있어요, join: plain, add: 고 있어요, grammar: ko-topik1-g033, multiword: true }
  prohibit:  { label: please do not -지 마세요, join: plain, add: 지 마세요, grammar: ko-topik1-g025, multiword: true }
  permit:    { label: may -아/어도 돼요, join: ao, add: 도 돼요, grammar: ko-topik2-g001, multiword: true }
  must:      { label: must -아/어야 해요, join: ao, add: 야 해요, grammar: ko-topik2-g003, multiword: true }
  resultive: { label: state -아/어 있어요, join: ao, add: " 있어요", grammar: ko-topik3-g027, multiword: true }
  promise:   { label: I will -(으)ㄹ게요, join: eu-l, add: 게요, grammar: ko-par-g062 }
  intend:    { label: intend -(으)려고 해요, join: eu, add: 려고 해요, grammar: ko-topik2-g010, multiword: true }
  nominal:   { label: nominalised -기, join: plain, add: 기, grammar: ko-topik2-g017 }
  quote:     { label: think that -다고 생각해요, join: plain, add: 다고 생각해요, grammar: ko-par-g029, multiword: true }
  neg-past-ji: { label: -지 않았어요, join: plain, add: 지 않았어요, grammar: ko-par-g030, multiword: true }
  formal:    { label: formal polite -ㅂ니다/습니다, join: eu-b, add: 니다, grammar: null }
