# Korean word forms as data (option C of docs/languages.md): a lemma plus a class plus a form id builds the surface.
# Read by src/core/forms/ through src/data/forms/ko.json (scripts/generate-app-forms.mjs). Irregular forms that a lesson uses become lesson-scoped items ko:f:<lemma>:<form>.
version: 1
language: ko

# Classes. A stem is the dictionary form without the final 다. baseline: the class the stem would follow if it were regular (an irregular form is one whose surface differs from the baseline).
classes:
  regular-vowel:
    description: "stem ends in a vowel (가다, 보다, 마시다); contractions 오+아→와, 우+어→워, 이+어→여"
  regular-consonant:
    description: "stem ends in a consonant (먹다, 좋다, 있다); 아 after ㅏ/ㅗ, else 어; 으 before a consonant ending"
  l-stem:
    description: "stem ends in ㄹ (살다, 만들다); ㄹ drops before ㅅ, ㅂ, ㄴ"
    irregular: true
    baseline: regular-consonant
  eu-stem:
    description: "stem ends in ㅡ (쓰다, 아프다, 예쁘다); ㅡ drops before 아/어"
  hada:
    description: "하다 (공부하다): 하 + 여 → 해"
    itemised: false
    baseline: regular-vowel
  b-irregular:
    description: "ㅂ irregular (춥다 → 추워요, 돕다 → 도와요)"
    irregular: true
    baseline: regular-consonant
  d-irregular:
    description: "ㄷ irregular (듣다 → 들어요)"
    irregular: true
    baseline: regular-consonant
  s-irregular:
    description: "ㅅ irregular (낫다 → 나아요)"
    irregular: true
    baseline: regular-consonant
  reu-irregular:
    description: "르 irregular (모르다 → 몰라요)"
    irregular: true
    baseline: eu-stem
  h-irregular:
    description: "ㅎ irregular (그렇다 → 그래요)"
    irregular: true
    baseline: regular-consonant
  copula-ida:
    description: "이다 (예요 after a vowel, 이에요 after a consonant)"
    itemised: false
  copula-anida:
    description: "아니다"
    itemised: false

# Lemma lists by class (a lemma matches when its dictionary form ends with the entry). Everything else is classified from the stem.
lemmas:
  d-irregular: [듣다, 걷다, 묻다, 싣다, 깨닫다]
  s-irregular: [낫다, 짓다, 붓다, 잇다, 긋다, 젓다]
  b-irregular-verbs: [눕다, 굽다, 줍다, 돕다, 덥다, 깁다]
  b-regular: [좁다, 입다, 잡다, 씹다, 뽑다, 집다, 접다, 업다, 닙다]
  b-o: [돕다, 곱다]
  h-endings: [랗다, 갛다, 맣다, 렇다, 떻다, 얗다]
  reu-regular: [따르다, 치르다, 들르다, 으르다]
  # Restrictions by lemma (the dictionary form, exact). A form's only: / not: name one of these lists, so the form is built, shown and asked only for the words it fits.
  # resultive: intransitive verbs of change of state or position, for -아/어 있어요 (앉아 있어요, 켜져 있어요); no other verb has a resultive (공부해 있어요 is not Korean).
  resultive: [앉다, 서다, 눕다, 켜지다, 꺼지다, 열리다, 닫히다, 붙다, 남다, 일어나다, 오다, 가다, 살다, 모이다, 걸리다]
  # non-volitional: states and judgements nobody does on purpose: no -고 싶어요, -아/어 주세요, -지 마세요, -(으)ㄹ게요, -(으)려고 해요 (필요하고 싶어요, 틀리지 마세요 are out).
  non-volitional: [없다, 맞다, 틀리다, 모자라다, 필요하다]
  # stative: no progressive -고 있어요 (있고 있어요, 필요하고 있어요 are not Korean).
  stative: [있다, 없다, 필요하다, 모자라다]
  # no-purpose: -(으)러 needs a verb of going or coming next, so not these and not the verbs of going and coming themselves (가러 가요 is out; 먹으러 가요 is in).
  no-purpose: [있다, 없다, 알다, 맞다, 틀리다, 모자라다, 필요하다, 가다, 오다, 다니다, 돌아가다, 도착하다, 들어가다, 나가다]
  # no-skill: -(으)ㄹ 줄 알아요 is for a skill that is learnt.
  no-skill: [있다, 없다, 알다, 맞다, 틀리다, 모자라다, 필요하다, 보다, 가다, 오다]
  # no-an: 안 + verb is not said of these (필요하다 is said like an adjective, 있다 and 없다 have their own opposite).
  no-an: [있다, 없다, 필요하다]
  # no-neun: 필요하다 is 필요한 before a noun, as an adjective is.
  no-neun: [필요하다]
# A transitive verb whose resultive is that of its intransitive partner (켜다 -> 켜져 있어요, 열다 -> 열려 있어요).
lemma_maps:
  resultive-via: { 켜다: 켜지다, 끄다: 꺼지다, 열다: 열리다, 닫다: 닫히다, 모으다: 모이다, 걸다: 걸리다 }

# Vowel harmony and the stem classes.
harmony_a: [ㅏ, ㅗ]
copulas:
  copula-ida:
    stem: 이
    forms:
      haeyo: { vowel: 예요, consonant: 이에요 }
      past: { vowel: 였어요, consonant: 이었어요 }
      future: { vowel: 일 거예요, consonant: 일 거예요 }
      honorific: { vowel: 이세요, consonant: 이세요 }
      dict: { vowel: 이다, consonant: 이다 }
      go: { vowel: 이고, consonant: 이고 }
      aseo: { vowel: 여서, consonant: 이어서 }
      lkka: { vowel: 일까요, consonant: 일까요 }
      formal: { vowel: 입니다, consonant: 입니다 }
  copula-anida:
    stem: 아니
    forms:
      haeyo: { all: 아니에요 }
      past: { all: 아니었어요 }
      future: { all: 아닐 거예요 }
      honorific: { all: 아니세요 }
      dict: { all: 아니다 }
      go: { all: 아니고 }
      aseo: { all: 아니어서 }
      lkka: { all: 아닐까요 }
      formal: { all: 아닙니다 }

# Forms. join: ao (아/어 contraction), eu-s (-(으)시), eu-l (-(으)ㄹ), eu-b (-(으)ㅂ/습), plain (stem as it is). past adds ㅆ. multiword: the form spans more than one word. kinds: the kinds of word the form is built for (default verb and adjective; a verb-only form such as -고 싶어요 is never built for an adjective, so 좋다 gets no 좋고 싶어요); the word's kind is its part of speech (adjective, else verb).
forms:
  dict:      { label: dictionary form, join: plain, add: 다, grammar: null }
  haeyo:     { label: 해요체 present, name: "polite present", join: ao, add: 요, grammar: ko-topik1-g016 }
  past:      { label: past -았/었어요, name: "past", join: ao-past, add: 어요, grammar: ko-topik1-g018 }
  future:    { label: future -(으)ㄹ 거예요, name: "future", join: eu-l, add: " 거예요", grammar: ko-topik1-g019, multiword: true }
  wish:      { label: want to -고 싶어요, name: "want to", join: plain, add: 고 싶어요, grammar: ko-topik1-g020, multiword: true, kinds: [verb], not: non-volitional }
  honorific: { label: honorific -(으)세요, name: "honorific", join: eu-s, add: 요, grammar: ko-topik1-g036 }
  neg-ji:    { label: -지 않아요, name: "negative (long)", join: plain, add: 지 않아요, grammar: ko-topik2-g036, multiword: true }
  an-neg:    { label: 안 + verb, name: "negative (short)", join: ao, add: 요, prefix: "안 ", grammar: ko-topik1-g021, multiword: true, not: no-an }
  lkka:      { label: shall we -(으)ㄹ까요, name: "shall we", join: eu-l, add: 까요, grammar: ko-topik1-g030 }
  juseyo:    { label: please do for me -아/어 주세요, name: "please do for me", join: ao, add: " 주세요", grammar: ko-topik1-g024, multiword: true, kinds: [verb], not: non-volitional }
  go:        { label: connector -고, name: "connector \"and\"", join: plain, add: 고, grammar: ko-topik1-g026 }
  aseo:      { label: connector -아서/어서, name: "connector \"because\"", join: ao, add: 서, grammar: ko-topik1-g028 }
  prospective: { label: modifier -(으)ㄹ (before 수, name: "future modifier", 줄), join: eu-l, add: "", grammar: null }
  purpose:   { label: in order to -(으)러, name: "in order to", join: eu, add: 러, grammar: ko-topik1-g029, kinds: [verb], not: no-purpose }
  attr-neun: { label: verb before a noun -는, name: "present modifier", join: neun, add: 는, grammar: ko-topik2-g013, kinds: [verb], not: no-neun }
  attr-n:    { label: before a noun -(으)ㄴ, name: "past modifier", join: eu-n, add: "", grammar: ko-topik1-g034 }
  possible:  { label: can -(으)ㄹ 수 있어요, name: "can", join: eu-l, add: " 수 있어요", grammar: ko-topik1-g032, multiword: true, kinds: [verb] }
  impossible: { label: cannot -(으)ㄹ 수 없어요, name: "cannot", join: eu-l, add: " 수 없어요", grammar: ko-topik1-g032, multiword: true, kinds: [verb] }
  know-how:  { label: know how -(으)ㄹ 줄 알아요, name: "know how to", join: eu-l, add: " 줄 알아요", grammar: ko-topik3-g024, multiword: true, kinds: [verb], not: no-skill }
  progressive: { label: be -ing -고 있어요, name: "ongoing", join: plain, add: 고 있어요, grammar: ko-topik1-g033, multiword: true, kinds: [verb], not: stative }
  prohibit:  { label: please do not -지 마세요, name: "please do not", join: plain, add: 지 마세요, grammar: ko-topik1-g025, multiword: true, kinds: [verb], not: non-volitional }
  permit:    { label: may -아/어도 돼요, name: "may", join: ao, add: 도 돼요, grammar: ko-topik2-g001, multiword: true }
  must:      { label: must -아/어야 해요, name: "must", join: ao, add: 야 해요, grammar: ko-topik2-g003, multiword: true }
  resultive: { label: state -아/어 있어요, name: "resulting state", join: ao, add: " 있어요", grammar: ko-topik3-g027, multiword: true, kinds: [verb], only: resultive, via: resultive-via }
  promise:   { label: I will -(으)ㄹ게요, name: "I will", join: eu-l, add: 게요, grammar: ko-par-g062, kinds: [verb], not: non-volitional }
  intend:    { label: intend -(으)려고 해요, name: "intend to", join: eu, add: 려고 해요, grammar: ko-topik2-g010, multiword: true, kinds: [verb], not: non-volitional }
  nominal:   { label: nominalised -기, name: "nominalised", join: plain, add: 기, grammar: ko-topik2-g017 }
  quote:     { label: think that -다고 생각해요, name: "think that", join: plain, add: 다고 생각해요, grammar: ko-par-g029, multiword: true, kinds: [adjective] }
  neg-past-ji: { label: -지 않았어요, name: "negative past (long)", join: plain, add: 지 않았어요, grammar: ko-par-g030, multiword: true }
  formal:    { label: formal polite -ㅂ니다/습니다, name: "formal polite", join: eu-b, add: 니다, grammar: null }
