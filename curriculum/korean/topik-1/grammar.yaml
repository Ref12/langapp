- id: ko-topik1-g001
  pattern: N이에요 / N예요
  english: be N; polite identification
  note: Use the first form after a final consonant and the second after a vowel; do not insert a subject
    when context makes it unnecessary.
  examples:
  - target: 저는 학생이에요.
    english: I am a student.
  - target: 여기는 학교예요.
    english: This place is a school.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g002
  pattern: N이/가 아니에요
  english: not be N
  note: The negative copula takes the subject particle on the noun being denied.
  examples:
  - target: 저는 의사가 아니에요.
    english: I am not a doctor.
  - target: 이것은 제 가방이 아니에요.
    english: This is not my bag.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g003
  pattern: N은/는
  english: as for N; topic or contrast
  note: The topic particle introduces or contrasts a topic; it is not interchangeable with the subject
    particle in every context.
  examples:
  - target: 저는 서울에 살아요.
    english: I live in Seoul.
  - target: 커피는 좋아해요.
    english: As for coffee, I like it.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g004
  pattern: N이/가
  english: N as grammatical subject
  note: Choose the consonant-final or vowel-final form; new information and identification often use this
    particle.
  examples:
  - target: 비가 와요.
    english: It is raining.
  - target: 친구가 왔어요.
    english: A friend arrived.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g005
  pattern: N을/를
  english: N as direct object
  note: Use after an object; it may be omitted in casual conversation but retain it in early controlled
    practice.
  examples:
  - target: 책을 읽어요.
    english: I read a book.
  - target: 물을 마셔요.
    english: I drink water.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g006
  pattern: N에 있다 / 없다
  english: be / not be at N
  note: Existence and location use this particle; actions at a place normally use the action-location
    particle instead.
  examples:
  - target: 책이 책상 위에 있어요.
    english: The book is on the desk.
  - target: 지금 집에 없어요.
    english: I am not at home now.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g007
  pattern: N에서
  english: at N; location of an action
  note: Distinguish the place where an action occurs from a destination or location of existence.
  examples:
  - target: 도서관에서 공부해요.
    english: I study at the library.
  - target: 식당에서 점심을 먹어요.
    english: I eat lunch at a restaurant.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g008
  pattern: N에 가다 / 오다
  english: go / come to N
  note: The particle marks a destination; the motion verb is chosen relative to the conversational viewpoint.
  examples:
  - target: 학교에 가요.
    english: I go to school.
  - target: 친구가 우리 집에 와요.
    english: A friend comes to our house.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g009
  pattern: N에
  english: at N; time of an event
  note: Used with clock times and many calendar expressions, but not normally with today, tomorrow, or
    yesterday.
  examples:
  - target: 아홉 시에 수업이 시작해요.
    english: Class starts at nine.
  - target: 월요일에 만나요.
    english: Let's meet on Monday.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g010
  pattern: N의
  english: N's; of N
  note: The possessive particle is often omitted in speech; humble and familiar possessive pronouns have
    contracted forms.
  examples:
  - target: 이것은 친구의 책이에요.
    english: This is a friend's book.
  - target: 학교의 이름을 알아요.
    english: I know the name of the school.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g011
  pattern: N하고 / N과/와
  english: N and; with N
  note: The first is common in conversation; the latter pair is frequent in writing and more formal contexts.
  examples:
  - target: 빵하고 우유를 사요.
    english: I buy bread and milk.
  - target: 친구와 영화를 봐요.
    english: I watch a movie with a friend.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g012
  pattern: N도
  english: N too; also N
  note: This particle often replaces the subject or object particle; other combinations depend on the
    particle.
  examples:
  - target: 저도 학생이에요.
    english: I am a student too.
  - target: 오늘도 운동해요.
    english: I exercise today too.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g013
  pattern: N만
  english: only N
  note: Focuses on the noun; compare its scope with a negative sentence when interpreting restrictions.
  examples:
  - target: 물만 마셔요.
    english: I drink only water.
  - target: 친구 한 명만 왔어요.
    english: Only one friend came.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g014
  pattern: N부터 N까지
  english: from N to N; starting and ending bounds
  note: Useful with time; place-to-place routes also use a source-location particle.
  examples:
  - target: 아홉 시부터 다섯 시까지 일해요.
    english: I work from nine to five.
  - target: 월요일부터 금요일까지 학교에 가요.
    english: I go to school from Monday to Friday.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g015
  pattern: N에서 N까지
  english: from N to N; route
  note: Use for a geographic starting point and endpoint.
  examples:
  - target: 집에서 학교까지 걸어요.
    english: I walk from home to school.
  - target: 서울에서 부산까지 기차로 가요.
    english: I go from Seoul to Busan by train.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g016
  pattern: V/A-아요 / -어요 / -해요
  english: polite present statement or question
  note: Vowel harmony and common contractions determine the surface form; descriptive verbs do not need
    an extra copula.
  examples:
  - target: 매일 운동해요.
    english: I exercise every day.
  - target: 오늘 날씨가 좋아요.
    english: The weather is nice today.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g017
  pattern: V/A-ㅂ니다 / -습니다
  english: formal polite statement
  note: Choose by whether the stem ends in a vowel or consonant; stems ending in the liquid consonant
    need a deletion rule.
  examples:
  - target: 저는 한국어를 배웁니다.
    english: I learn Korean.
  - target: 이 방은 조용합니다.
    english: This room is quiet.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g018
  pattern: V/A-았어요 / -었어요 / -했어요
  english: polite past tense
  note: The past marker attaches to the stem before the polite ending; practice irregular stems as word
    families.
  examples:
  - target: 어제 친구를 만났어요.
    english: I met a friend yesterday.
  - target: 지난주에 많이 바빴어요.
    english: I was very busy last week.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g019
  pattern: V-(으)ㄹ 거예요
  english: will; be going to; expected future
  note: Expresses plans or predictions; avoid treating it as a mechanical equivalent of every English
    future.
  examples:
  - target: 내일 책을 읽을 거예요.
    english: I am going to read a book tomorrow.
  - target: 주말에 쉴 거예요.
    english: I will rest on the weekend.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g020
  pattern: V-고 싶어요
  english: want to V
  note: Direct statements usually concern the speaker; ask about the listener's wishes rather than asserting
    another person's internal state.
  examples:
  - target: 한국에 가고 싶어요.
    english: I want to go to Korea.
  - target: 무엇을 먹고 싶어요?
    english: What would you like to eat?
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g021
  pattern: 안 V/A
  english: not V; not A
  note: Short negation; for many action nouns with the do-verb, place the negative immediately before
    the do-verb.
  examples:
  - target: 오늘은 안 가요.
    english: I am not going today.
  - target: 이 가방은 안 비싸요.
    english: This bag is not expensive.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g022
  pattern: 못 V
  english: cannot V; fail to V
  note: Indicates inability or circumstances preventing an action, not simple unwillingness.
  examples:
  - target: 오늘은 못 만나요.
    english: I cannot meet today.
  - target: 저는 수영을 못 해요.
    english: I cannot swim.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g023
  pattern: V-(으)세요
  english: please V; polite directive
  note: Also has honorific statement uses; context and intonation distinguish requests from descriptions.
  examples:
  - target: 여기에 앉으세요.
    english: Please sit here.
  - target: 천천히 읽으세요.
    english: Please read slowly.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g024
  pattern: V-아/어 주세요
  english: please do V for me/us
  note: Requests a helpful action; do not confuse the auxiliary with giving a physical object.
  examples:
  - target: 문을 열어 주세요.
    english: Please open the door.
  - target: 다시 말해 주세요.
    english: Please say it again.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g025
  pattern: V-지 마세요
  english: please do not V
  note: Attach the prohibition to the verb stem; this is not the ordinary negative statement form.
  examples:
  - target: 여기에서 사진을 찍지 마세요.
    english: Please do not take photographs here.
  - target: 너무 빨리 말하지 마세요.
    english: Please do not speak too quickly.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g026
  pattern: V/A-고
  english: and; then; linking predicates
  note: Connects clauses without necessarily asserting a cause; tense is commonly expressed at the final
    predicate.
  examples:
  - target: 저는 책을 읽고 친구는 음악을 들어요.
    english: I read a book, and my friend listens to music.
  - target: 방이 크고 깨끗해요.
    english: The room is big and clean.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g027
  pattern: V/A-지만
  english: but; although
  note: Signals contrast between two clauses; it can attach after a tense marker.
  examples:
  - target: 비싸지만 좋아요.
    english: It is expensive, but it is good.
  - target: 어제는 바빴지만 오늘은 괜찮아요.
    english: I was busy yesterday, but today is fine.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g028
  pattern: V/A-아/어서
  english: because; so
  note: At this stage teach ordinary explanations; avoid following the causal use with a command or suggestion.
  examples:
  - target: 피곤해서 일찍 자요.
    english: I go to bed early because I am tired.
  - target: 비가 와서 집에 있어요.
    english: I am at home because it is raining.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g029
  pattern: V-(으)러 가다 / 오다
  english: go / come in order to V
  note: The first predicate states the purpose of a motion verb; it is not a general-purpose replacement
    for all purpose clauses.
  examples:
  - target: 책을 사러 가요.
    english: I am going to buy a book.
  - target: 친구가 밥을 먹으러 왔어요.
    english: A friend came to eat.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g030
  pattern: V-(으)ㄹ까요?
  english: shall we V?; shall I V?
  note: A tentative proposal or offer; predictive question uses are introduced later.
  examples:
  - target: 같이 점심을 먹을까요?
    english: Shall we have lunch together?
  - target: 제가 문을 닫을까요?
    english: Shall I close the door?
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g031
  pattern: V-ㅂ시다 / -읍시다
  english: let's V; formal proposal
  note: Do not assume this ending is deferential enough for every request to a superior; a question may
    be more appropriate.
  examples:
  - target: 같이 공부합시다.
    english: Let's study together.
  - target: 여기에서 조금 쉽시다.
    english: Let's rest here for a little while.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g032
  pattern: V-(으)ㄹ 수 있다 / 없다
  english: can / cannot V
  note: Expresses ability or possibility; the bound noun is written separately.
  examples:
  - target: 한국어를 읽을 수 있어요.
    english: I can read Korean.
  - target: 오늘은 갈 수 없어요.
    english: I cannot go today.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g033
  pattern: V-고 있다
  english: be V-ing; ongoing activity
  note: Teach ongoing action first; resultant-state uses depend on the verb and are introduced later.
  examples:
  - target: 지금 책을 읽고 있어요.
    english: I am reading a book now.
  - target: 친구를 기다리고 있어요.
    english: I am waiting for a friend.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g034
  pattern: A-(으)ㄴ N
  english: N that is A; descriptive noun modifier
  note: Descriptive predicates directly modify nouns; the existential adjective family has a different
    modifier form.
  examples:
  - target: 작은 가방을 샀어요.
    english: I bought a small bag.
  - target: 좋은 친구가 있어요.
    english: I have a good friend.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g035
  pattern: 수량 + 단위 명사
  english: number plus counter
  note: Use native or Sino-Korean numbers according to the counter; native one through four contract before
    counters.
  examples:
  - target: 사과 두 개를 주세요.
    english: Please give me two apples.
  - target: 학생 세 명이 왔어요.
    english: Three students came.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik1-g036
  pattern: V/A-(으)시-
  english: subject honorific marker
  note: Honors the subject, not the listener; some common predicates use a special honorific word instead.
  examples:
  - target: 선생님이 책을 읽으세요.
    english: The teacher is reading a book.
  - target: 할머니가 오셨어요.
    english: Grandmother came.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 1 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
