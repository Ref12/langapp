sources:
- id: hangeul-stroke-order-reference
  url: https://github.com/MagisterAdamus/hangeul-stroke-order
  revision: 935483f7e93d24aa2ec990bca1b43664307768d2
  author: Adam Stone
  declared_license: CC-BY-SA-4.0
  disposition: reference-only-no-geometry-import
  inspected_individual_svgs: 35
  finding: Each jamo is a single filled path with closed outline contours; numbered arrows are separate closed filled polygons, not ordered letter centerlines.
  examples:
  - svg/04_rieul.svg has one letter-outline path and three annotation arrows.
  - svg/08_ieung.svg has outer and inner outline contours; the annotation does not supply a complete closed pen loop.
  - svg/34_wae.svg has one letter-outline path and five annotation arrows.
  - svg/22_yu.svg uses class jamo but a different group ID; selection by ID alone misses it.
  gaps: Five tense consonants, eleven final clusters, contextual glyph forms, and syllable layout recipes are not supplied.
  rights_limit: README credits UnPen and Inter but does not pin font versions or establish the complete rights lineage for derived UnPen glyph outlines.
  retained: Only the unchanged, licensed README and project license; no SVG artwork or fonts are redistributed.
- id: animcjk-reference
  url: https://github.com/parsimonhi/animCJK#svgsko
  disposition: wrong-script
  finding: The primary README identifies svgsKo as 535 Hanja, not a Hangul dataset.
- id: wikimedia-hangul-reference
  url: https://commons.wikimedia.org/wiki/Commons:Stroke_Order_Project/Hangeul
  disposition: reference-only-no-geometry-import
  finding: The project lists 35 letters. Inspected KIYEOK PNG/GIF files contain raster diagrams, not editable pen trajectories.
  rights_limit: Per-file metadata differs; the PNG is public domain, while FanNihongo's KIYEOK GIF is CC-BY-3.0.
  additional_candidate: https://commons.wikimedia.org/wiki/File:Hangeul_letter_order.svg
  additional_limit: The chart page identifies Byeonggwan and PD-self, but the raw SVG returned HTTP 429; its geometry was not established.
- id: hilokal-handwriting-reference
  url: https://github.com/Hilokal/korean-handwriting
  revision: 44f3cd4c17753984253e5ec70456213ef6883d63
  disposition: unlicensed-not-imported
  finding: The primary README says a license is still to be added; training recordings are not committed and sampled model output is described as nearly legible.
- id: unicode-hangul-reference
  url: https://www.unicode.org/versions/Unicode17.0.0/core-spec/chapter-18/#G31028
  disposition: structure-only
  finding: Unicode specifies modern positional jamo and three line-based vowel placements, not ordered handwriting paths or exact contextual glyph geometry.
