  - The independently checked 상한선 is present and selected; exact 하한선 was not found. No fictitious partner ID is made.
  - Narrow technical maximum/minimum-function values and the speed-only 가속도 definition are not used to manufacture a mathematical or physical curriculum.
  - The additional nominal counterparts of 균등하다 and 균일하다 are not selected merely for a noun/predicate catalogue.
  - The inspected 높다 fame/grand-ideal positions and additional 높이 status/fame/ideal positions are retained but not selected just to fill every row.
  - Alternate exact-time14378, cosmic-energy 정기14414, moral-path 정도14442, foundational 기간32657 and emphatic-my 이내10502 remain out of this practical scope.
  - Extra total-name 총계 and diameter-name 직경 are not added solely as another spelling of already covered concepts.
limitations: >
  Selection, provisional lexical/category decisions, disambiguation,
  pronunciation crosswalks and pedagogy need qualified Korean review. No
  official sense IDs, source-band-to-teaching/exam mappings, learner records,
  audio assessments or up-to-date policy thresholds are supplied.
