source_correction_requests:
  ko-nikl-14377-s001:
    source_korean: "정확히 그 시각."
    source_english: "An exact hour."
    authored_interpretation: the exact specified time
    rationale: Preserve the stated 시각 rather than restricting the source to a whole hour; idiomatic time phrasing still needs qualified review.
  ko-nikl-15283-s003:
    source_korean: "온도, 습도, 압력 등이 정해진 기준보다 위에 있다."
    source_english: "The temperature, humidity, pressure, etc., being higher than normal."
    authored_interpretation: to exceed a set temperature, humidity or pressure reference
    rationale: A set reference is not necessarily a normal or medically safe value; preserve the Korean's actual comparison basis.
  ko-nikl-15288-s002:
    source_korean: "온도나 습도나 압력 등이 기준치보다 위에 있게."
    source_english: "In the state of the temperature, humidity, pressure, etc., being higher than normal."
    authored_interpretation: above a reference temperature, humidity or pressure level
    rationale: Preserve comparison with a reference value rather than an unsupported normality or safety threshold.
  ko-nikl-15288-s006:
    source_korean: "소리나 음계가 보통보다 크거나 위에 있게."
    source_english: "In the staten of a sound being at a high pitch."
    authored_interpretation: loudly or at a high pitch
    rationale: The Korean 크거나 위에 retains loudness as well as pitch; the English omits the volume alternative. No audio assessment is implied.
  ko-nikl-18385-s001:
    source_korean: "같은 비율."
    source_english: "The state of being equal in points, the score, etc., in a contest."
    authored_interpretation: the same ratio or rate
    rationale: The source Korean is not restricted to contest points or scores; preserve its general ratio/rate wording.
  ko-nikl-33239-s003:
    source_korean: "글의 분량이나 말수가 많다."
    source_english: "A piece of writing being long and containing lots of words."
    authored_interpretation: for writing or speech to contain many words
    rationale: Korean includes 말수 as well as written volume; do not erase speech because the English mentions only writing.
  ko-nikl-33317-s003:
    source_korean: "수준이 높거나 정도가 심하게."
    source_english: "At a high level or to an excessive degree."
    authored_interpretation: at a high level or to an intense degree
    rationale: Strong degree need not always exceed an acceptable limit; preserve intensity without an automatic adverse-value judgment.
  ko-nikl-40635-s002:
    source_korean: "어떤 수의 몇 배가 되는 수."
    source_english: "A number obtained by multiplying another number a certain number of times. "
    authored_interpretation: a number that is some multiple of another
    rationale: Korean 몇 배 specifies a multiple, not repeated multiplication of a number by itself; no additional technical definition is supplied.
  ko-nikl-40670-s001:
    source_korean: "거울, 렌즈, 현미경, 망원경 등을 통하여 보이는 물체의 크기와 실제 크기의 비율."
    source_english: "A ratio of the actual size of an object to that of its image seen through a mirror, lens, telescope, microscope, etc. "
    authored_interpretation: apparent-to-actual size ratio through an optical device
    rationale: Preserve apparent-image size relative to actual size, not the English's reversed order. Do not infer a digital-zoom position or instrument accuracy.
  ko-nikl-41929-s001:
    source_korean: "전파나 음파가 1초 동안에 흔들려 움직이는 횟수."
    source_english: "The number of times an electric or sound wave vibrates per second."
    authored_interpretation: radio or sound-wave vibrations per second
    rationale: Use the Korean radio-wave term 전파 rather than an unrestricted electric-wave gloss; keep the per-second and sound-wave scope.
  ko-nikl-47094-s001:
    source_korean: "어떤 양을 채우고 남은 부분."
    source_english: "The remaining or unused portion of something. "
    authored_interpretation: the surplus left after filling a set amount
    rationale: Preserve the Korean after-filling condition instead of including every merely unused portion.
source_boundaries:
  comparisons: >
    이상/이하 first positions include the stated quantity/degree boundary;
    미만 and the exceeding process do not. The separately worded ordering
    positions do not silently acquire that numeric inclusivity. 이내 is
    within the given range; none defines a current legal duration or limit.
  homographs: >
    Preserve full-versus-front 전면 parents, descriptive-long versus
    hair-growing 길다, calculation versus production 산출, physical/
    approximate 내외 versus gender/couple34999, numerical 배수 versus
    water meanings, measurement 치수 versus water control, and fluctuating
    기복 versus praying-for-blessing32848. No Hanja or etymology is inferred.
  public_science: >
    분산 is actual dispersal, not an unprovided statistical-variance sense.
    대칭 is this source's matching-pair description, not complete geometry.
    Reference measurements, apparent-size ratios and regular recurrence do
    not confer accuracy, causation, calibrated instruments or certification.
  voice: >
    높다 source7 is pitch; source12 is sound strength. The actual adverb's
    source6 spans loudness/pitch. Keep IDs, source positions and evidence
    separate rather than teaching volume and pitch as the same physical property.
  leftovers: >
    나머지 contains the residual portion, unfinished work, result and
    division remainder. 잔량 separately contains an amount and things left.
    No remainder, subtotal or total proves that the source inputs are complete.
