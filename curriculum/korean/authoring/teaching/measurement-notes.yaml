placement_rationale:
  - Level6 comparisons and clothing measures fill practical service/label needs; they do not define actual eligibility rules.
  - Levels7-8 cover ranges, leftovers, regular/exact timing and totals, not an expanded catalogue of sizes or units.
  - Levels10-14 support bodily changes, instructions, voice/text descriptions, ordering and real quantity limits.
  - Levels17-22 introduce specifications, reference measurements, ratios, instrumental methods and qualified comparisons for general readers.
  - Levels23-27 distinguish prevalent opinions from truth, total/front readings, irregular fluctuations, degree, intensity and figurative event thresholds.
