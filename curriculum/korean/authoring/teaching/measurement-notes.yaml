  new_function_ids: [ko-lex-10501, ko-lex-10769, ko-lex-11007, ko-lex-38869, ko-lex-40635]
  existing_minimum_family: ko-lex-45397
  minimum_quantity_parent: ko-nikl-45398
  actual_parent_form_joins:
    ko-lex-15283: Source 높이 adverbs join the existing 높다 predicate, not the independent height noun15287.
    ko-lex-33239: Source duration 길이 adverb and writing/sound predicates join descriptive 길다, not hair-growing verb33238 or length noun33258.
    ko-lex-33312: Three actual 깊이 adverb positions join the existing predicate, not depth noun33316.
    ko-lex-41623: Both actual 주기적 POS entries join the protected cycle family, not the death-anniversary counter.
    ko-lex-17003: Actual comparable-power noun and predicate share a family without asserting exact equality.
    ko-lex-18373: Actual equal-rank/degree noun and predicate share a family, distinct from comparability.
    ko-lex-45026: Actual exceeding noun and verb are a lexical process family, not a generated X하다 form or a bound unit.
  synonym_policy: >
    The documented project policy does not collapse similar meanings into
    one lexeme without a variant/category-alternation analysis. 순서/차례,
    너비/폭, 안팎/내외 and 나머지/여분 are useful separate lexical names.
    Some exact definitions overlap; that is semantic evidence, not proof
    of inflection or spelling variants. Their provisional status is explicit.
    The additional words are not awarded other synonyms' sense or modality
    mastery. No new atomic mathematical meaning is inferred from English.
  mixed_content: >
    Spatial 안팎/내외 remain free-accounted with their approximate-quantity
    meanings, like protected 전후; approximation adds no headword. 나머지
    includes actual residual material, unfinished work and result meanings.
    Generic multiplicative 배수 is conservatively function-accounted under
    the existing numeric policy. Opposite inclusive/exclusive comparisons
    stay distinct even when English could call all of them a limit.
