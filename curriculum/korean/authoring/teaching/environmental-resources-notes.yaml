  early_practical: >
    The real braised-dish noun fills a food-label gap at5. Low/high tide
    support travel-condition language at7, without tide predictions. The
    guided assistant and general fishing location support work/leisure at8.
    These uses are not moved late merely to alter the growth curve.
  practical_reports: >
    Document format at15 supports structured work communication. Flooding,
    submersion, fire-setting and firepower at16 support understanding reports,
    not enacting them. At17 distinguish water properties, waste, facilities,
    heat sources and land bordering water. Restoration at18 is unrestricted
    return to original state/shape, unlike damage-specific protected 복구.
  general_reader_explanation: >
    Accumulation at19 supports evidence and experience. Forestry, felling,
    aquatic production, harvest and resource-rich fisheries at20 support
    economic/environmental explanation. At21 distinguish habitat action,
    tides/currents, erosion/weathering/deposition, living regeneration,
    propagation, common elements and source-bounded nuclear waste.
    The two heat sources and land/water margins retain independent senses.
  later_meanings: >
    General layered accumulation at24 and actual figurative overflowing,
    emotional outburst, trend flow and external erosion at25 support
    abstraction. Relative-skill 하수 at26 requires register/context judgment,
    not labels applied to real learners. Emotional clearing at27 is not
    proof of a treatment or a guarantee about mental health.
identity_adjudications:
  preserved_families: >
    재생13118 and 정화14745 gain actual missing positions. The transparent
    서식 plus site element 지 extends protected 서식지09816; actual
    해수면 adds a sea modifier to physical 수면01680. Preserve their
    original canonical labels/members and distinct senses without another
    free base for each modifier or derivation. Do not join document 서식
    or sleeping 수면 merely because their written forms match.
  independent_names: >
    Restore 복원 versus damage-specific 복구, and dirty 오수 versus used/
    discharged 하수, remain distinct actual lexical names. Semantic overlap
    alone is not a variant analysis. Selected nominal action/result
    alternatives and literal/figurative positions do not multiply roots.
  actual_erosion_origin_evidence:
    ko-nikl-20477: {official_entry_id: '80794', origin: 侵蝕, homonym_number: '1', source_scope: external weakening or reduction}
    ko-nikl-20478: {official_entry_id: '80799', origin: 浸蝕, homonym_number: '2', source_scope: natural wearing of land or rock}
  origin_method: >
    The exact matched archive bodies were inspected directly: feat.origin
    and feat.homonym_number supply these values. The reading helper does
    not itself extract origin. Both entries have 침ː식; equal pronunciation
    is not evidence that they are one source lexeme. Eating/sleeping20479
    remains unselected, and no Hanja is assigned to the original mirror.
  other_homographs: >
    Distinguish document/dwelling 서식, food/forestation 조림,
    assistant/tide 조수, lower-skill/sewage 하수, and prevention/fire-setting
    방화. Artificial propagation 양식46197 is not judgment, Western food,
    formats/style or sustenance; it explicitly includes mushrooms.
