    fallback or reading transferred from an unrelated homograph is used.
  changed_definitions:
    ko-nikl-11706:
      official_entry_id: '72645'
      original: 산림을 유지 혹은 조성하고 이를 경제적으로 이용하는 사업.
      current: 산림을 유지 혹은 조성하고 이를 경제적으로 이용하는 산업.
      assessment: Only business 사업 becomes industry 산업; forest establishment/maintenance and economic use remain the same.
    ko-nikl-46598:
      official_entry_id: '67140'
      original: 바다나 강에 사는 생물을 잡거나 캐냄. 또는 그 생물.
      current: 바다나 강에 사는 생물을 잡거나 채취함. 또는 그 생물.
      assessment: The corresponding harvest/catch entry replaces digging out with collecting; use citation text without broadening the original teaching sense.
  examples: >
    Preserve 범ː남, 보권, 이멉, 질쏘, 축쩍 and 여난 from actual text.
    Retain both 퇴적/퉤적, 어획/어훽 and 핵폐기물/핵페기물 alternatives.
    Document-format 서식 versus dwelling 서ː식, food 조림 versus forest
    조ː림, assistant 조ː수 versus tide 조수, and prevention 방화 versus
    fire-setting 방ː화 retain the supplied length marks. These dictionary
    distinctions are not uniformly realized by modern speakers or assessed
    by a text exercise. Six earlier pronunciation holds remain untouched.
source_correction_requests:
  ko-nikl-01979-s001:
    source_korean: 온도, 맑고 흐림, 빛깔, 비중, 어떤 물질이나 세균이 포함된 양 등에 따라 결정되는 물의 성질.
    source_english: 'A property of water determined by its temperature, cleanness or murkiness, color, proportion, the amount of a substance or germ, etc.  '
    authored_interpretation: water quality by temperature, clarity, density and contents
    rationale: 비중 is relative density/specific gravity here, not an unspecified arithmetic proportion. Preserve the complete physical and constituent criteria in the raw source; no potable-water judgment follows.
  ko-nikl-06961-s002:
    source_korean: 쌓였던 감정이 한꺼번에 터져 나옴.
    source_english: An unrestrained expression of a deep-rooted emotion.
    authored_interpretation: a sudden burst of accumulated feelings
    rationale: 쌓였던 describes accumulated feelings; it does not require the English suggestion that their cause is deep-rooted. 한꺼번에 supplies the simultaneous burst.
  ko-nikl-13118-s001:
    source_korean: 죽게 되었다가 다시 살아남.
    source_english: The act of dying and being brought back to life.
    authored_interpretation: reviving after being at the point of death
    rationale: 죽게 되었다가 does not require asserting medically established death followed by reversal. Keep revival from the point of death separate from the original recycling, playback and body-part-regrowth positions; no intervention or outcome is endorsed.
  ko-nikl-21871-s002:
    source_korean: 흙이나 죽은 생물의 뼈 등이 물이나 바람, 빙하 등에 의해 운반되어 일정한 곳에 쌓이는 일.
    source_english: The state of a substance such as soil, the bones of dead creatures, etc., being delivered by streaming water, wind, an iceberg, etc., and being stacked in a certain place.
    authored_interpretation: deposition of material carried by water, wind or glaciers
    rationale: 빙하 denotes glaciers, not the English iceberg. Preserve transport followed by deposition and the source material examples, not an invented separate sediment-material sense.
  ko-nikl-26287-s001:
    source_korean: 바다에서 바닷물이 빠져나가 바닷물의 높이가 가장 낮아진 상태.
    source_english: The natural phenomenon in which the surface of the ocean falls to its lowest level due to the flood tide, or such a time.
    authored_interpretation: low tide; the sea at its lowest level as water recedes
    rationale: The Korean describes receding water and its lowest state, not flood tide. Unlike 만조, this Korean position does not separately list the time; preserve that distinction without providing a local prediction.
  ko-nikl-42765-s002:
    source_korean: 땅의 표면에서 햇볕을 받아 나는 열.
    source_english: Hot air rising from the surface of ground that has been heated by sunlight.
    authored_interpretation: heat at the ground surface produced by sunlight
    rationale: The Korean names heat from sunlight at the ground surface, not necessarily air or its upward movement. This is distinct from the internal-earth heat in position001.
explicit_deferrals:
  source_science_review:
    ko-nikl-40359-s001: >
      The radiation definition in BOTH languages groups alpha and beta
      emissions with electromagnetic waves. Do not import that physical
      classification or silently replace the pinned definition. A qualified
      source/physics review is required; no supplemental source or position
      was invented to fill this gap.
    ko-nikl-37938-s001: >
      The inorganic-material source defines nonliving matter, with water,
      soil and air as examples. That is not a reliable modern organic/
      inorganic classification. Preserve the unselected source observation
      rather than call all nonliving material chemically inorganic.
    ko-nikl-50134-s001: >
      The organic-material Korean frames formation inside living bodies
      through 생명력, while English adds continuously and tenaciously.
      Neither supports a universal modern chemical definition. Do not
      manufacture one or silently repair the original source.
    ko-nikl-15153-s001: >
      The algae homograph describes aquatic photosynthetic plants without
      flowers, reproducing by spores. Its scope needs qualified modern
      biological review, not a guessed new organism-category definition.
      It is not selected as a substitute for current15152 or an absent
      bird-class position.
  lower_priority_or_outside_scope:
    - ko-nikl-14746-s001
    - ko-nikl-14746-s002
    - ko-nikl-15173-s002
    - ko-nikl-20479-s001
    - ko-nikl-46194-s001
    - ko-nikl-48257-s001
