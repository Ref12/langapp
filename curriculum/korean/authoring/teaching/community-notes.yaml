identity_rationale_overrides:
  ko-nikl-01196: One guest/customer identity; retain explicitly marked respect in positions one and two.
  ko-nikl-03314: Formal application and course registration remain one selected action-noun range.
  ko-nikl-10025: Seniority is relative to entering a field or school earlier, not age or graduation order.
  ko-nikl-14411: Retain the source's narrower full-time, age-secured employment definition pending review.
  ko-nikl-16677: Assignment of responsibility and the responsible person share this source noun.
  ko-nikl-16679: Person-in-charge noun; do not infer merger with broader assignment noun 담당.
  ko-nikl-19352: Retain real-estate registration and registered-mail positions within the source group.
  ko-nikl-21748: Interpretation and the interpreter share one source noun, without separate role counting.
  ko-nikl-21831: Telephone conversation and its counter remain one free noun identity.
  ko-nikl-23996: Academic-year and school-grade uses do not generate another identity for annual counting.
  ko-nikl-24056: Coursework credit and academic grade are retained educational noun uses, not extra counter heads.
  ko-nikl-25561: A free household noun includes its counting use; keep separate from furniture.
  ko-nikl-00398: A free household noun includes its counting use; keep separate from generation.
  ko-nikl-29676: Public charges and utility bills are the referents; the source's tax classification needs review.
  ko-nikl-37379: The source explicitly marks this liquid/gas mouthful counter as a bound noun.
  ko-nikl-44408: Medical formula and figurative problem remedy share this source noun.
  ko-nikl-44409: Prescription-document noun; not automatically merged with broader formula/remedy 처방.
  ko-nikl-49137: Container, data-storage, and physical capacity share a source noun; none means medicine dosage here.

review_flags:
  - >
    Scholarship, employment, public-office, medical-training, and public-charge
    definitions retain source-specific institutional assumptions. They are not
    universal descriptions of employment law, scholarship eligibility, or tax law.
    In particular, 공과금 groups utility bills under tax in both source languages.
  - >
    Health names are vocabulary, not independently validated clinical definitions.
    The source's severe-cold description of 독감 and its descriptions of
    dependence and disability require qualified review before instructional prose.
    Disability labels use respectful person-centered wording without making
    universal claims about a person's capabilities.
  - >
    The deferred greenhouse-gas label names the category without endorsing a claim
    that every natural greenhouse effect is pollution. 태양열 is heat from the sun,
    not a fabricated photovoltaic sense, and 해일 is not restricted to earthquakes.
  - >
    The two 잔돈 source boundaries remain provisional despite closely related
    English labels. Do not merge them solely because both can translate as change.
    Actor/act and action/result colexifications do not add multiple free identities.

source_correction_requests:
  ko-nikl-02601-s001:
    source_korean: 정거장이나 역에서 버스나 기차 등을 타고 내리는 곳.
    source_english: A place where one gets off from a bus, train, etc., at a station or stop.
    authored_interpretation: a platform or area for boarding and alighting at a stop
    rationale: The Korean explicitly includes both boarding and alighting; the English omits boarding.
  ko-nikl-43894-s001:
    source_korean: 자동차가 다니는 도로에 일정한 너비로 나누어 표시한 선.
    source_english: A part of road of a certain width designated by parallel lines for the passage of vehicles
    authored_interpretation: a line marking out lanes on a road
    rationale: >
      This position identifies the marked line, while the English describes
      the road area. Keep it distinct from position two, the traffic lane itself.
  ko-nikl-10193-s001:
    source_korean: 시험에 응함.
    source_english: An act of applying for a test.
    authored_interpretation: sitting for an examination
    rationale: The Korean describes taking the examination, not merely applying or registering for it.
  ko-nikl-02639-s001:
    source_korean: 어떤 일을 허락함.
    source_english: The act of agreeing to do something.
    authored_interpretation: approval or authorization of an action
    rationale: >
      The Korean describes allowing an action. The English can instead imply
      personally undertaking it; the label preserves the authorization role.
  ko-nikl-03281-s001:
    source_korean: 어떤 모임이나 단체에 새로 들어옴.
    source_english: A person who has newly joined a group or organization.
    authored_interpretation: new entry into a group or organization
    rationale: >
      The Korean defines entry or joining, not a person. A newcomer use must not
      be silently substituted for this retained position.
  ko-nikl-10025-s002:
    source_korean: 같은 학교를 자기보다 먼저 입학한 사람.
    source_english: 'A person who graduated from the same school earlier than oneself. '
    authored_interpretation: a person who entered the same school earlier
    rationale: >
      Entry to the school, not graduation from it, establishes the source
      relationship. These can differ when enrollment paths or durations differ.
  ko-nikl-23494-s002:
    source_korean: 컴퓨터의 출력 결과를 종이에 인쇄하는 기계.
    source_english: A machine used to print what is on the computer screen on paper.
    authored_interpretation: a machine that prints computer output on paper
    rationale: Computer output is not restricted to what is displayed on the screen.
  ko-nikl-30681-s001:
    source_korean: 사회적 경험이나 학식을 바탕으로 사회생활, 문화 등 여러 분야에 걸쳐 쌓은 지식이나 품위.
    source_english: Knowledge or a dignified manner gained from many fields, such as culture, etc., and forming a basis for social experience or learning.
    authored_interpretation: cultivated knowledge and refinement from learning and experience
    rationale: >
      Social experience and learning are the basis for the acquired cultivation
      in Korean. The English reverses this relationship by making cultivation
      the basis for that experience or learning.

remaining_gaps:
  - The broad free-lemma planning guide remains unmet; this is a bounded useful addition.
  - Actual phase introductions must be recomputed after composition, not repaired by moving vocabulary.
  - Further common predicates and conversational expression still need targeted selection.
  - The excluded greenhouse-gas pronunciation, teacher review, and lexical-family review remain outstanding.
  - No exhaustive review of the unselected source inventory is claimed.

pending_reading_exclusions:
  - id: ko-nikl-48419-s001
    source_parent: ko-nikl-48419
    lemma: 온실가스
    source_position: 1
    source_band: advanced
    reference_level: topik-6
    source_entry: https://huggingface.co/datasets/binjang/NIKL-korean-english-dictionary/resolve/3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9/2024_01.csv#record=48419
    source_korean: '지구 대기를 오염시켜  온실 효과를 일으키는 가스를 모두 이르는 말. 이산화 탄소, 메탄 등의 가스를 말한다.'
    source_english: Gases that pollute the global atmosphere and cause the greenhouse effect, including carbon dioxide, methane, etc.
    proposed_placement: {level: 21, topic: science, ds: 'greenhouse gases, including carbon dioxide and methane'}
    provisional_identity: ko-lex-48419
    status: excluded-pending-qualified-pronunciation-review
    reason: >
      Plain ㄱ versus lexical tensing to ㄲ at the compound 실-가 boundary
      remains unresolved. Neither consulted dictionary entry supplies
      pronunciation text. Spelling, general rules, and generated romanization
      do not establish this word-specific choice.
    decision: >
      The Curriculum coordinator directed exclusion from active teaching
      pending qualified pronunciation review. Do not substitute another sense,
      choose either hypothesis as canonical, or block the other 399 cohort
      senses. The original source record and its identity remain unchanged.
    consulted_reading_sources:
      - dictionary: NIKL Korean Learners' Dictionary
        official_entry_id: '93471'
        locator: https://krdict.korean.go.kr/kor/dicSearch/SearchView?ParaWordNo=93471
        finding: No citation pronunciation text in the pinned archive or consulted entry.
      - dictionary: NIKL Standard Korean Dictionary
        official_entry_id: '515681'
        locator: https://stdict.korean.go.kr/search/searchView.do?word_no=515681&searchKeywordTo=3
        finding: Actual entry content was inspected; no pronunciation text is supplied.

