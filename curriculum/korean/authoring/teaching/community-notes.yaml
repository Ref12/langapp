schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: substantive community and service selection; not complete-scale coverage

scope:
  - Only community-vocabulary.yaml, community-identities.yaml, and this file are authored here.
  - All base, early, expansion, and breadth vocabulary and identities are protected.
  - The cohort author left source records, readings, corrections, manifests, grammar, and runtime code unchanged.
  - Every row and teaching location was manually chosen after inspecting bilingual source senses.
  - Targeted searches discovered candidates; they did not assign levels or select first positions.
  - Source bands, alphabetical order, module totals, and numerical targets never schedule vocabulary.
  - No unsupported headwords or generated noun-plus-hada lexical predicates are added.

integration:
  selections: >
    selection-files.yaml registers community-vocabulary.yaml and
    community-identities.yaml after the prior four selection sets. Duplicate
    source IDs are rejected; existing-key fragments must preserve their
    canonical lemma and category and contain only new members.
  corrections: >
    The eight requests below are incorporated in the parent-owned correction
    ledger with exact original bilingual text and unreviewed interpretations.
    Other ledger entries and their evidence remain unchanged.
  readings: >
    Of 36 originally unsupported parents covering 45 senses, 25 parents and
    31 senses now use official citation text; 10 parents and 13 senses use
    individually authored, unreviewed readings. The resolved_reading_gaps list
    preserves the original diagnostic messages as historical evidence.
    One remaining sense is excluded below pending qualified pronunciation
    review, leaving 399 active cohort senses with supported reading records.

curation_rationales:
  everyday_transactions: >
    Distinguish a customer from a visiting guest, a branch shop from a location,
    receiving an application from submitting it, a return from compensation,
    small denominations from returned change, and service fees from public charges.
    Basic payment choices stay early; formal document handling and overdue items
    accompany unfamiliar service problems.
  transport: >
    Routes, transfers, boarding, alighting, daily first/last services, parking,
    road crossings, and notices support actual arrangements. Delays and traffic
    hold-ups receive their own source senses. A lane marking is not a lane,
    lending is not borrowing, and passing through a place is not diesel fuel.
  work_and_study: >
    Select applications, attendance, shift work, qualifications, course enrollment,
    lecture settings, academic credits, deadlines, copying, approvals, and notices.
    Ordinary computer copying and printing belong in everyday work; their subject
    matter does not automatically force them to a late technology level.
  social_and_public_information: >
    Cohorts, school-entry seniority, introductions, welfare support, public
    facilities, gatherings, and elections support community participation.
    Source-exact inference, authorization, public objection, and factual checking
    deepen these uses later without counting extra senses as new headwords.
  health_and_environment: >
    Public-health offices, admission/discharge, symptoms, prescriptions, hygiene,
    fatigue, weather alerts, outages, waste collection, pollution, and basic energy
    vocabulary support ordinary information needs. Labels are not diagnoses,
    treatment instructions, or advice about medication doses.
  optional_senses: >
    The first attested legal document, internal document routing, formal personnel
    reporting, clinical internship, exceptional legal permission, reagent paper,
    signal interference, electrical capacity, and momentum are optional.
    Public understanding of energy sources and climate remains core.
  inspected_traps: >
    The selected 고장 is a locality, not equipment failure. 역 is an acting or
    assigned role, not a station. 인사 is a prominent person, not greeting or
    personnel administration. The inspected 성적 parents concern sexuality,
    not grades, and are not selected. 일정 denotes fixedness, not a schedule.
    습득 denotes learned knowledge, not finding property. 산소 was a respectful
    grave reference, not oxygen, and is not selected. 용량 is capacity, not an
    invented medicine-dose sense.
  existing_counterparts: >
    Existing core selections already retain oxygen at ko-nikl-08727-s001,
    schedule at ko-nikl-11588-s001, and academic results at
    ko-nikl-00281-s002. The discovery traps above do not mean those useful
    meanings are missing or authorize replacing them with unrelated parents.

identity_policy:
  status: >
    Identities are provisional, explicitly source-anchored teaching candidates,
    not a claim that dictionary rows or spelling/POS pairs prove true lexemes.
    Report source parents, senses, spellings, and free candidates separately.
  identifiers: >
    ko-nikl identifiers retain local pinned-CSV record ordinals and original
    definition positions. ko-lex identifiers are stable local names, not official
    NIKL identifiers.
  retained_boundaries: >
    Each selected parent was inspected as an independent content noun or, for
    mouthful 모금, an explicit bound counter. Keep the selected meanings together
    under that source boundary unless an authored group decision says otherwise.
    Mechanical serialization enumerates these decisions; it does not curate.
  concise_rationales: >
    Group rationales name the selected semantic range and any relevant homograph
    contrast. Full bilingual definitions are not repeated in identity records.
  counters: >
    The phone-call, household, school-year, and academic-credit uses remain with
    their independently usable content nouns. They do not create extra headwords.
    Mouthful 모금 is explicitly a bound noun and is not a free lemma.
  synonymy_and_derivation: >
    Equal English does not merge distinct Korean words. 세대/가구, 증상/증세,
    담당/담당자, and 처방/처방전 retain individual provisional source candidates.
    Related derived families remain reviewable; no automatic suffix-family or
    spelling/POS identity rule is asserted.
  function_items: >
    No new closed reference or discourse operator is selected in this shard.
    Relational people nouns and action/state nouns remain content-word candidates;
    classification is based on the inspected uses, not on their topic.
  bound_form_identity_ids: [ko-lex-37379]
  function_identity_ids: []

documented_group_decisions: {}

