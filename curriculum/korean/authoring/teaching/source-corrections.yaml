schema_version: 1
review_status: AI-authored interpretation; requires qualified Korean-teacher review
policy: >
  Original bilingual source records remain unchanged. These overrides document
  semantic interpretation only, not verified teacher review or a new official
  dictionary definition.
corrections:
  ko-nikl-12978-s001:
    source_korean: 내용이 길고 복잡한 소설, 시, 영화 등.
    source_english: A novel, poem, movie, etc., with a long and complex story.
    authored_interpretation: a long, complex work such as a novel, poem, or film
    rationale: Content need not be a narrative plot. Preserve the original length and complexity without inventing a page or runtime threshold.
  ko-nikl-24490-s001:
    source_korean: 두 가지 이상의 악기로 동시에 연주함. 또는 그런 연주.
    source_english: A musical performance done by two or more instruments, or such a piece of music.
    authored_interpretation: playing two or more kinds of instruments simultaneously
    rationale: The Korean specifies instrument kinds and simultaneous playing, not simply an instrument or performer count. Its result referent is that performance, not a newly composed piece.
  ko-nikl-25926-s001:
    source_korean: 많은 사람들이 즐겨 부르는 노래.
    source_english: Songs many Koreans enjoy singing.
    authored_interpretation: songs many people enjoy singing
    rationale: The Korean supplies no nationality requirement or restriction to modern commercial Korean pop.
  ko-nikl-06362-s001:
    source_korean: 수표나 어음에 적힌 금액을 기한 안에 받지 못하는 일.
    source_english: "A state in which a company fails to receive a certain amount of money written on a check or note. "
    authored_interpretation: a cheque or note not paid by its due date
    rationale: The Korean includes a deadline and does not restrict the recipient to a company. Do not equate this nonpayment with bankruptcy or a current legal classification.
  ko-nikl-14405-s001:
    source_korean: 정치를 맡아 행하는 권력.
    source_english: An authority or administrative organization that is responsible for dealing with political matters.
    authored_interpretation: the power to govern
    rationale: The Korean names governing power, not the administrative organisation added by the English.
  ko-nikl-21881-s001:
    source_korean: 직장을 그만두는 사람에게 일하던 곳에서 주는 돈.
    source_english: The money that an employer gives to a person who resigns from a job.
    authored_interpretation: a workplace's payment to someone leaving a job
    rationale: Do not narrow leaving work to voluntary resignation or infer anyone's actual payment eligibility.
  ko-nikl-29129-s001:
    source_korean: 피해자가 범죄 사실을 경찰이나 법률 기관에 알려 범인을 처벌해 달라고 요구하는 일.
    source_english: The act of reporting a crime to the police or a law enforcement authority and asking them to punish the criminal.
    authored_interpretation: a victim's criminal complaint requesting punishment
    rationale: The Korean explicitly identifies the victim as complainant; no additional eligibility, procedural deadline or finding about a real person is supplied.
  ko-nikl-30825-s001:
    source_korean: 특별시, 광역시 및 인구 50만 이상의 대도시에 두는 동 위의 행정 구역 단위.
    source_english: An administrative district above 'dong (the smallest unit of districts)' in large and metropolitan cities with a population of 500,000 or more.
    authored_interpretation: an urban administrative district above dong
    rationale: The English flattens the separate special/metropolitan-city and large-city population conditions and adds a smallest-unit claim. Preserve the above-dong relation without treating the archive as current law.
  ko-nikl-39129-s001:
    source_korean: 민주주의 이념에 따르게 되거나 민주적인 것으로 바뀌는 것. 또는 그렇게 되게 하는 것.
    source_english: A state in which a nation comes to follow a democratic ideology or becomes democratic; the act of making a nation change in such a way.
    authored_interpretation: becoming democratic or making something democratic
    rationale: The Korean does not restrict the subject to a nation; no real institution is thereby certified democratic.
  ko-nikl-43843-s001:
    source_korean: 장관을 보좌하고 장관의 직무를 대행할 수 있는 장관 다음의 직위. 또는 그 직위에 있는 사람.
    source_english: "A position just below minister, who assists the minister and substitutes for him/her when the office is vacant; a person in such a position. "
    authored_interpretation: a deputy minister or that office
    rationale: The Korean does not require a vacant ministerial office for substitution; do not invent a statutory succession rule.
  ko-nikl-50534-s001:
    source_korean: 어린아이를 돌보고 기름.
    source_english: An act of taking care of and growing a child.
    authored_interpretation: caring for and bringing up young children
    rationale: Raising or nurturing children is not a claim about physically growing a child or a medical outcome.
  ko-nikl-28691-s001:
    source_korean: 계약의 내용을 적고 계약이 성립되었음을 증명하는 문서.
    source_english: A document stating the terms and conditions of an agreement and which proves the contract's validity.
    authored_interpretation: a document recording a contract's terms and formation
    rationale: Formation does not establish legal validity or enforceability; preserve the actual Korean scope.
  ko-nikl-48777-s001:
    source_korean: 한 나라 안에 일정 기간 이상 머무르는 외국인이 발급받는 신분증명서.
    source_english: The ID certificate issued to a foreigner who stays in a country exceeding a fixed period.
    authored_interpretation: a foreign-resident ID for stays of at least a set duration
    rationale: 이상 includes equality, unlike exceeding. This retained but unselected source correction does not invent a duration or current immigration eligibility.
  ko-nikl-05204-s001:
    source_korean: 법과 명령.
    source_english: Law and order.
    authored_interpretation: laws and official orders
    rationale: The Korean enumerates legal instruments, not the English public-order idiom.
  ko-nikl-43503-s002:
    source_korean: 행정 기관이 법에 따라 세금, 수수료, 벌금 등을 국민에게서 거두어들임.
    source_english: An act of legally imposing taxes, fees, fines, etc., on the public by an administrative institution.
    authored_interpretation: "government collection of taxes, fees or fines under law"
    rationale: Collection is not assessment or imposition; no actual authority, liability or procedure is established.
  ko-nikl-44285-s001:
    source_korean: 국가, 지방 자치 단체, 은행, 회사 등이 사업에 필요한 자금을 빌리기 위해 발행하는 유가 증권.
    source_english: Securities issued in order for the government, a local government, bank, company, etc., to raise funds necessary for a project.
    authored_interpretation: bonds issued to borrow funds for a project or business
    rationale: The Korean explicitly names borrowing, rather than undifferentiated fundraising or an investment-return promise.
  ko-nikl-19305-s002:
    source_korean: 잘못되거나 부족한 점을 따져서 드러나게 하다.
    source_english: "To find someone's fault or shortcoming, and make it exposed.  "
    authored_interpretation: to examine and expose faults or shortcomings
    rationale: Preserve examination and exposure without restricting the faults to a particular person's character.
  ko-nikl-33704-s002:
    source_korean: 어떤 사실에 대해 분명하게 말해서 지적하거나 들춰내다.
    source_english: To disclose or find fault with something by clearly stating its problems.
    authored_interpretation: to point out or expose a fact by stating it clearly
    rationale: The Korean permits stating and pointing out a fact, not exclusively finding problems.
  ko-nikl-39824-s001:
    source_korean: 다른 사람의 비판이나 농담 등의 말을 맞받아 대꾸하다.
    source_english: To answer upon hearing someone's criticism, joke, etc.
    authored_interpretation: to counter a criticism or joke with a reply
    rationale: Retain the counter-reply perspective rather than any answer; replying does not necessarily refute a fact.
  ko-nikl-39819-s003:
    source_korean: 다른 사람의 말이나 노래를 받아 거침없이 처리하다.
    source_english: To take over someone's remark or song, and to continue it without hesitating.
    authored_interpretation: to handle another's words or song without hesitation
    rationale: 처리하다 names handling the received words or song, not necessarily continuing the same utterance.
  ko-nikl-36532-s002:
    source_korean: 서로 밀접한 관련을 맺으며 어우러지다.
    source_english: For two things or people to be closely connected and get along.
    authored_interpretation: to be closely interrelated and intertwined
    rationale: Mutual relation and combination need not be friendly interpersonal agreement, as English get along can suggest.
  ko-nikl-04148-s002:
    source_korean: 생각이 날 듯하면서도 나지 않다.
    source_english: Something almost coming to one's mind, but in the end, disappearing.
    authored_interpretation: to almost come to mind but remain unrecalled
    rationale: The Korean does not require an actual recalled thought that subsequently disappears.
  ko-nikl-16728-s003:
    source_korean: 마음이 넓지 못하거나 행동이나 모습이 시원스럽지 못하다.
    source_english: Behavior or appearance looking bored and rigid, or narrow-minded.
    authored_interpretation: to be narrow-minded or frustratingly constrained
    rationale: The Korean does not establish that the person is bored; do not attribute that inner state from appearance.
  ko-nikl-27958-s002:
    source_korean: 다해야 고작.
    source_english: At a minimum.
    authored_interpretation: only; amounting to no more than
    rationale: This is a restrictive total, not a lower-bound or at-least claim. Keep the raw erroneous English unchanged.
  ko-nikl-32030-s001:
    source_korean: 제법 이치에 맞고 말이 되는 듯하다.
    source_english: Making sense and standing to reason.
    authored_interpretation: to seem plausible and reasonably coherent
    rationale: Preserve 듯하다 apparent plausibility; the English omits that qualification and cannot establish truth.
  ko-nikl-47463-s001:
    source_korean: 어떤 사물을 보거나 듣거나 생각할 때 그것과 관련 있는 사물을 머릿속에 떠올리다.
    source_english: To be reminded of things related to an object when one sees, hears, or thinks of it.
    authored_interpretation: to bring related things to mind
    rationale: >
      The Korean uses the active bringing-to-mind perspective. Preserve it
      without requiring another person to provide a reminder or treating
      association as proof that the associated objects have a real connection.
  ko-nikl-36383-s002:
    source_korean: (낮추는 말로) 자기의 말.
    source_english: (impolite form) One's own words.
    authored_interpretation: one's own words (humble)
    rationale: >
      Self-humbling reference to one's own words is not impoliteness to a
      listener. Keep the speaker perspective separate from the honorific
      reference to another person's words in position001.
  ko-nikl-09327-s002:
    source_korean: 다른 사람이 하는 말을 잘 이해하며 듣다.
    source_english: To listen carefully to another person.
    authored_interpretation: to listen with understanding to what someone says
    rationale: >
      The Korean explicitly includes comprehension, not only careful
      attention or the intention to retain advice in position001.
  ko-nikl-21102-s001:
    source_korean: 잘 알아듣도록 자상하고 조리 있게 말해 주다.
    source_english: To say something kindly and logically in order to get someone to understand and agree.
    authored_interpretation: to explain kindly and coherently to help someone understand
    rationale: >
      The Korean aims at understanding through kind, coherent explanation;
      the English adds agreement. Comprehension does not automatically mean
      acceptance or compliance.
  ko-nikl-16384-s001:
    source_korean: 물체를 잘랐을 때 나오는 면.
    source_english: The cross section of something cut lengthwise.
    authored_interpretation: a surface exposed by cutting an object
    rationale: >
      The Korean specifies a cut surface without a longitudinal orientation.
      Keep this broad scope separate from the actually perpendicular-to-length
      surface of 횡단면52150, which is not a generic cut direction.
  ko-nikl-43251-s001:
    source_korean: 어떤 재료에서 느껴지는 독특한 느낌.
    source_english: A distinctive quality one feels when touching something.
    authored_interpretation: a distinctive feel or quality of a material
    rationale: >
      The Korean does not require touching. Do not import the skin-contact
      condition that belongs to the different tactile noun 촉감45191.
  ko-nikl-43251-s002:
    source_korean: 물감, 캔버스, 화구 등이 만들어 내는 화면 대상의 느낌.
    source_english: A quality one feels from the surface of a work of art created by paint, canvas, painting tools, etc.
    authored_interpretation: texture conveyed by painting materials and tools
    rationale: >
      Preserve the material/tool-created impression in a picture, without
      restricting it to a touched physical substrate or excluding depicted
      texture. Material and depicted texture can interact; qualified review
      of this interpretation is still required.
  ko-nikl-45834-s002:
    source_korean: 슬픈 일이나 뜻밖의 사건 등으로 마음에 받은 심한 자극이나 영향.
    source_english: A very strong stimulation or influence one receives from a sad incident or an unexpected accident, etc.
    authored_interpretation: emotional shock from distressing or unexpected events
    rationale: >
      The Korean event/incident need not be an accident. Preserve severe
      emotional effect without requiring physical impact or implying a
      clinical diagnosis.
  ko-nikl-02600-s001:
    source_korean: 동력을 이용하여 사람이나 짐을 위아래로 나르는 장치.
    source_english: An installation that conveys people or freight up and down, using electric power.
    authored_interpretation: a powered lift for people or goods
    rationale: >
      Motive power in Korean is broader than the English electric power.
      Retain the lifting function without asserting an exclusive drive
      mechanism; this is not qualified linguistic or engineering review.
  ko-nikl-10855-s001:
    source_korean: 귀에 꽂아서 기계에서 나오는 소리를 듣는 작은 장치.
    source_english: 'A little device that a person inserts over his/her ears to listen to the sounds coming from a machine. '
    authored_interpretation: earphones inserted into the ears
    rationale: >
      The Korean places the small device into the ear. The English over
      should not redefine these as over-ear headphones.
  ko-nikl-35915-s001:
    source_korean: 소리를 전류로 바꾸어 소리가 크게 나게 하는 기계.
    source_english: A machine that changes sound into electric currents to make the sound louder.
    authored_interpretation: a microphone converting sound into electrical signals
    rationale: >
      Retain sound-to-electrical conversion without claiming that a microphone
      alone is an amplifier or loudspeaker. The source compresses the roles
      of several sound-system components; qualified domain review is needed.
  ko-nikl-13920-s001:
    source_korean: 전기장이나 도체 내에 있는 두 점 사이의 전기 에너지의 차.
    source_english: Difference in electric energy between two points in an electric field or conductor.
    authored_interpretation: voltage; electrical potential difference
    rationale: >
      Both original definitions omit the per-unit-charge distinction from
      raw energy difference. The official pronunciation source74720 repeats
      that imprecision and is not independent scientific verification.
      Name the actual voltage concept as potential difference while preserving
      the original wording. This authored clarification needs qualified
      Korean and physics review; it supplies no measurement or repair procedure.
  ko-nikl-28411-s001:
    source_korean: 환자나 장애인을 위해 바닥을 평평하지 않고 기울어지게 만든 통로.
    source_english: 'A passage made with an inclination instead of being flat for wheelchairs or strollers. '
    authored_interpretation: an access ramp for patients or disabled people
    rationale: >
      Korean names the people served, whereas English replaces them with
      wheelchairs and strollers. Preserve the human-access purpose without
      importing an unmentioned stroller restriction or claiming that any
      particular ramp meets accessibility requirements.
  ko-nikl-29719-s001:
    source_korean: 한 건물에 두 세대 이상이 각각 독립하여 살 수 있게 만들어진 주택.
    source_english: A housing unit made for more than two families where they can live independently in one building.
    authored_interpretation: housing for at least two independent households in one building
    rationale: >
      Two or more in Korean includes exactly two; the English more than two
      incorrectly excludes it. Retain independent households rather than
      requiring a blood-related family. No current legal housing classification
      is established by this dictionary definition.
  ko-nikl-30276-s001:
    source_korean: 현실적이지 않고 추상적인 경향을 가지는 것.
    source_english: Work that tends to be abstract or surreal, such as a conceptual poem or work of philosophy.
    authored_interpretation: something abstract rather than grounded in reality
    rationale: >
      The Korean nominal definition describes a general abstract/non-realistic
      tendency, not only a work of art, poem or philosophy. Preserve the
      general scope without importing the English artwork examples or
      equating non-realistic with a particular surrealist genre.
  ko-nikl-07734-s001:
    source_korean: 마음에 없으면서 겉으로만 하는 말.
    source_english: 'An insincere word that will not be put into action. '
    authored_interpretation: insincere remarks not reflecting inward feelings
    rationale: >
      Korean describes outward words without matching inward feeling.
      It does not establish future nonperformance or a promise that will
      be broken. Retain the insincerity distinction without inventing a
      guaranteed future outcome or labelling every courtesy dishonest.
  ko-nikl-28018-s001:
    source_korean: 한국어에서 대화를 나누는 상대에게 예의를 갖춰 말하는 상대 높임법 중 하나.
    source_english: As one of the addressee honorifications, a level of speech, which raises the addressee in the Korean language.
    authored_interpretation: a formal addressee speech style in Korean
    rationale: >
      The label names the formal-style category without promising that every
      formal style raises the listener. Relative speech-level classification
      and polite/high address must not be collapsed by the brief source wording.
      This is an authored pedagogical qualification, not a replacement
      official definition or evidence of professional grammar review.
  ko-nikl-31087-s001:
    source_korean: 사람들이 일상적인 대화에서 쓰는 말처럼 적은 문체.
    source_english: 'The style of a piece of writing where everyday conversations are written down. '
    authored_interpretation: a conversational style of writing
    rationale: >
      Korean 처럼 describes resemblance to everyday conversation, not a
      requirement to transcribe an actual conversation as the English can
      imply. Keep the writing-style meaning and both original source strings.
  ko-nikl-21387-s001:
    source_korean: 태양과 그것을 중심으로 돌고 있는 지구를 비롯한 천체의 집합.
    source_english: The sun and its group of planets, including the Earth, that go around the sun.
    authored_interpretation: the solar system
    rationale: Korean 천체 includes celestial bodies rather than restricting the group to planets; preserve the ordinary system term without the narrower English restriction.
  ko-nikl-42880-s001:
    source_korean: 땅속에 고여 있는 물.
    source_english: 'Stagnant water that is under the ground. '
    authored_interpretation: groundwater
    rationale: English stagnant adds an immobility implication to underground collected water; the term must not teach that all groundwater is motionless.
  ko-nikl-37821-s002:
    source_korean: 일이 제대로 되지 못하다.
    source_english: Ugly and not pretty in appearance.
    authored_interpretation: for things not to work out properly
    rationale: The Korean concerns work or events not proceeding properly, not ugliness of appearance. Preserve the actual situation/outcome perspective rather than copying this unrelated English definition.
  ko-nikl-24117-s001:
    source_korean: 전보다 훨씬 더.
    source_english: 'Much better than before. '
    authored_interpretation: much more than before
    rationale: The Korean expresses a greater degree than before, without requiring an improvement. The English better adds an unsupported positive direction to the comparison.
  ko-nikl-31953-s002:
    source_korean: 좋지 않거나 모자라는데 그것마저도.
    source_english: With disappointment over something when others are unsatisfactory or insufficient.
    authored_interpretation: even that, though it is already inadequate
    rationale: The Korean refers back to the already-poor or insufficient thing with 그것마저도. It does not introduce other unsatisfactory things as the English others suggests; the discourse perspective remains context-dependent.
  ko-nikl-01683-s001:
    source_korean: "사람이나 동식물이 살아 있는 기간."
    source_english: "The length of time during which a person or animal is alive. "
    authored_interpretation: "lifespan of a person, animal, or plant"
    rationale: Korean 동식물 explicitly includes plants; the English omits them.
  ko-nikl-05146-s001:
    source_korean: "사방으로 펼쳐진 넓고 평평한 땅."
    source_english: "Wide, flat, open land with no fences, etc."
    authored_interpretation: wide open flat land
    rationale: The Korean describes broad flat open land without requiring fences to be absent.
  ko-nikl-10622-s002:
    source_korean: "실천에 대립되는 관념적인 지식."
    source_english: "Ideological knowledge as opposed to practice."
    authored_interpretation: abstract theoretical knowledge rather than practice
    rationale: 관념적인 contrasts abstract knowledge with practice here; ideological can misleadingly add a political or doctrinal restriction.
  ko-nikl-22638-s001:
    source_korean: "부풀어서 크기가 커짐."
    source_english: "The state of something becoming bigger because it has been inflated."
    authored_interpretation: physical expansion or swelling
    rationale: Review the passive inflation wording, which can suggest a specific inflation process rather than the Korean's general swelling or enlargement.
  ko-nikl-27655-s001:
    source_korean: "말라서 물기나 습기가 없음."
    source_english: "Neither wet nor humid due to evaporation."
    authored_interpretation: absence of moisture or humidity
    rationale: The Korean describes dryness without naming evaporation as the required physical mechanism.
  ko-nikl-29857-s003:
    source_korean: "수학 계산, 과학에서 법칙을 수식이나 기호로 나타낸 것."
    source_english: "In math and science, a state in which rules are indicated in words or symbols. "
    authored_interpretation: a mathematical or scientific formula
    rationale: 수식 means a mathematical expression rather than words; the noun names the formula representing a rule rather than a state.
  ko-nikl-35728-s002:
    source_korean: "어떤 성질의 강한 정도."
    source_english: "Depth or intensity of emotions such as love, sadness, etc. "
    authored_interpretation: intensity of a quality
    rationale: Korean refers to the strength of a quality generally; the English confines it to emotions.
  ko-nikl-43241-s001:
    source_korean: "빛깔이 붉고 물기가 있어 잘 들러붙는 흙."
    source_english: "Soil that is sticky and red because it contains a large amount of water."
    authored_interpretation: reddish moist sticky soil
    rationale: The Korean separately gives reddish color and moisture-related stickiness; it does not say abundant water causes redness.
  ko-nikl-44596-s001:
    source_korean: "탄소가 2퍼센트 미만으로 들어 있고 열로 성질을 변화시킬 수 있어 여러 가지 기계나 기구 등의 재료로 쓰이는 철."
    source_english: "Steel that contains less than 2% of carbon, which is used for making machines, equipment, etc., because of the ease with which it can be shaped when heat is applied."
    authored_interpretation: steel
    rationale: Heat changing 성질 means changing properties, not merely being easy to shape; retain the material term without teaching the altered explanation.
  ko-nikl-47652-s001:
    source_korean: "적도에 가까우며, 연평균 기온이 섭씨 20도 이상인 덥고 비가 많이 오는 지역."
    source_english: "A region with a great deal of rainfall, which is near the equator and has an annual average temperature of over 20 degrees Celsius. "
    authored_interpretation: tropical regions
    rationale: Korean 20도 이상 includes exactly 20 while English over 20 excludes it; the simplified climate description separately needs qualified geographical review.
  ko-nikl-02642-s001:
    source_korean: 어떤 일을 허락하다.
    source_english: To agree to do something.
    authored_interpretation: to approve or authorize something
    rationale: Korean grants permission for something; English agreeing to do it shifts the approving participant into the acting participant.
  ko-nikl-05843-s001:
    source_korean: 어떤 일이 잘 이루어지도록 조건을 마련하거나 보호하다.
    source_english: To assure someone that there will not be a problem, or protect someone so that he/she will not meet a problem.
    authored_interpretation: to provide conditions or protection for successful fulfillment
    rationale: Korean includes establishing conditions for something to be fulfilled; English unnecessarily narrows this to reassurance or protection of a person.
  ko-nikl-17192-s002:
    source_korean: 어떤 두 대상이 서로 짝을 이루다.
    source_english: For two things to be equivalent to each other.
    authored_interpretation: for two things to correspond or form a pair
    rationale: Pairing or correspondence in Korean does not require equivalence or identical value.
  ko-nikl-24410-s002:
    source_korean: 말이나 글이 속에 많은 뜻을 담고 있다.
    source_english: For a speech or text to contain many hidden meanings or messages.
    authored_interpretation: for speech or writing to contain many meanings
    rationale: Korean says many meanings are contained; unlike the first position it does not independently require concealment.
  ko-nikl-25010-s002:
    source_korean: 주로 경기에서, 막아야 할 것을 막지 못하여 당하다.
    source_english: Usually in a game, to lose by failing to defend against an attack, etc.
    authored_interpretation: to concede something in a game by failing to stop it
    rationale: Korean concerns allowing what should have been defended against; conceding a hit or point does not entail losing the whole game.
  ko-nikl-25992-s001:
    source_korean: 사실이 아니거나 사실인지 아닌지 분명하지 않은 것을 임시로 받아들이다.
    source_english: 'To accept temporarily an unproven or uncertain fact. '
    authored_interpretation: to temporarily assume something untrue or not established
    rationale: Retain the explicit Korean counterfactual alternative as well as uncertainty; an assumption need not be an unproven fact.
  ko-nikl-27068-s001:
    source_korean: 부족한 점, 잘못된 점, 나쁜 점 등을 고쳐서 더 좋아지게 하다.
    source_english: To reform shortcomings, wrong or bad sides, etc., to one's character and make them better.
    authored_interpretation: to correct shortcomings or faults and make something better
    rationale: Korean is not restricted to personal character; faults in a service or system can also be improved.
  ko-nikl-37284-s001:
    source_korean: 글로 분명하게 드러내 보이다.
    source_english: To make something clear in a statement or an expression.
    authored_interpretation: to specify something clearly in writing
    rationale: Preserve the Korean 글로 written-medium restriction instead of allowing English expression to imply any spoken clarity.
  ko-nikl-41209-s001:
    source_korean: 벌어진 사태에 대하여 적절한 대책을 세워서 행하다.
    source_english: To develop and implement an adequate solution to an issue.
    authored_interpretation: to devise and take appropriate measures for a situation
    rationale: The Korean involves responsive measures; English solution can incorrectly imply that the issue has been fully resolved.
  ko-nikl-42423-s001:
    source_korean: 어떤 사건이나 내용이나 판단이 진실인지 아닌지를 증거를 들어서 밝히다.
    source_english: To establish that an event, some certain content, or a decision is true by presenting proof.
    authored_interpretation: to establish with evidence whether something is true
    rationale: Korean establishes whether it is true or not; the English affirmative-only claim loses the falsity alternative.
  ko-nikl-42423-s002:
    source_korean: 수학이나 논리학에서, 어떤 명제나 판단이 진실인지 아닌지를 근본 원리로부터 이끌어 내어 밝히다.
    source_english: To demonstrate that a proposition or judgment is true by using fundamental principles, in mathematics or logic.
    authored_interpretation: to determine truth or falsity from fundamental principles
    rationale: Preserve whether a mathematical/logical proposition is true or false rather than automatically asserting its truth.
  ko-nikl-39751-s001:
    source_korean: 반대되는 근거를 들어 어떤 사실이나 주장이 옳지 않음을 증명함. 또는 그런 증거.
    source_english: The act of refuting that a fact or argument is wrong through counterevidence, or such an evidence.
    authored_interpretation: disproof by contrary evidence; such counterevidence
    rationale: >
      Korean proves that a claim is not correct by contrary evidence.
      English refuting that it is wrong reverses that direction. Keep
      the disproving act and evidence alternatives without that reversal.
  ko-nikl-39751-s002:
    source_korean: 어떤 사실과 모순되는 것 같지만, 오히려 그것을 증명한다고 볼 수 있는 사실.
    source_english: A fact that seems to contradict a certain fact, but instead proves that it is right.
    authored_interpretation: an apparently contrary fact that may instead confirm a claim
    rationale: >
      Korean 볼 수 있는 frames apparent contradiction as something that
      can be regarded as confirmation. Retain that interpretive qualification
      rather than asserting every apparently contrary fact proves a claim.
      This original second position is not erased to enforce a one-gloss rule.
  ko-nikl-50562-s001:
    source_korean: 일이나 사건의 전체적인 줄거리.
    source_english: The overall summary of an incident or accident.
    authored_interpretation: the overall outline of a matter or event
    rationale: >
      Korean includes a general matter or event. English incident or accident
      unnecessarily narrows the range; a work proposal can have an outline
      without being an accident.
  ko-nikl-34899-s007:
    source_korean: 위에 있는 것을 낮은 곳이나 아래로 끌어당기거나 늘어지게 하다.
    source_english: To pull something up to a lower place or downward, or to hang it loose.
    authored_interpretation: to pull something down or let it hang lower
    rationale: The English pull something up contradicts the Korean downward movement; preserve lowering or hanging.
  ko-nikl-34882-s002:
    source_korean: 서울 등의 대도시에서 지방으로 오다.
    source_english: To come to a rural area from a large city such as Seoul.
    authored_interpretation: to come from Seoul or another major city to a region
    rationale: A regional destination can include another city; the English rural area is an unwarranted restriction.
  ko-nikl-18224-s009:
    source_korean: 책임이나 공로를 다른 사람에게 넘기다.
    source_english: To pass a responsibility or deed over to another person.
    authored_interpretation: to pass responsibility or credit to someone else
    rationale: 공로 concerns credit or merit for an action, not transfer of the action itself suggested by English deed.
  ko-nikl-34899-s014:
    source_korean: 막이나 커튼 등이 위에서 아래로 옮겨 가다. 또는 그렇게 하다.
    source_english: For a wall, curtain, etc., to move from up downward, or make this happen.
    authored_interpretation: for a curtain to come down, or to lower it
    rationale: The source screen or curtain moves downward or is lowered; wall is misleading in that context.
  ko-nikl-49217-s001:
    source_korean: 억지를 부려 자기의 의견이나 뜻을 고집스럽게 내세우다.
    source_english: To assert one's opinion or will in a persistent manner.
    authored_interpretation: to insist stubbornly and unreasonably on one's view
    rationale: The Korean explicitly combines unreasonable and stubborn insistence; persistent alone can sound neutral or commendable.
  ko-nikl-47309-s003:
    source_korean: 글이나 이야기 등을 구성하기 위해 여러 가지 소재를 일정한 순서와 체계에 맞추어 짜다.
    source_english: To arrange various materials in a certain order or according to a system in order to construct the plot of a novel, story, etc.
    authored_interpretation: to organize material into a structured text or narrative
    rationale: The Korean includes organizing general writing or narrative, not only a fictional plot.
  ko-nikl-07559-s003:
    source_korean: 부족하지만 비교 대상과 어느 정도 닮아 있다.
    source_english: Resembling something, though not precisely.
    authored_interpretation: to resemble something while still falling short of it
    rationale: 부족하지만 retains inadequacy relative to the comparison target, not merely imprecise resemblance.
  ko-nikl-34017-s009:
    source_korean: 말을 하거나 글을 읽을 때 마디와 마디 사이에서 잠시 멈추다.
    source_english: To stop talking or reading temporarily in between words.
    authored_interpretation: to pause between phrases when speaking or reading
    rationale: 마디 refers to speech or reading units, not necessarily each individual word; phrases is an authored phrasing clarification.
  ko-nikl-34018-s008:
    source_korean: 말을 하거나 글을 읽을 때 마디와 마디 사이에서 잠시 멈춰지다.
    source_english: To be paused temporarily between words while speaking or reading.
    authored_interpretation: for speech or reading to pause between phrases
    rationale: The passive phrasing concerns speech/reading units, not obligatory pauses between individual words.
  ko-nikl-47672-s001:
    source_korean: 열매가 나뭇가지에 맺히다.
    source_english: To produce fruit on the branch.
    authored_interpretation: for fruit to form on a branch
    rationale: The Korean describes fruit forming, not a transitive agent producing fruit; this is a perspective clarification.
  ko-nikl-19260-s005:
    source_korean: 아이가 배 속에 생기다.
    source_english: To conceive an embryo.
    authored_interpretation: for a child to be conceived
    rationale: The Korean describes a child coming to be in the womb; the label preserves that grammatical perspective rather than birth or physical entry.
  ko-nikl-06831-s001:
    source_korean: 본래 하나였던 것이 둘 이상으로 나누어짐.
    source_english: "Something being divided into more than two parts. "
    authored_interpretation: division into two or more parts
    rationale: Korean 둘 이상 includes exactly two parts; the English incorrectly requires more than two.
  ko-nikl-30297-s001:
    source_korean: 둘 이상의 사람, 사물, 현상 등이 서로 영향을 주고받도록 관계를 맺고 있음. 또는 그 관계.
    source_english: People, objects, or phenomena, etc., of more than two, being related so as to influence each other, or the relationship.
    authored_interpretation: connection or relevance between two or more things
    rationale: Korean 둘 이상 includes a relationship between exactly two; the English incorrectly says more than two.
  ko-nikl-24001-s001:
    source_korean: 학교를 다닌 경력.
    source_english: The level of education one completes.
    authored_interpretation: educational background; schooling history
    rationale: The Korean describes schooling history, not only a completed level; attendance without completion is not excluded.
  ko-nikl-06354-s001:
    source_korean: 조직을 이루고 있는 군인 집단. 또는 군인 집단이 머물러 있는 시설.
    source_english: An army consisting of a certain number of soldiers or where the army stays.
    authored_interpretation: a military unit or its quarters
    rationale: The Korean names an organized military group or its facilities, not necessarily an entire army.
  ko-nikl-16728-s004:
    source_korean: 공간이 좁아 시원한 느낌이 없다.
    source_english: Feeling a lack of air.
    authored_interpretation: to feel cramped because space is small
    rationale: >
      The Korean explicitly describes cramped space, not necessarily a lack
      of breathable air. Keep this distinct from the breathing/stifling position.
  ko-nikl-16728-s005:
    source_korean: 다른 사람의 태도나 상황이 마음에 차지 않아 안타깝다.
    source_english: Feeling anxious because someone's attitude or situation is not uncomfortable.
    authored_interpretation: to feel frustrated by someone's attitude or a situation
    rationale: >
      The Korean describes dissatisfaction and frustration with an attitude
      or situation. The English negative wording not uncomfortable loses that meaning.
  ko-nikl-39571-s001:
    source_korean: 보고 싶던 사람을 만나거나 원하는 일이 이루어져서 마음이 즐겁고 기쁘다.
    source_english: Joyful and happy as one meets a person that one missed.
    authored_interpretation: to be glad at a welcome meeting or hoped-for event
    rationale: >
      The Korean includes both meeting a missed person and a desired event
      occurring. The English mentions only the meeting.
  ko-nikl-43727-s001:
    source_korean: 어떤 대상을 만나기 위하여 급히 가다.
    source_english: To go to a place to do something in haste.
    authored_interpretation: to hurry to meet someone
    rationale: >
      The Korean purpose is meeting a target. The English substitutes any
      hurried task; this ordinary-person interpretation restores the stated purpose.
  ko-nikl-11492-s002:
    source_korean: 알면서도 아는 것을 숨기거나 어떤 행위를 하는 본래 마음을 숨기고.
    source_english: With one's real purpose or intention hidden.
    authored_interpretation: while concealing what one knows or one's real intention
    rationale: >
      The Korean includes hiding what one knows as well as concealing the
      original intention. The English omits the knowledge alternative.
  ko-nikl-04165-s001:
    source_korean: 전혀 어떠한.
    source_english: 'Not at all. '
    authored_interpretation: any at all (before a noun, usually with a negative)
    rationale: >
      The source is an indefinite noun-modifying determiner. Bare English
      not at all does not express that relation; the label also clarifies
      ordinary negative-context use without claiming a new dictionary erratum.
  ko-nikl-14075-s001:
    source_korean: 도무지. 또는 완전히.
    source_english: By any possibility or wholly.
    authored_interpretation: at all (with a negative); completely
    rationale: >
      The first English phrase obscures ordinary at-all usage with negation.
      Preserve the alternative complete-degree meaning rather than making
      the whole entry negative-only.
  ko-nikl-17364-s003:
    source_korean: 대상이나 상대로 삼다.
    source_english: To consider as a counterpart or opponent.
    authored_interpretation: to take someone or something as a subject or counterpart
    rationale: >
      The Korean includes taking something as a 대상, not only an opponent
      or counterpart. Retain the subject/object-of-discourse interpretation.
  ko-nikl-17306-s002:
    source_korean: 어느 정도로 적당히.
    source_english: 'In a somewhat slapdash manner. '
    authored_interpretation: roughly; to an approximately suitable degree
    rationale: >
      The Korean specifies roughly suitable degree without necessarily
      judging the work careless. English slapdash imposes that negative evaluation.
  ko-nikl-04170-s001:
    source_korean: 정도가 매우 심하게.
    source_english: 'To an extremely severe degree. '
    authored_interpretation: however much; no matter how great the degree
    rationale: >
      This high-degree use belongs to concessive however-much framing, not
      unrestricted affirmative very. This authored contextual interpretation
      requires teacher review; original Korean and English remain unchanged.
  ko-nikl-16773-s001:
    source_korean: 관심이 쏠리거나 마음이 끌리다.
    source_english: To attract interest or attention.
    authored_interpretation: to feel drawn to something
    rationale: >
      Korean describes interest being drawn and the experiencer feeling
      attracted. English attract can suggest only an external causer; this
      selected label retains the experiencing perspective.
  ko-nikl-16773-s002:
    source_korean: 입맛이 생기다.
    source_english: To stimulate the appetite.
    authored_interpretation: to feel an appetite or craving
    rationale: >
      Korean says an appetite arises, whereas English uses causative
      stimulate. The ordinary-food reading expresses feeling an appetite
      or craving rather than intentionally stimulating another person.
  ko-nikl-34604-s008:
    source_korean: 정해진 시간을 다 채우지 않거나 정해진 거리에 도달하지 않게 하다.
    source_english: 'To fail to fill up a certain amount of time or reach a certain distance. '
    authored_interpretation: to leave time or distance still to go
    rationale: >
      Korean describes leaving time or distance not yet completed. English
      fail to can imply unsuccessful performance; retain the remaining-time
      or distance use without assuming failure.
  ko-nikl-31564-s006:
    source_korean: 소리의 울림이 크다.
    source_english: The reverberation of a sound being strong and at low decibels.
    authored_interpretation: to have a full, resonant sound
    rationale: >
      Korean describes full or strong resonance. English adds low decibels,
      which is absent from Korean and confuses sound quality with measured intensity.
  ko-nikl-01312-s001:
    source_korean: 목화에서 나온 섬유로, 주로 이불 속이나 면직물의 재료가 되는 물질.
    source_english: Fabric made of cotton that is mainly used as a material for blanket fillings or cotton cloth.
    authored_interpretation: cotton fiber or wadding
    rationale: >
      Korean names fiber obtained from cotton and used as filling or textile
      material; English incorrectly presents the raw material as finished fabric.
  ko-nikl-01414-s002:
    source_korean: 광물에서 얻을 수 있는 온갖 쇠붙이.
    source_english: 'All kinds of iron extracted from minerals. '
    authored_interpretation: metal in general
    rationale: >
      온갖 쇠붙이 is metals generally, whereas English narrows it to iron.
      The iron-only meaning remains the separately selected first position.
  ko-nikl-07477-s001:
    source_korean: 주로 포장에 사용되는 물건을 만드는 데 쓰는, 불에 잘 타지 않으며 물과 공기가 통하지 않는 질긴 물질.
    source_english: 'A durable substance that is non-flammable, airtight, and water-proof, usually used for making a packing material. '
    authored_interpretation: vinyl; plastic used for wrapping
    rationale: >
      잘 타지 않으며 does not justify the absolute English non-flammable.
      The local material label makes no combustion-safety guarantee; material
      properties require appropriate factual review beyond this lexical task.
  ko-nikl-50874-s001:
    source_korean: 귀금속이나 그릇 등을 만드는 데 쓰는, 흰 광택이 나고 무른 성질이 있는 금속.
    source_english: Metal that is used to make precious stones, kitchenware, etc., that is white and smooth.
    authored_interpretation: silver; the metal
    rationale: >
      English changes precious-metal articles to precious stones and softness
      to smoothness. Korean describes a lustrous white, soft metal used for
      valuable metal articles or utensils; it does not describe manufacturing gems.
  ko-nikl-05613-s001:
    source_korean: 아직 다 자라지 못한 새끼 닭.
    source_english: A young bird that has yet to grow fully.
    authored_interpretation: a chick; a young chicken
    rationale: >
      Korean explicitly specifies a young chicken, not an arbitrary young bird.
      The figurative inexperienced-person position is not selected.
  ko-nikl-27432-s001:
    source_korean: 몸에서 끈적끈적한 줄을 뽑아 그물을 쳐서 벌레를 잡아먹고 사는 작은 동물.
    source_english: A small insect that eats bugs it catches with its web, woven with thin sticky material it releases from its body.
    authored_interpretation: a spider
    rationale: >
      Korean says small animal, while English incorrectly classifies a spider
      as an insect. The selected noun label does not reproduce that classification.
  ko-nikl-33117-s001:
    source_korean: 그 밖의 다른 것.
    source_english: Something similar to the aforementioned.
    authored_interpretation: other things; miscellaneous items
    rationale: >
      Korean says other things outside the preceding set, not things similar
      to the preceding items. This is residual reference, not a guitar.
  ko-nikl-42877-s001:
    source_korean: 땅속이나 땅을 파고 그 아래에 만든 건물의 공간.
    source_english: A story of a building that is made under the ground by digging.
    authored_interpretation: underground; space below ground or in a basement
    rationale: >
      Korean includes general below-ground space as well as underground
      building space. English loses the first alternative by limiting the
      meaning to a building story.
  ko-nikl-33258-s003:
    source_korean: 책이나 글 등의 분량.
    source_english: 'The number of pages in a book or writing. '
    authored_interpretation: the length of a text
    rationale: >
      분량 describes textual extent, not exclusively a literal page count.
      Spatial distance and elapsed time remain separate first and second senses.
  ko-nikl-35972-s001:
    source_korean: 연극에서 막이 올랐다가 다시 내려올 때까지의 장면인 단락을 세는 단위.
    source_english: A bound noun that serves as a unit for counting the number of scenes from the rising to the falling of the curtain.
    authored_interpretation: act; a unit for counting acts of a play
    rationale: >
      The Korean identifies the curtain-bounded division counted by 막.
      English scenes can instead suggest smaller subdivisions within an act.
      This act label remains an unreviewed interpretation requiring qualified
      Korean and theater-terminology review, not an official correction.
  ko-nikl-02486-s001:
    source_korean: 얇고 잘 늘어나는, 목이 긴 여성용 양말.
    source_english: Thin, stretchy, long leggings for females.
    authored_interpretation: thin, stretchy long stockings
    rationale: >
      The Korean explicitly identifies long, thin, stretchy hosiery as 양말,
      not the trouser-like garment normally called leggings in English.
      Preserve the source's wearer convention in evidence without turning
      that convention into a restriction on who can wear the item.
  ko-nikl-41685-s004:
    source_korean: (비유적으로) 이익을 차려 넣어 두는 곳.
    source_english: (figurative) A place where one stashed his/her belongings.
    authored_interpretation: a pocket for one's gains or profit (figurative)
    rationale: >
      The Korean identifies a figurative receptacle for secured gains or
      profit, not simply a physical place to stash belongings. Keep this
      meaning distinct from the portable pouch and clothing-pocket positions.
  ko-nikl-35581-s001:
    source_korean: 감자, 고구마, 물에 불린 녹두 등을 갈아서 가라앉힌 앙금을 말린 가루.
    source_english: 'Flour made by grating potatoes, sweet potatoes, or soaked mung beans in a bowl and drying the sediments settled at the bottom of the bowl. '
    authored_interpretation: starch powder obtained by settling crushed ingredients
    rationale: >
      The Korean identifies the dried, settled sediment separated from crushed
      starchy ingredients, not the entire milled ingredient ordinarily called
      flour. Distinguish cooking starch powder from the plant-carbohydrate
      definition at the separate second source position.
  ko-nikl-09462-s003:
    source_korean: '(비유적으로) 힘이나 기운이 솟아나게 하는 원천.'
    source_english: '(figurative) A place from which spring water gushes out, or its surroundings.'
    authored_interpretation: 'a source of strength or vitality (figurative)'
    rationale: >
      Korean explicitly names the figurative origin (원천) from which strength
      or energy (힘이나 기운) arises. The original English repeats the physical
      spring-site meaning of s002 and therefore does not distinguish s003.
      Retain s001 water/source, s002 physical site, and s003 figurative source
      as distinct source positions; equal English does not imply equal meaning.
  ko-nikl-22715-s002:
    source_korean: 구김이나 주름 등을 없애서 반듯하게 하다.
    source_english: For something folded or overlapped to be spread widely.
    authored_interpretation: to smooth out creases or wrinkles
    rationale: >
      The Korean identifies removing creases or wrinkles and making something
      smooth or straight. The English instead describes a folded object being
      spread, obscuring the distinction from this parent's unfolding position.
      Preserve the separate second position and its transitive smoothing sense.
  ko-nikl-34029-s002:
    source_korean: 관심이 쏠리다.
    source_english: To gather attention.
    authored_interpretation: for one's interest to be drawn toward something
    rationale: >
      The Korean describes interest being drawn or directed. The English can
      misleadingly suggest attracting other people's attention rather than
      experiencing attraction. The authored label makes the direction of
      interest explicit without changing the original source. The lexical
      argument-structure interpretation still requires Korean-teacher review.
  ko-nikl-46331-s001:
    source_korean: 모르고 있는 동안에 벌써.
    source_english: Very early while one does not notice.
    authored_interpretation: before one knows it; already without noticing
    rationale: >
      The Korean describes something already having happened while one did
      not notice. The original English misleadingly introduces being very
      early; the authored label retains unnoticed passage or occurrence.
  ko-nikl-08902-s003:
    source_korean: 자세히 따져서 생각하다.
    source_english: To calculate something thoroughly.
    authored_interpretation: to consider something carefully and in detail
    rationale: >
      The Korean describes careful evaluation and thought, not specifically
      arithmetic. The label avoids the numerical restriction suggested by
      the original English calculate.
  ko-nikl-50267-s002:
    source_korean: 이전 세대가 물려준 것.
    source_english: Something inherited by former generations.
    authored_interpretation: a heritage inherited from previous generations
    rationale: >
      The Korean describes what earlier generations handed down. The English
      reverses that direction by describing what those generations inherited.
      The authored label identifies inheritance from them instead.
  ko-nikl-43882-s001:
    source_korean: 부끄럽거나 안타까워서 도저히.
    source_english: In a state in which one feels compelled to do something out of shame or sympathy.
    authored_interpretation: out of shame or sympathy (with a negative predicate)
    rationale: >
      The Korean uses 도저히 in a shame-or-sympathy context. In its ordinary
      negative-polarity use, 차마 qualifies an inability to bring oneself to
      act; it does not mean that embarrassment or sympathy compels the action.
      The original English points in that misleading positive direction.
      The label leaves the negation to the following predicate and explicitly
      identifies that context. The polarity explanation is authored and
      requires Korean-teacher review, not a claim of verified grammar annotation.
  ko-nikl-50419-s002:
    source_korean: 귀한 물건이나 정보 등이 불법적으로 외부로 나가 버림. 또는 그것을 내보냄.
    source_english: For something contained or stored in one place to flow out.
    authored_interpretation: illegal release of valuables or information
    rationale: >
      The Korean specifically identifies valuable objects or information and
      explicitly qualifies their outward movement as illegal. The English
      gives only a generic flowing-out description and omits both distinctions.
      Preserve this original second position separately from the general
      outflow sense; the authored label does not declare all information
      leakage illegal or change the source definition.
  ko-nikl-44171-s001:
    source_korean: 창문과 가까운 곳이나 옆.
    source_english: The area immediately behind a window.
    authored_interpretation: the area beside or near a window
    rationale: >
      The Korean says near or beside the window, not specifically behind it.
      The label removes the unsupported directional restriction.
  ko-nikl-26019-s001:
    source_korean: 나무나 풀의 큰 줄기에서 갈라져 나간 작은 줄기.
    source_english: A small twig broken off from a branch of a tree or blade of grass.
    authored_interpretation: a branch or twig growing off a larger stem
    rationale: >
      The Korean describes a smaller stem branching from a larger one.
      It does not require that the branch has broken off or become detached.
  ko-nikl-33272-s002:
    source_korean: 수증기가 차갑게 되어 엉긴 작은 물방울.
    source_english: Small droplets made when steam becomes frozen.
    authored_interpretation: tiny water droplets formed as vapor cools
    rationale: >
      The Korean describes cooled vapor collecting into small liquid droplets,
      not freezing into ice. Preserve this second position as distinct from
      heated vapor, warm breath, and gas in a drink.
  ko-nikl-33272-s004:
    source_korean: 탄산음료 속에 녹아 들어가 있는 이산화 탄소.
    source_english: Carbon dioxide melted in soda.
    authored_interpretation: carbon dioxide dissolved in a fizzy drink
    rationale: >
      The Korean describes carbon dioxide dissolved in a carbonated drink.
      The English's melted incorrectly suggests a different physical process.
  ko-nikl-33542-s002:
    source_korean: 약속이나 일 등이 지켜지거나 이루어지지 않다.
    source_english: To break a promise, or something.
    authored_interpretation: for a promise or undertaking to fall through
    rationale: >
      The Korean describes a promise not being kept or an undertaking not
      being realized. The English's active break obscures that result-state
      perspective. Keep it distinct from the selected agentive breaking senses.
  ko-nikl-43829-s001:
    source_korean: 도구에 의해서나 잡아당겨져 갈라지다.
    source_english: To be split by using a tool or being pushed apart.
    authored_interpretation: to be torn apart by pulling or by a tool
    rationale: >
      The Korean specifies being pulled apart, not pushed apart. The label
      preserves that direction and the alternative use of a tool.
  ko-nikl-35277-s001:
    source_korean: 볕을 쬐거나 바람을 쐬어 말리기 위하여 펼쳐 놓다.
    source_english: To hang washed clothes out to be dried in the sun or wind.
    authored_interpretation: to spread something out to dry in the sun or air
    rationale: >
      The Korean describes spreading something for drying in sun or air.
      It does not restrict the object to washed clothes or require hanging.
      The label retains the general drying action without inventing new senses.
  ko-nikl-02601-s001:
    source_korean: 정거장이나 역에서 버스나 기차 등을 타고 내리는 곳.
    source_english: A place where one gets off from a bus, train, etc., at a station or stop.
    authored_interpretation: a platform or area for boarding and alighting at a stop
    rationale: The Korean explicitly includes both boarding and alighting; the English omits boarding.
  ko-nikl-43894-s001:
    source_korean: 자동차가 다니는 도로에 일정한 너비로 나누어 표시한 선.
    source_english: A part of road of a certain width designated by parallel lines for the passage of vehicles
    authored_interpretation: a line marking out lanes on a road
    rationale: >
      This position identifies the marked line, while the English describes
      the road area. Keep it distinct from position two, the traffic lane itself.
  ko-nikl-10193-s001:
    source_korean: 시험에 응함.
    source_english: An act of applying for a test.
    authored_interpretation: sitting for an examination
    rationale: The Korean describes taking the examination, not merely applying or registering for it.
  ko-nikl-02639-s001:
    source_korean: 어떤 일을 허락함.
    source_english: The act of agreeing to do something.
    authored_interpretation: approval or authorization of an action
    rationale: >
      The Korean describes allowing an action. The English can instead imply
      personally undertaking it; the label preserves the authorization role.
  ko-nikl-03281-s001:
    source_korean: 어떤 모임이나 단체에 새로 들어옴.
    source_english: A person who has newly joined a group or organization.
    authored_interpretation: new entry into a group or organization
    rationale: >
      The Korean defines entry or joining, not a person. A newcomer use must not
      be silently substituted for this retained position.
  ko-nikl-10025-s002:
    source_korean: 같은 학교를 자기보다 먼저 입학한 사람.
    source_english: 'A person who graduated from the same school earlier than oneself. '
    authored_interpretation: a person who entered the same school earlier
    rationale: >
      Entry to the school, not graduation from it, establishes the source
      relationship. These can differ when enrollment paths or durations differ.
  ko-nikl-23494-s002:
    source_korean: 컴퓨터의 출력 결과를 종이에 인쇄하는 기계.
    source_english: A machine used to print what is on the computer screen on paper.
    authored_interpretation: a machine that prints computer output on paper
    rationale: Computer output is not restricted to what is displayed on the screen.
  ko-nikl-30681-s001:
    source_korean: 사회적 경험이나 학식을 바탕으로 사회생활, 문화 등 여러 분야에 걸쳐 쌓은 지식이나 품위.
    source_english: Knowledge or a dignified manner gained from many fields, such as culture, etc., and forming a basis for social experience or learning.
    authored_interpretation: cultivated knowledge and refinement from learning and experience
    rationale: >
      Social experience and learning are the basis for the acquired cultivation
      in Korean. The English reverses this relationship by making cultivation
      the basis for that experience or learning.
