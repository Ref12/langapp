schema_version: 1
review_status: AI-authored interpretation; requires qualified Korean-teacher review
policy: >
  Original bilingual source records remain unchanged. These overrides document
  semantic interpretation only, not verified teacher review or a new official
  dictionary definition.
corrections:
  ko-nikl-01312-s001:
    source_korean: 목화에서 나온 섬유로, 주로 이불 속이나 면직물의 재료가 되는 물질.
    source_english: Fabric made of cotton that is mainly used as a material for blanket fillings or cotton cloth.
    authored_interpretation: cotton fiber or wadding
    rationale: >
      Korean names fiber obtained from cotton and used as filling or textile
      material; English incorrectly presents the raw material as finished fabric.
  ko-nikl-01414-s002:
    source_korean: 광물에서 얻을 수 있는 온갖 쇠붙이.
    source_english: 'All kinds of iron extracted from minerals. '
    authored_interpretation: metal in general
    rationale: >
      온갖 쇠붙이 is metals generally, whereas English narrows it to iron.
      The iron-only meaning remains the separately selected first position.
  ko-nikl-07477-s001:
    source_korean: 주로 포장에 사용되는 물건을 만드는 데 쓰는, 불에 잘 타지 않으며 물과 공기가 통하지 않는 질긴 물질.
    source_english: 'A durable substance that is non-flammable, airtight, and water-proof, usually used for making a packing material. '
    authored_interpretation: vinyl; plastic used for wrapping
    rationale: >
      잘 타지 않으며 does not justify the absolute English non-flammable.
      The local material label makes no combustion-safety guarantee; material
      properties require appropriate factual review beyond this lexical task.
  ko-nikl-50874-s001:
    source_korean: 귀금속이나 그릇 등을 만드는 데 쓰는, 흰 광택이 나고 무른 성질이 있는 금속.
    source_english: Metal that is used to make precious stones, kitchenware, etc., that is white and smooth.
    authored_interpretation: silver; the metal
    rationale: >
      English changes precious-metal articles to precious stones and softness
      to smoothness. Korean describes a lustrous white, soft metal used for
      valuable metal articles or utensils; it does not describe manufacturing gems.
  ko-nikl-05613-s001:
    source_korean: 아직 다 자라지 못한 새끼 닭.
    source_english: A young bird that has yet to grow fully.
    authored_interpretation: a chick; a young chicken
    rationale: >
      Korean explicitly specifies a young chicken, not an arbitrary young bird.
      The figurative inexperienced-person position is not selected.
  ko-nikl-27432-s001:
    source_korean: 몸에서 끈적끈적한 줄을 뽑아 그물을 쳐서 벌레를 잡아먹고 사는 작은 동물.
    source_english: A small insect that eats bugs it catches with its web, woven with thin sticky material it releases from its body.
    authored_interpretation: a spider
    rationale: >
      Korean says small animal, while English incorrectly classifies a spider
      as an insect. The selected noun label does not reproduce that classification.
  ko-nikl-33117-s001:
    source_korean: 그 밖의 다른 것.
    source_english: Something similar to the aforementioned.
    authored_interpretation: other things; miscellaneous items
    rationale: >
      Korean says other things outside the preceding set, not things similar
      to the preceding items. This is residual reference, not a guitar.
  ko-nikl-42877-s001:
    source_korean: 땅속이나 땅을 파고 그 아래에 만든 건물의 공간.
    source_english: A story of a building that is made under the ground by digging.
    authored_interpretation: underground; space below ground or in a basement
    rationale: >
      Korean includes general below-ground space as well as underground
      building space. English loses the first alternative by limiting the
      meaning to a building story.
  ko-nikl-33258-s003:
    source_korean: 책이나 글 등의 분량.
    source_english: 'The number of pages in a book or writing. '
    authored_interpretation: the length of a text
    rationale: >
      분량 describes textual extent, not exclusively a literal page count.
      Spatial distance and elapsed time remain separate first and second senses.
  ko-nikl-35972-s001:
    source_korean: 연극에서 막이 올랐다가 다시 내려올 때까지의 장면인 단락을 세는 단위.
    source_english: A bound noun that serves as a unit for counting the number of scenes from the rising to the falling of the curtain.
    authored_interpretation: act; a unit for counting acts of a play
    rationale: >
      The Korean identifies the curtain-bounded division counted by 막.
      English scenes can instead suggest smaller subdivisions within an act.
      This act label remains an unreviewed interpretation requiring qualified
      Korean and theater-terminology review, not an official correction.
  ko-nikl-02486-s001:
    source_korean: 얇고 잘 늘어나는, 목이 긴 여성용 양말.
    source_english: Thin, stretchy, long leggings for females.
    authored_interpretation: thin, stretchy long stockings
    rationale: >
      The Korean explicitly identifies long, thin, stretchy hosiery as 양말,
      not the trouser-like garment normally called leggings in English.
      Preserve the source's wearer convention in evidence without turning
      that convention into a restriction on who can wear the item.
  ko-nikl-41685-s004:
    source_korean: (비유적으로) 이익을 차려 넣어 두는 곳.
    source_english: (figurative) A place where one stashed his/her belongings.
    authored_interpretation: a pocket for one's gains or profit (figurative)
    rationale: >
      The Korean identifies a figurative receptacle for secured gains or
      profit, not simply a physical place to stash belongings. Keep this
      meaning distinct from the portable pouch and clothing-pocket positions.
  ko-nikl-35581-s001:
    source_korean: 감자, 고구마, 물에 불린 녹두 등을 갈아서 가라앉힌 앙금을 말린 가루.
    source_english: 'Flour made by grating potatoes, sweet potatoes, or soaked mung beans in a bowl and drying the sediments settled at the bottom of the bowl. '
    authored_interpretation: starch powder obtained by settling crushed ingredients
    rationale: >
      The Korean identifies the dried, settled sediment separated from crushed
      starchy ingredients, not the entire milled ingredient ordinarily called
      flour. Distinguish cooking starch powder from the plant-carbohydrate
      definition at the separate second source position.
  ko-nikl-09462-s003:
    source_korean: '(비유적으로) 힘이나 기운이 솟아나게 하는 원천.'
    source_english: '(figurative) A place from which spring water gushes out, or its surroundings.'
    authored_interpretation: 'a source of strength or vitality (figurative)'
    rationale: >
      Korean explicitly names the figurative origin (원천) from which strength
      or energy (힘이나 기운) arises. The original English repeats the physical
      spring-site meaning of s002 and therefore does not distinguish s003.
      Retain s001 water/source, s002 physical site, and s003 figurative source
      as distinct source positions; equal English does not imply equal meaning.
  ko-nikl-22715-s002:
    source_korean: 구김이나 주름 등을 없애서 반듯하게 하다.
    source_english: For something folded or overlapped to be spread widely.
    authored_interpretation: to smooth out creases or wrinkles
    rationale: >
      The Korean identifies removing creases or wrinkles and making something
      smooth or straight. The English instead describes a folded object being
      spread, obscuring the distinction from this parent's unfolding position.
      Preserve the separate second position and its transitive smoothing sense.
  ko-nikl-34029-s002:
    source_korean: 관심이 쏠리다.
    source_english: To gather attention.
    authored_interpretation: for one's interest to be drawn toward something
    rationale: >
      The Korean describes interest being drawn or directed. The English can
      misleadingly suggest attracting other people's attention rather than
      experiencing attraction. The authored label makes the direction of
      interest explicit without changing the original source. The lexical
      argument-structure interpretation still requires Korean-teacher review.
  ko-nikl-46331-s001:
    source_korean: 모르고 있는 동안에 벌써.
    source_english: Very early while one does not notice.
    authored_interpretation: before one knows it; already without noticing
    rationale: >
      The Korean describes something already having happened while one did
      not notice. The original English misleadingly introduces being very
      early; the authored label retains unnoticed passage or occurrence.
  ko-nikl-08902-s003:
    source_korean: 자세히 따져서 생각하다.
    source_english: To calculate something thoroughly.
    authored_interpretation: to consider something carefully and in detail
    rationale: >
      The Korean describes careful evaluation and thought, not specifically
      arithmetic. The label avoids the numerical restriction suggested by
      the original English calculate.
  ko-nikl-50267-s002:
    source_korean: 이전 세대가 물려준 것.
    source_english: Something inherited by former generations.
    authored_interpretation: a heritage inherited from previous generations
    rationale: >
      The Korean describes what earlier generations handed down. The English
      reverses that direction by describing what those generations inherited.
      The authored label identifies inheritance from them instead.
  ko-nikl-43882-s001:
    source_korean: 부끄럽거나 안타까워서 도저히.
    source_english: In a state in which one feels compelled to do something out of shame or sympathy.
    authored_interpretation: out of shame or sympathy (with a negative predicate)
    rationale: >
      The Korean uses 도저히 in a shame-or-sympathy context. In its ordinary
      negative-polarity use, 차마 qualifies an inability to bring oneself to
      act; it does not mean that embarrassment or sympathy compels the action.
      The original English points in that misleading positive direction.
      The label leaves the negation to the following predicate and explicitly
      identifies that context. The polarity explanation is authored and
      requires Korean-teacher review, not a claim of verified grammar annotation.
  ko-nikl-50419-s002:
    source_korean: 귀한 물건이나 정보 등이 불법적으로 외부로 나가 버림. 또는 그것을 내보냄.
    source_english: For something contained or stored in one place to flow out.
    authored_interpretation: illegal release of valuables or information
    rationale: >
      The Korean specifically identifies valuable objects or information and
      explicitly qualifies their outward movement as illegal. The English
      gives only a generic flowing-out description and omits both distinctions.
      Preserve this original second position separately from the general
      outflow sense; the authored label does not declare all information
      leakage illegal or change the source definition.
  ko-nikl-44171-s001:
    source_korean: 창문과 가까운 곳이나 옆.
    source_english: The area immediately behind a window.
    authored_interpretation: the area beside or near a window
    rationale: >
      The Korean says near or beside the window, not specifically behind it.
      The label removes the unsupported directional restriction.
  ko-nikl-26019-s001:
    source_korean: 나무나 풀의 큰 줄기에서 갈라져 나간 작은 줄기.
    source_english: A small twig broken off from a branch of a tree or blade of grass.
    authored_interpretation: a branch or twig growing off a larger stem
    rationale: >
      The Korean describes a smaller stem branching from a larger one.
      It does not require that the branch has broken off or become detached.
  ko-nikl-33272-s002:
    source_korean: 수증기가 차갑게 되어 엉긴 작은 물방울.
    source_english: Small droplets made when steam becomes frozen.
    authored_interpretation: tiny water droplets formed as vapor cools
    rationale: >
      The Korean describes cooled vapor collecting into small liquid droplets,
      not freezing into ice. Preserve this second position as distinct from
      heated vapor, warm breath, and gas in a drink.
  ko-nikl-33272-s004:
    source_korean: 탄산음료 속에 녹아 들어가 있는 이산화 탄소.
    source_english: Carbon dioxide melted in soda.
    authored_interpretation: carbon dioxide dissolved in a fizzy drink
    rationale: >
      The Korean describes carbon dioxide dissolved in a carbonated drink.
      The English's melted incorrectly suggests a different physical process.
  ko-nikl-33542-s002:
    source_korean: 약속이나 일 등이 지켜지거나 이루어지지 않다.
    source_english: To break a promise, or something.
    authored_interpretation: for a promise or undertaking to fall through
    rationale: >
      The Korean describes a promise not being kept or an undertaking not
      being realized. The English's active break obscures that result-state
      perspective. Keep it distinct from the selected agentive breaking senses.
  ko-nikl-43829-s001:
    source_korean: 도구에 의해서나 잡아당겨져 갈라지다.
    source_english: To be split by using a tool or being pushed apart.
    authored_interpretation: to be torn apart by pulling or by a tool
    rationale: >
      The Korean specifies being pulled apart, not pushed apart. The label
      preserves that direction and the alternative use of a tool.
  ko-nikl-35277-s001:
    source_korean: 볕을 쬐거나 바람을 쐬어 말리기 위하여 펼쳐 놓다.
    source_english: To hang washed clothes out to be dried in the sun or wind.
    authored_interpretation: to spread something out to dry in the sun or air
    rationale: >
      The Korean describes spreading something for drying in sun or air.
      It does not restrict the object to washed clothes or require hanging.
      The label retains the general drying action without inventing new senses.
  ko-nikl-02601-s001:
    source_korean: 정거장이나 역에서 버스나 기차 등을 타고 내리는 곳.
    source_english: A place where one gets off from a bus, train, etc., at a station or stop.
    authored_interpretation: a platform or area for boarding and alighting at a stop
    rationale: The Korean explicitly includes both boarding and alighting; the English omits boarding.
  ko-nikl-43894-s001:
    source_korean: 자동차가 다니는 도로에 일정한 너비로 나누어 표시한 선.
    source_english: A part of road of a certain width designated by parallel lines for the passage of vehicles
    authored_interpretation: a line marking out lanes on a road
    rationale: >
      This position identifies the marked line, while the English describes
      the road area. Keep it distinct from position two, the traffic lane itself.
  ko-nikl-10193-s001:
    source_korean: 시험에 응함.
    source_english: An act of applying for a test.
    authored_interpretation: sitting for an examination
    rationale: The Korean describes taking the examination, not merely applying or registering for it.
  ko-nikl-02639-s001:
    source_korean: 어떤 일을 허락함.
    source_english: The act of agreeing to do something.
    authored_interpretation: approval or authorization of an action
    rationale: >
      The Korean describes allowing an action. The English can instead imply
      personally undertaking it; the label preserves the authorization role.
  ko-nikl-03281-s001:
    source_korean: 어떤 모임이나 단체에 새로 들어옴.
    source_english: A person who has newly joined a group or organization.
    authored_interpretation: new entry into a group or organization
    rationale: >
      The Korean defines entry or joining, not a person. A newcomer use must not
      be silently substituted for this retained position.
  ko-nikl-10025-s002:
    source_korean: 같은 학교를 자기보다 먼저 입학한 사람.
    source_english: 'A person who graduated from the same school earlier than oneself. '
    authored_interpretation: a person who entered the same school earlier
    rationale: >
      Entry to the school, not graduation from it, establishes the source
      relationship. These can differ when enrollment paths or durations differ.
  ko-nikl-23494-s002:
    source_korean: 컴퓨터의 출력 결과를 종이에 인쇄하는 기계.
    source_english: A machine used to print what is on the computer screen on paper.
    authored_interpretation: a machine that prints computer output on paper
    rationale: Computer output is not restricted to what is displayed on the screen.
  ko-nikl-30681-s001:
    source_korean: 사회적 경험이나 학식을 바탕으로 사회생활, 문화 등 여러 분야에 걸쳐 쌓은 지식이나 품위.
    source_english: Knowledge or a dignified manner gained from many fields, such as culture, etc., and forming a basis for social experience or learning.
    authored_interpretation: cultivated knowledge and refinement from learning and experience
    rationale: >
      Social experience and learning are the basis for the acquired cultivation
      in Korean. The English reverses this relationship by making cultivation
      the basis for that experience or learning.
