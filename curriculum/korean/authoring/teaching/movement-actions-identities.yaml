# Original AI-authored provisional family decisions; qualified review required.
# Existing fragments add only new members and retain canonical names/categories.
ko-lex-36519:
  lemma: 맞다
  category: free-lemma
  members: [ko-nikl-36556-s001, ko-nikl-36556-s002]
  source_parents: [ko-nikl-36556]
  rationale: >-
    Conservatively group the source-listed 맞이하다 expansion with protected
    reception/occasion 맞다, not the correctness or being-hit homographs.
    Reception and family admission correspond to that base's positions1/7;
    protected position3 already covers an approaching occasion. Add these
    actual forms as existing-family depth, not another free family or an
    invented nominal 맞이. Family admission does not specify legal adoption.
ko-lex-44265:
  lemma: 찾다
  category: free-lemma
  members: [ko-nikl-44266-s001, ko-nikl-44266-s002, ko-nikl-44274-s001, ko-nikl-44274-s002]
  source_parents: [ko-nikl-44266, ko-nikl-44274]
  rationale: >-
    Conservatively retain the source-listed directional 찾아가다/찾아오다
    compounds with protected 찾다. The base's positions4/5 provide retrieval
    and visiting; the compounds specify going/taking away versus coming/bringing
    back and visiting to perform a task. Their deictic contrast is taught
    explicitly, but does not produce two extra free-family credits. This is
    an authored grouping decision, not a claim that the surface forms are
    interchangeable or that every compound with 찾다 belongs here.
ko-lex-16017:
  lemma: 다가가다
  category: free-lemma
  members: [ko-nikl-16017-s003]
  source_parents: [ko-nikl-16017]
  rationale: >-
    Add the familiar/friendly impression sense, distinct from protected
    spatial approach and actively getting closer to someone to befriend them.
    The implied experiencer must not be confused with the perceived target.
ko-lex-34256:
  lemma: 나서다
  category: free-lemma
  members: [ko-nikl-34256-s005]
  source_parents: [ko-nikl-34256]
  rationale: >-
    Add appearance of a person or thing being sought, not another label for
    stepping outside, actively starting work, interfering or setting out.
    Sought does not imply wanted by police or a guarantee that help will appear.
ko-lex-18920:
  lemma: 뒤따르다
  category: free-lemma
  members: [ko-nikl-18920-s001]
  source_parents: [ko-nikl-18920]
  rationale: >-
    Add literal following behind. Protected result-following and doing a
    predecessor's work remain unchanged, even though the new literal use is
    taught earlier. Do not add every other follow/chase compound as a family.
ko-lex-04798:
  lemma: 앞서다
  category: free-lemma
  members: [ko-nikl-04798-s001, ko-nikl-04798-s003]
  source_parents: [ko-nikl-04798]
  rationale: >-
    Add static standing ahead and moving past someone/something ahead.
    Preserve protected temporal precedence and superior ability. Neither new
    physical meaning asserts competitive superiority or permission to overtake.
ko-lex-07859:
  lemma: 빠져나오다
  category: free-lemma
  members: [ko-nikl-07859-s001]
  source_parents: [ko-nikl-07859]
  rationale: >-
    Source-listed coming out from a bounded environment; a provisional
    lexicalized directional compound, not an automatically generated form.
    Distinguish protected 빠지다 coming-out and falling-into homographs and
    the generic outside-a-range sense of 벗어나다. Do not add the unselected
    going-out counterpart 빠져나가다 merely for paired-family credit.
ko-lex-05256:
  lemma: 벗어나다
  category: free-lemma
  members: [ko-nikl-05256-s002, ko-nikl-05256-s005, ko-nikl-05256-s007]
  source_parents: [ko-nikl-05256]
  rationale: >-
    Add departure from expectations, cessation of assigned/required work,
    and leaving a group/crowd. These are not causative release of someone else,
    a formal resignation procedure or authorization to ignore a duty.
    Preserve the protected spatial, restriction, hardship, topic and norm senses.
ko-lex-07855:
  lemma: 빠뜨리다
  category: free-lemma
  members: [ko-nikl-07855-s001, ko-nikl-07855-s002, ko-nikl-07855-s003, ko-nikl-07855-s004]
  source_parents: [ko-nikl-07855]
  rationale: >-
    Source-listed transitive causing-to-fall/place-in-a-state, dropping and
    losing, and omission meanings. Keep the valency-changing predicate distinct
    from the two protected 빠지다 families. Unbanded spelling 빠트리다07865 has
    the same four bilingual positions and is not requested or counted again.
ko-lex-34854:
  lemma: 내놓다
  category: free-lemma
  members: [ko-nikl-34854-s001, ko-nikl-34854-s002, ko-nikl-34854-s004, ko-nikl-34854-s005, ko-nikl-34854-s008]
  source_parents: [ko-nikl-34854]
  rationale: >-
    Add taking an object outside, presenting it visibly, letting a confined
    person/animal move freely, serving food, and handing over something held
    or occupied. Preserve protected housing-market, publication and idea senses.
    A described release or transfer establishes no legal power or entitlement.
ko-lex-34031:
  lemma: 끌어내다
  category: free-lemma
  members: [ko-nikl-34031-s001, ko-nikl-34031-s002]
  source_parents: [ko-nikl-34031]
  rationale: >-
    Add pulling an object out and making a person/animal come out by force,
    distinct from protected eliciting thoughts/words/abilities. Keep the
    source's force restriction for position2; it is not an ordinary polite
    request or advice to use force.
ko-lex-27595:
  lemma: 건네다
  category: free-lemma
  members: [ko-nikl-27595-s001, ko-nikl-27595-s002]
  source_parents: [ko-nikl-27595]
  rationale: >-
    Physical money/object handover and addressing someone with words share
    this actual source parent. The speech use is not reported speech or
    relaying a third person's message. Unselected 건네주다 is inspected but
    not added for another beneficiary/compound family credit.
ko-lex-18652:
  lemma: 되돌리다
  category: free-lemma
  members: [ko-nikl-18652-s001, ko-nikl-18652-s002, ko-nikl-18652-s003]
  source_parents: [ko-nikl-18652]
  rationale: >-
    Transitive reversal/restoration/giving back. Compare protected 돌리다
    direction/opinion change and its 돌려놓다 member's change of views/state;
    those do not require an opposite direction or an earlier state.
    Keep this source-listed restoration predicate provisional and distinct,
    not an automatic free credit for every prefixed form. Do not add
    되돌다, 되돌아오다 or 돌려주다 merely to complete a derivational set.
ko-lex-18257:
  lemma: 돌아서다
  category: free-lemma
  members: [ko-nikl-18257-s003, ko-nikl-18257-s004, ko-nikl-18257-s007]
  source_parents: [ko-nikl-18257]
  rationale: >-
    Add a situation changing state, an illness gradually improving, and
    going around a place. Preserve physical facing reversal, changed opinion
    and breaking off a relationship. The intransitive illness use is not
    treating or curing a patient and supplies no medical conclusion.
ko-lex-48449:
  lemma: 올라서다
  category: free-lemma
  members: [ko-nikl-48449-s001, ko-nikl-48449-s002]
  source_parents: [ko-nikl-48449]
  rationale: >-
    Climbing and then standing above, with its attested higher-position/level
    extension. The resultant standing posture distinguishes the physical task
    from protected general ascent 오르다/올라가다. Do not generate additional
    ascent compounds or claim that the abstract rank sense is a new concept
    independent of this same provisional family.
ko-lex-34874:
  lemma: 내려놓다
  category: free-lemma
  members: [ko-nikl-34874-s001, ko-nikl-34874-s003]
  source_parents: [ko-nikl-34874]
  rationale: >-
    Putting down a held object and dropping a passenger off by vehicle are
    attested lexical frames, not a generated lowering paraphrase. Compare
    protected 놓다 placement and 내리다 alighting; a passenger is the object,
    not the person independently getting off. Do not invent the common
    psychological letting-go interpretation: it is absent from this parent.
ko-lex-34879:
  lemma: 내려서다
  category: free-lemma
  members: [ko-nikl-34879-s001, ko-nikl-34879-s002]
  source_parents: [ko-nikl-34879]
  rationale: >-
    Moving down to stand lower and moving to a lower grade/position. Both are
    intransitive, unlike lowering or demoting another participant. The physical
    standing result is narrower than protected general descent/alighting;
    unselected position3 is not added merely to split off departure from height.
ko-lex-27528:
  lemma: 거치다
  category: free-lemma
  members: [ko-nikl-27528-s001]
  source_parents: [ko-nikl-27528]
  rationale: >-
    Add being caught/blocked by something, not causing the blockage.
    Protected passing through a place, undergoing a process, and inspection
    remain unchanged; do not interpret every 거치다 use as procedural review.
ko-lex-18259:
  lemma: 돌아오다
  category: free-lemma
  members: [ko-nikl-18259-s002, ko-nikl-18259-s004]
  source_parents: [ko-nikl-18259]
  rationale: >-
    Necessary nearby protected-root depth: a turn coming around and arriving
    by a longer route add actual sequencing/route meanings. Preserve return
    and recurring occasions. Source-listed 되돌아오다 largely repeats those
    protected return/restoration frames and is not added as a new family here.
ko-lex-18598:
  lemma: 동행
  category: free-lemma
  members: [ko-nikl-18599-s001]
  source_parents: [ko-nikl-18599]
  rationale: >-
    The actual journeying-together predicate uses the retained 동행 nominal
    base, whose act/companion positions are source evidence, not extra
    selections. One new provisional family; jointly traveling is not
    following behind and does not create another assumed source noun.
ko-lex-35924:
  lemma: 마주하다
  category: free-lemma
  members: [ko-nikl-35924-s001]
  source_parents: [ko-nikl-35924]
  rationale: >-
    The real reciprocal direct-facing predicate supports an encounter,
    without requiring confrontation, disagreement or an abstract problem.
    The compared 마주 adverb is not an extra selected free family.
ko-lex-40335:
  lemma: 방문
  category: free-lemma
  members: [ko-nikl-40340-s001]
  source_parents: [ko-nikl-40340]
  rationale: >-
    The actual visiting predicate uses the retained visit-noun base40335.
    Its purpose is meeting someone or seeing something, not any possible
    task. Keep room-door homograph40334 separate and do not select the
    unneeded nominal counterpart merely to inflate noun/predicate breadth.
ko-lex-42562:
  lemma: 지나치다
  category: free-lemma
  members: [ko-nikl-42561-s001, ko-nikl-42561-s002]
  source_parents: [ko-nikl-42561]
  rationale: >-
    Conservatively group the shared 지나치- stem's actual passing/overlooking
    verb frames with its descriptive degree-beyond-a-limit frame. This
    explicit passing-beyond/category relationship, not spelling alone,
    motivates the provisional family; it is not an official variant claim.
    Keep the original verb versus descriptive-predicate POS, two versus one
    source positions, inflection and valency separate. Neither adjective
    excess nor a new POS-separated parent supplies another automatic root.
