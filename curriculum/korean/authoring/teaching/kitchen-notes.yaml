  ko-nikl-43803: 찜

review_flags:
  - >
    Dish definitions describe source preparations, not complete recipes or
    universal restaurant ingredients. Menu recognition does not establish
    allergy safety, vegetarian suitability, or absence of cross-contact.
  - >
    Ingredient names and source mentions of medicinal use do not establish
    treatment effects, nutrition advice, or safe wild-plant identification.
    The unselected compress/hot-bathing senses of 찜 include therapeutic
    source claims and are not imported as instructions.
  - >
    The source English for 떡볶이 says boiling while the Korean uses 볶다.
    The compact label names cooking with vegetables and seasoning without
    choosing an exclusive preparation technique. 삼겹살 follows the raw
    layered-meat sense, not the English's added grilled-dish use; its
    source-specific anatomical wording also needs qualified review.
  - >
    Teasing body/appearance senses of 갈비 and 호박, the matted-hair sense
    of 떡, and the body metaphor of 고추 are not added by this food cohort.
    No claim is made that every source position is useful core vocabulary.

remaining_gaps:
  - The broader core vocabulary planning scale remains substantially unfilled.
  - Broccoli was not found in the pinned original CSV; no substitute source ID is supplied.
  - Other specifically noted absent pantry terms have not been exhaustively investigated.
  - Reading proposals, source interpretation, pragmatic use, and lexical-family grouping need qualified review.
