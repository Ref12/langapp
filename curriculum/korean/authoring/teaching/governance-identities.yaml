  source_parents: [ko-nikl-21867]
  rationale: Leaving a position or duty is retained without asserting term expiry, mandatory retirement or a particular reason for departure.
ko-lex-21977:
  lemma: 투자자
  category: free-lemma
  members: [ko-nikl-21977-s001]
  source_parents: [ko-nikl-21977]
  rationale: The attested investor may contribute money, time or effort for gain; shares and professional accreditation are not required by the definition.
ko-lex-28170:
  lemma: 결산
  category: free-lemma
  members: [ko-nikl-28170-s002]
  source_parents: [ko-nikl-28170]
  rationale: Periodic results-summary extends protected financial settlement to nonfinancial work without another free identity.
ko-lex-39129:
  lemma: 민주화
  category: free-lemma
  members: [ko-nikl-39129-s001]
  source_parents: [ko-nikl-39129]
  rationale: Democratic change is not restricted by the Korean definition to whole nations, and the noun does not certify any real institution as democratic.
ko-lex-42823:
  lemma: 지지율
  category: free-lemma
  members: [ko-nikl-42823-s001]
  source_parents: [ko-nikl-42823]
  rationale: Candidate support is a proportion among voters, not automatically turnout, actual election results or a validated prediction.
ko-lex-45711:
  lemma: 출마
  category: free-lemma
  members: [ko-nikl-45711-s001]
  source_parents: [ko-nikl-45711]
  rationale: Standing in an election is the supplied participation noun; no candidacy eligibility is established by knowing it.
ko-lex-46659:
  lemma: 언론사
  category: free-lemma
  members: [ko-nikl-46659-s001]
  source_parents: [ko-nikl-46659]
  rationale: The media company is distinct from its professional workers, and its name alone does not validate published claims.
ko-lex-46660:
  lemma: 언론인
  category: free-lemma
  members: [ko-nikl-46660-s001]
  source_parents: [ko-nikl-46660]
  rationale: The attested professional media-work role adds a person referent, not an automatically generated occupation or a certification.
ko-lex-46830:
  lemma: 업계
  category: free-lemma
  members: [ko-nikl-46830-s001]
  source_parents: [ko-nikl-46830]
  rationale: A shared industry or trade field is not necessarily a trade association or a single employer.
ko-lex-48764:
  lemma: 외교
  category: free-lemma
  members: [ko-nikl-48764-s001]
  source_parents: [ko-nikl-48764]
  rationale: International political, economic and cultural dealings are named without predicting policy success or prescribing diplomacy.
ko-lex-51191:
  lemma: 응답자
  category: free-lemma
  members: [ko-nikl-51191-s001]
  source_parents: [ko-nikl-51191]
  rationale: The person answering may respond to a call or a question; survey use does not narrow the whole source to survey respondents.
