    and enthusiastic sports/arts conditions remain distinct. Keep three
    separately attested provisional lexical names, alongside the other six
    real nouns. No existing canonical family is renamed or widened.
    This is an explicit identity adjudication, not automatic counting of
    every spelling or a quota adjustment; all nine families remain unreviewed.
  source_and_genre_scope: >
    Five complete unbanded parents and all nine selected positions were
    compared against the pinned source. Keep raw strings, including the
    band's two trailing English spaces. Band, ballet, and opera labels
    explicitly attribute their narrower descriptions to this source rather
    than assert a universal contemporary genre taxonomy. Restore ballet's
    chiefly-classical qualifier separately from those shared source limits.
    Jazz's roots are not an exclusive historical account. Dubbing retains
    translated foreign-film dialogue and voice actors, not every audio edit.
  reading_adjudication: >
    Rechecked all nine actual archive identities: none has pronunciation
    text. Approved nine separately reasoned authored-broad-hangul proposals
    under the existing exception policy, all with review_status unreviewed.
    They document their own syllable structure and consonant boundaries;
    no official citation, English sound system, stress, length, or actual
    audio assessment is inferred from spelling. The leisure crosswalk is
    identity evidence only. Six pre-existing pronunciation holds remain.
