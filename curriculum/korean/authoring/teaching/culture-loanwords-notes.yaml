selection_and_placement:
  ordinary_participation: >
    Leisure, fandom, a realistic pre-performance run, and a small instrumental
    group support leisure/participation discussions at8. These are actual noun
    records, not new verbs, derived source forms, or assumptions that a person
    can perform a task merely because they recognize its name.
  common_genres: >
    Classical music, jazz, ballet, and opera support general-reader preferences,
    event descriptions, and cultural discussion at10. No subgenre, instrument,
    score, dance-technique, or historical-period catalogue is added.
  media_versions: >
    Translated foreign-film dialogue rerecorded by voice actors supports
    comparing media versions at12. This source position is not broadened to
    every audio edit, domestic animation, game, or sound-recording process.
  source_domain_limits: >
    Opera's all-dialogue-sung framing and ballet's story frame are present
    in the original Korean as well as English. The labels preserve those
    source-framed descriptions, not a verified universal modern genre taxonomy.
    Qualified domain review may be needed before broadening them. Ballet's
    mainly-classical qualifier, unlike those shared source limitations, was
    lost specifically in English and has a correction proposal below.
    Jazz's historical-root description is not an exhaustive or exclusive
    history; light music in the band source is not a judgment of cultural value.
superseded_handoff_identity_policy: >
  Six provisional new free families and three depth members are separate
  counts, not nine verified new roots. Preserve every existing canonical
  lemma/category/member. Leisure, fan/enthusiast naming, and a performance-
  specific practice run use individual conservative family groupings.
  Named cultural genres and translated-dialogue rerecording are not automatically
  collapsed into generic music, dance, or recording. All lexical boundaries
  remain subject to qualified review; no base reading is transferred.
historical_family_comparisons:
  leisure:
    identity: ko-lex-46993
    protected_id: ko-nikl-46993-s001
    source_korean: 일을 하지 않는 시간. 또는 일을 하는 중간에 생기는 여유로운 시간.
    source_english: 'The time when one is not working; or the time for relaxation in the middle of working. '
    new_id: ko-nikl-20153-s001
    rationale: Retain both free time and relaxing play in the new loanword's single position without another free leisure base.
  admirer:
    identity: ko-lex-04905
    protected_id: ko-nikl-04906-s001
    source_korean: 어떤 사물이나 일을 사랑하고 좋아하는 사람.
    source_english: 'A person who loves a certain object or work and is devoted to it. '
    new_id: ko-nikl-22619-s001
    rationale: The fan source narrows the domain and emphasizes enthusiasm; preserve those conditions while using the protected enthusiast family.
  rehearsal:
    identity: ko-lex-47492
    protected_id: ko-nikl-47492-s001
    source_korean: 무엇을 잘할 수 있도록 반복하여 익힘.
    source_english: 'The act of doing something repeatedly in order to be good at it. '
    new_id: ko-nikl-20313-s001
    rationale: >
      Count this actual performance-specific practice name conservatively as
      depth, preserving realistic execution before a performance. Full
      simulated-practice homograph47491 was also compared and remains unselected;
      neither that homograph nor the related word 총연습 supplies a reading.
  ensemble_distinction:
    protected_id: ko-nikl-04339-s001
    source_korean: 음악을 전문적으로나 직업적으로 연주하는 단체.
    source_english: 'A group playing music professionally or for a living. '
    new_id: ko-nikl-40844-s001
    rationale: >
      The source band is small and plays the named light-music range, but
      does not require employment. Its scope is not identical to professional
      악단; retain a separate provisional base instead of erasing conditions
      to justify a blanket synonym merger.
