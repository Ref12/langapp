      Nominal 비유적07594 maps to official60998 and adnominal07595 to60997.
      Complete single definitions differ only by 위하여 becoming 위해;
      retain their different POS and actual citation 비ː유적.
    - >
      도덕관17771 maps to47796 after the whole two-fragment definition
