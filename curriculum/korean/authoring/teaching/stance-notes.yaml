schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: selected support and readings resolved; linguistic review remains outstanding
scope: >
  Nuanced viewpoints, narrative interpretation, abstract comparison, social
  perspective and register. A bounded exact/space-normalized lookup of named
  communicative concepts across the pinned CSV preceded bilingual inspection.
  Noun/adnominal pairs received a second all-POS comparison. No alphabetical
  buckets, automatic suffix products, first-sense imports or numerical quota.
composition_snapshot:
  basis: committed manifest through analysis216190c; not a live coverage report
  selected_senses: 67
  source_parents: 57
  identity_fragments: 54
  new_pool_free_identities: 52
  existing_pool_fragments: 2
  new_core_free_identities: 53
  exact_additional_support_parents: 43
  explanation: >
    풍자 already has an optional literary meaning, so its first selected
    core meaning increases core breadth but not pool-wide breadth. 메시지
    deepens an existing core family. Separate route counts cannot be summed.
placement_policy: >
  Common social form, respectful treatment and delivered messages serve
  level8; event background and temporal order serve9; approximation serves13.
  Horizon supports17. Evidence, values, reasoned objections and synthesis
  support19-24. Most new interpretation, abstraction and register vocabulary
  serves25-29 because it supports those tasks, not because its source band or
  ordinal dictates a phase. Earlier useful senses are not shifted later.
family_adjudications:
  nominal_adnominal_pairs:
    - >
      비유적07594/07595 has the same comparison-for-explanation definition,
      differing in the nominal 것 and modifying ending. One provisional
      free family retains both actual source parents and POS values.
    - >
      상징적09245/09246 similarly differs by nominal versus modifying use
      of concrete symbolic representation. One family, not two headwords.
  opposing_response:
    lexical_id: ko-lex-24543
    category: free-lemma
    source_parents: [ko-nikl-24543, ko-nikl-24544]
    official_evidence:
      ko-nikl-24543: {official_entry_id: '85888', origin: 抗卞, homonym_number: '1', pronunciation: '항ː변'}
      ko-nikl-24544: {official_entry_id: '85891', origin: 抗辯, homonym_number: '2', pronunciation: '항ː변'}
    reasoning: >
      Both complete one-definition lists match the respective official
      record. Protest and arguing right/wrong against a claim remain
      separately labelled source meanings. Conservatively count the
      overlapping opposing-response family once without claiming the
      distinct origin strings or official homograph division are wrong.
      This is an unreviewed accounting judgment, not a merger of source IDs.
  spatial_temporal_reference: >
    전후 contains physical front/back, before/after and approximation.
    Retain one free spatial-temporal family consistently with existing
    앞/뒤 and 이전/이후 noun families; the approximate use adds neither a
    counter nor another free lemma.
homograph_boundaries:
  - Social/Christian calling 소명00726 is not explanation00727.
  - Mental image 심상03634 is not mental/emotional state03633.
  - Gist 대의17193 is not moral cause/principle17194.
  - Concrete representation 구상31006 is not existing planning/conceiving31007.
  - The appraisal and ejaculation homographs 사정08528/08529 do not supply event background.
usage_limits:
  - >
    격식체 concerns formal speech style, not a universal promise of high
    listener politeness. Formal/plain written uses, listener politeness,
    subject honorification, humble reference and personal respect remain
    distinct. 경어 or 존대 vocabulary knowledge does not license an
    arbitrary morphology or guarantee suitability in a relationship.
  - >
    구어체 is writing resembling conversation, not necessarily a real
    transcript. 문어체 names a written style, not all writing. 필체 is
    handwriting-style vocabulary only; no writing assets are duplicated
    and no handwriting mastery or motor-skill evidence is awarded.
  - >
    상대성 is sourced interdependence, not an inserted physics theory or
    moral-relativism claim. 일반성 does not establish universal application;
    동질성 is a shared characteristic, not complete identity or a group ranking.
  - >
    풍자001 targets another person's shortcomings and can be hurtful or
    confrontational; it is not neutral disagreement or recommended conduct.
    Literature's separate satire sense remains optional in the literary route.
  - >
    소명002 is explicitly a Christian sense, not an assertion of belief.
    정통성, 대의, 도덕관, 윤리관 and 역사관 name contested perspectives or
    grounds without endorsing a particular authority, cause or doctrine.
  - >
    Discernment, insight, self-awareness and inclusive disposition are not
    assessed from recognition of their labels. The mental-image definition
    supplies no medical diagnosis or universal theory of perception.
  - >
    The source English for 분별002 adds objective wording; do not turn
    sound judgment into a measured objectivity criterion. Implication,
    symbolic interpretation and rich meaning still need contextual support;
    an inferred message is not automatically its author's intention.
  - >
    Feasibility, realistic character and horizons of possibility do not
    promise achieved outcomes. Distinction/dignity is not a moral ranking
    of people or an innate, unchangeable psychological trait.
intentionally_unselected:
  - 소명00727-s002; specialized trial-evidence procedure remains outside this cohort.
  - 심상03633; the state-of-mind homograph does not replace the mental-image sense.
  - 품격23359-s001; no automatic import of the innate-personality position.
  - 다면16153-s001 and 지평42867-s001; no physical-sense padding of science/nature modules.
  - 서체09862 and 다층16278; left entirely to the independent infrastructure cohort.
  - 양면46151-s001; physical surfaces left to infrastructure, with one shared family if selected.
