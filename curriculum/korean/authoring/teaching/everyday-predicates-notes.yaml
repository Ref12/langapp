schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: source-backed selections integrated; linguistic review pending
purpose: >
  Resolve the ten specifically named ordinary-predicate gaps reported in
  predicate-notes.yaml. Each exists as an actual unbanded January 2024 source
  parent with one original bilingual sense. None is assembled from a noun,
  suffix, spelling pattern, or English antonym.
selection_policy: >
  Practical needs determine placement: convenience in services, confirming
  details, study and work attitudes, clear instructions, short responses,
  comparing advantages, fair cooperation, and evidence-based judgment.
  No source-band, first-sense, alphabetical, or numerical-capacity bucket
  selects or schedules these words.
identity_policy: >
  These are source-backed provisional free predicate candidates. Existing
  nouns or adverbs do not automatically license an unattested hada form,
  and a shared derivational ending alone does not establish an identity
  merger. Their lexical-family relationships remain reviewable.
homograph_boundary:
  selected: ko-nikl-50214-s001
  target: 유리하다
  source_korean: 이익이 있다.
  source_english: Having an advantage.
  rejected_unrelated_parent: ko-nikl-50213
  rejected_korean: 따로 떨어지다.
  rejected_english: To separate.
  rationale: The beneficial adjective is not the separation verb; do not take the first same-spelling row.
