reading_policy: >
  All ten selected predicates now have official-text citation readings
  after exact source-parent recovery. None required a new crosswalk or
  authored pronunciation decision. Spelling alone never supplies pronunciation.
reading_review:
  official_text_senses: 10
  authored_reading_senses: 0
  remaining_selected_gaps: []
usage_review:
  - A short 대꾸 can be curt in context; the source does not make every response insolent or polite.
  - Strictness, fairness, and conscientious conduct require situated interpersonal interpretation.
  - 판단하다 describes forming a judgment; 확인하다 describes checking or acknowledging, not infallibility.
  - Convenience and advantage depend on circumstances; these labels imply no legal, clinical, or accessibility guarantee.
