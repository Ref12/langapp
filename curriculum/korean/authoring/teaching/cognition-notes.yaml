source_correction_requests:
  ko-nikl-47463-s001:
    source_korean: 어떤 사물을 보거나 듣거나 생각할 때 그것과 관련 있는 사물을 머릿속에 떠올리다.
    source_english: To be reminded of things related to an object when one sees, hears, or thinks of it.
    authored_interpretation: to bring related things to mind
    rationale: The Korean verb uses 떠올리다, bringing associated things to mind. Preserve that perspective rather than collapsing it into the English passive be reminded, and do not require another person to supply a reminder.
  ko-nikl-36383-s002:
    source_korean: (낮추는 말로) 자기의 말.
    source_english: (impolite form) One's own words.
    authored_interpretation: one's own words (humble)
    rationale: >
      The source marks self-humbling reference to one's own words, not
      impoliteness toward the listener. Preserve this speaker perspective
      separately from honorific reference to another person's words001.
  ko-nikl-09327-s002:
    source_korean: 다른 사람이 하는 말을 잘 이해하며 듣다.
    source_english: To listen carefully to another person.
    authored_interpretation: to listen with understanding to what someone says
    rationale: The Korean explicitly includes understanding while listening. English carefully describes attention but loses comprehension; keep this distinct from merely careful listening and from listening so as to remember advice.
  ko-nikl-21102-s001:
    source_korean: 잘 알아듣도록 자상하고 조리 있게 말해 주다.
    source_english: To say something kindly and logically in order to get someone to understand and agree.
    authored_interpretation: to explain kindly and coherently to help someone understand
    rationale: The Korean aims at comprehension through kind, coherent explanation. It does not explicitly require agreement; the added English and agree should not turn understanding into automatic acceptance or compliance.
