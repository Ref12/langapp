schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: all143 selected senses and official readings integrated; qualified review remains outstanding
scope:
  - Only cognition-vocabulary.yaml, cognition-identities.yaml, and this notes file are owned here.
  - Protect all current manifest inputs, parent-owned qualities178, and the readable natural-support25 proposal regardless of registration.
  - No descriptive adjectives or quality-gap recovery; parent adds two directly related source-listed speech-noun senses.
  - Native compounds and noun-plus-hada verbs are selected only when the full verb exists in the verified pinned CSV.
  - No automatic source-band, alphabetical, first-sense, suffix, or numerical-quota teaching assignment.
source_verification:
  source_revision: 3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9
  source_sha256: 3250b7b0620eee814aadb4ad5611f1e209792e2aebfd57017bcfe3f1d7b92aa0
  source_records: 53172
  source_url: https://huggingface.co/datasets/binjang/NIKL-korean-english-dictionary/resolve/3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9/2024_01.csv
  method: >
    Fetch the pinned CSV into memory, verify its complete SHA-256, and inspect
    every Korean/English position of each named form, including same-spelling
    parents and explicitly named nominal/voice counterparts. No downloaded
    source/cache file is written. Retain original record and definition-list
    ordinals, not invented official NIKL numbers.
  bilingual_policy: >
    A requested parent must have complete, nonempty Korean and English lists
    of equal length. Full original meanings remain unmodified even when only
    one source position is selected; equal English does not merge positions.
  support_policy: >
    Requests below are explicit real source parents already inspected, not
    permission to generate verbs from nouns. Parent owns approval, registry
    regeneration, and reading resolution. Request metadata records the full
    inspected sense count, not a truncated replacement for the original.
    An unselected nominal source used to establish a canonical event family
    is evidence, not an implicit request to add that noun to the registry.
identity_policy:
  status: >
    These are provisional semantic event families, not verified true-lexeme
    counts. Report selected senses, source parents, spellings, group fragments,
    and net-new free candidates separately.
  noun_hada_and_voice: >
    Where complete Korean meanings directly correspond, conservatively reuse
    an existing nominal/event identity or reserve one shared event family.
    An extra hada or regular passive spelling does not itself establish new
    free breadth. Preserve original subjects, perspective, and source members.
  protected_fragments: >
    Existing-key fragments include new members only, keep the exact canonical
    lemma/category, and list only parents represented by those new members.
  알아채다: >
    Its complete Korean definition exactly matches protected 알아차리다's
    second position. Extend ko-lex-04622 without counting another free lemma,
    while keeping the attested shorter verb and its own source ID visible.
  compatible_new_parent_nouns: >
    Later parent manifest updates select the nouns 숙달, 심사숙고, and
    고민 under the same explicit family keys. Treat the corresponding
    cognition verbs as existing-family extensions, not new free breadth.
    No protected canonical lemma, category, or member is replaced.
  register_and_voice: >
    Explicit honorific 말씀하다 extends 말하다. Slang auditory 알아먹다
    extends 알아듣다, not the separate visual/recall source homograph.
    Remembering/being remembered, deciding/being decided, confusing/being
    confused, and forgetting/being forgotten preserve voice and participant
    roles while sharing conservative event identities.
  variants: >
    Complete Korean lists match for 헷갈리다/헛갈리다,
    마음먹다/맘먹다, and 이야기하다/얘기하다. The selected memory-lapse
    position matches for 깜박하다/깜빡하다. Preserve each actual spelling,
    original parent, and original position; no reading is transferred between
    them, and matching selected meanings does not erase unselected meanings.
  native_compounds: >
    Actually listed compounds such as 찾아보다, 찾아내다, 물어보다,
    알아주다, 골라내다, 새겨듣다, and 귀담아듣다 remain provisional
    lexical candidates. Their compositional relationships need lexicographic
    review; source-row existence is not proof of independent true-lexeme
    status. No auxiliary construction or conjugated phrase is generated.
  categories: >
    The worker's126 selected items are complete action verbs with a lexical
    content event reading. Parent adds two genuine noun senses of 말씀,
    sharing the existing speech-content family. No new bound-form or
    function-item identity is declared.
    Honorific/slang forms and regular voice counterparts are not added as
    separate free categories just to increase the count.
  function_identity_ids: []
  bound_form_identity_ids: []
curation_rationales:
  observation: >
    Distinguish careful observation, natural-phenomenon observation supporting
    inference, direct witnessing, nonintervention, focused examination, lookup,
    and inferred social cues. Inferred mood or anticipated outcomes are not
    guaranteed knowledge of another mind or future events.
  source_perspective: >
    Physical upward/downward gaze differs from respectful service or looking
    down on another person. Preserve the condescending perspective when chosen;
    do not neutralize it or assume every English look up to is the same sense.
  learning_and_memory: >
    Practice, advance preparation, review, memorization, exact recitation,
    skillful familiarity, self-discovered understanding, memory retrieval,
    and momentary inattention support different learner actions. New verbs
    realize already-known nominal concepts where appropriate without being
    counted again as new concepts or independent free identities.
  decisions: >
    Distinguish choosing for need or purpose, firm intention, final decision,
    reconsideration, careful consideration, worry, and hesitation. 고민하다
    includes distress; neutral considering is not substituted for it.
    A 결정되다 subject is a settled decision, not an agent making it.
  communication_and_understanding: >
    Sharing information, conversation, answering, stating an opinion,
    acknowledgment, shared feeling, shared opinion, careful listening,
    comprehension, and agreement are not equivalent. 타이르다 aims at
    understanding; the source does not require agreement. 새겨듣다's second
    position includes comprehension, not attention alone.
  conduct_and_register: >
    Keep explicit slang on 까먹다 and 알아먹다, honorific speech on
    말씀하다, and figurative soothing on 어루만지다. 헐뜯다 includes
    intent to harm; 비난하다 does not necessarily add that purpose.
    These meanings support contextual comprehension, not recommended insults,
    mind-reading claims, compulsory forgiveness, or guarantees of emotional
    or medical improvement.
  broad_core_not_padding: >
    This bounded scope covers observing, learning, memory, inquiry, decisions,
    and interpersonal responses. It does not import every leftover native
    verb position, every regular passive, or specialist homograph. No phase
    is filled by source band, alphabet, nominal count, or a desired row total.
