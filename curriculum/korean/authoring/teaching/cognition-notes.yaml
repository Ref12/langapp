  before_manifest_registration: >
    Approve the explicit support requests, derive complete source parents
    through the existing pinned-CSV importer, and resolve actual citation
    readings before publishing these placements. This worker does not write
    any of those shared artifacts.
  projected_validation: >
    Source/schema/identity checks may use an in-memory registry augmented only
    by the explicitly requested original CSV parents. That proves consistency
    of the proposal, not that pending parents or readings are already available
    in the working published course. No placeholder reading is written.
  selection_files: >
    After integration, compose cognition-vocabulary.yaml and
    cognition-identities.yaml through the parent-owned manifest. Preserve
    new-members-only fragments and reject rather than silently deduplicate
    any conflict with newer parent-approved cohorts.
  corrections: >
    The selected-source requests below preserve exact bilingual text and
    match authored labels. The separate unselected noun issue is not a new
    placement or a request to fabricate vocabulary coverage.
remaining_scope:
  assessment: >
    This is a coherent action-verb addition, not completion of the whole
    core breadth guide or an exhaustive unselected-source audit. Many verbs
    appropriately realize existing event-noun families, so source-parent or
    spelling counts must not be substituted for new free-identity counts.
  further_work: >
    Continued useful breadth can come from independently inspected
    context-sensitive conversational actions and general-reader inquiry,
    not arbitrary new hada/passive variants or specialist padding.
    Native compound boundaries and related register/voice families remain
    qualified-review questions.
  exact_form_limits: >
    Missing exact full forms are reported below as source limits, not claims
    that Korean cannot express those meanings. Protected alternatives and
    original phrase/grammar representations may already cover the function.
