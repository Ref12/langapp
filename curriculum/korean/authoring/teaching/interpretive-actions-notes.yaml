source_correction_requests:
  ko-nikl-07830-s004:
    source_korean: 어떤 일이나 결과를 만들다.
    source_english: For bring about a certain situation or result.
    authored_interpretation: to bring about a situation or result
    rationale: Repair the malformed English infinitive while preserving active result production; do not insert intentionality, adversity, or a physical shaping restriction.
  ko-nikl-19048-s001:
    source_korean: 뒤에서 지지하고 도와주다.
    source_english: 'To support and help someone from behind him/her. '
    authored_interpretation: to provide backing and support
    rationale: Scope clarification; support/backing is not restricted to a physical location behind a person. The compared noun explicitly allows a person or object; this does not turn support into certified logical proof.
  ko-nikl-38760-s002:
    source_korean: 여러 사실을 대강 하나로 묶거나 합쳐서 대강 요약하다.
    source_english: To combine or mix several facts and summarize.
    authored_interpretation: to roughly lump facts together and summarize them
    rationale: Restore the explicit roughness of both occurrences of 대강, omitted in English; do not label the operation precise synthesis or key-point selection.
