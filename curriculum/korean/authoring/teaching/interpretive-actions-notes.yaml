schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: parent-integrated bounded cohort; qualified review remains pending
scope:
  - Only the three new interpretive-actions YAML files are authored here.
  - All handed-back cohorts, manifests, source/reading files, tests, code, and generated output remain untouched.
  - No noun placements, automatic noun-plus-hada generation, unlisted inflections, quota, or exhaustive unselected-source sweep.
  - Argumentation and culture-loanword noun workers retain their scopes; their undeclared active files are not inspected.
source_provenance:
  source_id: nikl-2024-mirror
  revision: 3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9
  sha256: 3250b7b0620eee814aadb4ad5611f1e209792e2aebfd57017bcfe3f1d7b92aa0
  source_records: 53172
  url: https://huggingface.co/datasets/binjang/NIKL-korean-english-dictionary/resolve/3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9/2024_01.csv
  ids: Source parents and sNNN positions are original one-based CSV record and definition-list ordinals, not official dictionary IDs.
  method: >
    Inspect the full paired Korean/English positions of the named leads and
    their actual noun, adjective, voice, and native-compound competitors in
    the checksum-verified pin. One bounded native-verb follow-up examined
    summarizing, selecting, eliciting, textual reuse, and exaggeration.
    No source cache, scratch file, or new test script is written.
  array_contract: Complete bilingual arrays below preserve original one-based sense positions, wording, and whitespace; selected_positions names the actual selected indexes.
  attribution: National Institute of Korean Language and Korean-English Learners' Dictionary contributors, via the unofficial binjang extraction.
  license: CC-BY-SA-2.0-KR for dictionary text; not the mirror's MIT metadata.
  license_url: https://creativecommons.org/licenses/by-sa/2.0/kr/
  reuse_notice: >
    Original definitions are retained as evidence. Labels, placements, and
    provisional family decisions are adaptations. Preserve attribution,
    source/license links, and share-alike terms; no NIKL endorsement,
    multimedia, or usage-example redistribution is claimed.
placement_rationale:
  study_and_narration: Deep study at 8 and detailed depiction at 9 serve ordinary learning and narration, not an advanced jargon track.
  processes_and_messages: >
    Result-producing 빚다 enters at 11. Specific reference, length reduction,
    rough aggregation, and selective key-point summarizing enter at 12.
    Their operations are not treated as interchangeable.
  choices_and_cooperation: >
    Judging something certain, singling out a choice, and flatly rejecting
    a request enter at 13. Backing a task and drawing out expression enter
    at 15 without inventing coercion or evidential certainty.
  reporting_and_presentation: >
    Public assertions, denials, attention focus, reported selection, and
    exaggerated transmission enter at 16. Deliberate feature-highlighting
    and achieving a goal despite opposition enter at 18.
  evidence_and_interpretation: >
    Effortful inquiry, appearance versus reality, contained meaning,
    using language/facts in one's account, and actively exaggerating a
    report enter at 19. No ordinary predicate is relocated to 25-30 to
    increase late-phase counts.
  independence: Placements are explicit communicative judgments, not source-band or alphabetic assignments or proficiency/exam guarantees.
identity_policy:
  status: Source parents, spellings, senses, and explicit provisional families are separate counts; none is a verified true-lexeme census.
  existing_fragments: Preserve protected canonical lemma/category and include only new sense members and their actual source parents.
  no_retrospective_merges: >
    Existing noun/하다 pairs sometimes have separate protected keys.
    This cohort does not rewrite or consolidate those earlier families.
    Newly added counterparts use the matching existing or explicitly
    reserved nominal family instead of automatically adding a hada root.
  new_nominal_family_reservations:
    ko-lex-04737: {lemma: 압축, category: free-lemma, noun_parent: ko-nikl-04737, selected_verb_parent: ko-nikl-04740}
    ko-lex-06293: {lemma: 부각, category: free-lemma, noun_parent: ko-nikl-06293, selected_verb_parents: [ko-nikl-06294, ko-nikl-06295]}
    ko-lex-19046: {lemma: 뒷받침, category: free-lemma, noun_parent: ko-nikl-19046, selected_verb_parent: ko-nikl-19048}
    ko-lex-30402: {lemma: 관철, category: free-lemma, noun_parent: ko-nikl-30402, selected_verb_parent: ko-nikl-30404}
    ko-lex-35057: {lemma: 내포, category: free-lemma, noun_parent: ko-nikl-35057, selected_verb_parent: ko-nikl-35059}
  reservation_policy: >
    These are real inspected noun records, not generated stems or noun
    placements. A noun worker may independently select their counterparts;
    parent must compose compatible fragments and recompute new-versus-existing
    breadth. Related-source evidence is not an implicit support request.
  additional_noun_coordination: >
    Inspected but unselected hinting noun02831 corresponds to protected
    ko-lex-02834 (시사하다, free-lemma), not current-affairs02832.
    Inspected but unselected 옹호 noun48540 corresponds to protected
    ko-lex-48542 (옹호하다, free-lemma). Parent handles any future noun
    additions; no noun or protected-family change is made here.
  shared_native_families: >
    빚다/빚어내다 share the actually matched result-producing meanings.
    꼽다/꼽히다 share selected active/passive singling-out meanings.
    부풀다/부풀리다 share becoming known in exaggerated form versus
    causing that exaggerated presentation. Each counts once, not once per
    spelling or voice.
  lexicalized_compounds: >
    끌어내다 has an explicit elicitation position and 끌어오다 an explicit
    textual-reuse position beyond the full bare 끌다34024 inventory.
    간추리다 explicitly selects important content and organizes it briefly,
    unlike generic mixture-selection 추리다45481. These are source-backed
    provisional candidates, not proof that every compound is independent.
protected_leads:
  already_usefully_covered: >
    Mental 되짚다, relevant 짚다 positions, 덧붙이다, problem and
    misunderstanding 풀어내다, all 드러내다 meanings, narrative/book
    엮다, relevant 이끌다, and all 따지다 positions are already protected.
    So are 비유하다, 규정하다, 시사하다, 옹호하다, 반박하다, 수긍하다,
    함축하다, 치우치다, and unreasonable persistent 우기다.
  no_duplicate_indirect_stance: >
    Protected 내비치다34951-s004 expresses thoughts, feelings, or intention;
    the source does not require covert expression. Its unselected public
    appearance/action position is not repurposed as a new hidden-stance sense.
  no_unsupported_embellishment: >
    보태다 gives general filling/increasing meanings here, not a separately
    specified exaggerating-a-story position. The selected 부풀다/부풀리다
    positions explicitly support exaggerated reporting.
homograph_and_role_checks:
  단정하다:
    compared_parents: [ko-nikl-16479, ko-nikl-16482, ko-nikl-16483]
    selected_parent: ko-nikl-16482
    decision: Certainty-judgment action16482 extends noun16479; neat/well-behaved adjective16483 is not this action or family.
  시사:
    compared_parents: [ko-nikl-02831, ko-nikl-02832, ko-nikl-02834]
    selected_here: false
    decision: Hinting verb02834 is already selected; matching hinting noun02831 is not current-affairs noun02832. No replacement noun or new sense is invented.
  빚:
    compared_parents: [ko-nikl-07829, ko-nikl-07830, ko-nikl-07832]
    decision: Debt/owed-favor noun07829 is not the result-producing verb family; material shaping, food, and brewing positions remain unselected.
  부각:
    compared_parents: [ko-nikl-06293, ko-nikl-06294, ko-nikl-06295]
    decision: >
      Selected 하다-s001 causes a feature to stand out; selected 되다-s002
      presents a person/thing/issue emerging as an attention focus.
      Unselected 하다-s002 is itself intransitive 나타나다, not another
      transitive cause-to-highlight position. No uniformly transitive
      gloss is copied over all hada positions.
  꼽다:
    compared_parents: [ko-nikl-33757, ko-nikl-33759]
    decision: Both selected positions are s002. The passive parent's s001 range/ranking meaning is not the active parent's s001 finger-counting meaning.
  부풀다:
    compared_parents: [ko-nikl-06711, ko-nikl-06712]
    decision: Selected intransitive s005 matches causative s003, not an assumed same-position correspondence. No physical swelling, hope, or figurative anger is imported.
meaning_boundaries:
  - Strenuous inquiry is an effort, not guaranteed discovery. 관철하다, in contrast, explicitly achieves the goal despite opposition.
  - A certainty judgment or public assertion describes the speaker's action; it does not certify that the content is true or the judgment justified.
  - Appearance better than reality is not the already-selected genuinely outstanding-quality meaning of 돋보이다.
  - Backing/support does not guarantee logical proof. Containing a meaning or attribute does not automatically entail a proposition or require deliberate authorial concealment.
  - Flat refusal, firm denial, ending discussion, counterargument, and successful disproof are not interchangeable.
  - Rough grouping, selecting only important messages, and shortening a text's length remain distinct; shortening does not promise complete information preservation.
  - The elicitation sense of 끌어내다 does not inherit coercion from its separate physical person/animal extraction sense.
  - Textual reuse is explicitly supported by 끌어오다-s008, not inferred from its physical movement senses; it does not guarantee accuracy or proper attribution.
  - Selection or being singled out does not prove superiority. Reported exaggeration is not physical growth or necessarily conscious deception.
source_limits:
  absent_exact_forms: [따져보다, 일축, 엮어내다, 우겨대다, 이끌어내다]
  policy: >
    These are bounded exact-form results, not claims that Korean cannot
    express the concepts. No fabricated parent, noun stripped from a hada
    verb, or grammatical phrase is inserted as vocabulary.
  existing_alternatives: Protected 따지다, 엮다, 우기다, and mental 되짚다 supply relevant actual meanings without invented additional entries.
  elicit_not_derive: The selected 끌어내다 sense elicits expression; absence of 이끌어내다 does not license an invented formal-conclusion derivation position.
  no_exhaustive_claim: Other general-reader words may remain unselected; this is a bounded coherent addition, not an exhaustive audit or completion of the overall planning scale.
