    ko-nikl-19151: ko-nikl-19154
    ko-nikl-21191: ko-nikl-21193
    ko-nikl-23190: ko-nikl-23191
    ko-nikl-25533: ko-nikl-25535
    ko-nikl-27142: ko-nikl-27150
    ko-nikl-27209: ko-nikl-27213
    ko-nikl-28202: ko-nikl-28208
    ko-nikl-29867: ko-nikl-29870
    ko-nikl-34345: ko-nikl-34348
    ko-nikl-40065: ko-nikl-40066
  predicate_policy: 'These actual pinned predicates were compared, not generated from noun spelling or selected as extra vocabulary. Only28208 already belonged to an established matching family. Other unselected predicates are neither support requests nor source_parents in these noun fragments.'

