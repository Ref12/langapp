placement_rationale:
  13: 'Firm personal resolve belongs with interpreting choices and intentions; its source high band does not force it into a late phase.'
  14: '탄원 describes an earnest request for help with hardship or a grievance, without requiring a court procedure or legal finding.'
  16: 'Read election and political-situation reports: districts, candidacy, votes received, counting, election defeat, public sentiment, and ruling/opposition party reference.'
  18: 'Understand a meeting chair, agenda proposals, decisions by voting, and nonselection in work-related screening or selection.'
  19: 'Distinguish the evaluative claim that a promise cannot be kept from a public pledge that simply has not yet been fulfilled.'
  20: 'Compare deliberative decisions, approval/rejection, lawmaking, revision of established matters, and assembly seats without deriving current legal powers or thresholds.'

identity_and_boundary_decisions:
  existing_family_join:
    identity: ko-lex-28202
    canonical_lemma: 결의
    category: free-lemma
    existing_member: ko-nikl-28208-s001
    added_member: ko-nikl-28202-s001
    existing_predicate_source:
      target: 결의하다
      source_part_of_speech: 동사
      source_band: ''
      korean_definitions: ['어떤 일을 하기로 굳게 마음을 정하다.']
      english_definitions: ['To definitely determine to do something']
    rationale: 'The actual noun names firmly making up one''s mind or that mindset; the actual protected predicate names firmly making that decision. This specific full-definition correspondence supports the existing family, not a universal noun-plus-하다 merger. Its old member is not repeated in this fragment.'
  independent_source_boundaries:
    - '개정27142 resets something already determined; protected27141 corrects unsuitable or wrong document content, and unselected27143 corrects errors in lettering/writing. Keep these reviewed source boundaries without asserting an uninspected origin or automatically merging the spelling.'
    - '개표27209 opens/counts ballots to discover voting results;27208 checks transportation/entrance tickets. Counting is not casting a vote, winning, certification, or making a decision by vote.'
    - '공약29867 denotes an empty promise that cannot be kept. Protected29866 denotes a government, party, or candidate''s public promise; that definition neither guarantees fulfillment nor declares the promise hollow.'
    - '결의28202 is firm resolve; protected28203 is a meeting''s collective decision;28204 is a family-like relationship between otherwise unrelated people. None is merged merely because English says resolution or agreement.'
    - '정세14568 concerns political developments;14569 concerns the way affairs unfold generally. Only the political parent is added.'
  category_reasoning:
    - '여야 is a conventional lexical collective for political-party roles, not an unrestricted both-sides operator. It is treated provisionally as free lexical content, not a new morphemic root or evidence of an exactly two-party system. The protected 여당 and 야당 families remain separate.'
    - '의석 names an assembly seat, not a bound numerical counter; no separate count-unit or legal-mandate sense is invented. 득표 names obtaining favorable votes or the votes obtained, not a generic quantity operator.'
    - '선거구 denotes a source-listed territorial electoral unit distinct from the election event; 입후보 denotes self-candidacy or putting someone forward. These are context-bearing lexical items, not automatic counts for every transparent suffix, compound, or candidate-role expression.'
    - 'Protected 과반수 remains free-lemma exactly as composed. Its source means strictly more than half, not half or more; no competing 과반 quantity family is added here.'
    - 'The other proposed nouns name independently usable institutions, people, stances, events, or event/results. Category decisions depend on these lexical uses, not the source noun POS alone.'
  actual_predicate_comparisons_not_admissions:
    ko-nikl-06300: ko-nikl-06302
    ko-nikl-10244: ko-nikl-10246
    ko-nikl-11824: ko-nikl-11829
