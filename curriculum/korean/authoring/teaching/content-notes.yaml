    These named parent-owned personal-item senses and the coordinator's excluded
    ID must not be added to this cohort. Their absence was checked without
    pronunciation research or inspection of in-progress personal files.
    The parent retains all garment, accessory, toiletry, ingredient, condiment,
    and prepared-dish additions; this cohort does not expand into those tasks.
