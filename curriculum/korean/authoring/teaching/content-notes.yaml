schema_version: 1
id: ko-content-noun-cohort
review_status: original-ai-authored-unreviewed
review_requirement: >-
  All selection, placement, grouping, English labels, and correction proposals
  are original AI-authored work requiring qualified Korean linguistic and
  pedagogical review. Passing structural checks is not linguistic approval.
scope:
  - Choose a film, performance, exhibition, or book and discuss its content.
  - Arrange ordinary recreation and understand a competition's equipment and results.
  - Describe an outing, a landscape, water, weather, and environmental news.
  - Observe familiar animals and plants, then explain simple ecological relationships.
  - Describe household materials, parts, dimensions, and defects.
  - Explain quantities, procedures, categories, source context, and common imagery.
selection_policy: >-
  Domain questions guided targeted discovery, followed by inspection of each
  selected source position's Korean and English definitions. All selections are
  explicit. Neither source order, spelling, source band, part of speech, nor a
  numerical target assigns a teaching level. Noun ownership only prevents
  concurrent editing collisions; these file sections are not lesson batches.
  There was no exhaustive unselected-source audit or round-number cutoff.
counts:
  selected_senses: 407
  core_senses: 407
  branch_senses: 0
  source_parents: 310
  distinct_selected_spellings: 301
  identity_records_in_fragment: 307
  existing_identity_fragments: 29
  new_identity_groups: 278
  new_provisional_free_lemma_groups: 275
  new_bound_form_groups: 2
  new_function_item_groups: 1
  source_noun_senses: 403
  source_bound_noun_senses: 4
  source_parents_new_to_protected_selections: 281
  source_parents_already_represented: 29
count_interpretation: >-
  These are different measurements, not interchangeable vocabulary-size claims.
  A sense is one preserved source-definition position; a source parent is a
  pinned local source record; spelling is visible Korean text; an identity is
  an explicitly justified provisional lexical grouping. Polysemy adds senses,
  not free lemmas. Identical spelling can name different homographs. Conversely,
  related independent and bound forms can share one identity. The category on
  such an identity does not assert that every member is an independent noun.
placement_rationale:
  first_exchanges: >-
    Size, shape, and speech support observable identification and repair at
    level 2; ice supports a food request at level 3. A label's concreteness
    alone does not force every animal or material into the opening levels.
  everyday_life: >-
    Household parts, ordinary materials, familiar animals, and plant care enter
    at level 5. Shopping quantities, clothing materials, and exercise enter
    at 6; outings, venues, landforms, and weather at 7; shared hobbies, equipment,
    and work or study reference at 8. The independent gap sense of 틈 enters
    before its bound interval use, rather than letting a bound use alone count
    as the first introduction of an independent lexical family.
  stories_conversations: >-
    Level 9 uses actual outing and competition narratives, wildlife observations,
    and story characters. Level 10 distinguishes temperament, private thoughts,
    joking, and mean pranks. Level 11 describes making and handling materials.
    Level 12 interprets text, media, and performance content; level 13 compares
    characteristics and discusses customs or suitable seasons.
  explanation_problems: >-
    Defects and unfamiliar circumstances enter at 14, actual work sites at 15,
    reporting events and competition outcomes at 16, and environmental/material
    explanations at 17. Resources and opportunities for action support
    negotiation at 18. These placements do not inherit dictionary bands.
  analysis_argument: >-
    Evidence, noteworthy points, classification, and relative weight enter at
    19; city government and retail trading at 20; observation, biology, and general dimensional
    explanation at 21. Hidden hardship supports values discussion at 22;
    loopholes and action principles at 23; full texts and edition references
    support synthesis at 24.
  nuance_interpretation: >-
    Pretence, inflated appearance, and a decisive figurative card enter at 25.
    Source-marked and selected common imagery enters mostly at 27. Depth,
    mental image, and underlying basis support precision at 28; visual area,
    staging effects, textual traces, and theatrical act reference support
    interpretation at 29. No specialist branch was padded with marginal nouns.
identity_decisions:
  existing_fragments: >-
    Established identities retain their exact keys, canonical lemma, and category.
    The content fragment lists only new members. Examples include 소재's material
    use, 장면's actual-event scene, 카드's greeting/game/strategy uses, 게임's
    match and counting uses, and 효과's theatrical effects.
  related_source_parents:
    - identity: ko-lex-04573
      parents: [ko-nikl-04573, ko-nikl-04575]
      rationale: >-
        Egg and individual round grain provide independent content uses; the
        bound small-round-item counter is an explicitly related function.
        All remain individually labeled and the counter adds no free lemma.
    - identity: ko-lex-22178
      parents: [ko-nikl-22178, ko-nikl-22179]
      rationale: >-
        Physical gap and opportunity connect to a short available interval.
        The temporal bound form remains visibly bound in source provenance
        while sharing one provisional gap/opportunity identity.
    - identity: ko-lex-39480
      parents: [ko-nikl-39480, ko-nikl-39482]
      rationale: >-
        Wheel and the bound count of turns or circuits share a provisional
        rotation family. This is an explicit semantic decision, not a rule
        merging every equal spelling or all counters.
  noun_and_counting_roles:
    - {identity: ko-lex-29407, independent: [ko-nikl-29407-s001, ko-nikl-29407-s002], counting: [ko-nikl-29407-s003]}
    - {identity: ko-lex-27934, independent: [ko-nikl-27934-s002], counting: [ko-nikl-27934-s003]}
    - {identity: ko-lex-41390, independent: [ko-nikl-41390-s001], counting: [ko-nikl-41390-s003]}
    - {identity: ko-lex-09218, independent: [ko-nikl-09218-s001], counting: [ko-nikl-09218-s002]}
    - {identity: ko-lex-21669, independent: [ko-nikl-21669-s001], counting: [ko-nikl-21669-s002]}
  bound_only:
    - >-
      ko-lex-35972 is the bound theatrical act counter; no shelter, curtain,
      or other independently usable 막 noun is claimed.
    - >-
      ko-lex-22407 selects only the edition-counting position s004 and is
      bound-form despite source POS noun. The flat-object 판 group ko-lex-22406
      is separate. Identical printing-plate definitions in unselected positions
      are not used to manufacture an additional free printing lexeme.
  function_only: >-
    ko-lex-33117 기타 means the residual reference other items. It is a
    function-item, not a guitar or another descriptive free lemma.
  homographs: >-
    Distinguish retail 소매00711 from sleeve 소매00709; speech 말36211 from horse 말36275; amount 양05111 from sheep
    양05105; line/crack 금32389 from gold 금32393; surface/aspect 면37115
    from cotton 면37116; acting 연기47373 from smoke 연기47372. Other inspected
    traps include poetry-collection 시집02947 versus a husband's home02946,
    drum 북06745 versus north06746, paragraph 문단38374 versus literary
    world38375, full text 전문13800 versus specialization13801, dragonfly
    잠자리12675 versus bedding12674, and group 무리38024 versus overexertion38025.
  synonyms_and_compounds: >-
    Different lexical forms are not merged just because they share English:
    극장/영화관, 일출/해돋이, 햇빛/햇살, 쇠/철, 풍경/경치, 곡/멜로디,
    and 보전/보존 remain separate provisional identities. No exclusive
    collocation rule is claimed for the last pair. Supplied compounds such
    as 나뭇잎 and 바깥쪽 are not automatically spelling variants of their
    components; no unseen compounds or X하다 predicates were generated.
  source_register: >-
    All 15 selected source definitions beginning with an explicit figurative
    marker retain figurative in ds. Other nonliteral senses retain their
    actual meanings even where the source does not explicitly mark register.
    Marked person insults, obsolete official titles, religious judgment,
    geomancy, reproductive-fluid meanings, and unrelated homographs were not
    neutralized into ordinary vocabulary.
meaning_checks:
  - >-
    The coordinator's retail lead ko-nikl-00711-s001 was separately inspected
    and added for level 20 economic explanation, not wardrobe instruction.
    Its sole source position was chosen because of that meaning, not because
    it was first or carried an advanced source band. Cotton ko-nikl-01312-s001
    was already selected as fiber/wadding and already has an exact correction
    request below; no duplicate cotton selection was added.
  - >-
    야영04993-s002 is recreational camping, not military encampment s001.
    심판03683-s003 is sporting officiating, not Christian judgment s002.
  - >-
    토양21613-s002 is plant-growing soil and s003 explicitly figurative
    foundation. 품종23374-s002 is an in-species breed/variety; 개체27177-s002
    is an individual organism. An unsupplied technical species sense of 종
    was not fabricated from its broad category or seed positions.
  - >-
    생물09547-s002 is biology and s003 fresh unfrozen goods, neither another
    unspecified organism nor a source-based guarantee of food safety.
  - >-
    불꽃07103-s001 denotes flame light and s002 a struck spark. 섬유00109-s001
    explicitly describes biological textile fiber; 고무29011-s001 is natural
    rubber. Synthetic material varieties were not inferred as selected senses.
  - >-
    그림자32086 distinguishes cast shadow s001, reflection s002, and trace of
    presence s003. 바람39374-s002 is inflated air, not the wish homograph.
  - >-
    The crab sense ko-nikl-27882-s001 and pouch sense ko-nikl-41685-s001 were
    removed when the newly registered kitchen and personal cohorts supplied
    them. Neither second placements nor duplicate identity members were retained.
