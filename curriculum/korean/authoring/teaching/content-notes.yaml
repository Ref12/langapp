source_and_license_limits: >-
  Exact local identities refer to the existing pinned source-senses.yaml:
  ko-nikl-NNNNN is the preserved project CSV record and sNNN its original
  definition-list position, not an official NIKL sense number. Source bands,
  original Korean/English, provenance, and licensing metadata were not edited.
  These new selection files do not relicense upstream definitions or imply
  permission for uses beyond the repository's established source terms.
  The quoted correction evidence retains upstream obligations. No official
  dictionary endorsement, TOPIK qualification, proficiency certification,
  complete native lexical inventory, or completed scale target is claimed.
validation:
  status: passed-for-authored-shard-contracts
  strict_loader: curriculum_yaml.load_yaml
  real_api_checks:
    - sense_index validates the pinned registry and exact original source positions.
    - load_selections composes the live registered shards plus this cohort using an in-memory explicit manifest.
    - lexical_members validates standalone and composed identity membership and source-parent sets.
    - source_corrections validates all ten proposed corrections against exact bilingual originals and selected labels.
  other_checks:
    - Exactly four fields per vocabulary row and five fields per identity record.
    - Unique new IDs; no overlap with any currently registered protected selection.
    - Existing canonical lemma and category preserved; existing members and placements unchanged.
    - All levels are explicit integers from 1 through 30 and all topics are declared.
    - Every ds is nonempty and at most 64 characters.
    - Source POS is noun or bound noun; all 15 explicitly marked figurative definitions retain that qualifier.
    - The three related independent/bound families introduce an independent use no later than their bound use.
    - Counts and both reading-review parent lists exactly match the selected and protected data.
    - Protected input hashes remain unchanged through validation.
  existing_tests:
    command: >-
      python -B -m unittest
      test_korean_program.KoreanSelectionFilesTests
      test_korean_program.KoreanAdapterTests.test_polysemy_counts_once_and_bound_forms_are_separate
      test_korean_program.KoreanAdapterTests.test_authored_corrections_preserve_bilingual_source_and_selected_label
    tests_passed: 8
    environment: Existing Python 3.12 and PyYAML with PYTHONPATH=scripts; no installs or temporary test files.
  composition_snapshot:
    protected_cohorts: [base, early, expansion, breadth, community, kitchen, personal]
    protected_personal_senses: 54
    protected_unique_senses: 3851
    protected_identity_groups: 2835
    protected_core_senses: 3726
    protected_core_provisional_free_identities: 2629
    composed_unique_senses: 4258
    composed_identity_groups: 3113
    composed_core_senses: 4133
    composed_core_provisional_free_identities: 2905
    new_distinct_spellings_relative_to_snapshot: 268
    warning: >-
      This is a live-input validation snapshot, not a claim that this workstream
      registered the shards or completed pronunciation/full-generation validation.
      Parent integration can legitimately change the protected totals.
  core_coverage_change:
    additional_core_provisional_free_identities: 276
    globally_new_provisional_free_identities: 275
    existing_branch_identity_entering_core:
      identity: ko-lex-03362
      lemma: 신화
      added_core_member: ko-nikl-03362-s003
      core_level: 27
      unchanged_literary_members: [ko-nikl-03362-s001, ko-nikl-03362-s002]
    interpretation: >-
      The extra one is not another new lexical identity. The established
      literary-only myth family acquires a selected common figurative core
      sense. Its literal myth and sacred-tale senses keep their optional
      literary placements; learning the core achievement sense does not award
      mastery of those other senses. Global new-identity counts and additional
      core coverage therefore differ legitimately.
  source_selection_snapshot:
    selected_nonfirst_positions: 136
    source_band_counts_by_selected_sense: {beginner: 108, intermediate: 183, advanced: 116}
    interpretation: These preserved dictionary annotations did not determine authored levels and are not exam-readiness evidence.
