schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: all31 senses integrated with official readings; qualified review remains outstanding
scope:
  - Only interaction-vocabulary.yaml, interaction-identities.yaml, and this notes file are owned here.
  - Protect the complete current manifest and all actual parent-owned cognition selections, including its continuation and speech-noun addendum.
  - No cognition, governance, source, reading, manifest, code, test, generated-output, or other-cohort edits.
  - No noun curation, constructed predicates, automatic first-sense imports, or source-band/alphabetical/quota placement.
  - Ordinary interaction is placed by prerequisites and usefulness, not moved to levels 25-30 to increase late-phase counts.
source_provenance:
  source_id: nikl-2024-mirror
