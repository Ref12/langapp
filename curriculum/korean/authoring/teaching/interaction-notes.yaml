source_correction_requests:
  ko-nikl-19305-s002:
    source_korean: 잘못되거나 부족한 점을 따져서 드러나게 하다.
    source_english: 'To find someone''s fault or shortcoming, and make it exposed.  '
    authored_interpretation: to examine and expose faults or shortcomings
    rationale: Preserve the examining-and-exposing action of 따져서 드러나게 하다; the Korean does not restrict the faults to a particular person's character. Original English and its two trailing spaces remain untouched.
  ko-nikl-33704-s002:
    source_korean: 어떤 사실에 대해 분명하게 말해서 지적하거나 들춰내다.
    source_english: To disclose or find fault with something by clearly stating its problems.
    authored_interpretation: to point out or expose a fact by stating it clearly
    rationale: The Korean names a fact explicitly pointed out or exposed; English problems narrows every instance to fault-finding. Preserve the possibility of criticism without inserting that restriction into every use.
  ko-nikl-39824-s001:
    source_korean: 다른 사람의 비판이나 농담 등의 말을 맞받아 대꾸하다.
    source_english: To answer upon hearing someone's criticism, joke, etc.
    authored_interpretation: to counter a criticism or joke with a reply
    rationale: Restore the counter-reply perspective of 맞받아 대꾸하다 rather than any answer after hearing the words; a counter-reply to a joke is not necessarily a factual refutation.
  ko-nikl-39819-s003:
    source_korean: 다른 사람의 말이나 노래를 받아 거침없이 처리하다.
    source_english: To take over someone's remark or song, and to continue it without hesitating.
    authored_interpretation: to handle another's words or song without hesitation
    rationale: Scope clarification; 처리하다 concerns handling the received words or song. English continue it narrows the possible response to continuation, whereas the selected label leaves the handling response context-dependent.
  ko-nikl-36532-s002:
    source_korean: 서로 밀접한 관련을 맺으며 어우러지다.
    source_english: For two things or people to be closely connected and get along.
    authored_interpretation: to be closely interrelated and intertwined
    rationale: Scope clarification; the Korean explicitly concerns close mutual relations and combination. English get along can narrow this to friendly interpersonal agreement, which is not required when factors or events interrelate.
