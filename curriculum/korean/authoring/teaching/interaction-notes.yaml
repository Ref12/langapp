  identity_policy: IDs preserve the one-based CSV data-record ordinal and original definition-list position, not official NIKL identifiers.
  inspection_method: >
    Read the exact pinned CSV into memory and verify its full checksum.
    Inspect complete paired Korean/English lists and every matching named
    form, not the first record returned or a guessed figurative meaning.
    No source cache, pronunciation, or usage-example file is created.
  attribution: National Institute of Korean Language and Korean-English Learners' Dictionary contributors, via the unofficial binjang extraction.
  license: CC-BY-SA-2.0-KR for dictionary text; not the mirror's MIT metadata.
  license_url: https://creativecommons.org/licenses/by-sa/2.0/kr/
  reuse_notice: >
    Full bilingual definitions below are preserved as source evidence.
    Concise English labels, placements, and provisional family decisions are
    original adaptations; retain attribution, source/license links, and
    share-alike terms. No dictionary endorsement, multimedia, or usage-example
    redistribution is claimed.
identity_policy:
  provisional_status: >
    Source-parent counts, selected spellings, and lexical identity candidates
    are separate measures. No spelling/POS pair or actually listed compound
    by itself proves an independently verified true lexeme.
  fragments: Existing families receive new members only, preserving canonical lemma/category and listing only the parents represented by those new members.
  voice_and_related_forms: >
    Do not infer new breadth from regular voice or transparent counterpart
    spellings. Where one family is supported, count it once and preserve
    participant perspectives. A physical source meaning never licenses an
    invented abstract placement for a related form.
  function_identity_ids: []
  bound_form_identity_ids: []
protected_exclusions:
  ko-nikl-22209-s001: Parent-held 팀장; do not select, invent a reading, or research further.
  ko-nikl-48419-s001: Parent-held 온실가스; do not select, substitute, invent a reading, or research further.
protected_family_categories:
  ko-lex-26499: {lemma: 감사하다, category: free-lemma, policy: Preserve the protected gratitude family and its noun extension; audit meanings remain distinct.}
  ko-lex-03447: {lemma: 실상, category: function-item, policy: Preserve the merged noun/adverb function family; do not restore retired free key03445.}
retired_identity_keys: [ko-lex-26491, ko-lex-03445]
lead_disposition:
  already_covered: >
    Cognition already selects mental 되짚다 and indirect 빗대다. Protected
    cohorts cover cognitive 되새기다, comparison 견주다, both 가려내다
    meanings, reconsideration/opinion-changing 돌이키다, and all 엿보다
    positions. Those are not new interaction breadth.
  physical_only_remainders: >
    Unselected chewing/rumination in 되새기다, route retracing in 되짚다,
    and direction reversal/restoration in 돌이키다 are not repurposed as
    new interpretation meanings.
  absent_exact_forms: [에두르다, 둘러말하다, 돌려말하다, 가려듣다, 돌려세우다, 새겨보다, 짚어내다]
  absence_policy: These are exact pinned-form limits, not claims that Korean cannot express the intended meaning. No IDs or phrase-shaped vocabulary rows are invented.
  additional_covered: Protected cohorts already select responsibility-shifting 떠넘기다, taking responsibility 떠맡다, and problem/misunderstanding resolution 풀어내다.
  bounded_deferrals: >
    Direct/immediate counter-response forms 맞받다, 맞받아치다,
    되받아치다, and the multi-meaning 맞부딪치다 were inspected but are
    not all imported. They are not declared identical merely because English
    glosses overlap. 뒤얽히다 gives general complicated entanglement/mixing;
    no separate interpersonal source position is manufactured here.
  final_batch_deferrals: >
    Protected 돌아보다/되돌아보다 already supply retrospection, 내다보다
    supplies prediction, and 짚다 supplies singling out and estimation.
    내비치다 already supplies revealing thoughts/feelings/intentions: its
    source does not promise exclusively indirect expression. Both 내보이다
    homographs were inspected; the intransitive appearance parent 34940 is
    not the active inner-thought revelation parent 34941, and neither is
    added. Actual 지레짐작 noun 42618 and verb 42619 were inspected but this
    bounded cohort does not add another noun/하다 family beside 넘겨짚다.
  uncertainty_not_absence: >
    Unselected alternatives remain available; a deferral is not a claim
    that two forms are interchangeable or that a source word is unusable.
    There is no exhaustive unselected-source audit or global-scale
    completion claim.
curation_rationales:
  indirectness_and_deception: >
    둘러대다 explicitly deceives through a plausible fabrication; it is not
    interchangeable with every excuse or indirect account. 얼버무리다
    leaves speech/attitude unclear and need not be assigned the same intent.
    떠보다 discreetly probes rather than guaranteeing access to another mind.
  relations_and_coordination: >
    Closely related factors need not be socially friendly. Missing a meeting
    through timing/direction and disagreeing in opinion are different
    coordination problems; preserve the actual source positions.
  conservative_counting: >
    Existing 매듭, 막다, 돌리다, and 밝히다 families receive compatible new
    event/compound members only. 들추다 and selected contracted 들춰내다
    are counted once; the unselected full-form variant is source evidence,
    not another requested support parent or headword. Active 맞물다 and
    틀다 comparisons constrain future voice-family accounting without
    fabricating abstract active meanings or selecting their other senses.
  degree_and_perspective: >
    An expectation being wrong is not the same as conduct being undesirable.
    A developing relationship rift is not automatically an ended relationship.
    Guesswork is not established knowledge; replying to a joke need not
    prove anything false; closing a matter need not resolve it successfully.
    Exact repetition, defiant talk-back, counter-reply, vague evasion, and
    deliberate fabricated deception retain their separate source boundaries.
  late_register_placement: >
    Only explicitly defiant advice/scolding response and hurtful sarcastic
    speech are placed at 26. Their shared lexical families enter earlier
    through other useful meanings; no ordinary action is moved there to
    fill a phase.
