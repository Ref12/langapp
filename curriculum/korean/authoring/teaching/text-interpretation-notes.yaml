source_correction_requests:
  ko-nikl-49676-s001:
    source_korean: '인쇄하거나 발표하기 위하여 쓴 글이나 그림.'
    source_english: 'A writing or picture created to print or publish. '
    authored_interpretation: 'manuscript; text or pictures for printing or presentation'
    rationale: >
      Preserve 발표 as presentation rather than imply that the material must
      be a published item. Keep both writing and pictures and the printing/
      presentation alternatives; do not impose a first-draft restriction.
  ko-nikl-30733-s001:
    source_korean: '남의 문장 또는 출판물의 잘못된 글자나 글귀 등을 바르게 고침.'
    source_english: 'The act of revising sentences or incorrect words or phrases written by others in a publication.'
    authored_interpretation: 'correcting errors in others'' sentences or publications'
    rationale: >
      English places the work in a publication, whereas Korean gives
      sentences or publications as alternatives. Retain correction of
      faulty characters/wording rather than unconstrained rewriting, and
      do not require the manuscript/print comparison belonging to30732.
  ko-nikl-21841-s001:
    source_korean: '글을 쓸 때 여러 번 고치고 다듬음. 또는 그런 일.'
    source_english: 'An act of changing one''s wording over and over when writing something, or such a task.'
    authored_interpretation: 'repeatedly revising and polishing a piece of writing'
    rationale: >
      Preserve both correction and polishing in 고치고 다듬음 and their
      repeated cycles. The English wording-change paraphrase should not
      reduce the task to repeated word substitution; no particular
      structural-editing technique is added.
