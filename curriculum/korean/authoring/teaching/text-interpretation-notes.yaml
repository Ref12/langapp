placement_rationale:
  reading_evidence_19: >
    At19, distinguish deep absorption from merely spending time on a text
    and check an actual reading error against the text. Absorption does
    not establish comprehension; a defensible alternative interpretation
    is not automatically an 오독.
  formal_drafting_24: >
    At24, keep a first draft separate from the text or pictures prepared
    for printing/presentation, discuss literal space between written
    lines, and compare printed output against its manuscript. These serve
    structured synthesis and accurate presentation rather than a technical
    typography or publishing catalogue.
  implication_and_response_25_27: >
    At25, name containment of meaning or properties while preserving
    protected 내포하다 and avoiding invented entailment or author intention.
    At27, identify the specifically pleasant response to being deeply
    moved, without equating it with any emotion or sensitivity as a capacity.
  interpretive_contrast_29: >
    At29, contrast literal 행간 with meaning not directly stated, and locate
    a peak in a narrative's development. The 절정 source position is broader
    than narrative climax; neither every ending nor every reversal is
    automatically such a peak.
  iterative_revision_30: >
    At30, revise and polish a sustained project repeatedly and distinguish
    correction of others' textual errors from comparing manuscript and
    print. Placement follows these different tasks, not a requirement to
    put every newly discovered noun at the final level.
family_accounting:
  policy: >
    Actual added senses of a parent stay in that parent's family. Similar
    English meanings alone neither merge independent roots nor create new
    ones. In particular, 초고 and 원고 are not collapsed; their overlapping
    draft positions do not demonstrate derivation or variant status.
    The two newly selected 교정 parents are distinct lexical homographs,
    not two spellings of one family or senses of protected30735.
  protected_extension:
    identity: ko-lex-35057
    lemma: 내포
    category: free-lemma
    old_member: ko-nikl-35059-s001
    old_parent: ko-nikl-35059
    old_source_korean: '어떤 뜻이나 성질 등을 속에 가지다.'
    old_source_english: 'To contain a meaning or attribute, etc. '
    added_member: ko-nikl-35057-s001
    evidence: >
      The noun 속에 가짐 and real selected 내포하다 verb 속에 가지다 share
      the same meaning/property base. The existing group already reserves
      the noun identity; add only the actual noun, preserving the old
      member, lemma, category, and represented parent.
  protected_homographs:
    ko-lex-49675:
      lemma: 원고
      old_members: [ko-nikl-49675-s001]
      distinction: plaintiff who brings a court case, not manuscript49676
    ko-lex-30735:
      lemma: 교정
      old_members: [ko-nikl-30735-s001, ko-nikl-30735-s002]
      distinction: general correction and offender rehabilitation, not textual proofing30732 or emendation30733
  other_protected_families: >
    Keep every prior canonical key/category/member unchanged, including
    감사26499 rather than audit26498, 실상03447, 좀41331, and all completed
    culture/loanword families. No 시나리오 selection or lookup is repeated.
