  method: >
    Read complete original Korean and English definition arrays, preserving
    their order and every English trailing space. Project source IDs refer
    to original CSV records and definition positions, not official entry
    numbers. Inspect all exact-spelling/POS official competitors for each
    newly selected parent. Do not replace original definitions with current
    official wording, borrow a homograph's pronunciation, or split one
    original act/result definition into several learner senses.
  no_imported_assets: >
