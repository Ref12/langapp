  status: No exact or space-normalized match found in the pinned January 2024 CSV.
reading_policy: >
  Seventy selected senses use official citation text, including 자율성
  자율썽 after complete-definition comparison with official 73141.
  뉘앙스 and 고정 관념 have individually authored broad-Hangul proposals,
  explicitly unreviewed rather than dictionary-verified. Their official
  complete-definition matches lack pronunciation text; spelling and sound
  are not treated as interchangeable by default. Both held source senses
  48419-s001 and 22209-s001 remain excluded without further research.
reading_review:
  official_text_senses: 70
  authored_reading_senses: 2
  remaining_selected_gaps: []
limitations: >
  These lexical concepts do not certify sound reasoning, medical findings,
  legal justification, factual reliability, numerical probability, or mastery
  of rhetoric. Register, usage, source interpretations, and lexical-family
  judgments remain unreviewed. No source examples or media are reproduced.
