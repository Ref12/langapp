placement_rationale:
  - The actual airport/downtown tax-exempt shop at7 supports travel signs without promising eligibility or an allowance.
  - Level14 financial-service problems distinguish accounts, passbooks, deposits, transfers, withdrawals, balance words, bills and overdue fees.
  - Responsibility and reporting at15 use unspent money and itemized statements; neither proves the correctness of an account.
  - Negotiating at18 uses generic division into parts and the actual contractual-breach payment term, not a fabricated installment-only division sense.
  - Level20 public/economic reading covers tax imposition, rates, annual personal earnings, debt repayment, remaining obligations and imported money/goods.
  - Existing professional/scientific branch placements and original source bands are not moved or turned into legal/examination qualifications.
