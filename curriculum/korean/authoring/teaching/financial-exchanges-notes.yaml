source_correction_requests:
  ko-nikl-12547-s001:
    source_korean: "남은 돈의 액수."
    source_english: "The amount of money left unspent."
    authored_interpretation: the remaining balance of money
    rationale: The Korean says remaining money without the English's extra unspent restriction; the label does not prove available spending funds or a particular kind of balance.
  ko-nikl-30139-s001:
    source_korean: "어떠한 항목에 대한 세금을 정해서 그것을 내도록 함."
    source_english: "The act of imposing and collecting taxes on items."
    authored_interpretation: setting a tax on an item and requiring its payment
    rationale: Requiring payment is not proof of collection; preserve the Korean imposition/requirement scope.
  ko-nikl-37272-s001:
    source_korean: "주로 물품이나 금액의 내용이나 항목, 수량 등을 자세하고 구체적으로 적은 문서."
    source_english: "A document which records the amount, item, or quantity of goods in detail."
    authored_interpretation: a detailed statement of items, quantities or money amounts
    rationale: Preserve monetary contents as well as goods/items; the English's goods-only wording is too narrow.
  ko-nikl-45689-s001:
    source_korean: "은행과 같은 금융 기관의 계좌에서 돈을 뺌."
    source_english: "An act of taking money out of one’s account in a financial institution such as a bank."
    authored_interpretation: taking money out of a financial account
    rationale: The Korean does not specify ownership; omitting that added restriction grants no authorization to access anyone's account.
source_boundaries:
  operations: >
    입금 puts funds into an account; 출금 removes them; 이체 moves funds
    between accounts. 인출 selected position2 withdraws deposited money,
    not generic drawing-out position1 or new borrowing. None establishes
    ownership, authorization, availability, cleared funds or completed action.
  remaining_money: >
    잔금 includes leftover-after-spending, still-unpaid and final-house/
    land-purchase-installment positions. Keep those three source identities
    and contexts, not thin-short-line homograph12549 or a single vague balance.
  fees_and_promises: >
    선금 is advance money for buying/borrowing, not an automatically
    refundable security deposit. 연체료 depends on overdue days for money
    or items but supplies no rate or universal charge. 위약금 is money
    promised to the other party, not a ruling on enforceability or breach.
  taxation: >
    The sources give a statutory-reference rate, personal annual-earnings
    tax, imposition and exemption concepts. They do not identify actual
    applicable laws, current rates, duty-free allowances, tax liability or
    eligibility, nor promise all purchases at a named shop are exempt.
  foreign_scope: >
    Imported money/goods is actual 외화 position2. Foreign-film48903 is
    another source parent, and narrow international-bill 외환48904 is not
    a substitute for general modern foreign exchange or foreign currency.
