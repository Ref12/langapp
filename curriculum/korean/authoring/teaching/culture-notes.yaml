schema_version: 1
id: ko-cultural-participation-noun-cohort
review_status: original-ai-authored-unreviewed
completion_status: integrated; qualified linguistic and pedagogical review remains
scope:
  - Choose and discuss performances, television programs, and ordinary cultural activities.
  - Distinguish performers, viewing/listening roles, ensemble activities, and audience responses.
  - Recognize a few common music and dramatic-work terms without collecting specialist genres or techniques.
  - Participate through hobby groups, folk play, attendance planning, and health-conscious rest.
ownership:
  authored_files: [culture-vocabulary.yaml, culture-identities.yaml, culture-notes.yaml]
  protected: all earlier files, source and reading ledgers, manifests, tests, and generated output
  other_worker_scopes: >
    No institution, right, regulation, economic-policy, or interaction-verb
    selection is added. Advance purchase is limited to the actual travel/
    admission-ticket meaning needed for attendance, not general financial
    participation. No completed visual-material or physical-form item is repeated.
  excluded_parent_ids: [ko-nikl-48419, ko-nikl-22209, ko-nikl-25822, ko-nikl-29719]
selection_policy: >
  First inspect live registered source positions and canonical identities,
  then use bounded exact-form questions about attending, performing,
  discussing music/media, and voluntary recreation. Compare complete original
  bilingual lists and same-spelling source competitors before selecting.
  This is not an exhaustive unselected-noun audit, a first-sense sweep,
  an instrument/genre catalogue, or a quota-driven later-level bucket.
  Every selected item is an actual source noun, not a generated verb,
  person name, nominal compound, derivative, or pronunciation.
