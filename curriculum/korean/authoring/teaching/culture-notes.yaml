source_correction_policy: >
  Requests preserve exact original Korean and English strings and provide
  an authored compact interpretation identical to the proposed learner label.
  These are interpretation proposals requiring qualified Korean-teacher and,
  where appropriate, domain review. Parent owns the shared ledger; raw source
  text and original positions are not replaced.
source_correction_requests:
  ko-nikl-12978-s001:
    source_korean: 내용이 길고 복잡한 소설, 시, 영화 등.
    source_english: A novel, poem, movie, etc., with a long and complex story.
    authored_interpretation: a long, complex work such as a novel, poem, or film
    rationale: >
      내용 concerns content, not necessarily a narrative story. Preserve length
      and complexity without requiring a poem to have a plot; no fixed page/
      runtime threshold or assertion that every long work is complex is supplied.
  ko-nikl-24490-s001:
    source_korean: 두 가지 이상의 악기로 동시에 연주함. 또는 그런 연주.
    source_english: A musical performance done by two or more instruments, or such a piece of music.
    authored_interpretation: playing two or more kinds of instruments simultaneously
    rationale: >
      가지 distinguishes kinds of instruments, not merely a count of instruments
      or performers. 동시에 requires simultaneous playing. 그런 연주 denotes
      that performance, not a newly composed piece; retain the source's narrow
      wording rather than silently substituting a broader modern ensemble definition.
  ko-nikl-25926-s001:
    source_korean: 많은 사람들이 즐겨 부르는 노래.
    source_english: Songs many Koreans enjoy singing.
    authored_interpretation: songs many people enjoy singing
    rationale: >
      The original Korean says people, not Koreans. Do not add a nationality
      requirement or restrict the source to a modern commercial-pop industry.
