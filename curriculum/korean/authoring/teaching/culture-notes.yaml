  inspected_registry_sha256: 153b7ccf783cde50c9ae253c9045f2ce3e47e14cc72bdae1922b9161c5ff8589
  inspected_support_sha256: 61e83ccdbdcd42b351690c1c4ef9db33bb0cd747b96478cbf0f4937b6cb83240
  method: >
    Read the retained January2024 CSV with its existing checksum verifier,
    preserving record ordinals, full Korean/English lists, raw POS, bands,
    categories, and English whitespace. Project IDs identify original CSV
    records and definition positions, not official dictionary entry numbers.
    For each request, source_entry is source_url plus #record=source_record.
    Existing source extraction and identity helpers are used in memory only.
  publication_boundary: >
    No source usage examples, song lyrics, scripts, sheet music, pictures,
    recordings, pronunciation models, or other media assets are imported.
    Definition evidence is not evidence of learner comprehension or production.
placement_rationale:
  first_preferences: >
    Songs for children, songs people enjoy singing, and professional performers
    support elementary preference/person descriptions at4. They are not placed
    early to meet a phase target, and their source bands remain unchanged.
  attending_and_taking_part: >
    First film showing, advance tickets, and rest for health fit arrangements
    at7. Television/radio audience roles, previews and reruns, enthusiasts,
    hobby groups, choir participation, and lyric/performance credit terms
    support work/study and ordinary cultural participation at8.
    A professional performer is not necessarily a celebrity; a club is not
    automatically school-only, adult-only, or legally constituted.
  describing_performance: >
    Lead/supporting roles and joyful shouting support narration at9.
    Stage presentation, professional musical groups, accompaniment, playing
    different instrument kinds together, personal impressions, Korean
    traditional music, and folk play support cultural discussion at10.
    Source profession, radio/television, instrumental-kind, and emotional
    conditions remain visible rather than being flattened into generic audience
    or performance labels.
  reporting_and_comparing: >
    At12, name melodic flow, compare short and long works, discuss scripts
    and direction, distinguish arranging existing music from lyric writing,
    and report responses to something seen/heard. These are general-reader
    distinctions, not instruction in scoring, production, or literary theory.
    No new item is pushed to levels19-30 to improve the phase distribution.
  existing_placements: >
    Existing vocabulary stays at its current level or branch. In particular,
    already selected literary-branch 수필 and 작곡 are not duplicated as
    new core items. A new family member can be useful before an older one;
    that does not change the older placement or confer knowledge of the
    canonical base automatically.
counting_policy: >
  Report twenty-five new provisional free families and ten depth selections
  separately. Six actual naming/derivative members extend protected families;
  four further members deepen newly introduced families. Thirty-five source
  spellings are not thirty-five verified independent free bases. Conversely,
  different lexical bases are not universally merged because English labels
  overlap. Every grouping below is an individual conservative proposal requiring
  qualified lexical review, not a global suffix-stripping or synonym rule.
