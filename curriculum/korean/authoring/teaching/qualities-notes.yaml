parent_family_review:
  실상:
    protected_adverb: ko-nikl-03447-s001
    protected_adverb_identity: ko-lex-03447
    protected_adverb_category: function-item
    observed_nominal_identity: ko-lex-03447
    observed_nominal_category: function-item
    source_nominals: [ko-nikl-03445-s001, ko-nikl-03446-s001]
    adjudication: >
      The parent compared all three complete-definition official matches:
      selected noun78660 and adverb78662 both have origin 實狀, whereas
      unselected noun78663 has 實相. interpretation-notes.yaml records
      the conservative merger under protected function ko-lex-03447,
      retiring provisional ko-lex-03445 without changing source sense IDs,
      noun/adverb POS, labels, placements or readings. The original concern
      reduced current free accounting by one rather than adding breadth.
  내심:
    retained_nominal: ko-nikl-34984-s001
    observed_nominal_identity: ko-lex-34984
    concern: >
      The inspected retained source is a noun for unexpressed actual thoughts
      or intentions. No retained adverb counterpart was found in this targeted
      lookup. Parent explicitly selects that nominal under free identity
      ko-lex-34984. Do not manufacture an adverb from syntactic use of the noun.
  억지:
    retained_nominal: ko-nikl-46634-s001
    selected_adverb: ko-nikl-46636-s001
    reserved_identity: ko-lex-46634
    concern: >
      If parent later selects the noun, review and extend this same proposed
      family rather than silently count the particle-bearing adverb again.
      Current source_parents and members contain only the selected adverb.
remaining_gaps:
  parent_followup: >
    All eight absent-at-handoff targets below were subsequently found as
    genuine unbanded CSV parents and integrated by quality-support-*.
    Their eight selected senses use official readings; the explicitly
    compared 엄밀하다/엄밀히 family supplies one provisional free identity.
  coverage: >
    This is a bounded coherent addition prioritizing new quality and modifier
    candidates, not completion of the overall core guide. Further useful
    general-reader breadth remains, especially precise argument, fairness,
    rhetorical clarity, and context-sensitive register. Existing polysemy and
    source-recovered predicates are not counted again as new breadth here.
  source_followup_policy: >
    The bounded targets below were checked against the actual retained
    registry during finalization and were absent. This is not an exhaustive
    unselected-source audit. Parent owns any recovery and qualification;
    no source parents, substitute spellings, or synthetic predicates are added.
  absent_targets:
    - 엄밀하다
    - 엄밀히
    - 명쾌하다
    - 장황하다
    - 부당하다
    - 불공평하다
    - 적합하다
    - 허심탄회하다
  lexical_review: >
    The 실상 nominal/adverbial overlap has a source-compared conservative
    family decision above, still requiring qualified lexical review.
    Function/content and derived-form distinctions remain provisional rather
    than independently proven true-lexeme boundaries. Unselected source
    meanings remain available and are not assigned to advanced levels simply
    to increase a phase count.
protected_exclusions:
  ko-nikl-22209-s001: Parent-held 팀장; do not reintroduce, invent a reading, or research.
  ko-nikl-48419-s001: Parent-held 온실가스; do not reintroduce, substitute, invent a reading, or research.
source_correction_requests:
  ko-nikl-37821-s002:
    source_korean: 일이 제대로 되지 못하다.
    source_english: Ugly and not pretty in appearance.
    authored_interpretation: for things not to work out properly
    rationale: The Korean concerns work or events not proceeding properly, not ugliness of appearance. Preserve the actual situation/outcome perspective rather than copying this unrelated English definition.
  ko-nikl-24117-s001:
    source_korean: 전보다 훨씬 더.
    source_english: 'Much better than before. '
    authored_interpretation: much more than before
    rationale: The Korean expresses a greater degree than before, without requiring an improvement. The English better adds an unsupported positive direction to the comparison.
  ko-nikl-31953-s002:
    source_korean: 좋지 않거나 모자라는데 그것마저도.
    source_english: With disappointment over something when others are unsatisfactory or insufficient.
    authored_interpretation: even that, though it is already inadequate
    rationale: The Korean refers back to the already-poor or insufficient thing with 그것마저도. It does not introduce other unsatisfactory things as the English others suggests; the discourse perspective remains context-dependent.
