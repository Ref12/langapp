schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: coherent qualities and modifiers cohort; not complete-scale core coverage
scope:
  - Only qualities-vocabulary.yaml, qualities-identities.yaml, and this notes file are owned here.
  - All parent-approved selections through society and household, plus predicate403, are readable protected inputs.
  - Readable parent-owned everyday-predicates and interpretation proposals remain protected even when absent from the manifest.
  - Active nature files are not opened, inspected, or changed.
  - No source, reading, source-correction ledger, support-parent, manifest, shared-runtime, or earlier-cohort edits.
  - Prioritize useful new descriptive and modifier lemmas; do not broadly import remaining senses of previously selected native verbs.
  - Parent owns the separate procedural/action-verb cohort; qualities neither selects nor reserves submission, application, registration, cancellation, announcement, review, analysis, interpretation, or argument verbs.
  - Inspect actual bilingual positions before writing each placement; source bands, alphabetical order, and quotas do not determine teaching location.
  - Source-derived X하다 is eligible only when the complete predicate itself exists in the retained registry.
identity_policy:
  provisional_status: >
    Counts describe explicit source-anchored teaching candidates, not proven
    true lexemes. Report dictionary parents, selected senses, spellings,
    identity fragments, and net-new free candidates separately.
  fragment_contract: >
    An existing identity receives new members only, preserving its exact
    canonical lemma and category. Source-parent lists describe those new
    members, not the full protected identity.
  synonym_and_derivation_limits: >
    Similar English labels do not establish Korean variants. Independently
    sourced adjectives and adverbs require explicit boundary decisions;
    no automatic suffix stripping or noun-plus-hada synthesis establishes them.
  function_accounting: >
    Exhaustive coverage/distribution, degree, comparison, relation exclusion,
    normative expectation, and concessive/restrictive discourse uses below
    are conservatively function items. This is explicit accounting, not a
    claim that every Korean adverb is grammatical rather than lexical.
    Qualified review may refine these boundaries; no function item contributes
    to the stated new free-lemma breadth.
  function_identity_ids:
    - ko-lex-09319
    - ko-lex-11572
    - ko-lex-16818
    - ko-lex-34813
    - ko-lex-48637
    - ko-lex-03698
    - ko-lex-34053
    - ko-lex-42529
    - ko-lex-02224
    - ko-lex-09042
    - ko-lex-30252
    - ko-lex-16446
    - ko-lex-22665
    - ko-lex-24117
    - ko-lex-31953
    - ko-lex-32137
  bound_form_identity_ids: []
  mixed_range: >
    단순히 has the lexical manner of simplicity as well as restrictive
    merely. Retain one free candidate on the content-manner evidence; the
    restrictive sense adds neither a second identity nor extra breadth.
  existing_fragment: >
    ko-lex-43929 remains 차차, free-lemma. Only gradual-change s001 is
    added; protected later-without-rushing s002 remains untouched.
    The inspected general 간결하다 position is not added, since protected
    writing/speech conciseness already serves this cohort's immediate need.
  related_form_review: >
    Actually sourced pairs such as 새삼/새삼스럽다, 과감하다/과감히,
    아낌없다/아낌없이, 급하다/급히, and 온전하다/온전히 retain their
    explicit provisional boundaries. Similarity of form and source-parent
    independence alone prove neither synonymy nor true independent lexemes.
    Relationships to protected 꼼꼼하다, 꾸준히, 현저하다, 막연하다,
    솔직하다, and the parent-recovered accuracy/sincerity predicates need
    the same review; no unlisted conjugated surface form was generated.
  nonidentical_function_ranges: >
    지극하다 concerns sincere care/love, but 지극히 is an extreme-degree
    modifier. 끔찍하다 includes both dread and devotion, while selected
    끔찍이 is not restricted to affection. 한결 compares degree with before;
    한결같다 instead expresses temporal consistency or sameness across
    multiple people or things. Do not merge these by a substring rule.
  attested_particle_realization: >
    Source noun 억지 46634 describes obstinate insistence on forcing an
    unlikely outcome; the actually retained adverb 억지로 46636 describes
    unreasonable, forcible manner. Select only the adverb, but conservatively
    reserve one ko-lex-46634 family with canonical lemma 억지 rather than
    count a particle realization as a second free identity when the noun is
    later selected. This is a specific source-based decision, not a rule
    stripping 로 from words. No noun placement or noun identity member is
    introduced here.
curation_rationales:
  capability_and_evaluation: >
    Skill, intelligence, quick judgment, wisdom, immaturity, and foolish
    conduct are different judgments. Evaluative labels are not diagnoses
    or universally polite ways to address people.
  common_contrasts: >
    Preserve magnitude versus excellence, skill versus maturity, sensory
    dullness versus blunt edges, and oversensitivity versus a contentious
    public issue. Unselected positions remain in the unchanged source.
  argument_and_register: >
    Clear evidence, vague conception, subtle implications, decisive positions,
    perceived significance, excessive degree, no-relationship qualifications,
    and concession support different communicative tasks. Register-focused
    placements do not falsely claim an official formal/slang tag where the
    retained definition supplies none.
  perspective_and_degree: >
    Suspicion is not proof of wrongdoing; firmness is not necessarily
    aggression; confidence is not objective certainty. Retain apparent
    sincerity in 정성스럽다 and apparent effortlessness in 자연스럽다.
    Comparative 한결 does not guarantee improvement, and 못지않다 does not
    guarantee exact equality. Bare dictionary predicates, not hypothetical
    negative or polite realizations, supply the selected identities.
  courtesy_and_judgment: >
    버릇없다 explicitly concerns manners toward elders; 공손하다 includes
    humility. Cowardice, foolishness, moral badness, low worth, and cruel
    conduct remain disapproving judgments, not neutral clinical descriptions
    or recommendations for addressing people. Norms require situated teaching.
  bodily_conditions: >
    Mild potency, a severe illness, sensory dullness, oversensitivity, refreshed
    feelings, or relief are lexical meanings. They are not diagnoses, safety
    guarantees, or promises that a treatment or product will have those effects.
  adequate_vs_generous: >
    Enough food/clothing, ample resources, generosity of attitude, ungrudging
    willingness, and unfailing promises are not interchangeable. Preserve the
    pleasure in 기꺼이, lack of hesitation in 선뜻, and unreasonable force
    in 억지로 rather than reducing all three to neutral action speed.
integration:
  selection_files: >
    Parent may add qualities-vocabulary.yaml and qualities-identities.yaml
    to the corresponding manifest lists after validating the current union.
    Existing identity fragments contain new members only.
  source_corrections: >
    The requests below preserve exact bilingual originals, including trailing
    whitespace, and equal the authored labels. They are unreviewed requests
    for the parent-owned ledger, not official errata or source edits.
  readings: >
    The selected-parent queue uses the actual citation resolver. No reading
    is guessed, derived from spelling, or borrowed across homographs.
  validation_boundary: >
    Manifest-listed non-nature cohorts are checked read-only. Independently
    protect the readable interpretation and everyday-predicates proposals:
    their source IDs and shared identity keys are checked against qualities
    even when they are not registered. Active nature files remain unopened
    and must be included by the parent in any later full-union validation.
  explicitly_protected_proposals:
    - interpretation-vocabulary.yaml
    - interpretation-identities.yaml
    - everyday-predicates-vocabulary.yaml
    - everyday-predicates-identities.yaml
  reserved_abstract_positions: >
    Parent-owned interpretation selects abstract 윤곽 50562-s001, 반전
    39735-s003, and 여운 47153-s001, plus essence 정수 parent 14571
    rather than purification parent 14570. Qualities selects none of those
    families. This does not reserve their other physical positions away
    from the nature worker or alter any protected placement.
parent_reserved_recovery:
  - 정확하다
  - 공정하다
