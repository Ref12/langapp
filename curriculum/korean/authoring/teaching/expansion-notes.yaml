documented_group_decisions:
  ko-lex-43169:
    lemma: 진정
    category: free-lemma
    source_parents: [ko-nikl-43169, ko-nikl-43171]
    rationale: >
      The selected noun describes a sincere heart without falsehood, and the
      adverb describes acting sincerely without falsehood. Retain these
      nominal and adverbial sincerity uses in one conservative lexical base.
      The calming or soothing parent ko-nikl-43170 is semantically distinct.
      This is an authored category-alternation analysis requiring review,
      not proof of identity from matching spelling alone.
  ko-lex-43191:
    lemma: 진짜
    category: free-lemma
    source_parents: [ko-nikl-43191, ko-nikl-43192]
    rationale: >
      The genuine-article noun and the truly/without-pretense adverb share a
      genuineness lexical base. Preserve both source categories and selected
      meanings without counting the category alternation as another free lemma.
      This conservative teaching analysis is not an official variant crosswalk.
  ko-lex-52556:
    lemma: 흐리다
    category: free-lemma
    source_parents: [ko-nikl-52555, ko-nikl-52556]
    rationale: >
      The verb causes words, thought, atmosphere, or reputation to become
      obscured or impaired; the descriptive predicate denotes obscurity or
      cloudiness. Conservatively retain these related causative and stative
      uses in one clouding/obscuring lexical base. Preserve the source POS
      and grammatical distributions rather than claiming interchangeability
      or independently verified lexical unity.
  ko-lex-03509:
    lemma: 실제
    category: free-lemma
    source_parents: [ko-nikl-03509, ko-nikl-03510, ko-nikl-03511]
    rationale: >
      The noun 실제 denotes actual circumstances or facts; adverb 실제 and
      explicitly adverbial 실제로 retain that actual-versus-imagined meaning.
      Treat these selected nominal, adverbial, and case-marked uses as one
      conservative lexical base, not three free headwords. This is an authored
      grammatical-form analysis, not an official variant crosswalk.
  ko-lex-25705:
    lemma: 가리다
    category: free-lemma
    source_parents: [ko-nikl-25703, ko-nikl-25705]
    rationale: >
      The source distinguishes being hidden or blocked from causing something
      to be hidden or blocked. Preserve the intransitive/result and transitive
      roles while conservatively grouping this hiding/blocking lexical base.
      The selecting/discriminating 가리다 parent ko-nikl-25704 is distinct.
      Teacher review should confirm the lexical analysis; equal English is
      not the reason for merging the original positions.
  ko-lex-40170:
    lemma: 밝다
    category: free-lemma
    source_parents: [ko-nikl-40169, ko-nikl-40170]
    rationale: >
      Actional daybreak and descriptive brightness share a conservative
      brightness lexical base. Preserve verb versus descriptive-predicate
      categories and their different conjugational distributions. Cheerfulness,
      a positive outlook, and knowledge are separately selected source meanings,
      not newly invented metaphors or separately counted headwords.
  ko-lex-04150:
    lemma: 아마
    category: free-lemma
    source_parents: [ko-nikl-04151]
    rationale: >
      The original definition explicitly identifies 아마도 as an emphatic form
      of 아마. Add the selected emphatic source sense to the existing ko-lex-04150
      identity, preserving its base category and canonical lemma. The source
      parent ko-nikl-04150 and its original member remain in the base manifest.

