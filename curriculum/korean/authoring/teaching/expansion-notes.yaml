schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: substantial curated expansion; not complete-scale coverage

scope:
  - Only the three expansion files are authored here.
  - Base vocabulary, identities, corrections, grammar, sources, and readings are unchanged.
  - Placements and compact labels were authored after reading original bilingual senses.
  - Topic searches discovered candidates; they did not assign teaching levels or select senses.
  - Source bands, alphabetic order, source ordinals, and quotas never determine placement.
  - Every unselected source position remains available in the unchanged source registry.
  - Newly parent-selected essential-verb and bound 차 senses are not duplicated here.

integration:
  selection_manifest: >
    selection-files.yaml registers expansion-vocabulary.yaml and
    expansion-identities.yaml after the base and early files. The parent
    performs the actual strict composition; source IDs and existing identity
    memberships are preserved rather than overwritten.
  vocabulary: >
    Append expansion-vocabulary.yaml to the base explicit vocabulary list.
    Reject duplicate sense IDs rather than overwriting an existing placement.
  identities: >
    expansion-identities.yaml has the same exact five-field root mapping as
    the base manifest. New identity keys can be added directly. For an existing
    key, retain the same lemma and category, union members and source_parents,
    and retain both base and expansion rationales. Expansion records contain
    only expansion members, not duplicate copies of base memberships.
  existing_identity_extensions:
    ko-lex-04150: Adds the explicitly emphatic 아마도 source form, not a new free lemma.
    ko-lex-08065: Adds the embedded-object-base sense of 뿌리.
    ko-lex-11667: Adds reading signs, situations, and computer data to 읽다.
    ko-lex-32079: Adds the beautiful-scene metaphor of 그림.
    ko-lex-33312: Adds intensity and dense-darkness senses of 깊다.
  corrections: >
    The documented source-correction requests below are incorporated into the
    parent-owned correction ledger under its existing unreviewed interpretation
    contract. Their quoted original bilingual text remains unchanged.
  readings: >
    original_reading_gaps records the historical handoff, not current missing
    readings. All listed parents were subsequently resolved individually
    through official text or explicitly unreviewed authored readings.
    source-provenance.yaml and coverage.yaml report the current methods;
    unselected source gaps are not blockers.

curation_rationales:
  narration_and_process: >
    Distinguish the course, cause, occasion, beginning, and ending of an event.
    Select relevant senses of change verbs rather than their first position
    automatically: 진행 is ongoing activity, 틈틈이 is use of spare time,
    and 밝혀지다 concerns facts becoming known rather than lamps becoming bright.
  evidence_and_argument: >
    Differentiate an actual case, a clue, a guess, substantiation, a forecast,
    and a stated justification. Qualifying connectors and precise comparisons
    support extended argument without pretending that every added sense is
    additional lexical breadth.
  institutions_and_science: >
    General civic, economic, health, and scientific literacy remains core.
    Mathematical proof, optical focal points, exponents, rotational periods,
    machine engines, and specialist word formation are optional senses.
    Narrow source definitions of 연금 and 판사 are not broadened into universal
    claims about pensions or every category of judge.
  values_and_register: >
    Contrast conviction with distrust, confidence with arrogance, concession
    with coercion, and explanation with an evasive excuse. The actual sense
    of 황당하다 describes absurd words or actions; it is not relabeled as a
    person's surprise. Honorific meanings are selected as their own source
    senses, without adding conjugated surface forms as new lemmas.
  arts_and_interpretation: >
    Add plot construction, creative originality, performance, material and
    style, cultural inheritance, criticism, and narrative perspective.
    Interpretive meanings of 시선, 색채, 줄기, 무게, 이면, and 주류 are tied to
    their exact source positions, not invented figurative extensions.
  independent_projects: >
    Survey questions, records, charts, main text, referencing, planning,
    implementation, review of shortcomings, and application of knowledge
    form a usable independent-project vocabulary. These placements are
    authored project-context decisions, not source difficulty claims.
  everyday_tone_and_sensory_description: >
    Extend later reading and interpersonal language with awkwardness, familiarity,
    restraint, understatement, facial expression, sound, texture, and atmosphere.
    Physical senses are not automatically placed late: their later figurative
    uses are selected separately. 냉정하다 is the source's unaffectionate attitude,
    not an invented calm-and-rational sense. Smooth writing, dry prose, coarse
    speech, a bright outlook, and a dark mood retain their own source positions.
    Negative-polarity labels describe interpretation with a following predicate;
    they do not license inserting a negation into the original source record.
  public_information_and_privacy: >
    Add distinctions between editorials and reports, public announcements and
    personal notification, statements and allegations, leakage and forgery,
    and publicity and critical commentary. A general rumor is not automatically
    misinformation. The illegal-outflow meaning of 유출 is supported by the
    Korean definition and requires its own correction request. 설치 retains
    the source's equipment/facility sense rather than inventing a software-only
    definition; 가상 is a hypothetical situation, not a fabricated VR headword.
  native_verbs_for_extended_discourse: >
    Explicitly select revising text, handling a topic, giving reasons, adopting
    criticism, handing over duties, diverting a conversation, reviving memories,
    and describing complex relationships. 내다 is represented by particular
    publishing, submission, payment, time-making, and result senses, not by a
    blanket first-sense row or a generic English do. Unselected literal and
    specialized positions remain available in the raw registry.
  agency_care_and_judgment: >
    Add noticing versus discovering, mastering through practice versus becoming
    familiar, entrusting versus taking responsibility, conserving versus
    cherishing, and leading versus following. Figurative grasping, stretching,
    filtering, and reversal retain exact original positions. The source gives
    깨우치다 a causative explanation, so its label does not simply duplicate
    깨닫다. 뻗다's die/collapse position is explicitly marked slang.
  selection_restraint: >
    Unavailable requested concepts were left out. For example, the inspected
    개관 source referred to opening a venue, not a general overview; 대입
    referred to college entrance, not mathematical substitution; and 사유 was
    a reason, not philosophical contemplation. 소수 and 다수 mean few and many,
    not necessarily a statistical minority and majority. 유연하다 was not
    broadened from physical pliability into organizational adaptability.

identity_policy:
  naming: >
    ko-lex names are stable local identifiers anchored to retained CSV-record
    names. Neither these names nor ko-nikl source IDs are official NIKL IDs.
  default_authored_decision: >
    For each source parent independently inspected and explicitly selected,
    retain its selected semantic boundary as one provisional source-anchored
    teaching identity, except for the documented group decisions below.
    The full manifest mechanically enumerates these authored memberships,
    labels, source POS evidence, and homograph rationales. It does not make
    new curriculum selections or claim every source parent is a true lexeme.
  counting: >
    Report dictionary parents, selected senses, spellings, and provisional
    free-lemma identities separately. Polysemy, source category alternation,
    counters attached to a free noun, and emphatic or case-marked variants
    do not automatically add free-headword breadth.
  free_lemma: >
    Independently selected content nouns, predicates, lexical adverbs, and
    lexical -적 modifiers are provisional free-lemma candidates. The -적
    entries are actual selected source headwords, not generated suffix forms.
    Unselected nominal counterparts were not added merely to double counts.
    Related derivational families such as 비관/비관적 still need lexical-family
    review; their source entries alone do not prove exact true-lexeme breadth.
  bound_form: >
    여지 is the selected dependent noun for room or possibility. The source's
    explicit dependent-noun analysis supports its bound-form category.
    The selected counting uses of 조각 and 차례 remain members of their free
    lexical noun identities and do not create additional headwords.
  function_item: >
    The explicit roster below separates discourse connectives, focus and
    uncertainty operators, reciprocal/former reference, and quantity operators
    from free-lemma counting. This is a documented teaching-accounting decision,
    not a claim that source POS alone proves a universal closed-class taxonomy.
    Existing identity categories, including the base 아마 group, are preserved.
