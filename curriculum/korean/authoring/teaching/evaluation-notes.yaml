source_correction_requests:
  ko-nikl-30276-s001:
    source_korean: 현실적이지 않고 추상적인 경향을 가지는 것.
    source_english: Work that tends to be abstract or surreal, such as a conceptual poem or work of philosophy.
    authored_interpretation: something abstract rather than grounded in reality
    rationale: >
      The Korean nominal definition describes a general abstract/non-realistic
      tendency, not only a work of art, poem or philosophy. Preserve the
      general scope without importing the English artwork examples or
      equating non-realistic with a particular surrealist genre.
