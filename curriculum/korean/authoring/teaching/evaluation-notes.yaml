schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: selected support and readings resolved; linguistic review remains outstanding
scope: >
  Evaluating evidence, explaining criteria, synthesizing accounts, identifying
  viewpoints and describing acquired knowledge. Named concepts were looked up
  in the pinned CSV before each actual bilingual position was selected.
  Competing noun/adnominal lists and ambiguous homographs received separate
  inspection. There is no automatic first-sense, source-band or suffix import.
composition_snapshot:
  basis: committed manifest through rapport3d594d5; not live generated coverage
  selected_senses: 97
  core_senses: 96
  optional_technical_senses: 1
  source_parents: 75
  identity_fragments: 73
  new_pool_free_identities: 68
  new_core_free_identities: 69
  existing_fragments: 5
  additional_support_requests: 52
  core_transition: >
    General planning is the first core sense of 설계00006, whose engineering
    design sense was already optional technical. This adds core but not
    pool-wide breadth; the two route counts cannot be added together.
placement_policy: >
  Pulse, worry, direct experience and solution-seeking serve6-13; reporting,
  procedural announcements and plans serve14-18. Criteria, appraisal and
  quantitative methods support19-24. Nuanced intention, viewpoint, abstraction,
  criticism and interpretation support25-30. Experiential know-how is core15;
  specialized industrial know-how is an optional technical sense. No ordinary
  early item is moved later to improve phase counts.
family_adjudications:
  feelings_and_appraisal:
    existing_lexical_id: ko-lex-26576
    added_member: ko-nikl-26579-s001
    separate_appraisal_family: ko-lex-26581
    official_evidence:
      ko-nikl-26576: {official_entry_id: '17312', origin: 感情, pronunciation: '감ː정'}
      ko-nikl-26579: {official_entry_id: '15232', origin: 憾情, pronunciation: '감ː정'}
      ko-nikl-26581: {official_entry_id: '15235', origin: 鑑定, pronunciation: 감정}
    reasoning: >
      Conservatively count the specifically resentful/angry feeling with the
      existing general-emotion family, preserving the different original
      origin strings and IDs. This provisional subtype grouping is not proof
      that the official homograph distinction is invalid. Expert appraisal
      remains a genuinely different family, not another feeling.
  state_of_mind_and_examination:
    official_evidence:
      ko-nikl-03625: {official_entry_id: '66024', origin: 心思}
      ko-nikl-03628: {official_entry_id: '16442', origin: 審査}
    reasoning: >
      Feeling, obstructive resentment and intention belong to the first
      complete three-position list. Performance/quality examination belongs
      to the separate one-position list. Preserve both lexical identities.
  nominal_adnominal_pairs:
    - >
      감각적26424/26425 has the same ordered sensory-stimulating and
      sensory/sensitive meanings with nominal versus modifying endings.
      Four source positions and two POS records count as one free family.
    - >
      관념적30276/30277 similarly shares abstract/non-realistic meaning
      across actual noun/adnominal records. The noun English's restriction
      to artworks is separately corrected, not used to split the family.
  existing_depth:
    - General planning 설계00006 extends existing engineering design.
    - Harmful/troublesome 사고08175 extends accident, not deep thought08176.
    - Rough-estimate 통계21675 extends existing systematic statistical data without redefining it.
    - Fictional basis and visual subject 모델37406 extend existing prototype/exemplar/fashion uses.
source_boundaries:
  - >
    입지11905, 도식17921, 도식화17924 and 모형37556 are left entirely
    outside this cohort for infrastructure ownership. Physical 골격29504-s001
    is likewise outside this cohort; only abstract framework002 is selected.
  - >
    Facility opening 개관26945, venue leasing 대관16918, foreground
    전경13656, riot-police 전경13657 and ground-surface 지표42870 do not
    substitute for overview or indicators in evaluation lessons.
  - >
    Finger 인지11283 and human-wisdom11284 do not replace the intended
    cognition concept. Private-property 사유08472 and fear-pallor 사색08395
    are explicitly placed for their actual meanings, not as reasoning nouns.
  - >
    평정22892 is serenity, not an evaluation score or conquest22891.
    천명44509 is declaration, not fate/divine ordinance44508.
    구도30895 is composition/configuration, not truth-seeking30894.
  - >
    Physical dissection 해부24663-s001, mineral-vein 맥36748-s003 and
    feng-shui energy 맥36748-s004 remain unselected. Pulse005 does not
    create a medical assessment or instruction.
  - >
    잣대12762 has only the figurative criterion in this source; no missing
    physical measuring-rod position is manufactured. 모델 gains no
    unsupported mathematical or machine-learning sense.
usage_limits:
  - >
    숙달, 숙련, 전문성, 체득, 체험 and 총평 name proficiency,
    knowledge, experience or evaluation; they do not award any of the four
    mastery stages, transfer evidence across modalities, or establish
    professional or exam readiness.
  - >
    A criterion or identification can be mistaken. A reputation, favorable
    review or formal declaration is not evidence that the asserted claim is
    correct. Severe criticism is not necessarily reasoned criticism.
  - >
    The rough-estimate 통계001 is explicitly distinct from compiled
    statistical data002. Do not teach all statistics as rough guessing.
    Aggregation requires actual inputs; vocabulary knowledge does not
    validate a calculation or measurement procedure.
  - >
    Formal expressions of intention do not establish inner motive.
    심사002 can express obstructive resentment, whereas examination uses
    a different source family. 감정 appraisal requires the expert-assessment
    sense, not ordinary emotion or resentment.
  - >
    관념적 is abstract and not grounded in practical reality here, not
    restricted to poems/artworks and not a rule that abstraction is false.
    감각적 need not imply sexual content, aesthetic excellence or a diagnosis.
  - >
    Strategy/tactics and deciding outcomes are general reporting vocabulary,
    not operational military instruction. The literary/health contexts supply
    no violent procedure, clinical competence or diagnosis from appearance.
  - >
    Main importance 주요 is retained as the actual source content noun,
    not an invented adnominal parent, number or counter. Relative weight,
    best plans and second-best plans depend on stated criteria and context.
