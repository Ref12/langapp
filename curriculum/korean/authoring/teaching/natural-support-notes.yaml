placement_policy: >
  Pollen, radii and the millilitre unit support ordinary descriptions at 6;
  frost, windblown snow, hail, mudflats, fins and horizon support outdoor
  understanding at 7. General error supports work at 15; wetlands, habitats
  and water resources support environmental explanation at 17. Numerator
  and measurement error support quantitative reasoning at 19. Named
  scientific concepts support accessible reading at 21. No placement is
  derived from record order, missing-reference status, or a phase quota.
