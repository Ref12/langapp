source_correction_requests:
  ko-nikl-21387-s001:
    source_korean: 태양과 그것을 중심으로 돌고 있는 지구를 비롯한 천체의 집합.
    source_english: The sun and its group of planets, including the Earth, that go around the sun.
    authored_interpretation: the solar system
    rationale: Korean 천체 includes celestial bodies rather than restricting the group to planets; preserve the ordinary system term without the narrower English restriction.
  ko-nikl-42880-s001:
    source_korean: 땅속에 고여 있는 물.
    source_english: 'Stagnant water that is under the ground. '
    authored_interpretation: groundwater
    rationale: English stagnant adds an immobility implication to underground collected water; the term must not teach that all groundwater is motionless.
source_wording_limits:
  - >
    The atom and molecule definitions are short dictionary accounts, not
    interchangeable units or complete chemical definitions. In particular,
    atoms need not retain the properties of every compound or bulk substance.
  - >
    A planet is not defined completely by the short orbital description;
    a constellation's apparent pattern does not establish physical proximity
    or astrological influence. No scientific competency is awarded.
  - >
    The green-plant photosynthesis example does not exhaust organisms or
    pathways. Pollen does not establish a personal allergy diagnosis.
    Fin reference does not say every aquatic animal has fins.
  - >
    Wetland and ocean-current descriptions do not establish permanent
    wetness or invariant current speed. The hail definition is not a complete
    formation model. A mudflat label does not establish safe walking access.
  - >
    Purification does not certify drinking safety, and solution vocabulary
    supplies no mixing instructions. Units imply no medical dose, conversion
    table, calibration standard or measurement uncertainty model.
