scope:
  - Receive an arrival, visit for a task, and distinguish bringing back from taking away.
  - Describe following, passing, a detour, an exit and a blocked movement.
  - Distinguish holding, placing, dropping, giving, returning and dropping a passenger off.
  - Narrate a changed situation, restored state, standing result, changed rank or turn coming around.
selection_policy: >-
  This is a bounded gap-based addition, not a motion-verb dictionary, a
  noun/predicate catalogue or a quota. Complete original positions of selected
  parents were inspected, alongside protected counterparts and named leads.
  Existing semantic coverage is deliberately reused. No source-order,
  source-band, spelling or automatic first-sense rule assigns teaching levels.
  Parent owns source admission, pronunciation, corrections-ledger integration,
  the manifest, generated outputs and every previously handed-back cohort.
