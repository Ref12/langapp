placement_rationale:
  first_exchanges: >-
    Physical money/object handover supports payment at3. Going versus coming
    to meet someone or perform a task supports arrangements at4. These
    source-listed compounds do not themselves choose a polite ending.
  ordinary_help_services_and_routes: >-
    Putting down a held object, pulling it out, placing it outside and serving
    food support household help at5. Presenting an item visibly, retrieving
    and carrying it away/back, giving it back and explaining an omission
    support services at6. An illness improving is ordinary care reporting,
    not medical assessment. Following, passing, an exit, detours and passenger
    drop-off support route arrangements at7 without granting permission.
  relationships_and_responsibilities: >-
    Receiving arrivals, family admission, initiating an exchange, turns and
    rank changes support work/relationships at8. No predicate inherently
    supplies subject honorification, humble reference or listener politeness;
    an institutional rank change is not automatically a polite personal request.
  narrative_and_procedural_frames: >-
    Standing after ascending/descending, reversing direction, dropping and
    losing, leaving a crowd and a situation changing support narration at9.
    Coerced movement is described, not recommended. Causing a state, restoring
    an earlier state and letting a confined participant move freely support
    participant/causation contrasts at11.
  explanations_and_problems: >-
    A familiar impression and outcomes departing from expectations support
    reasons/choices at13. A caught/blocked movement and the appearance of a
    sought helper/item support unfamiliar problems at14. Handing over an
    occupied/possessed resource and no longer doing assigned work support
    negotiated responsibility at15, not unilateral authority. No late-level
    bucket is added merely because an English label sounds abstract.
