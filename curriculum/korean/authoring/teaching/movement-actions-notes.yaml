    decision: Climbing/descending and then standing has a resultant-posture restriction absent from generic ascent/descent. The same selected families carry rank extensions, not extra independent-family credits.
valency_and_source_boundaries:
  - 찾아오다 is coming toward the contextual reference point; 찾아가다 is going. Neither must be mechanically equated with movement toward or away from the current speaker in every narrative.
  - Their retrieval positions concern things lost, entrusted or lent; carrying back/away does not mean picking up any arbitrary new item.
  - 빠뜨리다1/2 causes entry into a place/state; 빠뜨리다3 loses an item by dropping it; position4 is omission or failure to include what is needed, not automatically an intentional act or an all-purpose forget verb.
  - 내놓다4 permits a previously confined participant to move outside; 끌어내다2 forces a participant out. Neither is an instruction to restrain or force someone, and neither establishes legal authority.
  - 거치다1 is being caught or blocked, not blocking another participant or undergoing the already covered inspection process.
  - 돌아서다3/4 changes a situation or an illness intransitively; 되돌리다2 makes a target return to an earlier state. Change does not entail restoration, and restoration does not entail improvement.
  - 벗어나다5 states cessation of assigned/required work; it does not specify permission, lawful release, dismissal or blame. Leaving a group/crowd does not automatically mean formally resigning from an institution.
  - 올라서다/내려서다 rank uses do not specify who caused a promotion/demotion. Their physical standing results should not be discarded in favor of generic go up/down glosses.
  - 내려놓다 has only physical placement, moving lower and passenger transport in this source parent. No psychological letting-go sense is invented; protected 놓다 already has an actual worry-release position.
  - 건네다2 addresses another person with words. It does not by itself mean reporting what a third person said or guaranteeing a reply.
source_correction_requests:
  ko-nikl-44266-s002:
    source_korean: 잃어버리거나 맡기거나 빌려주었던 것을 돌려받아서 가지고 가다.
    source_english: To take back something that was lost, lent, or entrusted.
    authored_interpretation: to retrieve a lost, lent or entrusted item and take it away
    rationale: The English omits 가지고 가다; preserve the lost/lent/entrusted object condition and retrieval followed by carrying away, contrasted with carrying back in 찾아오다2.
  ko-nikl-44274-s001:
    source_korean: 사람을 만나거나 어떤 일을 하러 오다.
    source_english: To go to a place to meet someone or do something.
    authored_interpretation: to come to meet someone or do something
    rationale: Source 오다 is coming, not the English go. Preserve the contextual deictic contrast rather than copying the identical-looking visit frame from 찾아가다.
  ko-nikl-44274-s002:
    source_korean: 잃어버리거나 맡기거나 빌려주었던 것을 돌려받아서 가지고 오다.
    source_english: To take back something that was lost, lent, or entrusted.
    authored_interpretation: to retrieve a lost, lent or entrusted item and bring it back
    rationale: The English omits 가지고 오다; preserve the lost/lent/entrusted object condition and retrieval with carrying back. Identical English does not collapse this into 찾아가다2.
  ko-nikl-16017-s003:
    source_korean: 익숙하고 친근하게 느끼게 하다.
    source_english: To make someone feel familiar and friendly.
    authored_interpretation: to give a familiar and friendly impression
    rationale: Authored role-clarification rather than a claimed typographical error; 느끼게 하다 concerns the caused impression. Do not describe the experiencer themselves as familiar/friendly or assert an actual friendship.
