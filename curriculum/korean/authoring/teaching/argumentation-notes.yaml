schema_version: 1
id: ko-argumentation-noun-cohort
review_status: original-ai-authored-unreviewed
completion_status: parent-integrated-qualified-review-pending
review_requirement: >-
  All selections, placements, labels, family decisions and correction proposals
  are original AI-authored work requiring qualified Korean linguistic and
  pedagogical review. Source descriptions of reasoning and perception are
  not scientific findings, proof of an argument's validity, mental-health
  diagnoses or evidence of learner competence. Structural validation is not
  linguistic approval, verified pronunciation, audio assessment or exam readiness.
scope:
  - Identify reasons, examples, essentials, methods and the course of an explanation.
  - Distinguish circumstances, intentions, experience and traces of action.
  - Read common nonliteral nouns for links, outcomes, trajectories and stance.
  - Distinguish substantive content, outward presentation, conjecture and evidence.
selection_policy: >-
  Targeted communicative gaps were checked against live selections and complete
  bilingual source positions. No source-band, alphabetical, first-sense or
  numeric-quota rule assigns a level. Neither a catalogue of noun/predicate
  counterparts nor systematic actor, 성, 적, philosophical or mathematical
  terminology is added. Actual nominal meanings are selected, not invented
  meanings for plausible spellings. Concrete arts, performance, recreation,
  food and material-object positions remain outside this cohort. This is a
  bounded addition, not an exhaustive audit of unselected source material.
