  status: >-
    Actual in-memory composition through the repository selection and identity
    helpers against the complete live manifest. Parent additions are observed
    read-only, rather than relying on the assignment's earlier baseline.
    Registration, source expansion, pronunciation integration and generated
    teaching views remain parent work.
placement_rationale:
  study_and_ordinary_explanation: >-
    Examples, regular forms, basics, groundwork, main points, listed details
    and personal background support study/work at 8. Ordinary causes, achieved
    results, gaps in an activity history and a complete course of events
    support narration at 9. These common meanings are not deferred solely
    because their source band is advanced.
  feelings_processes_and_choices: >-
    Felt interpersonal distance, outward expression and anticipatory feelings
    support 10. Methods, experienced know-how, ordinary work progress, elapsed
    time, example-giving and task mindset support 11. Origins and a matter's
    progress support reported explanation at 12. Imagined scenarios, intentions,
    surrounding conditions, practical means, some merit in a point, comparison
    and unobvious benefits support choices and reasons at 13.
  problems_and_cooperation: >-
    A developing situation and its crucial/difficult point support unfamiliar
    problems at 14. Figurative links and a central leading role support
    cooperative explanation at 15. A figurative product of a process supports
    accessible public explanation at 17; handling/planning skill supports
    negotiation at 18.
  evidence_and_interpretation: >-
    Prototypes, substantive content, a pre-established task formula, comparative
    gaps, omissions, hidden aspects, outward circumstances, action traces and
    intuitive or suggestive impressions support evidence assessment at 19.
    Role-appropriate duty and firm convictions support discussion of values at
    22 without establishing legal obligations or truth. Surface-only presentation
    and unrealistic thinking support qualified argument at 23. The source's
    negatively characterised careless shortcut and deliberately deceptive
    personal front warrant stance/register work at 25. No extra 26-30 items
    are added just to enlarge a late-level bucket.
identity_policy: >-
  Preserve every protected canonical name, category, ID, member and placement.
  Existing fragments contain only new members and their exact parents.
  In particular, retain 감사하다26499/free-lemma, 실상03447/function-item,
  좀41331/function-item including its 조금 variants, and 중재하다42264/free-lemma.
  Do not recreate retired keys26491,03445 or42260. Parent owns cross-scope
  family adjudication. Same spelling is not enough to merge homographs, and
  similar English is not enough to merge different lexical forms.
existing_fragments:
  - {identity: ko-lex-06935, lemma: 분위기, category: free-lemma, members: [ko-nikl-06935-s002], reason: Add surrounding conditions without replacing mood/atmosphere meanings.}
  - {identity: ko-lex-17921, lemma: 도식, category: free-lemma, members: [ko-nikl-17921-s002], reason: Add the ready-made task formula without duplicating the diagram or diagramming positions.}
  - {identity: ko-lex-23221, lemma: 표본, category: free-lemma, members: [ko-nikl-23221-s001], reason: Add a general model/example rather than another specimen or statistical-data position.}
  - {identity: ko-lex-27398, lemma: 거리, category: free-lemma, members: [ko-nikl-27398-s003, ko-nikl-27398-s004], reason: Add felt interpersonal distance and comparative difference.}
  - {identity: ko-lex-33215, lemma: 길, category: free-lemma, members: [ko-nikl-33215-s004, ko-nikl-33215-s006], reason: Add development/life course and role-appropriate duty.}
  - {identity: ko-lex-42214, lemma: 중심, category: free-lemma, members: [ko-nikl-42214-s003], reason: Add firmly held personal opinions without replacing physical centre or essential core.}
