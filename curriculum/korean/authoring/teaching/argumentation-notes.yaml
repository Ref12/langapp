source_correction_proposals:
  ko-nikl-01091-s001:
    source_korean: "마음속으로 세우는 계획."
    source_english: "Secretly harbored plans."
    authored_interpretation: a plan formed in one's mind
    rationale: >-
      Korean locates the plan in the mind; it does not explicitly require
      deliberate secrecy. Avoid adding concealed or malicious intent to every
      instance. This conservative interpretation requires qualified Korean review.
  ko-nikl-48983-s001:
    source_korean: "가장 중요하고 핵심이 되는 줄거리."
    source_english: "The most important and central plot."
    authored_interpretation: the central gist or main point
    rationale: >-
      줄거리 here supplies central content or gist. English plot can
      misleadingly confine the definition to a fictional narrative; retain
      the general explanatory main point, subject to qualified Korean review.
  ko-nikl-47942-s001:
    source_korean: "무슨 일이 생길 것 같은 느낌."
    source_english: "A feeling that something is about to happen. "
    authored_interpretation: a feeling that something may happen
    rationale: >-
      Korean does not specify the imminence suggested by about to. Preserve
      anticipatory feeling rather than timing certainty, verified prediction
      or supernatural knowledge. Qualified review remains required.
source_boundaries:
  - ids: [ko-nikl-02744-s002, ko-nikl-51834-s001]
    issue: >-
      A hypothetical scenario is not an observed event or a forecast. 환상
      explicitly describes an unrealistic or impossible fancy in this source;
      it is not every imaginative exercise, a fantasy-fiction genre or a
      clinical hallucination diagnosis.
  - ids: [ko-nikl-05695-s001, ko-nikl-14076-s001, ko-nikl-23221-s001, ko-nikl-48032-s001]
    issue: >-
      An illustrative example, a type's best representative case, something
      usable as a model, and the act of giving an example have different roles.
      None automatically constitutes a representative statistical sample or
      proves a general claim. 예시 is an act, not an invented source position
      for a particular printed example object.
  - ids: [ko-nikl-01709-s001, ko-nikl-01864-s001, ko-nikl-48983-s002, ko-nikl-48983-s003]
    issue: >-
      A method is not inherently criminal. Planning/handling skill is not a
      certification. Experience-derived know-how differs from the explicitly
      shallow, careless shortcut in 요령 position3; do not present the latter
      as unqualified efficiency or professional best practice.
  - ids: [ko-nikl-08305-s001, ko-nikl-11453-s001, ko-nikl-17830-s001, ko-nikl-33215-s006]
    issue: >-
      A coherent account, some merit in a point, ethical conduct and duty
      appropriate to a role are not interchangeable with formal proof or
      current law. 일리 expressly allows limited, qualified reasonableness;
      it is not complete agreement or certainty.
  - ids: [ko-nikl-03455-s001, ko-nikl-03455-s002, ko-nikl-23061-s002, ko-nikl-48899-s002]
    issue: >-
      Core substance, actual unobvious benefits, surface-only presentation and
      apparent circumstances are distinct. Benefits need not be financial.
      Outward circumstances are not automatically company turnover, and
      superficial presentation is not by itself proof of criminal deception.
  - ids: [ko-nikl-06935-s002, ko-nikl-08591-s001, ko-nikl-40733-s002, ko-nikl-43118-s001]
    issue: >-
      Surrounding conditions need not be a felt mood. 사태 is not inherently
      a catastrophe. An unexposed aspect does not establish a mastermind or
      conspiracy. Naming the true state 진상 does not verify an account,
      and this source does not supply a slang difficult-customer sense.
  - ids: [ko-nikl-10415-s001, ko-nikl-10617-s001, ko-nikl-10617-s002, ko-nikl-24850-s001]
    issue: >-
      An inclination is not a commitment or outcome. Personal history and
      accumulated practical wisdom do not establish expertise or credibility.
      A trace of an action is not automatically a trace of misconduct; the
      separate bad-behaviour position of 행적 is not selected.
  - ids: [ko-nikl-27398-s003, ko-nikl-27398-s004, ko-nikl-32893-s001, ko-nikl-32893-s002, ko-nikl-42929-s001]
    issue: >-
      Felt closeness and comparative difference are not physical distances
      with implied numerical units. Outward expression is not mind-reading.
      Suggestive cues and immediate intuitive grasp are not guaranteed truth
      or validated predictions, regardless of a speaker's confidence.
  - ids: [ko-nikl-28191-s002, ko-nikl-08707-s002, ko-nikl-28963-s002, ko-nikl-42214-s003]
    issue: >-
      결실 characterises an achieved result as worthwhile; a figurative 산물
      need not be beneficial. A linking 고리 does not prove a causal chain.
      Firmness of a personal opinion does not make it correct or justified.
  - ids: [ko-nikl-29779-s003, ko-nikl-29779-s004, ko-nikl-31698-s002, ko-nikl-28338-s003]
    issue: >-
      A gap in a person's history need not be unemployment or evidence of
      misconduct. A gap in a matter is not a physical chasm. A normal course
      of work does not imply a physical orbit or guarantee success; a
      progress account need not show that progress was good.
