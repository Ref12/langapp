count_interpretation: >-
  There are 45 proposed new independent families, not 62 new words.
  Their 54 senses include nine additional meanings beyond one per family.
  Another eight senses extend six already protected families. Thus 17 of the
  additions are sense depth rather than globally new families. This arithmetic
  does not choose a first dictionary position or assign teaching order.
  The protected 표본 family previously appeared only in the scientific branch;
  its actual general model/example position now supplies a first core use,
  making additional core free coverage 46. No protected row moves. Pending
  support requests contribute to none of these active counts. All family
  counts remain provisional, not verified true-lexeme or mastery totals.
