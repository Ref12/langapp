count_interpretation: >-
  These are inventory measures, not achieved knowledge. Six existing fragments
  exceed the two reused source parents because newly introduced naming forms
  also join protected families. No existing branch-only identity gains its
  first core use; globally new provisional free groups and additional core
  free coverage both total 83. The support handoff history below is excluded
  from these107 counts; active support has its own29-sense cohort with two
  additional source-backed proposals held for pronunciation review.
  No advanced-level or branch
  padding is used to hide the larger program's remaining breadth shortfall.
