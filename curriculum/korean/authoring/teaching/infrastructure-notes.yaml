schema_version: 1
id: ko-infrastructure-noun-cohort
review_status: original-ai-authored-unreviewed
completion_status: all107 senses supported and integrated; qualified review remains outstanding
review_requirement: >-
  All selections, placements, labels, groupings and correction proposals are
  original AI-authored work requiring qualified Korean linguistic and
  pedagogical review. Technical explanations additionally require appropriate
  domain review. Structural validation is not linguistic approval, pronunciation
  verification, audio evidence, learner mastery or an examination qualification.
scope:
  - Identify rooms, shared spaces, entrances and ordinary building components.
  - Use public facilities and explain utility or maintenance problems.
  - Participate through Internet identities, messages and visible interfaces.
  - Name ordinary devices and explain their parts, operation and resources.
selection_policy: >-
  Targeted domain questions led to inspection of individual original Korean
  and English definition positions. Source bands, alphabetical order, first
  positions and numerical targets did not determine selection or level.
  New common headword breadth takes priority over adding every meaning to a
  few polysemous parents. This bounded domain selection is not an exhaustive
  inventory of unselected source nouns. No predicate, source entry, pronunciation
  or software-specific meaning has been generated from a plausible spelling.
  Action nouns are actual noun records, not newly generated verbs.
