  status: >-
    Actual in-memory composition through the repository selection and identity
    helpers. No manifest registration, reading integration or generated view
    is claimed. Parent may subsequently add other cohorts.
  protected_identity_adjustments: >-
    Preserve the noun/adverb 실상 family under ko-lex-03447/function-item;
    retired free key ko-lex-03445 remains absent. Preserve gratitude noun26491
    under ko-lex-26499, canonical 감사하다/free-lemma, without recreating
    retired ko-lex-26491 or merging the unrelated audit meaning.
placement_rationale:
  household_help: >-
    At 5, ask about the floor, bedroom, shared space, gate, yard, storage,
    mailbox, telephone, heater, water supply and ordinary devices. Building
    numbering belongs here because apartment-block identification is practical;
    it does not wait for an advanced counting lesson.
  services_and_travel: >-
    At 6, recognise emergency exits, lifts, escalators, public telephones,
    rest areas, civil-service locations, service users and itemised charges.
    At 7, locate a city centre, square, lane, upper floor, construction site
    or tunnel and describe a photograph-taking camera. Source-framed countryside
    and outskirts descriptions remain qualified rather than silently broadened.
  participation_and_study: >-
    At 8, identify a user ID, site, reply, computer window, live chat, recorded
    images, ordered table, laptop, screen, microphone, earphones and copier.
    The computer-specific system position supports practical device use before
    general system structure at 17. Sound-playing equipment enters at 5,
    before the broadcast sound/image distinction at 8.
  explaining_operations: >-
    At 11, explain equipping, operation, inspection, replacement, consumption,
    maintenance and the support provided by a post. 설정 remains the generic
    act of establishing something new, not an asserted software-settings screen.
    Drainage problems, electrical leakage and restoring facilities support
    unfamiliar-problem communication at 14, not do-it-yourself repair advice.
  public_explanation: >-
    A common opportunity to communicate or cooperate supports 15. New
    construction supports ordinary news at 16. Built structures, regional
    land, power generation, general systems and means to a goal support
    accessible explanations at 17. There is no invented need to move basic
    infrastructure to levels 19-30 merely to enlarge later phases.
identity_policy: >-
  All protected canonical names, keys, categories, members and placements
  remain unchanged. Fragments contain only newly selected members and their
  exact parents. The canonical spelling may come from the protected family.
  Same spelling does not merge homographs; similar English does not automatically
  merge different lexical forms. These are conservative, reviewable proposals,
  not an official source-family crosswalk or verified true-lexeme count.
identity_evidence:
  email:
    identity: ko-lex-10691
    protected:
      id: ko-nikl-10691-s001
      target: 이메일
      source_korean: "인터넷이나 통신망으로 주고받는 편지."
      source_english: "Letters exchanged through the Internet or a communications network."
    new:
      id: ko-nikl-37089-s001
      target: 메일
      source_korean: "인터넷이나 통신망으로 주고받는 편지."
      source_english: "A letter sent and received through the Internet or other forms of computer networks."
    rationale: The shorter loan name shares the identical Korean definition; it adds no new free email identity.
  telephone:
    identity: ko-lex-14080
    protected:
      id: ko-nikl-14080-s002
      target: 전화
      source_korean: "말소리를 전파나 전류로 바꿔 보내 멀리 떨어져 있는 사람이 서로 이야기할 수 있게 만든 기계."
      source_english: "A device that turns voice into an electric wave or current to allow people who are far away from each other to communicate."
    new:
      id: ko-nikl-14081-s001
      target: 전화기
      source_korean: "말소리를 전파나 전류로 보내 멀리 떨어져 있는 사람이 서로 이야기할 수 있게 만든 기계."
      source_english: "A device that turns voice into electric waves or currents to allow people far away from each other to have a conversation."
    rationale: The device-explicit name joins an already selected device meaning, not merely the act of calling.
  windows:
    identity: ko-lex-44202
    protected:
      id: ko-nikl-44202-s001
      target: 창문
      source_korean: "공기나 햇빛이 들어올 수 있도록 벽이나 지붕에 만들어 놓은 문."
      source_english: "An opening in the wall or roof made to let in air or light."
    shorter:
      id: ko-nikl-44169-s001
      target: 창
      source_korean: "공기나 햇빛이 들어올 수 있도록 벽이나 지붕에 만들어 놓은 문."
      source_english: "An opening in the wall or roof made to let in air or light."
    glass_focused:
      id: ko-nikl-50211-s001
      target: 유리창
      source_korean: "유리를 끼워 만든 창."
      source_english: "A window made by inserting glass."
    rationale: >-
      Count the identical shorter name and glass-focused subtype conservatively
      with the protected window family. The actual computer-window position
      44169-s002 extends 창; this does not license calling a physical 창문 a
      computer window in every context or stripping material modifiers globally.
  room_floor:
    identity: ko-lex-39329
    protected:
      id: ko-nikl-39329-s004
      target: 바닥
      source_korean: "건물 내부의 아래 부분."
      source_english: "The bottom part of a building's inside space."
    new:
      id: ko-nikl-40341-s001
      target: 방바닥
      source_korean: "방의 바닥."
      source_english: "The floor of a room."
    rationale: The room-specific name adds interior-floor reference without another free identity.
  vacant_ground:
    identity: ko-lex-21437
    broader:
      id: ko-nikl-21437-s002
      target: 터
      source_korean: "집이나 밭 등이 없는 빈 땅."
      source_english: "Empty land without houses, fields, etc."
    vacancy_focused:
      id: ko-nikl-30015-s001
      target: 공터
      source_korean: "집이나 밭 등이 없는 빈 땅."
      source_english: "Empty land without houses, fields, etc."
    rationale: Identical bilingual vacant-ground definitions support one explicit site family, not two free counts.
  non_mergers:
    - >-
      Administrative 동18300 is free; building-counting 동18302 is bound.
      Neither is directional 동18298. Shared spelling is not family evidence.
    - >-
      Lift 승강기 and protected 엘리베이터 are different lexical forms, not
      a longer/shorter shared stem. Their shared function alone is insufficient
      for a spelling-family merger. Likewise 작동/가동 and 사용자/이용자
      retain separate provisional word candidates despite overlapping English.
    - >-
      Garden 정원14623 is not capacity 정원14622; electrical 전원13954 is
      not all-members 전원13953; ordered-information 표23186 is not
      ticket/vote 표23187; water 수도01586 is not a capital or spiritual practice.
    - >-
      수화기 is the listening component rather than the whole telephone.
      공중전화 names the specifically public coin/card installation. Different
      referents are not all collapsed just because their names contain 전화.
source_correction_requests:
  ko-nikl-02600-s001:
    source_korean: "동력을 이용하여 사람이나 짐을 위아래로 나르는 장치."
    source_english: "An installation that conveys people or freight up and down, using electric power."
    authored_interpretation: a powered lift for people or goods
    rationale: >-
      동력 specifies motive power generally; the English narrows it to electric
      power. Preserve the powered lifting function without teaching an exclusive
      drive mechanism. Qualified Korean review is required.
  ko-nikl-10855-s001:
    source_korean: "귀에 꽂아서 기계에서 나오는 소리를 듣는 작은 장치."
    source_english: "A little device that a person inserts over his/her ears to listen to the sounds coming from a machine. "
    authored_interpretation: earphones inserted into the ears
    rationale: >-
      귀에 꽂아서 places the device into the ear, not over it. The source's
      English wording should not turn these into over-ear headphones. This
      original interpretation requires qualified Korean review.
  ko-nikl-35915-s001:
    source_korean: "소리를 전류로 바꾸어 소리가 크게 나게 하는 기계."
    source_english: "A machine that changes sound into electric currents to make the sound louder."
    authored_interpretation: a microphone converting sound into electrical signals
    rationale: >-
      Retain sound-to-electrical conversion while avoiding the inference that
      the microphone alone is the amplifier or loudspeaker. The source
      compresses several sound-system roles; this clarification requires
      qualified Korean and relevant technical review.
source_boundaries_and_review:
  - ids: [ko-nikl-02710-s001, ko-nikl-30691-s001]
    issue: >-
      The source frames countryside as thinly populated and less developed,
      and outskirts as quiet and unhurried. Labels retain those qualifiers,
      but neither is a universal social or geographical fact. Review modern
      usage and avoid ranking rural residents or places as inferior.
  - ids: [ko-nikl-07772-s001, ko-nikl-35807-s001, ko-nikl-49583-s001]
    issue: >-
      Preserve Western-style high-rise office use, a traditional raised wooden
      hanok platform, and a woven grass/wood boundary fence respectively.
      Do not silently turn them into every building, floor or fence.
  - ids: [ko-nikl-18300-s001, ko-nikl-18300-s002]
    issue: >-
      District and district office are both actually supplied. The source's
      administrative hierarchy and office naming are not current municipal
      legal guidance; do not invent present-day office titles or functions.
  - ids: [ko-nikl-00074-s001, ko-nikl-34990-s001, ko-nikl-51540-s001]
    issue: >-
      설정 supplies establishing something new, not a settings panel. 내역
      supplies itemised goods/expenses, not browser history. 홈페이지 supplies
      an Internet-viewable document, not only the first page of a site.
  - ids: [ko-nikl-07493-s001, ko-nikl-48159-s001, ko-nikl-48159-s002]
    issue: >-
      비디오 here contrasts television images with sound. Its unselected
      tape and tape-player positions are not modern video files or streaming
      players. 오디오 distinguishes sound and listening equipment; no codec,
      file-format or digital-audio position is invented.
  - ids: [ko-nikl-04251-s001, ko-nikl-52494-s001, ko-nikl-49428-s001]
    issue: >-
      A user ID is not an account or password. 휴지통 is only a physical
      wastebasket here, and 우편함 is an attached physical receiving box, not
      automatically a recycle-bin interface or email inbox.
  - ids: [ko-nikl-49414-s001, ko-nikl-49428-s001]
    issue: >-
      우체통 says a box for putting mail in; unlike 우편함 it does not
      explicitly specify receiving. Do not overread that as an exclusive
      outgoing-mail condition. Both selected positions describe physical boxes.
  - ids: [ko-nikl-35557-s001, ko-nikl-37399-s001, ko-nikl-22617-s001]
    issue: >-
      노트북 is a laptop, not a paper notebook. 모니터 supplies a screen;
      reviewer/product-testing positions do not supply technical monitoring.
      The complete 팩스 definition explicitly includes both the method over
      telephone lines and the machine, so retaining both is source-backed.
  - ids: [ko-nikl-14572-s001, ko-nikl-25885-s001, ko-nikl-27652-s001, ko-nikl-15402-s001]
    issue: >-
      Water filtration is not a potability guarantee. A humidifier is not
      prescribed treatment. The battery position does not specify chemistry,
      rechargeability or compatibility. Electrical leakage vocabulary supports
      reporting a problem, not diagnosis, live-circuit work or repair steps.
  - ids: [ko-nikl-21813-s001, ko-nikl-35126-s001, ko-nikl-52463-s001]
    issue: >-
      통풍 is ventilation rather than gout. 냉수 is a water noun relevant to
      fixture labels, not a clinical recommendation or new food preparation.
      휴게실 is a place to rest rather than a toilet inferred from restroom.
registered_position_handoff_history:
  - id: ko-nikl-04470-s001
    target: 안방
    source_korean: "한 집안의 안주인이 지내는 방."
    source_english: "inner room; master bedroom; women's quarters: The room of a house where its hostess stays."
    reason: >-
      The retained definition is gendered and narrower than an unqualified
      modern main bedroom. Do not silently modernise it or push a common
      word to a late phase to conceal the mismatch. 침실 supplies a supported
      early sleeping-room term; current 안방 use needs qualified adjudication.
  - id: ko-nikl-00180-s001
    target: 성능
    source_korean: "기계 등이 지닌 성질이나 기능."
    source_english: "The quality or functions of a machine, etc."
    reason: Machine performance/capability overlaps the separately owned qualities scope; no selection or category change is made here.
  - id: ko-nikl-29364-s002
    target: 고층
    source_korean: "건물의 층수가 많은 것."
    source_english: "A state in which a building consists of a great number of floors. "
    reason: >-
      The tall-building property is not selected alongside upper-floor location.
      A later accepted noun counterpart can reuse ko-lex-29364/free-lemma with
      only this additional member, subject to the parent's scope adjudication.
