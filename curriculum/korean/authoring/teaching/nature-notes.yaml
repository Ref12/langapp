schema_version: 1
id: ko-nature-noun-cohort
review_status: original-ai-authored-unreviewed
completion_status: source-backed-selections-integrated-qualified-review-pending
review_requirement: >-
  Every selection, placement, label, identity decision, and correction proposal
  is original AI-authored work requiring qualified Korean linguistic and
  pedagogical review. Scientific terminology and questionable source statements
  additionally require appropriate domain review. Structural checks are not
  approval of usage, scientific facts, or pronunciation.
scope:
  - Understand ordinary weather and plan seasonal activities.
  - Describe natural terrain, water, vegetation, and observable living things.
  - Discuss environmental conditions, resources, and accessible science.
  - Read ordinary measurements, comparisons, and physical descriptions.
  - Interpret selected common natural imagery without importing every figurative position.
selection_policy: >-
  Targeted communicative-domain discovery was followed by individual inspection
  of original Korean and English source positions. Neither source order,
  dictionary band, part of speech, alphabet, nor numerical targets assign
  teaching levels. Sections organize authoring, not lessons. No exhaustive
  unselected-source audit, invented source entry, generated predicate, or
  specialist taxonomy/equipment inventory is added. Candidate availability was
  not a reason to import every source position. This is a bounded completed
  domain selection, not an assertion that every useful nature noun is covered.
counts:
  selected_senses: 213
  core_senses: 213
  branch_senses: 0
  source_parents: 159
  distinct_selected_spellings: 156
  identity_records_in_fragment: 155
  existing_identity_fragments: 29
  new_identity_groups: 126
