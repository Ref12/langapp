validation:
  loader: curriculum_yaml.load_yaml
  selection_contract: Exact four-field rows; unique known IDs; declared topics; integer levels 1-30; nonempty labels no longer than 64 characters.
  source_contract: korean_program_adapter.sense_index checks the pinned registry and original definition positions.
  identity_contract: korean_program_adapter.lexical_members checks exact shape, unique complete membership and source-parent sets for standalone and composed selections.
  composition_method: >-
    Used actual load_selections against the listed protected inputs, including
    readable parent proposals whether registered or not, then an in-memory
    manifest adding only nature-vocabulary.yaml and nature-identities.yaml.
    Only manifest reads are substituted; every actual selection and identity
    file is read normally. This simulates composition without registering any
    cohort or bypassing collision, canonical-key or category checks. Protected
    rows and identity members are checked for exact preservation.
  correction_contract: Ten exact Korean/English evidence and selected-label proposals passed korean_program_adapter.source_corrections.
  existing_tests:
    command: python -B -m unittest test_korean_program.KoreanSelectionFilesTests test_korean_program.KoreanAdapterTests.test_polysemy_counts_once_and_bound_forms_are_separate test_korean_program.KoreanAdapterTests.test_authored_corrections_preserve_bilingual_source_and_selected_label
    result: Eight existing tests passed; no test dependency was installed.
  limits: >-
    Structural checks do not replace linguistic, scientific or pronunciation
    review. Parent owns reading coverage, source adjudication, registration and
    generated-program integration; no reading-dependent integration pass is claimed.
source_and_license_limits: >-
  The pinned source-senses.yaml supplies the original bilingual definitions.
  ko-nikl-NNNNN is the project's preserved CSV record and sNNN the original
  definition-list position, not an official NIKL sense identifier. Source bands
  remain independent of authored placements. No registry, source record,
  reading asset, manifest, shared runtime, or previously owned curriculum file
  was edited. Source strings, provenance and licensing obligations remain
  unchanged; quoted evidence does not relicense upstream material or imply
  additional redistribution rights. No dictionary endorsement, exam readiness,
  professional qualification, completed lexical inventory or planning-scale
  completion is claimed. Qualified linguistic, scientific and reading review
  remain necessary.
