    Each joins its protected abstract family's exact free-lemma key and category,
    adding no free identity. No machine-operation instructions or equipment
    inventory was added.
  source_evidence:
    ko-nikl-50562-s002:
      source_korean: "사물의 테두리나 대강의 모습."
      source_english: "The outer rim or general appearance of an object."
    ko-nikl-39735-s001:
      source_korean: "기계 등이 반대 방향으로 돌거나 구름."
      source_english: "The act of a machine, etc., turning or rolling in the opposite direction."
    ko-nikl-39735-s002:
      source_korean: "위치, 순서, 방향 등이 반대로 바뀜."
      source_english: "A change of a position, order, direction, etc., to the opposite."
    ko-nikl-47153-s002:
      source_korean: "소리가 그치거나 거의 사라진 뒤에도 남아 있는 잔잔한 소리나 울림."
