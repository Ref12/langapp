    members to either family. See interpretation-notes.yaml for the actual
    three-entry official-origin comparison and unchanged source sense IDs.
  source_and_reading_limits: >-
    The three added parents are already represented by protected abstract
    selections. They join the reused-parent compatibility queue, not the
    new-parent queue or an invented missing-pronunciation count. Purification
    parent14570 is absent from the registered source view and is not replaced
    with protected essence14571 or assigned a guessed sense position.
source_correction_requests:
  ko-nikl-01683-s001:
    source_korean: "사람이나 동식물이 살아 있는 기간."
    source_english: "The length of time during which a person or animal is alive. "
    authored_interpretation: "lifespan of a person, animal, or plant"
    rationale: Korean 동식물 explicitly includes plants; the English omits them.
  ko-nikl-05146-s001:
    source_korean: "사방으로 펼쳐진 넓고 평평한 땅."
    source_english: "Wide, flat, open land with no fences, etc."
    authored_interpretation: wide open flat land
    rationale: The Korean describes broad flat open land without requiring fences to be absent.
  ko-nikl-10622-s002:
    source_korean: "실천에 대립되는 관념적인 지식."
    source_english: "Ideological knowledge as opposed to practice."
    authored_interpretation: abstract theoretical knowledge rather than practice
    rationale: 관념적인 contrasts abstract knowledge with practice here; ideological can misleadingly add a political or doctrinal restriction.
  ko-nikl-22638-s001:
    source_korean: "부풀어서 크기가 커짐."
    source_english: "The state of something becoming bigger because it has been inflated."
    authored_interpretation: physical expansion or swelling
    rationale: Review the passive inflation wording, which can suggest a specific inflation process rather than the Korean's general swelling or enlargement.
  ko-nikl-27655-s001:
    source_korean: "말라서 물기나 습기가 없음."
    source_english: "Neither wet nor humid due to evaporation."
    authored_interpretation: absence of moisture or humidity
    rationale: The Korean describes dryness without naming evaporation as the required physical mechanism.
  ko-nikl-29857-s003:
    source_korean: "수학 계산, 과학에서 법칙을 수식이나 기호로 나타낸 것."
    source_english: "In math and science, a state in which rules are indicated in words or symbols. "
    authored_interpretation: a mathematical or scientific formula
    rationale: 수식 means a mathematical expression rather than words; the noun names the formula representing a rule rather than a state.
  ko-nikl-35728-s002:
    source_korean: "어떤 성질의 강한 정도."
    source_english: "Depth or intensity of emotions such as love, sadness, etc. "
    authored_interpretation: intensity of a quality
    rationale: Korean refers to the strength of a quality generally; the English confines it to emotions.
  ko-nikl-43241-s001:
    source_korean: "빛깔이 붉고 물기가 있어 잘 들러붙는 흙."
    source_english: "Soil that is sticky and red because it contains a large amount of water."
    authored_interpretation: reddish moist sticky soil
    rationale: The Korean separately gives reddish color and moisture-related stickiness; it does not say abundant water causes redness.
  ko-nikl-44596-s001:
    source_korean: "탄소가 2퍼센트 미만으로 들어 있고 열로 성질을 변화시킬 수 있어 여러 가지 기계나 기구 등의 재료로 쓰이는 철."
    source_english: "Steel that contains less than 2% of carbon, which is used for making machines, equipment, etc., because of the ease with which it can be shaped when heat is applied."
    authored_interpretation: steel
    rationale: Heat changing 성질 means changing properties, not merely being easy to shape; retain the material term without teaching the altered explanation.
  ko-nikl-47652-s001:
    source_korean: "적도에 가까우며, 연평균 기온이 섭씨 20도 이상인 덥고 비가 많이 오는 지역."
    source_english: "A region with a great deal of rainfall, which is near the equator and has an annual average temperature of over 20 degrees Celsius. "
    authored_interpretation: tropical regions
    rationale: Korean 20도 이상 includes exactly 20 while English over 20 excludes it; the simplified climate description separately needs qualified geographical review.
correction_policy: >-
  The ten exact-source proposals are original AI-authored requests for qualified
  adjudication, including translation-scope clarifications as well as direct
  mismatches. They preserve upstream strings and match selected labels. No
  upstream definition was edited. The parent integrated all ten exact-source
  interpretations in source-corrections.yaml with unreviewed status; this is
  not qualified linguistic or scientific approval.
reading_review:
  assessment: actual selected-parent resolver followed by complete-definition comparison
  resolved_parent_count: 22
  resolved_selected_senses: 30
  official_crosswalk_parents: 13
  authored_unit_parents: 9
  official_text_senses: 204
  authored_reading_senses: 9
  remaining_selected_gaps: []
  limitation: >
    The nine metric-unit readings are individually reasoned broad-Hangul
    proposals with unreviewed status, not dictionary pronunciation text.
    Preserve official lengths and homograph-specific text for the other
    selected parents. The original unassessed handoff queue below is not
    a count of missing or unresolved pronunciations.
source_wording_review:
  policy: >-
    The following limitations occur in both source languages or concern the
    limits of a short dictionary definition, rather than an English-only
    mistranslation. Labels name the intended concepts without presenting those
    descriptions as complete scientific models or clinical recommendations.
  entries:
    ko-nikl-01058-s001:
      source_korean: "물체가 움직이거나 일이 진행되는 빠르기의 크기. 또는 그런 빠르기를 이루는 힘."
      source_english: "The speed of an object's movement or the process of things, or the power that makes up the speed."
      limitation: Speed must not be equated with force or power merely because the source appends 힘 and power wording.
    ko-nikl-32316-s001:
      source_korean: "사람이나 동물의 몸을 움직이게 하는 힘줄과 살."
      source_english: "The tendons and flesh which move the body of an animal or person."
      limitation: The intended muscle term is useful, but the tendons-and-flesh description requires qualified anatomy review and must not identify tendons as muscle tissue.
    ko-nikl-31912-s001:
      source_korean: "사람들을 병에 걸리게 하거나 음식을 썩게 하는 아주 작은 생물."
      source_english: "A very small organism that makes food rot or people sick."
      limitation: This harmful-germ position is not evidence that all microorganisms or all uses of 균 are harmful.
    ko-nikl-12290-s001:
      source_korean: "태풍, 가뭄, 홍수, 지진, 화산 폭발 등의 피할 수 없는 자연 현상으로 인해 받게 되는 피해."
      source_english: "Damage from unavoidable natural phenomena such as typhoons, droughts, floods, earthquakes, volcanic eruptions, etc. "
      limitation: Do not convert unavoidable wording into a claim that damage mitigation or safer decisions are futile.
    ko-nikl-12301-s001:
      source_korean: "태양에서 나오는 눈에 보이지 않으며 파장이 짧은 빛."
      source_english: "Light produced from the sun, which is invisible and has a short wavelength."
      limitation: The source's solar example is not an exclusive-origin rule or an exposure recommendation; no wavelength range was invented.
    ko-nikl-16950-s001:
      source_korean: "줄기가 곧고 마디가 있으며 속이 비고, 잎이 가늘고 빳빳한 높이 30미터 정도의 늘 푸른 식물."
      source_english: "A plant about 30 meters high that features joints and has upright, hollow stems and thin, stiff leaves."
      limitation: Approximate height and plant appearance are a simplified description, not universal guarantees for every bamboo.
    ko-nikl-12882-s001:
      source_korean: "줄기에 가시가 있고 오월이나 유월에 향기롭게 피는 빨간색, 하얀색, 노란색 등의 꽃."
      source_english: "A fragrant flower with thorns on the stem that blooms in red, white, yellow, etc., in May or June."
      limitation: The flowering months must not be taught as a global or cultivar-independent timetable.
    ko-nikl-48402-s001:
      source_korean: "열대와 한대 사이에 있으며, 일 년 동안의 평균 기온이 섭씨 0도에서 20도 사이인 따뜻한 지역."
      source_english: "A region which is between the tropical and frigid zones and has an annual average temperature range from 0 to 20 degrees Celsius."
      limitation: The short temperature description is not a universal climate-classification standard; review alongside tropical-region wording.
    ko-nikl-49391-s001:
      source_korean: "무한한 시간과 만물을 포함하는 끝없는 공간."
      source_english: "An endless space that includes infinite time and all the things in the world. "
      limitation: The infinity formulation is a broad conception, not evidence that physical cosmological infinity has been established.
  measurement_limits: >-
    Everyday Korean 무게 and English weight in gram/kilogram/ton definitions
    must not be used to equate mass with force in science teaching. The terse
    ton position does not specify a numerical conversion. Temperature scales,
    coordinate degrees and angular degrees remain separately contextualized.
    No conversion table, formal measurement standard, calibration procedure,
    biological normal range, or clinical threshold was fabricated.
  protected_source_observation:
    id: ko-nikl-50874-s001
    source_korean: "귀금속이나 그릇 등을 만드는 데 쓰는, 흰 광택이 나고 무른 성질이 있는 금속."
    source_english: "Metal that is used to make precious stones, kitchenware, etc., that is white and smooth."
    followup: >-
      Observed while checking the protected silver family: precious stones
      differs from the Korean metal/metalware wording, and smooth differs from
      softness. The existing source-corrections.yaml entry already covers
      both mismatches with the unchanged label silver; the metal.
      This observation adds no correction, selection or free identity.
