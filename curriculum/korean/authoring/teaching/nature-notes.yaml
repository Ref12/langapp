  phases:
    first-exchanges: 16
    everyday-life: 105
    stories-conversations: 15
    explanation-problems: 34
    analysis-argument: 28
    nuance-interpretation: 15
count_interpretation: >-
  Senses, pinned source parents, visible spellings, and provisional identity
  groups measure different things. Additional meanings, bound counters,
  naming elements, and superlative reference do not each create a free lemma.
  The 29 existing fragments exceed the 28 reused source parents because the
  newly selected 새싹 parent joins the already protected 싹 identity.
  No protected branch-only identity gains its first core use here; additional
  core free coverage equals the 111 globally new provisional free identities.
  These totals are neither learner mastery nor completion of the planning guide.
placement_rationale:
  first_exchanges: >-
    Drawn lines, dots, vacant space and spatial endpoints support observable
    description at 2. Grams, kilograms, litres and percentages support familiar
    transactions at 3. Named months, years, daylight and daily periods support
    routine plans at 4. Those ordinary uses are not delayed until a science phase.
  everyday_life: >-
    Plant care, visible growth, ground conditions, temperature sensations and
    simple surfaces support household help at 5. Body descriptions and ordinary
    dimensions support service/care communication at 6 without diagnosis.
    Showers, strong winds, seasonal periods, river courses and terrain support
    travel planning at 7 even when the dictionary band is advanced. Basic
    shape diagrams, scores and angle measures support work/study at 8.
  stories_conversations: >-
    Open landscapes, dense forests, nighttime and counts of natural branches
    support recounting experiences at 9. Excited atmosphere supports experience
    at 10. Drying, mixing, preliminary trials, maintaining conditions and final
    process stages support procedures at 11. Proportions, particular aspects,
    seasonal-period contrasts and motivation support comparisons and reasons
    at 13. Source order does not impose the order of these meanings.
  explanation_problems: >-
    Lightning, unexpected drenching, severe rain with wind, natural hazards and
    usable object life support unfamiliar problems at 14. Repercussions of a
    shocking event support public reporting at 16. Environmental conditions,
    resource depletion, packing density, steel, purification, pollutants and
    observation satellites support accessible explanation at 17.
  analysis_argument: >-
    Measurement standards, categories, endpoints and theory/practice contrast
    support analysis from 19. General biology, geography, waves, geometric
    relationships and formulas enter at 21. Conventional methods, growth of
    scale or influence, and viewpoint support qualified reasoning at 23.
    No new specialist branch was needed to complete this domain scope.
  nuance_interpretation: >-
    Figurative prevailing atmosphere supports stance at 25. Selected natural
    imagery supports interpretation at 27. Scope of understanding, the real
    world, intensity of a quality, resource imagery applied to thought, and the
    broad universe conception support precise abstraction at 28. These later
    meanings are not inferred to be official exam requirements.
identity_decisions:
  policy: >-
    Every protected key, canonical lemma, category, member and placement is
    preserved. Existing fragments contain only new members and the exact
    parents of those members. A fragment's canonical spelling can come from
    its protected family rather than its newly added parent. New groups and
    selected related forms require qualified lexical review; no official
    dictionary equivalence or verified true-lexeme count is asserted.
  new_growth_family:
    identity: ko-lex-03785
    protected:
      id: ko-nikl-03785-s001
      target: 싹
      source_korean: "씨나 줄기에서 처음 나오는 어린 잎이나 줄기."
      source_english: "A new leaf or stem that is produced for the first time from a seed or stem."
    new:
      id: ko-nikl-09374-s001
      target: 새싹
      source_korean: "씨나 줄기 등에서 새로 나오는 잎."
      source_english: "A leaf newly coming out of a seed, stem, etc."
    rationale: >-
      The newness-emphasized name closely overlaps protected emerging leaf/stem
      reference. Conservatively count the new leaves and child metaphor in the
      same emergence family. This does not call the forms spelling variants or
      make every context interchangeable; no general 새-prefix rule is applied.
  angular_family:
    identity: ko-lex-26083
    broader:
      id: ko-nikl-26083-s002
      target: 각
      source_korean: "같은 지점에서 시작되는 두 개의 직선이나 평면이 벌어진 곳. 또는 벌어진 정도."
      source_english: "The space between two straight lines or planes that start from a common point, or the measured degree of the space."
    degree_focused:
      id: ko-nikl-26100-s001
      target: 각도
      source_korean: "같은 지점에서 시작되는 두 개의 직선이나 평면이 벌어진 정도."
      source_english: "The degree of divergence between two lines or planes that start from a common point."
    rationale: >-
      The measured-opening part of 각 already supplies the meaning emphasized
      by 각도. Count one provisional angular family, including viewpoint,
      rather than an extra free identity for the degree-focused form. This
      does not license global stripping of 도 or merging unrelated same-English words.
  circular_family:
    identity: ko-lex-49664
    shorter:
      id: ko-nikl-49664-s001
      target: 원
      source_korean: "둥근 모양이나 형태."
      source_english: "A round shape or form. "
    shape_focused:
      id: ko-nikl-49833-s001
      target: 원형
      source_korean: "둥근 모양."
      source_english: "A round shape. "
    rationale: >-
      These round-form meanings share one conservative shape family. Original
      form/prototype 원형49832 is a different homograph, and the protected
      currency unit ko-lex-49668 is not merged merely because it is written 원.
  calendar_families:
    - >-
      Protected moon ko-lex-16539 gains independent month16539-s002 and bound
      month-counting16542-s001, both at 4. No uniform month duration, lunar-period
      equality, or invented unit conversion is asserted.
    - >-
      Protected sun ko-lex-24576 gains independent year and daylight periods
      plus bound year-counting24581-s001. Independent time meanings accompany
      counting at 4. The year refers to Earth's orbit, not its daily axial spin.
  bound_only:
    identity_ids:
      - ko-lex-00550
      - ko-lex-20309
      - ko-lex-21023
      - ko-lex-21024
      - ko-lex-21652
      - ko-lex-22659
      - ko-lex-31993
      - ko-lex-39011
      - ko-lex-39172
      - ko-lex-17730
      - ko-lex-14233
    rationale: >-
      Metric/measurement names, degrees and the separately supplied point
      counters remain bound-only. Source14233 score/tiny-amount uses are not
      promoted to another free dot noun. Dot/spot/decimal/punctuation/aspect
      source14232 is a separate provisional mark family; no extra free point
      counter is counted under either treatment.
  function_only:
    identity_ids: [ko-lex-45363, ko-lex-45377, ko-lex-45397, ko-lex-45418]
    rationale: >-
      Highest/best, maximum, minimum and lowest are conservatively treated as
      scale-extremum or superlative reference. The counting category function-item
      does not change their source POS noun or claim a universal grammatical
      taxonomy. Their five senses contribute no new free identities.
  functions_inside_free_families: >-
    Grain counting remains in protected 알; leaf/petal counting and leaf-name
    elements remain in 잎; branch and ray/stream counting remain in 줄기.
    Category/kind counting shares independently referable 종-s002 at 19.
    Color, metal-made and light-ray naming elements stay within already
    independently attested 빛, 금, 은 and 선 families. None licenses generated
    plant/color compounds, fabricated scientific terms, or a separate free
    count merely for being used in a compound.
  protected_placement_limits: >-
    Protected independent 잎 is currently at 17 and the plant-stem position
    of 줄기 at 21. These placements were not edited. New leaf functions enter
    at 21 rather than causing a bound/naming use to introduce a free family
    before its selected independent leaf. Independent natural branch 줄기-s002
    enters at 7 before new branch-counting at 9; this is a real new content
    meaning, not a promotion caused only by a counter. Packing density does
    not move protected mass-per-volume 밀도-s001 out of its scientific branch.
  compounds_and_synonyms: >-
    Supplied compounds such as 산꼭대기, 강물, 동식물 and 몸무게 retain explicit
    provisional source-based identities; no new compounds or X하다 predicates
    were generated. Similar English alone does not collapse 평지/벌판,
    햇볕/햇빛/햇살, curved/straight/horizontal line names, or all stone-related
    words. There is no universal noun-to-predicate derivational merger.
    Only the specifically documented family decisions apply.
meaning_and_boundary_checks:
  - >-
    사각형08165 is a quadrilateral, not necessarily a square or rectangle.
    No equal sides or right angles are invented. Geometry labels are not
    complete axioms or promises to cover every degenerate mathematical case.
  - >-
    자연계12275 is the academic track including mathematics and natural
    sciences, not an unsupplied natural-world sense. 종41347 selects category
    and kind-counting, not an invented technical biological species definition.
  - >-
    대16856-s001 is an upright hollow plant stalk, not an alias for the entire
    bamboo plant16950 and not the protected vehicle/device counter16872.
    The long-stick and determination positions are not imported.
  - >-
    Sunlight and scientific context do not turn 산소08726 tomb into oxygen,
    전자13978 past-time reference into an electron, 자기12040 self-reference
    into magnetism, or 탄성21182 exclamation into elasticity. None was selected
    by matching an English concept to the wrong homograph.
  - >-
    The social-class positions of 상류/하류, person-directed 절벽 labels,
    geomantic 지리, and old-fashioned honor-reference 면37115-s005 are not
    neutralized into ordinary geography or material description.
  - >-
    The source's 이슬10812-s003 bodily fluid, 독18034-s002 poisonous drug,
    정화14745-s002 mental purification and 열기47646-s002 fever positions
    remain unselected. No detoxification, exposure limit, clinical diagnosis,
    treatment, poisoning method, or chemical-mixing recipe is supplied.
  - >-
    Clinical labels in the active cohort are ordinary terms such as breathing,
    body weight, joint and muscle. They do not interpret a person's appearance,
    body size or breathing sound as a diagnosis, fitness judgment or prognosis.
  - >-
    센티00549 is a real available short unit form, but the full centimetre
    form supplies this cohort's practical need. Musical/alcohol degrees,
    cargo-capacity tons, art/meat/drop/go-stone point counters and household
    connective-cord 선09934-s002 are not added merely because a parent is selected.
  - >-
    Parent-owned concrete tools, fixtures, street features and vehicle parts
    remain outside this cohort. The selected satellite is a general-reader
    astronomical/observation concept, not a launch-equipment inventory.
