placement:
  common_conversation: >
    Of-course framing appears at4, earnest pleas at6, and wish/nominal
    agreement uses at8. Strong 아무렴 agreement is later than a polite yes:
    it is not interchangeable with 네 in every relationship. 제발 can sound
    urgent or exasperated, and 부디 is not a mandatory politeness token.
  narration_and_decisions: >
    Time comparisons and accidental occurrence support9; concerns and memory
    support10. Perceptual clarity and early process timing support11.
    Alternatives, scope, and initial planning support13; actual encounters,
    worn condition, and faint/light states support14. Historical timing and
    reported perceptions support16; material and spatial distinctions support17.
  explanation_and_evidence: >
    Summary, exceptionless scope, and minimal acceptable extent support18.
    Doubtful aspects, certainty levels, gradual development, and thoroughness
    support19. Precision in a general scientific account enters21, workmanship
    appraisal22, and reasonableness of a claim or judgment23. Coherent content
    and weak/strong organization support synthesis24.
  interpretation_and_register: >
    Hidden intent, reassuring certainty, belittling scope, and changed behavior
    belong in contextual stance work25. Marked negative, truth, generalization,
    and normative frames enter26, not everyday speech as universally suitable
    substitutes. Fleeting-time feelings and atmospheric depth support27;
    closely related doubt predicates and refinement judgments support28.
    Existing placements are not moved to make later phases look larger.
  context_limits: >
    비단 is particularly useful in not-only contrasts; 일절 and 당최 commonly
    occur with negative restrictions. The source definitions do not license
    stripping their collocational context or assigning a universal substitute.
    모름지기, 무릇, 정녕, and 여하튼 need marked/written-register discussion.
    A reassurance using 어련히 may be sincere or ironic in context; no fixed
    sarcastic meaning or intonation is inferred from the spelling.
identity_adjudication:
  new_free_families: 17
  new_function_families: 22
  corrected_existing_function_categories: [ko-lex-16148, ko-lex-48353]
  category_rationale: >
    All selected 다만 and 오히려 senses are restriction, qualification,
    alternative, or contrastive scope. Their former provisional free
    classifications were inconsistent with the same role already assigned
    to 도리어 and other operators. Correct only these inspected affected
    families, retaining their canonical IDs, lemmas, and source item IDs.
  consolidated_prior_identities:
    ko-lex-07767:
      into: ko-lex-07766
      rationale: >
        Both full 빈틈없다/빈틈없이 lists have matching literal-completeness
        and thoroughness meanings, differing in predicate/adverb syntax.
        The old manner sense remains selected with its original ID and
        placement; consolidation changes breadth accounting, not mastery.
    ko-lex-19845:
      into: ko-lex-19846
      rationale: >
        The actual 뚜렷하다/뚜렷이 definitions match apart from predicate/
        adverb syntax. The selected 또렷하다 clarity alternant is counted
        conservatively with them; retain the stronger 아주 qualification
        where present, separate citations, and distinct usage evidence.
  net_free_change: 13
  net_function_change: 24
  net_total_identity_change: 37
  preserved_evidence_boundaries: >
    의심스럽다/의심쩍다 have identical full Korean definitions but remain
    separate source items within protected 의심. The first three 혹여
    definitions exactly match the first three 혹시 positions, whose original
    conditional and chance uses were also missing. Early-time variants deepen
    일찍, while old-time 일찍이 does not inherit mastery from clock timing.
    Further adjective senses deepen old families without another free root.
    Concrete lexical manner 슬며시 and deliberate pretence 짐짓 remain free
    content families, not automatically discourse operators because of POS.
  nonautomatic_grouping: >
    Do not merge every synonym, vowel alternant, noun/adverb, or hada form.
    슬며시's slow/unobtrusive development differs from the rapid/light/cursory
    meanings of protected 슬쩍. Normative 의당 is not the independent predicate
    마땅하다. 일절 and 일체 retain different source readings and use profiles.
    The new 하여튼/여하튼 family does not automatically replace protected 아무튼.
source_correction_requests:
  ko-nikl-02549-s003:
    source_korean: 속으로 천천히 은밀하게.
    source_english: In a manner of being slow and secretive.
    authored_interpretation: inwardly, gradually, and unobtrusively
    rationale: Preserve inward development from 속으로 rather than presenting another externally secret action identical to the first position.
  ko-nikl-16148-s002:
    source_korean: 그 정도라도.
    source_english: Only to such an extent.
    authored_interpretation: even just to that extent
    rationale: Retain the concessive라도 minimum/acceptable-extent nuance, not merely an upper bound.
  ko-nikl-25638-s001:
    source_korean: 그러지 않아도 매우.
    source_english: Moreover to make matters worse.
    authored_interpretation: already very much so, even without that
    rationale: The Korean defines an already-intense background without an obligatory negative outcome. Common adverse contexts do not restrict every use to worsening.
  ko-nikl-43346-s001:
    source_korean: 마음이나 생각과 다르게 일부러.
    source_english: In the manner of doing something on purpose, intentionally.
    authored_interpretation: deliberately contrary to one's real thoughts or feelings
    rationale: Preserve the explicit divergence from real thought or feeling; English omits it and otherwise conflates this with ordinary intentional action.
  ko-nikl-50891-s002:
    source_korean: 정취가 그윽하게.
    source_english: Exquisitely.
    authored_interpretation: with a deep, subtle atmosphere
    rationale: Preserve atmospheric depth rather than claiming every form of exquisite workmanship, secrecy, or earnestness.
  ko-nikl-38018-s001:
    source_korean: 대체로 미루어 생각해 보면.
    source_english: Considering everything.
    authored_interpretation: generally speaking; judging broadly
    rationale: Preserve broad inferred generalization from 대체로 미루어, not an exhaustive evaluation of every fact or an exceptionless universal claim.
