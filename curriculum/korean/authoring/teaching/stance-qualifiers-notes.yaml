review_limits: >
  Dictionary text and authored interpretations retain separate provenance.
  Families are provisional, not independently adjudicated true lexemes.
  No written sensory adjective establishes actual hearing, visibility, smell
  detection, safety, diagnosis, mental state, or competence. Teach criticism
  with suitable relationship/context and evaluate claims rather than a person's
  worth. Qualified Korean-language and pedagogical review remains necessary;
  counts, modules, and citation text award no item or modality mastery.
