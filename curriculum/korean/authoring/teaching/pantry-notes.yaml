source_limits:
  absent_exact_forms: [귀리, 목이버섯, 표고, 표고버섯, 브로콜리, 새우젓, 액젓, 오트밀, 요거트, 쪽파, 파프리카, 후추가루]
  bounded_probe: >
    Both 표고 and 표고버섯 were checked; a bounded raw-Form prefix check
    found no 표고 entry either. 오트밀 was checked as an actual possible
    processed-food name, not fabricated as an alias for absent 귀리.
    The listed 후춧가루 spelling is used, not absent 후추가루.
  existing_alternative: Protected 요구르트48929 supplies its actual fermented-milk-drink sense; no invented 요거트 parent is needed.
  interpretation: Exact absence in this pin is not absence from Korean or a license to replace a word with an unrelated homograph. No exhaustive food-source audit is claimed.
  bounded_deferrals: >
    Protected staples, oils, soy sauce/pastes, flour, leafy vegetables,
    seaweeds, honey, butter, cheese, mayonnaise, and pepper are not imported
    again. Unselected 견과 and 곡식 were inspected but do not add another
    near-equivalent category merely to increase the count.
