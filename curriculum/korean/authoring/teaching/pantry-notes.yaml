source_correction_requests:
  ko-nikl-33546-s001:
    source_korean: 들깨와 참깨의 잎.
    source_english: The leaf of wild sesame and sesame.
    authored_interpretation: leaves of perilla or sesame
    rationale: Scope/common-name clarification; use perilla for the named 들깨 while preserving both leaf referents. The source is not limited to perilla alone, and wild sesame is not a foraging or botanical-identification claim.
  ko-nikl-37341-s001:
    source_korean: 팔뚝만 한 크기에 입과 눈이 크고 등은 푸른 갈색, 배는 은백색이며 말리면 북어가 되는 바닷물고기.
    source_english: A forearm-sized saltwater fish with large eyes and mouth, brown back and silver-white belly, known in Korea as bugeo and sometimes eaten dried.
    authored_interpretation: pollock (not the dried product bugeo)
    rationale: Korean explicitly says the fish becomes 북어 when dried. English incorrectly calls the fish already bugeo; preserve the separate fresh/undried fish and dried-product concepts without guaranteeing product freshness.
  ko-nikl-46187-s001:
    source_korean: 겉은 연한 갈색이고 살은 흰색인, 독특한 향기와 맛을 지닌 버섯.
    source_english: A mushroom with a unique scent and taste of which the outside is light brown and the skin is white.
    authored_interpretation: button mushrooms
    rationale: Korean 살 is flesh, not skin. The concise culinary name avoids repeating the conflicting English surface-color description; it does not certify a species or provide an identification guide.
  ko-nikl-49357-s001:
    source_korean: 7월에 검은 자주색 또는 흰색의 꽃이 피며 뿌리와 어린잎을 먹는 풀. 또는 그 뿌리.
    source_english: A plant that produces dark violet or white flowers in July and has edible roots and young leaves.
    authored_interpretation: burdock (plant or root)
    rationale: Preserve the explicit alternative 또는 그 뿌리, omitted as a standalone referent in English. Neither the flowering description nor source food-use wording is a safe wild-identification or consumption instruction.
