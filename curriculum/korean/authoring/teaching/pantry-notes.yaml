schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: integrated source and reading decisions; qualified review remains
scope:
  - Only pantry-vocabulary.yaml, pantry-identities.yaml, and this notes file are authored here.
  - Every earlier cohort, including cognition, representation, circumstance, governance, and interaction, remains parent-owned and untouched.
  - No source, reading, manifest, root, code, test, or generated-output edits; no commits, dependency installation, or delegation.
  - Select useful grocery and recipe vocabulary, not a taxonomic catalogue or a fixed number of foods.
source_provenance:
  source_id: nikl-2024-mirror
  revision: 3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9
  sha256: 3250b7b0620eee814aadb4ad5611f1e209792e2aebfd57017bcfe3f1d7b92aa0
  source_records: 53172
  url: https://huggingface.co/datasets/binjang/NIKL-korean-english-dictionary/resolve/3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9/2024_01.csv
  ids: Parent IDs are one-based CSV data-record ordinals; sNNN is the original definition-list position, not an official dictionary identifier.
  inspection: >
    Independently reread bounded, explicitly named grocery/ingredient forms,
    all their exact-form homographs, and necessary related family members
    from the checksum-verified pinned CSV in memory. The supplied parent
    audit file was not read; no claim to have consumed its three chunks is
    made. No source cache or scratch file was written.
  array_contract: >
    Each support request below preserves the complete original Korean and
    English lists. Their one-based indexes are the original sense positions;
    selected_positions refers to those indexes. No definition is reordered,
    deduplicated, shortened, or split into invented source senses.
  attribution: National Institute of Korean Language and Korean-English Learners' Dictionary contributors, via the unofficial binjang extraction.
  license: CC-BY-SA-2.0-KR for dictionary text; not the mirror's MIT metadata.
  license_url: https://creativecommons.org/licenses/by-sa/2.0/kr/
  reuse_notice: >
    Dictionary definitions are preserved as evidence. Compact English labels,
    teaching placements, and provisional identity judgments are adaptations.
    Retain attribution, source/license links, and share-alike terms. No NIKL
    endorsement, usage-example, audio, or image redistribution is claimed.
safety_and_scope:
  - Food and allergen-related words are vocabulary, not a medical or legally exhaustive allergen classification.
  - Recognizing a word does not establish a product's ingredients, contamination status, processing method, freshness, or safety for a particular person.
  - No plant or mushroom description certifies botanical identity or edibility. No foraging or preparation instructions are supplied.
  - Source mentions of edible plants, cooking, salting, drying, or fermentation are historical lexical descriptions, not safe-consumption procedures.
  - No raw-consumption, gluten-free, lactose-free, added-sugar, nut-free, or other dietary guarantee follows from these labels.
  - Culinary common names are not verified scientific taxa; no Latin species names or cultivar identities are invented.
curation:
  early_communication: Salmon and ketchup support simple food ordering at 3; groceries and basic materials support home tasks at 5.
  shopping_and_care: >
    At 6, category/ingredient names support reading labels and asking questions.
    The prepared mung-sprout side dish is distinguished from its ingredient.
    These words do not establish the safety of a meal or product.
  travel_and_recipes: >
    Common seafood/menu names enter at 7. Recipe distinctions such as starch,
    seeds, ground seasoning, sticky rice, egg-part variants, cream mixtures,
    concentrated milk, and dried pollock enter at 11.
  unfamiliar_products: >
    Sorghum and actual hulled foxtail-millet grain support questions about
    unfamiliar grain products at 14. No grain 기장 or plant 조 source ID is
    invented to complete a cereal list.
  source_band_independence: Placement follows these communicative uses, not source bands, alphabetic order, numerical quotas, or a blanket level6 assignment.
identity_policy:
  status: Explicit provisional lexical families, not independently verified true-lexeme breadth. Report parents, spellings, senses, and family counts separately.
  existing_fragments: Keep canonical lemma/category unchanged and include only new members and their actual parents.
  starch: 전분13841 matches protected cooking 녹말35581-s001, not automatically its distinct biological-carbohydrate position.
  egg_parts: >
    Full 노른자/노른자위 and 흰자/흰자위 comparisons preserve their
    literal and figurative/eye meanings. Only the newly selected recipe
    variants extend existing families here; no second free head is counted.
  soybean: >
    Actual 대두16997 and protected 콩20825 both specify the round,
    yellow/black-skinned grain used in tofu/soy products. Reuse that family
    without declaring every bean word synonymous or including emergence16998.
  pepper: >
    후춧가루52310 explicitly grinds protected 후추52309 into seasoning.
    This conservative single-material family decision is not a rule merging
    every powder, grain, plant, or processed product.
  cream: >
    생크림09629 and 크림20932-s001 both describe milk-derived fat.
    Count them once while retaining the separate prepared egg/milk/sugar
    cream20932-s002 position. Cosmetic20932-s003 is unselected. Neither
    plain dairy-cream definition requires whipping, sweetening, or a fat
    percentage; the milk-concentration definition of 연유 adds no sugar.
  distinguish_products: >
    명태 fish and gutted/dried 북어 are explicitly different named food
    states, not interchangeable spelling variants. A cereal plant is not
    automatically identical to flour, and two named salad/wrap vegetables
    are not merged merely because English calls both lettuce.
  no_automatic_taxonomy: >
    A named ingredient, a product made from it, and a broad food category
    need not share a family. Conversely, transparent variants and matched
    material synonyms do not automatically create new breadth. The actual
    decisions are documented individually in pantry-identities.yaml.
