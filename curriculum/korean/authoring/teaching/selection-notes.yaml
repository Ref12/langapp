      one functional modifier identity; the comparative sense is not replaced
      by the additive sense.

multi_parent_decisions:
  - id: ko-lex-38146
    lemma: 무엇
    source_parents: [ko-nikl-38146, ko-nikl-38773]
    rationale: >
      뭐 is the conversational contracted interrogative form. Preserve both
      written forms and source senses in one function identity. This is an
      authored contraction analysis, not an official variant crosswalk.
  - id: ko-lex-02694
    lemma: 시간
    source_parents: [ko-nikl-02694, ko-nikl-02696]
    rationale: >
      Independent time reference and hour-duration counting share one
      time-measure identity. Preserve noun/bound-noun distinctions in the
      member evidence without adding headword breadth for the counting use.
  - id: ko-lex-11948
    lemma: 있다
    source_parents: [ko-nikl-11948, ko-nikl-11947]
    rationale: >
      Existential, location, and possession uses and actional remaining in a
      place share one conservative teaching identity. Source descriptive-verb
      and verb analyses remain distinct; staying and possessing are not
      interchangeable meanings or grammatical distributions.
  - id: ko-lex-20920
    lemma: 크다
    source_parents: [ko-nikl-20920, ko-nikl-20919]
    rationale: >
      Stative big and dynamic grow share the same size/growth lexical base.
      Preserve their source categories and meanings instead of using POS
      alternation alone to claim unrelated homographs.
  - id: ko-lex-23787
    lemma: 하나
    source_parents: [ko-nikl-23787, ko-nikl-24067]
    rationale: >
      The native numeral and its adnominal form 한 express one. Their
      numeral/determiner distinction is not additional lemma breadth.
  - id: ko-lex-35010
    lemma: 내일
    source_parents: [ko-nikl-35010, ko-nikl-35011]
    rationale: >
      Noun tomorrow and adverb on the next day share the same deictic day
      reference; preserve both grammatical uses in one temporal identity.
  - id: ko-lex-48123
    lemma: 오늘
    source_parents: [ko-nikl-48123, ko-nikl-48124]
    rationale: >
      Noun today and adverb on the present day are category uses of one
      temporal lexeme, not separately counted homographs.

additional_grouping_evidence:
  narration-argument-and-interpretation: >
    expansion-identities.yaml and expansion-notes.yaml document literal and
    figurative source senses, discourse operators, the bound 여지 identity,
    and explicit source-category or emphatic-form groupings. These analyses
    retain source meanings and count additional senses as depth rather than
    extra headwords. The source-correction ledger separately preserves
    original bilingual text and unreviewed authored interpretations.
  early-counting-calendar: >
    early-identities.yaml and early-notes.yaml document the native-number
    numeral/determiner pairs, ordinal pairs, and explicit noun/adverb
    alternations for 그제, 모레, and 아까. Their new sense members extend
    existing identities where appropriate; counter and numeral forms do not
    inflate free-lemma breadth. Distinct date and duration senses of 며칠 and
    contextual uses of 나중 remain separate source positions.

lexicographic_review_flags:
  - source_parents: [ko-nikl-17144, ko-nikl-17145]
    issue: >
      대안 has separate source parents for a replacement proposal and a
      proposal to resolve a matter. Retain both provisional source boundaries
      pending Hanja/etymological review; similar English proves neither
      identity nor distinctness.
  - source_parents: [ko-nikl-17367, ko-nikl-17369]
    issue: >
      대학 and 대학교 overlap in the selected university meaning. Retain
      separate candidates pending a documented shortened-form decision;
      semantic overlap alone is not a variant crosswalk.
  - source_parents: [ko-nikl-19198]
    issue: >
      The source groups hold, raise, cite, and honorific eating together.
      Preserve the grouping provisionally, but obtain specific lexical review
      of the honorific use before making stronger identity claims.

homograph_and_source_position_notes:
  - >
    쓰다 write/use/wear/bitter, 눈 eye/snow, 배 belly/boat/pear/multiple,
    차 tea/vehicle/difference, and the selected 타다 predicates have separate
    semantic rationales in the live identity mapping. Same spelling and POS
    do not establish identity.
  - >
    들다 has distinct source groups for entering or coming into a state and
    holding/raising. Preserve individual common meanings within each group.
  - >
    Positive 네 uses ko-nikl-35345, not the four-counter or pronoun homographs.
    Grateful 감사하다 uses ko-nikl-26499, not the audit verb.
  - >
    Equal English in parents ko-nikl-07948, ko-nikl-09462, ko-nikl-26461,
    and ko-nikl-34299 does not merge their original Korean source positions.
  - >
    The figurative spring interpretation ko-nikl-09462-s003 is documented
    in the unchanged source-correction ledger, separately from the physical
    spring and spring-site meanings.

remaining_domain_review:
  - Broader useful general-interest vocabulary is still needed in later levels.
  - Continue targeted useful-domain curation without assigning unselected words a default advanced level.
  - Deepen everyday action verbs, discourse expressions, and contextual calendar practice.
  - Review further ingredients, personal care, services, and unfamiliar everyday problems.
  - Technology, environment, institutions, arts, and critical argument need more breadth.
  - Optional branches are introductions, not professional or disciplinary certification.

source_support_review:
  - >
    Targeted project and literary gaps now have original unbanded parents:
    재검토13016, 누락15352, 문체38489, explanatory 주석41767, 초안45112,
    and 은유50947. Every complete ordered definition list matches its official
    reading entry exactly. The long-vowel annotation 주ː석 is not the
    chairman or metal homograph. The two rough-draft senses share one identity.
  - >
    The original unbanded parent ko-nikl-43838 now supplies all three
    order, occasion, and elapsed-period senses of bound 차. Its exact
    official citation match is independent of the tea, vehicle, and difference
    homographs. It does not add a free lemma.
  - >
    The narrowly retained original support now includes 미안하다 38953 and
    피곤하다 23542, plus 필요하다 23722 and 행복하다 24830. All have exact
    spelling/POS/ordered-definition matches to official pronunciation text.
    Their actual dictionary records, not an unrestricted derivation, support them.
  - >
    시작하다 02914, 부탁하다 06699, 사랑하다 08289, 일하다 11654,
    대답하다 16978, 공부하다 29792, and 주문하다 41722 are independently
    retained unbanded verbs with original sense ordinals and exact official
    citation matches. Productive action-noun constructions still do not
    establish arbitrary additional lexical senses.

reading_handoff_policy: >
  Resolve only selected-parent reading requirements during integration.
  Official gaps on unselected words do not block a course. The source owner
  may add narrowly documented official matches or individually authored,
  explicitly unverified essential-gap readings. This file neither supplies
  readings nor retains a computed missing-reading snapshot.

