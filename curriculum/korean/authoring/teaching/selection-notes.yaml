    ko-lex-37110: >
      며칠 supplies a queried or indefinite date or day quantity. Keep its
      date and duration senses distinct within one functional identity,
      consistently with 얼마 rather than treating noun POS as content breadth.
    ko-lex-46742: >
      얼마 asks about an unknown amount, price, or degree. Its source noun
      label does not make it an ordinary lexical quantity noun for counting.
    ko-lex-48724: >
      왜 is an interrogative asking a reason. Count it with the other
      interrogatives rather than treating its source adverb label as proof of
      an open-class lexical identity.
    ko-lex-12261: >
      자신 supplies reflexive or emphatic personal reference. This selected
      source parent is not the confidence homograph or the noun 자존심.
    ko-lex-17430: >
