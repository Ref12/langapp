schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: partial curation; not complete-scale coverage
coverage_reporting: >
  The adapter-generated coverage report is authoritative for current counts.
  This file intentionally contains no computed coverage statistics or reading-gap
  snapshot. Report source parents, source senses, spellings, readings, and
  provisional lexical identities separately; none is interchangeable with a
  verified count of true Korean lexemes.

authoring_principles:
  - Select actual original source senses after inspecting their Korean meanings.
  - Keep source bands independent of teaching placements.
  - Do not assign curriculum from alphabetical order, record ordinals, or quotas.
  - Do not select every first sense or merge positions merely because English matches.
  - Use concise, natural, meaning-disambiguating labels rather than truncated definitions.
  - Treat additional meanings of common words as depth, not new headword breadth.
  - Keep specialist meanings optional rather than padding later general-interest levels.
  - Unselected uncategorized entries are not rejections and are not automatically advanced.
  - Keep essential vocabulary despite reading gaps; the source owner adjudicates readings.

file_contracts:
  vocabulary: >
    selection-files.yaml declares ordered explicit id, level, topic, and ds
    lists, beginning with vocabulary.yaml. Additional selections are not
    generated from source-band rules or discovered by a filesystem glob.
  identities: >
    lexical-identities.yaml and the declared additional identity fragments
    map each stable lexical ID directly to exactly lemma, category, members,
    source_parents, and rationale. Composition preserves the same lemma and
    category and appends only new sense members and source-parent evidence.
    Each selected source sense belongs to exactly one group. No live policy
    wrapper, POS field, or computed-statistics field belongs in an identity.
  tourist_labels: >
    support.yaml is owned by the tourist author. Its exact canonical labels
    govern overlapping source senses, without suppressing additional core senses.
  corrections: >
    source-corrections.yaml retains its original bilingual correction ledger.
    Raw source definitions are never changed by compact teaching labels.

identity_policy:
  stable_names: >
    ko-lex identifiers retain source-parent anchors only as stable local names.
    They are not official NIKL identities, and a parent-shaped name is not
    evidence that a dictionary parent is a distinct true lexeme.
  source_anchor_candidates: >
    A source-parent grouping is explicitly provisional. Its rationale records
    source POS, selected meanings, and any relevant homograph contrast.
    Retaining a reviewed source boundary is not proof of etymology or lexeme
    granularity. Except for the explicit multi-parent decisions, retain one
    conservative candidate for selected meanings of an inspected source parent.
    The manifest mechanically serializes these grouping decisions and the
    authored memberships; it does not generate new curriculum assignments.
    Do not market these candidates as verified lemma breadth.
  polysemy: >
    Keep selected literal and figurative meanings together when the authored
    identity analysis supports doing so. Preserve their individual source IDs,
    labels, and teaching placements. Additional meanings are not separate lemmas.
  variants: >
    Merge only with an explicit variant or category-alternation analysis.
    Similar English meanings alone do not establish identity. Synonyms such as
    계란/달걀, 부엌/주방, 네/예, and 높임말/존댓말 remain separate candidates.
  inflection: >
    Inflected greetings and commands are not new vocabulary lemmas.
    Source-backed action nouns and independent 하다 can support productive
    constructions such as 공부를 해요 or 주문을 해요. Joined forms still require
    an explicit reviewed realization; this does not fabricate dictionary
    senses for 공부하다 or authorize arbitrary X하다 verbs.
  evidence_limits: >
    Source Korean definitions and POS supply semantic evidence, not proof of
    frequency, Hanja identity, etymology, teacher approval, or exam alignment.
    Pronunciation evidence does not establish lexical identity.

category_adjudication:
  free-lemma: >
    Independently usable lexical content, including ordinary nouns, predicates,
    lexical adverbs, and lexical -적 modifiers, is retained as free-lemma.
    Source-anchored candidates remain provisional even when classified here.
    A lexical container noun with an additional counter use counts once, as
    does the explicit 시간 time/hour group; its counter use adds no lemma.
  bound-form: >
    The listed identities are dependent nouns, counters, units, or a bound
    personal title. They are not counted as free lexical headwords. This is an
    explicit decision for these selected identities, not an automatic spelling rule.
