ko-lex-00499: {lemma: 세율, category: free-lemma, members: [ko-nikl-00499-s001], source_parents: [ko-nikl-00499], rationale: 'An actual statutory-reference tax-rate noun, not a supplied current rate or a mathematical comparison operator.'}
ko-lex-00678: {lemma: 소득세, category: free-lemma, members: [ko-nikl-00678-s001], source_parents: [ko-nikl-00678], rationale: 'The source concerns an individual''s yearly earnings; do not silently make it a corporate-tax definition or universal current liability rule.'}
ko-lex-02042: {lemma: 수표, category: free-lemma, members: [ko-nikl-02042-s001], source_parents: [ko-nikl-02042], rationale: 'The actual bank-payable written certificate is a cheque, not a checklist, guaranteed merchant acceptance or evidence that an instrument is valid.'}
ko-lex-05451: {lemma: 변제, category: free-lemma, members: [ko-nikl-05451-s001], source_parents: [ko-nikl-05451], rationale: 'Repaying a debt is a source-backed noun for general financial reading, not a legal determination that someone owes an amount or is discharged.'}
ko-lex-06985: {lemma: 분할, category: free-lemma, members: [ko-nikl-06985-s001], source_parents: [ko-nikl-06985], rationale: 'Generic splitting into parts is not an invented installment-payment sense. Financial or task contexts do not replace the broad original definition.'}
ko-lex-08459: {lemma: 사용료, category: free-lemma, members: [ko-nikl-08459-s001], source_parents: [ko-nikl-08459], rationale: 'Actual usage-fee noun. Similar meaning to 이용료 does not prove a spelling variant or infer an amount, billing method or enforceable charge.'}
ko-lex-09307: {lemma: 상환, category: free-lemma, members: [ko-nikl-09307-s001], source_parents: [ko-nikl-09307], rationale: 'The source includes returning borrowed things as well as money. Do not narrow every use to debt-money repayment or import a repayment schedule.'}
ko-lex-09970: {lemma: 선금, category: free-lemma, members: [ko-nikl-09970-s001], source_parents: [ko-nikl-09970], rationale: 'Advance money for buying or borrowing is not automatically a refundable security deposit, a universal contract requirement or a current practice recommendation.'}
ko-lex-10875: {lemma: 이용료, category: free-lemma, members: [ko-nikl-10875-s001], source_parents: [ko-nikl-10875], rationale: 'The actual fee-for-use word is retained separately from synonymous 사용료 under the explicit synonym policy. No subscription-only or facility-only restriction is invented.'}
ko-lex-10893: {lemma: 이율, category: free-lemma, members: [ko-nikl-10893-s001], source_parents: [ko-nikl-10893], rationale: 'Borrowed-money interest rate follows this source, unlike the protected 금리 parent''s additional deposit-interest scope. No rate, compounding method or earned return is promised.'}
ko-lex-10979: {lemma: 이체, category: free-lemma, members: [ko-nikl-10979-s001], source_parents: [ko-nikl-10979], rationale: 'Actual account-to-account movement is not every kind of remittance, a cash-only deposit, an authorization to move money or a promise of settlement timing.'}
ko-lex-11297: {lemma: 인출, category: free-lemma, members: [ko-nikl-11297-s002], source_parents: [ko-nikl-11297], rationale: 'The actual second position withdraws deposited money; generic physical drawing-out position1 remains unselected and supplies no financial meaning by itself.'}
ko-lex-11788: {lemma: 입금, category: free-lemma, members: [ko-nikl-11788-s001], source_parents: [ko-nikl-11788], rationale: 'Putting funds into a financial account is distinct from between-account transfer or withdrawal; the word does not imply physical cash, cleared funds or account ownership.'}
ko-lex-12547: {lemma: 잔고, category: free-lemma, members: [ko-nikl-12547-s001], source_parents: [ko-nikl-12547], rationale: 'The actual remaining-money balance is not proof of available spending funds. An identical Korean definition in 잔액 is semantic equivalence, not a variant/inflection analysis or shared mastery.'}
ko-lex-12550: {lemma: 잔금, category: free-lemma, members: [ko-nikl-12550-s001, ko-nikl-12550-s002, ko-nikl-12550-s003], source_parents: [ko-nikl-12550], rationale: 'Unspent money, unpaid money and a final purchase installment are separate source positions within one family, not thin-line homograph12549 or three new headwords.'}
ko-lex-12573: {lemma: 잔액, category: free-lemma, members: [ko-nikl-12573-s001], source_parents: [ko-nikl-12573], rationale: 'The actually named remaining amount supports account/statement reading. Exact definition overlap with 잔고 does not establish a morphological variant or validate a displayed balance.'}
ko-lex-13513: {lemma: 적금, category: free-lemma, members: [ko-nikl-13513-s001], source_parents: [ko-nikl-13513], rationale: 'Actual generic money accumulation deepens the previously selected periodic bank-saving product. It adds no free family, interest promise or automatic product-specific knowledge.'}
ko-lex-21768: {lemma: 통장, category: free-lemma, members: [ko-nikl-21768-s001], source_parents: [ko-nikl-21768], rationale: 'The institution-provided depositor passbook records deposits/withdrawals. It is not the financial account itself or a fabricated source for generic accounting ledger 장부.'}
ko-lex-28712: {lemma: 계좌, category: free-lemma, members: [ko-nikl-28712-s001], source_parents: [ko-nikl-28712], rationale: 'The actual savings/loan record is a financial account, not an online login account, credential, financial permission or a substitute for the separately documented 계정 gap.'}
ko-lex-30139: {lemma: 과세, category: free-lemma, members: [ko-nikl-30139-s001], source_parents: [ko-nikl-30139], rationale: 'Setting a tax and requiring payment is not proof of successful collection; no current taxable item, entitlement or applicable law is supplied.'}
ko-lex-37147: {lemma: 면세, category: free-lemma, members: [ko-nikl-37147-s001], source_parents: [ko-nikl-37147], rationale: 'The exemption-from-taxation process is not a waiver of every fee, actual eligibility for exemption or the separate shop noun 면세점.'}
ko-lex-37148: {lemma: 면세점, category: free-lemma, members: [ko-nikl-37148-s001], source_parents: [ko-nikl-37148], rationale: 'An actual airport/downtown shop selling tax-exempt goods is a content noun, not a tax-free allowance, a promise all buyers qualify or a generated shop-name catalogue.'}
ko-lex-37272: {lemma: 명세서, category: free-lemma, members: [ko-nikl-37272-s001], source_parents: [ko-nikl-37272], rationale: 'A detailed item/quantity/money statement is not necessarily a demand to pay or proof that its contents are correct. Preserve monetary contents omitted by the English goods-only wording.'}
ko-lex-44802: {lemma: 청구서, category: free-lemma, members: [ko-nikl-44802-s001], source_parents: [ko-nikl-44802], rationale: 'A requesting document is distinct from the protected 청구 action, as existing report/application documents are distinct from their actions. It can request things other than money and does not prove liability.'}
ko-lex-45689: {lemma: 출금, category: free-lemma, members: [ko-nikl-45689-s001], source_parents: [ko-nikl-45689], rationale: 'Taking funds from a financial account describes an operation, not ownership, authorization, withdrawal availability or an actual executed transfer.'}
ko-lex-47572: {lemma: 연체료, category: free-lemma, members: [ko-nikl-47572-s001], source_parents: [ko-nikl-47572], rationale: 'The extra charge depends on overdue days for money or an item. The definition supplies neither a fixed rate nor a universal policy that such a charge is always due.'}
ko-lex-48902: {lemma: 외화, category: free-lemma, members: [ko-nikl-48902-s002], source_parents: [ko-nikl-48902], rationale: 'Actual imported money-or-goods position2 extends the old foreign-currency-only selection. It is not a foreign-film homograph, general foreign-exchange-bill meaning or another free family.'}
ko-lex-49986: {lemma: 위약금, category: free-lemma, members: [ko-nikl-49986-s001], source_parents: [ko-nikl-49986], rationale: 'Money promised to the other contracting party for a breach is not a legal ruling that the promise is enforceable, that a breach occurred or that a particular amount is owed.'}
