schema_version: 1
id: ko-early-counting-calendar
review_status: Original AI-authored selection, labels, and identity analyses; qualified Korean-teacher and lexicographic review required.
source_basis: >
  Inspected the Korean and English definitions and source POS in the current
  source-senses.yaml for every selected sense. IDs retain original CSV-record
  and definition-list positions; they are not official NIKL sense identifiers.
  Base vocabulary and lexical identities were checked before adding these rows.
  Evidence excerpts below trim surrounding whitespace for display; the source
  registry retains the original text.
scope: >
  Bounded early counting, counter, calendar, and ordering additions. These are
  explicit communicative selections, not an automatic first-sense import,
  frequency ranking, source-band conversion, or quota-completion claim.
owned_files:
  - early-vocabulary.yaml
  - early-identities.yaml
  - early-notes.yaml
composition:
  vocabulary: Append the new rows only after checking for duplicate sense IDs across the parent's selected shards.
  identities: >
    Values have exactly lemma, category, members, source_parents, and rationale.
    Five existing-group fragments contain only NEW members and NEW parents.
    Match the existing lemma/category and union their membership with the base;
    do not replace the base members or create another group for an adnominal form.
    New groups are complete provisional analyses for their selected members.
  unchanged: >
    No base selection, base identity, source registry, reading overlay, script,
    grammar, support label, or other worker file is changed by this shard.
    selection-files.yaml now registers these shards; the parent supplies
    independently documented official citation crosswalks where needed.
  counting: >
    There are 51 added sense selections from 49 previously unselected parents,
    represented by five existing-group fragments and 27 new groups.
    The new groups comprise 15 function-item identities, four bound-form
    identities, and eight provisional free-lemma identities. Neither source
    parents nor senses may be reported as 51 new free lemmas.

category_roles:
  function-item: >
    Numerals and their determiners express the same numerical value in
    different grammatical roles. Ordinal pairs express the same ordered
    position. Preserve separate source senses but count each paired value
    or position as one function identity, never as duplicated free-lemma breadth.
    며칠 supplies interrogative or indefinite date/day-quantity reference;
    like the base 얼마 analysis, its noun POS does not make it an ordinary
    open-class content noun for coverage counting.
  bound-form: >
    살 and 세 count age, 인분 measures person-portions, and the selected 대
    counts vehicles or equipment. These units do not contribute free-lemma
    breadth. Similar English meanings do not merge 살 with 세, and identical
    spelling does not merge counter 세 with the determiner for three.
  free-lemma: >
    Calendar and relative-time words follow the base's provisional time-word
    treatment. The noun/adverb pairs for 그제, 모레, and 아까 are explicitly
    grouped by shared temporal reference, like the existing 오늘/내일 groups.
    Extra senses of the functional 며칠 and lexical 나중 add contextual depth,
    not additional lemmas.

existing_identity_extensions:
  ko-lex-18823: {lemma: 둘, base_member: ko-nikl-18823-s001, new_member: ko-nikl-18696-s001, contrast: independent 둘 versus before-noun 두}
  ko-lex-00561: {lemma: 셋, base_member: ko-nikl-00561-s001, new_member: ko-nikl-00354-s001, contrast: independent 셋 versus before-noun 세}
  ko-lex-35372: {lemma: 넷, base_member: ko-nikl-35372-s001, new_member: ko-nikl-35343-s001, contrast: independent 넷 versus before-noun 네}
  ko-lex-16185: {lemma: 다섯, base_member: ko-nikl-16185-s001, new_member: ko-nikl-16186-s001, contrast: standalone numeral versus same-spelling determiner}
  ko-lex-47109: {lemma: 여섯, base_member: ko-nikl-47109-s001, new_member: ko-nikl-47110-s001, contrast: standalone numeral versus same-spelling determiner}

teaching_decisions:
  - level: 3
    purpose: >
      Correct an order or small quantity; distinguish a standalone number
      answer from a number before a noun/counter. Complete the missing
      native two-through-nine roles without counting their variants as new
      free lemmas. The source-backed 하나/한 and native 열 already in the base
      remain review material, not duplicate additions.
    usage: >
      두, 세, and 네 supply the actual adnominal forms, not the unmodified
      standalone 둘, 셋, and 넷 before ordinary counters. Same-spelling
      다섯 through 아홉 still have distinct source numeral/determiner roles.
      Pair their uses within a lesson rather than presenting each as unrelated
      new vocabulary. 인분 supplies a person-portion request; it normally
      uses Sino-Korean numbers, unlike the native-number person counter 명.
      A portion unit does not guarantee how much food a restaurant serves.
  - level: 4
    purpose: >
      Anchor routines and plans to last/this/next year, last week, the day
      before yesterday, the day after tomorrow, and the recent past.
      Distinguish asking a date of the month from asking a duration.
    usage: >
      Noun/adverb source roles support a named time with a particle versus
      direct adverbial event placement; they do not introduce another day
      or another free lemma. 아까 means a short time ago, not necessarily
      exactly one minute despite the narrower English wording of its adverb
      gloss. 며칠-s001 concerns a date; 며칠-s002 concerns a number of days,
      with interrogative or indefinite force supplied by context.
  - level: 5
    purpose: >
      Discuss a familiar person's age when relevant and coordinate household
      tasks postponed until later. Introduce twenty, thirty, and forty with
      both standalone and before-counter roles, including 스물/스무.
    usage: >
      살 takes native-number age expressions in the ordinary practice here.
      The age counter does not itself determine an age-calculation convention.
      Exact twenty before a counter uses 스무; do not extend that change
      indiscriminately to every compound beginning with 스물. Compound
      numbers are compositional practice, not additional source-sense rows.
      나중-s002 marks doing something after another task first, rather than
      merely waiting for time to pass as in the earlier s001 use.
  - level: 6
    purpose: >
      Interpret an age field or a relevant care/service question, and review
      fifty and sixty in everyday number use without professional claims.
    usage: >
      세 is the age unit ordinarily combined with Sino-Korean numbers in this
      formal-field practice; it is not determiner 세 meaning three. Keep 살
      and 세 separate lexical units while practicing a suitable register.
      Do not solicit personal age information merely to satisfy a vocabulary
      checklist or imply medical or official age-calculation advice.
  - level: 7
    purpose: >
      Specify a vehicle count and order the first, second, and third parts or
      days of a short itinerary. Apply earlier native-number forms with 대.
    usage: >
      The selected 대 counts vehicles, machines, and instruments, not a
      generational or ratio unit. 첫째/둘째/셋째 here mark positions in
      a sequence. Their separate source nouns for children or count totals
      are not selected by using an ordinal. A before-noun ordinal and an
      independently named position remain one function identity.
  - level: 8
    purpose: >
      Extend native counting to seventy, eighty, and ninety for relevant
      quantities or biographical information in relationship-sensitive contexts.
    usage: >
      Reuse the earlier counter and number-role contrasts. The larger tens
      are functional extensions of practical counting, not advanced-language
      competence claims or a reason to manufacture all possible number rows.
      Each paired numeral/determiner value is one function identity.

