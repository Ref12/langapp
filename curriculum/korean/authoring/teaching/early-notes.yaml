excluded_or_deferred:
  - source_senses: [ko-nikl-34291-s003]
    korean: 순서나 시간의 맨 끝.
    english: The very last of a certain order or time.
    reason: >
      Terminal-rank or final-endpoint meaning is distinct from the selected
      later-time and after-another-task senses. It is deferred rather than
      automatically selected with every sense of this parent or deemed advanced.
  - source_parents: [ko-nikl-44781, ko-nikl-18842, ko-nikl-00566]
    reason: >
      These noun parents include an eldest/second/third child, precedence,
      or totals of two/three. They are not selected by adding the ordinal
      numeral/determiner parents and must not enter the ordinal identities.
  - source_parents: [ko-nikl-35345, ko-nikl-35341]
    reason: >
      These are not the determiner 네 defined as 넷의. Preserve any existing
      affirmative/pronominal selections in their own identities; do not merge
      them into native-number four because their spelling matches.
  - source_parents: [ko-nikl-16856, ko-nikl-16860, ko-nikl-16865, ko-nikl-16869, ko-nikl-16871]
    reason: >
      Rod/stem, long-object counting, lineage/generations, ratio/opposition,
      and age-decade uses of 대 are not the selected vehicle/equipment unit.
  - decision: >
      Do not create separate source selections or identities for every compound
      native number, digit spelling, counter combination, age expression, or
      inflected calendar phrase. Practice compositional combinations using
      their actually introduced components and documented grammar.

reading_evidence:
  policy: >
    Four initially unresolved parents now have individual official citation
    crosswalks in reading-matches.yaml. The sole same-spelling/POS candidate's
    complete Korean definition was compared separately for each parent.
    Wording updates preserve the original referents; the original source
    senses and reference bands do not change. Other selected parents already
    had nonempty official overlay readings. This is citation text, not audio
    evidence or verification of inflected phrases.
  entries:
    - {parent_id: ko-nikl-12452, lemma: 작년, official_entry_id: '30184', citation: 장년}
    - {parent_id: ko-nikl-32142, lemma: 그제, official_entry_id: '30858', citation: 그제}
    - {parent_id: ko-nikl-32143, lemma: 그제, official_entry_id: '30859', citation: 그제}
    - {parent_id: ko-nikl-48477, lemma: 올해, official_entry_id: '67842', citation: 올해}
remaining_limits:
  - These additions do not complete the overall vocabulary-scale target or certify language proficiency.
  - Number systems and age or serving conventions require contextual instruction and qualified review.
  - No learner stage, pronunciation accuracy, or audio performance follows from source selection.
