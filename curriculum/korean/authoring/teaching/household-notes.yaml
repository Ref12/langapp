limitations: >
  These are communication meanings, not instructions for electrical, medical,
  chemical, or tool use. Dictionary labels do not establish safe procedures,
  equipment compatibility, or clinical competence. Language naturalness,
  sense boundaries, and lexical family accounting remain unreviewed.
