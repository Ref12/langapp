schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: integrated selections; linguistic and lexical review remains pending
scope: >
  Concrete cleaning, washing, cooking, small repair, and gardening equipment.
  Social roles and abstract connections remain in the society cohort. Literal
  매듭 positions 1 and 4 are selected here; the abstract positions 2 and 3
  remain available to the separately owned society cohort.
selection_policy: >
  All labels and placements follow inspection of exact bilingual source
  positions. Specifically missing words were located in the pinned original
  CSV, including competing homographs. No automatic first-sense import,
  compound manufacture, or numeric/source-band placement rule is used.
  Ordinary household items remain early rather than being moved to imitate
  later-phase growth.
identity_policy: >
  New members extend existing 걸레 and 바늘 identities without changing
  their lemma or category. Container/tool measures for 바가지 and 삽 add
  source senses but not separate free lemmas, following the existing 병/잔
  treatment. All lexical identities are provisional; no POS-based classifier
  or global derivational suffix rule is used.
lexical_review_flags:
  - 나사 and 나사못 overlap in fastener meaning; their separate source-backed headword accounting needs review.
  - 세면기 describes a washing bowl; 세면대 explicitly includes water-supply facilities.
  - The old/dirty-item 걸레 sense is not extended to unlicensed gendered or personal insults.
  - 테이프 position 1 does not itself assert adhesive material or electrical insulation.
  - A scoopful or shovelful is not a fixed metric volume.
  - 바가지 position 3 preserves excessive pricing; it does not establish fraud in any real transaction.
  - 드라이버 has only screwdriver and golf-club meanings in the selected source, not software or a motorist.
  - 믹서 is a food appliance here, not an audio console.
  - The dryer is parent 27657, not the dry-season homograph 27656.
  - The saw is parent 21655, not ranking/headline homograph 21656.
source_integration: >
  The thirty-one specifically selected unbanded parents below are retained
  with all original positions, bringing the registry to 102 support parents.
  Full composition with society has no repeated sense IDs. The compatible
  매듭 fragments merge into one identity, so household adds 39 rather than
  40 free identities after society. Original TOPIK files remain untouched.
