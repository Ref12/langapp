reading_policy: >
  Thirty-six selected senses have official citation text. Eight parents
  covering ten senses have individually documented authored readings because
  their exact complete-definition matches contain no pronunciation text.
  These proposals remain unreviewed. 플랫폼 explicitly becomes 플랟폼
  through final-stop neutralization; 백미러 becomes 뱅미러 through nasal
  assimilation. 교통 카드 retains its source word boundary. Neither
  unchanged spelling nor these rule applications imply dictionary or audio
  verification. There are no remaining selected reading gaps.
