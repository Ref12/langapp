schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: integrated selections; linguistic and lexical review remains pending
scope: >
  Concrete transport, route-finding, ticketing, and vehicle-equipment gaps
  discovered through practical tasks. Human roles and institutional/economic
  explanation remain in the society cohort. The unrelated 도로 adverb is
  reserved for the predicate cohort, not substituted for a road noun.
selection_policy: >
  Inspect exact retained bilingual positions before writing each label.
  The original CSV was queried for specifically missing spellings; no
  first-sense, source-band, alphabetical, or numerical-quota rule selected
  entries. Necessary ordinary transport words remain early even though this
  does not manufacture later-phase growth.
identity_policy: >
  Each declared identity is a provisional free lexical candidate. Polysemy
  of 차량, 차로, 트렁크, 핸들, and 길목 adds senses, not headwords.
  Similar English glosses do not turn unrelated Korean words into spelling
  variants. Actual source parents and their original ordinals remain authoritative.
source_spelling:
  ko-nikl-30790: >
    Exact concatenated 교통카드 was not found, but a targeted check of source
    word spacing located the genuine headword 교통 카드 at record 30790.
    Retain its space and empty POS. Its nominal-compound identity is an
    explicit reviewable judgment, not a claim that every phrase is a lemma.
source_boundaries:
  ko-nikl-21105: Rubber tire, not Thai-language homograph ko-nikl-21104.
  ko-nikl-23503: Railway platform only; no computing sense exists in this source position.
  ko-nikl-52299: Only position 2 backward motion is selected here; other positions remain unaltered.
  ko-nikl-14416: Specified period, route, and trips do not imply unlimited travel.
  ko-nikl-27166: Ticket checking is not restricted to automated railway turnstiles.
  ko-nikl-51632: Both road and rail freight vehicles remain within the original meaning.
  ko-nikl-14853: No unsourced figurative policy-obstruction sense is added.
  ko-nikl-41885: Permission to park is not a parking fine.
  ko-nikl-33248: Literal route senses precede the separately marked figurative period transition.
