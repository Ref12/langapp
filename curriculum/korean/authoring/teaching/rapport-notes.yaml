pragmatic_limits:
  - >
    눈치 names both ability to interpret unspoken cues and observable cues.
    It does not establish accurate mind-reading or a universal cultural
    trait. Inferred intent, hidden meaning and sincerity require context;
    the curriculum does not score a person's character from wording.
  - >
    Flattery, pretense, empty formalities and coarse 인정머리 can be
    critical or offensive. Recognition is useful, but these are not neutral
    labels for every compliment, polite convention or unfamiliar style.
    Teaching fictional repair/interpretation does not recommend insults.
  - >
    Individual-rights priority 개인주의001 and its pejorative self-centered
    position002 remain separate. Do not equate all individualism with
    selfishness, all altruism with compulsory sacrifice, or either with
    a demographic group.
  - >
    Source 애정002 specifically names a man and woman; source 우애 names
    brothers or friends. Preserve those wordings, but do not teach them
    as exhaustive restrictions on affection or valid relationships.
    The existing general 애정001 remains separately available.
  - >
    Feelings of guilt, shame, mistrust, exclusion, affinity or social distance
    are not proof of external facts or wrongdoing. Self-reproach is not
    advice. Infant stranger distress, sensitivity and social discomfort
    are not diagnoses; ability nouns do not establish learner competence.
  - >
    Patience and acceptance do not oblige a person to endure harm. Gratitude,
    reciprocal gifts and humble deference do not impose universal social
    obligations. Understanding 양해 is not automatic permission.
  - >
    유감 expresses regret, disappointment or dissatisfaction; it need not
    admit fault or constitute an apology. 냉정 composure is not 냉담
    unfriendly indifference. Genuine intent and unchanged intent are
    distinct 본심 positions, not interchangeable evidence.
  - >
    Proud display 과시001 does not entail exaggeration under002. A sense
    of responsibility, mission or worthwhile work does not prove completion
    or proficiency. Keep all per-item modalities and stages separate.
