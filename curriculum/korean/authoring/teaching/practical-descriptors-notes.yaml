source_correction_requests:
  ko-nikl-04857-s001:
    source_korean: "잘못한 것이 없이 꾸중을 듣거나 벌을 받게 되어 억울하다."
    source_english: "Feeling mortified because one has been scolded or punished even though one did nothing wrong. "
    authored_interpretation: to feel wronged by undeserved scolding or punishment
    rationale: Preserve feeling unjustly treated, not mere embarrassment from English mortified; keep undeserved scolding/punishment as the explicit source condition.
  ko-nikl-26183-s001:
    source_korean: "군더더기가 없이 단순하고 간단하다."
    source_english: "Something that is simple and easy without anything superfluous."
    authored_interpretation: to be simple and free of superfluous parts
    rationale: Simplicity without extraneous parts does not necessarily make a task easy; avoid the added English ease requirement.
  ko-nikl-26217-s001:
    source_korean: "간단하고 분명하다."
    source_english: "Spoken or written in a clear and concise manner. "
    authored_interpretation: to be simple and clear
    rationale: The Korean describes simplicity and clarity without restricting the subject to spoken/written language.
  ko-nikl-37946-s002:
    source_korean: "두드러지는 단점이나 흠이 없다."
    source_english: "Having no recognizable shortcoming or defect."
    authored_interpretation: to have no conspicuous flaw or shortcoming
    rationale: No salient defect is not the same as no detectable flaw or a promise of perfection.
  ko-nikl-49171-s001:
    source_korean: "어렵지 않고 매우 쉽다."
    source_english: "Not difficult."
    authored_interpretation: to be very easy, not difficult
