  ko-nikl-03373: A bound rooms counter, not textile thread.
  ko-nikl-03759: Excretion, distinct from the protected wrapping and inexpensive predicates.
  ko-nikl-07398: Bodily swelling, not pouring or periodic money deposits.
  ko-nikl-07399: Pouring and periodic deposits, not bodily swelling.
  ko-nikl-09344: Leakage and departure from a channel or topic, not daybreak.
  ko-nikl-09345: Daybreak, not leakage.
  ko-nikl-12801: A person's strongest skill, not a duration, internal organs, or a board game.
  ko-nikl-12802: A long period, not a person's special talent or internal organs.
  ko-nikl-12804: Internal organs, not a long period or special talent.
  ko-nikl-14545: Normal functioning or condition, not a summit or national leader.
  ko-nikl-14547: Summit and highest-ranking national leader, not normal functioning.
  ko-nikl-16267: Strengthening resolve, foundations, or relationships, not mincing ingredients.
  ko-nikl-16268: Mincing food, not strengthening resolve or foundations.
  ko-nikl-16660: An enclosing wall, not the sequence-reference 담 source.
  ko-nikl-19621: Time, occasion, and circumstance, not grime or worldly impurity.
  ko-nikl-19622: Grime and figurative impurity, not a moment or circumstance.
  ko-nikl-22029: Bouncing or scattering, not frying or puffing grains.
  ko-nikl-22030: Cooking by frying or puffing, not making an object bounce.
  ko-nikl-26019: A plant branch and its figurative offshoot, not a kinds counter or eggplant.
  ko-nikl-26023: A bound kinds counter, not a botanical branch or eggplant.
  ko-nikl-26989: Weather clearing, not folding clothes.
  ko-nikl-26991: Neatly folding fabric, not weather clearing.
  ko-nikl-33272: Vapor, condensation, warm breath, and dissolved gas, not dried edible seaweed.
  ko-nikl-33276: Dried edible seaweed, not vapor or gas.
  ko-nikl-33521: Awakening and sobering, not physical or figurative breaking.
  ko-nikl-33523: Breaking and overcoming barriers, not awakening or sobering.
  ko-nikl-33526: The expanded breaking form, grouped with breaking 깨다, not awakening 깨다.
  ko-nikl-36339: Preventing someone from acting, not drying moisture.
  ko-nikl-36340: Drying, not stopping another person's action.
  ko-nikl-38541: Dirt or liquid adhering, not burying or questioning.
  ko-nikl-38542: Burying, covering up, or hiding the face, not asking a question or dirt adhering.
  ko-nikl-38543: Asking or holding accountable, not burying or becoming dirty.
  ko-nikl-38548: Being covered or obscured, not causing liquid or powder to adhere.
  ko-nikl-38549: Getting liquid or powder onto another surface, not being buried.

review_flags:
  - >
    Passive, causative, and compound verb families still require lexical review.
    Examples include 쌓다/쌓이다, 넘어지다/넘어뜨리다, 부수다/부서지다,
    눕다/눕히다, and 부딪치다/부딪히다. They are actual source predicates,
    not generated conjugations. Their separate provisional source candidates
    do not establish a verified true-lexeme count or interchangeable syntax.
  - >
    Asking 묻다 and the dirt/burying homographs require different inflectional
    treatment. Exact source identities are retained; this shard supplies no
    new realization rule or fabricated surface form.
  - >
    Existing free-lemma categories for 잃다 and 잊다 are unchanged. If later
    lexical review revises a grouping or count category, do so explicitly
    rather than silently reclassifying a fragment during composition.
  - >
    A compact mushroom label does not endorse the source definition's older
    plant classification. Food-production descriptions in the raw dictionary
    are not verified scientific procedures or health advice.
  - >
    Bodily-function vocabulary and source-marked slang need contextual and
    register review before dialogue authoring. No selected noun automatically
    licenses an unverified joined noun-plus-hada lexical predicate.

source_correction_requests:
  ko-nikl-44171-s001:
    source_korean: 창문과 가까운 곳이나 옆.
    source_english: The area immediately behind a window.
    authored_interpretation: the area beside or near a window
    rationale: >
      The Korean says near or beside the window, not specifically behind it.
      The label removes the unsupported directional restriction.
  ko-nikl-26019-s001:
    source_korean: 나무나 풀의 큰 줄기에서 갈라져 나간 작은 줄기.
    source_english: A small twig broken off from a branch of a tree or blade of grass.
    authored_interpretation: a branch or twig growing off a larger stem
    rationale: >
      The Korean describes a smaller stem branching from a larger one.
      It does not require that the branch has broken off or become detached.
  ko-nikl-33272-s002:
    source_korean: 수증기가 차갑게 되어 엉긴 작은 물방울.
    source_english: Small droplets made when steam becomes frozen.
    authored_interpretation: tiny water droplets formed as vapor cools
    rationale: >
      The Korean describes cooled vapor collecting into small liquid droplets,
      not freezing into ice. Preserve this second position as distinct from
      heated vapor, warm breath, and gas in a drink.
  ko-nikl-33272-s004:
    source_korean: 탄산음료 속에 녹아 들어가 있는 이산화 탄소.
    source_english: Carbon dioxide melted in soda.
    authored_interpretation: carbon dioxide dissolved in a fizzy drink
    rationale: >
      The Korean describes carbon dioxide dissolved in a carbonated drink.
      The English's melted incorrectly suggests a different physical process.
  ko-nikl-33542-s002:
    source_korean: 약속이나 일 등이 지켜지거나 이루어지지 않다.
    source_english: To break a promise, or something.
    authored_interpretation: for a promise or undertaking to fall through
    rationale: >
      The Korean describes a promise not being kept or an undertaking not
      being realized. The English's active break obscures that result-state
      perspective. Keep it distinct from the selected agentive breaking senses.
  ko-nikl-43829-s001:
    source_korean: 도구에 의해서나 잡아당겨져 갈라지다.
    source_english: To be split by using a tool or being pushed apart.
    authored_interpretation: to be torn apart by pulling or by a tool
    rationale: >
      The Korean specifies being pulled apart, not pushed apart. The label
      preserves that direction and the alternative use of a tool.
  ko-nikl-35277-s001:
    source_korean: 볕을 쬐거나 바람을 쐬어 말리기 위하여 펼쳐 놓다.
    source_english: To hang washed clothes out to be dried in the sun or wind.
    authored_interpretation: to spread something out to dry in the sun or air
    rationale: >
      The Korean describes spreading something for drying in sun or air.
      It does not restrict the object to washed clothes or require hanging.
      The label retains the general drying action without inventing new senses.

remaining_gaps:
  - The broad core-lemma planning aspiration remains unmet.
  - This is a targeted practical addition, not an exhaustive review of unselected entries.
  - Remaining transport, consumer-service, work, and social vocabulary deserves further targeted curation.
  - Teacher and lexical-family review are still required before claiming exact true-lexeme breadth.
  - Citation text and authored readings do not establish pronunciation mastery or validate learner audio.

reading_resolution:
  status: All parents in the historical list below have a documented reading.
  official_text_parents: 33
  authored_unreviewed_parents: 17
  limitation: >
    These are method counts for this fixed handoff cohort, not live curriculum
    totals. The authored readings are individual phonological proposals where
    official text is absent; spelling agreement is not a fallback or evidence
    of dictionary/audio verification.

