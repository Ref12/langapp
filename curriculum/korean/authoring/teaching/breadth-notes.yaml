schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: coherent practical-breadth addition; not complete-scale coverage

scope:
  - Only breadth-vocabulary.yaml, breadth-identities.yaml, and this file are authored here.
  - All base, early, and expansion selections and identity groups remain protected.
  - Source records, readings, corrections, manifests, grammar, and shared code are unchanged.
  - Vocabulary placements and labels were manually authored after bilingual source inspection.
  - Topic-oriented searches discovered candidates but never selected or scheduled them automatically.
  - Neither source bands nor alphabetic order nor numeric targets determine teaching placement.
  - No inflected phrase or invented noun-plus-hada predicate is added as a vocabulary headword.

integration:
  selection_manifest: >
    selection-files.yaml registers breadth-vocabulary.yaml and
    breadth-identities.yaml after the base, early, and expansion files.
    Duplicate placements are rejected. Existing identity fragments contain
    only new members and preserve their existing canonical lemma and category.
  corrections: >
    The source_correction_requests below are incorporated into the parent-owned
    ledger with exact original bilingual text and explicitly unreviewed authored
    interpretations. Prior corrections and their evidence remain unchanged.
  readings: >
    original_reading_gaps preserves the historical handoff, not current missing
    readings. Every listed parent now has official citation text or an
    individually reasoned authored reading. Current per-item methods are in
    source-provenance.yaml; authored choices remain unreviewed.
  existing_identity_extensions:
    ko-lex-11671: Adds source-backed completion-emphasized loss forms under existing 잃다.
    ko-lex-11966: Adds source-backed completion-emphasized forgetting forms under existing 잊다.

curation_rationales:
  earlier_prerequisites: >
    Household objects and cleaning belong with living at home; personal-care
    products and symptoms support shopping and care; waking, showering, and
    postponing support routines and plans. These words were not delayed just
    to increase narration-phase totals. Previously selected words were not moved.
  connected_narration: >
    Spilling, slipping, dropping, bumping, breaking, picking up, getting wet,
    losing belongings, and looking around enable connected accounts of ordinary
    events. Original agentive and result-state positions remain separate.
    Visits, picnics, games, cooking, and shared meals supply concrete participants,
    objects, settings, and outcomes instead of abstract nouns alone.
  cooking_and_material_change: >
    Select actual boiling, warming, blanching, mincing, frying, stirring, and
    pouring senses. 김 distinguishes heated vapor, condensed droplets, warm
    breath, and dissolved gas from the separate dried-seaweed parent. Do not
    teach condensation as freezing or dissolution as melting.
  service_and_travel_complications: >
    Missing transport, congestion, leaks, blocked passages, damaged objects,
    wet belongings, ticket offices, admission tickets, and schedule changes
    support specific everyday problems. 막히다's traffic position is not
    silently replaced by its more general blocked-opening position.
  ordinary_social_communication: >
    Questions, passing remarks, drifting off topic, overlooking another's words,
    refusal gestures, encouragement, changing opinions, and shifting responsibility
    support ordinary interaction. More demanding accountability, inference,
    public disclosure, and institutional restrictions keep their appropriate
    later contexts rather than becoming beginner senses by association.
  restrained_optional_selection: >
    Combining several things under one organizational system is optional
    professional vocabulary. A source's unrelated, technical, or insulting
    positions are not automatically included. No optional branch was filled
    merely to make this shard's branch counts symmetrical.
  source_discovery_traps: >
    The inspected unselected 수도 was spiritual cultivation, not a water supply;
    싸다 was excretion, not wrapping or cheapness; 자수 was criminal surrender,
    not embroidery; and 지나치다 was the descriptive excessive predicate,
    not a passing-by verb. The available movement senses of 지나가다 are used
    instead. 낚시's hobby is position three, and 도시락's packed food is position
    two. An English homograph or a requested topic never overrides the Korean.
  scope_of_short_labels: >
    봉투 remains a paper envelope for letters or documents, not an unrestricted
    grocery bag. 요구르트 retains the source's drink interpretation. 베란다
    retains the roofed, open-sided space rather than every modern enclosed balcony.
    집안 denotes a family household, not simply the physical inside of a house.
    낚시's figurative lure does not invent a cybersecurity phishing sense.

identity_policy:
  identifiers: >
    ko-nikl names retain the pinned CSV record ordinal and original sense
    position. ko-lex names are stable local teaching identifiers, not official
    NIKL identifiers or independently verified etymological classifications.
  default_authored_decision: >
    Retain each independently inspected and selected source boundary as one
    provisional lexical candidate except for the explicit grouping decisions
    below. Mechanical manifest enumeration copies these decisions, original
    POS evidence, homograph rationales, and manually authored labels. It makes
    no vocabulary selection or teaching-placement decision.
  counting: >
    Report source parents, selected senses, spellings, and provisional free
    identities separately. Additional senses, numbered-floor or line-count
    uses, and the documented related-form groups do not add free-lemma breadth.
    A source parent is not automatically a proven true lexeme.
  free_lemma_decision: >
    Independently usable content nouns and predicates are free-lemma candidates.
    The temporal noun 때 has standalone moment and opportune-time meanings;
    use in a clause-plus-time construction does not create another headword.
    층 and 줄 include freely usable layer/floor and cord/line nouns as well
    as counting positions, so their counter uses stay in those free identities.
  bound_form_decision: >
    가지 as a kinds counter and 실 as a rooms counter are explicitly bound
    nouns in the retained source. They are distinct from branch 가지 and thread 실.
  function_item_decision: >
    설사 is a concessive supposition operator. The selected 다음 positions
    provide sequential or discourse reference rather than a separately counted
    free content noun. These are explicit conservative accounting choices,
    not a claim that all nouns or adverbs with temporal meanings form one class.
  bound_form_identity_ids: [ko-lex-26023, ko-lex-03373]
  function_identity_ids: [ko-lex-00056, ko-lex-16238]

documented_group_decisions:
  ko-lex-11671:
    lemma: 잃다
    category: free-lemma
    source_parents: [ko-nikl-11672]
    rationale: >
      Keep the selected 잃어버리다 positions for lost possessions, losing one's
      way, and separation from a companion with the existing 잃다 identity.
      The inspected simplex source has these same loss meanings at positions
      one, nine, and ten. The completion-emphasized lexical form retains its
      own source positions and pronunciation but does not add a free headword
      in this conservative teaching analysis. This is not an official variant
      crosswalk or a claim that every verb-plus-beorida sequence is one lexeme.
  ko-lex-11966:
    lemma: 잊다
    category: free-lemma
    source_parents: [ko-nikl-11967]
    rationale: >
      The inspected 잊다 and 잊어버리다 sources share the selected meanings of
      failing to recall prior knowledge, momentary forgetting, and setting
      past pain aside. The latter strengthens completion or totality. Preserve
      its separately sourced members in the existing 잊다 identity without
      adding a free headword for this related completed form. Retain the
      existing lemma and category and require lexical-family review.
  ko-lex-33523:
    lemma: 깨다
    category: free-lemma
    source_parents: [ko-nikl-33523, ko-nikl-33526]
    rationale: >
      Conservatively group breaking 깨다 and the expanded breaking form 깨뜨리다
      as one teaching lexical base. Their Korean definitions overlap in breaking
      hard objects, promises, and maintained states; preserve each selected
      original position and the distinct forms. This explicit family analysis
      requires lexical review and is not inferred solely from equal English.
      Awakening or sobering 깨다 at ko-nikl-33521 remains a separate identity.

