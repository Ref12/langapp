schema_version: 1
id: ko-governance-noun-cohort
review_status: original-ai-authored-unreviewed
completion_status: main113 senses integrated; approved support in separate cohort; qualified review outstanding
review_requirement: >-
  Every selection, placement, English label, identity and correction proposal
  is original AI-authored work requiring qualified Korean linguistic and
  pedagogical review. Legal, institutional and economic interpretations
  additionally require appropriate domain review. Source definitions are not
  current law, legal advice, financial advice, a professional qualification,
  examination readiness or evidence of learner competence.
scope:
  - Identify public offices, responsible roles, service documents and assistance.
  - Understand participation, meeting decisions, objections and public reporting.
  - Discuss work arrangements, childcare, insurance costs and ordinary transactions.
  - Read public budgets, regulatory issues, economic evidence and institutional change.
selection_policy: >-
  Concrete questions about using services, understanding work arrangements,
  participating in decisions and reading public-interest reports drove targeted
  source discovery. Each selected Korean and English definition position was
  inspected. No first-sense, source-band, alphabet, part-of-speech or quota rule
  assigns placement. No exhaustive unselected-inventory audit, generated
  predicate, specialist legal catalogue or systematic actor/nominal-variant
  expansion is included. Common needs stay early or middle; public-budget,
  institutional and evidence uses enter where the corresponding goals require
  them. The completed scope is bounded, not a claim of comprehensive civic fluency.
