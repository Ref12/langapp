count_interpretation: >-
  Senses, source parents, spellings and provisional lexical families are
  different measures. The 96 globally new free candidates exclude the
  document counter. Two existing professional-only families acquire genuinely
  different core meanings, making additional core free coverage 98 rather
  than 96; no protected placement moves. The dollar noun and dollar unit
  count as one new free family, not two. Pending source requests below are
  excluded from all active counts. No late-level padding conceals a shortfall
  against the program's broader planning guide.
