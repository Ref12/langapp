first_core_evidence:
  ko-lex-28170:
    protected:
      id: ko-nikl-28170-s001
      level: professional
      source_korean: "일정한 기간 동안의 수입과 지출을 정리함."
      source_english: "The act of recording revenues, expenses, business results, etc., for a certain period."
    new:
      id: ko-nikl-28170-s002
      level: 12
      source_korean: "일정한 기간 동안에 한 일의 결과를 정리하는 것."
      source_english: "The act of recording the result of what one has done for a certain period."
    rationale: >-
      General work-results reporting is not restricted to financial settlement.
      This new source position supplies core use without moving the existing
      professional placement or creating another family.
  ko-lex-52014:
    protected:
      id: ko-nikl-52014-s003
      level: professional
      source_korean: "개인이나 기업 등의 경제 활동 상황을 계산하고 기록함."
      source_english: "An act of keeping record of a person or company's economic activities according to a certain method of calculation."
    new:
      - id: ko-nikl-52014-s001
        level: 11
        source_korean: "나가고 들어오는 돈을 따져서 계산함."
        source_english: "An act of calculating income and expenses."
      - id: ko-nikl-52014-s004
        level: 8
        source_korean: "나가고 들어오는 돈을 계산하는 일을 직업으로 하는 사람."
        source_english: "A person whose job it is to calculate income and expenses."
    rationale: >-
      Basic cash-flow calculation and a workplace practitioner are actual
      distinct source meanings. Neither claims competence in the professional
      accounting activity, and the practitioner is not necessarily certified.
