  status: >-
    In-memory composition through the repository's actual selection and
    identity helpers, protecting the complete live manifest rather than
    assuming an earlier checkpoint is still current. Parent source additions
    are observed read-only. This does not claim manifest registration,
    pronunciation integration or regenerated teaching views.
placement_rationale:
  ordinary_transactions_and_home: >-
    The US currency noun, its counting unit and currency exchange support
    transactions at 3. Child-rearing and the deposit-leased room support
    household discussion at 5. Those meanings do not wait for economics.
  public_services: >-
    At 6, identify a full-name field, a government office, local district,
    registration certificate, consumer, subscriber, benefit, exemption,
    insurance premium, transfer and requested number of document copies.
    Local-government, national-budget and private establishment distinctions
    support service and education choices without claiming a current legal
    classification. Embassy contact, import duty and access permissions
    support travel at 7.
  work_relationships: >-
    Hiring, job loss, self-managed business, former work, retirement age,
    job position/type, headquarters, public posts and conventional company
    ranks support work relationships at 8. A bookkeeper is a person role,
    not an assurance of accountancy qualifications. Ordinary transport and
    incoming/outgoing-money calculation support processes at 11; summarising
    work over a period supports reporting at 12. Purchase cost, trading
    profit and possessions support comparisons at 13.
  problems_and_cooperation: >-
    Objections, criminal complaints, contractual termination and repayment
    security support explaining unfamiliar problems at 14, without procedural
    advice. Meeting resolutions, more-than-half reference, unanimity, observers
    and committee roles support cooperation at 15. Negotiation, agreements,
    special benefits and broader security against adverse outcomes support 18.
  public_reporting_and_reasoning: >-
    Political activity, governing power, departure from office, appointments,
    candidacy, candidate support rates, wrongdoing, migration, democratisation
    and media sources support reporting at 16. Productivity evidence and
    respondents support evaluation at 19. Public wealth, taxation, treasury
    funds, labour costs, foundations, finance, governing structures and
    international agreements support institutional/economic explanation at 20.
    No new 25-30 nuance or specialist branch was needed for this bounded scope.
identity_policy: >-
  Protected keys, canonical names, categories, members and placements remain
  unchanged. Existing fragments contain only genuinely new members and their
  exact parents. No retired gratitude26491 or 실상03445 free key is recreated.
  Parent owns cross-scope family adjudication; merely related spellings do not
  authorize renaming, merging or promoting protected identities. New families
  remain provisional rather than verified true-lexeme counts.
