category_and_homograph_boundaries:
  - >-
    부06282 is an organisational department; 부06284 is wealth; 부06286-s002
    is an explicitly bound document/publication counter. These do not form
    a single family just because they are written identically.
  - >-
    세제00511 taxation is not protected 세제00510 detergent. 정원14622
    prescribed headcount is not protected 정원14623 garden.
  - >-
    Province 도17727 is not protected bound degree17730. District 구30825
    is not protected number-nine/function-item30831 or the sphere homograph.
    County 군31404 is not military 군31402 or an address form.
  - >-
    Names of public/private establishment modes and public numerical concepts
    remain provisional free nouns with referential meanings, not automatically
    function items because they can modify a following noun. Only the actual
    document counter receives a new bound-only identity.
  - >-
    위원 names an appointed/elected task-holder; 위원회 names the discussing
    institution. 언론인 names a professional person; 언론사 names a media
    company. These are distinct referents, not mechanically generated actors.
    Only source-attested, communicatively needed roles are included.
  - >-
    Similar English is not a blanket family-merging rule. 보육 includes care
    and education; 육아 names child-rearing. Neither source restricts one
    to institutions and the other to parents. Their use-case placements do
    not assert such a semantic or legal division.
source_correction_proposals:
  ko-nikl-06362-s001:
    source_korean: "수표나 어음에 적힌 금액을 기한 안에 받지 못하는 일."
    source_english: "A state in which a company fails to receive a certain amount of money written on a check or note. "
    authored_interpretation: a cheque or note not paid by its due date
    rationale: >-
      Korean includes the deadline and does not restrict the recipient to a
      company. Preserve nonpayment by the due date without declaring bankruptcy,
      insolvency or a current legal classification. Qualified review is required.
  ko-nikl-14405-s001:
    source_korean: "정치를 맡아 행하는 권력."
    source_english: "An authority or administrative organization that is responsible for dealing with political matters."
    authored_interpretation: the power to govern
    rationale: >-
      The Korean definition names power or authority, not an administrative
      organisation. Keep that boundary rather than inheriting the additional
      English referent. This is an unreviewed authored interpretation.
  ko-nikl-21881-s001:
    source_korean: "직장을 그만두는 사람에게 일하던 곳에서 주는 돈."
    source_english: "The money that an employer gives to a person who resigns from a job."
    authored_interpretation: a workplace's payment to someone leaving a job
    rationale: >-
      Avoid narrowing leaving employment to the English resigns. The label
      also does not promise eligibility to everyone leaving a job or specify
      a payment amount. Qualified Korean and employment-domain review is required.
  ko-nikl-29129-s001:
    source_korean: "피해자가 범죄 사실을 경찰이나 법률 기관에 알려 범인을 처벌해 달라고 요구하는 일."
    source_english: "The act of reporting a crime to the police or a law enforcement authority and asking them to punish the criminal."
    authored_interpretation: a victim's criminal complaint requesting punishment
    rationale: >-
      Korean explicitly identifies 피해자 as the complainant; English omits
      that participant. Retain it without inventing deadlines, standing rules,
      documentary requirements or a determination that a real person is a victim.
  ko-nikl-30825-s001:
    source_korean: "특별시, 광역시 및 인구 50만 이상의 대도시에 두는 동 위의 행정 구역 단위."
    source_english: "An administrative district above 'dong (the smallest unit of districts)' in large and metropolitan cities with a population of 500,000 or more."
    authored_interpretation: an urban administrative district above dong
    rationale: >-
      Korean separately lists special/metropolitan cities and large cities
      meeting the population condition. English flattens that scope and adds
      a smallest-unit claim about dong. Keep the source's above-dong relation
      without teaching the English additions or treating the dictionary as
      current administrative law.
  ko-nikl-39129-s001:
    source_korean: "민주주의 이념에 따르게 되거나 민주적인 것으로 바뀌는 것. 또는 그렇게 되게 하는 것."
    source_english: "A state in which a nation comes to follow a democratic ideology or becomes democratic; the act of making a nation change in such a way."
    authored_interpretation: becoming democratic or making something democratic
    rationale: >-
      Korean does not supply nation as the sole subject. Retain democratic
      change without excluding organisations or other contexts, and without
      certifying any real institution as democratic. Qualified review is required.
  ko-nikl-43843-s001:
    source_korean: "장관을 보좌하고 장관의 직무를 대행할 수 있는 장관 다음의 직위. 또는 그 직위에 있는 사람."
    source_english: "A position just below minister, who assists the minister and substitutes for him/her when the office is vacant; a person in such a position. "
    authored_interpretation: a deputy minister or that office
    rationale: >-
      Korean says the holder can perform the minister's duties; it does not
      restrict this to vacancy of the office. Do not import that English
      condition or present a current statutory succession rule.
  ko-nikl-50534-s001:
    source_korean: "어린아이를 돌보고 기름."
    source_english: "An act of taking care of and growing a child."
    authored_interpretation: caring for and bringing up young children
    rationale: >-
      기름 concerns raising or nurturing children, not physically growing a
      child as the English may suggest. This interpretation makes no medical
      or developmental claim and requires qualified Korean review.
source_and_domain_review:
  - ids: [ko-nikl-06362-s001, ko-nikl-09565-s001, ko-nikl-49671-s001, ko-nikl-01975-s001]
    issue: >-
      Nonpayment is not automatically bankruptcy. The productivity definition
      uses production cost rather than every possible input measure. 원가
      includes the source's production-through-sale cost framing, not a
      universal accounting standard. 수지 first names income and expenditure
      together, not necessarily their numerical difference.
  - ids: [ko-nikl-08309-s001, ko-nikl-29749-s001, ko-nikl-31259-s001, ko-nikl-13050-s002]
    issue: >-
      Preserve individual private funding for public benefit, local-government
      establishment, national-budget establishment for public benefit, and a
      corporate foundation managing dedicated property respectively. Do not
      infer present-day incorporation, ownership, tax exemption or school
      admission rules from these source prototypes.
  - ids: [ko-nikl-17029-s002, ko-nikl-17029-s003, ko-nikl-31347-s001, ko-nikl-43843-s001]
    issue: >-
      대리 includes a conventional company rank as well as a distinct acting
      post/holder. 국장 supervises a 국 unit. These are not universal rank
      charts, and acting authority is not a generic fixed-term-employment status.
  - ids: [ko-nikl-13864-s002, ko-nikl-14423-s001, ko-nikl-16694-s001, ko-nikl-21881-s001, ko-nikl-24699-s002]
    issue: >-
      A deposit-leased room, stipulated retirement age, repayment security,
      leaving-employment payment and unilateral termination are vocabulary
      referents. No refund, collateral-title transfer, statutory age, eligibility,
      cancellation right or enforceability is guaranteed.
  - ids: [ko-nikl-10937-s002, ko-nikl-10938-s001, ko-nikl-50128-s001]
    issue: >-
      Migration need not cross a national border, and a migrant need not be
      foreign or hold permanent residence. The voter noun describes a holder
      of an election right; it does not determine anyone's actual eligibility.
  - ids: [ko-nikl-06704-s002, ko-nikl-07507-s001, ko-nikl-15316-s001, ko-nikl-22070-s001, ko-nikl-22154-s001, ko-nikl-49942-s001]
    issue: >-
      Moral corruption, wrongdoing, bribery, special rights, special benefits
      and violation of law are not interchangeable. 특권 and 특혜
      are not inherently unlawful in these definitions. No real person's
      guilt or legal status is inferred from a word or allegation.
  - ids: [ko-nikl-10902-s001, ko-nikl-14964-s001, ko-nikl-29056-s001, ko-nikl-29056-s002, ko-nikl-29129-s001]
    issue: >-
      An objection is not automatically a formal appeal. General restraint
      against rule/custom breaches differs from a state sanction. Publicly
      exposing wrongdoing differs from reporting a crime to authorities.
      고소 explicitly names the victim; 고발's source does not state a
      reporter-status restriction, so do not invent one.
  - ids: [ko-nikl-27035-s001, ko-nikl-30133-s001, ko-nikl-36150-s001, ko-nikl-42823-s001, ko-nikl-51191-s001]
    issue: >-
      Freely entering need not mean admission without a fee. More than half
      is not merely the largest share; unanimity is not majority agreement.
      A candidate support rate does not specify polling method, turnout or
      the eventual election result. An answering person need not be a survey
      respondent, and a response does not establish a representative sample.
  - ids: [ko-nikl-21977-s001, ko-nikl-30349-s001, ko-nikl-48765-s001, ko-nikl-52014-s004]
    issue: >-
      Investment can involve time or effort as well as money; no profit is
      promised. This duty position defines imports, not all border charges.
      Diplomatic employment does not establish any person's status or immunity.
      The accounting-person position does not specify professional certification.
