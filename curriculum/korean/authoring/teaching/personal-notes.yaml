schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: bounded wardrobe and personal-care selection; not complete-scale coverage
scope:
  - Inspect named garments, accessories, toiletries, and care items against exact retained source positions.
  - Retain eight specifically inspected unbanded parents for ordinary personal needs, not an exhaustive source sweep.
  - Preserve every earlier active selection and the explicit pending greenhouse-gas exclusion.
  - Add real related source meanings where useful; do not derive dictionary entries from garment combinations.
  - Source bands and numeric planning targets never schedule these selections.

curation_rationales:
  household_and_service_needs: >
    Sleepwear, warm underlayers, slippers, hangers, handkerchiefs, and aprons
    support household routines. Clothing styles, fastenings, jewelry, and
    personal-care supplies support concrete shopping or care requests at
    level six rather than being delayed merely because some names are loans.
  travel_and_relationships: >
    Sandals, sunglasses, and swimwear support travel choices. Formal clothes,
    neckties, school uniforms, exercise clothes, and sports face coverings
    accompany work/study routines, activities, and situated dress expectations.
    No school or workplace convention is presented as universal.
  common_polysemy: >
    Clothing and record jackets, clothing and drive belts, optical and contact
    lenses, and clothing and machine-control buttons have separate source
    senses but shared identities. Pouch and figurative profit-pocket deepen
    the already selected clothing-pocket sense.
  culture_and_register: >
    General and traditional front-closing collars remain distinct source
    positions. Disguise masks and the facial-appearance use of 마스크 belong
    in their respective culture and register contexts, not the medical-mask
    sense. These additions do not generate extra free heads.
  optional_technical_sense: >
    The welding-shield meaning of 마스크 is optional technical vocabulary.
    It shares a parent with core mask senses but has its own source position;
    a word's presence does not certify protective equipment or professional skill.
  traps_left_out: >
    The unselected 코트 parent names a sports court, not an outer coat.
    The remaining 모자 parent means mother and son, not a hat. Retail 소매
    and homesickness 향수 are not relabeled as sleeves or perfume. Raw cotton
    솜 is left to the separate content-noun cohort, not treated as a care item.

identity_policy:
  status: Provisional explicit identities, not verified etymology or proof of general lexical competence.
  selected_senses: 54
  core_senses: 53
  technical_senses: 1
  source_parents: 45
  distinct_spellings: 45
  net_new_core_free_identities: 43
  bound_form_identity_ids: []
  function_identity_ids: []
  existing_fragments: >
    주머니 and 단추 receive new members only, preserving their existing
    canonical lemmas and categories. Their additional meanings add no breadth.
  shared_families: >
    Each selected multi-sense parent remains one provisional family. In
    particular, the five selected mask positions do not become five words
    or add another headword to the technical branch's unique core breadth.
  synonym_boundaries: >
    Similar English does not prove that 허리띠 and 벨트, 스카프 and 목도리,
    or 와이셔츠 and the broader shirt category are spelling variants.
    Preserve their separately attested forms and scopes pending qualified
    review rather than merging every synonymous translation.

documented_group_decisions: {}

unbanded_support:
  policy: >
    The original CSV contains all eight specifically queried missing personal
    items. Their original record and sense positions are retained unchanged;
    the full six-position mask parent is preserved although only five
    positions are selected. All remain outside the original TOPIK folders.
