review_flags:
  - >
    Gendered wearer descriptions in the original clothing definitions are
    source conventions, not universal requirements or judgments about a
    learner. Source-specific colors, cuts, and fabrics do not define every
    modern product sold under those names.
  - >
    Bandage sterility, mask protection, lotion effects, absorbency, and
    thermometer measurement are source descriptions of purposes or designs,
    not independently demonstrated product performance or medical advice.
    A vocabulary label cannot determine whether equipment is adequate.
  - >
    Cotton-tipped sticks are named, not recommended for insertion into ears or
    other body parts. Diaper descriptions do not imply that all members of an
    age or patient group are incontinent. Menstrual supplies are ordinary
    personal-care vocabulary, not diagnostic or treatment claims.
  - >
    The adhesive-tape/cloth source meaning of 반창고 is retained without
    inventing an absorbent pad. Formal dress and school-uniform definitions
    must not be converted into claims about a particular institution's rules.

remaining_gaps:
  - The broader useful core vocabulary planning scale is still substantially unfilled.
  - Other named absent wardrobe and care items have not been exhaustively researched or fabricated.
  - Qualified review remains necessary for pronunciation, source corrections, usage, and lexical boundaries.
