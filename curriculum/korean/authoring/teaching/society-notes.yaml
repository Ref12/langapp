  meaning_decisions:
    - >-
      매번 and 매일 name each occasion and every day for routine reference.
      They join the protected recurrence adverbs without adding free identities.
      Their noun positions are not evidence for creating new calendar variants.
    - >-
      계속 distinguishes uninterrupted continuation from restarting after an
      interruption. Each noun position corresponds to the same distinction in
      the protected adverb, supporting procedure and work-outcome explanation
      at level 11 rather than treating resumption as uninterrupted activity.
    - >-
      거의 names an amount just short of all; 혼자 names a person alone rather
      than marital status; 스스로 is own-self reference. 만약 and 만일 name
      possible unexpected cases. These nominal quantity, relational, reflexive,
      and hypothetical uses preserve their five protected function categories.
      Source noun POS does not automatically promote a family to free-lemma.
    - >-
      직접 names an unmediated connection for cooperation at 15. Its shared
      absence of an intermediary supports the protected direct-action family.
      The noun and adverb are not claimed to have interchangeable syntax.
    - >-
      The just-before-speaking noun 방금 supports narration at 9; the present
      moment 지금 supports routine plans at 4, and its contrast with past or
      future supports evidential time framing at 19. Both remain in their
      protected temporal free families. 지금 specifically uses existing
      ko-lex-42538, not a new key inferred from noun parent 42537.
    - >-
      당장 supplies a named event-site/occasion and immediate aftermath,
      supporting unfamiliar circumstances at 14 and event narration at 9.
      They form one new provisional circumstance/time free family. No existing
      당장 identity was present; the source's separate expression-like third
      position was not added merely because the parent was selected.
    - >-
      대강 supplies a brief storyline or outline for reporting at 12; its
      protected adverb also explicitly omits detail. This is a brevity family,
      not a newly invented technical outline or blueprint. 보통 supplies
      ordinariness or an average level for comparison at 13, retaining the
      protected generally/normally family's free category.
