schema_version: 1
id: ko-society-noun-cohort
review_status: original-ai-authored-unreviewed
review_requirement: >-
  All selections, placements, identity groupings, English labels, and correction
  proposals are original AI-authored work requiring qualified Korean linguistic
  and pedagogical review. Structural validation is not linguistic approval.
scope:
  - Describe family relationships, life stages, and roles without assuming a listener's circumstances.
  - Discuss schooling, learning tasks, working conditions, and career choices.
  - Identify participants, responsibilities, assistance, and cooperation.
  - Follow ordinary institutional, civic, and economic explanations.
  - Compare resources, livelihood, costs, and organizational arrangements.
  - Explain social relationships, attitudes, values, and abstract connections.
selection_policy: >-
  Communicative questions guided bounded discovery. Each selected Korean and
  English source-definition position was inspected before explicit selection.
  Source order, initial position, spelling, dictionary band, part of speech,
  and numerical targets do not assign levels. Noun ownership prevents concurrent
  editing collisions; it is not a teaching-order rule. These sections are not
  lesson batches, and no exhaustive unselected-source audit or round-number
  cutoff was used. Common polysemy remains separately labeled without counting
  each meaning as another free lemma.
