count_interpretation: >-
  A sense is one preserved definition-list position; a parent is one pinned
  local source record; spelling is visible Korean text; an identity is an
  explicitly justified provisional family. They are different measurements.
  Homographs need not share identities, and an explicitly related longer name
  need not create a new free identity. Source noun POS does not make every
  use an independent descriptive noun. No word-count achievement, learner
  mastery, or completion of the program's planning scale follows from these totals.
placement_rationale:
  first_exchanges: >-
    Sons, daughters, children, and university-student reference enter at
    level 2. The person-counting use supports level 3 quantities; school
    vacations, ordinary daily life, named recurrence, and present-time
    reference support routine plans at 4. An
    occupation or abstract noun is not made introductory solely because
    its source band is beginner.
  everyday_life: >-
    Family and household relationships support help at 5; service and care
    roles, costs, and school contact support 6; travel and moving between
    places support 7. Level 8 develops work and study relationships, class
    activities, employment reference, and respectful address. Honorific person
    reference is distinguished from being socially higher in an organization.
  stories_conversations: >-
    Family events and life histories support narration at 9. Feelings,
    encouragement, attachment, and posture or attitude support experience at
    10. Tasks, practice, practical execution, and outcomes support 11.
    Presenting or showcasing achievements supports reporting at 12; learning,
    work, and personal decisions support reasons and comparisons at 13.
    Source polysemy is not all introduced at a word's earliest selected level.
  explanation_problems: >-
    Level 14 handles difficult circumstances and assistance. Level 15 names
    participants, management, responsibilities, cooperation, and workplace
    procedures.     Public roles and events support news at 16. Electronic information,
    electricity generation, and human reference support explanation at 17; terms,
    resource choices, and adopting proposals support negotiation at 18.
  analysis_argument: >-
    Level 19 distinguishes relationships, standards, and evidential reasoning.
    Level 20 introduces civic institutions, economic activity, credit,
    livelihood, and resource flows for ordinary public explanation rather
    than occupational certification. Level 21 includes psychology and general
    development; 22 discusses values, social position, and viewpoints.
    Qualified reasoning at 23 uses relationships and reference standards.
    Academic papers, seminars, scholarship, form, and considered ideas
    support formal synthesis at 24.
  nuance_interpretation: >-
    Stance and implication enter at 25. Level 26 makes respectful, familiar,
    written, and organizational self-reference explicit. Selected common
    figurative roles support 27; precise abstract relationships support 28;
    source framing of social background and fabrication support critical
    interpretation at 29. Level 30 can reuse these in independent projects;
    it is not padded with new specialist
    nouns merely to populate every level. No branch additions were needed.
identity_decisions:
  existing_fragments: >-
    All 80 existing groups retain their exact IDs, canonical lemmas, and
    categories. Their society fragments contain only new members. Protected
    members, meanings, placements, and branch choices remain unchanged.
  company_employee_family:
    identity: ko-lex-08466
    parents: [ko-nikl-08466, ko-nikl-52049]
    shorter:
      id: ko-nikl-08466-s001
      target: 사원
      source_korean: "회사에 속하여 일하는 사람."
      source_english: "A person who works at a company. "
    longer:
      id: ko-nikl-52049-s001
      target: 회사원
      source_korean: "회사에 속하여 일하는 사람."
      source_english: "A person who works at a company."
    rationale: >-
      These inspected positions name the same company-employee role with a
      shorter and longer company-related name. They provisionally share one
      free identity, not two. This is an explicit conservative family decision
      requiring review, not an official abbreviation crosswalk or a claim that
      every use has identical rank or collocation. Religious 사원08465 is separate.
  economics_expanded_name:
    identity: ko-lex-28496
    protected:
      id: ko-nikl-28496-s002
      target: 경제
      source_korean: "사회의 경제 현상을 분석하고 연구하는 학문."
      source_english: "The field of study in which economic phenomena are analyzed and studied."
    new:
      id: ko-nikl-28512-s001
      target: 경제학
      source_korean: "경제 현상을 분석하고 연구하는 학문."
      source_english: "The field of study in which economic phenomena are analyzed and studied. "
    rationale: >-
      The expanded discipline name is explicitly related to the already
      selected economics-discipline position, not to an arbitrary same-English
      synonym. Existing economy/economics and new economizing positions keep
      their labels in one provisional family. The fragment adds only the
      economizing and expanded-name IDs; protected s002 is evidence, not a
      duplicate member. No separate ko-lex-28512 is introduced.
  function_only:
    - {identity: ko-lex-06138, lemma: 본인, role: person-concerned and self-reference}
    - {identity: ko-lex-21111, lemma: 타인, role: other-person reference}
    - {identity: ko-lex-31831, lemma: 귀하, role: written honorific addressee reference}
    - {identity: ko-lex-34584, lemma: 남, role: other-person or outside-relationship reference}
    - {identity: ko-lex-08389, lemma: 사상, role: historical-time reference in since-history-began comparisons}
  category_limits: >-
    These five groups conservatively count as function-item rather than
    additional descriptive free lemmas. That is this curriculum's provisional
    counting decision, not a change to the source POS noun or a claim that
    all five have identical syntax. Ideology/thought 사상08390 remains a
    separate free identity. No new bound-only family was added.
  functional_members_in_free_families:
    - >-
      사람08256-s009 counts people inside the already independently attested
      person family. It creates neither a second person lemma nor a fabricated
      lexical counter source position.
    - >-
      본사06120-s002 is formal our-company reference; s001 independently names
      headquarters. Both are one family, not two free introductions.
    - >-
      대우17181-s004 describes treatment at a specified status or standard.
      Independent treatment, working conditions, and respectful treatment
      remain separately labeled in that family.
    - >-
      정도14443-s003 refers to the stated amount or level. Independent degree
      s001 is introduced at the same level 6. The reference use does not add a
      free identity, nor is an unsupplied approximation-operator rule invented.
  synonyms_and_derivatives: >-
    Similar English alone does not merge 친교/친분, 금액/액수, 모범/모델,
    or other independent forms. The naming decisions above and noun/adverb
    counterpart decisions below rely on explicitly related forms and inspected
    meanings. Independently
    attested compounds keep their supplied identities; no X하다 predicates,
    심리학 parent absent from this frozen registry, or unseen derivatives were
    generated. Source spellings were not mechanically collapsed.
  homographs: >-
    Keep presiding 사회08617 separate from society08618; official 관리30318
    from management30319; religious 사원08465 from employee08466; priest
    신부03197 from bride03198; father/son 부자06574 from wealthy person06575;
    foreign study 유학50448 from Confucian learning50450; interests 이해11009
    from comprehension11010; rationality 이성10793 from gender-relation10794;
    historical-time 사상08389 from thought08390; legal promulgation 공포30032
    from fear; electricity 발전40075 from development40074; and corporate
    shares 주식41784 from staple food41783. Managerial approval 결재28214
    and payment 결제28228 are different words, not spelling alternatives.
