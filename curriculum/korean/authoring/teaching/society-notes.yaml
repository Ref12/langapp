  The existing pinned source-senses.yaml supplies exact bilingual meanings.
  ko-nikl-NNNNN denotes the project's preserved CSV record and sNNN its original
  definition-list position, not an official NIKL sense number. Dictionary bands,
  source strings, provenance, and licensing metadata remain unchanged.
  These original selection files do not relicense upstream definitions or
  grant permission beyond the repository's established source terms; quoted
  evidence retains those obligations. No dictionary endorsement, TOPIK
  qualification, complete native lexical inventory, professional certificate,
  or legal, medical, or financial advice is supplied. Linguistic review,
  source-wording adjudication, and reading coverage remain explicit follow-ups.
