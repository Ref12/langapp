  identity_contract: korean_program_adapter.lexical_members validates complete single membership and exact parent sets for standalone and composed selections.
  composition_method: >-
    Used actual load_selections against the complete registered manifest
    through the returned expression and newly registered mobility cohorts,
    then an in-memory manifest adding the two society shards. Only the
    manifest read was substituted for the proposed composition; all selection
    and identity files were read normally.
    This simulates registration without editing the manifest or bypassing
    collision and canonical-identity checks. Every protected row and group
    member was preserved, including canonical lemma and category.
    After the coordinator returned expression and authorized inspection, its
    notes and full selections/identities were included as protected inputs.
    This supersedes the earlier through-content-only snapshot and validates
    the combined expression/society identity composition. Mobility subsequently
    appeared in the explicit manifest and was also protected and composed;
    it has no sense-ID or identity-key intersection with society. No protected
    category, canonical key, member, or placement was changed.
  correction_contract: Four exact bilingual source-evidence and selected-label proposals passed korean_program_adapter.source_corrections.
  existing_tests:
    command: python -B -m unittest test_korean_program.KoreanSelectionFilesTests test_korean_program.KoreanAdapterTests.test_polysemy_counts_once_and_bound_forms_are_separate test_korean_program.KoreanAdapterTests.test_authored_corrections_preserve_bilingual_source_and_selected_label
    result: Eight tests passed; no testing dependency was installed.
  limits: >-
    These checks establish data consistency, not qualified linguistic review.
    Pronunciation and generated-program integration remain with the parent
    and reading owner. No reading-dependent integration success is claimed.
