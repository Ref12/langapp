meaning_and_scope_checks:
  - >-
    수학02050 is study rather than mathematics and was not imported as a
    mathematics lead. Source category or alphabetical proximity did not
    rescue an unsuitable meaning.
  - >-
    모델37406 supplies prototype, exemplar, and fashion-model occupation.
    Mathematical and machine-learning models were not fabricated. Selecting
    the occupation does not select garments or accessories.
  - >-
    급식 names institutional meal provision and 대접17239 names courtesy or
    treating a person to food. These are service/social-activity nouns, not
    a new dish, ingredient, or the unrelated 대접 bowl.
  - >-
    서민09762-s002 retains both not-well-off and below-middle-class conditions.
    It is not silently broadened to all ordinary people or restricted only
    to measured income. Class vocabulary describes concepts, not personal worth.
  - >-
    증권42407-s002 specifically represents property rights; unselected
    general evidence-document s001 was not imported. 적금13513-s002 is the
    periodic bank-saving product, not automatic selection of its first position.
  - >-
    유통50436-s002/s003 distinguish currency circulation and distribution of
    goods; air flow s001 was not imported. 임대 preserves the providing
    rather than borrowing perspective. Deposit and rental labels do not
    invent contract, refund, interest-rate, or eligibility rules.
  - >-
    파업22342-s001 only defines stopping work in progress in this source.
    Its label does not silently add collective bargaining, legality, industrial
    action procedures, or a more specific sense not present in the registry.
  - >-
    Selected sympathy, faith, reverence, instinct, human nature, and social
    classification are topics for description and discussion, not endorsed
    beliefs, diagnoses, judgments of individuals, or deterministic theories.
