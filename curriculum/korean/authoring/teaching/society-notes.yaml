  ko-nikl-06831-s001:
    source_korean: "본래 하나였던 것이 둘 이상으로 나누어짐."
    source_english: "Something being divided into more than two parts. "
    authored_interpretation: division into two or more parts
    rationale: Korean 둘 이상 includes exactly two parts; the English incorrectly requires more than two.
  ko-nikl-30297-s001:
    source_korean: "둘 이상의 사람, 사물, 현상 등이 서로 영향을 주고받도록 관계를 맺고 있음. 또는 그 관계."
    source_english: "People, objects, or phenomena, etc., of more than two, being related so as to influence each other, or the relationship."
    authored_interpretation: connection or relevance between two or more things
    rationale: Korean 둘 이상 includes a relationship between exactly two; the English incorrectly says more than two.
  ko-nikl-24001-s001:
    source_korean: "학교를 다닌 경력."
    source_english: "The level of education one completes."
    authored_interpretation: educational background; schooling history
    rationale: The Korean describes schooling history; the English narrows it to a completed level and can wrongly exclude attendance without completion.
  ko-nikl-06354-s001:
    source_korean: "조직을 이루고 있는 군인 집단. 또는 군인 집단이 머물러 있는 시설."
    source_english: "An army consisting of a certain number of soldiers or where the army stays."
    authored_interpretation: a military unit or its quarters
    rationale: The Korean names an organized military group or its facilities, not necessarily an entire army; review the English scope and accommodation alternative.
correction_policy: >-
  These four interpretations are incorporated in source-corrections.yaml
  with exact original strings, including trailing whitespace, and matching
  selected labels. They remain unreviewed, not upstream edits or claims of
  dictionary approval. Source IDs and positions remain unchanged.
source_wording_review:
  policy: >-
    The following limitations occur in both source languages; they are not
    merely English mistranslations. Preserve the historical source evidence
    and seek qualified contemporary-usage review. Do not teach reproductive
    capacity as an eligibility test for sex or gender identity, infer any
    person's identity, or exclude anyone from ordinary human reference.
    The concise person labels do not endorse the source's biological
    generalizations. Romantic labels explicitly flag the source's man-woman
    framing rather than claiming that framing is a universal relationship rule.
  evidence:
    ko-nikl-34655-s001:
      source_korean: "아기를 낳지 못하는 성, 또는 그런 성을 가진 어른이 된 사람."
      source_english: "The gender that cannot give birth, or a fully-grown person of such a gender."
      limitation: Reproductive capacity is used to generalize about male sex and adult men; this must not classify individuals.
    ko-nikl-47114-s001:
      source_korean: "어른이 되어 아이를 낳을 수 있는 여자."
      source_english: "A grown-up woman capable of having a baby. "
      limitation: Fertility is used to generalize about adult women; the supplied position does not separately define an abstract female-sex category.
    ko-nikl-04880-s001:
      source_korean: "남녀 간의 사랑하는 사람."
      source_english: "A person who loves or is loved in a romantic relationship between a man and woman.  "
      limitation: The dictionary frames romantic partnership as a man-woman relationship; review contemporary usage rather than enforcing that restriction.
    ko-nikl-47529-s001:
      source_korean: "서로 사랑하여 사귀는 남자와 여자."
      source_english: "A man and a woman who are in love with each other and have a relationship."
      limitation: The dating-couple definition uses a man-woman frame; it is not a rule governing whose relationships count.
    ko-nikl-10794-s001:
      source_korean: "남성에게는 여성, 여성에게는 남성으로 다른 성별."
      source_english: "A person of the opposite gender, namely a woman to a man, and a man to a woman. "
      limitation: The selected label explicitly identifies the source's binary gender framing rather than claiming an exhaustive model.
  other_limits: >-
    Human-being definitions referring to language, tools, or cognitive ability
    must not be applied to deny anyone's humanity. 학벌, social-background
    성분, 계급, and 계층 do not endorse ranking people by background.
    School categories, institutional structures, offices, ages, and licenses
    are lexical descriptions, not complete jurisdiction-specific rules,
    guaranteed legal eligibility, or qualifications granted by this course.
    Simplified civic definitions require appropriate contextual review.
