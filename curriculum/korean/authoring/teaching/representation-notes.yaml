source_verification:
  source_id: nikl-2024-mirror
  source_revision: 3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9
  source_sha256: 3250b7b0620eee814aadb4ad5611f1e209792e2aebfd57017bcfe3f1d7b92aa0
  source_records: 53172
  source_url: https://huggingface.co/datasets/binjang/NIKL-korean-english-dictionary/resolve/3b4cfd2126debfd5440cade3ef6c2a3c20cf7cf9/2024_01.csv
  inspected_registry_sha256: 54c463d0840317a075875f45ccca2c9a5ab0c79593ebc41cd8cf02da826e5343
  inspected_support_sha256: e0fbfac9d13634f66a7c7956f73ebd76a1b362d0cd242346b31679a69703073c
  method: >
    Read the retained January2024 CSV, verify its complete checksum, and
    inspect actual record ordinals and complete bilingual definition lists.
    Compare full same-spelling/POS competitors and relevant protected families.
    The request blocks retain every original position and registry metadata,
    including empty source bands/categories and original English whitespace.
    A request's source_record gives its original CSV ordinal, not an official
    NIKL entry number; its source_entry is source_url followed by #record=N.
  examples_policy: >
    Source usage examples remain in the pinned CSV and are not copied into
    learner material, used as pronunciation evidence, or treated as verified
    domain advice. In particular, a weight example's volume-unit wording is
    not imported as a definition of weight or a conversion instruction.
placement_rationale:
  practical_materials_and_documents: >
    Single-storey housing and fabric/material feel enter at5. Content amount
    and the explicit weight name serve comparing products or package labels
    at6; they do not wait for a source's advanced or unbanded classification.
    Visible exterior appearance helps housing/travel comparisons at7.
    Computer typeface, general character shape, a physical model, and two
    object surfaces support study or document tasks at8. General 글꼴 is not
    narrowed to computer fonts, and 양면 is not invented as a printer setting.
  descriptions_and_visual_explanations: >
    Emotional 충격 at9 prevents interpreting every shocking event as a
    mechanical collision. At12, compare handwriting, a three-dimensional
    object, a diagram, painted texture, color shading, and near/far depiction.
    Computer 서체003 deliberately precedes handwritten 서체001; no source
    ordinal dictates a teaching sequence. Physical body/frame and endurance
    at13 support explanations of why an object or material is suitable.
  problems_and_representation_limits: >
    Design drawings, existing structures shown on drawings, generic cut
    surfaces, bounded spatial division, and physical impact support
    unfamiliar housing or object problems at14. At17, explain particles,
    spring-like force, elasticity, built structures, and an explicitly
    perpendicular section to a nonspecialist. These are vocabulary for
    interpreting or reporting, not instructions for construction or cutting.
    Diagramming and partial-aspect language support qualified presentations
    at18. An explanatory model at19 is evaluated as evidence, not treated
    as a proof merely because the source names that intended purpose.
  no_late_bucket: >
    There are no level25-30 or specialist-branch fillers. Calligraphic-style,
    mould, abstract future-plan, established-formula, somber-face, and
    near/far-person positions are not added merely because their parent
    already needs a source request.
identity_evidence:
  design_drawing:
    identity: ko-lex-00006
    protected_id: ko-nikl-00006-s002
    source_korean: 건축, 토목, 기계 등에 관한 계획을 세우거나 그 계획을 그림 등으로 나타내는 것.
    source_english: An act of making plans regarding construction, civil engineering, machinery, etc., or to express the plan in a drawing, etc.
    new_id: ko-nikl-00007-s001
    decision: >
      설계도 is the explicit planned-drawing name within this protected
      planning/drawing family. Do not add its future-plan002 again. 도면 has
      a different lexical base and describes structure or design; its
      provisional separate family is not erased by an English drawing gloss.
  floor_naming:
    identity: ko-lex-45987
    protected_id: ko-nikl-45987-s002
    source_korean: 위로 높이 포개어 지은 건물에서 같은 높이를 이루는 부분.
    source_english: An area of the same height inside a building that has been built in multiple stories.
    new_id: ko-nikl-16508-s001
    decision: >
      The single-floor condition is conservatively grouped with floors.
      This adds a useful housing contrast but no new free base, numerical
      suffix generator, or geological-fault meaning. Existing 고층 remains
      in its protected identity and its two selected positions are not copied.
  constructed_object:
    identity: ko-lex-31136
    protected_id: ko-nikl-31136-s002
    source_korean: 건물 등의 뼈대가 되는 부분.
    source_english: 'The part that serves as the frame of a building, etc. '
    new_id: ko-nikl-31140-s001
    decision: >
      Count the actual structure-plus-object naming form conservatively in
      this family, preserving the built/designed large-object qualifier.
      Do not equate every 구조 with a constructed object or use rescue31135.
  weight_name:
    identity: ko-lex-37903
    protected_id: ko-nikl-37903-s001
    source_korean: 물건의 무거운 정도.
    source_english: "The degree of an object's heaviness."
    new_id: ko-nikl-42155-s001
    decision: >
      Both original languages exactly match the physical quantity position.
      Count 중량 as an explicit alternative weight name in that existing
      family. This is an individual conservative decision, not a universal
      rule merging all synonyms with different lexical bases.
  same_base_derivatives:
    - The complete 도식001 and 도식화001 descriptions share structure/state/relations displayed in tables or pictures; both actual records use ko-lex-17921.
    - The actual perpendicular-to-length 횡단면001 is a narrower named 단면 subtype and uses ko-lex-16384.
    - The actual image-depth method 원근법001 reuses the near/far family ko-lex-49682; no arbitrary method-suffix noun is generated.
  distinct_bases_not_universal_concepts:
    - Material 질감 does not require the skin contact that defines 촉감; neither is merged into generic 감각.
    - Material elasticity 탄성 names a response property; protected 탄력 names force or figurative responsiveness.
    - Generic written-character shape 글꼴 and handwriting/computer style 서체 retain their different source scopes and lexical bases.
    - Actual-copy/explanatory 모형 is not automatically the whole protected 모델 prototype, career, sitter, and exemplar family.
    - Color-shade 음영002 has representation scope not supplied by the identical ordinary-shadow definition under protected 그늘001.
  existing_position_extensions:
    ko-nikl-21164: {added: [1], protected: [2, 3], identity: ko-lex-21164}
    ko-nikl-29504: {added: [1], protected: [2], identity: ko-lex-29504}
    ko-nikl-46151: {added: [1], protected: [2, 3], identity: ko-lex-46151}
  limitation: >
    Complete source lists were inspected; the focused evidence above is not
    a replacement registry or permission to truncate unselected meanings.
    All family decisions remain provisional pending qualified lexical review.
bounded_nonselections:
  ko-nikl-16278:
    target: 다층
    inspected_positions: [1]
    reason: >
      The whole one-position meaning is several layers or storeys, not
      permission to split it into two new senses. Protected 층 already
      supplies layers/floors, and 고층 supplies many-storey buildings.
      The productive quantity naming form is not needed for this bounded
      curation and is not requested solely to inflate physical-form breadth.
  ko-nikl-25444:
    target: 형상
    inspected_positions: [1]
    reason: >
      General object form/state overlaps useful protected 모양 and 형태.
      Prioritize body-focused 형체 and visible exterior 외관 in this pass;
      do not count a generic near-synonym merely to add a row.
      Omission does not assert that these different lexical bases are one word.
  ko-nikl-26722:
    target: 강도
    inspected_positions: [1]
    compared_parents: [ko-nikl-26722, ko-nikl-26723, ko-nikl-26724]
    reason: >
      The metal hardness/strength description is narrower than protected
      general intensity26723. Do not borrow that parent's sense, declare
      the homographs identical, or teach a precise hardness/stiffness/strength
      measure from this broad definition. The English steel wording is also
      narrower than 쇠붙이. This specialist distinction is not necessary
      here; robbery26724 remains the governance worker's separate scope.
  ko-nikl-48899:
    target: 외형
    inspected_positions: [1, 2]
    reason: >
      Object exterior shape is close to existing shape vocabulary and the
      selected exterior-appearance task. Outwardly displayed circumstances
      would broaden this into another abstract-description bucket. Retain
      the two real positions for possible later curation, not this selection.
  unselected_positions_in_selected_parents:
    ko-nikl-00007: {positions: [2], reason: Future planning is already protected; the engineering drawing is the actual gap.}
    ko-nikl-09862: {positions: [2], reason: Calligraphic style is a possible arts extension, not a required computer/handwriting lesson or stroke asset.}
    ko-nikl-11892: {positions: [2], reason: This requires the body's having the containing material's properties, not merely being tiny; do not conflate it with selected atom or molecule scopes.}
    ko-nikl-17921: {positions: [2], reason: A pre-established procedural formula is distinct from a visible diagram and is not needed to fill a late level.}
    ko-nikl-37556: {positions: [1], reason: A manufacturing mould is a different source use from a copy or explanatory exemplar and is not compulsory technical padding.}
    ko-nikl-49682: {positions: [2], reason: Near/far places or their people are not the selected spatial-depth property and are not new orientation items.}
    ko-nikl-51132: {positions: [1, 3], reason: Ordinary blocked-light shadow is already available through other words; somber appearance is not selected as a visual-material property or an assessment of emotion.}
homograph_boundaries:
  - Elasticity21181 is not the sigh or admiration noun21182; both complete noun lists were compared.
  - The exact-Form 단층 row inspected here defines a one-storey building only; no geological-fault source ID is invented.
  - Metal-strength26722, general-intensity26723, and robbery26724 have different complete definitions and are not chosen by spelling alone.
  - Protected structural 구조31136 and rescue 구조31135 remain distinct; the constructed-object member joins only the structural family.
  - Neither generic 단면 nor actual 횡단면 is reinterpreted as a lengthwise-only section.
  - 원근 is near/far distance for image discussion, not another direction, facing, or compass source.
source_correction_policy: >
  Requests below preserve exact raw Korean and English strings. The proposed
  compact interpretation is authored, not a replacement source definition or
  official dictionary correction. Parent owns the shared ledger and decides
  integration; qualified Korean-teacher review remains required.
source_correction_requests:
  ko-nikl-16384-s001:
    source_korean: 물체를 잘랐을 때 나오는 면.
    source_english: The cross section of something cut lengthwise.
    authored_interpretation: a surface exposed by cutting an object
    rationale: >
      Korean specifies a surface produced by cutting, without imposing a
      longitudinal orientation. Remove the English lengthwise restriction;
      separately selected 횡단면52150 explicitly requires perpendicular cutting.
  ko-nikl-43251-s001:
    source_korean: 어떤 재료에서 느껴지는 독특한 느낌.
    source_english: A distinctive quality one feels when touching something.
    authored_interpretation: a distinctive feel or quality of a material
    rationale: >
      Korean names the characteristic impression/feel from a material without
      requiring touch. Preserve that scope instead of importing the skin-contact
      condition that actually belongs to 촉감45191.
  ko-nikl-43251-s002:
    source_korean: 물감, 캔버스, 화구 등이 만들어 내는 화면 대상의 느낌.
    source_english: A quality one feels from the surface of a work of art created by paint, canvas, painting tools, etc.
    authored_interpretation: texture conveyed by painting materials and tools
    rationale: >
      Keep the material/tool-created impression in the picture explicit.
      The English surface wording can suggest only the physical substrate;
      do not require touching an artwork or exclude visually conveyed texture.
      This is a qualified interpretation request, not a claim that material
      surface texture and depicted texture never interact.
  ko-nikl-45834-s002:
    source_korean: 슬픈 일이나 뜻밖의 사건 등으로 마음에 받은 심한 자극이나 영향.
    source_english: A very strong stimulation or influence one receives from a sad incident or an unexpected accident, etc.
    authored_interpretation: emotional shock from distressing or unexpected events
    rationale: >
      사건 means an event or incident, not necessarily an accident. Preserve
      the severe emotional effect without requiring an accident, physical
      impact, or a clinical diagnosis.
unselected_source_issue:
  id: ko-nikl-11892-s002
  source_korean: 어떤 물질을 이루면서 그 물질의 성질을 지니고 있는 아주 작은 크기의 물체.
  source_english: A tiny body that constitutes a substance and has its own properties.
  issue: >
    그 물질 refers to the containing substance's properties, not just the
    little body's unspecified own properties. This position remains unselected;
    preserving it in a complete support request is not selecting or correcting
    it in the shared ledger.
