counting_policy: >
  These are source inventory and provisional family counts, not achieved
  knowledge, certified true lexemes, or a number target. Nineteen new
  provisional free families and fifteen depth selections are reported
  separately. Seven existing-family fragments add seven senses without new
  free breadth. Eight additional senses deepen the new families. Source
  spelling counts do not turn naming derivatives into independent free bases.
  Existing family keys, canonical lemmas, categories, members, and placements
  are preserved, including existing core uses at later levels.
