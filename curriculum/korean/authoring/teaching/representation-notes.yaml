schema_version: 1
id: ko-representation-noun-cohort
review_status: original-ai-authored-unreviewed
completion_status: all34 selected senses and official readings integrated; qualified review outstanding
scope:
  - Compare the feel, constituent amount, weight, endurance, and visible form of ordinary materials and objects.
  - Interpret physical models, document typefaces, diagrams, cut surfaces, and pictorial depth.
  - Describe building form or space using actual source nouns without asserting engineering competence.
  - Preserve a few useful literal/nonliteral contrasts without collecting every meaning or filling later phases.
ownership:
  authored_files: [representation-vocabulary.yaml, representation-identities.yaml, representation-notes.yaml]
  parent_owned: source registries, support admission, readings, corrections, manifest, tests, generated views
  protected_cohorts: [all active selection-files.yaml inputs through orientation, cognition143, orientation12]
  excluded_parent_ids: [ko-nikl-48419, ko-nikl-22209, ko-nikl-25822, ko-nikl-29719]
  other_workers: >
    No public/institutional/economic or interaction-verb selection is added.
    Same-hometown18600 and robbery26724 remain outside this cohort. No
    direction, facing, or compass/map-label source from orientation is repeated.
selection_policy: >
  Inspect each bounded lead's complete original ordered Korean and English
  lists, all exact-Form homographs in the pinned CSV, and actual protected
  membership. Select for a communicative task, not source band, first position,
  alphabetical order, a numerical quota, or a late-phase deficit. All selected
  forms are actual noun records; no predicate, compound, suffix derivative,
  source sense, or pronunciation has been generated. Dictionary inclusion
  alone is not proof of independent true-lexeme status.
