placement:
  practical_early: >
    Chilly weather and comfortable/quiet home conditions support5; physical
    relief supports6 without treatment claims. Travel comfort and quiet
    settings support7; friendly social manner supports8. Weather, visual
    familiarity, quiet conduct, and calm water support narration9.
  experience_and_choices: >
    Affection, loneliness, feeling wronged, and dissatisfaction support10.
    Physical weight/texture support11; departure, familiarity, and cold manner
    support12. Resource constraints and spending judgments support13.
    Tight fits/schedules, immediate urgency, composure, and ordinary bodily
    states support practical-problem communication14.
  responsibility_and_public_explanation: >
    Reliability and faithful conduct support15. Physical versus resolute
    strength, packed fullness, and dry land support17. Sufficiency against
    a standard, difficult requirements, and impending urgency support18.
    Trust judgments and pressing situations support19. Household means,
    abundance, poverty, and difficult living support20 without inferring
    financial facts about an actual person.
  later_interpretation: >
    Harshness and loneliness without support enter situated-values discussion22.
    Resolute pursuit and meager content support23; substantial content and
    unshaken positions support24. Subjective personality judgments and their
    implications support25, with register-sensitive alternatives at26.
    Stately objects and gentle wind/wave contact support figurative reading27;
    close reliability-word comparison supports28. No old vocabulary is moved
    simply to increase later-phase counts.
source_correction_requests:
  ko-nikl-03793-s001:
    source_korean: 눈치가 빠르고 행동이나 성격이 상냥하고 시원스럽다.
    source_english: Quick-witted, amiable, and open-hearted.
    authored_interpretation: socially perceptive, friendly, and open in manner
    rationale: Preserve social-cue sensitivity from 눈치 rather than generic intelligence, and the behavior/character framing without an independently observed inner virtue.
  ko-nikl-09733-s001:
    source_korean: 억울하고 슬프다.
    source_english: To be sad and depressed.
    authored_interpretation: sad with a feeling of being wronged
    rationale: Preserve 억울, which English omits. Neither this source adjective nor ordinary sadness establishes clinical depression.
  ko-nikl-16046-s001:
    source_korean: 일이 닥쳐서 몹시 급하다.
    source_english: Very hurried just before an incident.
    authored_interpretation: very urgent as a situation is upon one
    rationale: 닥쳐서 describes the pressing arrival/presence of a situation, not an obligatory just-before timing restriction.
  ko-nikl-33404-s002:
    source_korean: 사람의 성격이나 취향이 원만하지 않아서 마음에 들도록 행동하기 어렵다.
    source_english: Difficult to satisfy someone because his/her character or taste is not normal.
    authored_interpretation: hard to please because of exacting character or tastes
    rationale: 원만하지 means not easygoing/amenable in this context, not abnormality or a medical condition. Its complete Korean definition matches protected 까다롭다-s002.
  ko-nikl-31640-s001:
    source_korean: 물질적으로나 정신적으로 가난하고 여유가 없다.
    source_english: Materially and emotionally impoverished.
    authored_interpretation: impoverished materially or in one's inner life
    rationale: Retain the alternative 나 and broader 정신 scope rather than requiring simultaneous material and emotional poverty or a diagnosis.
  ko-nikl-35258-s002:
    source_korean: 살림이 부족하지 않고 충분하다.
    source_english: 'Well-off and having enough income. '
    authored_interpretation: having ample household means
    rationale: 살림 concerns household means/living circumstances, not income alone. No threshold of affluence or actual financial assessment is inferred.
