review_limits: >
  These are words for describing or interpreting a speaker's portrayal, not
  validated personality tests, diagnoses, moral standards, financial advice,
  weather forecasts, or guarantees of physical safety. Quiet speech alone
  does not prove coldness. Age/build/appearance comparisons in 당차다 reflect
  a source-described expectation, not an endorsed ability norm. Negative
  judgments need relationship-sensitive teaching and can be recast around
  specific conduct or conditions rather than a person's worth. Qualified
  Korean-language, pragmatic, and pedagogical review remains outstanding.
  No counts, written reading, or module completion award modality mastery.
