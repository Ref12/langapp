  origin_limit: >
    These values were read from the actual matched archive entry features,
    not guessed from English, inserted into the original mirror, or
    extracted by the citation-only helper. Keep the character and
    inborn-character 品性/稟性 and base/wisdom 基地/機智 pairs provisionally
    separate despite equal readings. Absence of an origin feature is
    recorded as absence, not proof of a native or different etymology.
  lexical_names: >
    Distinctly named hope, energy, character and skill words are not
    merged merely from overlapping definitions. Conversely, actual
    faculty/feeling derivatives and added meanings do not increase free
    breadth. All operational family judgments remain unreviewed.
semantic_boundaries:
  - Source descriptions of inborn character are lexical framing, not evidence that character is immutable or genetically determined.
  - 기질33091 does not itself require innateness; its individual/group scope does not permit assigning immutable traits to actual groups.
  - Character, right/wrong judgment, skill, ambition and vigor labels are not rankings of human worth or evaluations of real people.
  - 정력's two positions, 기운's illness/effect positions and vitality words do not establish health, diagnosis, drug efficacy or sexual capability.
  - Recessive does not mean inferior, rare, undesirable or less worthy, and the simplified source definition does not predict a particular genetic cross.
  - 자극 includes causing a response or its stimulus; it is not an instruction to manipulate or induce a physiological reaction.
  - 기운33011 suggests an impending development in context, not a guaranteed prediction or a substitute for evidence.
  - 여력 requires enough capacity left for another task after doing one; mere energy, latent power or motivation does not establish that condition.
  - 기지33082 requires equipped facilities for troops or expeditions to stay and work; it is not any abstract starting point or a named actual installation.
