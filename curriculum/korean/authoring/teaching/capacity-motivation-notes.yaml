  early_practical: >
    Manual skill supports household tasks at5; physical energy and mild
    illness-sign language support care reporting at6. A held future hope
    and actually devoting energy to a task support work/study at8. These
    meanings are not moved late merely to alter the growth curve.
  accounts_and_tasks: >
    Literal bodily reliance enters narration at9. Hopes, expectation,
    liveliness, ability and active energy support experience accounts at10.
    Endurance, attention capacity, visual learning and sticky quality
    support task execution at11. Accelerated learning/completion at12 is
    not proof that a fast course works. Stimulation and vitality at13,
    resourceful methods, preparation, strength and effects at14, and work
    skill, spare capacity and vigor at15 retain their actual conditions.
  explanation_and_evidence: >
    An equipped troop/expedition base at16 is a real homograph, not the
    quick-wisdom meaning or an operational instruction. A measuring
    instrument at17 differs from protected cause/opportunity 계기.
    Decision capacity, resourcefulness and purposeful drive at18 support
    problem-solving; insight, felt atmosphere and an impending-event
    impression at19 distinguish evidence from inference.
  analysis_and_nuance: >
    Physiological stimulus, propulsion and source-limited recessiveness
    enter general-reader science at21. Ambition and contextual discernment
    at22, latent power and intense/single-minded wants at23, and earnest
    hoping at24 support stance. Character framing and influential presence
    at25 do not establish innate group traits. Bodily constitution and
    source-framed inborn dispositions at28 require critical interpretation.
  sensitive_register: >
    Actual 정력001 physical/mental vigor and002 male sexual capacity are
    distinguished, not collapsed into an innocuous first sense. The latter
    enters register interpretation at26, using audience-appropriate,
    fictional or third-person examples under qualified teaching review.
    Do not request personal sexual information, assess performance, imply
    that every vigor use is sexual, or attach worth to sexual capability.
  necessary_concentration_verb: >
    Bounded family comparison found that neither 집중 nor its practical
    predicate was selected. Add actual 집중하다43440-s002 at8 alongside
    the named attention-capacity noun43436 at11, sharing one new 집중
    family. This is one attested missing productive verb, not a generated
    hada form. Full source parent43440 has two positions; the physical
    gathering position001, nominal placements and passive counterpart
    remain unselected. Actual official37047 lists sense IDs2 then1 for
    those ordered definitions; the mirror energy-devotion position remains
    project s002, not a retroactively invented official sense mapping.
