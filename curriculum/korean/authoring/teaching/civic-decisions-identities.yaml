ko-lex-09944: {lemma: 선거구, category: free-lemma, members: [ko-nikl-09944-s001], source_parents: [ko-nikl-09944], rationale: 'A source-listed electoral subdivision, not the election event 선거 itself or a guarantee about present district boundaries or rules.'}
ko-lex-11935: {lemma: 입후보, category: free-lemma, members: [ko-nikl-11935-s001], source_parents: [ko-nikl-11935], rationale: 'Preserve self-candidacy or putting another forward. Do not merge into 출마/후보 from similar English, infer formal registration, or count the unselected candidate-person position separately.'}
ko-lex-19151: {lemma: 득표, category: free-lemma, members: [ko-nikl-19151-s001], source_parents: [ko-nikl-19151], rationale: 'Receiving affirmative votes and the votes received form one source event/result family, not separate heads or a pure numerical counter. Receiving votes does not establish election victory.'}
ko-lex-27209: {lemma: 개표, category: free-lemma, members: [ko-nikl-27209-s001], source_parents: [ko-nikl-27209], rationale: 'Ballot opening/counting and finding the result, not ticket inspection27208. No reading or meaning is borrowed from the ticket-checking noun/predicate family.'}
ko-lex-34345: {lemma: 낙선, category: free-lemma, members: [ko-nikl-34345-s001, ko-nikl-34345-s002], source_parents: [ko-nikl-34345], rationale: 'Election defeat and nonselection in screening/selection remain two source positions of one family. Neither is withdrawal, misconduct, or generic examination failure.'}
ko-lex-39094: {lemma: 민심, category: free-lemma, members: [ko-nikl-39094-s001], source_parents: [ko-nikl-39094], rationale: 'Public thoughts and feelings, not merely the shared opinion 여론 or evidence of a representative poll, unanimity, or a known electoral majority.'}
ko-lex-47133: {lemma: 여야, category: free-lemma, members: [ko-nikl-47133-s001], source_parents: [ko-nikl-47133], rationale: 'Explicit lexical collective naming ruling and opposition political parties, not a generic both-sides pronoun or quantity operator. Its coordinate compound does not merge the two protected constituent families or prove a new independent morphemic root.'}
ko-lex-29867: {lemma: 공약, category: free-lemma, members: [ko-nikl-29867-s001], source_parents: [ko-nikl-29867], rationale: 'An empty promise that cannot be kept, not protected public political promise29866. Preserve the separate source boundary without declaring any actual pledge unfulfillable or equating not-yet-fulfilled with impossible.'}
ko-lex-06300: {lemma: 부결, category: free-lemma, members: [ko-nikl-06300-s001], source_parents: [ko-nikl-06300], rationale: 'A meeting rejection decision or deciding to reject; not mere opposition before a decision, and not an automatic claim that a specific voting procedure or threshold applied.'}
ko-lex-10244: {lemma: 의결, category: free-lemma, members: [ko-nikl-10244-s001], source_parents: [ko-nikl-10244], rationale: 'Decision-making through discussion or its decision. Similarity to protected collective 결의 does not prove synonym identity; voting, unanimity, passage, and implementation are not automatically entailed.'}
ko-lex-10327: {lemma: 의석, category: free-lemma, members: [ko-nikl-10327-s002], source_parents: [ko-nikl-10327], rationale: 'The assembly seat for a legislator is lexical content, not a bound seat-count unit. No separate numerical-counter head, legal mandate, or already-won electoral entitlement is invented.'}
ko-lex-10378: {lemma: 의장, category: free-lemma, members: [ko-nikl-10378-s001], source_parents: [ko-nikl-10378], rationale: 'The person presiding over a meeting on behalf of its organization, not only the National Assembly speaker or an expanded catalogue of government ranks.'}
ko-lex-11824: {lemma: 입법, category: free-lemma, members: [ko-nikl-11824-s001], source_parents: [ko-nikl-11824], rationale: 'Lawmaking chiefly at the National Assembly in the source, not an exclusive present legal-power rule, mere bill introduction, or implementation.'}
ko-lex-14568: {lemma: 정세, category: free-lemma, members: [ko-nikl-14568-s001], source_parents: [ko-nikl-14568], rationale: 'Political developments specifically, not the distinct general unfolding-situation source14569 or a factual diagnosis of any current government.'}
ko-lex-21191: {lemma: 탄원, category: free-lemma, members: [ko-nikl-21191-s001], source_parents: [ko-nikl-21191], rationale: 'An earnest appeal for help because of hardship or grievance, not a court-only filing or a proven legal wrong; do not merge into 청원/민원 merely because English can call them petitions.'}
ko-lex-23190: {lemma: 표결, category: free-lemma, members: [ko-nikl-23190-s001], source_parents: [ko-nikl-23190], rationale: 'Deciding by voting differs from ballot casting, counting, or discussion without a decision. A voting decision does not automatically mean approval.'}
ko-lex-25533: {lemma: 가결, category: free-lemma, members: [ko-nikl-25533-s001], source_parents: [ko-nikl-25533], rationale: 'Approval of a submitted meeting item, not objectively proving it good, promulgating a law, or making it effective. The source does not fix a voting threshold.'}
ko-lex-27142: {lemma: 개정, category: free-lemma, members: [ko-nikl-27142-s001], source_parents: [ko-nikl-27142], rationale: 'Resetting something already determined is kept at its reviewed source boundary, distinct from protected document-correction27141 and unselected lettering/text correction27143; no synonym or etymological merger is presumed.'}
ko-lex-28202: {lemma: 결의, category: free-lemma, members: [ko-nikl-28202-s001], source_parents: [ko-nikl-28202], rationale: 'Firm-resolve noun matches the protected 결의하다28208 event in this existing family. Keep collective meeting resolution28203 and sworn-kinship28204 separate; add no new root.'}
ko-lex-40065: {lemma: 발의, category: free-lemma, members: [ko-nikl-40065-s001], source_parents: [ko-nikl-40065], rationale: 'Proposing a meeting item or that proposed item, not adoption, passage, or an exclusively legislative bill. Event/result metonymy within the single source position adds no extra head.'}
