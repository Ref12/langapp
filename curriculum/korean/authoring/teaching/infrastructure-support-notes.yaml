    Exact Form matching with internal spaces ignored for discovery, across
    every POS in the checksum-pinned January2024 CSV. Original spelling and
    POS remain untouched after a match. This was a named practical-gap query,
    not an exhaustive scan to manufacture new selections.
  recovered: [ko-nikl-13920, ko-nikl-29719]
  already_selected: ko-nikl-20288-s001
  already_selected_note: Standard 리모컨 already supplies remote control; absent 리모콘 is not an extra vocabulary gap.
  absent_named_targets: [개인정보, 계정, 브라우저, 서버, 알림]
  limitations: >
    No unrelated sense or approximately spelled source ID fills these named
    gaps. This result is specific to the pinned mirror and this matching
    method, not a claim about every Korean dictionary or spelling variant.
    Physical wastebasket/mailbox and mental image positions still cannot be
    relabelled as a digital recycle bin/inbox or a digital image.
usage_and_assessment_limits: >
  Building services and electrical/component names support recognition,
  reporting and clarification, not operating instructions, repair competence,
  accessibility certification or a promise of charger/device compatibility.
  Dictionary text, authored interpretations and official citation readings
  are distinct evidence. No text record assesses audio, spoken production,
  learner mastery, official TOPIK level, CEFR or professional readiness.
