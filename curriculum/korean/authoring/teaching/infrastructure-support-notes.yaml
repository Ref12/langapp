    source_english: Difference in electric energy between two points in an electric field or conductor.
    authored_interpretation: voltage; electrical potential difference
    rationale: Raw energy difference omits the per-unit-charge distinction; qualified domain review remains required.
  ko-nikl-28411-s001:
    source_korean: 환자나 장애인을 위해 바닥을 평평하지 않고 기울어지게 만든 통로.
    source_english: 'A passage made with an inclination instead of being flat for wheelchairs or strollers. '
    authored_interpretation: an access ramp for patients or disabled people
    rationale: Preserve the people named in Korean rather than replacing them with devices or imposing a stroller restriction.
