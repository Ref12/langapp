source_boundaries:
  - Computer data17712-s002 is not source evidence/material001.
  - Computer keyboard21011-s004 is not the musical or hotel-key-board positions.
  - Web link20324 is not skating rink20325.
  - Distribution wiring40620-s002 preserves the original repeated Korean words.
  - Profile23489-s001 supplies a brief personal history, not an account or a side-view image.
  - Utility meter28636-s001 does not automatically import general measuring device002.
  - >
    Database17713 broadly includes a program/system and stored data in one
    source position. Do not invent two official senses or teach that a database
    and its management software are universally the same technical object.
