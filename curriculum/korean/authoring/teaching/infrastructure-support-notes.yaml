  not material moved to late levels to improve the phase distribution.
family_adjudications:
  doors:
    existing_lexical_id: ko-lex-38354
    added_member: ko-nikl-45770-s001
    source_comparison: >
      문001 supplies an openable structure for people entering/leaving or
      objects being put in/taken out; 출입문001 explicitly names a door for
      entering/leaving. Conservatively count that specifically people-access
      naming use with the existing door rather than claiming another free
      family. Preserve both records and their different spellings.
    limit: >
      This is an explicit provisional grouping, not a general instruction to
      strip compounds, merge all doors or regard every synonym as one lemma.
