  existing_fragments: 1
  proposed_new_free_identities: 58
  additional_unbanded_support_parents: 47
placement_policy: >
  Official statements and shared public opinion support reporting at 16;
  simplification and adjusting different positions support presentation at 18.
  Evidence, quantitative relations, public institutions, values and argument
  support 19-24. Certainty, ambiguity, speaker/listener roles, register,
  abstraction, literary communities and critical interpretation support 25-29.
  These are useful meanings for those goals, not ordinary early words moved
  merely to make later phases look larger.
identity_policy: >
  Existing 오류 gains only its ordinary fault/mistake position; no second
  free identity is added. Polysemy in 복선, 담화 and public 공론 retains
  one identity per inspected family. Source-listed compounds and property/
  ability nouns are provisional lexical candidates, not mechanically generated
  suffix products or verified counts of true lexemes. 상호 작용 retains its
  space and raw empty POS, separately from its normalized unspecified POS.
homograph_boundaries:
  - Correspondence 부합06719 is not physical joining06718.
  - Public discussion/opinion 공론29734 is not impractical empty discussion29735.
  - Utterance 발화40147 is not ignition40146.
  - Listener 청자44877 is not celadon44876.
  - Literary-community 문단38375 is not a paragraph.
  - >
    Desired rhetorical 수사, current affairs 동향, and circumstantial 경위
    were not supplied by unrelated investigation/numeral, east-facing/hometown,
    right-wrong judgment or police-rank positions. Already selected meanings
    were not duplicated merely because they appeared in the target list.
  - >
    Collecting money under 수렴01633-s001, physical passage under 소통00952-s001,
    physical spreading under 전개13649-s003, and computer 오류48188-s003
    are not part of this abstract/discourse cohort.
usage_limits:
  - >
    Trust, dependability, accuracy, rationality, logicality, objectivity and
    neutrality are not interchangeable. Shared opinion or an official
    statement does not establish truth; a definite judgment is not evidence.
  - >
    The short 상관관계 account describes related variation, not a proof of
    causal direction. A theoretical correlation is not asserted for any
    actual people, groups or outcomes.
  - >
    Both source languages describe 객관성 using broad observer-agreement
    wording. Do not teach unanimity as a sufficient or necessary scientific
    test of objectivity. Bias and subjective perspective require context.
  - >
    기본권 supplies a general rights concept, not jurisdiction-specific
    legal advice. Public interest, private interest, dignity and equity do
    not establish an endorsed political program or particular allocation.
  - >
    공론29735 and 반목 carry critical or adverse meanings; they are not
    neutral labels for every disagreement or instructions for addressing
    other people. Private contingency planning is not wrongdoing by definition.
  - >
    사고력, 판단력, 독해력 and 표현력 name abilities without awarding them.
    Reading, listening, speech, writing and gesture evidence remain separate;
    vocabulary recognition cannot establish any of those abilities.
  - >
    지속성 describes continuity, not an invented environmental-sustainability
    sense. 신뢰도 and 정확도 introduce no numerical reliability/accuracy
    scale. 재구성 is not limited to texts by its classroom placement.
  - >
    사안 preserves the source legal/regulatory context. 모호성 concerns
    multiple meanings in wording, not every uncertainty. 존엄성 keeps the
    broad lofty/solemn quality without inventing a human-only restriction.
