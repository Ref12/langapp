schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: selected source support and readings resolved; linguistic review remains outstanding
scope: >
  Useful public-interest, evidence, discourse, writing and interpretation
  nouns missing from the current core. Targeted communicative questions led
  to exact and space-normalized CSV lookups, followed by full bilingual
  definition and homograph inspection. A second bounded all-POS lookup
  recovered source-listed 상호 작용, which noun-only filtering had missed.
  No source band, alphabetic position or numerical quota selects a meaning.
