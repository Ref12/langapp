  category: free-lemma
  members: [ko-nikl-00298-s001]
  source_parents: [ko-nikl-00298]
  rationale: An independently attested, lexicalized gender-based human-treatment term, not an interchangeable formal variant of general 차별43885, whose source covers distinguishing two or more things by differential treatment. This bounded compound admission does not automatically admit every possible discrimination subtype, establish unlawful treatment, infer motive, or decide a particular case.
ko-lex-25366:
  lemma: 혐오
  category: free-lemma
  members: [ko-nikl-25366-s001]
