ko-lex-51727:
  lemma: 화해
  category: free-lemma
  members: [ko-nikl-51727-s001]
  source_parents: [ko-nikl-51727]
  rationale: Ending fighting and adverse feelings is one source event, not merely agreeing or ceasing hostilities. The matching unselected 화해하다51730 adds no separate head here and is not requested.
ko-lex-22914:
  lemma: 평화
  category: free-lemma
  members: [ko-nikl-22914-s001]
  source_parents: [ko-nikl-22914]
  rationale: Extend the protected peace family with quiet harmony free of worries/troubles, not only the already-selected absence of war or conflict and not a clinical mental-health judgment.
ko-lex-03770:
  lemma: 싸움
  category: free-lemma
  members: [ko-nikl-03770-s002]
  source_parents: [ko-nikl-03770]
  rationale: Contest competition is an explicit additional meaning; relative contest performance is not human worth, and violence is not imposed on every use of the existing fight/struggle family.
ko-lex-03274:
  lemma: 신의
  category: free-lemma
  members: [ko-nikl-03274-s001]
  source_parents: [ko-nikl-03274]
  rationale: Source trust and loyalty, not simply confidence in a proposition or a proven variant of 신뢰/의리. No etymology, Hanja identity, actual motive, or legal good-faith conclusion is claimed.
ko-lex-03301:
  lemma: 신조
  category: free-lemma
  members: [ko-nikl-03301-s001]
  source_parents: [ko-nikl-03301]
  rationale: A firmly upheld belief is retained as a separate source-anchored word, not merged into 소신 or 신념 from similar English. Upholding a belief does not prove its truth or make it universally binding.
ko-lex-01684:
  lemma: 수모
  category: free-lemma
  members: [ko-nikl-01684-s001]
  source_parents: [ko-nikl-01684]
  rationale: The state of undergoing humiliation, not the action noun 모욕 or the internal shame feeling 수치심. These related perspectives are not proven lexical variants or diagnoses.
ko-lex-37490:
  lemma: 모욕
  category: free-lemma
  members: [ko-nikl-37490-s001]
  source_parents: [ko-nikl-37490]
