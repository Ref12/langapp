scope: >
  A bounded follow-up on missing ordinary qualifiers, descriptive states and
  useful senses exposed actual gaps in the live7027-sense core. This is not a
  source-band import, alphabetical partition, advanced-level bucket, or a
  frequency ranking. The same familiar spelling can have a very different
  practical sense: well-functioning is not skilled performance, and barely
  an amount is not at least that amount.
