source_policy: >
  The existing checksum-verifying January2024 extractor was run against all
  proposed support parents before admission. Its full original Korean/English
  lists and definition ordinals, not the joined English references, determine
  every selected position. All68 selected parents have actual citation text
  in the pinned August2026 official archive using the current crosswalks.
  Readings remain separate from original spelling, project sense identity,
  romanization, actual audio assessment and source bands.
decisions:
  modest_quantities_and_comparison: >
    Add full 조금 noun/adverb amount/time forms without counting them apart
    from the stable 좀 family. The small-amount and short-duration source
    definitions coincide, while short-form request softening and emphatic
    intensity need their own context and evidence. Do not substitute 조금
    for every 좀 context. Reclassify the earlier provisional free 좀 family
    as a degree/time/discourse function item under the existing policy;
    preserve its canonical ID, lemma and prior source members.
  not_all_well_is_skillfully: >
    Retain existing 잘003 and add independently placed praise, clarity,
    suitability, trouble-free comfort, habitual frequency, thoughtful care,
    attention, sufficiency, natural tendency, satisfactory function, kind
    care and prosperous living. Moral uprightness001 and attractive
    appearance014 are not automatically selected. No current tourist
    phrase contains 잘, so this change neither substitutes a tourist sense
    nor weakens its independent component requirements.
  conditional_and_scalar_scope: >
    Distinguish 일단 first, provisionally, and once a condition holds.
    하마터면 frames an unrealized near miss, not a completed bad outcome.
    겨우002 gives a restrictive amount, not the source-English minimum.
    고작 noun/adverb, actual 기껏/기껏해야 forms, 불과, 한층 and 훨씬
    count as limiting/comparative function families rather than free roots.
    겨우 retains one lexical effortful-attainment family; its scalar extension
    adds no independent headword. 막상 and 기왕 are discourse framing.
  actual_derivatives_only: >
    Merge the inspected predicate/manner pairs 느닷없다/느닷없이,
    거뜬하다/거뜬히, 꿋꿋하다/꿋꿋이, 끊임없다/끊임없이 and
    어지간하다/어지간히. Add 웬만큼 to protected 웬만하다, the actual
    무심하다 positions to 무심, and reduplicated 서먹서먹하다 to 서먹하다.
    This does not license generated 하다/히 variants or synonym merging.
  nonparallel_positions: >
    어지간하다003 means more amenable than expected, whereas its004 is
    difficult temperament. Adverb 어지간히003 corresponds to that difficult
    temperament, not adjective003; its004 is an unusually high degree.
    Keep all original IDs and do not zip noun/predicate/adverb positions.
  observed_affect_and_register: >
    덤덤하다 and 태연하다 can describe outward response without proving
    inner indifference. 담담하다005 actually concerns lack of interest,
    unlike its already-taught composed tone. Report one's own feelings or
    explicitly qualify interpretations of others. Teach disparaging
    우습다/우스꽝스럽다 and petty 시시하다 through attributed contextual
    interpretation, not as objective labels for people or recommended insults.
  homograph_boundaries: >
    The loneliness/blocked-feeling parent 막막하다35999 is not a substitute
    for protected vast-distance/vague-outlook36000. Preserve both inspected
    source boundaries provisionally; equal spelling/pronunciation alone does
    not prove a lexical merge. The noun 일단11410 is not ordering adverb11411.
    The 어쩌면 interjection46567 deepens the existing surprise function,
    not the empty-POS 어찌하면 contraction46568.
  placement: >
    Clarity and attention enter first-contact repair, amount/time forms enter
    levels3-4, and 훨씬 supports level7 comparison. Ordinary feelings and
    actual-event narration belong mainly in levels9-13. Argument scope,
    attributed attitude and nonparallel degree/register distinctions enter
    later interpretation tasks. No word was moved later simply to enlarge
    phase counts and no module was created to meet a quota.
excluded_after_inspection:
  - Innocently punished 애매하다04857 is not the already-taught ambiguous homograph.
  - The literal chilly 아슬아슬하다04213-s001 and arrogant 시큰둥하다02977-s001 are not automatic first-sense additions.
  - The noun-past uses 이왕10865 and 기왕32992 remain outside this practical selection.
  - The unmarked affirmative-utterly 도무지17865-s002 and slight-degree 자칫12407-s002 need further usage review.
  - Clear/quiet water 담담하다16675-s003 and atmospheric 은근히50891-s002 are not literary quota fillers.
  - The skill-excellence 묘하다37889-s003 and the expressive 시시껄렁하다02857 are not required by this cohort.
  - No empty-POS 아무래도04163 or 어쩌면46568 reading is borrowed from a different dictionary parent.
  - The exact spelling 마지못해 was not found; no project NIKL ID is fabricated for it.
