  core_senses: 12
  source_parents: 12
  distinct_spellings: 12
  new_provisional_free_families: 4
  new_bound_or_function_families: 0
  support_parent_requests: 0
counting_policy: >
  Twelve source spellings are not twelve new free bases. For each direction,
  the long and short names refer to the same compass direction; the facing
  source explicitly also includes that direction. Conservatively group each
  three-record family while retaining its distinct forms and usage. This
  is not proof of true lexeme boundaries, a general suffix-stripping rule,
  a merger of different cardinal directions, or automatic per-item mastery.
placement_rationale: >
  Level7 supports map directions and comparing lodging or travel locations.
  Housing-facing forms remain in that same level rather than preceding the
  direction names or becoming advanced filler from their reference bands.
  These words do not become mandatory anchors for every location construction
  or for tourist phrases that do not actually contain them.
source_boundaries:
  - East18298-s001 is not district/office18300 or building counter18302.
  - West09686-s001 is a direction noun, not a predicate ending or an institution-name suffix.
  - South34596-s001 is neither other people34584 nor male person34594.
  - North06746-s001 is not drum06745.
  - East-facing18601 is neither same-hometown18600 nor movement/trend18602.
  - North/South-Korea contextual positions under06791/34683 stay unselected here.
  - Eastern-region18298-s002 and the metalinguistic compound use003 are not automatically selected.
  - >
    Sunrise/sunset wording in the source is an ordinary directional
    description, not an exact seasonal bearing or navigation procedure.
    Room direction does not guarantee sunlight, comfort, accessibility or views.
source_correction_requests: {}
reading_policy: >
  Assess each actual selected parent independently. Do not transfer a
  direction's reading to a compound, or infer a reading solely from spelling.
  Source labels, dictionary citation text, actual spoken evidence and learner
  knowledge remain separate; no audio or pronunciation mastery is inferred.
