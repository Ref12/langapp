scope: >
  A spelling-level coverage check found that cardinal direction words were
  not already hidden under another canonical family. Supply the four everyday
  direction names, their short map-label nouns, and actual direction/facing
  nouns for maps, travel and lodging descriptions. All12 parents are already
  retained banded references, so no source recovery or invented compound is needed.
