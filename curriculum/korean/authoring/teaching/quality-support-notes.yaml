placement_policy: >
  Suitability supports comparing choices at 13; fair allocation supports
  cooperation at 15; rigor supports evidence at 19; injustice supports
  competing values at 22. Precise qualification supports argument at 23;
  coherent clarity supports formal synthesis at 24; cumbersome expression
  and candid disclosure support audience-sensitive register at 26.
  No source order, band, or numerical quota assigns the placements.
family_decision:
  identity: ko-lex-46793
  descriptive_sense: ko-nikl-46793-s001
  adverb_sense: ko-nikl-46794-s001
  source_descriptive_definition: 빈틈이나 잘못이 전혀 없을 만큼 엄격하고 세밀하다.
  source_adverb_definition: 빈틈이나 잘못이 전혀 없을 만큼 엄격하고 세밀하게.
  rationale: >
    Both actual source forms express the same rigorous-precision content in
    descriptive and manner formulations. Count one provisional family rather
    than an extra free lemma for this specifically attested adverb. This does
    not license generating 엄밀히 or merging arbitrary related adjectives
    and adverbs. The noun/adverb 실상 decision remains separately documented.
