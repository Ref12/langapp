descriptive_not_prescriptive:
  - Prescriptive wording in source definitions remains dictionary evidence, not this curriculum's command, an empirical consensus, or a universal moral standard.
  - Duties described by 의리 are framed as expectations within relationships; no person or status is assigned greater intrinsic worth.
  - The labels do not establish anyone's actual motives, sincerity, loyalty, prejudice, culpability, or moral character.
  - 성차별 names a concept; it does not make a legal finding about any particular treatment or jurisdiction.
  - 모욕 and 수모 do not establish legal defamation, a clinical diagnosis, trauma, or a particular internal emotional response.
  - Trust, an upheld belief, or a claimed justification is not proof. Praise is reported appreciation, not certified merit.
  - Reconciliation is not advice or an obligation to forgive, restore contact, or resume a relationship.
  - Kinship-like or legally described connections do not determine actual legal kinship, entitlement, nepotism, or the legitimacy of a family.
  - Contest performance is not human worth. Struggle need not involve physical violence, and naming a movement does not endorse it or imply its success.
placement_rationale:
  relationships_and_feedback: Praise vocabulary and source-defined personal connections enter at 8, supporting study/work relationships and feedback.
  personal_accounts: >
    At 9, 인연's reason/background position supports narration. At 10,
    quarrels, dislike/hatred, experiencing humiliation, family-like bonds,
    and peaceful conditions support personal accounts without diagnoses
    or inferred motives.
  contests_and_problems: Contest meanings enter at 13, without labeling every competition violent. Insulting treatment enters at 14 for describing unfamiliar interpersonal problems.
  cooperation: >
    At 15, friendly ties, backing trust/loyalty, relational expectations,
    reconciliation, mutually helpful living, link-making, and reference
    to both parties support cooperation and responsibility discussions.
  general_reading: >
    Gender-based discrimination and the source social/labor-movement
    struggle meaning enter at 16 for understanding attributed reports.
    A firmly upheld belief enters at 22 with values/perspectives. No
    abstract noun is moved to 25-30 merely to fill later phases.
  near_meaning_choices: >
    친선 supplies the actual friendly-closeness word without an invented
    international-only restriction; 신조 highlights a belief one upholds;
    공생 supplies the explicitly mutually helpful living meaning rather
    than bare pair-reference. These are separately inspectable words,
    not newly discovered concepts or frequency claims.
identity_policy:
  source_policy: Follow the current selection-notes.yaml policy; source-parent IDs are stable local anchors and provisional candidates, not verified true-lexeme counts.
  no_synonym_merging: >
    Similar English or one similar Korean definition does not prove a
    variant. Preserve 예의/예절 and every other old family. Newly selected
    친선 is not merged into 친목; 공생 is not merged into 공존; 신조 is
    not merged into 소신/신념; 신의 is not merged into 신뢰/의리.
  real_noun_predicate_joins:
    ko-lex-16282:
      canonical_lemma: 다투다
      new_noun_parent: ko-nikl-16283
      protected_predicate_parent: ko-nikl-16282
      analysis: >
        An explicit lexical nominalization analysis, supported by the actual
        다툼 form and full fight/competition noun and predicate definitions.
        This is not a claim of historical etymology. Noun positions1/2
        retain their own scopes; predicate imminence and competitive-effort
        positions are not projected into nonexistent noun positions.
    ko-lex-20531:
      canonical_lemma: 칭찬
      new_noun_parent: ko-nikl-20531
      protected_predicate_parent: ko-nikl-20532
      analysis: The actual nominal appreciation event and its words extend the protected family already containing 칭찬하다; canonical lemma/category remain unchanged.
  category_alternation:
    ko-lex-09304:
      canonical_lemma: 상호
      category: function-item
      new_noun_parent: ko-nikl-09302
      protected_adverb_parent: ko-nikl-09304
      analysis: >
        Same-written-form noun/adverb category alternation with parallel
        full definitions referring to both sides in a pair or relationship.
        The noun fills a nominal reference slot; the adverb distributes
        reference/action over those sides. This is not a new free abstract
        reciprocity noun, a claimed Hanja identity, or a merger with merely
        synonymous 서로.
  other_existing_depth: >
    New positions extend the already selected 싸움, 평화, 인연, and 연계
    families without changing their canonical values or repeating old members.
  no_predicate_imports: >
    Actual 혐오하다25370, 투쟁하다21980, 공생하다29823, 화해하다51730,
    and 모욕하다37496 were inspected as corresponding predicates but were
    unselected in the inspected live composition. They are not new placements
    or support requests. Future parent-approved counterparts need matching
    family analysis rather than automatic extra roots.
  nominal_perspectives: >
    모욕's action/treatment, 수모's undergoing humiliation, and protected
    수치심's internal shame feeling are related but differently worded
    perspectives, not proven lexical variants. No synonym or inverse-event
    merger is inferred just because English uses humiliation.
meaning_boundaries:
  - 상호09302 denotes both related or paired sides, which can be physical or social; it does not itself assert cooperation, equal status, mutual benefit, or a moral duty of reciprocity.
  - 공생29822-s001 includes mutual help in general living together; parent additionally selects actual s002 with its different-kind biological restriction, not every form of symbiosis.
  - 연계47332-s001 is causing links or connections, not necessarily cultivating personal contacts; the existing second position is a close relationship state.
  - 인연11229-s003 supplies a reason or background history, not proof of predestination, a hidden motive, or a causal theory.
  - 연고47338-s002 includes connections by kinship, closeness, law, etc.; it is not restricted to local contacts and is not medicinal ointment.
  - 의리10282-s002 is framed as expected relational loyalty/duty, not a universal obligation; s003 is a family-like bond without blood ties, not necessarily a sworn oath or legally recognized adoption.
  - 화해 includes ending fighting and ill feeling, not merely agreeing, consulting, or temporarily stopping hostilities.
  - 평화22914-s001 is quiet harmony free of worries/troubles, not exclusively an absence of war or a clinical state of mind.
  - 싸움03770-s002 and 다툼16283-s002 concern competition; they are not simply additional violent-fight senses.
  - 투쟁's opponent-directed and movement-specific positions seek victory or gains; success and physical violence are not automatic entailments.
  - 신의's trust/loyalty and 신조's upheld belief remain distinct from evidence that an assertion is true or a person is trustworthy.
  - 칭찬 retains appreciation expressed in words and the resulting remark; no source assertion about deservedness, objective superiority, or an obligatory response is added.
