documented_group_decisions:
  ko-lex-06409: 'Source 06409 describes envy of another''s achievement or possession; 06406 is the actually attested
    experiencing verb 부러워하다. Count one conservative envy base here without asserting identical syntax, productive
    interchangeability, or independently verified derivational identity.

    '
  ko-lex-30563: 'Source 30563 describes bodily or mental distress and 30561 is the actually attested suffering verb
    괴로워하다. The conservative single-base accounting does not turn a descriptive predicate into a freely generated
    verb.

    '
  adverb_only_after_rescope: '매번, 매일, 계속, 거의, 혼자, 스스로, 직접, 만약, 만일, 방금, 대강, 대략, and 보통 retain only their inspected
    adverbial source parents. Their earlier noun memberships are removed, not claimed as completed noun coverage.
    Stable local keys and canonical spellings remain. Possible future noun/adverb identity relationships require
    parent review, including the differing content/function implications for 대략.

    '
  ko-lex-17008: 'Only adverb parent 17009 remains. Its rough-estimation meaning is conservatively function-accounted
    now that outline noun 17008 is outside this cohort. This is an explicit revision to an unintegrated draft group,
    not a change to a protected identity or a POS-based placement rule.

    '
  ko-lex-32008: 'The two adverbial 그럼 positions match the conditional and prior-point uptake meanings of 그러면 and
    use its familiar shortened form. The separately sourced emphatic affirmative interjection 32033 is not included.

    '
  ko-lex-10549: '이따 and 이따가 are the shorter/fuller temporal forms with the inspected little-later meaning. They
    are not the inflected sequence 있다가.

    '
  ko-lex-25721: 'The new 가만 parent has the same three retained Korean definitions as the corresponding 가만히 positions:
    stillness/silence, inaction, and calm attention. Preserve the existing canonical lemma and category. This decision
    is not a rule to remove 히 from other adverbs.

    '
  ko-lex-51408: 'The source explicitly defines 혹시나 as emphatic 혹시. Extend the protected function identity with only
    the new parent/sense and preserve the original tentative and hesitation meanings in protected data.

    '
  ko-lex-42538: 'The previously unselected second adverbial position of protected parent 42538 contrasts the present
    with past/future. It replaces the draft noun additions; source noun parent 42537 is deferred. Preserve the existing
    free-lemma category, canonical lemma, and all protected memberships.

    '
homograph_rationales:
  ko-nikl-36566: Correct-answer 맞히다, not the target-hitting/causing-to-receive source.
  ko-nikl-36567: Target-hitting/causing-to-receive 맞히다, not getting an answer correct.
  ko-nikl-28958: Choosing 고르다, not even or uniform conditions.
  ko-nikl-28960: Evenness and steadiness 고르다, not the choosing verb.
  ko-nikl-36570: Responsibility, custody, and authorization 맡다, not smelling.
  ko-nikl-36572: Smelling and inferential sensing 맡다, not taking responsibility.
  ko-nikl-16567: Attachment and its selected extensions, not weighing or protected sweet-taste 달다.
  ko-nikl-16568: Weighing 달다, not attachment or protected sweet-taste source 16570.
  ko-nikl-32033: Affirmative interjection 그럼, not the adverbial short form of 그러면.
  ko-nikl-17291: Discourse-focused 대체, not protected substitution noun 17290.
  ko-nikl-32104: Stopping-action 그만하다, not a descriptive degree homograph.
  ko-nikl-43854: Fullness and its selected extensions, not kicking, wearing, or coldness.
  ko-nikl-43856: Kicking with separately marked slang and figurative extensions, not the other 차다 homographs.
  ko-nikl-43857: Wearing or fastening an item to the body, not fullness or kicking; the slang second position is
    unselected.
  ko-nikl-43858: Cold temperature or an unfriendly expression, not a filling, kicking, or wearing verb.
  ko-nikl-44318: Locking or fastening, not filling a container or meeting an amount.
  ko-nikl-44319: Filling or satisfying, not fastening a closure.
review_flags:
  lexical_boundaries: 'The two conservative emotion-base groupings and the independent treatment of other sourced
    derivational predicates require lexicographic review. The declared counts are provisional; neither raw rows
    nor spelling/POS pairs establish true lexical breadth.

    '
  category_borderlines: 'Temporal/aspect and frequency adverbs, especially 아직/이미 and 매번/매일, can receive different
    theoretical function-word analyses. Likewise 특별히, solitary/comitative expressions, 직접, and mixed 곧/바로/어서 merit
    category review. Their current accounting is explicit, stable, and not silently copied from POS or chosen to
    inflate breadth.

    '
  polarity_and_concession: 'Teach 도저히, 별로, 전혀, 아무런, and 아무리 with their appropriate negative or concessive environments.
    전혀 also retains complete degree. 아무리 is not a freely interchangeable positive 매우. Labels and the proposed clarifications
    are authored usage interpretations needing teacher review, not new conjugation rows.

    '
  reference_time: 'The retained 방금 definitions distinguish just-before, at, and just-after speaking within the adverb
    parent; do not count them as separate words. Contemporary distribution and production contexts for the less
    usual present/future readings need review. 금방''s immediacy is not restricted to an already ongoing present event,
    and 벌써''s two source positions differ.

    '
  interpersonal_register: 'Affirmative 그럼 has emphatic confidence, not the neutral all-purpose politeness of 네.
    대체''s selected source focuses on the point of discourse; it is not simply substitution. Production examples
    should establish conversational tone rather than infer it from a short English gloss.

    '
  reference_constructions: '대하다''s subject/counterpart sense supports referential use, but a construction such as
    에 대해 does not become another lexical identity. Main-verb 시키다 is sourced independently; no productive causative
    suffix or automatically generated X시키다 family is added.

    '
  descriptive_and_social_judgments: '모자라다''s ability/knowledge shortfall and 약하다''s frailty are not clinical diagnoses
    or neutral labels for a person''s worth. The source''s personality judgments remain recognizable in labels for
    뾰족하다 and 둥글다. Tongue-clicking is an attested action, not an assertion that its pragmatic meaning or politeness
    is constant across contexts.

    '
  introduced_homographs: 'The four 차다 and two 채우다 source boundaries are retained provisionally because their inspected
    meanings and argument structures differ. Related cold predicates and sourced causative/intransitive pairs still
    require lexical-boundary review; no shared spelling or derivational suffix mechanically decides identity.

    '
remaining_scope:
- The original free-lemma planning guide remains far unmet; this cohort is not a complete-course claim.
- Broader everyday descriptive qualities, spatial motion and manipulation, and ordinary social evaluation still
  need further targeted curation.
- Later general-interest argument, interpretation, arts, institutions, and independent-project breadth still need
  expansion where useful meanings genuinely justify it.
- Inflected or unspecified contraction source 31988 그래도 is not added as a new vocabulary headword.
- Restricted giving/request predicate source 16569 달다 remains unselected pending form and identity review; it is
  not confused with weighing or attaching.
- Specialist, slang, and uncommon figurative positions of large predicates were inspected but are not automatically
  added.
- Missing official readings and unresolved lexicographic boundaries require their own evidence rather than guessed
  replacements.
