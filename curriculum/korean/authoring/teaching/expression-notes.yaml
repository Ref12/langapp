schema_version: 1
review_status: AI-authored; requires qualified Korean-teacher and lexicographic review
completion_status: coherent expression selection; not complete-scale coverage
scope:
- Only expression-vocabulary.yaml, expression-identities.yaml, and this file are authored here.
- The active selection contains predicates, descriptive words, adverbs, and conversational function items, not noun
  additions.
- Noun rows from the earlier draft are deferred to the separate noun cohort; this is ownership separation, not a
  teaching-placement rule.
- The original cohort author did not inspect the active noun files; parent integration now checks the completed content cohort too.
- All previously authorized selection sets, including committed kitchen and personal, remain protected.
- The original cohort author did not change the source registry, reading overlay, correction ledger, manifest, grammar, or runtime.
- Candidate discovery followed concrete communicative needs, followed by inspection of bilingual source positions.
- Every selected sense, teaching location, topic, and label was manually authored.
- No source-band, alphabetical, first-sense, or numeric-capacity rule selects or schedules these rows.
- No source predicate is synthesized from a noun, suffix, phrase, or inflected surface.
integration:
  selections: >
    selection-files.yaml registers both expression files after the completed
    content cohort. Parent checks found no source-ID collisions or conflicting
    existing identity keys across the full manifest; nothing is silently deduplicated.
  validated_protected_sets: [base, early, expansion, breadth, community, kitchen, personal, content]
  deferred_manifest_inputs: []
  identity_fragments: 'Existing ko-lex-42538, ko-lex-25721, and ko-lex-51408 receive only new expression members.
    Their canonical lemmas and count categories are preserved. Other identity groups are new local declarations.
    Stable local keys are retained when a draft noun/adverb group loses its noun members; a key''s ordinal suffix
    is not a claim that its namesake source parent is selected. Only members and source_parents declare that. Future
    noun/adverb consolidation and any category reconciliation belong to the parent, not an automatic same-spelling
    merger.

    '
  corrections: >
    All fourteen requests below are incorporated into the parent-owned ledger
    with exact retained Korean/English and the selected interpretation.
    Polarity and usage clarifications remain unreviewed authored interpretations,
    not official dictionary errata or changes to the pinned source.
  readings: >
    All eight originally missing parents, covering twenty-one selected
    senses, now have explicitly matched official citation text. Complete
    ordered source definitions and competing homographs were compared.
    No authored reading was added. resolved_reading_gaps retains the original
    resolver snapshot as history; there are no remaining selected gaps.
    The historical fire-lighting position of 당기다 remains unselected and
    is not verified as a meaning by the current primary official entry.
curation_rationales:
  feelings_and_sensation: 'Add useful distinctions among boredom, repeated tedium, worry, frustration, embarrassment,
    envy, unfair treatment, warm satisfaction, clear conscience, shamelessness, fatigue, itching, stinging, and
    numbness. Physical and emotional uses of the same predicate deepen it without adding headwords.

    '
  perception_and_judgment: 'Looking upward, observing attentively, recognizing, understanding speech, assessing
    ability, being deceived, concealing facts, getting an answer right, adjusting something, and moral incorrectness
    support different communicative tasks. Ordinary difference is not relabeled as 틀리다.

    '
  agency_and_relationships: 'Choosing, deciding, hesitating, wavering, sharing, forming relationships, taking initiative,
    interfering, quarreling, recommending, accepting responsibility, obtaining permission, and completing or abandoning
    work support connected accounts of everyday social action.

    '
  native_predicate_depth: 'Important noninitial positions include calling with 걸다, elapsed time with 걸리다, scheduling
    and estimates with 잡다, settled dates with 잡히다, appended explanation with 달다, reasons and disclosure with 대다,
    and interpersonal treatment with 대하다. These are not additional lemmas for every English translation. Unsupported
    or unnecessary specialized, slang, and highly context-dependent positions are not swept into the selection.

    '
  narrative_modifiers: 'Frequency, continuity versus resumption, intentional versus inadvertent action, simultaneous
    versus successive action, recent past versus immediacy versus near future, gradual change, and expected versus
    unexpectedly early completion support coherent narration and explanation.

    '
  conversational_operators: 'Conditional uptake, contrast, reformulation, conversation opening, reciprocal reference,
    self-reference, degree, uncertainty, and emphatic replies are explicitly function-accounted rather than free-lemma
    padding. Simple routines receive genuinely elementary frequency and timing words; later argument and register
    uses are introduced where their goals fit.

    '
  source_positions: 'Identical or near-identical English paraphrases never authorize discarding different original
    positions. In particular, matching an answer is not hitting a target, weighing is not attaching or tasting sweet,
    and responsibility 맡다 is not the smelling predicate.

    '
  handling_and_movement: 'Standing things up, seating people, moving aside, pushing versus pulling, dragging versus
    leading, moving belongings, transferring positions, and stopping movement support home, travel, and ordinary
    work. Vacancy, being briefly away, and freeing time are different source positions, not one guessed translation
    of empty.

    '
  quantities_and_outcomes: 'Physical expansion versus quantity increase, improved skill versus longer duration,
    shrinkage versus reduction, leftovers versus profit, remaining versus deliberately leaving something, and reaching
    or exceeding a limit support plans and connected explanations. Successful progress is not silently inferred
    from an unchanged state, and having distance still to go is not automatically failure.

    '
  access_and_communication: 'Flow, coherent meaning, effective acceptance, connected routes, understood intentions,
    passage, intermediaries, and experience-based knowledge retain distinct 통하다 positions. Obstruction, prevention,
    defense, and covering a debt retain separate 막다 meanings. Literal openings and finding a solution are different
    뚫리다 outcomes.

    '
  descriptive_contrasts: 'Strength, frailty, resistance, resolve, skill, appropriate degree, sufficiency, thinness,
    thickness, grain size, voice resonance, roundness, and four-sided shape support concrete description without
    specialist terminology padding. A thin long object is not necessarily a thin sheet, four-sided does not require
    equal sides, and resonant voice does not mean low measured decibels.

    '
  fullness_wearing_and_tone: 'Fullness 차다, kicking 차다, body-worn-item 차다, and cold 차다 retain distinct source parents.
    Dumping a partner is explicitly slang; rejecting an opportunity keeps its figurative marker. Unfriendly expression
    is not neutralized into pleasant coolness. Fastening 채우다 is not filling 채우다. A conventional letter-closing use
    of 줄이다 is a source sense, not a new inflected headword.

    '
  register_qualifiers: 'Preserve source-marked figurative, derogatory, dated, respectful, humble, emphatic, or otherwise
    meaningful usage restrictions in the short label. The explicit emphatic marker on 혹시나 remains in its label.
    Additional figurative/emotional clarifiers distinguish the selected abstract or emotional uses of 흔들다, 흔들리다,
    달아나다, 쫓기다, and 저리다 from physical interpretations. Those clarifiers describe the inspected meanings; they are
    not invented claims of dictionary register markings. No placement was moved to make room for these labels.

    '
identity_policy:
  status: 'These are documented, provisional teaching identities, not independently proven true-lexeme counts. Report
    selected source parents, senses, spellings, identities, and free candidates separately.

    '
  identifiers: 'ko-nikl IDs retain pinned CSV record ordinals and original definition positions. ko-lex IDs are
    stable local identity names, not official dictionary identifiers.

    '
  explicit_decisions: 'Every identity''s lemma, category, source-parent membership, and concise semantic rationale
    was authored directly. Mechanical materialization only enumerates already-selected sense IDs belonging to those
    declared parents. It does not choose a sense, label, level, category, or lexical merger.

    '
  content_candidates: 'Independently sourced predicates and the specifically declared lexical manner, frequency,
    and temporal expressions are free-lemma candidates. Only the retained non-noun meanings support the current
    identity declarations. Directly acting, ordinary frequency, and non-detailed presentation remain lexical manner/frequency
    candidates; their noun counterparts are not selected here. POS is not a teaching-location rule.

    '
  function_accounting: 'Pure degree/focus, discourse connection, reciprocal/comitative relations, indefinite or
    self-reference, hypothetical framing, and directive expressions are explicitly function items. The attested
    small-increment expression 조금씩 contributes no new free-content count. 대략''s rough-estimation adverb is
    conservatively a function item. Parent integration later adds its outline noun in society without changing
    that mixed family''s provisional category or asserting noun/adverb syntactic interchangeability.

    '
  mixed_ranges: '곧 and 바로 retain lexical timing/manner candidates, with discourse senses adding no further identity.
    어서 is conservatively a directive function identity even with its prompt-action adverbial sense. These are explicit
    accounting judgments, not a universal linguistic taxonomy.

    '
  bound_forms: 'No new bound-form identity is selected here. No noun parent remains in the active selection, and
    no productive particle or conjugation is promoted to a headword.

    '
  derivation_and_synonymy: 'Actual sourced active/intransitive or causative/passive predicates remain reviewable
    individual candidates unless an explicit grouping below says otherwise. No global suffix-stripping or English-synonym
    merger applies. Distinct forms such as 만약/만일, 혼자/홀로, 늘/항상, and 대강/대략 are not asserted to be spelling variants
    just because their meanings overlap.

    '
