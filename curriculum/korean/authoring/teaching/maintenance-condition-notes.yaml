placement_rationale:
  ordinary_service_needs: >-
    Pending leakage, water-supply interruption, power-supply interruption,
    unusable breakage and water supply support everyday service communication
    at6. No participant is assumed to have caused a failure or owe compensation.
  procedures_and_unfamiliar_problems: >-
    General joining and the appearance/state of a join support describing
    connections at11. Quality deterioration, destructive damage, overheating,
    cracks, wear, aging equipment, drainage, sealing and insulation support
    unfamiliar product/housing reports at14. Wiring activity and cooling
    support nonspecialist system descriptions at17, not operating instructions.
  sourced_extensions_and_register: >-
    Ordering a disordered system supports cooperation at15. Excessive
    activity, distance between people, a figurative rift and cooled relations
    support negotiation at18. Claims of harm to value/reputation belong in
    qualified argument at23; slang bodily 고장 is receptive register work at26.
    These meanings do not imply blame, actual defamation, diagnosis or an
    irreparable relationship. No artificial 19-30 fill is added.
