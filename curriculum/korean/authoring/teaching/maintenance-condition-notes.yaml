family_policy: >-
  Preserve all protected keys, names, categories, members and placements.
  Actual synonymy is not proof of morphological variation, and a new source
  parent is not proof of a new independent family. Source-listed noun/predicate
  and restricted-compound relationships are compared explicitly; no predicate
  is created or selected. Existing overlapping infrastructure families are
  not retroactively merged by this cohort.
