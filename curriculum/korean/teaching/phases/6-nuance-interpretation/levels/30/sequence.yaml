goals: &id001
- Synthesize demanding material for a chosen Korean-speaking audience.
- Sustain an extended written project or discussion with explicit source boundaries.
- Revise a defended conclusion after substantive feedback.
checkpoint:
  task: Complete a source-based project, respond to critique, and explain remaining uncertainty and revisions without equating completion with global mastery.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
