goals: &id001
- Interpret a familiar idiom or figurative comparison from context.
- Distinguish literal quantity from a rhetorical degree expression.
- Paraphrase imagery in ordinary Korean before attempting productive use.
checkpoint:
  task: Explain the effect of an unfamiliar use of a familiar expression and contrast it with a literal paraphrase.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
