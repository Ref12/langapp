goals: &id001
- Interpret shared-knowledge, surprise, and conjectural endings in context.
- Explain how an indirect message can imply criticism or concern.
- Rephrase a dismissive response without losing its factual content.
checkpoint:
  task: Compare two plausible readings of an indirect exchange and justify a considerate response.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
