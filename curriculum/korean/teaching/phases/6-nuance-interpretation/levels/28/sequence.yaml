goals: &id001
- Specify the scope, degree, and limiting conditions of an abstract claim.
- Distinguish practical equivalence from a deliberately adopted hypothetical framing.
- Revise vague comparisons with explicit standards.
checkpoint:
  task: Revise an imprecise explanatory passage and justify how each revision changes its meaning or scope.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
