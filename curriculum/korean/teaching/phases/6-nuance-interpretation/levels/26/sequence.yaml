goals: &id001
- Recast an account between polite conversation and plain written narration.
- Preserve subject and recipient respect when changing listener endings.
- Identify forms whose literary or institutional tone is unsuitable for routine conversation.
checkpoint:
  task: Adapt the same request and account for a friend, a public notice, and a formal addressee, explaining the changes.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
