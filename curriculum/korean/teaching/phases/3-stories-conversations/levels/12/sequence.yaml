- id: level-12-register-practice-01
  title: Register and nuance - sentence practice 1
  outcome: Adapt listener endings and implied stance to audience and relationship.
  vocabulary: []
  grammar:
  - {id: ko-teaching-g002, ch: V-ㄴ/는다 / A-다 / N(이)다, ds: 'distinguish plain action, descriptive, and noun endings'}
  review_vocabulary:
  - {id: ko-nikl-03975-s001, ch: 씨, pr: 씨, ds: respectful title attached to a person's name}
  - {id: ko-nikl-35196-s001, ch: 너, pr: 너, ds: you (to a friend or junior)}
  - {id: ko-nikl-49275-s003, ch: 우리, pr: 우리, ds: our; my (expressing familiar affiliation)}
  - {id: ko-nikl-47062-s001, ch: 여러분, pr: 여러분, ds: you all (respectful address)}
  review_grammar:
  - {id: ko-topik1-g017, ch: V/A-ㅂ니다 / -습니다, ds: formal polite statement to a listener}
  - {id: ko-teaching-g001, ch: V/A-아/어 / N(이)야, ds: use familiar endings only for a suitable relationship}
- id: level-12-communication-practice-02
  title: Communication and information - sentence practice 2
  outcome: Repair ambiguity and relay information with clear attribution.
  vocabulary: []
  grammar:
  - {id: ko-topik3-g001, ch: V-ㄴ/는다고 하다, ds: report an action-verb statement}
  - {id: ko-topik3-g002, ch: A-다고 하다 / N(이)라고 하다, ds: report a descriptive or noun-predicate statement}
  - {id: ko-topik3-g003, ch: V/A-냐고 하다, ds: report the content of a question}
  review_vocabulary:
  - {id: ko-nikl-09344-s007, ch: 새다, pr: 새다, ds: for a conversation to drift off its main topic}
  - {id: ko-nikl-27581-s002, ch: 건너다, pr: 건ː너다, ds: for words or rumors to be passed to someone else}
  - {id: ko-nikl-42555-s003, ch: 지나가다, pr: 지나가다, ds: to say something in passing without special intent}
  - {id: ko-nikl-16238-s008, ch: 다음, pr: 다음, ds: what follows immediately in speech or writing}
  - {id: ko-nikl-00597-s003, ch: 소개, pr: 소개, ds: an introduction explaining unfamiliar facts or content}
  - {id: ko-nikl-01943-s001, ch: 수정, pr: 수정, ds: correcting or refining something that is wrong}
  - {id: ko-nikl-27915-s001, ch: 게시, pr: 게ː시, ds: posting something for public viewing}
  - {id: ko-nikl-35592-s001, ch: 녹음, pr: 노금, ds: recording sound; the recorded sound}
  review_grammar:
  - {id: ko-topik2-g026, ch: 'V/A-지요? / -죠?', ds: check shared information or seek confirmation}
  - {id: ko-topik2-g033, ch: V-는데 / A-(으)ㄴ데, ds: offer background or a contextual contrast}
  - {id: ko-topik3-g033, ch: N에 대해 / N에 대한, ds: identify the topic of an account or noun phrase}
