goals: &id001
- Explain a system or environmental process to a nonspecialist.
- Describe variation and degree without confusing correlation with cause.
- Explain an achieved outcome and a remaining limitation.
checkpoint:
  task: Explain a practical technology or environmental choice and answer a changed-condition question.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
