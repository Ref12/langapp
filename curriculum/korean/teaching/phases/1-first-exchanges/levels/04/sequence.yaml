schema_version: 3
id: ko-level-04
title: Routines and plans
language: korean
level_basis: Independent communicative progression, not an official TOPIK mapping or examination qualification. Phase headword targets indicate planning scale, not quotas or demonstrated competence. Original AI-authored content requires qualified Korean linguistic review.
review_policy: Each module introduces at most 25 senses and 3 constructions across small adaptive lessons of about 5-8 new senses; reduce new material when retrieval or inflection is fragile. Select relevant earlier items for retrieval on later days and record modality, assistance, and repair. Reuse familiar vocabulary while changing particles, endings, participants, and register. Coverage is not mastery; target headword scales do not justify filler or forced advancement.
kind: level
number: 4
phase: first-exchanges
prerequisites:
- ko-level-01
- ko-level-02
- ko-level-03
goals: &id001
- Describe a routine with clock times and day expressions.
- Contrast a completed activity with a future plan.
- Propose a meeting and distinguish inability from unwillingness.
checkpoint:
  task: Arrange a meeting after a schedule conflict and explain what you did earlier and what you plan to do next.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
