goals: &id001
- Synthesize two partially conflicting sources in structured Korean prose.
- Use appropriate written nominalization and source attribution.
- Separate causal explanation from unsupported causal assertion.
checkpoint:
  task: Produce a structured explanation with attributed sources, a qualified conclusion, and a revision addressing a contradiction.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
