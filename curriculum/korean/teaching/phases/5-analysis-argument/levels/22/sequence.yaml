goals: &id001
- Represent two competing values fairly.
- Distinguish a conditional commitment from a prediction.
- Avoid treating a local experience as a universal cultural principle.
checkpoint:
  task: Discuss a dilemma and defend a priority while acknowledging its cost and a reasonable alternative.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
