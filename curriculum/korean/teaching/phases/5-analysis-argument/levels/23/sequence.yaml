goals: &id001
- Build an argument with explicit scope and prerequisites.
- Reject an overgeneralization without claiming its opposite is always true.
- Revise a claim after counterevidence.
checkpoint:
  task: Defend a recommendation, identify a necessary condition, and narrow the claim when an exception is introduced.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
