goals: &id001
- Explain an ordinary institutional or economic process.
- Compare stakeholder effects using explicit criteria.
- Distinguish a formal causal connective from an expression of means.
checkpoint:
  task: Explain a simulated policy or price change and compare two plausible effects without claiming professional expertise.
  criteria: *id001
mastery_profile: ko-item-mastery
mastery_target: independent-use
