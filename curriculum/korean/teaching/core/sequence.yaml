    goals: &id029
    - Support an interpretation with textual and discourse evidence.
    - Compare an author's stated content with implied stance.
    - Acknowledge an alternative reading and identify what would favor it.
    checkpoint:
      task: Defend an interpretation of a supplied passage while addressing a credible competing interpretation.
      criteria: *id029
    mastery_profile: ko-item-mastery
    mastery_target: independent-use
    units:
    - id: level-29-people-01
      title: People and relationships - 1
      outcome: Describe relationships and identify participants without assuming that omitted subjects refer to the speaker.
      vocabulary:
      - {id: ko-nikl-34919-s001, ch: 내면, pr: 내ː면, ds: a person's inner mind or feelings}
      - {id: ko-nikl-48811-s002, ch: 외면, pr: 외ː면 / 웨ː면, ds: a person's outward speech or behavior}
      grammar: []
      review_vocabulary:
      - {id: ko-nikl-19708-s002, ch: 떠올리다, pr: 떠올리다, ds: to show an expression on one's face}
      - {id: ko-nikl-40579-s002, ch: 배다, pr: 배ː다, ds: for an attitude or behavior to become ingrained}
      - {id: ko-nikl-07419-s007, ch: 붙잡다, pr: 붇짭따, ds: to seize a good opportunity or hold on to a valued person}
