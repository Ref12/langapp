  - schema_version: 3
    id: ko-level-07
    title: Travel, permission, and arrangements
    language: korean
    level_basis: Independent communicative progression, not an official TOPIK mapping or examination qualification. Phase headword targets indicate planning scale, not quotas or demonstrated competence. Original AI-authored content requires qualified Korean linguistic review.
    review_policy: Each module introduces at most 25 senses and 3 constructions across small adaptive lessons of about 5-8 new senses; reduce new material when retrieval or inflection is fragile. Select relevant earlier items for retrieval on later days and record modality, assistance, and repair. Reuse familiar vocabulary while changing particles, endings, participants, and register. Coverage is not mastery; target headword scales do not justify filler or forced advancement.
    kind: level
    number: 7
    phase: everyday-life
    prerequisites:
    - ko-level-01
    - ko-level-02
    - ko-level-03
    - ko-level-04
    - ko-level-05
    - ko-level-06
    goals: &id007
    - Request permission and interpret a prohibition.
    - Explain a route using destination and means expressions.
    - Revise travel plans when a condition or restriction changes.
    checkpoint:
      task: Replan a journey after a transport change, checking permission and distinguishing a rule from personal inability.
      criteria: *id007
    mastery_profile: ko-item-mastery
    mastery_target: independent-use
    units:
    - id: level-07-travel-01
      title: Travel and transport - 1
      outcome: Clarify destinations and means and revise arrangements.
      vocabulary:
      - {id: ko-nikl-03919-s004, ch: 쓰다, pr: 쓰다, ds: to use an umbrella or parasol}
      - {id: ko-nikl-40531-s001, ch: 배, pr: 배, ds: a boat; a ship}
      - {id: ko-nikl-43835-s001, ch: 차, pr: 차, ds: a car; a wheeled vehicle}
      - {id: ko-nikl-21050-s001, ch: 타다, pr: 타다, ds: to ride; to get on transport}
