  - schema_version: 3
    id: ko-level-12
    title: Relaying information
    language: korean
    level_basis: Independent communicative progression, not an official TOPIK mapping or examination qualification. Phase headword targets indicate planning scale, not quotas or demonstrated competence. Original AI-authored content requires qualified Korean linguistic review.
    review_policy: Each module introduces at most 25 senses and 3 constructions across small adaptive lessons of about 5-8 new senses; reduce new material when retrieval or inflection is fragile. Select relevant earlier items for retrieval on later days and record modality, assistance, and repair. Reuse familiar vocabulary while changing particles, endings, participants, and register. Coverage is not mastery; target headword scales do not justify filler or forced advancement.
    kind: level
    number: 12
    phase: stories-conversations
    prerequisites:
    - ko-level-01
    - ko-level-02
    - ko-level-03
    - ko-level-04
    - ko-level-05
    - ko-level-06
    - ko-level-07
    - ko-level-08
    - ko-level-09
    - ko-level-10
    - ko-level-11
    goals: &id012
    - Report a statement using the correct action, descriptive, or noun predicate form.
    - Distinguish a reported question, directive, and proposal.
    - Identify the source and intended recipient of a relayed message.
    checkpoint:
      task: Relay a short message with a question and an instruction, then resolve a misunderstanding about who should act.
      criteria: *id012
    mastery_profile: ko-item-mastery
    mastery_target: independent-use
    units:
    - id: level-12-learning-01
      title: Learning and education - 1
      outcome: Explain a learning approach and request clarification.
      vocabulary:
      - {id: ko-nikl-35308-s004, ch: 넘기다, pr: 넘기다, ds: to turn a sheet or page}
      - {id: ko-nikl-22715-s001, ch: 펴다, pr: 펴다, ds: to unfold or unroll something}
      grammar: []
      review_vocabulary:
      - {id: ko-nikl-46370-s001, ch: 어렵다, pr: 어렵따, ds: to be difficult to do}
      - {id: ko-nikl-28570-s001, ch: 경험, pr: 경험, ds: experience; knowledge gained through experience}
      - {id: ko-nikl-11966-s001, ch: 잊다, pr: 읻따, ds: to forget something once known}
      - {id: ko-nikl-28668-s001, ch: 계산하다, pr: 계ː산하다 / 게ː산하다, ds: to calculate; to count}
      - {id: ko-nikl-14467-s002, ch: 정리, pr: 정ː니, ds: systematic sorting or organization}
      - {id: ko-nikl-37683-s001, ch: 목표, pr: 목표, ds: a goal; a concrete target}
      - {id: ko-nikl-15937-s001, ch: 능력, pr: 능녁, ds: ability; capability}
      - {id: ko-nikl-29368-s003, ch: 고치다, pr: 고치다, ds: to correct a mistake}
      review_grammar:
      - {id: ko-topik2-g017, ch: V-기, ds: nominalize an action for a label or evaluation}
      - {id: ko-topik3-g024, ch: V-(으)ㄹ 줄 알다 / 모르다, ds: know or not know how to perform an action}
      - {id: ko-topik2-g016, ch: V-는 것, ds: turn a clause into a nominal expression}
