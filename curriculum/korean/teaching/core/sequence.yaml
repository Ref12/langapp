  - schema_version: 3
    id: ko-level-16
    title: News and attribution
    language: korean
    level_basis: Independent communicative progression, not an official TOPIK mapping or examination qualification. Phase headword targets indicate planning scale, not quotas or demonstrated competence. Original AI-authored content requires qualified Korean linguistic review.
    review_policy: Each module introduces at most 25 senses and 3 constructions across small adaptive lessons of about 5-8 new senses; reduce new material when retrieval or inflection is fragile. Select relevant earlier items for retrieval on later days and record modality, assistance, and repair. Reuse familiar vocabulary while changing particles, endings, participants, and register. Coverage is not mastery; target headword scales do not justify filler or forced advancement.
    kind: level
    number: 16
    phase: explanation-problems
    prerequisites:
    - ko-level-01
    - ko-level-02
    - ko-level-03
    - ko-level-04
    - ko-level-05
    - ko-level-06
    - ko-level-07
    - ko-level-08
    - ko-level-09
    - ko-level-10
    - ko-level-11
    - ko-level-12
    - ko-level-13
    - ko-level-14
    - ko-level-15
    goals: &id016
    - Summarize a general-interest report and identify its source.
    - Contrast reported information with a personal observation.
    - Compare two accounts without presenting hearsay as established fact.
    checkpoint:
      task: Explain what two short reports agree on and which claims still depend on a named source.
      criteria: *id016
    mastery_profile: ko-item-mastery
    mastery_target: independent-use
    units:
    - id: level-16-people-01
      title: People and relationships - 1
      outcome: Describe relationships and identify participants without assuming that omitted subjects refer to the speaker.
      vocabulary:
      - {id: ko-nikl-11025-s001, ch: 이혼, pr: 이ː혼, ds: divorce}
      grammar: []
      review_vocabulary:
      - {id: ko-nikl-11010-s003, ch: 이해, pr: 이ː해, ds: understanding another person's circumstances}
      - {id: ko-nikl-21369-s001, ch: 태도, pr: 태ː도, ds: attitude expressed through posture or behavior}
      - {id: ko-nikl-39723-s001, ch: 반응, pr: 바ː능, ds: a response or reaction to a stimulus}
      - {id: ko-nikl-46161-s001, ch: 양보, pr: 양ː보, ds: giving up a seat or possession for someone else}
      - {id: ko-nikl-42858-s004, ch: 지키다, pr: 지키다, ds: to keep a promise or follow rules and etiquette}
      - {id: ko-nikl-46288-s001, ch: 어기다, pr: 어기다, ds: 'to break a rule, promise, or order'}
      - {id: ko-nikl-43874-s002, ch: 차례, pr: 차례, ds: a turn; an opportunity given in sequence}
      - {id: ko-nikl-39820-s003, ch: 받아들이다, pr: 바다드리다, ds: to grant a request or demand}
      review_grammar:
      - {id: ko-topik1-g030, ch: 'V-(으)ㄹ까요?', ds: offer an action or tentatively propose one}
      - {id: ko-topik2-g013, ch: V-는 N, ds: modify a noun with a present action clause}
      - {id: ko-topik5-g029, ch: V/A-(으)ㄹ까 하다, ds: express a tentative intention}
