  title: Begin politely and repair a conversation
  outcome: Greet someone, thank or apologize, and request slower or written information.
  vocabulary:
  - {id: ko-nikl-04432-s002, ch: 안녕하다, pr: 안녕하다, ds: be healthy and at ease}
  - {id: ko-nikl-26499-s001, ch: 감사하다, pr: 감ː사하다, ds: grateful; feeling gratitude}
  - {id: ko-nikl-41556-s001, ch: 죄송하다, pr: 죄ː송하다 / 줴ː송하다, ds: very sorry; apologetic}
  - {id: ko-nikl-16209-s001, ch: 다시, pr: 다시, ds: again; repeat the same words or action}
  - {id: ko-nikl-36412-s001, ch: 말하다, pr: 말ː하다, ds: 'say; express facts, thoughts, or feelings in words'}
