- {id: ko-tourist-p044, ch: '오늘 갈 수 있어요?', pr: 오늘 갈 쑤 이써요, ds: 'Can I go today?'}
- {id: ko-tourist-p045, ch: '내일 가도 돼요?', pr: 내일 가도 돼요, ds: 'May I go tomorrow?'}
- {id: ko-tourist-p046, ch: 시간을 바꾸고 싶어요., pr: 시가늘 바꾸고 시퍼요, ds: I would like to change the time.}
- {id: ko-tourist-p047, ch: 죄송합니다., pr: 죄송함니다, ds: I am sorry. (formal)}
