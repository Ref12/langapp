- {id: ko-tourist-p001, ch: 안녕하세요., pr: 안녕하세요, ds: Hello.}
- {id: ko-tourist-p002, ch: 감사해요., pr: 감사해요, ds: Thank you.}
- {id: ko-tourist-p003, ch: 죄송해요., pr: 죄송해요, ds: I am sorry.}
- {id: ko-tourist-p004, ch: 다시 말해 주세요., pr: 다시 말해 주세요, ds: Please say it again.}
- {id: ko-tourist-p005, ch: 천천히 말해 주세요., pr: 천천히 말해 주세요, ds: Please speak slowly.}
- {id: ko-tourist-p006, ch: 써 주세요., pr: 써 주세요, ds: Please write it down.}
