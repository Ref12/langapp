- {id: ko-tourist-p025, ch: 공항에 가 주세요., pr: 공항에 가 주세요, ds: Please go to the airport.}
- {id: ko-tourist-p026, ch: 여기에서 내리고 싶어요., pr: 여기에서 내리고 시퍼요, ds: I would like to get off here.}
