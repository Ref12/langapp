- {id: ko-tourist-p030, ch: 열쇠 주세요., pr: 열쐬 주세요, ds: 'The key, please.'}
- {id: ko-tourist-p031, ch: 여권이 여기에 있어요., pr: 여꿔니 여기에 이써요, ds: My passport is here.}
- {id: ko-tourist-p032, ch: 너무 커요., pr: 너무 커요, ds: It is too big.}
- {id: ko-tourist-p033, ch: '작은 것이 있어요?', pr: 자근 거시 이써요, ds: 'Do you have a small one?'}
- {id: ko-tourist-p034, ch: 이것을 사고 싶어요., pr: 이거슬 사고 시퍼요, ds: I would like to buy this.}
- {id: ko-tourist-p035, ch: 영수증 주세요., pr: 영수증 주세요, ds: 'A receipt, please.'}
- {id: ko-tourist-p036, ch: 고기를 먹지 않아요., pr: 고기를 먹찌 아나요, ds: I do not eat meat.}
- {id: ko-tourist-p037, ch: 알레르기가 있어요., pr: 알레르기가 이써요, ds: I have an allergy.}
