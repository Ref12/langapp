schema_version: 1
id: ko-tourist
title: Korean for small travel tasks
language: korean
level_basis: >-
  Independent travel route with English support; no prior core lessons assumed.
  Original situation-based selection, not a TOPIK level or examination-readiness claim.
  All phrase readings are individually authored broad Hangul, unreviewed and not audio-verified;
  citation vowel length is omitted and one documented variant is chosen where necessary.
review_policy: >-
  Work through each situation in three short lessons: understand the task and components,
  retrieve a useful phrase with English support, then vary or review it in a role-play.
  Revisit explicitly listed earlier senses and constructions without importing core-course
  prerequisites. Phrase exposure is component practice, not automatic mastery, exam readiness,
  pronunciation scoring, or audio assessment. Confirm important details with local staff;
  allergy, payment, and emergency outcomes are not guaranteed.
quick_start: [polite-repair, food-basics, finding-your-way, paying, asking-for-help]
units:
