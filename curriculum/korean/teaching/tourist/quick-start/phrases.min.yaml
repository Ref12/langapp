- {id: ko-tourist-p001, ch: 안녕하세요., pr: 안녕하세요, ds: Hello.}
- {id: ko-tourist-p002, ch: 감사해요., pr: 감사해요, ds: Thank you.}
- {id: ko-tourist-p003, ch: 죄송해요., pr: 죄송해요, ds: I am sorry.}
- {id: ko-tourist-p004, ch: 다시 말해 주세요., pr: 다시 말해 주세요, ds: Please say it again.}
- {id: ko-tourist-p005, ch: 천천히 말해 주세요., pr: 천천히 말해 주세요, ds: Please speak slowly.}
- {id: ko-tourist-p006, ch: 써 주세요., pr: 써 주세요, ds: Please write it down.}
- {id: ko-tourist-p007, ch: 물 주세요., pr: 물 주세요, ds: 'Water, please.'}
- {id: ko-tourist-p008, ch: 메뉴 주세요., pr: 메뉴 주세요, ds: 'A menu, please.'}
- {id: ko-tourist-p009, ch: 커피 한 잔 주세요., pr: 커피 한 잔 주세요, ds: 'One cup of coffee, please.'}
- {id: ko-tourist-p010, ch: 네., pr: 네, ds: Yes.}
- {id: ko-tourist-p011, ch: 아니요., pr: 아니요, ds: No.}
- {id: ko-tourist-p012, ch: '물이 있어요?', pr: 무리 이써요, ds: 'Is there water?'}
- {id: ko-tourist-p013, ch: '화장실이 어디에 있어요?', pr: 화장시리 어디에 이써요, ds: 'Where is the restroom?'}
- {id: ko-tourist-p014, ch: '역은 어디예요?', pr: 여근 어디예요, ds: 'Where is the railway station?'}
- {id: ko-tourist-p015, ch: 왼쪽이에요., pr: 왼쪼기에요, ds: It is on the left.}
- {id: ko-tourist-p016, ch: 오른쪽이에요., pr: 오른쪼기에요, ds: It is on the right.}
- {id: ko-tourist-p017, ch: '얼마예요?', pr: 얼마예요, ds: 'How much is it?'}
- {id: ko-tourist-p018, ch: '카드로 계산할 수 있어요?', pr: 카드로 계산할 쑤 이써요, ds: 'Can I pay by card?'}
- {id: ko-tourist-p019, ch: 현금으로 계산해 주세요., pr: 현그므로 계산해 주세요, ds: Please process my payment in cash.}
- {id: ko-tourist-p020, ch: 감사합니다., pr: 감사함니다, ds: Thank you. (formal)}
- {id: ko-tourist-p021, ch: 도와주세요., pr: 도와주세요, ds: Please help me.}
- {id: ko-tourist-p022, ch: '병원이 어디에 있어요?', pr: 병워니 어디에 이써요, ds: 'Where is a hospital?'}
- {id: ko-tourist-p023, ch: 경찰을 불러 주세요., pr: 경차를 불러 주세요, ds: Please call a police officer.}
- {id: ko-tourist-p024, ch: 여권이 없어요., pr: 여꿔니 업써요, ds: I do not have my passport.}
