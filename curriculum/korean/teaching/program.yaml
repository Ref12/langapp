# Original AI-authored teaching judgments; qualified Korean linguistic review required.
schema_version: 1
id: ko-practical
title: Practical Korean
language: korean
level_basis: Independent communicative progression, not an official TOPIK mapping or examination qualification. Phase headword targets indicate planning scale, not quotas or demonstrated competence. Original AI-authored content requires qualified Korean linguistic review.
module_size: 25
review_policy: Each module introduces at most 25 senses and 3 constructions across small adaptive lessons of about 5-8 new senses; reduce new material when retrieval or inflection is fragile. Select relevant earlier items for retrieval on later days and record modality, assistance, and repair. Reuse familiar vocabulary while changing particles, endings, participants, and register. Coverage is not mastery; target headword scales do not justify filler or forced advancement.
phases:
- {id: first-exchanges, title: First exchanges, levels: [1, 2, 3, 4], target_new_headwords: 200}
- {id: everyday-life, title: Everyday life, levels: [5, 6, 7, 8], target_new_headwords: 500}
- {id: stories-conversations, title: Stories and conversations, levels: [9, 10, 11, 12, 13], target_new_headwords: 800}
- {id: explanation-problems, title: Explanation and problem-solving, levels: [14, 15, 16, 17, 18], target_new_headwords: 1100}
- {id: analysis-argument, title: Analysis and argument, levels: [19, 20, 21, 22, 23, 24], target_new_headwords: 1400}
- {id: nuance-interpretation, title: Nuance and interpretation, levels: [25, 26, 27, 28, 29, 30], target_new_headwords: 1800}
levels:
- number: 1
  title: First contact and polite repair
  goals: [Introduce yourself with a polite noun predicate., Ask someone to repeat or slow down without switching to familiar speech., Confirm or correct a simple identification.]
  checkpoint: Introduce yourself to a new partner and repair a deliberately misheard name or role without an answer model.
- number: 2
  title: People, places, and particles
  goals: [Identify a person or object using subject and topic particles appropriately., Distinguish a location of existence from an action location., Ask where someone is going and whose object this is.]
  checkpoint: Help a partner locate a missing object and explain who used it and where, preserving the particle contrasts.
- number: 3
  title: Food, numbers, and payment
  goals: [Order a familiar meal and clarify an unwanted ingredient., Combine appropriate number forms with object and person counters., Confirm a price and payment amount in won.]
  checkpoint: Correct a changed order and quantity, verify the total, and ask for clarification rather than guess.
- number: 4
  title: Routines and plans
  goals: [Describe a routine with clock times and day expressions., Contrast a completed activity with a future plan., Propose a meeting and distinguish inability from unwillingness.]
  checkpoint: Arrange a meeting after a schedule conflict and explain what you did earlier and what you plan to do next.
- number: 5
  title: Household help
  goals: [Describe household needs and request a helpful action., Sequence two chores and explain an ordinary reason., Describe an ongoing action without confusing it with a completed result.]
  checkpoint: Coordinate chores with a housemate who is already busy and adapt a request to the revised situation.
- number: 6
  title: Services and everyday care
  goals: [Describe a common symptom or service problem without claiming medical expertise., Ask what must be done before and after an appointment., Try or compare an option and explain a practical limitation.]
  checkpoint: Explain a simulated appointment or purchase problem, understand its requirements, and ask a relevant follow-up question.
- number: 7
  title: Travel, permission, and arrangements
  goals: [Request permission and interpret a prohibition., Explain a route using destination and means expressions., Revise travel plans when a condition or restriction changes.]
  checkpoint: Replan a journey after a transport change, checking permission and distinguishing a rule from personal inability.
- number: 8
  title: Work, study, and relationships
  goals: [Arrange a work or study task and describe an agreed responsibility., Separate listener politeness from subject honorification and humble reference., Choose polite or mutually appropriate familiar speech for a stated relationship.]
  checkpoint: Coordinate the same task with a peer and a respected colleague, explaining whom each honorific or humble form refers to.
- number: 9
  title: Narration and resulting states
  goals: [Sequence events and distinguish interruption from completed reversal., Describe an ongoing activity versus a maintained result., Identify participants when an event is presented with a passive predicate.]
  checkpoint: Recount a new picture sequence and explain what was happening, what changed, and what remained afterward.
- number: 10
  title: Feelings and experience
  goals: [Describe a past experience and a change in feelings., Distinguish directly experienced information from an inference., Respond considerately to a fictional interpersonal misunderstanding.]
  checkpoint: Discuss an unfamiliar personal account, separating what the speaker experienced from what they only suppose.
- number: 11
  title: Procedures and outcomes
  goals: ['Explain steps with before, after, and simultaneous-action relations.', Describe a prepared or preserved result., Explain who makes or allows another person to act.]
  checkpoint: Guide a partner through a procedure when an unexpected result requires a revised instruction.
- number: 12
  title: Relaying information
  goals: ['Report a statement using the correct action, descriptive, or noun predicate form.', 'Distinguish a reported question, directive, and proposal.', Identify the source and intended recipient of a relayed message.]
  checkpoint: Relay a short message with a question and an instruction, then resolve a misunderstanding about who should act.
- number: 13
  title: Reasons and choices
  goals: [Support a preference while conceding a drawback., Compare an ordinary cause with a beneficial or blame-attributing explanation., State a condition under which your recommendation changes.]
  checkpoint: Recommend one of two plausible options, acknowledge a disadvantage, and revise the recommendation when conditions change.
- number: 14
  title: Unfamiliar everyday problems
  goals: [Explain an unexpected service or housing problem with relevant background., Distinguish a changed intention from an unavoidable outcome., Clarify an indirect explanation without assuming agreement.]
  checkpoint: Resolve a simulated problem with incomplete information and confirm a feasible next action.
- number: 15
  title: Cooperation and responsibility
  goals: [Explain task ownership and an enabled outcome., Negotiate a substitution or exchange of responsibilities., State an instruction or commitment without overstating authority.]
  checkpoint: Update a team on a delayed task and renegotiate responsibilities with an appropriate degree of directness.
- number: 16
  title: News and attribution
  goals: [Summarize a general-interest report and identify its source., Contrast reported information with a personal observation., Compare two accounts without presenting hearsay as established fact.]
  checkpoint: Explain what two short reports agree on and which claims still depend on a named source.
- number: 17
  title: Technology and environment
  goals: [Explain a system or environmental process to a nonspecialist., Describe variation and degree without confusing correlation with cause., Explain an achieved outcome and a remaining limitation.]
  checkpoint: Explain a practical technology or environmental choice and answer a changed-condition question.
- number: 18
  title: Presenting and negotiating
  goals: [Present a proposal with explicit conditions and alternatives., Offer a compromise and qualify a commitment., Respond to an unanticipated objection with a workable revision.]
  checkpoint: Present and revise a proposal after a partner introduces a competing need and a new constraint.
- number: 19
  title: Evidence and explanation
  goals: ['Distinguish observation, attribution, inference, and certainty in an explanation.', Identify the scope of a supported conclusion., Correct a tempting but unsupported generalization.]
  checkpoint: Evaluate a short argument, specify missing evidence, and state a more defensible conclusion.
- number: 20
  title: Institutions and economics
  goals: [Explain an ordinary institutional or economic process., Compare stakeholder effects using explicit criteria., Distinguish a formal causal connective from an expression of means.]
  checkpoint: Explain a simulated policy or price change and compare two plausible effects without claiming professional expertise.
- number: 21
  title: General science
  goals: [Summarize a general-audience scientific explanation., Describe a method separately from its result., Qualify a tendency and identify an unanswered question.]
  checkpoint: Explain a supplied scientific account, its method, and a limitation without adding unsupported findings.
- number: 22
  title: Values and perspectives
  goals: [Represent two competing values fairly., Distinguish a conditional commitment from a prediction., Avoid treating a local experience as a universal cultural principle.]
  checkpoint: Discuss a dilemma and defend a priority while acknowledging its cost and a reasonable alternative.
- number: 23
  title: Qualified argument
  goals: [Build an argument with explicit scope and prerequisites., Reject an overgeneralization without claiming its opposite is always true., Revise a claim after counterevidence.]
  checkpoint: Defend a recommendation, identify a necessary condition, and narrow the claim when an exception is introduced.
- number: 24
  title: Formal synthesis
  goals: [Synthesize two partially conflicting sources in structured Korean prose., Use appropriate written nominalization and source attribution., Separate causal explanation from unsupported causal assertion.]
  checkpoint: Produce a structured explanation with attributed sources, a qualified conclusion, and a revision addressing a contradiction.
- number: 25
  title: Stance and implication
  goals: ['Interpret shared-knowledge, surprise, and conjectural endings in context.', Explain how an indirect message can imply criticism or concern., Rephrase a dismissive response without losing its factual content.]
  checkpoint: Compare two plausible readings of an indirect exchange and justify a considerate response.
- number: 26
  title: Speech and written register
  goals: [Recast an account between polite conversation and plain written narration., Preserve subject and recipient respect when changing listener endings., Identify forms whose literary or institutional tone is unsuitable for routine conversation.]
  checkpoint: Adapt the same request and account for a friend, a public notice, and a formal addressee, explaining the changes.
- number: 27
  title: Common imagery
  goals: [Interpret a familiar idiom or figurative comparison from context., Distinguish literal quantity from a rhetorical degree expression., Paraphrase imagery in ordinary Korean before attempting productive use.]
  checkpoint: Explain the effect of an unfamiliar use of a familiar expression and contrast it with a literal paraphrase.
- number: 28
  title: Precision and abstraction
  goals: ['Specify the scope, degree, and limiting conditions of an abstract claim.', Distinguish practical equivalence from a deliberately adopted hypothetical framing., Revise vague comparisons with explicit standards.]
  checkpoint: Revise an imprecise explanatory passage and justify how each revision changes its meaning or scope.
- number: 29
  title: Critical interpretation
  goals: [Support an interpretation with textual and discourse evidence., Compare an author's stated content with implied stance., Acknowledge an alternative reading and identify what would favor it.]
  checkpoint: Defend an interpretation of a supplied passage while addressing a credible competing interpretation.
- number: 30
  title: Independent projects
  goals: [Synthesize demanding material for a chosen Korean-speaking audience., Sustain an extended written project or discussion with explicit source boundaries., Revise a defended conclusion after substantive feedback.]
  checkpoint: Complete a source-based project, respond to critique, and explain remaining uncertainty and revisions without equating completion with global mastery.
topics:
  people: {title: People and relationships, task: Describe relationships and identify participants without assuming that omitted subjects refer to the speaker.}
  home: {title: Home and daily life, task: Explain household needs and coordinate practical help.}
  clothing: {title: Clothing and appearance, task: Describe clothing and distinguish putting it on from wearing it.}
  food: {title: Food and meals, task: Clarify ingredients and preferences and make an appropriate meal request.}
  health: {title: Body and wellbeing, task: Explain an ordinary symptom or care need without clinical claims.}
  travel: {title: Travel and transport, task: Clarify destinations and means and revise arrangements.}
  services: {title: Services and transactions, task: Clarify requirements and resolve a service problem politely.}
  leisure: {title: Leisure and sport, task: Explain participation and invite someone without assuming availability.}
  learning: {title: Learning and education, task: Explain a learning approach and request clarification.}
  work: {title: Work and cooperation, task: Coordinate responsibilities and report progress for a specified relationship.}
  money: {title: Money and commerce, task: Confirm amounts in won and explain a financial choice without professional claims.}
  communication: {title: Communication and information, task: Repair ambiguity and relay information with clear attribution.}
  time: {title: Time and events, task: Distinguish time points and duration and relate events in sequence.}
  actions: {title: Actions and processes, task: 'Distinguish intention, ongoing action, achieved result, and maintained state.'}
  description: {title: Description and comparison, task: Use descriptive predicates and precise comparison standards.}
  feelings: {title: Feelings and attitudes, task: Explain feelings without treating another person's inner state as directly known.}
  reasoning: {title: Reasons and connections, task: Explain causal and conditional relations with appropriate scope.}
  grammar: {title: Sentence construction and inflection, task: Select particles and predicate endings to communicate a new meaning and explain a relevant contrast.}
  society: {title: Society and community, task: Explain an issue without generalizing all Korean speakers from one example.}
  institutions: {title: Institutions and public life, task: Explain a public process and distinguish a rule from its practical effects.}
  media: {title: Media and sources, task: Separate reported claims from observation and interpretation.}
  technology: {title: Technology and systems, task: Explain a system's use and limits for a general audience.}
  nature: {title: Nature and environment, task: Explain an environmental change and distinguish evidence from prediction.}
  science: {title: Science and investigation, task: Explain a general scientific account without overstating method or conclusion.}
  history: {title: History and change, task: Relate a development using explicit time and source context.}
  culture: {title: Culture and customs, task: Explain a situated practice while allowing variation by person and setting.}
  arts: {title: Arts and creative works, task: Support an interpretation with specific details of a work.}
  argument: {title: Argument and decisions, task: Defend a qualified position and respond to a credible objection.}
  register: {title: Register and nuance, task: Adapt listener endings and implied stance to audience and relationship.}
  literature: {title: Literary and historical expression, task: Interpret marked expressions in source context and paraphrase them in ordinary Korean.}
  quantities: {title: Numbers and counters, task: 'Choose native or Sino-Korean number forms for quantities, clock time, and payment.'}
  honorifics: {title: Respect and reference, task: 'Distinguish listener politeness, subject honorification, and humble reference to a beneficiary or recipient.'}
extensions:
- {id: professional, title: Professional and organizational Korean, after_level: 18, mastery_target: independent-use, description: 'Optional productive workplace language with role-sensitive practice, not a professional qualification.'}
- {id: technical, title: Technical source reading, after_level: 18, mastery_target: understand, description: 'Optional receptive terminology and system descriptions, not evidence of engineering competence.'}
- {id: scientific, title: Scientific source reading, after_level: 24, mastery_target: understand, description: 'Optional receptive scientific terminology, not scientific or clinical qualification.'}
- {id: literary, title: Literary and historical Korean, after_level: 24, mastery_target: understand, description: 'Optional contextual reading of literary and older forms, not required ordinary speech or an examination-readiness claim.'}
