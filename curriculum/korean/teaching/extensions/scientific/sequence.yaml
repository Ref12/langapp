  - {id: ko-nikl-02684-s001, ch: 시각, pr: 시ː각, ds: 'sight; the sense of seeing shapes, movement, and colors'}
  - {id: ko-nikl-45145-s003, ch: 초점, pr: 초쩜, ds: the point of focus for seeing an object clearly}
  - {id: ko-nikl-42673-s001, ch: 지방, pr: 지방, ds: fat; an energy-storing substance in the body}
  - {id: ko-nikl-45729-s001, ch: 출산, pr: 출싼, ds: childbirth; giving birth to a baby}
  - {id: ko-nikl-32690-s001, ch: 기관, pr: 기관, ds: an organ with a particular bodily form and function}
  - {id: ko-nikl-41184-s003, ch: 조직, pr: 조직, ds: tissue; a group of cells with similar form and function}
  - {id: ko-nikl-12804-s001, ch: 장기, pr: 장기, ds: internal organs}
  review_grammar:
  - {id: ko-topik2-g006, ch: V-기 전에, ds: locate an action before another}
  - {id: ko-topik2-g005, ch: V-(으)ㄴ 후에, ds: locate an action after another is completed}
  - {id: ko-topik3-g006, ch: V-아/어야겠다, ds: state a newly formed resolve or need}
