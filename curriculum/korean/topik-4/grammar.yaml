- id: ko-topik4-g001
  pattern: V/A-더라고요
  english: I noticed / experienced that
  note: Reports a personal observation or discovery; restrictions on reporting one's own deliberate action
    require attention.
  examples:
  - target: 직접 가 보니 사람이 많더라고요.
    english: When I went there myself, I found there were many people.
  - target: 새로 나온 책이 생각보다 어렵더라고요.
    english: I found the new book harder than expected.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g002
  pattern: V/A-던 N
  english: N that used to / was V/A
  note: Retrospective modifier often suggests ongoing, repeated, or uncompleted past experience; contrast
    the completed-past modifier.
  examples:
  - target: 예전에 자주 가던 카페가 문을 닫았어요.
    english: The cafe I used to visit often has closed.
  - target: 제가 읽던 책을 어디에 두었어요?
    english: Where did you put the book I was reading?
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g003
  pattern: V/A-았/었던 N
  english: N that had been / had V-ed
  note: Usually looks back on a completed or bounded past situation; context can overlap with the simpler
    retrospective form.
  examples:
  - target: 작년에 살았던 집을 다시 찾았어요.
    english: I revisited the house where I lived last year.
  - target: 한때 조용했던 동네가 많이 변했어요.
    english: The neighborhood that was once quiet has changed a lot.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g004
  pattern: V/A-더니
  english: I observed X, and then Y; contrasting observation
  note: Normally links a remembered observation to a subsequent result or contrast; do not freely narrate
    one's own intentional action with it.
  examples:
  - target: 아침에는 춥더니 오후에는 따뜻해졌어요.
    english: It was cold in the morning, but it became warm in the afternoon.
  - target: 동생이 열심히 공부하더니 시험에 합격했어요.
    english: My younger sibling studied hard and then passed the exam.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g005
  pattern: V-았/었더니
  english: when I did V, I found / got
  note: Usually relates the speaker's completed action to a discovered result or response.
  examples:
  - target: 약을 먹었더니 좀 나아졌어요.
    english: After I took the medicine, I felt a little better.
  - target: 문을 열었더니 고양이가 들어왔어요.
    english: When I opened the door, a cat came in.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g006
  pattern: V-다 보니
  english: as I kept V-ing, I came to
  note: An ongoing or repeated activity leads to a realization or outcome that was not the initial focus.
  examples:
  - target: 매일 읽다 보니 속도가 빨라졌어요.
    english: As I read every day, my reading speed increased.
  - target: 친구와 이야기하다 보니 시간이 많이 지났어요.
    english: As I talked with a friend, a lot of time passed.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g007
  pattern: V-다 보면
  english: if one keeps V-ing, eventually
  note: Presents an expected result of continued action, unlike a retrospective result already reached.
  examples:
  - target: 꾸준히 연습하다 보면 익숙해질 거예요.
    english: If you keep practicing, you will get used to it.
  - target: 여러 사람을 만나다 보면 생각이 달라질 수 있어요.
    english: Meeting many people over time can change your views.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g008
  pattern: V/A-(으)ㄹ수록
  english: the more V/A, the more
  note: The degree or continuation of the first condition covaries with the second.
  examples:
  - target: 알면 알수록 재미있어요.
    english: The more I learn, the more interesting it is.
  - target: 날씨가 추울수록 손님이 줄어요.
    english: The colder the weather, the fewer customers there are.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g009
  pattern: V/A-(으)ㄴ/는 반면에
  english: whereas; on the other hand
  note: Contrasts two properties or situations, often within an analytical comparison.
  examples:
  - target: 이 집은 넓은 반면에 교통이 불편해요.
    english: This home is spacious, whereas transportation is inconvenient.
  - target: 형은 운동을 좋아하는 반면에 저는 독서를 좋아해요.
    english: My older brother likes sports, whereas I like reading.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g010
  pattern: V/A-(으)ㄴ/는 대신에
  english: instead of; in return for
  note: Can express substitution or compensation; the intended relation must be made clear.
  examples:
  - target: 택시를 타는 대신에 걸어갔어요.
    english: I walked instead of taking a taxi.
  - target: 방이 작은 대신에 월세가 싸요.
    english: The room is small, but the rent is low in compensation.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g011
  pattern: V/A-(으)ㄴ/는 데다가
  english: on top of; in addition to
  note: Adds a further factor pointing in the same evaluative direction.
  examples:
  - target: 이 식당은 맛있는 데다가 가격도 싸요.
    english: This restaurant's food is tasty, and the prices are low as well.
  - target: 길이 막히는 데다가 비까지 와요.
    english: The roads are congested, and it is raining on top of that.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g012
  pattern: V/A-기는 하지만
  english: it is true that, but
  note: Concedes the first proposition before qualifying it; the nominalizer attaches before tense on
    the final predicate.
  examples:
  - target: 편리하기는 하지만 비용이 많이 들어요.
    english: It is convenient, but it costs a lot.
  - target: 가기는 했지만 오래 머물지는 않았어요.
    english: I did go, but I did not stay long.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g013
  pattern: V/A-더라도
  english: even if; even granting that
  note: Often introduces a stronger hypothetical concession than a simple concessive connective.
  examples:
  - target: 실패하더라도 다시 도전하겠어요.
    english: Even if I fail, I will try again.
  - target: 아무리 바쁘더라도 약속은 지켜야 해요.
    english: However busy you are, you should keep your promises.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g014
  pattern: V/A-(으)ㄹ 뿐이다
  english: merely; do nothing but
  note: Limits the assertion without the necessarily negative predicate required by the negative-only
    particle.
  examples:
  - target: 저는 사실을 말했을 뿐이에요.
    english: I merely stated the facts.
  - target: 그저 조금 피곤할 뿐이에요.
    english: I am just a little tired.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g015
  pattern: V-(으)ㄹ 뿐만 아니라
  english: not only V but also
  note: Extends additive comparison to clauses; tense and modifier choice depend on the intended time.
  examples:
  - target: 그는 노래를 잘할 뿐만 아니라 춤도 잘 춰요.
    english: He not only sings well but also dances well.
  - target: 이 제도는 비용을 줄일 뿐만 아니라 시간도 절약해요.
    english: This system not only reduces costs but also saves time.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g016
  pattern: V-(으)ㄴ 채로
  english: while remaining in the state of V
  note: Marks a maintained state during another action, not two independent ongoing actions.
  examples:
  - target: 불을 켠 채로 잠이 들었어요.
    english: I fell asleep with the light on.
  - target: 신발을 신은 채로 들어오지 마세요.
    english: Please do not come in with your shoes on.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g017
  pattern: V-는 바람에
  english: because of an unexpected event; unfortunate result
  note: Typically describes an unplanned event causing an undesirable outcome.
  examples:
  - target: 버스가 늦게 오는 바람에 지각했어요.
    english: I was late because the bus unexpectedly arrived late.
  - target: 컴퓨터가 고장 나는 바람에 일을 못 끝냈어요.
    english: I could not finish the work because the computer broke down.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g018
  pattern: V/A-(으)ㄴ/는 만큼
  english: to the extent that; in proportion to; given that
  note: The degree comparison and causal interpretation depend on context.
  examples:
  - target: 연습한 만큼 실력이 늘어요.
    english: Your skill improves in proportion to how much you practice.
  - target: 중요한 일인 만큼 신중하게 결정해야 해요.
    english: Since this is an important matter, we must decide carefully.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g019
  pattern: V/A-(으)ㄴ/는 척하다
  english: pretend to V / be A
  note: Presents an outward display that differs from reality; modifiers follow predicate type.
  examples:
  - target: 모르는 척하지 마세요.
    english: Do not pretend not to know.
  - target: 괜찮은 척했지만 사실은 걱정됐어요.
    english: I pretended to be fine, but I was actually worried.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g020
  pattern: V/A-(으)ㄴ/는 셈이다
  english: it amounts to; effectively
  note: A calculation or interpretive conclusion rather than literal identity.
  examples:
  - target: 이 돈이면 한 달을 공짜로 쓰는 셈이에요.
    english: At this price, it amounts to using it for one month free.
  - target: 이미 절반은 끝난 셈이에요.
    english: In effect, half is already finished.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g021
  pattern: V-(으)ㄹ 겸
  english: also with the purpose of; killing two birds
  note: Names one of multiple compatible purposes; a repeated construction can make both purposes explicit.
  examples:
  - target: 운동도 할 겸 걸어서 출근해요.
    english: I walk to work partly to get some exercise.
  - target: 책도 살 겸 친구도 만날 겸 시내에 갔어요.
    english: I went downtown both to buy books and to meet a friend.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g022
  pattern: V-(으)려다가
  english: intended to V, but then
  note: Contrasts an intention with a subsequent change before or during execution.
  examples:
  - target: 버스를 타려다가 지하철을 탔어요.
    english: I was going to take the bus but took the subway instead.
  - target: 전화하려다가 늦은 시간이라 그만두었어요.
    english: I was about to call but decided not to because it was late.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g023
  pattern: V-(으)려면
  english: if you intend / want to V
  note: Specifies a prerequisite for an intended result or action.
  examples:
  - target: 이 일을 끝내려면 시간이 더 필요해요.
    english: To finish this work, we need more time.
  - target: 건강해지려면 꾸준히 운동해야 해요.
    english: If you want to become healthy, you need to exercise regularly.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g024
  pattern: V/A-(으)ㄹ까 봐
  english: for fear that; worried that
  note: Motivates precautions through an uncertain feared outcome.
  examples:
  - target: 늦을까 봐 일찍 출발했어요.
    english: I left early because I was afraid I might be late.
  - target: 잊어버릴까 봐 메모했어요.
    english: I made a note because I was afraid I might forget.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g025
  pattern: V/A-(으)ㄹ 리가 없다
  english: there is no way; cannot possibly
  note: Expresses the speaker's strong inference, not independently verified proof.
  examples:
  - target: 그 사람이 약속을 잊을 리가 없어요.
    english: There is no way that person would forget the appointment.
  - target: 이렇게 싼데 정품일 리가 없어요.
    english: It is so cheap that it cannot possibly be genuine.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g026
  pattern: V/A-(으)ㄹ 수도 있다
  english: it is possible that; could
  note: Recognizes one possible outcome among alternatives; scope differs from simple ability.
  examples:
  - target: 계획이 바뀔 수도 있어요.
    english: The plan could change.
  - target: 같은 말도 다르게 들릴 수 있어요.
    english: The same words can sound different.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g027
  pattern: V/A-거든요
  english: you see; because; explanatory background
  note: Often supplies information the listener may not know; repeated use can sound defensive.
  examples:
  - target: 오늘은 일찍 가야 해요. 가족 약속이 있거든요.
    english: I need to leave early today. You see, I have a family appointment.
  - target: 이 길로 가세요. 그쪽은 공사 중이거든요.
    english: Take this road. The other way is under construction.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g028
  pattern: V/A-거든
  english: if; when that happens
  note: Conditional connective, distinct from the explanatory sentence ending; often followed by a request
    or suggestion.
  examples:
  - target: 시간이 나거든 연락해 주세요.
    english: If you have time, please contact me.
  - target: 그 책을 다 읽거든 저에게 빌려주세요.
    english: When you finish that book, please lend it to me.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g029
  pattern: V/A-다고 해서
  english: just because; on the grounds that
  note: With a negative conclusion, rejects an overgeneralization based on the quoted proposition.
  examples:
  - target: 비싸다고 해서 다 좋은 것은 아니에요.
    english: Just because something is expensive does not mean it is good.
  - target: 쉽다고 해서 준비를 안 하면 안 돼요.
    english: You should not skip preparation just because it is easy.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g030
  pattern: V/A-다고 하던데
  english: I heard that; reported background
  note: Introduces remembered hearsay and often invites a response; distinguish personal evidence from
    quoted information.
  examples:
  - target: 그 영화가 재미있다고 하던데 같이 볼까요?
    english: I heard that movie is interesting; shall we watch it together?
  - target: 내일 비가 온다고 하던데 우산을 챙기세요.
    english: I heard it will rain tomorrow, so take an umbrella.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g031
  pattern: V-도록
  english: so that; until; to an extent
  note: Teach purpose or enabled outcome here; do not force every occurrence into a command meaning.
  examples:
  - target: 모두 들을 수 있도록 크게 말해 주세요.
    english: Please speak loudly so everyone can hear.
  - target: 늦지 않도록 서두르세요.
    english: Hurry so that you are not late.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g032
  pattern: V-도록 하다
  english: make sure to; arrange for V
  note: Common in instructions and self-commitments; strength depends on speaker roles and context.
  examples:
  - target: 내일까지 제출하도록 하세요.
    english: Make sure to submit it by tomorrow.
  - target: 앞으로 시간을 잘 지키도록 하겠습니다.
    english: I will make sure to be punctual from now on.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g033
  pattern: V-느냐에 따라
  english: depending on whether / how one V
  note: Embeds an indirect question before the variation construction; preserve the question's semantic
    focus.
  examples:
  - target: 어떻게 설명하느냐에 따라 반응이 달라져요.
    english: The response varies depending on how you explain it.
  - target: 어디에서 사느냐에 따라 가격이 달라요.
    english: The price differs depending on where you buy it.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g034
  pattern: N에 비해
  english: compared with N
  note: Compares against a standard; unlike the ordinary comparative particle, it is especially useful
    in expository prose.
  examples:
  - target: 작년에 비해 방문객이 늘었어요.
    english: The number of visitors increased compared with last year.
  - target: 가격에 비해 품질이 좋아요.
    english: The quality is good relative to the price.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g035
  pattern: N에 따르면
  english: according to N; cited information
  note: Names the source of a claim; the tutor must not invent real studies or statistics to fill this
    pattern.
  examples:
  - target: 안내문에 따르면 신청은 오늘까지예요.
    english: According to the notice, applications close today.
  - target: 일기 예보에 따르면 내일은 맑겠어요.
    english: According to the weather forecast, it will be clear tomorrow.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
- id: ko-topik4-g036
  pattern: V/A-(으)ㅁ
  english: written nominalization; the fact of
  note: Used in labels, concise records, and formal prose; not a replacement for every spoken nominalization.
  examples:
  - target: 신청이 마감되었음을 알려 드립니다.
    english: We inform you that applications have closed.
  - target: 약속을 지키지 못했음을 사과드립니다.
    english: I apologize for failing to keep my promise.
  source_id: original-ko
  level_basis: Original teaching selection for TOPIK 4 preparation; pedagogical estimate, not an exhaustive
    official grammar inventory
