# Original AI-authored teaching overlay; requires human review.
# Source senses remain the pinned CC BY-SA Kaikki English-Wiktionary import.
# Topic groups classify the selected core sense, not every meaning of a lemma.
# In particular, do not propagate a core topic to a different branch sense.
# Sense overrides are keyed by source_sense_id (the source-local sense ID).
# An optional sense-level level takes precedence over a lemma-level placement.
# Unlisted items retain their authored topic and level; this is not a quota.
# Level overrides apply to the core teaching placement, not every branch sense.
# Exclusions use exact authoring row IDs; do not remove every sense of that lemma.
#
# SOURCE-SELECTION FOLLOW-UP FOR THE IMPORTER (not replacement provenance):
# The initial audit found gaps in affirmative, personal, and possessive support.
# The importer is supplying common replacement senses and fixed grammar;
# this overlay neither creates nor substitutes source entries.
# The original mi is the musical note, su is approximative, les is an article.
# The original tienda is a tent, carne is flesh, perro is a clothespin, novia is
# a sweet roll, chica is a spice, maestra is a queen bee, carta is a map,
# gasolinera is a petrol can, reparar means notice, horario means hourly,
# tamaño is an adjective, batido describes iridescent silk, difícil means
# unlikely, and tía is colloquial girl/woman, not the selected aunt sense.
# Do not silently relabel any of those as the common beginner sense.
# café/efectivo/billete already have distinct drink/cash/ticket senses.
# Gender breadth groups intentionally do NOT pair gato/gata, novio/novia,
# chico/chica, primo/prima, maestro/maestra, or médico/doctora: their selected
# senses are not gender counterparts. New valid senses can be reviewed later.
# Numerous region-specific, sexual, military, and literary terms remain in the
# source inventory. A coherent topic is not an endorsement of core frequency.
# Core-suitability follow-up: exclusions take precedence over thematic groups.
# Rare homographs, narrow named varieties, orthographic variants, and transparent
# productive participles are not retained merely to reach a breadth target.
# Common lexicalized states (cansado, casado, cerrado, mojado, etc.) remain.
# Excluding a participial row does not prohibit teaching that form in grammar.
# Exclusions are sense-specific: replacement common senses and their aliases
# must remain even when an older homograph row with the same spelling is removed.
