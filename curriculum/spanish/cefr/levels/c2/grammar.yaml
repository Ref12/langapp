# Grammar for the level. concept: true marks items that need a longer explanation than one line.
- id: es.c2.pluperfect-ra-se-literary
  name: Literary -se and -ra forms
  explain: Recognize -se subjunctives and -ra as pluperfect in literature.
  forms: [hubiese, amara (= había amado)]
- id: es.c2.future-subjunctive-recognition
  name: Future subjunctive (recognition)
  explain: The future subjunctive survives in legal and literary text and in proverbs (recognition).
  forms: [fuere, quien tuviere]
- id: es.c2.preterite-anterior-recognition
  name: Preterite anterior (recognition)
  explain: Hube + participle appears in literary narration (recognition).
  forms: [hubo terminado]
- id: es.c2.vos-voseo-recognition
  name: Voseo (recognition)
  explain: Vos forms are used in Argentina and Central America (recognition).
  forms: [vos tenés, vos sos]
  taught: false
  region: Rioplatense/Central America
- id: es.c2.vosotros-spain-recognition
  name: Vosotros forms (Spain, recognition)
  explain: Recognize vosotros endings read in Spain texts.
  forms: [habláis, coméis, vivís]
  taught: false
  region: Spain
- id: es.c2.stylistic-inversion
  name: Stylistic inversion and hyperbaton
  explain: Literary word order places verb or adjective first for effect.
  forms: [Largo es el camino.]
- id: es.c2.archaic-forms
  name: Archaic and literary vocabulary patterns
  explain: Recognize older forms in classics.
  forms: [mas (but), empero]
- id: es.c2.specialist-registers
  name: Specialist registers
  explain: Legal, scientific and journalistic conventions.
  forms: [dicho lo anterior]
- id: es.c2.irony-nuance
  name: Irony, nuance and implicature
  explain: Interpret tone, understatement and cultural reference.
  forms: [no está mal]
- id: es.c2.proverbs-sayings
  name: Proverbs and sayings
  explain: Fixed sayings and their cultural frames.
  forms: [más vale tarde que nunca]
- id: es.c2.dialect-comparison
  name: Regional comparison
  explain: Compare Mexican, Caribbean, Andean, Southern Cone and Peninsular usage.
  forms: [coger / agarrar, computadora / ordenador]
- id: es.c2.translation-skills
  name: Mediation and translation
  explain: Rephrase and summarize across registers and languages.
  forms: [paráfrasis]
