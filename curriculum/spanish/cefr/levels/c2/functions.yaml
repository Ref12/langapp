# What the learner can do at this level.
- id: es.c2.f01
  can_do: Understand virtually everything heard or read
- id: es.c2.f02
  can_do: Summarize information from different sources coherently
- id: es.c2.f03
  can_do: Express shades of meaning precisely
- id: es.c2.f04
  can_do: Recognize literary, archaic and dialectal forms
- id: es.c2.f05
  can_do: Handle subtle humor, wordplay and cultural reference
- id: es.c2.f06
  can_do: Produce polished text in any register
- id: es.c2.f07
  can_do: Interpret complex literary and specialist text
- id: es.c2.f08
  can_do: Mediate and translate with natural phrasing
