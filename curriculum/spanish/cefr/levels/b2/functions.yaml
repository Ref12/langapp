# What the learner can do at this level.
- id: es.b2.f01
  can_do: Discuss abstract topics and defend a viewpoint
- id: es.b2.f02
  can_do: Speculate about unreal situations in present and past
- id: es.b2.f03
  can_do: Write a structured essay or formal letter
- id: es.b2.f04
  can_do: Understand most TV, radio and news at normal speed
- id: es.b2.f05
  can_do: Negotiate and persuade in meetings
- id: es.b2.f06
  can_do: Express regret, criticism and complaint
- id: es.b2.f07
  can_do: Use register shifts between formal and informal
- id: es.b2.f08
  can_do: Understand and use common idioms
- id: es.b2.f09
  can_do: Read newspapers and long articles
- id: es.b2.f10
  can_do: Interact with fluency with native speakers
- id: es.b2.f11
  can_do: Summarize and comment on a text or lecture
- id: es.b2.f12
  can_do: Narrate complex events with correct sequence of tenses
