# What the learner can do at this level.
- id: es.a1.f01
  can_do: Greet people and say goodbye
- id: es.a1.f02
  can_do: Introduce yourself and give your name
- id: es.a1.f03
  can_do: Say where you are from and where you live
- id: es.a1.f04
  can_do: Say your age and spell your name
- id: es.a1.f05
  can_do: Introduce family members
- id: es.a1.f06
  can_do: 'Describe people: tall, young, nice'
- id: es.a1.f07
  can_do: Count to a hundred and give a phone number
- id: es.a1.f08
  can_do: Say the time and the date
- id: es.a1.f09
  can_do: Name the days, months and weather
- id: es.a1.f10
  can_do: Order a drink or a meal
- id: es.a1.f11
  can_do: Ask how much something costs
- id: es.a1.f12
  can_do: Say what you like and do not like
- id: es.a1.f13
  can_do: Describe your home and your routine
- id: es.a1.f14
  can_do: Ask where a place is and how to get there
- id: es.a1.f15
  can_do: Say what you do every day
- id: es.a1.f16
  can_do: Ask simple questions and answer yes or no
- id: es.a1.f17
  can_do: Ask someone to repeat or speak slowly
- id: es.a1.f18
  can_do: Say what you want, can do and have to do
- id: es.a1.f19
  can_do: Say thank you, excuse me and sorry
- id: es.a1.f20
  can_do: Make a simple plan with ir a
- id: es.a1.f21
  can_do: Say what is happening now
