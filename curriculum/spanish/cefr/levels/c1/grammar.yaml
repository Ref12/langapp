# Grammar for the level. concept: true marks items that need a longer explanation than one line.
- id: es.c1.subjunctive-nuance
  name: Subjunctive versus indicative nuance
  explain: The mood choice signals the speaker view; it can contrast the same sentence.
  forms: [Quizás viene / Quizás venga]
- id: es.c1.past-perfect-subjunctive-uses
  name: Hypothesis in past with hubiera
  explain: Hubiera/habría alternate in unreal past clauses and in the Latin American -ra pluperfect use.
  forms: [hubiera/habría ido]
- id: es.c1.complex-sentences
  name: Complex sentence structure
  explain: Embedding several clauses with correct tense and mood across long sentences.
  forms: ['Dijo que si hubiera sabido que vendrías, te habría esperado.']
- id: es.c1.verbal-periphrases
  name: Verbal periphrases
  explain: 'Aspect and modality periphrases: llevar + gerund, ponerse a, echarse a, dar por, tener + participle.'
  forms: [me puse a llorar, tengo hechos los deberes]
- id: es.c1.ser-passive-advanced
  name: Passive and impersonal alternatives
  explain: Choose passive, se-passive or active with subject omitted for style.
  forms: [se ha decidido, fue decidido]
- id: es.c1.nominalization
  name: Nominalization
  explain: Infinitive and lo + adjective turn actions and qualities into nouns.
  forms: [el fumar, lo difícil]
- id: es.c1.quotative-and-evidential
  name: Reporting and attribution
  explain: Según, de acuerdo con, al parecer, dizque (Mexico) signal source or doubt.
  forms: [según el informe, dizque vino]
- id: es.c1.modal-particles-pragmatics
  name: Pragmatic particles
  explain: Pues, ¿no?, ándale, híjole carry attitude in speech.
  forms: ['¿no?', híjole]
- id: es.c1.hedging-politeness
  name: Hedging and mitigation
  explain: Conditionals, imperfect and diminutives soften speech.
  forms: [quería pedirle, '¿podría...?']
- id: es.c1.futuro-hipotesis
  name: Future and conditional of probability
  explain: Future and conditional express estimates about present and past.
  forms: [serían las tres]
- id: es.c1.absolute-constructions
  name: Absolute constructions
  explain: Participle and gerund constructions with their own subject.
  forms: [dicho esto, terminada la reunión]
- id: es.c1.concessive-structures
  name: Concessive structures
  explain: Por mucho que, por más que, aun cuando, y eso que.
  forms: [por mucho que lo intente]
- id: es.c1.cleft-and-focus
  name: Cleft sentences and focus
  explain: Cleft structures stress one element.
  forms: [Lo que quiero es descansar.]
- id: es.c1.idioms-collocations
  name: Idioms and collocations
  explain: Fixed phrases whose meaning is not literal.
  forms: [meter la pata, echar de menos]
- id: es.c1.register-variation
  name: Register and dialect variation
  explain: Mexican, Caribbean, Andean and Rioplatense forms (voseo is recognition only).
  forms: [vos tenés (recognition)]
- id: es.c1.academic-style
  name: Academic style
  explain: Impersonal se, nominal style and connectors for essays.
  forms: [se observa que, cabe destacar]
- id: es.c1.relative-structures-advanced
  name: Advanced relative clauses
  explain: El cual, cuanto, cuyo and prepositional relatives in formal text.
  forms: [en el que, por lo cual]
- id: es.c1.subordinating-conjunctions-formal
  name: Formal conjunctions
  explain: No obstante, por consiguiente, dado que, en tanto que.
  forms: [no obstante, dado que]
- id: es.c1.word-formation-advanced
  name: Advanced word formation
  explain: Prefix, suffix and compound families for abstract nouns.
  forms: ['des-, anti-, -miento']
- id: es.c1.rhetorical-devices
  name: Rhetorical devices
  explain: Contrast, irony, metaphor and emphasis in speech and writing.
  forms: [metáfora, ironía]
