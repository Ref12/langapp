# What the learner can do at this level.
- id: es.c1.f01
  can_do: Express yourself fluently and spontaneously
- id: es.c1.f02
  can_do: Understand implicit meaning and tone
- id: es.c1.f03
  can_do: Use language flexibly for social and professional aims
- id: es.c1.f04
  can_do: Produce clear, detailed text on complex subjects
- id: es.c1.f05
  can_do: Understand long demanding texts and films
- id: es.c1.f06
  can_do: Present and defend arguments in discussion
- id: es.c1.f07
  can_do: Adapt style to audience and purpose
- id: es.c1.f08
  can_do: Handle humor, irony and idiom
- id: es.c1.f09
  can_do: Write reports, reviews and academic text
- id: es.c1.f10
  can_do: Mediate between speakers and texts
