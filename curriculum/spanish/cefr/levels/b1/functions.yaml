# What the learner can do at this level.
- id: es.b1.f01
  can_do: Tell a story with background and events
- id: es.b1.f02
  can_do: Express wishes, hopes and doubts with the subjunctive
- id: es.b1.f03
  can_do: Give opinions and agree or disagree politely
- id: es.b1.f04
  can_do: Make polite requests and suggestions with the conditional
- id: es.b1.f05
  can_do: Talk about hypothetical situations
- id: es.b1.f06
  can_do: Give and follow detailed instructions
- id: es.b1.f07
  can_do: Report what someone said
- id: es.b1.f08
  can_do: Describe experiences, feelings and memories
- id: es.b1.f09
  can_do: Handle travel, bank and service problems
- id: es.b1.f10
  can_do: Write an informal email or formal request
- id: es.b1.f11
  can_do: Explain plans, conditions and reasons
- id: es.b1.f12
  can_do: Talk about the news, work and technology at length
- id: es.b1.f13
  can_do: Discuss advantages and disadvantages
- id: es.b1.f14
  can_do: Summarize a story, a film or an article
