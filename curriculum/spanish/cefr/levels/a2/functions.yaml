# What the learner can do at this level.
- id: es.a2.f01
  can_do: Tell what you did yesterday or last weekend
- id: es.a2.f02
  can_do: Describe how things used to be
- id: es.a2.f03
  can_do: Talk about recent events with the present perfect
- id: es.a2.f04
  can_do: Compare people, places and things
- id: es.a2.f05
  can_do: Give and follow simple directions and instructions
- id: es.a2.f06
  can_do: Shop and ask for sizes and prices
- id: es.a2.f07
  can_do: Make an appointment or reservation
- id: es.a2.f08
  can_do: Describe symptoms at the pharmacy or doctor
- id: es.a2.f09
  can_do: Invite someone and accept or decline
- id: es.a2.f10
  can_do: Talk about plans and predictions
- id: es.a2.f11
  can_do: Describe your job, studies and free time
- id: es.a2.f12
  can_do: Use direct and indirect pronouns to avoid repetition
- id: es.a2.f13
  can_do: Ask for and give simple advice
- id: es.a2.f14
  can_do: Write a short message or postcard
- id: es.a2.f15
  can_do: Understand simple announcements and menus
- id: es.a2.f16
  can_do: Talk about food, health and habits in detail
- id: es.a2.f17
  can_do: Say how long ago something happened
