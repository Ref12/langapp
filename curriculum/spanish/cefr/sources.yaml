  - id: pcic
    name: Instituto Cervantes, Plan curricular del Instituto Cervantes (level inventories A1-C2)
    url: https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/
    status: not obtained
    licence: "Instituto Cervantes copyright; reference only, never copied"
    taken: "Nothing. No page of the Plan Curricular was retrieved in this session, so no placement has basis pcic."
  - id: author
    name: Author judgement (written in this session by a model, Claude Sonnet 5.5, through the hexad gateway)
    licence: original text for this project
    taken: "Glosses (40 characters at most), gender and irregular plural for nouns, region and register notes, verb irregularity classes, level judgements, A1 topic lists, grammar items, functions, unit and module titles."
placement:
  a1: "A1 words come from model-written A1 topic lists (about 730 lemmas, basis judgement unless the word is also in the frequency top 700), plus 12 reflexive verbs added by hand."
  a2_to_c2: "Frequency rank on the lemma list, adjusted by a model's level judgement and a 1-4 teaching priority; cut at cumulative sizes 1500, 2800, 4800, 7500, 10000. basis is frequency when the rank band and the placed level agree, otherwise judgement."
known_gaps:
  - "No Plan Curricular placement: every record has basis frequency or judgement."
  - "Glosses, genders and verb classes are model-written and not reviewed by a person."
  - "Subtitle frequency over-represents film vocabulary; some B1-C2 entries are low value and need a review pass."
