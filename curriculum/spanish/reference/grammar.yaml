- id: es-g0013
  pattern: quiero / quisiera + noun or infinitive
  token_form: quiero / quisiera + noun or infinitive
  english: State a want or soften an immediate request
  disambiguator: State a want or soften an immediate request
  note: Quiero states a want directly; quisiera is introduced here as a softened request frame, not evidence
    of productive imperfect-subjunctive control. Sin plus a noun requests an absence, as in sin leche;
    this expresses a preference but does not establish dietary safety. Querer with a person can express
    affection, so context and later sense-specific teaching matter.
  examples:
  - target: Quiero comer algo sin queso.
    english: I want to eat something without cheese.
  - target: Quisiera una mesa para dos, por favor.
    english: I would like a table for two, please.
