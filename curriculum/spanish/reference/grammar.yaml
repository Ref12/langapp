- id: es-g0157
  pattern: díjome; hallábase
  token_form: díjome; hallábase
  english: Unpack older finite-verb enclisis for recognition
  disambiguator: Unpack older finite-verb enclisis for recognition
  note: Some older or deliberately archaizing prose attaches an unstressed pronoun to a finite verb where
    modern ordinary prose would place it before the verb. Segment the form and paraphrase it; do not extend
    this historical pattern to every modern finite verb.
  examples:
