  - 'no'
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0006
  pattern: ¿Puede + infinitive ...? Más despacio, por favor.
  token_form: ¿Puede + infinitive ...? Más despacio, por favor.
  english: Request assistance or conversational repair
  disambiguator: Request assistance or conversational repair
  note: Puede plus infinitive makes an usted request for an action, including repetition, writing, or
    other assistance. No entiendo and más despacio are usable repair chunks; escribirlo in this frame
    means writing the message down, with lo referring to that message. Teach these supported realizations
    before the complete present or clitic paradigms. They do not establish comprehension of unheard audio
    or productive command of every object-pronoun pattern.
  examples:
  - target: ¿Puede repetir el nombre, por favor?
    english: Could you repeat the name, please?
  - target: Más despacio, por favor. No entiendo.
    english: More slowly, please. I do not understand.
