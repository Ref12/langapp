  disambiguator: Concede persistence or degree without changing the outcome
  note: These frames say that an amount or effort does not overturn the main point. Indicative can describe
    repeated experience, while subjunctive can concede a possible or backgrounded degree. They do not
    license a universal conclusion beyond the context being discussed.
  examples:
  - target: Por más que lo intento, no entiendo esa decisión.
    english: However much I try, I do not understand that decision.
  - target: Por mucho que cambie el horario, la necesidad seguirá allí.
