    frame. Preserve parallel structure and avoid accidentally implying that the list is exhaustive.
  examples:
  - target: Tanto el coste como el tiempo importan.
    english: Both cost and time matter.
  - target: Ni la demora ni el precio nos convencen; podemos responder bien por escrito, bien en persona.
