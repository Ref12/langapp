  - por favor
  - gracias
  - de nada
  - disculpe
  - perdón
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0002
  pattern: (yo) soy; (tú) eres; es
  token_form: (yo) soy; (tú) eres; es
  english: Identify someone with an optional subject pronoun
  disambiguator: Identify someone with an optional subject pronoun
  note: Ser identifies or classifies here. Verb endings and context often make a subject pronoun unnecessary;
    an explicit pronoun can contrast participants. Él and ella identify singular third persons; ellos
    and ellas identify plural groups, with plural agreement developed later. These forms do not imply
    that ser always describes permanent properties.
  examples:
  - target: Soy estudiante.
    english: I am a student.
  - target: Yo soy Ana y tú eres Luis.
    english: I am Ana and you are Luis.
  fixed_forms:
