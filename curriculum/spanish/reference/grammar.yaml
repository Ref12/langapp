  level_basis: Original independent Spanish teaching progression.
- id: es-g0008
  pattern: los / las; unos / unas + plural noun
  token_form: los / las; unos / unas + plural noun
  english: Coordinate plural noun and determiner forms
  disambiguator: Coordinate plural noun and determiner forms
  note: Many vowel-final nouns add s and many consonant-final nouns add es; spelling changes such as luz
    to luces preserve the sound pattern. This is not a universal algorithm for every loanword. Number
    agreement extends to determiners and descriptions.
  examples:
  - target: Hay una silla y dos mesas.
    english: There is one chair and there are two tables.
  - target: Las luces están encendidas.
