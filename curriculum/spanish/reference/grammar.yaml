- id: es-g0004
  pattern: ¿Qué ...? ¿Dónde ...? ¿Cuánto ...? ¿Cuándo ...?
  token_form: ¿Qué ...? ¿Dónde ...? ¿Cuánto ...? ¿Cuándo ...?
  english: Ask for a missing identity or detail
  disambiguator: Ask for a missing identity or detail
  note: Accented question words identify missing information. Dónde asks location, adónde destination,
    cómo manner or description, cuánto amount, and cuándo time. Full direct questions use opening and
    closing question marks without an English-style auxiliary. Example predicates remain supported until
    their constructions are introduced.
  examples:
  - target: ¿Quién es ella?
    english: Who is she?
  - target: ¿Dónde está la estación? ¿Cuánto cuesta el boleto? ¿Cuándo sale el tren?
    english: Where is the station? How much does the ticket cost? When does the train leave?
  fixed_forms:
