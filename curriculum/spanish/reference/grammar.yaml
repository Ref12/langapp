- id: es-g0014
  pattern: tener + possession; tener hambre / sed / años / alergia a
  token_form: tener + possession; tener hambre / sed / años / alergia a
  english: Separate possession from conventional tener expressions
  disambiguator: Separate possession from conventional tener expressions
  note: Tener expresses possession but also frames hunger, thirst, age, and health conditions such as
    tener alergia a. Teach these expressions without treating the possession anchor as mastery of every
    tener sense. The condition noun remains separate lexical content; a links an allergy to its trigger,
    not a personal direct object.
  examples:
  - target: Tengo una botella, pero tengo sed.
    english: I have a bottle, but I am thirsty.
  - target: Mi hija tiene ocho años y tiene alergia a la leche.
