- id: es-g0012
  pattern: este / ese / aquel; esto / eso / aquello; otro / otra
  token_form: este / ese / aquel; esto / eso / aquello; otro / otra
  english: Identify an entity or select a different one
  disambiguator: Identify an entity or select a different one
  note: Demonstratives identify a noun or stand for one understood; gendered forms agree with that noun.
    Neuter esto, eso, and aquello refer to unspecified content and do not modify nouns. Otro and otra
    mean another or different, without an added un in ordinary otra talla. They are indefinite determiners,
    not demonstratives.
