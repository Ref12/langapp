  - cuándo
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0005
  pattern: sí; no + verb
  token_form: sí; no + verb
  english: Confirm or negate a statement and correct a detail
  disambiguator: Confirm or negate a statement and correct a detail
  note: Accented sí gives an affirmative reply; unaccented conditional si has a different function taught
    later. No can answer separately or precede the conjugated verb to negate a clause. Spanish does not
    add an equivalent of English do to negate the present.
  examples:
  - target: Sí, hablo español. No hablo inglés.
    english: Yes, I speak Spanish. I do not speak English.
  - target: No, no soy Luis. Soy Leo.
    english: No, I am not Luis. I am Leo.
  fixed_forms:
