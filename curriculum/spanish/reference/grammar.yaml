  english: Ask an amount or count and request an increment
  disambiguator: Ask an amount or count and request an increment
  note: Cuánto asks an amount; before a noun it agrees in gender and number. Uno becomes un before a masculine
    noun. Más requests an additional quantity, as in dos más, or greater degree, as in más despacio. Number
