  token_form: el agua fría; esta agua; las aguas frías
  english: Keep feminine agreement with stressed initial a
  disambiguator: Keep feminine agreement with stressed initial a
  note: Immediately before a feminine singular noun beginning with stressed a, including silent h, el
    normally replaces la. The noun remains feminine; demonstratives and adjectives do not become masculine.
    An intervening adjective restores la, as in la misma agua.
  examples:
  - target: El agua está fría.
    english: The water is cold.
  - target: Esta agua está limpia y las aguas del río están claras.
    english: This water is clean and the river waters are clear.
