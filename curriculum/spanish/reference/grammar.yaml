- id: es-g0007
  pattern: el / la; un / una + noun
  token_form: el / la; un / una + noun
  english: Introduce or identify a noun with its gender
  disambiguator: Introduce or identify a noun with its gender
  note: Learn noun gender rather than guessing every ending. Un or una can introduce an instance; el or
    la identifies one in context. Occupations after ser often omit the article unless characterized. Profesora,
    maestra, tía, chica, and novia are gender forms of profesor, maestro, tío, chico, and novio here,
    not extra lemmas or automatic mastery of every sense.
  examples:
  - target: Es una mesa. La mesa es pequeña.
    english: It is a table. The table is small.
  - target: Es un mapa. El mapa es útil.
    english: It is a map. The map is useful.
  - target: Mi tía es profesora; Ana es maestra.
    english: My aunt is a teacher; Ana is a teacher.
  - target: La chica de la foto es mi novia.
    english: The girl in the photo is my girlfriend.
