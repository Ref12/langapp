- id: es-g0156
  pattern: fuere / tuviere; hubiere + participle
  token_form: fuere / tuviere; hubiere + participle
  english: Recognize future-subjunctive forms in marked texts
  disambiguator: Recognize future-subjunctive forms in marked texts
  note: Future subjunctive survives in some fixed, legal, and older literary expressions but is not an
