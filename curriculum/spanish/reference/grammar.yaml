- id: es-g0158
  pattern: quienquiera que; dondequiera que + subjunctive
  token_form: quienquiera que; dondequiera que + subjunctive
  english: Interpret an unrestricted referent in marked prose
  disambiguator: Interpret an unrestricted referent in marked prose
  note: These forms extend reference to an unspecified person or place and commonly take subjunctive.
    They can sound elevated or emphatic but are not automatically obsolete. Paraphrase the intended scope
    without claiming that the narrator knows which person or place satisfies it.
  examples:
  - target: Quienquiera que lea esta carta conocerá mi decisión.
    english: Whoever reads this letter will know my decision.
  - target: Dondequiera que estuviera, recordaba aquella casa.
    english: Wherever she was, she remembered that house.
  fixed_forms:
