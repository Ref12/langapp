- id: es-g0001
  pattern: Hola; por favor; gracias; de nada; disculpe
  token_form: Hola; por favor; gracias; de nada; disculpe
  english: Open an exchange and acknowledge help
  disambiguator: Open an exchange and acknowledge help
  note: Use these short exchange frames to greet, soften a request, thank, or respond to thanks. Disculpe
    is an usted attention or apology formula taught here as a chunk, not mastery of the command paradigm.
    A polite formula alone does not make a request appropriate. Example content is English-supported.
  examples:
  - target: Hola, soy Ana.
    english: Hello, I am Ana.
  - target: Disculpe, un café, por favor. Gracias.
    english: Excuse me, a coffee, please. Thank you.
  fixed_forms:
