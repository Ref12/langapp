- id: es-g0011
  pattern: mi / tu / su; de + possessor
  token_form: mi / tu / su; de + possessor
  english: Show possession and clarify an ambiguous su
  disambiguator: Show possession and clarify an ambiguous su
  note: Mi, tu, and su agree in number with what is possessed, not with the owner. Su can refer to several
    possible people; a de phrase makes the intended owner explicit. Distinguish possessive tu from subject
    tú.
