    Do not correct one to the other without checking the intended relation.
  examples:
  - target: No necesitamos más datos, sino una explicación.
    english: We do not need more data, but an explanation.
  - target: Si no llegan los datos, cambiaremos el plan.
    english: If the data do not arrive, we will change the plan.
  fixed_forms:
  - sino
  - si no
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0139
  pattern: ayer esperaba y, de pronto, aparece ...
  token_form: ayer esperaba y, de pronto, aparece ...
  english: Interpret a deliberate shift in narrative viewpoint
  disambiguator: Interpret a deliberate shift in narrative viewpoint
  note: A narrative can use present forms for past events to make them immediate or foreground a turning
    point. The surrounding frame supplies past time. Distinguish this effect from an accidental tense
    inconsistency and do not infer that the narrator personally witnessed the event.
  examples:
  - target: Era 1998. Ana abre la puerta y encuentra la carta.
    english: It was 1998. Ana opens the door and finds the letter.
  - target: Ayer esperaba el tren y, de pronto, aparece Luis.
    english: Yesterday I was waiting for the train and, suddenly, Luis appears.
  fixed_forms:
  - de pronto
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0140
  pattern: miró el reloj. ¿Llegaría él a tiempo?
  token_form: miró el reloj. ¿Llegaría él a tiempo?
  english: Recognize a possible free-indirect viewpoint
  disambiguator: Recognize a possible free-indirect viewpoint
  note: A narrator can retain third person and past forms while a question or time word reflects a character's
    viewpoint, without an explicit pensó que. This is an interpretation supported by textual cues, not
    guaranteed by one tense. Keep narrator and character claims distinct.
  examples:
  - target: Ana miró el reloj. ¿Llegaría él a tiempo?
    english: Ana looked at the clock. Would he arrive in time?
  - target: Luis guardó la carta. Mañana sería otro día.
    english: Luis put the letter away. Tomorrow would be another day.
  fixed_forms:
  - mañana
  - sería
  - llegaría
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0141
  pattern: terminada la reunión, ...; leídas las cartas, ...
  token_form: terminada la reunión, ...; leídas las cartas, ...
  english: Read an absolute participial frame with its own subject
  disambiguator: Read an absolute participial frame with its own subject
  note: A detached participial clause can frame a completed event with a noun that controls the participle's
    agreement. That noun need not be the main clause's subject. This compressed written style requires
    clear reference; expand it into a finite clause when helpful.
  examples:
  - target: Terminada la reunión, los vecinos salieron al patio.
    english: Once the meeting was over, the neighbors went out to the courtyard.
  - target: Leídas las cartas, Ana cambió de opinión.
    english: After the letters had been read, Ana changed her mind.
  fixed_forms:
  - terminada
  - terminados
  - leída
  - leídas
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0142
  pattern: el hecho de que + indicative / subjunctive
  token_form: el hecho de que + indicative / subjunctive
  english: Distinguish asserted information from a backgrounded fact
  disambiguator: Distinguish asserted information from a backgrounded fact
  note: El hecho de que can take subjunctive when a fact is backgrounded or evaluated, even if its truth
    is accepted. Indicative is possible when the content is presented assertively. The noun hecho alone
    does not force indicative or certify the factual accuracy of the speaker's claim.
  examples:
  - target: El hecho de que haya vuelto no explica su silencio.
    english: The fact that she has returned does not explain her silence.
  - target: Insisto en el hecho de que la puerta estaba abierta.
    english: I insist on the fact that the door was open.
  fixed_forms:
  - el hecho de que
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0143
  pattern: en la medida en que; en cuanto a
  token_form: en la medida en que; en cuanto a
  english: Scope a claim without confusing condition and topic
  disambiguator: Scope a claim without confusing condition and topic
  note: En la medida en que restricts a claim by degree or a relevant condition; en cuanto a announces
    a topic. Neither phrase supplies evidence on its own. Replace vague qualification with a clear criterion
    when possible and avoid presenting a topic shift as a logical inference.
  examples:
  - target: La comparación es útil en la medida en que las condiciones coinciden.
    english: The comparison is useful insofar as the conditions match.
  - target: En cuanto al coste, todavía faltan datos.
    english: As for the cost, data are still missing.
  fixed_forms:
  - en la medida en que
  - en cuanto a
  - en cuanto al
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0144
  pattern: de ahí que + subjunctive; así que + indicative
  token_form: de ahí que + subjunctive; así que + indicative
  english: Mark an inferred consequence and its discourse status
  disambiguator: Mark an inferred consequence and its discourse status
  note: De ahí que typically takes subjunctive for a consequence presented as following from prior content.
    Así que commonly introduces an asserted result with indicative, though it can also introduce an instruction.
    The connector expresses the writer's reasoning; assess its validity separately.
  examples:
  - target: Faltan dos respuestas; de ahí que el resultado sea provisional.
    english: Two replies are missing; hence the result is provisional.
  - target: Faltan dos respuestas, así que el resultado es provisional.
    english: Two replies are missing, so the result is provisional.
  fixed_forms:
  - de ahí que
  - así que
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0145
  pattern: lo que ... es ...; fue ... quien ...
  token_form: lo que ... es ...; fue ... quien ...
  english: Focus a correction while preserving the underlying claim
  disambiguator: Focus a correction while preserving the underlying claim
  note: A cleft or pseudocleft highlights one element as the relevant answer or correction. Keep tense
    and reference coherent, and do not let emphasis turn a qualified claim into an absolute one. These
    are discourse choices rather than extra events.
  examples:
  - target: Lo que necesitamos es una comparación más clara.
    english: What we need is a clearer comparison.
  - target: Fue Ana quien propuso revisar el criterio.
    english: It was Ana who proposed revising the criterion.
  fixed_forms:
  - lo que
  - es
  - fue
  - quien
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0146
  pattern: es decir; mejor dicho; en otras palabras
  token_form: es decir; mejor dicho; en otras palabras
  english: Explain, correct, or paraphrase without hiding a revision
  disambiguator: Explain, correct, or paraphrase without hiding a revision
  note: Es decir explicates; mejor dicho openly corrects a prior formulation; en otras palabras proposes
    a paraphrase. The relationship is not identical in every use. If the second statement changes the
    claim rather than restating it, acknowledge that correction instead of presenting it as equivalent.
  examples:
  - target: La medida es provisional; es decir, habrá que revisarla.
    english: The measure is provisional; that is, it will need reviewing.
  - target: Todos aceptaron, mejor dicho, nadie se opuso en la reunión.
    english: Everyone accepted, or rather, nobody objected at the meeting.
  fixed_forms:
  - es decir
  - mejor dicho
  - en otras palabras
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0147
  pattern: se ruega / se solicita + infinitive or que clause
  token_form: se ruega / se solicita + infinitive or que clause
  english: Interpret an institutional request and its expected actor
  disambiguator: Interpret an institutional request and its expected actor
  note: Agentless request frames can sound institutional and may leave the requester unstated. An infinitive
    presents the requested action; que plus subjunctive can identify the actor more explicitly. This construction
    is not proof of legal authority or of a request's mandatory status.
  examples:
  - target: Se ruega confirmar la asistencia antes del martes.
    english: Please confirm attendance before Tuesday.
  - target: Se solicita que Ana envíe el resumen.
    english: Ana is requested to send the summary.
  fixed_forms:
  - se ruega
  - se solicita
  - se ruega que
  - se solicita que
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0148
  pattern: quedar en + infinitive; quedar en que + agreement
  token_form: quedar en + infinitive; quedar en que + agreement
  english: Record an agreement rather than merely propose it
  disambiguator: Record an agreement rather than merely propose it
  note: Quedar en presents an agreed action, not just an invitation or unilateral wish. A que clause allows
    explicit participants and timing; a past agreement can use the reporting perspective already learned.
    Confirm the actual agreement instead of inventing consent from a polite response.
  examples:
  - target: Quedamos en revisar la propuesta el jueves.
    english: We agree to review the proposal on Thursday.
  - target: Quedamos en que Ana enviaría el resumen.
    english: We agreed that Ana would send the summary.
  fixed_forms:
  - quedar en
  - quedar en que
  - quedamos en
  - quedamos en que
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0149
  pattern: conviene + infinitive; conviene que + subjunctive
  token_form: conviene + infinitive; conviene que + subjunctive
  english: Recommend a procedure without claiming binding obligation
  disambiguator: Recommend a procedure without claiming binding obligation
  note: Conviene can recommend an advantageous or appropriate action; it is not equivalent to a binding
    requirement. Use an infinitive for a general procedure and a finite clause to specify an actor. Compare
    with hay que or se deberá only when the source actually establishes that force.
  examples:
  - target: Conviene guardar una copia del acuerdo.
    english: It is advisable to keep a copy of the agreement.
  - target: Conviene que los equipos confirmen sus plazos.
    english: It is advisable for the teams to confirm their deadlines.
  fixed_forms:
  - conviene
  - conviene que
  - se deberá
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0150
  pattern: si; solo si; siempre que
  token_form: si; solo si; siempre que
  english: Distinguish sufficient and necessary operating conditions
  disambiguator: Distinguish sufficient and necessary operating conditions
  note: Si can introduce a sufficient condition for the stated response; solo si makes the following condition
    necessary. Neither automatically states both directions. Siempre que can express a condition in operational
    prose. Interpret exactly what the instruction commits to rather than infer an undocumented system
    guarantee.
  examples:
  - target: Si hay un error, aparece un aviso.
    english: If there is an error, a notice appears.
  - target: El sistema guarda el cambio solo si pulsas Confirmar.
    english: The system saves the change only if you press Confirm.
  fixed_forms:
  - si
  - solo si
  - siempre que
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0151
  pattern: en caso de + noun or infinitive; en caso de que + subjunctive
  token_form: en caso de + noun or infinitive; en caso de que + subjunctive
  english: Read a contingency and its recovery instruction
  disambiguator: Read a contingency and its recovery instruction
  note: En caso de introduces a named contingency; a finite clause uses en caso de que with subjunctive.
    This is an instructional possibility, not an assertion that failure occurred. Identify the actor and
    distinguish the documented response from a new technical recommendation.
  examples:
  - target: En caso de error, conserva una copia del mensaje.
    english: In case of an error, keep a copy of the message.
  - target: En caso de que falte un archivo, consulta el registro.
    english: If a file is missing, consult the log.
  fixed_forms:
  - en caso de
  - en caso de que
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0152
  pattern: consistir en + noun or infinitive; servir para + infinitive
  token_form: consistir en + noun or infinitive; servir para + infinitive
  english: Distinguish a system's composition from its purpose
  disambiguator: Distinguish a system's composition from its purpose
  note: Consistir en identifies what an operation consists of; servir para explains its function. The
    prepositions belong to the constructions rather than a general translation of English for. Scope the
    explanation to the supplied system and do not infer undocumented capability or expertise.
  examples:
  - target: La comprobación consiste en comparar dos versiones.
    english: The check consists of comparing two versions.
  - target: Este registro sirve para localizar errores.
    english: This log serves to locate errors.
  fixed_forms:
  - consiste en
  - consisten en
  - sirve para
  - sirven para
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0153
  pattern: se observó que; no se pudo determinar si
  token_form: se observó que; no se pudo determinar si
  english: Separate a reported observation from an unresolved question
  disambiguator: Separate a reported observation from an unresolved question
  note: An observation report can assert its content with indicative; an unresolved indirect question
    remains open after si. These examples are fictional language tasks, not real experimental observations.
    Preserve the source's stated limits and do not upgrade absence of a conclusion into proof of absence.
  examples:
  - target: Se observó que la lectura cambiaba con la temperatura.
    english: It was observed that the reading changed with the temperature.
  - target: No se pudo determinar si el cambio era permanente.
    english: It was not possible to determine whether the change was permanent.
  fixed_forms:
  - se observó que
  - no se pudo determinar si
  source_id: es-original-teaching
  level_basis: Original independent Spanish teaching progression.
- id: es-g0154
  pattern: ser compatible con; no implicar que + subjunctive
  token_form: ser compatible con; no implicar que + subjunctive
  english: Distinguish compatibility from a warranted conclusion
  disambiguator: Distinguish compatibility from a warranted conclusion
  note: Compatibility says two claims can coexist, not that one proves the other. Negated implication
    commonly takes subjunctive because the conclusion is not asserted as following. Evaluate the actual
    source and method; these language frames do not establish scientific validity by themselves.
  examples:
  - target: El resultado es compatible con ambas explicaciones.
    english: The result is compatible with both explanations.
  - target: La coincidencia no implica que exista una relación causal.
