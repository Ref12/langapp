- id: es-g0009
  pattern: la camisa blanca; los zapatos blancos; está abierto
  token_form: la camisa blanca; los zapatos blancos; está abierto
  english: Match an adjective to the described noun
  disambiguator: Match an adjective to the described noun
  note: Descriptive adjectives often follow the noun and agree in number and, where the adjective varies,
    gender. Not every adjective has separate masculine and feminine forms. Agreement also applies after
    a linking verb. Ser can present a property; estar can describe a condition, as in está abierto. This
    is not a permanent-versus-temporary rule, and recognizing this state frame does not establish the
    later passive-event contrast.
  examples:
  - target: La camisa blanca es pequeña.
    english: The white shirt is small.
  - target: Los zapatos azules son grandes.
    english: The blue shoes are big.
  - target: El museo es grande y está abierto.
    english: The museum is large and is open.
  fixed_forms:
