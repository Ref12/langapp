- id: es-g0003
  pattern: tú hablas; usted habla
  token_form: tú hablas; usted habla
  english: Match singular address to the verb
  disambiguator: Match singular address to the verb
  note: Tú takes its own verb ending; usted addresses the listener with third-person grammar. The first-person
    necesito frame is also available with an explicit lexical gloss, not an invented need sense. Early
    exchanges model address without assuming age alone determines it. Clear subjects can be omitted.
  examples:
  - target: ¿Hablas español?
    english: Do you speak Spanish? (tú)
  - target: Necesito ayuda. ¿Usted vive aquí?
    english: I need help. Do you live here? (usted)
