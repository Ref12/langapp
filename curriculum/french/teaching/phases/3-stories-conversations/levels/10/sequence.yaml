schema_version: 3
id: fr-level-10
title: Feelings and relationships
language: french
level_basis: Independently authored communicative progression. Dictionary sources identify provenance, not CEFR levels, examination readiness, or demonstrated ability.
review_policy: A module spans several small lessons, usually about 5-8 new senses at a time. Adjust the load to retrieval and relevance. Retrieve earlier material in new contexts and revisit fragile items on later days. Record modality, assistance, and delayed performance; completing an inventory is not mastery.
kind: level
number: 10
phase: stories-conversations
prerequisites:
- fr-level-01
- fr-level-02
- fr-level-03
- fr-level-04
- fr-level-05
- fr-level-06
- fr-level-07
- fr-level-08
- fr-level-09
goals: &id001
- Explain an emotional response with relevant circumstances.
- Clarify who did something to whom.
- Respond considerately to a different interpretation of a social exchange.
checkpoint:
  task: Explain a fictional misunderstanding from two perspectives and propose an appropriate repair.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
