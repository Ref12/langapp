- {id: fr-g-imparfait-background, ch: radical de nous + -ais / -ait / -ions / -iez / -aient, ds: View a past situation from within or as a habit}
- {id: fr-g-past-aspect-contrast, ch: imparfait de fond + passé composé d'événement, ds: Contrast an unfolding situation with a bounded event}
- {id: fr-g-temporal-clause-sequence, ch: quand / pendant que + proposition ; puis + événement, ds: Organize event order and overlapping circumstances}
- {id: fr-g-compound-negation-adverbs, ch: ne + auxiliaire + pas / jamais / plus + participe, ds: Negate or qualify a compound event around its auxiliary}
- {id: fr-g-indirect-object-clitics, ch: sujet + lui / leur + verbe, ds: Replace a personal à complement with lui or leur}
- {id: fr-g-stressed-pronouns, ch: préposition + moi / toi / lui / elle / nous / vous / eux / elles, ds: Personal reference after prepositions and in contrast}
- {id: fr-g-reciprocal-pronominals, ch: sujet pluriel + se / nous / vous + verbe réciproque, ds: Distinguish mutual actions from self-directed actions}
- {id: fr-g-pronominal-past-agreement, ch: 'sujet + se + être + participe : objet direct ou indirect', ds: Pronominal participles do not always agree with the subject}
- {id: fr-g-infinitive-clitic-placement, ch: verbe conjugué + pronom objet + infinitif, ds: Place an object clitic with the infinitive that governs it}
- {id: fr-g-imperative-clitic-order, ch: donne-le-moi ; ne me le donne pas, ds: Affirmative commands move clitics after the verb}
- {id: fr-g-gerund-shared-subject, ch: en + participe présent, ds: Link manner or simultaneous action to the same subject}
- {id: fr-g-avoir-preceding-object-agreement, ch: objet direct antéposé + avoir + participe accordé, ds: Agree an avoir participle with an earlier direct object}
- {id: fr-g-relative-qui-que, ch: nom + qui + verbe ; nom + que + sujet + verbe, ds: Relative qui is a subject and que a direct object}
- {id: fr-g-indirect-questions, ch: demander / savoir + si / où / ce que + sujet + verbe, ds: Embed a question without direct-question inversion}
- {id: fr-g-relative-ou, ch: lieu / moment + où + proposition, ds: Link a place or time with relative où}
- {id: fr-g-present-reporting, ch: dire / expliquer que + proposition, ds: Report a statement while tracking its speaker and reference}
- {id: fr-g-relative-dont, ch: antécédent + dont + proposition contenant une relation en de, ds: Relative dont replaces a complement introduced by de}
- {id: fr-g-conditional-present, ch: radical du futur + -ais / -ait / -ions / -iez / -aient, ds: Conditional forms soften advice and a proposed choice}
- {id: fr-g-superlative-comparison-set, ch: le / la / les plus / moins + adjectif ; le meilleur, ds: Identify an extreme within an explicit comparison set}
- {id: fr-g-nominal-concession, ch: 'malgré + nom ; proposition, pourtant proposition', ds: Acknowledge an obstacle without denying the outcome}
