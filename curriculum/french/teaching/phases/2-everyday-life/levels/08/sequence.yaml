schema_version: 3
id: fr-level-08
title: Work, study, and invitations
language: french
level_basis: Independently authored communicative progression. Dictionary sources identify provenance, not CEFR levels, examination readiness, or demonstrated ability.
review_policy: A module spans several small lessons, usually about 5-8 new senses at a time. Adjust the load to retrieval and relevance. Retrieve earlier material in new contexts and revisit fragile items on later days. Record modality, assistance, and delayed performance; completing an inventory is not mastery.
kind: level
number: 8
phase: everyday-life
prerequisites:
- fr-level-01
- fr-level-02
- fr-level-03
- fr-level-04
- fr-level-05
- fr-level-06
- fr-level-07
goals: &id001
- Explain a familiar work or study routine.
- Invite someone and accept or decline considerately.
- Coordinate a shared activity while accounting for a recent change and a practical constraint.
checkpoint:
  task: Arrange a shared activity, explain a recent change, and resolve a household or service constraint affecting the plan.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
