schema_version: 3
id: fr-level-07
title: Journeys and changed arrangements
language: french
level_basis: Independently authored communicative progression. Dictionary sources identify provenance, not CEFR levels, examination readiness, or demonstrated ability.
review_policy: A module spans several small lessons, usually about 5-8 new senses at a time. Adjust the load to retrieval and relevance. Retrieve earlier material in new contexts and revisit fragile items on later days. Record modality, assistance, and delayed performance; completing an inventory is not mastery.
kind: level
number: 7
phase: everyday-life
prerequisites:
- fr-level-01
- fr-level-02
- fr-level-03
- fr-level-04
- fr-level-05
- fr-level-06
goals: &id001
- Describe a recent journey or booking.
- Distinguish a completed event from an upcoming plan.
- Compare practical alternatives after an arrangement changes.
checkpoint:
  task: Explain what changed in a journey and negotiate a revised itinerary with new times or destinations.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
