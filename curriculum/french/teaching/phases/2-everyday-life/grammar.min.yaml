- {id: fr-g-demonstrative-determiners, ch: ce / cet / cette / ces + nom ; nom-ci / nom-là, ds: Point out a noun and distinguish contextual alternatives}
- {id: fr-g-reflexive-routines, ch: sujet + me / te / se / nous / vous + verbe, ds: A pronominal routine refers back to its own subject}
- {id: fr-g-frequency-adverbs, ch: verbe + souvent / toujours ; ne + verbe + jamais, ds: State a routine's frequency without treating it as a rule}
- {id: fr-g-duration-depuis-pendant, ch: présent + depuis ; pendant + durée ; dans + délai, ds: 'Distinguish ongoing duration, bounded duration, and delay'}
- {id: fr-g-present-ir-iss, ch: '-ir : -is / -is / -it / -issons / -issez / -issent', ds: The productive -ir family with plural -iss- forms}
- {id: fr-g-present-re, ch: '-re : -s / -s / radical / -ons / -ez / -ent', ds: Present forms of the attendre and vendre family}
- {id: fr-g-negative-quantities-de, ch: ne + verbe + pas de / d' + nom, ds: Negate an indefinite amount without negating its identity}
- {id: fr-g-avoir-body-states, ch: avoir mal à + partie du corps ; avoir faim / soif, ds: Describe bodily states with fixed avoir frames}
- {id: fr-g-comparative-degree, ch: plus / moins / aussi + adjectif + que, ds: Compare the degree of a quality between alternatives}
- {id: fr-g-passe-compose-avoir, ch: avoir au présent + participe passé, ds: Present a completed event using an avoir compound}
- {id: fr-g-passe-compose-etre, ch: être au présent + participe accordé, ds: Selected intransitive verbs take être and subject agreement}
- {id: fr-g-near-future, ch: aller au présent + infinitif, ds: Express a prospective event or current intention}
- {id: fr-g-direct-object-clitics, ch: sujet + me / te / le / la / nous / vous / les + verbe, ds: Replace a recoverable direct object before the verb}
- {id: fr-g-recent-past, ch: venir de + infinitif, ds: Relate a just-completed event to the current moment}
- {id: fr-g-modal-infinitives, ch: devoir / pouvoir / savoir + infinitif, ds: 'Distinguish obligation, available ability, and learned skill'}
- {id: fr-g-cause-and-objection, ch: proposition parce que cause ; proposition mais objection, ds: Connect a reason or practical objection to a statement}
