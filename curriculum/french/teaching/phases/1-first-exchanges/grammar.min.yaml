- {id: fr-g-subjects-etre-register, ch: je suis / tu es / vous êtes + description ou lieu, ds: Subject reference and present être in first exchanges}
- {id: fr-g-avoir-present, ch: sujet + ai / as / a / avons / avez / ont, ds: Present avoir for possession and an available question}
- {id: fr-g-present-er, ch: radical + -e / -es / -e / -ons / -ez / -ent, ds: Regular -er present forms for speaking and listening}
- {id: fr-g-basic-questions, ch: énoncé interrogatif / est-ce que + sujet + verbe, ds: Ask a yes-no question without changing statement order}
- {id: fr-g-negative-pas, ch: sujet + ne / n' + verbe + pas, ds: Standard two-part negation around a finite verb}
- {id: fr-g-articles-gender-number, ch: un / une / des ; le / la / les + nom, ds: Introduce a referent or identify a known one}
- {id: fr-g-possessive-determiners, ch: mon / ma / mes ; son / sa / ses + nom, ds: Possessive forms agree with the possessed noun}
- {id: fr-g-adjective-agreement, ch: nom + adjectif accordé / nom + être + adjectif, ds: Match descriptive adjectives to gender and number}
- {id: fr-g-partitives-quantities, ch: du / de la / de l' ; quantité + de / d' + nom, ds: Unspecified portions versus measured quantities}
- {id: fr-g-polite-modal-request, ch: 'je voudrais + nom ; vous pouvez + infinitif ?', ds: Soften a request with a learned conditional or modal}
- {id: fr-g-clock-calendar-prepositions, ch: à + heure ; lundi / le lundi ; avant / après + repère, ds: Locate a meeting or routine in clock and calendar time}
- {id: fr-g-prendre-faire-present, ch: je prends / nous prenons ; je fais / vous faites, ds: High-use irregular present forms for meals and actions}
- {id: fr-g-place-prepositions-contractions, ch: à / de + lieu ; au / aux / du / des ; chez + personne, ds: Mark destinations and origins with article contractions}
- {id: fr-g-existential-il-y-a, ch: 'il y a + nom ; est-ce qu''il y a + nom ?', ds: Introduce the existence of something at a location}
- {id: fr-g-imperative-directions, ch: verbe impératif sans sujet ; ne + impératif + pas, ds: Give directions and short positive or negative instructions}
- {id: fr-g-elision-h-boundaries, ch: l' / j' / n' devant voyelle ou h muet ; le h aspiré, ds: Elision and liaison have lexical boundary restrictions}
