goals: &id001
- Choose words and constructions that preserve a subtle distinction.
- Explain relationships among abstract ideas.
- Revise ambiguous scope or reference in an explanation.
checkpoint:
  task: Improve an imprecise explanation and justify each consequential change in meaning, emphasis, or scope.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
