goals: &id001
- Support an interpretation with specific textual evidence.
- Recognize marked narrative or formal constructions in context.
- Acknowledge a credible alternative interpretation.
checkpoint:
  task: Present an interpretation of a short text, explain the effect of a marked construction, and respond to a competing reading.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
