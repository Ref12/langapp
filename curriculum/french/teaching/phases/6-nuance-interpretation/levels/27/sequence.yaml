goals: &id001
- Interpret a commonly encountered figurative expression in context.
- Paraphrase imagery without treating it literally.
- Use an idiomatic expression only where its meaning and register fit.
checkpoint:
  task: Explain an idiomatic passage and compare its effect with a literal paraphrase for a different audience.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
