goals: &id001
- Adapt a request or disagreement to the relationship and setting.
- Recognize common conversational reductions without applying them indiscriminately.
- Preserve the intended meaning while changing formality.
checkpoint:
  task: Recast the same difficult request for a friend and a formal recipient and explain the effects of the changes.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
