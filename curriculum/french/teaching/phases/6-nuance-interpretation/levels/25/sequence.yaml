goals: &id001
- Distinguish literal content from implied evaluation.
- Express different degrees of commitment.
- Explain why context supports one interpretation more than another.
checkpoint:
  task: Compare plausible readings of an indirect message and defend the interpretation best supported by the situation.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
