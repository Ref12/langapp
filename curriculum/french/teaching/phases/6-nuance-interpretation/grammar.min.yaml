- {id: fr-g-rejected-motive, ch: 'ce n''est pas que + subjonctif, mais + explication', ds: Reject an inferred reason before giving the actual explanation}
- {id: fr-g-negation-quantifier-scope, ch: ne...pas tous / toutes ; aucun / aucune...ne, ds: Distinguish not all members from no members}
- {id: fr-g-cleft-focus, ch: c'est X qui / que + proposition, ds: Focus one constituent while keeping its grammatical role}
- {id: fr-g-dislocated-topics, ch: 'thème, pronom + proposition ; proposition, thème', ds: Detach a topic and resume it inside the clause}
- {id: fr-g-spoken-reductions, ch: '[conversation familière] je sais pas ; y a ; t''es', ds: Recognize common reductions without universalizing them}
- {id: fr-g-formal-question-inversion, ch: 'verbe-pronom ? ; a-t-il / elle + participe ?', ds: Form a compact question in a more formal register}
- {id: fr-g-expletive-ne, ch: craindre que ne ; avant que ne ; plus...que ne, ds: Recognize optional formal ne that does not negate its clause}
- {id: fr-g-formal-directive-frames, ch: veuillez + infinitif ; merci de + infinitif, ds: Adapt an instruction without disguising its requested action}
- {id: fr-g-as-if-comparison, ch: comme si + imparfait / plus-que-parfait, ds: Compare an appearance or behavior with an imagined situation}
- {id: fr-g-literal-interpretation-frame, ch: prendre des propos au pied de la lettre, ds: Contrast a literal reading with intended nonliteral meaning}
- {id: fr-g-minimal-concessive-reason, ch: ne serait-ce que pour + infinitif, ds: Offer a minimal reason without excluding stronger reasons}
- {id: fr-g-frustrated-effort-avoir-beau, ch: 'avoir beau + infinitif, résultat contraire', ds: Present an effort or circumstance as unable to change an outcome}
- {id: fr-g-nonspecific-relative-mood, ch: chercher un nom qui + subjonctif / identifier le nom qui + indicatif, ds: Contrast a sought property with an identified referent}
- {id: fr-g-respective-pairing, ch: A et B + respectivement + X et Y, ds: Map two ordered lists without merging their properties}
- {id: fr-g-domain-framing, ch: 'quant à / en ce qui concerne + domaine, proposition', ds: Limit an evaluation to a named domain or participant}
- {id: fr-g-concessive-tout-gerund, ch: tout en + participe présent, ds: Combine simultaneous action with a contextual concession}
- {id: fr-g-narrative-present, ch: repère passé + présent de narration, ds: Shift to present forms inside a clearly past narrative}
- {id: fr-g-passe-simple-recognition, ch: '[lecture narrative] entra / prit / partit', ds: Recognize bounded narrative events in the passé simple}
- {id: fr-g-free-indirect-discourse, ch: récit à la troisième personne + pensée sans verbe introducteur, ds: Recognize a character's viewpoint inside narrative wording}
- {id: fr-g-relative-information-status, ch: 'nom qui restreint ; nom, qui ajoute, proposition', ds: Distinguish identifying relatives from added commentary}
- {id: fr-g-discourse-clarification, ch: à savoir + précision ; autrement dit + reformulation, ds: Distinguish specifying content from paraphrasing a claim}
- {id: fr-g-concessive-si-inference, ch: 'si P, Q ne...pas pour autant', ds: Accept a premise while rejecting an unwarranted conclusion}
- {id: fr-g-extent-and-grounds, ch: dans la mesure où + indicatif, ds: Qualify a claim by its extent or by stated grounds}
- {id: fr-g-residual-concessive-assertion, ch: il n'en reste pas moins que + indicatif, ds: Preserve a claim after acknowledging a relevant objection}
