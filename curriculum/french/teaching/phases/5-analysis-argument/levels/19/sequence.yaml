goals: &id001
- Distinguish an observation from an inference.
- Explain what supports a claim.
- Express uncertainty without erasing a meaningful conclusion.
checkpoint:
  task: Evaluate a short argument and explain which conclusion the available evidence supports and which remains uncertain.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
