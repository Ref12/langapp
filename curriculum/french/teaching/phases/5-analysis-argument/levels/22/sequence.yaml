goals: &id001
- Represent competing considerations fairly.
- Explain a hypothetical situation without confusing it with a fact.
- Distinguish a personal perspective from a generalization.
checkpoint:
  task: Discuss a dilemma while accurately representing two conflicting values and the limits of each argument.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
