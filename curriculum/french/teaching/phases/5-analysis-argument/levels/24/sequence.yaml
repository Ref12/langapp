- fr-level-23
goals: &id001
- Combine relevant information from more than one source.
- Compare options using explicit criteria.
- Preserve attribution, uncertainty, and tense relationships in a sustained explanation.
checkpoint:
  task: Produce a proposal that reconciles partially conflicting sources, states its criteria, and explains how uncertainty affects the recommendation.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
