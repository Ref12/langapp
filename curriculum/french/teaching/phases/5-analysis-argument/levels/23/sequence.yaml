goals: &id001
- Build a recommendation from explicit reasons.
- Consider an objection or counterfactual alternative.
- Narrow or revise a claim when counterevidence appears.
checkpoint:
  task: Defend a recommendation, answer a substantive objection, and revise its scope after new evidence is introduced.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
