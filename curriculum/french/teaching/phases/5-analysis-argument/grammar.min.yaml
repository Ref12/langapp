- {id: fr-g-past-subjunctive, ch: avoir / être au subjonctif présent + participe passé, ds: Place an evaluated or nonasserted event before its reference}
- {id: fr-g-epistemic-modals, ch: devoir / pouvoir + infinitif de situation, ds: Mark an inference or possibility rather than an obligation}
- {id: fr-g-evidential-seeming, ch: il semble que / il me semble que + proposition, ds: Qualify a judgment and identify its perspective}
- {id: fr-g-purpose-finite-subject, ch: pour que / afin que + subjonctif, ds: Give an intended purpose with a separately expressed actor}
- {id: fr-g-plus-que-parfait, ch: avoir / être à l'imparfait + participe passé, ds: Establish an event anterior to another past reference point}
- {id: fr-g-future-perfect, ch: avoir / être au futur + participe passé, ds: Locate completion before a future reference point}
- {id: fr-g-compound-relatives, ch: préposition + lequel / laquelle / lesquels / lesquelles, ds: Retain a preposition in a gendered relative construction}
- {id: fr-g-action-nominalization, ch: nom d'action + de + participant, ds: Package an event as a noun while preserving its participants}
- {id: fr-g-perfect-infinitive, ch: après avoir / être + participe passé, ds: Order completed actions with a shared-subject infinitive}
- {id: fr-g-threshold-infinitive, ch: assez / trop + adjectif ou adverbe + pour + infinitif, ds: Evaluate whether a degree permits an intended action}
- {id: fr-g-absolute-participle, ch: 'nom sujet + participe passé, proposition principale', ds: A detached participial clause has its own explicit subject}
- {id: fr-g-correlative-comparison, ch: 'plus / moins + proposition, plus / moins + proposition', ds: Describe covariation without automatically claiming causation}
- {id: fr-g-conditional-past, ch: avoir / être au conditionnel + participe passé, ds: Present a past action as unrealized or tentatively evaluated}
- {id: fr-g-universal-concessive-relatives, ch: quoi que / où que / qui que + subjonctif, ds: Make a statement independent of an unspecified alternative}
- {id: fr-g-past-counterfactual, ch: 'si + plus-que-parfait, conditionnel passé ou présent', ds: Explore a different past and its past or present consequence}
- {id: fr-g-even-if-concession, ch: même si + indicatif ; quand bien même + conditionnel, ds: Keep a conclusion despite an actual or imagined obstacle}
- {id: fr-g-exception-unless, ch: à moins que + subjonctif ; sauf si + indicatif, ds: State an exception that would defeat a proposed conclusion}
- {id: fr-g-explicit-conditional-requirement, ch: à condition que / pourvu que + subjonctif, ds: Make acceptance depend on a stated requirement}
- {id: fr-g-corrective-focus, ch: 'non pas X, mais Y', ds: Replace a mistaken characterization rather than add an objection}
- {id: fr-g-reserved-qualification, ch: proposition ; encore faut-il que + subjonctif, ds: Add a necessary qualification to an apparent solution}
- {id: fr-g-propositional-relatives, ch: ce qui / ce que / ce dont + proposition, ds: Refer to a proposition or an unspecified thing by its role}
- {id: fr-g-reported-anteriority, ch: a dit que + plus-que-parfait / conditionnel passé, ds: Preserve earlier events and future completion in past reporting}
- {id: fr-g-reportive-conditional, ch: 'selon une source, conditionnel présent / passé', ds: Mark an attributed claim as unconfirmed by the reporter}
- {id: fr-g-paired-argument-structure, ch: 'd''une part P, d''autre part Q', ds: Organize two distinct considerations without forcing opposition}
