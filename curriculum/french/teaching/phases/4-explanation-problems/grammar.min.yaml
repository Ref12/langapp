- {id: fr-g-locative-y, ch: y + verbe ; verbe modal + y + infinitif, ds: Refer back to a place or a suitable nonpersonal à complement}
- {id: fr-g-partitive-en, ch: en + verbe + quantité ; en + verbe construit avec de, ds: Refer back to an amount or a suitable de complement}
- {id: fr-g-declarative-clitic-order, ch: me/te/se/nous/vous → le/la/les → lui/leur → y → en, ds: Order compatible clitics before their governing verb}
- {id: fr-g-restrictive-ne-que, ch: ne + verbe + que + élément restreint, ds: Restrict a statement to only the focused element}
- {id: fr-g-future-simple, ch: radical du futur + -ai / -as / -a / -ons / -ez / -ont, ds: 'State a future arrangement, expectation, or commitment'}
- {id: fr-g-open-si-condition, ch: 'si + présent, présent / futur / impératif', ds: Set an open practical condition without future in its si clause}
- {id: fr-g-passive-voice, ch: patient + être au temps voulu + participe + par agent, ds: Make the affected participant the grammatical subject}
- {id: fr-g-causative-faire, ch: faire + infinitif + participants, ds: Arrange or cause an action rather than perform it oneself}
- {id: fr-g-demonstrative-pronouns, ch: celui / celle / ceux / celles + complément ou -ci / -là, ds: Replace a noun while distinguishing its referent}
- {id: fr-g-middle-se, ch: chose + se + verbe actif, ds: Describe a process or property without a self-acting agent}
- {id: fr-g-past-reporting-perspective, ch: a dit que + imparfait / conditionnel présent, ds: Locate reported states and later events from a past viewpoint}
- {id: fr-g-source-attribution, ch: 'selon / d''après + source, proposition', ds: Attribute information without silently endorsing it}
- {id: fr-g-participle-versus-adjective, ch: nom + participe présent invariable / adjectif verbal accordé, ds: Separate a verbal participle from an agreeing adjective}
- {id: fr-g-degree-consequence, ch: si + adjectif / tellement + verbe ou adjectif + que, ds: Link an asserted result to the degree of a cause}
- {id: fr-g-purpose-infinitive, ch: pour / afin de + infinitif, ds: Express an intended purpose with a controlled infinitive}
- {id: fr-g-nominal-cause, ch: à cause de / grâce à + nom, ds: Present a cause with a negative or favorable framing}
- {id: fr-g-subjunctive-will-necessity, ch: vouloir que / il faut que + subjonctif présent, ds: Express a desired or required action with its own subject}
- {id: fr-g-subjunctive-assertion-contrast, ch: penser que + indicatif ; ne pas penser que + subjonctif, ds: Contrast asserted belief with a nonasserted complement}
- {id: fr-g-subjunctive-concession, ch: 'bien que + subjonctif, proposition', ds: Acknowledge a circumstance despite an unexpected outcome}
- {id: fr-g-hypothetical-present, ch: 'si + imparfait, conditionnel présent', ds: Imagine a present or future alternative with distance}
