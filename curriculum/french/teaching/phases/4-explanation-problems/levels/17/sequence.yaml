- fr-level-08
- fr-level-09
- fr-level-10
- fr-level-11
- fr-level-12
- fr-level-13
- fr-level-14
- fr-level-15
- fr-level-16
goals: &id001
- Explain a system or technology to a nonspecialist.
- Describe an environmental change and a plausible consequence.
- Explain the purpose and limitations of a proposed response.
checkpoint:
  task: Explain a technical or environmental problem and compare two responses using explicit limitations rather than specialist assumptions.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
