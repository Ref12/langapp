- {id: fr-g-locative-y, ch: y + verbe ; verbe modal + y + infinitif, ds: Refer back to a place or a suitable nonpersonal à complement}
- {id: fr-g-partitive-en, ch: en + verbe + quantité ; en + verbe construit avec de, ds: Refer back to an amount or a suitable de complement}
- {id: fr-g-declarative-clitic-order, ch: me/te/se/nous/vous → le/la/les → lui/leur → y → en, ds: Order compatible clitics before their governing verb}
- {id: fr-g-restrictive-ne-que, ch: ne + verbe + que + élément restreint, ds: Restrict a statement to only the focused element}
