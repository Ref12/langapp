schema_version: 3
id: fr-level-14
title: Unfamiliar practical problems
language: french
level_basis: Independently authored communicative progression. Dictionary sources identify provenance, not CEFR levels, examination readiness, or demonstrated ability.
review_policy: A module spans several small lessons, usually about 5-8 new senses at a time. Adjust the load to retrieval and relevance. Retrieve earlier material in new contexts and revisit fragile items on later days. Record modality, assistance, and delayed performance; completing an inventory is not mastery.
kind: level
number: 14
phase: explanation-problems
prerequisites:
- fr-level-01
- fr-level-02
- fr-level-03
- fr-level-04
- fr-level-05
- fr-level-06
- fr-level-07
- fr-level-08
- fr-level-09
- fr-level-10
- fr-level-11
- fr-level-12
- fr-level-13
goals: &id001
- Explain a less predictable housing or service problem.
- Clarify references to places, quantities, and earlier information.
- Negotiate a response when the initial explanation is incomplete.
checkpoint:
  task: Resolve a simulated practical problem after new details change what can reasonably be requested.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
