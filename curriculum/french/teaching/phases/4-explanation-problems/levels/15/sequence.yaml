- fr-level-12
- fr-level-13
- fr-level-14
goals: &id001
- Explain responsibilities and a task's current state.
- Describe a future arrangement with suitable certainty.
- Renegotiate a shared task without blaming or overstating commitments.
checkpoint:
  task: Give a task update and redistribute responsibilities after a change in resources or availability.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
