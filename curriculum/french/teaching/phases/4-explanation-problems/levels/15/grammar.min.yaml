- {id: fr-g-future-simple, ch: radical du futur + -ai / -as / -a / -ons / -ez / -ont, ds: 'State a future arrangement, expectation, or commitment'}
- {id: fr-g-open-si-condition, ch: 'si + présent, présent / futur / impératif', ds: Set an open practical condition without future in its si clause}
- {id: fr-g-passive-voice, ch: patient + être au temps voulu + participe + par agent, ds: Make the affected participant the grammatical subject}
- {id: fr-g-causative-faire, ch: faire + infinitif + participants, ds: Arrange or cause an action rather than perform it oneself}
