goals: &id001
- Summarize a general-interest report.
- Distinguish events from attributed claims.
- Compare what two reports emphasize or leave uncertain.
checkpoint:
  task: Explain the common facts and different emphases in two short reports without presenting unconfirmed claims as established facts.
  criteria: *id001
mastery_profile: fr-item-mastery
mastery_target: independent-use
