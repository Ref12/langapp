- {id: fr-tourist-p001, ch: Bonjour, pr: /bɔ̃.ʒuʁ/, ds: Hello}
- {id: fr-tourist-p002, ch: S'il vous plaît, pr: /sil vu plɛ/, ds: Please}
- {id: fr-tourist-p003, ch: Merci, pr: /mɛʁ.si/, ds: Thank you}
- {id: fr-tourist-p004, ch: 'Parlez plus lentement, s''il vous plaît', pr: /paʁ.le ply lɑ̃.tə.mɑ̃ sil vu plɛ/, ds: Please speak more slowly}
- {id: fr-tourist-p005, ch: Pouvez-vous répéter, pr: /pu.ve vu ʁe.pe.te/, ds: Could you repeat that}
- {id: fr-tourist-p006, ch: Je ne comprends pas, pr: /ʒə nə kɔ̃.pʁɑ̃ pa/, ds: I do not understand}
- {id: fr-tourist-p007, ch: Je voudrais de l'eau, pr: /ʒə vu.dʁɛ də l/ /o/, ds: I would like some water}
- {id: fr-tourist-p008, ch: Où est la gare, pr: /u ɛ la/ /ɡaʁ/, ds: Where is the railway station}
- {id: fr-tourist-p009, ch: J'ai besoin d'aide, pr: /ʒe bə.zwɛ̃ d/ /ɛd/, ds: I need help}
- {id: fr-tourist-p010, ch: Pouvez-vous m'aider, pr: /pu.ve vu mɛ.de/, ds: Could you help me}
- {id: fr-tourist-p011, ch: Où sont les toilettes, pr: /u sɔ̃ le/ /twa.lɛt/, ds: Where are the toilets}
- {id: fr-tourist-p012, ch: À gauche, pr: /a/ /ɡoʃ/, ds: To the left}
- {id: fr-tourist-p013, ch: À droite, pr: /a/ /dʁwat/, ds: To the right}
- {id: fr-tourist-p014, ch: Je voudrais un billet, pr: /ʒə vu.dʁɛ œ̃/ /bi.jɛ/, ds: I would like a ticket}
- {id: fr-tourist-p015, ch: À quelle heure, pr: /a kɛl/ /œʁ/, ds: At what time}
- {id: fr-tourist-p016, ch: J'ai une réservation, pr: /ʒe yn/ /ʁe.zɛʁ.va.sjɔ̃/, ds: I have a reservation}
- {id: fr-tourist-p017, ch: Je voudrais une chambre, pr: /ʒə vu.dʁɛ yn/ /ʃɑ̃bʁ/, ds: I would like a room}
- {id: fr-tourist-p018, ch: La clé ne fonctionne pas, pr: /la/ /kle/ /nə fɔ̃k.sjɔn pa/, ds: The key does not work}
- {id: fr-tourist-p019, ch: Où est l'hôtel, pr: /u ɛ l/ /o.tɛl/, ds: Where is the hotel}
- {id: fr-tourist-p020, ch: 'L''addition, s''il vous plaît', pr: /l/ /a.di.sjɔ̃/ /sil vu plɛ/, ds: 'The bill, please'}
- {id: fr-tourist-p021, ch: Je voudrais un café, pr: /ʒə vu.dʁɛ œ̃/ /ka.fe/, ds: I would like a coffee}
- {id: fr-tourist-p022, ch: Sans lait, pr: /sɑ̃/ /lɛ/, ds: Without milk}
- {id: fr-tourist-p023, ch: Est-ce qu'il y a du lait, pr: /ɛs kil i a dy/ /lɛ/, ds: Is there any milk in it}
- {id: fr-tourist-p024, ch: J'ai une allergie, pr: /ʒe yn/ /a.lɛʁ.ʒi/, ds: I have an allergy}
- {id: fr-tourist-p025, ch: J'ai besoin d'un médecin, pr: /ʒe bə.zwɛ̃ dœ̃/ /med.sɛ̃/, ds: I need a doctor}
- {id: fr-tourist-p026, ch: Où est la pharmacie, pr: /u ɛ la/ /faʁ.ma.si/, ds: Where is the pharmacy}
- {id: fr-tourist-p027, ch: Combien ça coûte, pr: /kɔ̃.bjɛ̃ sa kut/, ds: How much does it cost}
- {id: fr-tourist-p028, ch: Est-ce que je peux payer par carte, pr: /ɛs kə ʒə pø pɛ.je paʁ/ /kaʁt/, ds: Can I pay by card}
- {id: fr-tourist-p029, ch: Je voudrais une facture, pr: /ʒə vu.dʁɛ yn/ /fak.tyʁ/, ds: I would like an invoice}
- {id: fr-tourist-p030, ch: Je voudrais payer, pr: /ʒə vu.dʁɛ/ /pɛ.je/, ds: I would like to pay}
- {id: fr-tourist-p031, ch: Mon bagage est perdu, pr: /mɔ̃/ /ba.ɡaʒ/ /ɛ/ /pɛʁ.dy/, ds: My luggage is lost}
- {id: fr-tourist-p032, ch: Je cherche mon bagage, pr: /ʒə ʃɛʁʃ mɔ̃/ /ba.ɡaʒ/, ds: I am looking for my luggage}
- {id: fr-tourist-p033, ch: Pouvez-vous écrire l'adresse, pr: /pu.ve vu.ze.kʁiʁ l/ /a.dʁɛs/, ds: Could you write down the address}
- {id: fr-tourist-p034, ch: Le train est en retard, pr: /lə/ /tʁɛ̃/ /ɛ.tɑ̃/ /ʁə.taʁ/, ds: The train is delayed}
- {id: fr-tourist-p035, ch: C'est une urgence, pr: /sɛ.tyn/ /yʁ.ʒɑ̃s/, ds: This is an emergency}
- {id: fr-tourist-p036, ch: Appelez un médecin, pr: /a.pə.le œ̃/ /med.sɛ̃/, ds: Call a doctor}
- {id: fr-tourist-p037, ch: Je suis perdue, pr: /ʒə sɥi/ /pɛʁ.dy/, ds: I am lost (speaker using feminine agreement)}
- {id: fr-tourist-p038, ch: À quelle heure est le départ, pr: /a kɛl/ /œʁ/ /ɛ lə/ /de.paʁ/, ds: At what time is the departure}
- {id: fr-tourist-p039, ch: Je vais à l'aéroport, pr: /ʒə vɛ a l/ /a.e.ʁɔ.pɔʁ/, ds: I am going to the airport}
- {id: fr-tourist-p040, ch: Au revoir, pr: /o ʁə.vwaʁ/, ds: Goodbye}
