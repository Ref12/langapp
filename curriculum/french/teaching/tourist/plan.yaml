schema_version: 1
id: fr-tourist
title: French for a short visit
language: french
level_basis: An independent original practical tourist route, not a CEFR inventory, a core-level prerequisite,
  an examination syllabus, or a claim of demonstrated ability. The first three units form an ordered quick
  start from empty vocabulary and grammar context; later units extend that same route without relying
  on the core program.
review_policy: All phrase combinations, English labels, teaching choices and contextual pronunciation
  guides are original, AI-assisted and not human-reviewed. A whole phrase guide is never source-verified.
  Its slash-delimited chunks form a SEGMENTED pronunciation guide, not a continuous narrow utterance,
  required pauses, audio evidence or a spoken assessment. Lexical readings retain their source status;
  construction readings are explicitly original. Targets omit terminal punctuation. Use small lessons,
  retrieve earlier items in changed situations, revisit them on later days and record modality, assistance
  and delayed performance under the program mastery policy. Formula recall does not establish independent
  component vocabulary or conjugation mastery. Listening and spoken judgments require actual audio and
  suitable evaluation. Requests here do not promise availability, safety, service or a particular response;
  health examples communicate needs, not clinical advice.
quick_start:
- contact-politeness
- communication-repair
- essential-needs
