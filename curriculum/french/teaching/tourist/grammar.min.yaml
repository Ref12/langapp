- {id: fr-g-travel-polite-request, ch: S'il vous plaît, ds: Make a polite request}
- {id: fr-g-travel-communication-repair, ch: Parlez plus lentement / Je ne comprends pas, ds: Ask for slower speech and signal misunderstanding}
- {id: fr-g-travel-polite-assistance, ch: Pouvez-vous répéter / m'aider / écrire l'adresse, ds: 'Ask someone to repeat, help or write an address'}
- {id: fr-g-travel-would-like, ch: Je voudrais de l'eau / un billet / une chambre / payer, ds: Make a limited polite request}
- {id: fr-g-travel-location-question, ch: Où est la gare / l'hôtel / Où sont les toilettes, ds: Ask where a taught place or the toilets are}
- {id: fr-g-travel-need, ch: J'ai besoin d'aide / d'un médecin, ds: State a need for help or a doctor}
- {id: fr-g-travel-direction, ch: À gauche / À droite, ds: Indicate left or right}
- {id: fr-g-travel-time-question, ch: À quelle heure / À quelle heure est le départ, ds: Ask the time of an understood event or departure}
- {id: fr-g-travel-have, ch: J'ai une réservation / une allergie, ds: State a reservation or an allergy}
- {id: fr-g-travel-not-working, ch: La clé ne fonctionne pas, ds: Report that the key does not work}
- {id: fr-g-travel-milk-check, ch: Sans lait / Est-ce qu'il y a du lait, ds: Request no milk and check whether milk is present}
- {id: fr-g-travel-price-question, ch: Combien ça coûte, ds: Ask the price of the item under discussion}
- {id: fr-g-travel-card-payment, ch: Est-ce que je peux payer par carte, ds: Ask whether you can pay by card}
- {id: fr-g-travel-lost-description, ch: Mon bagage est perdu / Je suis perdu ou perdue, ds: Describe lost luggage or being lost yourself}
- {id: fr-g-travel-search-belonging, ch: Je cherche mon bagage, ds: Say you are looking for your luggage}
- {id: fr-g-travel-delay, ch: Le train est en retard, ds: Report or check that the train is delayed}
- {id: fr-g-travel-urgent-help, ch: C'est une urgence / Appelez un médecin, ds: State urgency and ask someone to call a doctor}
- {id: fr-g-travel-destination, ch: Je vais à l'aéroport, ds: State that you are going to the airport}
