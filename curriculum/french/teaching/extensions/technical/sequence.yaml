- fr-level-11
- fr-level-12
- fr-level-13
- fr-level-14
- fr-level-15
- fr-level-16
- fr-level-17
- fr-level-18
description: Optional terminology for devices, software, systems, and troubleshooting; not evidence of engineering competence.
mastery_profile: fr-item-mastery
mastery_target: understand
