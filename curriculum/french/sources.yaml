- id: lexique-3.83
  title: Lexique 3.83 French lexical and phonological database
  url: https://github.com/chrplr/openlexicon/tree/9009f488f664536940965453c127f43cf18b84a4/datasets-info/Lexique383
  download_url: http://www.lexique.org/databases/Lexique383/Lexique383.tsv
  license: CC-BY-SA-4.0 as stated by the pinned dataset-specific documentation
  usage: >-
    Selected spelling, lemma, part-of-speech, gender, number, inflection and
    phonetic-code records. Frequency helps investigate likely senses, never
    assigns a teaching level or demonstrates mastery. Where suitable lexical
    IPA is absent, a documented strict code-to-IPA conversion is explicitly
    identified. Inflected travel forms require aligned source form/phonology.
  attribution: >-
    Lexique contributors: Boris New, Christophe Pallier, Ronald Peereman,
    Sophie Dufour, Christian Lachaud and other contributors identified by the
    project. Preserve the source/license links and identify selected-field
    projection and phonetic-code conversion as adaptations.
