- id: food-basics
  title: Ask for water and a simple meal
  outcome: Request water, tea, a menu, or soup and check a simple identification; the request does not establish availability, ingredients, or dietary safety.
  vocabulary:
  - {id: ru-or-n00029-s001, ch: вода, pr: вода́, ds: water}
  - {id: ru-or-n03397-s001, ch: меню, pr: меню́, ds: menu}
  - {id: ru-or-n00270-s001, ch: чай, pr: чай, ds: tea}
  - {id: ru-or-n01238-s001, ch: суп, pr: суп, ds: soup}
  - {id: ru-or-v00061-s001, ch: читать, pr: чита́ть, ds: read}
  - {id: ru-or-v00042-s001, ch: писать, pr: писа́ть, ds: write}
  - {id: ru-or-a00015-s001, ch: новый, pr: но́вый, ds: new}
  grammar:
  - {id: ru-g-polite-vy, ch: 'Вы [verb]? Ты [verb]?', ds: Choose polite or familiar personal address}
  - {id: ru-g-present-conjugation, ch: я читаю / ты читаешь / они читают, ds: Match a present-tense verb to its subject}
  - {id: ru-g-gender-agreement, ch: 'новый [masculine] / новая [feminine] / новое [neuter]', ds: Match an adjective to a noun's gender}
  - {id: ru-g-accusative-object, ch: 'читать / пить + [accusative object]', ds: Mark a simple direct object in the accusative}
  - {id: ru-g-permission-request, ch: 'Можно [infinitive / requested item]?', ds: Ask permission or politely request an item}
  - {id: ru-g-basic-questions, ch: 'Кто это? Что это? Где [noun]? Когда [event]?', ds: 'Ask identity, location, or time without an auxiliary'}
  review_vocabulary:
  - {id: ru-or-o00006-s001, ch: я, pr: я, ds: I}
  - {id: ru-or-v00021-s001, ch: понимать, pr: понима́ть, ds: understand}
