schema_version: 3
id: ru-tourist-quick-start
title: Russian for a short visit - quick start
language: russian
level_basis: Independent travel route with all vocabulary, fixed forms and construction prerequisites introduced within the route; no completed core level required.
review_policy: Use a few phrases and senses per lesson; retrieve earlier and fragile items on later days. Source-derived lexical stress is a reading aid, not phonetic transcription or audio evidence. Original travel phrases require human review and provide no legal, medical, payment, accessibility or safety guarantees.
units:
- id: polite-repair
  title: Make contact and ask again
  outcome: Greet politely, signal that a message was not understood, and request repetition, slower speech, or writing; pointing and reading are valid supported practice, not evidence of spontaneous speech.
  vocabulary:
  - {id: ru-or-o00006-s001, ch: я, pr: я, ds: I}
  - {id: ru-or-v00021-s001, ch: понимать, pr: понима́ть, ds: understand}
  grammar:
  - {id: ru-g-polite-repair, ch: 'Извините. Повторите, пожалуйста.', ds: Greet politely and ask for communication repair}
  - {id: ru-g-present-identity, ch: 'Я [name]. Это [noun].', ds: State identity without a present-tense copula}
  - {id: ru-g-basic-negation, ch: 'Я не [verb]. Это не [noun].', ds: Negate a statement or correct identification}
  review_vocabulary: []
  review_grammar: []
  phrases:
  - {id: ru-tourist-p001, ch: Здравствуйте., pr: Здра́вствуйте, ds: Hello. (polite)}
  - {id: ru-tourist-p002, ch: 'Извините, я не понимаю.', pr: Извини́те я не понима́ю, ds: 'Sorry, I do not understand.'}
  - {id: ru-tourist-p003, ch: 'Повторите, пожалуйста.', pr: Повтори́те пожа́луйста, ds: Please repeat that.}
  - {id: ru-tourist-p004, ch: 'Говорите медленнее, пожалуйста.', pr: Говори́те ме́дленнее пожа́луйста, ds: Please speak more slowly.}
  - {id: ru-tourist-p005, ch: 'Напишите, пожалуйста.', pr: Напиши́те пожа́луйста, ds: Please write it down.}
  phrase_components:
    ru-tourist-p001:
      items: []
      grammar:
      - ru-g-polite-repair
      realizations:
      - ch: Здравствуйте
        pr: Здра́вствуйте
        items: []
