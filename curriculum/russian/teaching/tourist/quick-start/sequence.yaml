- id: paying
  title: Ask about a price, quantity, and payment
  outcome: Ask a price, request two tickets or a receipt, and ask about card payment; these questions make no claim about local payment availability, currency, or transaction rules.
  vocabulary:
  - {id: ru-or-v00363-s001, ch: стоить, pr: сто́ить, ds: cost}
  - {id: ru-or-n00497-s001, ch: билет, pr: биле́т, ds: ticket}
  - {id: ru-or-v00149-s001, ch: принимать, pr: принима́ть, ds: accept}
  - {id: ru-or-n00320-s002, ch: карта, pr: ка́рта, ds: card}
  - {id: ru-or-n05855-s001, ch: чек, pr: чек, ds: receipt}
  grammar:
  - {id: ru-g-small-quantities, ch: 'один / одна / одно; два / две; три / четыре + [noun]', ds: Request small quantities with the correct noun form}
  - {id: ru-g-possession-existence, ch: 'У [genitive possessor] есть [noun].', ds: State possession or availability with у ... есть}
  - {id: ru-g-absence-genitive, ch: 'У [genitive possessor] нет [genitive noun].', ds: Express absence with нет and the genitive}
  - {id: ru-g-plural-agreement, ch: 'эти / мои / новые [plural noun] + [plural verb]', ds: 'Coordinate plural nouns, modifiers, and verbs'}
  - {id: ru-g-larger-quantities, ch: 'пять / много / мало / сколько + [genitive noun]', ds: Count larger or unspecified quantities}
  review_vocabulary:
