- {id: ru-g-polite-repair, ch: 'Извините. Повторите, пожалуйста.', ds: Greet politely and ask for communication repair}
- {id: ru-g-present-identity, ch: 'Я [name]. Это [noun].', ds: State identity without a present-tense copula}
- {id: ru-g-basic-negation, ch: 'Я не [verb]. Это не [noun].', ds: Negate a statement or correct identification}
- {id: ru-g-polite-vy, ch: 'Вы [verb]? Ты [verb]?', ds: Choose polite or familiar personal address}
- {id: ru-g-present-conjugation, ch: я читаю / ты читаешь / они читают, ds: Match a present-tense verb to its subject}
- {id: ru-g-gender-agreement, ch: 'новый [masculine] / новая [feminine] / новое [neuter]', ds: Match an adjective to a noun's gender}
- {id: ru-g-accusative-object, ch: 'читать / пить + [accusative object]', ds: Mark a simple direct object in the accusative}
- {id: ru-g-permission-request, ch: 'Можно [infinitive / requested item]?', ds: Ask permission or politely request an item}
- {id: ru-g-basic-questions, ch: 'Кто это? Что это? Где [noun]? Когда [event]?', ds: 'Ask identity, location, or time without an auxiliary'}
- {id: ru-g-location-prepositional, ch: 'в / на [prepositional noun]', ds: Locate something with в or на plus prepositional}
- {id: ru-g-place-direction-origin, ch: 'где / куда / откуда; в / на + [accusative destination]', ds: 'Distinguish location, destination, and origin'}
- {id: ru-g-polite-help-imperative, ch: 'Помогите / Покажите / Скажите, пожалуйста.', ds: Request a helpful action with a polite imperative}
- {id: ru-g-small-quantities, ch: 'один / одна / одно; два / две; три / четыре + [noun]', ds: Request small quantities with the correct noun form}
- {id: ru-g-possession-existence, ch: 'У [genitive possessor] есть [noun].', ds: State possession or availability with у ... есть}
- {id: ru-g-absence-genitive, ch: 'У [genitive possessor] нет [genitive noun].', ds: Express absence with нет and the genitive}
- {id: ru-g-plural-agreement, ch: 'эти / мои / новые [plural noun] + [plural verb]', ds: 'Coordinate plural nouns, modifiers, and verbs'}
- {id: ru-g-larger-quantities, ch: 'пять / много / мало / сколько + [genitive noun]', ds: Count larger or unspecified quantities}
- {id: ru-g-dative-need, ch: 'мне / вам нужно + [infinitive]', ds: Say who needs to perform an action}
- {id: ru-g-reflexive-routines, ch: '[verb]-ся / -сь', ds: Use reflexive verbs for familiar routines}
- {id: ru-g-current-motion, ch: 'иду / идёт; еду / едет + [destination]', ds: Distinguish current travel on foot and by vehicle}
- {id: ru-g-needed-noun, ch: 'мне нужен / нужна / нужно / нужны [noun]', ds: Agree a needed item while distinguishing нужно to act}
- {id: ru-g-without-genitive, ch: 'без + [genitive noun]', ds: Request or describe something without an ingredient}
- {id: ru-g-health-experiencer, ch: 'У меня болит / болят [body part]. У меня аллергия на [accusative].', ds: Describe pain or state an allergy without diagnosing}
- {id: ru-g-past-agreement, ch: работал / работала / работало / работали, ds: Match a past-tense verb to gender or number}
- {id: ru-g-imperfective-future, ch: 'буду / будешь / будет / будем / будете / будут + [imperfective infinitive]', ds: Describe a future activity or repeated action}
- {id: ru-g-perfective-future, ch: '[perfective personal form] завтра', ds: Present a future event as a bounded outcome}
- {id: ru-g-narrative-aspect, ch: '[imperfective background], потом [perfective outcome]', ds: Separate narrative background from completed events}
- {id: ru-g-imperative-aspect, ch: 'открывайте / откройте [object]', ds: Choose an imperative for a routine or one result}
- {id: ru-g-impersonal-time, ch: 'мне было / будет [state]; не было / не будет [genitive]', ds: Place an impersonal state or absence in time}
- {id: ru-g-dative-recipient, ch: 'дать / показать [accusative thing] [dative recipient]', ds: Mark the recipient of giving or showing}
- {id: ru-g-origins-and-people, ch: 'из / с / от + [genitive]; к + [dative]', ds: Name an origin or movement toward a person}
- {id: ru-g-relative-kotory, ch: '[noun], который / которую / которому ...', ds: Decline a relative pronoun for its clause role}
- {id: ru-g-full-participial-description, ch: 'книга, написанная [instrumental agent]', ds: Read a participial phrase as a reduced description}
- {id: ru-g-static-spatial-cases, ch: 'под / над / перед / за + [instrumental]; около + [genitive]', ds: Locate things using governed spatial cases}
- {id: ru-g-instrumental-means, ch: '[verb] + [instrumental means]; с + [instrumental companion]', ds: Distinguish a means from an accompanying person}
- {id: ru-g-reflexive-passive, ch: '[subject] обсуждается / проверяется [agent instrumental]', ds: Interpret a process-focused reflexive passive}
- {id: ru-g-short-passive-result, ch: '[subject] открыт / открыта / открыто / открыты', ds: Describe a result with a short passive participle}
