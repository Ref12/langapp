- {id: ru-tourist-p001, ch: Здравствуйте., pr: Здра́вствуйте, ds: Hello. (polite)}
- {id: ru-tourist-p002, ch: 'Извините, я не понимаю.', pr: Извини́те я не понима́ю, ds: 'Sorry, I do not understand.'}
- {id: ru-tourist-p003, ch: 'Повторите, пожалуйста.', pr: Повтори́те пожа́луйста, ds: Please repeat that.}
- {id: ru-tourist-p004, ch: 'Говорите медленнее, пожалуйста.', pr: Говори́те ме́дленнее пожа́луйста, ds: Please speak more slowly.}
- {id: ru-tourist-p005, ch: 'Напишите, пожалуйста.', pr: Напиши́те пожа́луйста, ds: Please write it down.}
- {id: ru-tourist-p006, ch: 'Можно воду, пожалуйста?', pr: Мо́жно во́ду пожа́луйста, ds: 'Could I have some water, please?'}
- {id: ru-tourist-p007, ch: 'Можно меню, пожалуйста?', pr: Мо́жно меню́ пожа́луйста, ds: 'Could I have a menu, please?'}
- {id: ru-tourist-p008, ch: 'Можно чай, пожалуйста?', pr: Мо́жно ча́й пожа́луйста, ds: 'Could I have some tea, please?'}
- {id: ru-tourist-p009, ch: 'Можно суп, пожалуйста?', pr: Мо́жно су́п пожа́луйста, ds: 'Could I have some soup, please?'}
- {id: ru-tourist-p010, ch: 'Это вода?', pr: Э́то вода́, ds: 'Is this water?'}
- {id: ru-tourist-p011, ch: 'Где туалет?', pr: Где туале́т, ds: 'Where is the toilet?'}
- {id: ru-tourist-p012, ch: 'Где гостиница?', pr: Где гости́ница, ds: 'Where is the hotel?'}
- {id: ru-tourist-p013, ch: 'Как пройти на вокзал?', pr: Как пройти́ на вокза́л, ds: 'How do I walk to the station?'}
- {id: ru-tourist-p014, ch: 'Покажите на карте, пожалуйста.', pr: Покажи́те на ка́рте пожа́луйста, ds: Please show me on the map.}
- {id: ru-tourist-p015, ch: 'Это далеко?', pr: Э́то далеко́, ds: 'Is it far away?'}
- {id: ru-tourist-p016, ch: 'Сколько стоит билет?', pr: Ско́лько сто́ит биле́т, ds: 'How much does a ticket cost?'}
- {id: ru-tourist-p017, ch: 'Сколько это стоит?', pr: Ско́лько э́то сто́ит, ds: 'How much does this cost?'}
- {id: ru-tourist-p018, ch: 'Вы принимаете карты?', pr: Вы принима́ете ка́рты, ds: 'Do you accept cards?'}
- {id: ru-tourist-p019, ch: 'Можно чек, пожалуйста?', pr: Мо́жно че́к пожа́луйста, ds: 'Could I have a receipt, please?'}
- {id: ru-tourist-p020, ch: 'Два билета, пожалуйста.', pr: Два биле́та пожа́луйста, ds: 'Two tickets, please.'}
- {id: ru-tourist-p021, ch: 'Помогите, пожалуйста.', pr: Помоги́те пожа́луйста, ds: Please help me.}
- {id: ru-tourist-p022, ch: Мне нужно позвонить., pr: Мне ну́жно позвони́ть, ds: I need to make a phone call.}
- {id: ru-tourist-p023, ch: 'Где врач?', pr: Где вра́ч, ds: 'Where is a doctor?'}
- {id: ru-tourist-p024, ch: Я не понимаю адрес., pr: Я не понима́ю а́дрес, ds: I do not understand the address.}
- {id: ru-tourist-p025, ch: 'Можно здесь подождать?', pr: Мо́жно здесь подожда́ть, ds: 'May I wait here?'}
- {id: ru-tourist-p026, ch: 'Где остановка?', pr: Где остано́вка, ds: 'Where is the stop?'}
- {id: ru-tourist-p027, ch: 'Это автобус?', pr: Э́то авто́бус, ds: 'Is this a bus?'}
- {id: ru-tourist-p028, ch: 'Когда поезд отправляется?', pr: Когда́ по́езд отправля́ется, ds: 'When does the train leave?'}
- {id: ru-tourist-p029, ch: Я еду на вокзал., pr: Я е́ду на вокза́л, ds: I am going to the station by vehicle.}
- {id: ru-tourist-p030, ch: Мне нужно такси., pr: Мне ну́жно такси́, ds: I need a taxi.}
- {id: ru-tourist-p031, ch: 'У вас есть номер?', pr: У вас есть но́мер, ds: 'Do you have a room available?'}
- {id: ru-tourist-p032, ch: У меня есть бронь., pr: У меня́ есть бро́нь, ds: I have a reservation.}
- {id: ru-tourist-p033, ch: 'Можно ключ, пожалуйста?', pr: Мо́жно клю́ч пожа́луйста, ds: 'Could I have the key, please?'}
- {id: ru-tourist-p034, ch: В номере нет воды., pr: В но́мере нет воды́, ds: There is no water in the room.}
- {id: ru-tourist-p035, ch: 'Когда завтрак?', pr: Когда́ за́втрак, ds: 'When is breakfast?'}
- {id: ru-tourist-p036, ch: 'Чай без сахара, пожалуйста.', pr: Ча́й без са́хара пожа́луйста, ds: 'Tea without sugar, please.'}
- {id: ru-tourist-p037, ch: 'Здесь есть молоко?', pr: Здесь есть молоко́, ds: 'Is there milk in this?'}
- {id: ru-tourist-p038, ch: 'Здесь есть орехи?', pr: Здесь есть оре́хи, ds: 'Are there nuts in this?'}
- {id: ru-tourist-p039, ch: У меня аллергия на молоко., pr: У меня́ аллерги́я на молоко́, ds: I am allergic to milk.}
- {id: ru-tourist-p040, ch: 'Проверьте, пожалуйста.', pr: Прове́рьте пожа́луйста, ds: Please check.}
- {id: ru-tourist-p041, ch: 'Где магазин?', pr: Где магази́н, ds: 'Where is the shop?'}
- {id: ru-tourist-p042, ch: 'Можно посмотреть?', pr: Мо́жно посмотре́ть, ds: 'May I have a look?'}
- {id: ru-tourist-p043, ch: 'Можно пакет, пожалуйста?', pr: Мо́жно паке́т пожа́луйста, ds: 'Could I have a bag, please?'}
- {id: ru-tourist-p044, ch: 'Можно это починить?', pr: Мо́жно э́то почини́ть, ds: 'Can this be repaired?'}
- {id: ru-tourist-p045, ch: 'Можно заменить билет?', pr: Мо́жно замени́ть биле́т, ds: 'Can the ticket be replaced?'}
- {id: ru-tourist-p046, ch: 'Где аптека?', pr: Где апте́ка, ds: 'Where is the pharmacy?'}
- {id: ru-tourist-p047, ch: Мне плохо., pr: Мне пло́хо, ds: I feel unwell.}
- {id: ru-tourist-p048, ch: У меня болит голова., pr: У меня́ боли́т голова́, ds: I have a headache.}
- {id: ru-tourist-p049, ch: Мне нужно к врачу., pr: Мне ну́жно к врачу́, ds: I need to see a doctor.}
- {id: ru-tourist-p050, ch: 'Напишите это, пожалуйста.', pr: Напиши́те э́то пожа́луйста, ds: Please write this down.}
- {id: ru-tourist-p051, ch: 'Который час?', pr: Кото́рый ча́с, ds: 'What time is it?'}
- {id: ru-tourist-p052, ch: 'Когда встреча?', pr: Когда́ встре́ча, ds: 'When is the meeting?'}
- {id: ru-tourist-p053, ch: 'Можно завтра?', pr: Мо́жно за́втра, ds: 'Would tomorrow be possible?'}
- {id: ru-tourist-p054, ch: 'Подождите, пожалуйста.', pr: Подожди́те пожа́луйста, ds: Please wait a moment.}
- {id: ru-tourist-p055, ch: 'Магазин открыт?', pr: Магази́н откры́т, ds: 'Is the shop open?'}
- {id: ru-tourist-p056, ch: Я турист., pr: Я тури́ст, ds: I am a tourist. (male speaker)}
- {id: ru-tourist-p057, ch: 'Как вас зовут?', pr: Как вас зову́т, ds: 'What is your name? (polite)'}
- {id: ru-tourist-p058, ch: 'Вы говорите по-английски?', pr: Вы говори́те по-англи́йски, ds: 'Do you speak English? (polite)'}
- {id: ru-tourist-p059, ch: Спасибо за помощь., pr: Спаси́бо за по́мощь, ds: Thank you for your help.}
- {id: ru-tourist-p060, ch: До свидания., pr: До свида́ния, ds: Goodbye.}
