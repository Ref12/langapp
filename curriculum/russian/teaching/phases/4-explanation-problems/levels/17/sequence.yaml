schema_version: 3
id: ru-level-17
title: Systems, movement, and consequences
language: russian
level_basis: Independently curated Russian vocabulary and constructions ordered by communicative purpose and prerequisites, never by source row order, an arbitrary frequency proxy, or default first senses. Not a CEFR or TORFL syllabus, equivalence, or examination-readiness claim.
review_policy: Modules span several lessons of about 5-8 new senses, fewer for demanding inflection or confusable forms. Retrieve relevant earlier and fragile items on later days and record modality and assistance. Headword targets are planning guides, not quotas; inflections and additional senses do not inflate breadth. Inventory coverage is not demonstrated mastery.
kind: level
number: 17
phase: explanation-problems
prerequisites:
- ru-level-01
- ru-level-02
- ru-level-03
- ru-level-04
- ru-level-05
- ru-level-06
- ru-level-07
- ru-level-08
- ru-level-09
- ru-level-10
- ru-level-11
- ru-level-12
- ru-level-13
- ru-level-14
- ru-level-15
- ru-level-16
goals: &id001
- Explain entry, departure, and return with meaning-sensitive motion prefixes.
- Describe a system's result without confusing a state with a process.
- Present a general-audience technical or environmental explanation with explicit limitations.
checkpoint:
  task: Explain a new technical or environmental issue and answer a limitation question without claiming specialist expertise.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
