- {id: ru-g-real-condition, ch: 'если [condition], то [consequence]', ds: Propose a consequence under an open condition}
- {id: ru-g-prior-completed-gerund, ch: 'Прочитав [object], [same actor''s main action]', ds: Link a prior completed action to a following action}
- {id: ru-g-hypothetical-by, ch: 'если бы [past-form condition], [past-form consequence] бы', ds: Express a hypothetical or unreal condition}
- {id: ru-g-tentative-polite-request, ch: 'Я хотел / хотела бы ...; Не могли бы вы ...?', ds: Soften a preference or request without implying inability}
