goals: &id001
- Interpret a familiar figurative expression without translating each word literally.
- Recover omitted material from a conversational context.
- Distinguish an expressive construction from a neutral paraphrase.
checkpoint:
  task: Explain an original figurative exchange, supply a literal paraphrase, and identify a context in which the expression would not fit.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
