goals: &id001
- Clarify scope, degree, and the boundaries of a comparison.
- Distinguish near-equivalent connectors by the relation they express.
- Revise dense phrasing into precise Russian without changing its claim.
checkpoint:
  task: Revise an imprecise explanation and defend the changes in scope, degree, and logical connection.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
