goals: &id001
- Recast a request or disagreement for a formal and a familiar audience.
- Recognize when diminutives or familiar address can sound inappropriate.
- Preserve meaning while changing politeness and emotional intensity.
checkpoint:
  task: Rework a request and a disagreement for two relationships and explain the likely effect of each wording choice.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
