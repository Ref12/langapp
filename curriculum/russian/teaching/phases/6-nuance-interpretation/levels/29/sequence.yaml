goals: &id001
- Support an interpretation with specific textual details.
- Recognize rhetorical questions and quoted distance without assuming sincerity.
- Compare a stylistic choice with a credible alternative reading.
checkpoint:
  task: Defend an interpretation of an original passage, identify the evidence for it, and address a plausible competing interpretation.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
