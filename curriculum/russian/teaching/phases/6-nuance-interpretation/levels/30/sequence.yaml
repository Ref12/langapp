goals: &id001
- Develop a sustained project for a declared audience using selected sources.
- Keep causal, conditional, and concessive relations precise across an extended argument.
- Revise meaning and register after substantive critique while reporting unresolved uncertainty.
checkpoint:
  task: Complete a sustained project, discuss sources and uncertainty, and submit a revised response explaining how critique changed the result.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
