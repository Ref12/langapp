goals: &id001
- Explain how word order changes focus without replacing case marking.
- Interpret particles and indirect wording in context.
- Distinguish the speaker's commitment from information attributed to someone else.
checkpoint:
  task: Compare plausible interpretations of an indirect message and justify a contextual reading while acknowledging uncertainty.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
