- {id: ru-g-seeming-comparison, ch: 'будто / как будто [clause]', ds: Interpret seeming or resemblance without asserting reality}
- {id: ru-g-information-focus, ch: Анна прочитала письмо. Письмо прочитала Анна., ds: Interpret focus shifts without discarding case marking}
- {id: ru-g-shared-ground-particles, ch: 'ведь / же [contextual proposition]', ds: Interpret an appeal to shared knowledge or contrast}
- {id: ru-g-focus-particle-scope, ch: 'только [focused element]; даже [focused element]', ds: Identify what only or even places in focus}
- {id: ru-g-request-register, ch: 'Давай ... / Пожалуйста, ... / Прошу вас ...', ds: Recast the same request for a different relationship}
- {id: ru-g-softened-disagreement, ch: 'не совсем ...; боюсь, что ...; мне кажется, ...', ds: Soften disagreement while retaining its actual content}
- {id: ru-g-diminutive-register, ch: минута / минутка; вопрос / вопросик, ds: Interpret a diminutive's contextual social effect}
- {id: ru-g-impersonal-preference, ch: 'хотелось бы / представляется, что ...', ds: Recognize distancing that leaves the viewpoint implicit}
- {id: ru-g-conversational-ellipsis, ch: 'Я за. А вы? Мне тоже.', ds: Recover omitted material in a short contextual reply}
- {id: ru-g-preoccupied-ne-do, ch: '[dative person] не до [genitive activity]', ds: Say circumstances leave no attention for an activity}
- {id: ru-g-hands-time-idiom, ch: 'у [person] руки не доходят до [genitive task]', ds: Say someone has not got around to a task}
- {id: ru-g-despite-expectation-particle, ch: 'всё-таки [clause]', ds: Mark persistence or an outcome contrary to expectation}
- {id: ru-g-explicit-clarification, ch: 'то есть / а именно [clarification]', ds: Restate a meaning or specify its members precisely}
- {id: ru-g-until-before, ch: 'пока не [endpoint]; прежде чем [action]', ds: Distinguish an until endpoint from a before relation}
- {id: ru-g-bounds-degree, ch: 'по крайней мере / не менее / не более [quantity]', ds: State a lower or upper bound rather than an exact amount}
- {id: ru-g-instead-of-action, ch: 'вместо того чтобы [infinitive / clause]', ds: Contrast a chosen action with a displaced alternative}
- {id: ru-g-labelled-distance, ch: 'так называемый [agreeing noun phrase]', ds: Interpret a reported label and possible skeptical distance}
- {id: ru-g-figurative-comparison, ch: 'словно [image]; как [comparison]', ds: Interpret an image without converting it into a factual claim}
- {id: ru-g-rhetorical-questions, ch: 'Разве ...? Неужели ...?', ds: Interpret question particles without assuming neutrality}
- {id: ru-g-narrative-present, ch: 'Вчера [present-tense narrative events]', ds: Interpret a narrative present within a past setting}
- {id: ru-g-explicit-self-repair, ch: 'точнее / вернее / иными словами [reformulation]', ds: Revise a claim openly instead of silently changing its scope}
- {id: ru-g-otherwise-consequence, ch: 'если не ..., то ...; иначе ...', ds: State what follows if a requirement is not met}
- {id: ru-g-even-if, ch: 'даже если [condition], [maintained claim]', ds: Keep a claim conditional while conceding a possibility}
- {id: ru-g-framed-claim, ch: 'речь идёт о [prepositional]; это не означает, что ...', ds: Define an argument's scope and block an unwarranted inference}
