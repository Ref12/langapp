- {id: ru-g-comparative-frames, ch: 'больше / лучше / дешевле, чем ...; [comparative] + [genitive]', ds: Compare alternatives with чем or a genitive standard}
- {id: ru-g-superlative-choice, ch: 'самый [agreeing adjective]; лучше всего', ds: Identify an extreme within a stated comparison set}
- {id: ru-g-short-adjective-predicate, ch: готов / готова / готовы; прав / права / правы, ds: Interpret a short adjective as an agreeing predicate}
- {id: ru-g-advice-preference, ch: 'лучше [infinitive]; предпочитаю [object / infinitive]', ds: Recommend an option without making it an obligation}
- {id: ru-g-cause-consequence, ch: 'потому что [reason]; поэтому [consequence]', ds: Distinguish a reason from the consequence it explains}
