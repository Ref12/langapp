- {id: ru-g-animate-accusative, ch: 'вижу [animate accusative] / вижу [inanimate accusative]', ds: Apply animacy to direct-object forms}
- {id: ru-g-without-genitive, ch: 'без + [genitive noun]', ds: Request or describe something without an ingredient}
- {id: ru-g-health-experiencer, ch: 'У меня болит / болят [body part]. У меня аллергия на [accusative].', ds: Describe pain or state an allergy without diagnosing}
- {id: ru-g-dative-recipient, ch: 'дать / показать [accusative thing] [dative recipient]', ds: Mark the recipient of giving or showing}
- {id: ru-g-instrumental-means, ch: '[verb] + [instrumental means]; с + [instrumental companion]', ds: Distinguish a means from an accompanying person}
- {id: ru-g-pronouns-after-prepositions, ch: у него / у неё / у них; с ним / с ней / с ними, ds: Use governed personal-pronoun forms after prepositions}
