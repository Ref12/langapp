schema_version: 3
id: ru-level-06
title: Buying, eating, and everyday care
language: russian
level_basis: Independently curated Russian vocabulary and constructions ordered by communicative purpose and prerequisites, never by source row order, an arbitrary frequency proxy, or default first senses. Not a CEFR or TORFL syllabus, equivalence, or examination-readiness claim.
review_policy: Modules span several lessons of about 5-8 new senses, fewer for demanding inflection or confusable forms. Retrieve relevant earlier and fragile items on later days and record modality and assistance. Headword targets are planning guides, not quotas; inflections and additional senses do not inflate breadth. Inventory coverage is not demonstrated mastery.
kind: level
number: 6
phase: everyday-life
prerequisites:
- ru-level-01
- ru-level-02
- ru-level-03
- ru-level-04
- ru-level-05
goals: &id001
- Clarify a purchase or ingredient need with the appropriate governed case.
- Distinguish animate and inanimate direct objects.
- Explain an ordinary care need while checking the other person's response.
checkpoint:
  task: Explain a changed purchase, ingredient, or care need and clarify a proposed response without making a medical or dietary-safety claim.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
units:
- id: level-06-communication-01
  title: Communication and repair - 1
  outcome: Convey a relevant message and clarify what another person means.
  vocabulary:
  - {id: ru-or-o00196-s003, ch: пожалуйста, pr: пожа́луйста, ds: here you go}
  grammar: []
  review_vocabulary:
  - {id: ru-or-o00044-s001, ch: где, pr: где, ds: where}
  - {id: ru-or-o00079-s001, ch: хорошо, pr: хорошо́, ds: well}
  - {id: ru-or-o00163-s001, ch: плохо, pr: пло́хо, ds: it is bad}
  - {id: ru-or-o00157-s001, ch: медленно, pr: ме́дленно, ds: slowly}
  - {id: ru-or-n01923-s001, ch: переводчик, pr: перево́дчик, ds: translator or interpreter (person)}
  - {id: ru-or-o00061-s001, ch: можно, pr: мо́жно, ds: it is permitted}
  - {id: ru-or-o00111-s001, ch: нельзя, pr: нельзя́, ds: not allowed or not possible}
  - {id: ru-or-v00295-s001, ch: подождать, pr: подожда́ть, ds: wait a while}
  review_grammar:
  - {id: ru-g-polite-repair, ch: 'Извините. Повторите, пожалуйста.', ds: Greet politely and ask for communication repair}
  - {id: ru-g-basic-questions, ch: 'Кто это? Что это? Где [noun]? Когда [event]?', ds: 'Ask identity, location, or time without an auxiliary'}
  - {id: ru-g-basic-negation, ch: 'Я не [verb]. Это не [noun].', ds: Negate a statement or correct identification}
