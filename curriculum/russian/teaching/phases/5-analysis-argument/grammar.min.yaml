- {id: ru-g-epistemic-qualification, ch: 'возможно / вероятно / по-видимому, [claim]', ds: Qualify commitment to a claim}
- {id: ru-g-inference-from-evidence, ch: 'судя по [dative evidence], [inference]', ds: Mark the evidence used to make an inference}
- {id: ru-g-alleged-report, ch: '[source] якобы [claim]', ds: Report an allegation with explicit distance}
- {id: ru-g-only-if, ch: 'только если [necessary condition]', ds: State a necessary condition rather than a guarantee}
- {id: ru-g-purpose-cause-prepositions, ch: 'для / ради [genitive purpose]; из-за / вследствие [genitive cause]', ds: Separate a purpose from an attributed cause}
- {id: ru-g-action-nominalization, ch: 'обсуждение [genitive object] [instrumental agent]', ds: Recover participants in a nominalized action}
- {id: ru-g-formal-dative-prepositions, ch: 'согласно / вопреки / благодаря + [dative]', ds: 'Interpret formal accordance, opposition, and enabling cause'}
- {id: ru-g-nested-genitives, ch: 'результаты [genitive modifier] [genitive modifier]', ds: Resolve a dense genitive chain without losing attachment}
- {id: ru-g-method-nominal-frames, ch: 'путём / посредством + [genitive method]', ds: Interpret a formally stated method or means}
- {id: ru-g-correlative-comparison, ch: 'чем [comparative], тем [comparative]', ds: Express a covarying comparison without proving causation}
- {id: ru-g-impersonal-evidence-clause, ch: 'известно / установлено / показано, что [claim]', ds: Examine a claim packaged as established information}
- {id: ru-g-participial-process-result, ch: измеряемый / измеренный; получаемый / полученный, ds: Distinguish a participial process from a completed result}
- {id: ru-g-qualified-generalization, ch: не все / далеко не все / не всегда / в некоторых случаях, ds: Restrict a generalization without reversing it}
- {id: ru-g-viewpoint-frame, ch: 'с точки зрения [genitive perspective]; для [genitive experiencer]', ds: Attribute an evaluation to a particular perspective}
- {id: ru-g-concession, ch: 'хотя [clause]; несмотря на [accusative noun]', ds: Acknowledge a fact while resisting its expected implication}
- {id: ru-g-concessive-ni, ch: как бы ни / кто бы ни / где бы ни ..., ds: Generalize across alternatives in a concessive clause}
- {id: ru-g-phase-verb-aspect, ch: 'начать / продолжать / перестать + [imperfective infinitive]', ds: 'Place an activity inside a beginning, continuation, or end'}
- {id: ru-g-sufficient-necessary, ch: 'достаточно / недостаточно [genitive or infinitive], чтобы ...', ds: Distinguish enough for an outcome from merely required}
- {id: ru-g-not-so-much, ch: 'не столько [A], сколько [B]', ds: Rebalance an explanation rather than deny its first part}
- {id: ru-g-exception-inclusion, ch: 'кроме [genitive]; за исключением [genitive]', ds: Clarify an exception versus an additional member}
- {id: ru-g-correlative-reference, ch: 'тот, кто ...; то, что ...; о том, что ...', ds: Track reference across a correlative clause boundary}
- {id: ru-g-contrast-sources, ch: '[source] утверждает, что ...; тогда как [other source] ...', ds: Keep conflicting sources and their claims distinct}
- {id: ru-g-balanced-synthesis, ch: с одной стороны ... с другой стороны ..., ds: Organize two considerations without forcing equal weight}
- {id: ru-g-formal-conclusion, ch: таким образом / следовательно ...; однако ..., ds: Mark a conclusion and preserve a relevant limitation}
