- ru-level-23
goals: &id001
- Combine partially conflicting sources with precise attribution.
- Use formal linking and nominalization without hiding the actor unnecessarily.
- Present a structured conclusion that preserves uncertainty.
checkpoint:
  task: Produce a structured explanation or proposal from two partially conflicting sources and explain how the conflict affects the conclusion.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
