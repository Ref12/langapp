goals: &id001
- Explain a public or economic process with precise governed relations.
- Unpack a formal noun phrase into an action with identifiable participants.
- Contrast a stated purpose with a possible consequence.
checkpoint:
  task: Explain an institutional or economic change and compare plausible effects without claiming legal or financial expertise.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
