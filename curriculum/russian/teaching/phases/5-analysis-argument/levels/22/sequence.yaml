goals: &id001
- Represent competing considerations using concession and contrast.
- Restrict a generalization to the people or circumstances described.
- Attribute a perspective rather than presenting it as universal.
checkpoint:
  task: Discuss an unfamiliar dilemma while representing two perspectives fairly and limiting claims drawn from individual experience.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
