- ru-level-18
- ru-level-19
- ru-level-20
- ru-level-21
- ru-level-22
goals: &id001
- Build an argument with an explicit scope and necessary conditions.
- Distinguish an exception from a refutation of the entire claim.
- Revise an aspect-sensitive claim about frequency or completion after counterevidence.
checkpoint:
  task: Defend a qualified recommendation and narrow or revise it when a new counterexample is introduced.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
