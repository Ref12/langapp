goals: &id001
- Distinguish a method, an observed result, and an explanatory claim.
- Interpret formal participial relations and measured comparisons.
- Describe a dependency without turning correlation into causation.
checkpoint:
  task: Summarize a general-audience scientific account and identify a limitation or unanswered question in the evidence.
  criteria: *id001
mastery_profile: ru-item-mastery
mastery_target: independent-use
