schema_version: 1
id: ru-practical
title: Practical Russian
language: russian
level_basis: Independently curated Russian vocabulary and constructions ordered by communicative purpose and prerequisites, never by source row order, an arbitrary frequency proxy, or default first senses. Not a CEFR or TORFL syllabus, equivalence, or examination-readiness claim.
module_size: 25
review_policy: Modules span several lessons of about 5-8 new senses, fewer for demanding inflection or confusable forms. Retrieve relevant earlier and fragile items on later days and record modality and assistance. Headword targets are planning guides, not quotas; inflections and additional senses do not inflate breadth. Inventory coverage is not demonstrated mastery.
phases:
- {id: first-exchanges, title: First exchanges, levels: [1, 2, 3, 4], target_new_headwords: 200}
- {id: everyday-life, title: Everyday life, levels: [5, 6, 7, 8], target_new_headwords: 500}
- {id: stories-conversations, title: Stories and conversations, levels: [9, 10, 11, 12, 13], target_new_headwords: 800}
- {id: explanation-problems, title: Explanation and problem-solving, levels: [14, 15, 16, 17, 18], target_new_headwords: 1100}
- {id: analysis-argument, title: Analysis and argument, levels: [19, 20, 21, 22, 23, 24], target_new_headwords: 1400}
- {id: nuance-interpretation, title: Nuance and interpretation, levels: [25, 26, 27, 28, 29, 30], target_new_headwords: 1800}
levels:
- number: 1
  title: Names, greetings, and a second attempt
  goals: [Introduce yourself using a present-tense identity sentence., Choose polite address and request repetition., Ask a basic identity question and negate an incorrect identification.]
  checkpoint: Introduce yourself to an unfamiliar partner and recover from an unexpected clarification question without repeating an answer model.
- number: 2
  title: Whose things are where?
  goals: [Identify people and objects with appropriate gender agreement., Ask whose item it is and match a possessive to the item., Locate an item using a familiar prepositional frame.]
  checkpoint: Identify a newly described missing object, establish its owner, and suggest a location using appropriate agreement and case.
- number: 3
  title: Meals and an ordinary day
  goals: [Describe a familiar routine with present-tense verbs., Request food using a useful accusative form., Adjust small quantities and times after a preference changes.]
  checkpoint: Arrange a meal and routine activity with changed quantities and preferences, including a new object rather than a memorized order.
- number: 4
  title: Getting there and getting help
  goals: [Distinguish a location from a destination in a direction question., Ask for permission or help using a polite frame., Agree on a future activity and revise its time or place.]
  checkpoint: Ask for directions and help, then agree on a changed meeting plan after receiving an unexpected reply.
- number: 5
  title: Sharing a home and belongings
  goals: [Explain possession and absence using genitive frames., Locate household items with the case required by a preposition., Coordinate a household routine with plural agreement and familiar reflexive verbs.]
  checkpoint: Explain a household need and negotiate who has an item, who lacks it, and where it should be found.
- number: 6
  title: Buying, eating, and everyday care
  goals: [Clarify a purchase or ingredient need with the appropriate governed case., Distinguish animate and inanimate direct objects., Explain an ordinary care need while checking the other person's response.]
  checkpoint: Explain a changed purchase, ingredient, or care need and clarify a proposed response without making a medical or dietary-safety claim.
- number: 7
  title: Journeys that change
  goals: [Relate a recent event with past-tense gender or number agreement., Distinguish travel on foot from travel by vehicle in a current journey., Change an arrangement using an appropriate future form and origin or destination frame.]
  checkpoint: Revise transport and accommodation arrangements after a schedule change, distinguishing past events from the new plan.
- number: 8
  title: Work, study, and invitations
  goals: [Explain ability and familiar responsibilities using common irregular verbs., Invite someone and respond to constraints politely., Coordinate people and quantities in a work or study task.]
  checkpoint: Arrange a shared task or invitation around another person's constraints and explain who can do what.
- number: 9
  title: What was happening and what happened
  goals: [Separate ongoing background from completed outcomes through aspect., Distinguish non-occurrence from an unachieved result under negation., Contrast a current journey with habitual travel.]
  checkpoint: Narrate an unfamiliar event sequence and answer new questions about background, repeated actions, and achieved results.
- number: 10
  title: Feelings and another person's view
  goals: [Describe reactions with reflexive and dative-experiencer frames., Clarify a person's uncertainty using an indirect question., Use negative pronouns with the required negative verb and preposition.]
  checkpoint: Explain a fictional misunderstanding, ask what is uncertain, and respond considerately to a different interpretation.
- number: 11
  title: Instructions and results
  goals: [Choose an imperative suited to a routine or a desired result., Distinguish a general prohibition from a warning about an unwanted event., Explain purpose and how an action is performed.]
  checkpoint: Explain a new procedure and repair an instruction when the partner does not achieve the intended result.
- number: 12
  title: Passing on useful information
  goals: [Relay a statement or request without confusing the speaker's role., Link a description with an appropriately declined relative pronoun., Explain a familiar notice or procedure using its governed case frame.]
  checkpoint: Relay a short notice in your own words and answer questions about whom it concerns and what action it requests.
- number: 13
  title: Choosing with reasons
  goals: [Compare alternatives without confusing comparative constructions., Recommend an option while acknowledging a drawback., Connect a reason to a consequence rather than merely listing claims.]
  checkpoint: Compare unfamiliar options, recommend one, and adjust the recommendation after hearing another person's preference.
- number: 14
  title: Resolving an unclear service problem
  goals: [Distinguish an item needed from an action required., Clarify prohibition versus practical impossibility., Explain absence or a negated object without treating every negative sentence as the same case rule.]
  checkpoint: Resolve a simulated service or housing problem with incomplete information and revise your explanation after a clarification.
- number: 15
  title: Responsibilities and coordination
  goals: [State obligations and dependencies with the required case., Distinguish a duty from an outcome someone managed to achieve., Explain simultaneous actions without changing the understood actor.]
  checkpoint: Give a task update and renegotiate responsibilities after a change, explaining dependencies and what was actually achieved.
- number: 16
  title: Reports, events, and viewpoints
  goals: [Distinguish an event from an attributed report or opinion., Interpret passive and impersonal reporting choices., Recover the role of a noun in a participial description.]
  checkpoint: Compare two short reports, separating events, attributed claims, and the emphasis produced by different sentence choices.
- number: 17
  title: Systems, movement, and consequences
  goals: ["Explain entry, departure, and return with meaning-sensitive motion prefixes.", Describe a system's result without confusing a state with a process., Present a general-audience technical or environmental explanation with explicit limitations.]
  checkpoint: Explain a new technical or environmental issue and answer a limitation question without claiming specialist expertise.
- number: 18
  title: Proposals and workable compromises
  goals: [Use real and hypothetical conditions to negotiate a proposal., Express a respectful preference without presenting it as a demand., Connect an earlier completed action to the next step while keeping the actor clear.]
  checkpoint: Present a proposal and revise it after an objection or new constraint, marking what is agreed and what remains hypothetical.
- number: 19
  title: Evidence and degrees of certainty
  goals: [Separate observation from inference and reported evidence., Qualify certainty without treating a modal word as proof., Explain what follows only if a stated condition holds.]
  checkpoint: Evaluate an unfamiliar argument and explain which parts are supported, inferred, conditional, or still uncertain.
- number: 20
  title: Institutions, money, and public processes
  goals: [Explain a public or economic process with precise governed relations., Unpack a formal noun phrase into an action with identifiable participants., Contrast a stated purpose with a possible consequence.]
  checkpoint: Explain an institutional or economic change and compare plausible effects without claiming legal or financial expertise.
- number: 21
  title: Explaining an investigation
  goals: ["Distinguish a method, an observed result, and an explanatory claim.", Interpret formal participial relations and measured comparisons., Describe a dependency without turning correlation into causation.]
  checkpoint: Summarize a general-audience scientific account and identify a limitation or unanswered question in the evidence.
- number: 22
  title: Values without overgeneralization
  goals: [Represent competing considerations using concession and contrast., Restrict a generalization to the people or circumstances described., Attribute a perspective rather than presenting it as universal.]
  checkpoint: Discuss an unfamiliar dilemma while representing two perspectives fairly and limiting claims drawn from individual experience.
- number: 23
  title: A claim that can survive an objection
  goals: [Build an argument with an explicit scope and necessary conditions., Distinguish an exception from a refutation of the entire claim., Revise an aspect-sensitive claim about frequency or completion after counterevidence.]
  checkpoint: Defend a qualified recommendation and narrow or revise it when a new counterexample is introduced.
- number: 24
  title: Synthesizing sources in formal Russian
  goals: [Combine partially conflicting sources with precise attribution., Use formal linking and nominalization without hiding the actor unnecessarily., Present a structured conclusion that preserves uncertainty.]
  checkpoint: Produce a structured explanation or proposal from two partially conflicting sources and explain how the conflict affects the conclusion.
- number: 25
  title: What a message implies
  goals: [Explain how word order changes focus without replacing case marking., Interpret particles and indirect wording in context., Distinguish the speaker's commitment from information attributed to someone else.]
  checkpoint: Compare plausible interpretations of an indirect message and justify a contextual reading while acknowledging uncertainty.
- number: 26
  title: The same request, a different relationship
  goals: [Recast a request or disagreement for a formal and a familiar audience., Recognize when diminutives or familiar address can sound inappropriate., Preserve meaning while changing politeness and emotional intensity.]
  checkpoint: Rework a request and a disagreement for two relationships and explain the likely effect of each wording choice.
- number: 27
  title: Ordinary imagery and conversational shortcuts
  goals: [Interpret a familiar figurative expression without translating each word literally., Recover omitted material from a conversational context., Distinguish an expressive construction from a neutral paraphrase.]
  checkpoint: Explain an original figurative exchange, supply a literal paraphrase, and identify a context in which the expression would not fit.
- number: 28
  title: Precision in abstract explanations
  goals: ["Clarify scope, degree, and the boundaries of a comparison.", Distinguish near-equivalent connectors by the relation they express., Revise dense phrasing into precise Russian without changing its claim.]
  checkpoint: Revise an imprecise explanation and defend the changes in scope, degree, and logical connection.
- number: 29
  title: Reading with evidence and alternatives
  goals: [Support an interpretation with specific textual details., Recognize rhetorical questions and quoted distance without assuming sincerity., Compare a stylistic choice with a credible alternative reading.]
  checkpoint: Defend an interpretation of an original passage, identify the evidence for it, and address a plausible competing interpretation.
- number: 30
  title: Independent inquiry and sustained revision
  goals: [Develop a sustained project for a declared audience using selected sources., "Keep causal, conditional, and concessive relations precise across an extended argument.", Revise meaning and register after substantive critique while reporting unresolved uncertainty.]
  checkpoint: Complete a sustained project, discuss sources and uncertainty, and submit a revised response explaining how critique changed the result.
topics:
  communication: {title: Communication and repair, task: Convey a relevant message and clarify what another person means.}
  people: {title: People and relationships, task: Describe people and relationships without confusing reference or agreement.}
  home: {title: Home and shared routines, task: Explain belongings and practical arrangements in a home.}
  clothing: {title: Clothing and appearance, task: Describe clothing and compare choices appropriate to a situation.}
  food: {title: Meals and ingredients, task: Explain a food request and verify the intended ingredients or preference.}
  health: {title: Body and wellbeing, task: Describe a need and seek clarification without making a clinical claim.}
  travel: {title: Travel and transport, task: Explain an origin or destination and negotiate a changed journey.}
  services: {title: Services and transactions, task: Clarify a requirement and respond to an ordinary service problem.}
  leisure: {title: Leisure and participation, task: Discuss an activity and coordinate participation.}
  learning: {title: Learning and education, task: Explain a learning task and ask for useful feedback.}
  work: {title: Work and cooperation, task: Explain responsibilities and coordinate a shared outcome.}
  money: {title: Money and commercial choices, task: Ask about costs or explain a commercial choice without assuming availability.}
  time: {title: Time and event sequence, task: Distinguish a time point from duration and relate events in order.}
  actions: {title: Actions and results, task: Distinguish a repeated or ongoing action from a completed outcome.}
  description: {title: Description and comparison, task: Make a precise description or comparison with suitable agreement.}
  feelings: {title: Feelings and attitudes, task: Explain a response while making the experiencer and perspective clear.}
  reasoning: {title: Reasons and relationships, task: Explain a connection and qualify what follows from it.}
  grammar: {title: Sentence construction, task: Use a construction for a new meaning and explain a relevant contrast.}
  society: {title: Society and community, task: Compare experiences without treating one example as universal.}
  institutions: {title: Institutions and public processes, task: Explain a process and separate its purpose from its effects.}
  media: {title: Reports and sources, task: 'Distinguish events, attributed claims, and interpretation in a report.'}
  technology: {title: Technology and systems, task: Explain a system's use and limitations for a stated audience.}
  nature: {title: Nature and environment, task: Describe a change in the natural world and explain a relevant relationship.}
  science: {title: Investigation and explanation, task: Distinguish a method and observation from an explanatory conclusion.}
  history: {title: History and long-term change, task: Relate a development and qualify an interpretation of its significance.}
  culture: {title: Practices and perspectives, task: Explain a practice in context without claiming cultural uniformity.}
  arts: {title: Arts and creative choices, task: Discuss an original work and support an interpretation with details.}
  argument: {title: Arguments and decisions, task: Defend a position while addressing a relevant objection or qualification.}
  register: {title: Register and implied stance, task: Adapt wording to a relationship and explain its likely effect.}
  literature: {title: Literary language in context, task: Interpret a selected literary construction and paraphrase it in ordinary language.}
extensions:
- {id: professional, title: Professional communication and coordination, after_level: 18, mastery_target: independent-use, description: 'Produce appropriate task updates, requests, and negotiated commitments; optional language practice, not occupational qualification.'}
- {id: technical, title: Understanding digital and technical material, after_level: 18, mastery_target: understand, description: 'Interpret instructions, system descriptions, and limitations; not engineering competence or authorization to perform a procedure.'}
- {id: scientific, title: Understanding scientific accounts, after_level: 24, mastery_target: understand, description: 'Read methods, qualified findings, and terminology in context; not scientific or clinical qualification.'}
- {id: literary, title: Understanding literary and historical expression, after_level: 24, mastery_target: understand, description: 'Interpret original contextual examples and older or literary wording; not a requirement to imitate it in ordinary speech.'}
