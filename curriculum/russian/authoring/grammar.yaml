- id: ru-g-polite-repair
  ch: Извините. Повторите, пожалуйста.
  ds: Greet politely and ask for communication repair
  level: 1
  topic: communication
  english: Learn polite attention, repair, thanks, and closing chunks as usable wholes before analyzing the imperative. Please does not remove the need for appropriate tone. Здравствуйте is a polite greeting; привет is familiar. Спасибо за names what the thanks concern with an accusative object. До свидания is a fixed goodbye, not a claim about a date or appointment.
  examples:
  - {target: 'Здравствуйте. Повторите, пожалуйста.', english: 'Hello. Please repeat that.'}
  - {target: 'Извините. Говорите медленнее, пожалуйста.', english: 'Excuse me. Please speak more slowly.'}
  - {target: 'Напишите, пожалуйста.', english: 'Please write it down.'}
  lexical_anchors: []
  fixed_forms: [Здравствуйте, Привет, Извините, Спасибо, Спасибо за, пожалуйста, Повторите, Говорите, медленнее, Напишите, До свидания]
  grammar_prerequisites: []
- id: ru-g-present-identity
  ch: Я [name]. Это [noun].
  ds: State identity without a present-tense copula
  level: 1
  topic: people
  english: Ordinary present-tense identity sentences normally omit a verb equivalent to am or is. Это can introduce or identify something without agreeing with the following noun. Меня зовут and the polite question Как вас зовут are naming chunks, not word-for-word English name sentences. Names in examples are replaceable support, not automatically mastered vocabulary.
  examples:
  - {target: Я Анна. Это Игорь., english: I am Anna. This is Igor.}
  - {target: Меня зовут Олег. Я студент., english: My name is Oleg. I am a student.}
  lexical_anchors: []
  fixed_forms: [Я, Это, Меня зовут, Как вас зовут]
  grammar_prerequisites: []
- id: ru-g-polite-vy
  ch: Вы [verb]? Ты [verb]?
  ds: Choose polite or familiar personal address
  level: 1
  topic: register
  english: Вы addresses several people or one person politely and takes plural verb forms. Ты addresses one familiar person. Do not change to ты merely because English has only you. Capital Вы is possible in personal correspondence but is not required in every polite text.
  examples:
  - {target: "Вы понимаете?", english: "Do you understand? (polite or plural)"}
  - {target: "Ты понимаешь?", english: "Do you understand? (familiar singular)"}
  lexical_anchors: [{lemma: понимать, hint: understand}]
  fixed_forms: [Вы, Ты]
  grammar_prerequisites: [ru-g-present-identity]
- id: ru-g-basic-questions
  ch: Кто это? Что это? Где [noun]? Когда [event]?
  ds: Ask identity, location, or time without an auxiliary
  level: 1
  topic: communication
  english: Кто asks about a person, что about a thing or identification, где about location, and когда about time. Который час is a useful fixed clock-time question. Russian does not insert English do into these questions. A yes/no question may retain statement word order; text punctuation cannot assess its spoken intonation.
  examples:
  - {target: "Кто это? Это Анна.", english: "Who is this? This is Anna."}
  - {target: "Где туалет?", english: "Where is the toilet?"}
  lexical_anchors: []
  fixed_forms: [Кто, Что, Где, Когда, Который час, это]
  grammar_prerequisites: [ru-g-present-identity]
- id: ru-g-basic-negation
  ch: Я не [verb]. Это не [noun].
  ds: Negate a statement or correct identification
  level: 1
  topic: communication
  english: Не normally precedes the element it negates. Нет can answer no; it is not interchangeable with не before a verb. Start with simple corrections and an explicit repair phrase, then revisit negated objects and negative pronouns in later constructions.
  examples:
  - {target: Я не понимаю., english: I do not understand.}
  - {target: "Нет, это не мой билет.", english: "No, this is not my ticket."}
  lexical_anchors: [{lemma: понимать, hint: understand}]
  fixed_forms: [не, Нет]
  grammar_prerequisites: [ru-g-present-identity]
- id: ru-g-gender-agreement
  ch: новый [masculine] / новая [feminine] / новое [neuter]
  ds: Match an adjective to a noun's gender
  level: 2
  topic: description
  english: Learn noun gender together with useful agreement, not as a claim about the object itself. Many consonant-final nouns are masculine, many in -а or -я feminine, and many in -о or -е neuter, but exceptions and soft-sign nouns need checking. Adjectives also change for case and number.
  examples:
  - {target: Это новый стол., english: This is a new table.}
  - {target: Это новая книга. Это новое окно., english: This is a new book. This is a new window.}
  lexical_anchors: [{lemma: новый, hint: new}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-present-identity]
- id: ru-g-demonstrative-agreement
  ch: этот / эта / это [noun]
  ds: Distinguish identifying это from agreeing this
  level: 2
  topic: description
  english: Identifying Это книга uses invariant это. Before a noun meaning this particular item, the demonstrative agrees with it, as in эта книга. These functions should not be merged merely because neuter это looks identical.
  examples:
  - {target: Это книга. Эта книга новая., english: This is a book. This book is new.}
  - {target: Этот стол здесь., english: This table is here.}
  lexical_anchors: []
  fixed_forms: [этот, эта, это]
  grammar_prerequisites: [ru-g-gender-agreement]
- id: ru-g-possessive-agreement
  ch: мой / моя / моё [noun]; его / её [noun]
  ds: Match a possessive to the thing possessed
  level: 2
  topic: people
  english: Мой, твой, наш, and ваш agree with the possessed noun, not the possessor's gender. Possessive его, её, and их do not decline. Preserve ё in моё and её rather than treating it as decorative spelling.
  examples:
  - {target: Это моя сумка и моё пальто., english: This is my bag and my coat.}
  - {target: "Его книга здесь, а её билет там.", english: "His book is here, and her ticket is there."}
  lexical_anchors: []
  fixed_forms: [мой, моя, моё, твой, наш, ваш, его, её, их]
  grammar_prerequisites: [ru-g-gender-agreement]
- id: ru-g-location-prepositional
  ch: в / на [prepositional noun]
  ds: Locate something with в or на plus prepositional
  level: 2
  topic: home
  english: For a static location, useful в and на frames take the prepositional case. Learn the preposition with the place because English in or at does not predict it reliably. Introduce common forms such as в школе and на столе without claiming every noun has the same ending.
  examples:
  - {target: Анна в школе., english: Anna is at school.}
  - {target: Книга на столе., english: The book is on the table.}
  lexical_anchors: []
  fixed_forms: [в, на]
  grammar_prerequisites: [ru-g-basic-questions]
- id: ru-g-whose-question
  ch: Чей / чья / чьё / чьи [noun]?
  ds: Ask whose with gender and number agreement
  level: 2
  topic: people
  english: The interrogative agrees with the item whose owner is unknown. Чья сумка asks about a feminine noun regardless of the owner's gender. A short answer may omit the repeated noun while retaining agreement.
  examples:
  - {target: "Чья это сумка? Моя.", english: "Whose bag is this? Mine."}
  - {target: "Чьё это пальто? Его.", english: "Whose coat is this? His."}
  lexical_anchors: []
  fixed_forms: [Чей, чья, чьё, чьи]
  grammar_prerequisites: [ru-g-possessive-agreement]
- id: ru-g-present-conjugation
  ch: я читаю / ты читаешь / они читают
  ds: Match a present-tense verb to its subject
  level: 3
  topic: actions
  english: Present-tense endings distinguish person and number. Introduce common first- and second-conjugation patterns with real verbs, but check stem changes and stress rather than generating forms from spelling alone. Present forms of imperfective verbs describe ongoing or habitual actions according to context.
  examples:
  - {target: "Я читаю, а Анна пишет.", english: "I am reading, and Anna is writing."}
  - {target: Мы работаем утром., english: We work in the morning.}
  lexical_anchors: [{lemma: читать, hint: read}, {lemma: писать, hint: write}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-present-identity, ru-g-polite-vy]
- id: ru-g-want-infinitive
  ch: хочу / хочешь / хочет; хотим / хотите / хотят + [infinitive]
  ds: Express a wish with irregular хотеть
  level: 3
  topic: food
  english: Хотеть has a mixed conjugation; do not infer мы хочем from я хочу. An infinitive names the desired action. A bare хочу request can sound direct, so combine appropriate polite wording or use the permission/request frame when needed.
  examples:
  - {target: Я хочу пить., english: I want something to drink.}
  - {target: "Вы хотите есть?", english: "Do you want to eat?"}
  lexical_anchors: [{lemma: хотеть, hint: want}]
  fixed_forms: [хочу, хочешь, хочет, хотим, хотите, хотят]
  grammar_prerequisites: [ru-g-present-conjugation]
- id: ru-g-accusative-object
  ch: читать / пить + [accusative object]
  ds: Mark a simple direct object in the accusative
  level: 3
  topic: food
  english: Useful direct objects take the accusative, for example воду from вода. Feminine -а commonly becomes -у and -я becomes -ю. Many inanimate masculine and neuter singular objects look like the nominative; do not infer that case has disappeared. Animacy and other patterns are developed later.
  examples:
  - {target: Я пью воду., english: I drink water.}
  - {target: Анна читает книгу., english: Anna is reading a book.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-present-conjugation, ru-g-gender-agreement]
- id: ru-g-small-quantities
  ch: один / одна / одно; два / две; три / четыре + [noun]
  ds: Request small quantities with the correct noun form
  level: 3
  topic: money
  english: One agrees with gender; two distinguishes два and две. In the basic nominative or inanimate accusative counting frame, two through four take a genitive-singular noun, unlike five and above. Learn short useful quantities before adding full numeral declension.
  examples:
  - {target: "Один билет, пожалуйста.", english: "One ticket, please."}
  - {target: "Две чашки чая, пожалуйста.", english: "Two cups of tea, please."}
  lexical_anchors: []
  fixed_forms: [один, одна, одно, два, две, три, четыре]
  grammar_prerequisites: [ru-g-gender-agreement, ru-g-polite-repair]
- id: ru-g-routine-time
  ch: утром / днём / вечером; в [clock time]
  ds: Place a routine at a time of day
  level: 3
  topic: time
  english: Утром, днём, and вечером locate a routine within a day. A clock time uses в with an appropriate numeral expression. Keep the distinction between at a time and for a duration, and preserve ё in днём.
  examples:
  - {target: Утром я работаю., english: I work in the morning.}
  - {target: Мы встречаемся в три часа., english: We are meeting at three o'clock.}
  lexical_anchors: []
  fixed_forms: [утром, днём, вечером, в]
  grammar_prerequisites: [ru-g-present-conjugation, ru-g-small-quantities]
- id: ru-g-permission-request
  ch: Можно [infinitive / requested item]?
  ds: Ask permission or politely request an item
  level: 4
  topic: services
  english: Можно with an infinitive asks whether an action is allowed or possible. In a service context, Можно воду? is an elliptical request with an accusative item. It asks rather than asserts availability. It is not the same as personal ability expressed by могу.
  examples:
  - {target: "Можно воду, пожалуйста?", english: "Could I have some water, please?"}
  - {target: "Можно здесь сидеть?", english: "May I sit here?"}
  lexical_anchors: []
  fixed_forms: [Можно]
  grammar_prerequisites: [ru-g-accusative-object, ru-g-polite-repair]
- id: ru-g-dative-need
  ch: мне / вам нужно + [infinitive]
  ds: Say who needs to perform an action
  level: 4
  topic: actions
  english: The person experiencing a need is in the dative, as in мне or вам, while нужно remains impersonal before an infinitive. A destination can be supplied in an elliptical travel need, but this does not make нужно an agreeing adjective.
  examples:
  - {target: Мне нужно идти., english: I need to go.}
  - {target: Вам нужно подождать., english: You need to wait a little.}
  lexical_anchors: []
  fixed_forms: [мне, вам, нужно]
  grammar_prerequisites: [ru-g-present-identity]
- id: ru-g-place-direction-origin
  ch: где / куда / откуда; в / на + [accusative destination]
  ds: Distinguish location, destination, and origin
  level: 4
  topic: travel
  english: Где asks where something is, куда where it is going, and откуда where it comes from. A destination with в or на takes the accusative rather than the static prepositional. Learn Как пройти ...? as a useful direction request; detailed motion contrasts follow later.
  examples:
  - {target: Я иду в школу. Анна в школе., english: I am going to school. Anna is at school.}
  - {target: "Как пройти на вокзал?", english: "How do I get to the station on foot?"}
  lexical_anchors: []
  fixed_forms: [где, куда, откуда, в, на, Как пройти]
  grammar_prerequisites: [ru-g-location-prepositional, ru-g-accusative-object]
- id: ru-g-imperfective-future
  ch: буду / будешь / будет / будем / будете / будут + [imperfective infinitive]
  ds: Describe a future activity or repeated action
  level: 4
  topic: time
  english: Буду plus an imperfective infinitive presents a future activity, process, or repeated event. The auxiliary agrees with the subject and the infinitive does not. Do not add буду to a perfective future form or infer that this frame promises a completed result.
  examples:
  - {target: Завтра я буду работать дома., english: Tomorrow I will be working at home.}
  - {target: Мы будем читать вечером., english: We will read in the evening.}
  lexical_anchors: [{lemma: быть, hint: be}]
  fixed_forms: [буду, будешь, будет, будем, будете, будут]
  grammar_prerequisites: [ru-g-present-conjugation]
- id: ru-g-polite-help-imperative
  ch: Помогите / Покажите / Скажите, пожалуйста.
  ds: Request a helpful action with a polite imperative
  level: 4
  topic: services
  english: These -те imperatives address one person politely or several people. Teach their stems as verified forms, not as a rule that simply attaches -те to an infinitive. Пожалуйста softens a request but tone and circumstances still matter; later work distinguishes imperative aspect.
  examples:
  - {target: "Помогите, пожалуйста.", english: "Please help me."}
  - {target: "Покажите на карте, пожалуйста.", english: "Please show me on the map."}
  lexical_anchors: []
  fixed_forms: [Помогите, Покажите, Скажите]
  grammar_prerequisites: [ru-g-polite-vy, ru-g-polite-repair]
- id: ru-g-possession-existence
  ch: У [genitive possessor] есть [noun].
  ds: State possession or availability with у ... есть
  level: 5
  topic: home
  english: У plus the genitive identifies the possessor, and есть asserts existence or availability. У меня есть means I have, not I eat; the homographic eating verb is a different function. Есть is often absent when an adjective characterizes an already established possession.
  examples:
  - {target: У меня есть ключ., english: I have a key.}
  - {target: "У вас есть вода?", english: "Do you have any water?"}
  lexical_anchors: []
  fixed_forms: [У, у, меня, вас, есть]
  grammar_prerequisites: [ru-g-present-identity]
- id: ru-g-absence-genitive
  ch: У [genitive possessor] нет [genitive noun].
  ds: Express absence with нет and the genitive
  level: 5
  topic: home
  english: Нет meaning there is no governs the genitive of what is absent, unlike a simple negative answer Нет. У меня нет ключа denies possession. Learn useful genitive patterns and irregular forms without adding each inflection as a separate lexical headword.
  examples:
  - {target: У меня нет ключа., english: I do not have a key.}
  - {target: Здесь нет воды., english: There is no water here.}
  lexical_anchors: []
  fixed_forms: [нет]
  grammar_prerequisites: [ru-g-possession-existence]
- id: ru-g-static-spatial-cases
  ch: под / над / перед / за + [instrumental]; около + [genitive]
  ds: Locate things using governed spatial cases
  level: 5
  topic: home
  english: Static под, над, перед, and за take the instrumental in the spatial frames taught here. Около takes the genitive. Do not transfer the в or на prepositional-case rule to every expression of location; movement into a position can select a different case.
  examples:
  - {target: Сумка под столом., english: The bag is under the table.}
  - {target: Магазин около дома., english: The shop is near the house.}
  lexical_anchors: []
  fixed_forms: [под, над, перед, за, около]
  grammar_prerequisites: [ru-g-location-prepositional, ru-g-absence-genitive]
- id: ru-g-plural-agreement
  ch: эти / мои / новые [plural noun] + [plural verb]
  ds: Coordinate plural nouns, modifiers, and verbs
  level: 5
  topic: description
  english: Plural agreement generally stops distinguishing gender. Learn ordinary plural endings alongside frequent irregulars such as люди and дети, checking stress independently. A numeral phrase is not always interchangeable with an ordinary plural noun phrase.
  examples:
  - {target: Эти новые книги здесь., english: These new books are here.}
  - {target: Мои друзья работают дома., english: My friends work at home.}
  lexical_anchors: []
  fixed_forms: [эти, мои]
  grammar_prerequisites: [ru-g-gender-agreement, ru-g-present-conjugation]
- id: ru-g-reflexive-routines
  ch: "[verb]-ся / -сь"
  ds: Use reflexive verbs for familiar routines
  level: 5
  topic: actions
  english: -ся and -сь are related reflexive endings, but not every such verb literally means do something to oneself. Learn умываться as a routine and встречаться as meeting or meeting each other in context. Removing the ending can change the verb's meaning and object requirements.
  examples:
  - {target: Утром я умываюсь., english: I wash my face in the morning.}
  - {target: Мы встречаемся вечером., english: We are meeting in the evening.}
  lexical_anchors: [{lemma: умываться, hint: wash oneself}, {lemma: встречаться, hint: meet}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-present-conjugation]
- id: ru-g-reflexive-reference
  ch: себя / себе; свой / своя / своё [noun]
  ds: Refer back to the subject without changing the possessor
  level: 5
  topic: people
  english: Себя refers back to a clause's subject and has case forms but no nominative. Свой normally identifies the subject as possessor and agrees with the possessed noun. Compare a subject's own item with another person's item; in complex clauses, make the intended reference explicit when it could be ambiguous.
  examples:
  - {target: "Анна читает свою книгу.", english: "Anna is reading her own book."}
  - {target: "Я вижу себя на фотографии.", english: "I see myself in the photograph."}
  lexical_anchors: []
  fixed_forms: [себя, себе, свой, своя, своё]
  grammar_prerequisites: [ru-g-possessive-agreement, ru-g-accusative-object]
- id: ru-g-dative-recipient
  ch: дать / показать [accusative thing] [dative recipient]
  ds: Mark the recipient of giving or showing
  level: 6
  topic: services
  english: The thing given or shown is a direct object; the recipient takes the dative. Dative pronouns such as мне and вам remain different from accusative меня and вас. Learn Дайте as an irregular polite imperative rather than deriving it from an assumed regular stem.
  examples:
  - {target: "Дайте мне чек, пожалуйста.", english: "Please give me the receipt."}
  - {target: Я показываю Анне фотографию., english: I am showing Anna a photograph.}
  lexical_anchors: []
  fixed_forms: [Дайте, мне, вам]
  grammar_prerequisites: [ru-g-accusative-object, ru-g-dative-need]
- id: ru-g-instrumental-means
  ch: "[verb] + [instrumental means]; с + [instrumental companion]"
  ds: Distinguish a means from an accompanying person
  level: 6
  topic: actions
  english: An instrumental without с can name an instrument or method. С with the instrumental marks accompaniment or an included ingredient. Карточкой or картой in a payment question names a method, not a guarantee that it is accepted.
  examples:
  - {target: Я пишу ручкой., english: I write with a pen.}
  - {target: Я пью чай с молоком., english: I drink tea with milk.}
  - {target: "Можно платить картой?", english: "Can I pay by card?"}
  lexical_anchors: []
  fixed_forms: [с]
  grammar_prerequisites: [ru-g-static-spatial-cases, ru-g-permission-request]
- id: ru-g-without-genitive
  ch: без + [genitive noun]
  ds: Request or describe something without an ingredient
  level: 6
  topic: food
  english: Без always governs the genitive in this frame. A request without an ingredient does not communicate every allergy or cross-contact requirement. Important dietary restrictions require a professionally verified explanation and confirmation by a qualified person, not confidence based on a memorized chunk.
  examples:
  - {target: "Чай без сахара, пожалуйста.", english: "Tea without sugar, please."}
  - {target: "Можно суп без мяса?", english: "Could I have soup without meat?"}
  lexical_anchors: []
  fixed_forms: [без]
  grammar_prerequisites: [ru-g-absence-genitive, ru-g-permission-request]
- id: ru-g-animate-accusative
  ch: вижу [animate accusative] / вижу [inanimate accusative]
  ds: Apply animacy to direct-object forms
  level: 6
  topic: people
  english: Animate masculine singular accusatives and animate plurals typically match the genitive; corresponding inanimate forms match the nominative. This does not replace the feminine singular -у pattern. Grammatical animacy must be learned for the noun and is not a general claim about biological life.
  examples:
  - {target: Я вижу брата и стол., english: I see my brother and a table.}
  - {target: Я вижу студентов и книги., english: I see the students and the books.}
  lexical_anchors: [{lemma: видеть, hint: see}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-accusative-object, ru-g-plural-agreement]
- id: ru-g-health-experiencer
  ch: У меня болит / болят [body part]. У меня аллергия на [accusative].
  ds: Describe pain or state an allergy without diagnosing
  level: 6
  topic: health
  english: With болеть, the body part is the grammatical subject and controls singular болит or plural болят. These explicitly taught forms belong to the pain construction; a source row labelled болит is not automatically a new lexical headword. У меня identifies the person affected. Аллергия на takes the accusative trigger; this introductory frame cannot convey severity, treatment, or cross-contact needs reliably without qualified verification.
  examples:
  - {target: У меня болит голова., english: I have a headache.}
  - {target: У меня аллергия на молоко., english: I am allergic to milk.}
  lexical_anchors: [{lemma: болеть, hint: ache}, {lemma: аллергия, hint: allergy}]
  fixed_forms: [У меня, на, болит, болят]
  grammar_prerequisites: [ru-g-possession-existence, ru-g-accusative-object, ru-g-plural-agreement]
- id: ru-g-pronouns-after-prepositions
  ch: у него / у неё / у них; с ним / с ней / с ними
  ds: Use governed personal-pronoun forms after prepositions
  level: 6
  topic: people
  english: Third-person personal pronouns commonly gain initial н after simple prepositions, as у него and с ней. This is not added to invariant possessives, as у его брата. The preposition selects case; some derived prepositions have different patterns, so do not turn initial н into an exceptionless rule.
  examples:
  - {target: "У неё есть билет.", english: "She has a ticket."}
  - {target: "Я иду с ним, а не с его братом.", english: "I am going with him, not with his brother."}
  lexical_anchors: []
  fixed_forms: [у него, у неё, у них, с ним, с ней, с ними]
  grammar_prerequisites: [ru-g-possession-existence, ru-g-possessive-agreement, ru-g-instrumental-means]
- id: ru-g-past-agreement
  ch: работал / работала / работало / работали
  ds: Match a past-tense verb to gender or number
  level: 7
  topic: time
  english: The ordinary past distinguishes gender in the singular and number, not grammatical person. Я работала and я работал depend on the speaker's agreement choice. Learn irregular past stems such as шёл, шла, and шли separately with their verified stress and spelling.
  examples:
  - {target: Вчера Анна работала дома., english: Anna worked at home yesterday.}
  - {target: Мы ждали автобус., english: We were waiting for the bus.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-present-conjugation, ru-g-gender-agreement]
- id: ru-g-perfective-future
  ch: "[perfective personal form] завтра"
  ds: Present a future event as a bounded outcome
  level: 7
  topic: actions
  english: Perfective personal forms refer to the future rather than an ongoing present. Compare буду читать with прочитаю for an activity versus a bounded reading outcome in a suitable context. A listed aspect partner is not automatically interchangeable in every meaning, and not every prefix creates only aspect.
  examples:
  - {target: Завтра я прочитаю письмо., english: Tomorrow I will read the letter through.}
  - {target: Мы купим билеты вечером., english: We will buy the tickets in the evening.}
  lexical_anchors: [{lemma: прочитать, hint: read through}, {lemma: купить, hint: buy}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-imperfective-future]
- id: ru-g-current-motion
  ch: иду / идёт; еду / едет + [destination]
  ds: Distinguish current travel on foot and by vehicle
  level: 7
  topic: travel
  english: Идти and ехать commonly describe directed motion on foot and by vehicle respectively. Both are imperfective; the contrast is not past versus future or imperfective versus perfective. Their personal and past forms need explicit attention, and actual usage extends beyond these introductory travel situations.
  examples:
  - {target: Я иду в магазин., english: I am walking to the shop.}
  - {target: Мы едем на вокзал., english: We are going to the station by vehicle.}
  lexical_anchors: [{lemma: идти, hint: go on foot}, {lemma: ехать, hint: go by vehicle}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-place-direction-origin, ru-g-present-conjugation]
- id: ru-g-origins-and-people
  ch: из / с / от + [genitive]; к + [dative]
  ds: Name an origin or movement toward a person
  level: 7
  topic: travel
  english: Many place pairs use в ... из and на ... с, with the origin in the genitive. К plus dative indicates movement toward a person or endpoint; от plus genitive marks movement away. Learn each place expression rather than choosing a preposition only from an English translation.
  examples:
  - {target: Я еду из города., english: I am travelling from the city.}
  - {target: "Анна идёт к врачу, а Игорь идёт от врача.", english: "Anna is going to the doctor, and Igor is coming from the doctor."}
  lexical_anchors: []
  fixed_forms: [из, с, от, к]
  grammar_prerequisites: [ru-g-current-motion, ru-g-dative-recipient, ru-g-absence-genitive]
- id: ru-g-duration-deadline
  ch: "[duration]; через [accusative time]; до [genitive endpoint]"
  ds: Distinguish duration, time until, and an endpoint
  level: 7
  topic: time
  english: An unprepositioned time expression can give duration. Через names the interval until a future event; до gives an endpoint. English in two hours is ambiguous, so distinguish two hours from now from time required to finish, developed later with aspect.
  examples:
  - {target: Я ждал два часа., english: I waited for two hours.}
  - {target: Автобус будет здесь через час., english: The bus will be here in an hour.}
  - {target: Мы работаем до вечера., english: We work until evening.}
  lexical_anchors: []
  fixed_forms: [через, до]
  grammar_prerequisites: [ru-g-small-quantities, ru-g-past-agreement]
- id: ru-g-calendar-frames
  ch: в [accusative weekday]; [genitive ordinal date] [genitive month]
  ds: Give a weekday or date with the appropriate frame
  level: 7
  topic: time
  english: A scheduled weekday commonly uses в plus accusative. A date answering when commonly uses a genitive ordinal and a genitive month, unlike a date stated with сегодня and a nominative ordinal. Learn useful full dates with verified forms and stress rather than treating ordinal numbers as indeclinable labels.
  examples:
  - {target: "Мы встретимся в среду.", english: "We will meet on Wednesday."}
  - {target: "Встреча будет пятого мая.", english: "The meeting will be on the fifth of May."}
  lexical_anchors: []
  fixed_forms: [в]
  grammar_prerequisites: [ru-g-routine-time, ru-g-small-quantities, ru-g-absence-genitive, ru-g-perfective-future]
- id: ru-g-ability-moch
  ch: могу / можешь / может / можем / можете / могут + [infinitive]
  ds: Express ability with irregular мочь
  level: 8
  topic: work
  english: Мочь takes an infinitive and changes its stem across personal forms. Distinguish someone's capacity or circumstances from impersonal permission with можно. Не могу does not by itself tell whether the obstacle is skill, time, or another condition; clarify it.
  examples:
  - {target: Я могу помочь вечером., english: I can help in the evening.}
  - {target: "Вы можете повторить?", english: "Could you repeat that?"}
  lexical_anchors: [{lemma: мочь, hint: can}]
  fixed_forms: [могу, можешь, может, можем, можете, могут]
  grammar_prerequisites: [ru-g-present-conjugation, ru-g-permission-request]
- id: ru-g-irregular-eat-give
  ch: ем / ешь / ест / едим / едите / едят; дам / дашь / даст
  ds: Distinguish irregular eating and giving forms
  level: 8
  topic: grammar
  english: Есть meaning eat has irregular present forms and is not existential есть. Дать is perfective, with дам, дашь, даст, дадим, дадите, дадут referring to a future giving event; давать has its own imperfective forms such as даю. Do not treat a shared ending or spelling as shared lexical identity.
  examples:
  - {target: "Я ем суп, а дети едят хлеб.", english: "I am eating soup, and the children are eating bread."}
  - {target: Завтра я дам вам книгу., english: Tomorrow I will give you the book.}
  lexical_anchors: [{lemma: есть, hint: eat}, {lemma: дать, hint: give}]
  fixed_forms: [ем, ешь, ест, едим, едите, едят, дам, дашь, даст, дадим, дадите, дадут, даю]
  grammar_prerequisites: [ru-g-present-conjugation, ru-g-perfective-future, ru-g-dative-recipient]
- id: ru-g-joint-invitation
  ch: Давай / Давайте + [imperfective infinitive / perfective plural form]
  ds: Invite someone to do an activity together
  level: 8
  topic: leisure
  english: Давай addresses one familiar person; давайте is polite or plural. Compare давайте работать for engaging in an activity with давайте обсудим for a bounded joint discussion. These proposal uses are constructions, not evidence of mastering all senses of давать.
  examples:
  - {target: Давайте обсудим план., english: Let's discuss the plan.}
  - {target: Давай готовить вместе., english: Let's cook together.}
  lexical_anchors: []
  fixed_forms: [Давай, Давайте]
  grammar_prerequisites: [ru-g-polite-vy, ru-g-perfective-future]
- id: ru-g-larger-quantities
  ch: пять / много / мало / сколько + [genitive noun]
  ds: Count larger or unspecified quantities
  level: 8
  topic: money
  english: In basic counting frames, five and higher take a genitive plural count noun; много, мало, and сколько also govern genitive quantity expressions. Compound numerals depend on the final part, except eleven through fourteen. Uncountable substances commonly use singular forms; numeral phrases in other cases need further work.
  examples:
  - {target: Здесь пять студентов., english: There are five students here.}
  - {target: "Сколько стоит билет?", english: "How much does a ticket cost?"}
  - {target: У нас мало времени., english: We have little time.}
  lexical_anchors: []
  fixed_forms: [пять, много, мало, сколько, Сколько стоит]
  grammar_prerequisites: [ru-g-small-quantities, ru-g-absence-genitive, ru-g-plural-agreement]
- id: ru-g-occupation-instrumental
  ch: работать [instrumental role]; быть [instrumental role]
  ds: Describe a role with an instrumental complement
  level: 8
  topic: work
  english: Работать takes an instrumental role, and past or future быть often does so too. Compare present Я учитель with Я работаю учителем. This is a role description, not the instrumental of a physical tool, and it does not confer a professional qualification.
  examples:
  - {target: Анна работает учителем., english: Anna works as a teacher.}
  - {target: Игорь был инженером., english: Igor was an engineer.}
  lexical_anchors: [{lemma: работать, hint: work}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-instrumental-means, ru-g-past-agreement]
- id: ru-g-learned-skill
  ch: уметь + [infinitive]; мочь + [infinitive]
  ds: Distinguish a learned skill from situational ability
  level: 8
  topic: learning
  english: Уметь describes knowing how to perform a skill. Мочь describes ability or possibility in the circumstances and need not establish a learned skill. A person can know how to do something but be unable to do it now; languages and other domains also have conventional verbs that should be learned in context.
  examples:
  - {target: "Я умею плавать.", english: "I know how to swim."}
  - {target: "Я умею водить, но сегодня не могу вести машину.", english: "I know how to drive, but today I cannot drive a car."}
  lexical_anchors: [{lemma: уметь, hint: know how to}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-ability-moch, ru-g-present-conjugation]
- id: ru-g-topic-prepositional
  ch: говорить / думать о [prepositional topic]
  ds: State the topic of speech or thought
  level: 8
  topic: communication
  english: О with a prepositional noun or pronoun marks the topic in these frames. Об and обо are related forms in appropriate sound or fixed-pronoun contexts, not new meanings. Compare a topic with a direct object, a recipient, or a physical location rather than treating every prepositional form as a place.
  examples:
  - {target: "Мы говорим о работе.", english: "We are talking about work."}
  - {target: "Анна думает об этом вопросе.", english: "Anna is thinking about this question."}
  lexical_anchors: []
  fixed_forms: [о, об, обо]
  grammar_prerequisites: [ru-g-location-prepositional, ru-g-present-conjugation]
- id: ru-g-narrative-aspect
  ch: "[imperfective background], потом [perfective outcome]"
  ds: Separate narrative background from completed events
  level: 9
  topic: time
  english: Imperfective commonly presents ongoing background, habit, or the fact of an activity; perfective presents a bounded event in a suitable context. Neither aspect is simply an English tense. Sequence alone does not force perfective, and imperfective does not always mean an action was unfinished.
  examples:
  - {target: "Я читал письмо, когда Анна пришла.", english: "I was reading the letter when Anna arrived."}
  - {target: "Мы обсуждали план, потом приняли решение.", english: "We were discussing the plan, then made a decision."}
  lexical_anchors: []
  fixed_forms: [когда, потом]
  grammar_prerequisites: [ru-g-past-agreement, ru-g-perfective-future]
- id: ru-g-negated-aspect
  ch: не читал / не прочитал
  ds: Contrast a non-occurring action and an unmet result
  level: 9
  topic: actions
  english: Не читал normally denies the reading activity or its occurrence; не прочитал can deny achieving the bounded reading result. Context still matters, including whether an attempt is implied. Negation does not automatically select one aspect or establish the speaker's intention.
  examples:
  - {target: Вчера я не читал эту статью., english: I did not read this article yesterday.}
  - {target: "Я читал статью, но не прочитал её до конца.", english: "I was reading the article but did not finish it."}
  lexical_anchors: [{lemma: читать, hint: read}, {lemma: прочитать, hint: read through}]
  fixed_forms: [не]
  grammar_prerequisites: [ru-g-narrative-aspect, ru-g-basic-negation]
- id: ru-g-habitual-motion
  ch: идти / ходить; ехать / ездить
  ds: Contrast a directed journey with habitual travel
  level: 9
  topic: travel
  english: Идти and ехать often describe a particular directed journey, whereas ходить and ездить describe habitual, multidirectional, or round-trip motion according to context. All four are imperfective. A past ходил can report having gone somewhere and returned, without becoming a perfective verb.
  examples:
  - {target: "Сейчас я иду в школу, а обычно езжу на автобусе.", english: "I am walking to school now, but I usually go by bus."}
  - {target: Вчера я ходил в магазин., english: Yesterday I went to the shop and back.}
  lexical_anchors: [{lemma: ходить, hint: go on foot habitually}, {lemma: ездить, hint: travel by vehicle habitually}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-current-motion, ru-g-past-agreement]
- id: ru-g-temporal-clauses
  ch: когда / пока / после того как [clause]
  ds: Link an event to a time or ongoing background
  level: 9
  topic: time
  english: Когда introduces a time relation; пока can frame an interval of simultaneous activity; после того как explicitly places an event after another. Select aspect for the intended events rather than copying the English verb tense. Пока не meaning until is a later, distinct construction.
  examples:
  - {target: "Пока Анна готовила, я читал.", english: "While Anna was cooking, I was reading."}
  - {target: "После того как автобус приехал, мы вышли из кафе.", english: "After the bus arrived, we left the café."}
  lexical_anchors: []
  fixed_forms: [когда, пока, после того как]
  grammar_prerequisites: [ru-g-narrative-aspect]
- id: ru-g-time-to-result
  ch: читать [duration]; прочитать за [accusative duration]
  ds: Distinguish activity duration from time to completion
  level: 9
  topic: time
  english: An imperfective activity with an unprepositioned duration describes time spent. За with a duration and a suitable perfective describes the time required to reach a result. Contrast both with через for how long until a future event; English in an hour can conceal this distinction.
  examples:
  - {target: "Я читал статью час.", english: "I spent an hour reading the article."}
  - {target: "Я прочитал статью за час.", english: "I finished reading the article in an hour."}
  lexical_anchors: []
  fixed_forms: [за]
  grammar_prerequisites: [ru-g-narrative-aspect, ru-g-duration-deadline]
- id: ru-g-feeling-government
  ch: интересоваться [instrumental]; бояться [genitive]
  ds: Use the case required by a feeling or interest verb
  level: 10
  topic: feelings
  english: A verb's lexical government matters more than translating an English preposition. Интересоваться governs instrumental, while бояться commonly governs genitive. Their -ся ending does not identify a single shared meaning or an automatic direct-object pattern.
  examples:
  - {target: Анна интересуется историей., english: Anna is interested in history.}
  - {target: Ребёнок боится темноты., english: The child is afraid of the dark.}
  lexical_anchors: [{lemma: интересоваться, hint: be interested in}, {lemma: бояться, hint: be afraid of}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-reflexive-routines, ru-g-instrumental-means, ru-g-absence-genitive]
- id: ru-g-dative-liking
  ch: мне нравится [singular] / нравятся [plural]
  ds: Describe liking with a dative experiencer
  level: 10
  topic: feelings
  english: The person who likes something is dative; the liked thing is the grammatical subject. It controls нравится or нравятся. This is not a literal I like sentence with an accusative object, and liking an activity can instead use an infinitive.
  examples:
  - {target: Мне нравится эта книга., english: I like this book.}
  - {target: Анне нравятся эти песни., english: Anna likes these songs.}
  lexical_anchors: [{lemma: нравиться, hint: be pleasing to}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-dative-need, ru-g-plural-agreement]
- id: ru-g-indirect-li
  ch: не знаю, [verb] ли [subject]
  ds: Embed a yes/no question with ли
  level: 10
  topic: communication
  english: Ли introduces an embedded yes/no question and normally follows the focused element, often the verb. It does not substitute for an interrogative word in a question such as where someone lives. Keep reported uncertainty distinct from a statement that the event happened.
  examples:
  - {target: "Я не знаю, придёт ли Анна.", english: "I do not know whether Anna will come."}
  - {target: "Скажите, открыт ли магазин.", english: "Please tell me whether the shop is open."}
  lexical_anchors: []
  fixed_forms: [ли]
  grammar_prerequisites: [ru-g-basic-questions, ru-g-basic-negation]
- id: ru-g-negative-pronouns
  ch: никто / ничего не ...; ни с кем не ...
  ds: Coordinate negative pronouns, не, and prepositions
  level: 10
  topic: communication
  english: Negative pronouns commonly occur with не on the predicate, unlike the standard English avoidance of double negation. Decline the pronoun for its role. With a preposition, write the relevant negative expression separately, as ни с кем; do not equate никто with every negative-pronoun form.
  examples:
  - {target: Никто не ответил., english: Nobody answered.}
  - {target: Я ни с кем не разговаривал., english: I did not talk to anyone.}
  lexical_anchors: []
  fixed_forms: [никто, ничего, ни с кем, не]
  grammar_prerequisites: [ru-g-basic-negation, ru-g-instrumental-means, ru-g-past-agreement]
- id: ru-g-imperative-aspect
  ch: открывайте / откройте [object]
  ds: Choose an imperative for a routine or one result
  level: 11
  topic: actions
  english: Perfective imperatives often request a single result; imperfective imperatives can invite starting, continuing, or performing a routine. This is a contextual contrast, not an absolute polite-versus-rude rule. Teach verified imperative stems and the singular versus -те address distinction.
  examples:
  - {target: "Откройте окно, пожалуйста.", english: "Please open the window."}
  - {target: Каждый день открывайте окно утром., english: Open the window every morning.}
  lexical_anchors: [{lemma: открывать, hint: open}, {lemma: открыть, hint: open to a result}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-polite-help-imperative, ru-g-narrative-aspect]
- id: ru-g-negative-imperative
  ch: не открывайте / не забудьте
  ds: Distinguish prohibition from an unwanted-event warning
  level: 11
  topic: actions
  english: A general instruction not to do something commonly uses an imperfective imperative. Perfective negative imperatives occur in warnings against an unwanted outcome, as не забудьте. Do not mechanically make every prohibition perfective or every negative imperative imperfective.
  examples:
  - {target: Не открывайте эту дверь., english: Do not open this door.}
  - {target: Не забудьте ключ., english: Do not forget the key.}
  lexical_anchors: [{lemma: забыть, hint: forget}]
  fixed_forms: [не]
  grammar_prerequisites: [ru-g-imperative-aspect, ru-g-negated-aspect]
- id: ru-g-purpose-chtoby
  ch: чтобы + [infinitive / subject and past-form verb]
  ds: State the purpose of an action with чтобы
  level: 11
  topic: reasoning
  english: With the same understood actor, purpose often uses чтобы plus an infinitive. When the purpose has a different explicit subject, use чтобы with a past-form verb whose meaning is intended, not necessarily past in time. Do not confuse purpose with a claim that the result actually occurred.
  examples:
  - {target: "Я пришёл, чтобы помочь.", english: "I came in order to help."}
  - {target: "Я говорю медленно, чтобы вы поняли.", english: "I am speaking slowly so that you understand."}
  lexical_anchors: []
  fixed_forms: [чтобы]
  grammar_prerequisites: [ru-g-past-agreement, ru-g-narrative-aspect]
- id: ru-g-manner-adverb
  ch: "[verb] быстро / ясно; [noun] быстрый / ясный"
  ds: Distinguish how an action happens from noun agreement
  level: 11
  topic: description
  english: A manner adverb such as быстро modifies an action without gender agreement. An adjective agrees with a noun, as быстрый ответ. Do not produce an adjective solely because the English word can describe both an action and a thing; some apparent -о forms also have predicative functions in context.
  examples:
  - {target: Анна отвечает ясно., english: Anna answers clearly.}
  - {target: Это ясный ответ., english: This is a clear answer.}
  lexical_anchors: [{lemma: ясно, hint: clearly}, {lemma: ясный, hint: clear}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-gender-agreement, ru-g-present-conjugation]
- id: ru-g-reported-statement
  ch: "[speaker] сказал, что [clause]"
  ds: Report a statement without automatic tense backshift
  level: 12
  topic: communication
  english: Что embeds a reported statement. Russian does not mechanically apply English-style tense backshift; select tense relative to the intended event and reporting context. Adjust person and deictic words carefully, preserving who made the claim rather than endorsing it as fact.
  examples:
  - {target: "Анна сказала, что работает дома.", english: "Anna said that she works at home."}
  - {target: "Игорь сообщил, что поезд уже приехал.", english: "Igor reported that the train had already arrived."}
  lexical_anchors: []
  fixed_forms: [что]
  grammar_prerequisites: [ru-g-past-agreement, ru-g-temporal-clauses]
- id: ru-g-relative-kotory
  ch: "[noun], который / которую / которому ..."
  ds: Decline a relative pronoun for its clause role
  level: 12
  topic: grammar
  english: Который agrees in gender and number with its antecedent, but its case comes from its job inside the relative clause. A feminine antecedent does not always require которую; for example, a recipient can require которой. Keep the clause's verb or preposition government visible.
  examples:
  - {target: "Это книга, которую я читаю.", english: "This is the book that I am reading."}
  - {target: "Это человек, которому я написал.", english: "This is the person to whom I wrote."}
  lexical_anchors: []
  fixed_forms: [который, которую, которому, которой]
  grammar_prerequisites: [ru-g-accusative-object, ru-g-dative-recipient, ru-g-gender-agreement]
- id: ru-g-po-dative
  ch: по [dative subject / route / recurring day]
  ds: Interpret selected по plus dative frames
  level: 12
  topic: learning
  english: По with the dative appears in distinct useful frames, including a subject area, movement along a route, and recurring days. Learn the whole relation rather than assigning по a single English meaning. Other по constructions can govern another case and are not licensed by this introductory pattern.
  examples:
  - {target: У нас урок по истории., english: We have a history lesson.}
  - {target: По понедельникам я работаю дома., english: I work at home on Mondays.}
  lexical_anchors: []
  fixed_forms: [по]
  grammar_prerequisites: [ru-g-dative-recipient, ru-g-routine-time]
- id: ru-g-reported-request
  ch: попросил [person] [infinitive] / попросил, чтобы ...
  ds: Relay a request while keeping the intended actor clear
  level: 12
  topic: communication
  english: Попросить can take an accusative person plus an infinitive, or a clause with чтобы and a past-form verb. The person asked is the understood performer of the infinitive. This is a requested event, not proof that it happened.
  examples:
  - {target: Анна попросила меня подождать., english: Anna asked me to wait.}
  - {target: "Я попросил, чтобы они написали ответ.", english: "I asked them to write a reply."}
  lexical_anchors: [{lemma: попросить, hint: ask someone to do something}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-purpose-chtoby, ru-g-animate-accusative]
- id: ru-g-comparative-frames
  ch: больше / лучше / дешевле, чем ...; [comparative] + [genitive]
  ds: Compare alternatives with чем or a genitive standard
  level: 13
  topic: description
  english: A simple comparative can introduce its standard with чем or a genitive noun. Learn irregular лучше, хуже, больше, and меньше with their meanings. Do not stack более onto a simple comparative or assume a short comparative agrees like a full adjective.
  examples:
  - {target: "Этот билет дешевле, чем тот.", english: "This ticket is cheaper than that one."}
  - {target: Анна старше Игоря., english: Anna is older than Igor.}
  lexical_anchors: []
  fixed_forms: [чем, лучше, хуже, больше, меньше]
  grammar_prerequisites: [ru-g-gender-agreement, ru-g-absence-genitive]
- id: ru-g-superlative-choice
  ch: самый [agreeing adjective]; лучше всего
  ds: Identify an extreme within a stated comparison set
  level: 13
  topic: description
  english: Самый and the following adjective agree with the noun; irregular or adverbial frames such as лучше всего behave differently. State the relevant comparison set instead of making an unrestricted best claim. Do not combine самый with a simple comparative such as лучше in ordinary standard usage.
  examples:
  - {target: Это самый короткий путь из трёх., english: This is the shortest of the three routes.}
  - {target: Здесь лучше всего видно реку., english: The river is best seen from here.}
  lexical_anchors: []
  fixed_forms: [самый, лучше всего]
  grammar_prerequisites: [ru-g-comparative-frames]
- id: ru-g-advice-preference
  ch: лучше [infinitive]; предпочитаю [object / infinitive]
  ds: Recommend an option without making it an obligation
  level: 13
  topic: leisure
  english: Лучше with an infinitive recommends an action, whereas предпочитать presents a preference. Neither inherently imposes a duty on the listener. Supply a reason and allow for another person's constraints rather than treating the recommendation as an objective universal.
  examples:
  - {target: Лучше поехать утром., english: It is better to go in the morning.}
  - {target: Я предпочитаю читать дома., english: I prefer reading at home.}
  lexical_anchors: [{lemma: предпочитать, hint: prefer}]
  fixed_forms: [лучше]
  grammar_prerequisites: [ru-g-comparative-frames, ru-g-current-motion]
- id: ru-g-cause-consequence
  ch: потому что [reason]; поэтому [consequence]
  ds: Distinguish a reason from the consequence it explains
  level: 13
  topic: reasoning
  english: Потому что introduces a reason, while поэтому points forward to a consequence. Reversing them can reverse the explanation. A grammatically causal sentence remains a claim that may need evidence, not an automatic demonstration of a causal relationship.
  examples:
  - {target: "Я остался дома, потому что устал.", english: "I stayed at home because I was tired."}
  - {target: "Автобус опоздал, поэтому мы пришли позже.", english: "The bus was late, so we arrived later."}
  lexical_anchors: []
  fixed_forms: [потому что, поэтому]
  grammar_prerequisites: [ru-g-temporal-clauses]
- id: ru-g-short-adjective-predicate
  ch: готов / готова / готовы; прав / права / правы
  ds: Interpret a short adjective as an agreeing predicate
  level: 13
  topic: description
  english: Short adjectives agree in gender and number when used as predicates but do not serve as ordinary declined noun modifiers. Not every adjective has a useful short form, and full versus short forms can differ lexically or stylistically rather than simply permanent versus temporary. Check each selected adjective's forms, stress, and complements.
  examples:
  - {target: "Анна готова, а Игорь ещё не готов.", english: "Anna is ready, but Igor is not ready yet."}
  - {target: "Вы правы в этом вопросе.", english: "You are right about this issue."}
  lexical_anchors: []
  fixed_forms: [готов, готова, готовы, прав, права, правы]
  grammar_prerequisites: [ru-g-gender-agreement, ru-g-polite-vy, ru-g-topic-prepositional]
- id: ru-g-needed-noun
  ch: мне нужен / нужна / нужно / нужны [noun]
  ds: Agree a needed item while distinguishing нужно to act
  level: 14
  topic: services
  english: With a needed noun as subject, нужен agrees in gender and number. Contrast Мне нужно письмо with Мне нужно написать письмо, where impersonal нужно precedes an infinitive. A feminine person does not automatically require нужна; agreement follows the thing needed.
  examples:
  - {target: Мне нужна новая карта., english: I need a new map.}
  - {target: "Нам нужны билеты, но сначала нужно узнать время.", english: "We need tickets, but first we need to find out the time."}
  lexical_anchors: []
  fixed_forms: [нужен, нужна, нужно, нужны]
  grammar_prerequisites: [ru-g-dative-need, ru-g-gender-agreement, ru-g-plural-agreement]
- id: ru-g-impersonal-time
  ch: мне было / будет [state]; не было / не будет [genitive]
  ds: Place an impersonal state or absence in time
  level: 14
  topic: services
  english: Past and future impersonal states commonly use neuter было or impersonal будет without agreeing with a dative experiencer. Existential absence uses не было or не будет with a genitive noun. Distinguish this from a personal subject such as Анна была дома.
  examples:
  - {target: В комнате было холодно., english: It was cold in the room.}
  - {target: Вчера у нас не было воды., english: Yesterday we had no water.}
  lexical_anchors: []
  fixed_forms: [было, будет, не было, не будет]
  grammar_prerequisites: [ru-g-absence-genitive, ru-g-past-agreement, ru-g-dative-need]
- id: ru-g-nelzya-aspect
  ch: нельзя [imperfective / perfective infinitive]
  ds: Clarify prohibition versus practical impossibility
  level: 14
  topic: services
  english: Нельзя with an imperfective often prohibits an activity; with a perfective it often expresses inability to achieve a result. Context can override a simple contrast, so ask what prevents the action. Нельзя here is an impersonal construction, not a statement that the person lacks a learned skill.
  examples:
  - {target: Здесь нельзя курить., english: Smoking is not allowed here.}
  - {target: Эту дверь нельзя открыть без ключа., english: This door cannot be opened without a key.}
  lexical_anchors: []
  fixed_forms: [нельзя]
  grammar_prerequisites: [ru-g-permission-request, ru-g-negated-aspect, ru-g-without-genitive]
- id: ru-g-negated-object-case
  ch: не [verb] [accusative / genitive object]
  ds: Interpret case choice for an object under negation
  level: 14
  topic: grammar
  english: Negated direct objects can take accusative or genitive, with lexical, semantic, and register influences. A specific established object often retains accusative; genitive is common in nonexistence or nonavailability readings. Do not teach an absolute rule that every не forces a genitive object.
  examples:
  - {target: Я не прочитал эту книгу., english: I did not finish reading this book.}
  - {target: Я не получил ответа., english: I received no reply.}
  lexical_anchors: []
  fixed_forms: [не]
  grammar_prerequisites: [ru-g-negated-aspect, ru-g-accusative-object, ru-g-absence-genitive]
- id: ru-g-numeral-case
  ch: с двумя [instrumental plural]; о трёх [prepositional plural]
  ds: Decline a numeral phrase for its governed role
  level: 14
  topic: grammar
  english: Outside basic nominative or accusative counting, the numeral and its noun must take the case required by the sentence. The genitive-singular pattern after два in a simple count is not preserved after every preposition. Introduce common governed phrases first; complex compound numerals and collective numerals require additional verified forms.
  examples:
  - {target: "Я говорил с двумя студентами.", english: "I spoke with two students."}
  - {target: "В отчёте говорится о трёх случаях.", english: "The report discusses three cases."}
  lexical_anchors: []
  fixed_forms: [двумя, трёх]
  grammar_prerequisites: [ru-g-small-quantities, ru-g-larger-quantities, ru-g-instrumental-means, ru-g-topic-prepositional]
- id: ru-g-obligation-agreement
  ch: должен / должна / должно / должны + [infinitive]
  ds: Express a duty with subject agreement
  level: 15
  topic: work
  english: Должен agrees with the subject and expresses an obligation or contextually an expectation. Contrast personal Мы должны with impersonal Нам нужно. The grammar does not establish that an alleged duty is legally binding; clarify who set the requirement.
  examples:
  - {target: Анна должна отправить ответ сегодня., english: Anna must send the reply today.}
  - {target: Мы должны уточнить срок., english: We need to clarify the deadline.}
  lexical_anchors: []
  fixed_forms: [должен, должна, должно, должны]
  grammar_prerequisites: [ru-g-needed-noun, ru-g-perfective-future]
- id: ru-g-managed-dative
  ch: "[dative person] удалось / не удалось + [infinitive]"
  ds: Report an achieved or unachieved opportunity
  level: 15
  topic: work
  english: Удалось is an impersonal past form with the successful actor in the dative. It reports managing to do something, not merely intending or being obligated to do it. Не удалось focuses on an unachieved outcome without specifying the cause by itself.
  examples:
  - {target: Нам удалось закончить работу., english: We managed to finish the work.}
  - {target: Мне не удалось связаться с Анной., english: I did not manage to contact Anna.}
  lexical_anchors: [{lemma: удаться, hint: succeed}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-dative-need, ru-g-negated-aspect]
- id: ru-g-dependency-government
  ch: зависеть от [genitive]; отвечать за [accusative]
  ds: State a dependency or responsibility precisely
  level: 15
  topic: work
  english: Зависеть от takes a genitive condition or factor. Отвечать за names responsibility with the accusative and is distinct from answering a question. The pinned lexical row has only answering meanings, so this original construction owns the responsibility frame without awarding that unrelated lexical sense. Learn the complete governed frame; the preposition alone does not supply its meaning.
  examples:
  - {target: Срок зависит от объёма работы., english: The deadline depends on the amount of work.}
  - {target: Анна отвечает за расписание., english: Anna is responsible for the schedule.}
  lexical_anchors: [{lemma: зависеть, hint: depend}]
  fixed_forms: [от, за, отвечать за]
  grammar_prerequisites: [ru-g-absence-genitive, ru-g-accusative-object]
- id: ru-g-simultaneous-gerund
  ch: Читая [object], [same actor's main action]
  ds: Link simultaneous actions with one understood actor
  level: 15
  topic: grammar
  english: An imperfective adverbial participle often supplies simultaneous background and normally shares the actor of the main clause. This condensed style is common in writing; an explicit пока clause may be clearer in conversation. Reject dangling combinations whose main subject cannot perform the background action.
  examples:
  - {target: "Читая письмо, Анна делала заметки.", english: "While reading the letter, Anna took notes."}
  - {target: "Обсуждая план, мы сравнивали варианты.", english: "While discussing the plan, we compared the options."}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-temporal-clauses, ru-g-narrative-aspect]
- id: ru-g-source-attribution
  ch: по словам [genitive source]; по данным [genitive source]
  ds: Attribute a report without endorsing it as fact
  level: 16
  topic: media
  english: По словам attributes what someone says, while по данным attributes information to a data source. Both require clear source identification. These phrases report provenance rather than certify reliability, and a speaker's statement should not be silently upgraded to independently observed evidence.
  examples:
  - {target: "По словам Анны, встреча начнётся позже.", english: "According to Anna, the meeting will start later."}
  - {target: "По данным отчёта, число заявок выросло.", english: "According to the report's data, the number of applications increased."}
  lexical_anchors: []
  fixed_forms: [по словам, по данным]
  grammar_prerequisites: [ru-g-reported-statement, ru-g-po-dative]
- id: ru-g-reflexive-passive
  ch: "[subject] обсуждается / проверяется [agent instrumental]"
  ds: Interpret a process-focused reflexive passive
  level: 16
  topic: media
  english: Some imperfective -ся forms function as passives, foregrounding what is being processed rather than the actor. They are not literally reflexive self-actions. An expressed agent can take the instrumental; compare an active paraphrase to check who is doing what.
  examples:
  - {target: План обсуждается группой., english: The plan is being discussed by the group.}
  - {target: Эти данные проверяются каждый день., english: These data are checked every day.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-reflexive-routines, ru-g-instrumental-means, ru-g-plural-agreement]
- id: ru-g-full-participial-description
  ch: книга, написанная [instrumental agent]
  ds: Read a participial phrase as a reduced description
  level: 16
  topic: media
  english: A full participle agrees with its noun in gender, number, and case while retaining verbal relationships inside the phrase. Compare a который clause to recover its meaning. Form and aspect distinguish active, passive, present, and past readings; do not derive every form by one suffix rule.
  examples:
  - {target: "Люди, ожидающие автобус, стоят у входа.", english: "The people waiting for the bus are standing by the entrance."}
  - {target: "Мы прочитали письмо, написанное Анной.", english: "We read the letter written by Anna."}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-relative-kotory, ru-g-narrative-aspect]
- id: ru-g-unspecified-plural-agent
  ch: здесь говорят / сообщили / открыли ...
  ds: Interpret a plural verb with an unspecified agent
  level: 16
  topic: society
  english: Russian can use a third-person plural verb without an overt subject when the actor is unspecified, generalized, or unimportant. Do not invent a named they in a report. Compare an active named-source sentence and a passive paraphrase, preserving any difference in certainty.
  examples:
  - {target: "Нам сообщили, что встреча отменена.", english: "We were told that the meeting had been cancelled."}
  - {target: Здесь продают книги., english: Books are sold here.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-reported-statement, ru-g-plural-agreement]
- id: ru-g-prefixed-motion
  ch: входить / войти; выходить / выйти; приезжать / приехать
  ds: Track direction and aspect in prefixed motion verbs
  level: 17
  topic: travel
  english: Motion prefixes contribute meanings such as entering, leaving, or arriving, not merely a generic perfective label. Many prefixed verbs form aspect pairs whose imperfective may be based on a nondirected stem. Learn each pair and its destination government; transport mode and figurative uses still matter.
  examples:
  - {target: "Когда автобус приехал, Анна вышла из дома.", english: "When the bus arrived, Anna left the house."}
  - {target: Каждый день он входит через эту дверь., english: Every day he enters through this door.}
  lexical_anchors: [{lemma: войти, hint: enter}, {lemma: выйти, hint: exit}, {lemma: приехать, hint: arrive by vehicle}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-habitual-motion, ru-g-origins-and-people, ru-g-narrative-aspect]
- id: ru-g-short-passive-result
  ch: "[subject] открыт / открыта / открыто / открыты"
  ds: Describe a result with a short passive participle
  level: 17
  topic: technology
  english: Short passive participles can present a resulting state or a completed passive event and agree with the subject. Compare дверь открыта with дверь открывается for a state versus a process. Use context and any time or agent expression instead of assuming every short form is timeless.
  examples:
  - {target: Дверь открыта., english: The door is open.}
  - {target: Все файлы были сохранены., english: All the files were saved.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-full-participial-description, ru-g-reflexive-passive, ru-g-past-agreement]
- id: ru-g-placement-result
  ch: класть / положить; ставить / поставить + [object and destination]
  ds: Distinguish laying or placing from the resulting position
  level: 17
  topic: actions
  english: Класть and положить form a common irregular lexical aspect relation; ставить and поставить present setting something in a standing or functional position. Compare destination accusative with the static location after placement. Do not use a nonexistent regular perfective built merely by adding an ending to класть.
  examples:
  - {target: Положите книгу на стол. Теперь книга на столе., english: Put the book on the table. Now the book is on the table.}
  - {target: Мы поставили стул у окна., english: We placed the chair by the window.}
  lexical_anchors: [{lemma: класть, hint: lay or put}, {lemma: положить, hint: put down}, {lemma: поставить, hint: set in position}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-place-direction-origin, ru-g-narrative-aspect, ru-g-imperative-aspect]
- id: ru-g-change-of-state
  ch: стало [comparative / state]; стать [instrumental role]
  ds: Describe a change of state rather than an action alone
  level: 17
  topic: nature
  english: Impersonal стало can describe a changed condition, whereas a personal стать sentence agrees with its subject and may take an instrumental role. Distinguish the change itself from evidence explaining its cause. Стать with an infinitive can also mark beginning an activity, introduced separately in later aspectual work.
  examples:
  - {target: После дождя стало прохладнее., english: After the rain it became cooler.}
  - {target: Анна стала руководителем проекта., english: Anna became the project leader.}
  lexical_anchors: [{lemma: стать, hint: become}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-impersonal-time, ru-g-comparative-frames, ru-g-occupation-instrumental]
- id: ru-g-real-condition
  ch: если [condition], то [consequence]
  ds: Propose a consequence under an open condition
  level: 18
  topic: reasoning
  english: Если frames an open condition; то can make its consequence explicit but is not always needed. Russian may use a future verb in the condition where English uses a present form. A conditional offer does not assert that the condition will be met.
  examples:
  - {target: "Если поезд опоздает, мы изменим план.", english: "If the train is late, we will change the plan."}
  - {target: "Если вам удобно, давайте встретимся утром.", english: "If it suits you, let's meet in the morning."}
  lexical_anchors: []
  fixed_forms: [если, то]
  grammar_prerequisites: [ru-g-perfective-future, ru-g-joint-invitation]
- id: ru-g-hypothetical-by
  ch: если бы [past-form condition], [past-form consequence] бы
  ds: Express a hypothetical or unreal condition
  level: 18
  topic: argument
  english: Бы with past-form verbs can express a hypothetical situation in the present, future, or past; the form alone is not a past-time claim. The particle is written separately and can appear in different positions. Use context to clarify whether a possibility is remote or contrary to fact.
  examples:
  - {target: "Если бы у нас было больше времени, мы обсудили бы детали.", english: "If we had more time, we would discuss the details."}
  - {target: "Я помог бы вам, если бы мог.", english: "I would help you if I could."}
  lexical_anchors: []
  fixed_forms: [если бы, бы]
  grammar_prerequisites: [ru-g-real-condition, ru-g-past-agreement]
- id: ru-g-tentative-polite-request
  ch: Я хотел / хотела бы ...; Не могли бы вы ...?
  ds: Soften a preference or request without implying inability
  level: 18
  topic: register
  english: Хотел бы or хотела бы can express a present polite wish rather than a past desire. Не могли бы вы is a conventional tentative request, not normally an accusation that the listener cannot act. Match agreement and address to the speaker and relationship.
  examples:
  - {target: Я хотела бы уточнить время., english: I would like to clarify the time.}
  - {target: "Не могли бы вы прислать ответ завтра?", english: "Could you send the reply tomorrow?"}
  lexical_anchors: []
  fixed_forms: [хотел бы, хотела бы, Не могли бы вы]
  grammar_prerequisites: [ru-g-hypothetical-by, ru-g-ability-moch, ru-g-polite-vy]
- id: ru-g-prior-completed-gerund
  ch: Прочитав [object], [same actor's main action]
  ds: Link a prior completed action to a following action
  level: 18
  topic: grammar
  english: A perfective adverbial participle commonly presents an action completed before the main event, with the same understood actor. This is a useful written condensation, not an instruction to compress every spoken account. Check irregular forms and replace a dangling phrase with an explicit clause.
  examples:
  - {target: "Прочитав письмо, Анна позвонила Игорю.", english: "After reading the letter, Anna called Igor."}
  - {target: "Проверив данные, мы изменили вывод.", english: "Having checked the data, we changed the conclusion."}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-simultaneous-gerund, ru-g-narrative-aspect]
- id: ru-g-epistemic-qualification
  ch: возможно / вероятно / по-видимому, [claim]
  ds: Qualify commitment to a claim
  level: 19
  topic: reasoning
  english: Introductory возможно, вероятно, and по-видимому mark different degrees or bases of uncertainty in context. They do not provide numerical probabilities or replace evidence. Distinguish introductory возможно from a predicate such as Это возможно meaning it is possible.
  examples:
  - {target: "Возможно, данные изменятся.", english: "The data may change."}
  - {target: "По-видимому, автор использовал другой источник.", english: "Apparently, the author used a different source."}
  lexical_anchors: []
  fixed_forms: [возможно, вероятно, по-видимому]
  grammar_prerequisites: [ru-g-reported-statement, ru-g-real-condition]
- id: ru-g-inference-from-evidence
  ch: судя по [dative evidence], [inference]
  ds: Mark the evidence used to make an inference
  level: 19
  topic: reasoning
  english: Судя по explicitly marks a basis for inference and governs the dative. It does not mean the conclusion has been directly observed. Contrast the data description with what the speaker infers from it, and state plausible limitations or alternatives.
  examples:
  - {target: "Судя по письму, встреча состоится завтра.", english: "Judging by the letter, the meeting will take place tomorrow."}
  - {target: "Судя по этим данным, спрос растёт.", english: "Judging by these data, demand is growing."}
  lexical_anchors: []
  fixed_forms: [судя по]
  grammar_prerequisites: [ru-g-source-attribution, ru-g-po-dative]
- id: ru-g-alleged-report
  ch: "[source] якобы [claim]"
  ds: Report an allegation with explicit distance
  level: 19
  topic: media
  english: Якобы attributes or distances a claim and can imply skepticism; it is not a neutral synonym for что. Use it only when that stance is intended, while identifying the actual source. It does not by itself show that the claim is false.
  examples:
  - {target: "Автор якобы проверил все данные, но проверки не описал.", english: "The author supposedly checked all the data but did not describe the checks."}
  - {target: "В письме говорится, что встречу якобы отменили.", english: "The letter says that the meeting was allegedly cancelled."}
  lexical_anchors: []
  fixed_forms: [якобы]
  grammar_prerequisites: [ru-g-reported-statement, ru-g-source-attribution]
- id: ru-g-only-if
  ch: только если [necessary condition]
  ds: State a necessary condition rather than a guarantee
  level: 19
  topic: argument
  english: Только если marks a condition required for a claim or action; it does not say that satisfying the condition guarantees the outcome. Keep only if distinct from if and from an actual observation. Test the intended direction of the dependency in a paraphrase.
  examples:
  - {target: "Мы примем предложение, только если сроки подходят.", english: "We will accept the proposal only if the timing works."}
  - {target: "Этот вывод верен, только если данные полны.", english: "This conclusion is valid only if the data are complete."}
  lexical_anchors: []
  fixed_forms: [только если]
  grammar_prerequisites: [ru-g-real-condition, ru-g-dependency-government]
- id: ru-g-action-nominalization
  ch: обсуждение [genitive object] [instrumental agent]
  ds: Recover participants in a nominalized action
  level: 20
  topic: institutions
  english: An action noun can encode the affected object as a genitive and the actor as an instrumental, but actual noun government varies. A genitive alone may be ambiguous between actor and object. Expand dense nominal phrasing into a finite clause to check responsibility and meaning.
  examples:
  - {target: Обсуждение проекта группой заняло час., english: The group's discussion of the project took an hour.}
  - {target: Проверка данных Анной изменила вывод., english: Anna's checking of the data changed the conclusion.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-reflexive-passive, ru-g-absence-genitive, ru-g-instrumental-means]
- id: ru-g-formal-dative-prepositions
  ch: согласно / вопреки / благодаря + [dative]
  ds: Interpret formal accordance, opposition, and enabling cause
  level: 20
  topic: institutions
  english: Согласно, вопреки, and благодаря govern dative in standard usage. They express different relations of accordance, opposition, and an enabling cause often evaluated positively. A sentence using согласно a rule reports an asserted basis; it is not advice about a law's validity or applicability.
  examples:
  - {target: "Согласно плану, работа начнётся завтра.", english: "According to the plan, work will begin tomorrow."}
  - {target: "Благодаря помощи коллег мы закончили раньше.", english: "Thanks to our colleagues' help, we finished earlier."}
  - {target: "Вопреки прогнозу, спрос снизился.", english: "Contrary to the forecast, demand decreased."}
  lexical_anchors: []
  fixed_forms: [согласно, вопреки, благодаря]
  grammar_prerequisites: [ru-g-po-dative, ru-g-source-attribution]
- id: ru-g-purpose-cause-prepositions
  ch: для / ради [genitive purpose]; из-за / вследствие [genitive cause]
  ds: Separate a purpose from an attributed cause
  level: 20
  topic: reasoning
  english: Для and ради introduce purposes or beneficiaries with different contextual emphasis; из-за and formal вследствие introduce causes. Shared genitive government does not make them synonyms. Ради can emphasize what motivates or justifies a sacrifice, while из-за often accompanies an unwelcome effect.
  examples:
  - {target: Мы изменили расписание для удобства участников., english: We changed the schedule for the participants' convenience.}
  - {target: "Из-за ошибки отчёт пришлось исправить.", english: "Because of an error, the report had to be corrected."}
  lexical_anchors: []
  fixed_forms: [для, ради, из-за, вследствие]
  grammar_prerequisites: [ru-g-cause-consequence, ru-g-purpose-chtoby, ru-g-absence-genitive]
- id: ru-g-nested-genitives
  ch: результаты [genitive modifier] [genitive modifier]
  ds: Resolve a dense genitive chain without losing attachment
  level: 20
  topic: institutions
  english: Several genitives can nest inside a noun phrase, but their attachment can be unclear. Identify the head noun and each relation before paraphrasing. Prefer a clause or prepositional alternative when a chain obscures who did what; grammatical density is not itself precision.
  examples:
  - {target: Изменение срока подачи заявок вызвало вопросы., english: The change to the application submission deadline raised questions.}
  - {target: Мы обсудили результаты проверки качества воды., english: We discussed the results of the water quality test.}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-action-nominalization, ru-g-relative-kotory]
- id: ru-g-method-nominal-frames
  ch: путём / посредством + [genitive method]
  ds: Interpret a formally stated method or means
  level: 21
  topic: science
  english: Путём and посредством take the genitive and often package a method as a noun phrase. Путём in this function is not a literal route description. Expand the action noun when the method's actor or procedure is unclear; formal phrasing does not certify a method's adequacy.
  examples:
  - {target: Ошибку нашли путём сравнения двух списков., english: The error was found by comparing two lists.}
  - {target: Данные передаются посредством сети., english: The data are transmitted through a network.}
  lexical_anchors: []
  fixed_forms: [путём, посредством]
  grammar_prerequisites: [ru-g-action-nominalization, ru-g-reflexive-passive]
- id: ru-g-correlative-comparison
  ch: чем [comparative], тем [comparative]
  ds: Express a covarying comparison without proving causation
  level: 21
  topic: science
  english: Чем ... тем connects two comparative changes. It can describe an asserted dependency or observed tendency, not automatically a causal mechanism or universal law. Keep the comparison conditions and any limitations explicit.
  examples:
  - {target: "Чем точнее данные, тем надёжнее вывод.", english: "The more accurate the data, the more reliable the conclusion."}
  - {target: "Чем дольше мы наблюдаем, тем больше замечаем различий.", english: "The longer we observe, the more differences we notice."}
  lexical_anchors: []
  fixed_forms: [чем, тем]
  grammar_prerequisites: [ru-g-comparative-frames, ru-g-dependency-government]
- id: ru-g-impersonal-evidence-clause
  ch: известно / установлено / показано, что [claim]
  ds: Examine a claim packaged as established information
  level: 21
  topic: science
  english: Impersonal predicates can present a claim as known, established, or shown. Recover who established it and by what method rather than accepting the grammatical packaging as proof. Distinguish a source's reported result from the tutor's own assessment of the evidence.
  examples:
  - {target: "В отчёте показано, что результаты различаются.", english: "The report shows that the results differ."}
  - {target: "Пока не установлено, что вызвало изменение.", english: "It has not yet been established what caused the change."}
  lexical_anchors: []
  fixed_forms: [известно, установлено, показано]
  grammar_prerequisites: [ru-g-short-passive-result, ru-g-reported-statement, ru-g-source-attribution]
- id: ru-g-participial-process-result
  ch: измеряемый / измеренный; получаемый / полученный
  ds: Distinguish a participial process from a completed result
  level: 21
  topic: science
  english: Full passive participles can contrast an ongoing, habitual, or intended process with an already completed result according to tense, aspect, and context. Both agree with their head noun. Do not assign completion merely because a phrase is passive, and do not mechanically generate unsupported participles.
  examples:
  - {target: Измеряемая величина зависит от температуры., english: The quantity being measured depends on temperature.}
  - {target: "Мы сравнили значения, полученные вчера.", english: "We compared the values obtained yesterday."}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-full-participial-description, ru-g-short-passive-result, ru-g-narrative-aspect]
- id: ru-g-concession
  ch: хотя [clause]; несмотря на [accusative noun]
  ds: Acknowledge a fact while resisting its expected implication
  level: 22
  topic: argument
  english: Хотя introduces a concessive clause; несмотря на introduces a noun phrase in the accusative. Despite its historical appearance, this preposition is not the ordinary negative adverbial phrase не смотря meaning not looking. Concession acknowledges a fact while resisting an expected implication.
  examples:
  - {target: "Хотя план полезен, он требует времени.", english: "Although the plan is useful, it requires time."}
  - {target: "Несмотря на различия, мы нашли общую цель.", english: "Despite our differences, we found a shared goal."}
  lexical_anchors: []
  fixed_forms: [хотя, несмотря на]
  grammar_prerequisites: [ru-g-cause-consequence, ru-g-accusative-object]
- id: ru-g-concessive-ni
  ch: как бы ни / кто бы ни / где бы ни ...
  ds: Generalize across alternatives in a concessive clause
  level: 22
  topic: argument
  english: These concessive clauses say that a result holds across possible people, places, or degrees. Ни reinforces the generalization rather than negating the verb in the way не would. Do not infer that every бы clause describes an unreal past event.
  examples:
  - {target: "Как бы ни различались мнения, вопрос стоит обсудить.", english: "However much opinions differ, the issue is worth discussing."}
  - {target: "Кто бы ни предложил идею, её нужно проверить.", english: "Whoever proposed the idea, it needs to be checked."}
  lexical_anchors: []
  fixed_forms: [как бы ни, кто бы ни, где бы ни]
  grammar_prerequisites: [ru-g-concession, ru-g-hypothetical-by, ru-g-negative-pronouns]
- id: ru-g-qualified-generalization
  ch: не все / далеко не все / не всегда / в некоторых случаях
  ds: Restrict a generalization without reversing it
  level: 22
  topic: society
  english: Не все means not all, not none; не всегда means not always, not never. Далеко не strengthens the restriction but supplies no numeric proportion. Name a relevant group or circumstance rather than converting one person's experience into a claim about everyone.
  examples:
  - {target: Не все участники согласились с выводом., english: Not all participants agreed with the conclusion.}
  - {target: "В некоторых случаях этот подход не помогает.", english: "In some cases, this approach does not help."}
  lexical_anchors: []
  fixed_forms: [не все, далеко не все, не всегда, в некоторых случаях]
  grammar_prerequisites: [ru-g-negative-pronouns, ru-g-basic-negation]
- id: ru-g-viewpoint-frame
  ch: с точки зрения [genitive perspective]; для [genitive experiencer]
  ds: Attribute an evaluation to a particular perspective
  level: 22
  topic: culture
  english: С точки зрения identifies a viewpoint or evaluative framework, while для can restrict an evaluation to a person or group. Neither makes the viewpoint universal or immune to evidence. Clarify whether a perspective is attributed to an actual source or proposed hypothetically.
  examples:
  - {target: "С точки зрения автора, перемены необходимы.", english: "From the author's perspective, the changes are necessary."}
  - {target: "Для Анны этот обычай новый.", english: "For Anna, this custom is new."}
  lexical_anchors: []
  fixed_forms: [с точки зрения, для]
  grammar_prerequisites: [ru-g-source-attribution, ru-g-purpose-cause-prepositions]
- id: ru-g-sufficient-necessary
  ch: достаточно / недостаточно [genitive or infinitive], чтобы ...
  ds: Distinguish enough for an outcome from merely required
  level: 23
  topic: argument
  english: Достаточно and недостаточно assess whether an amount or action is enough for a stated result. Contrast sufficiency with the necessary-condition frame только если. Specify the criterion and avoid claiming that the construction itself proves a conclusion logically follows.
  examples:
  - {target: "Одного примера недостаточно, чтобы подтвердить правило.", english: "One example is not enough to confirm the rule."}
  - {target: "Достаточно изменить один параметр, чтобы получить другой результат.", english: "Changing one parameter is enough to obtain a different result."}
  lexical_anchors: []
  fixed_forms: [достаточно, недостаточно]
  grammar_prerequisites: [ru-g-only-if, ru-g-purpose-chtoby, ru-g-larger-quantities]
- id: ru-g-not-so-much
  ch: не столько [A], сколько [B]
  ds: Rebalance an explanation rather than deny its first part
  level: 23
  topic: argument
  english: Не столько ... сколько shifts emphasis from the first characterization to the second without necessarily denying the first. Keep the paired parts structurally comparable. It is an argumentative framing choice, not a measurement of how much each cause contributes.
  examples:
  - {target: "Проблема не столько в цене, сколько в сроках.", english: "The problem is not so much the price as the timing."}
  - {target: "Он не столько спорил, сколько уточнял условия.", english: "He was not so much arguing as clarifying the conditions."}
  lexical_anchors: []
  fixed_forms: [не столько, сколько]
  grammar_prerequisites: [ru-g-concession, ru-g-qualified-generalization]
- id: ru-g-exception-inclusion
  ch: кроме [genitive]; за исключением [genitive]
  ds: Clarify an exception versus an additional member
  level: 23
  topic: argument
  english: Кроме can exclude an item or add one depending on context. За исключением explicitly signals exclusion. State enough context to prevent an excluding except from being misread as an including besides, especially when qualifying a general claim.
  examples:
  - {target: "Все ответили, кроме Игоря.", english: "Everyone answered except Igor."}
  - {target: "Кроме отчёта, мы подготовили краткое письмо.", english: "Besides the report, we prepared a short letter."}
  lexical_anchors: []
  fixed_forms: [кроме, за исключением]
  grammar_prerequisites: [ru-g-qualified-generalization, ru-g-absence-genitive]
- id: ru-g-phase-verb-aspect
  ch: начать / продолжать / перестать + [imperfective infinitive]
  ds: Place an activity inside a beginning, continuation, or end
  level: 23
  topic: actions
  english: Verbs of beginning, continuing, and ceasing normally take an imperfective infinitive for the activity whose phase is described. The phase verb itself may be perfective or imperfective. Перестал читать reports stopping reading, not necessarily finishing the text.
  examples:
  - {target: Анна начала проверять данные., english: Anna began checking the data.}
  - {target: "Он перестал читать, но не дочитал статью.", english: "He stopped reading but did not finish the article."}
  lexical_anchors: [{lemma: начать, hint: begin}, {lemma: продолжать, hint: continue}, {lemma: перестать, hint: stop doing}]
  fixed_forms: []
  grammar_prerequisites: [ru-g-narrative-aspect, ru-g-negated-aspect]
- id: ru-g-balanced-synthesis
  ch: с одной стороны ... с другой стороны ...
  ds: Organize two considerations without forcing equal weight
  level: 24
  topic: argument
  english: This pair structures contrasting considerations, not a claim that they have equal evidential weight. Make both sides relevant to the same decision and then state how they affect the conclusion. Avoid presenting a weak unsupported claim as equivalent to documented evidence merely for symmetry.
  examples:
  - {target: "С одной стороны, план прост. С другой стороны, он не учитывает сроки.", english: "On the one hand, the plan is simple. On the other hand, it does not account for the timing."}
  - {target: "С одной стороны, данных мало; с другой стороны, они согласуются.", english: "On the one hand, there are few data; on the other hand, they are consistent."}
  lexical_anchors: []
  fixed_forms: [с одной стороны, с другой стороны]
  grammar_prerequisites: [ru-g-concession, ru-g-source-attribution]
- id: ru-g-correlative-reference
  ch: тот, кто ...; то, что ...; о том, что ...
  ds: Track reference across a correlative clause boundary
  level: 24
  topic: grammar
  english: A demonstrative in the main clause and a relative or content clause can carry different case requirements. Compare о том, что for discussing a fact with то, что as a clause-linked object or subject. Identify each element's role rather than making all related words the same case.
  examples:
  - {target: "Тот, кто проверял данные, объяснил метод.", english: "The person who checked the data explained the method."}
  - {target: "Мы говорили о том, что изменилось.", english: "We talked about what had changed."}
  lexical_anchors: []
  fixed_forms: [тот, кто, то, что, о том]
  grammar_prerequisites: [ru-g-relative-kotory, ru-g-reported-statement, ru-g-location-prepositional]
- id: ru-g-contrast-sources
  ch: "[source] утверждает, что ...; тогда как [other source] ..."
  ds: Keep conflicting sources and their claims distinct
  level: 24
  topic: media
  english: Тогда как can contrast claims or circumstances rather than describe their timing. Attribute each proposition explicitly and preserve differences in scope or uncertainty. A contrastive sentence does not by itself establish that either source is correct or that the claims truly contradict one another.
  examples:
  - {target: "Первый отчёт описывает рост, тогда как второй отмечает спад.", english: "The first report describes growth, whereas the second notes a decline."}
  - {target: "Автор говорит об отдельных случаях, тогда как критик обсуждает общее правило.", english: "The author discusses individual cases, whereas the critic discusses a general rule."}
  lexical_anchors: []
  fixed_forms: [тогда как]
  grammar_prerequisites: [ru-g-source-attribution, ru-g-qualified-generalization]
- id: ru-g-formal-conclusion
  ch: таким образом / следовательно ...; однако ...
  ds: Mark a conclusion and preserve a relevant limitation
  level: 24
  topic: argument
  english: Таким образом can summarize a reasoning sequence, and следовательно explicitly presents an inference. Однако introduces a contrast or limitation. These connectors label a proposed relation; the argument must still support it. Distinguish concluding thus from a literal manner use of таким образом.
  examples:
  - {target: "Таким образом, оба источника описывают одно изменение.", english: "Thus, both sources describe the same change."}
  - {target: "Следовательно, вывод нужно уточнить. Однако новых данных пока нет.", english: "Consequently, the conclusion needs qualification. However, there are no new data yet."}
  lexical_anchors: []
  fixed_forms: [таким образом, следовательно, однако]
  grammar_prerequisites: [ru-g-cause-consequence, ru-g-contrast-sources, ru-g-epistemic-qualification]
- id: ru-g-information-focus
  ch: Анна прочитала письмо. Письмо прочитала Анна.
  ds: Interpret focus shifts without discarding case marking
  level: 25
  topic: register
  english: Russian word order is flexible but not arbitrary; context and spoken emphasis help distinguish known information from focus. Case still identifies roles. Compare a neutral event report with an answer emphasizing who acted, and do not claim text alone reveals the speaker's actual intonation.
  examples:
  - {target: "Что сделала Анна? Анна прочитала письмо.", english: "What did Anna do? Anna read the letter."}
  - {target: "Кто прочитал письмо? Письмо прочитала Анна.", english: "Who read the letter? Anna was the one who read the letter."}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-accusative-object, ru-g-narrative-aspect, ru-g-correlative-reference]
- id: ru-g-shared-ground-particles
  ch: ведь / же [contextual proposition]
  ds: Interpret an appeal to shared knowledge or contrast
  level: 25
  topic: register
  english: Ведь can present something as shared knowledge or a reason; же can emphasize a reminder or contrast, with other uses in context. Neither has one fixed English translation. An appeal to what everyone supposedly knows may be contestable rather than evidence that it is true.
  examples:
  - {target: "Возьмите карту, ведь дорога незнакомая.", english: "Take a map, since the route is unfamiliar."}
  - {target: Я же просил уточнить время., english: But I did ask you to clarify the time.}
  lexical_anchors: []
  fixed_forms: [ведь, же]
  grammar_prerequisites: [ru-g-cause-consequence, ru-g-information-focus]
- id: ru-g-seeming-comparison
  ch: будто / как будто [clause]
  ds: Interpret seeming or resemblance without asserting reality
  level: 25
  topic: feelings
  english: Будто and как будто can frame resemblance, appearance, or a distanced report depending on context. An as-if comparison does not assert that its imagined situation is real. Compare a source-attributed allegation rather than treating every будто as equivalent to skeptical якобы.
  examples:
  - {target: "Он говорил так, будто знал ответ.", english: "He spoke as if he knew the answer."}
  - {target: "Мне кажется, будто мы уже обсуждали этот вопрос.", english: "It seems to me as though we have already discussed this issue."}
  lexical_anchors: []
  fixed_forms: [будто, как будто]
  grammar_prerequisites: [ru-g-alleged-report, ru-g-epistemic-qualification]
- id: ru-g-focus-particle-scope
  ch: только [focused element]; даже [focused element]
  ds: Identify what only or even places in focus
  level: 25
  topic: register
  english: The position and context of только and даже help determine their scope. Only Anna read the letter differs from Anna read only the letter. Даже marks something presented as noteworthy or unexpected, not an objective scale known independently of the speaker.
  examples:
  - {target: Только Анна прочитала письмо., english: Only Anna read the letter.}
  - {target: Анна прочитала только письмо., english: Anna read only the letter.}
  - {target: Даже Игорь согласился., english: Even Igor agreed.}
  lexical_anchors: []
  fixed_forms: [только, даже]
  grammar_prerequisites: [ru-g-information-focus, ru-g-only-if]
- id: ru-g-request-register
  ch: Давай ... / Пожалуйста, ... / Прошу вас ...
  ds: Recast the same request for a different relationship
  level: 26
  topic: register
  english: Familiar joint invitations, polite imperatives, and formal прошу вас requests signal different relationships and task roles. A formally grammatical request can still sound brusque or bureaucratic. Keep the intended action constant while changing wording and explaining the likely social effect.
  examples:
  - {target: Давай обсудим сроки., english: Let's discuss the timing. (familiar)}
  - {target: Прошу вас уточнить сроки., english: Please clarify the timing. (formal)}
  lexical_anchors: []
  fixed_forms: [Прошу вас]
  grammar_prerequisites: [ru-g-joint-invitation, ru-g-tentative-polite-request]
- id: ru-g-softened-disagreement
  ch: не совсем ...; боюсь, что ...; мне кажется, ...
  ds: Soften disagreement while retaining its actual content
  level: 26
  topic: register
  english: Не совсем can limit a disagreement; боюсь, что can conventionally introduce unwelcome information without describing literal fear. Softening should not conceal a consequential objection. Contrast the polite frame with the underlying proposition and avoid overusing hedges where clarity matters.
  examples:
  - {target: Я не совсем согласен с этим выводом., english: I do not entirely agree with this conclusion.}
  - {target: "Боюсь, что этот срок нам не подходит.", english: "I am afraid that this deadline does not work for us."}
  lexical_anchors: []
  fixed_forms: [не совсем, боюсь, что, мне кажется]
  grammar_prerequisites: [ru-g-epistemic-qualification, ru-g-viewpoint-frame, ru-g-feeling-government]
- id: ru-g-diminutive-register
  ch: минута / минутка; вопрос / вопросик
  ds: Interpret a diminutive's contextual social effect
  level: 26
  topic: register
  english: Diminutives can suggest smallness, affection, informality, irony, or an attempt to minimize a request. They are not automatically kinder, and suffix formation and stress are lexical matters. Treat the example forms as construction-owned contrasts unless separately sourced lexical identities are deliberately selected.
  examples:
  - {target: "У вас есть минутка?", english: "Do you have a little moment? (informal softening)"}
  - {target: "У меня один вопросик, но ответ требует времени.", english: "I have one little question, but the answer takes time."}
  lexical_anchors: []
  fixed_forms: [минутка, вопросик]
  grammar_prerequisites: [ru-g-possession-existence, ru-g-request-register]
- id: ru-g-impersonal-preference
  ch: хотелось бы / представляется, что ...
  ds: Recognize distancing that leaves the viewpoint implicit
  level: 26
  topic: register
  english: Хотелось бы can soften a wish without an overt first-person subject; представляется, что presents an assessment impersonally. Such phrasing can obscure who wants or judges something. Recover or name the perspective when accountability matters rather than equating impersonal style with objectivity.
  examples:
  - {target: Хотелось бы уточнить один вопрос., english: I would like to clarify one issue.}
  - {target: "Представляется, что вывод требует уточнения.", english: "It appears that the conclusion needs qualification."}
  lexical_anchors: []
  fixed_forms: [хотелось бы, представляется]
  grammar_prerequisites: [ru-g-impersonal-time, ru-g-tentative-polite-request, ru-g-viewpoint-frame]
- id: ru-g-hands-time-idiom
  ch: у [person] руки не доходят до [genitive task]
  ds: Say someone has not got around to a task
  level: 27
  topic: register
  english: This conversational idiom means not getting around to a task, often because of competing demands. It is not literal hand movement and does not prove the task is impossible. Use a neutral paraphrase in a formal explanation and avoid treating the whole idiom as mastery of every component sense.
  examples:
  - {target: У меня руки не доходят до этого письма., english: I have not got around to this letter.}
  - {target: До ремонта у нас пока руки не доходят., english: We have not got around to the repairs yet.}
  lexical_anchors: []
  fixed_forms: [руки не доходят до]
  grammar_prerequisites: [ru-g-possession-existence, ru-g-basic-negation, ru-g-information-focus]
- id: ru-g-conversational-ellipsis
  ch: Я за. А вы? Мне тоже.
  ds: Recover omitted material in a short contextual reply
  level: 27
  topic: communication
  english: Short replies can omit material recoverable from the preceding turn. Retained case or a preposition may reveal the missing relation, as Мне тоже following a dative-experiencer sentence. Do not reconstruct a unique meaning without sufficient context, and expand the reply when ambiguity matters.
  examples:
  - {target: Давайте начнём утром. Я за., english: Let's start in the morning. I am in favour.}
  - {target: Мне нравится этот план. Мне тоже., english: I like this plan. So do I.}
  lexical_anchors: []
  fixed_forms: [Я за, А вы, Мне тоже]
  grammar_prerequisites: [ru-g-dative-liking, ru-g-joint-invitation, ru-g-information-focus]
- id: ru-g-despite-expectation-particle
  ch: всё-таки [clause]
  ds: Mark persistence or an outcome contrary to expectation
  level: 27
  topic: register
  english: Всё-таки can signal an outcome despite an obstacle, renewed insistence, or a conclusion after doubt. Preserve the hyphen and ё. It is a fixed particle use, not an automatic vocabulary credit for an unrelated interpretation of всё as everything.
  examples:
  - {target: "Было поздно, но Анна всё-таки позвонила.", english: "It was late, but Anna called after all."}
  - {target: "И всё-таки этот вопрос стоит обсудить.", english: "Even so, this issue is worth discussing."}
  lexical_anchors: []
  fixed_forms: [всё-таки]
  grammar_prerequisites: [ru-g-concession, ru-g-shared-ground-particles]
- id: ru-g-preoccupied-ne-do
  ch: "[dative person] не до [genitive activity]"
  ds: Say circumstances leave no attention for an activity
  level: 27
  topic: feelings
  english: Не до with a dative experiencer expresses being in no position or mood to attend to something. It is not the ordinary spatial or temporal до meaning up to. Depending on tone, it can sound dismissive, so choose a fuller explanation for a sensitive interaction.
  examples:
  - {target: Сейчас мне не до споров., english: I cannot concern myself with arguments right now.}
  - {target: "После такой новости нам было не до шуток.", english: "After that news, we were in no mood for jokes."}
  lexical_anchors: []
  fixed_forms: [не до]
  grammar_prerequisites: [ru-g-dative-need, ru-g-impersonal-time, ru-g-absence-genitive]
- id: ru-g-bounds-degree
  ch: по крайней мере / не менее / не более [quantity]
  ds: State a lower or upper bound rather than an exact amount
  level: 28
  topic: reasoning
  english: Не менее states a lower bound and не более an upper bound in quantity contexts. По крайней мере can mean at least quantitatively or introduce a limited concession. Distinguish a bound from an estimate or exact count, and make the comparison set explicit when needed.
  examples:
  - {target: Нам нужно не менее трёх примеров., english: We need at least three examples.}
  - {target: Ответ займёт не более двух страниц., english: The answer will take no more than two pages.}
  lexical_anchors: []
  fixed_forms: [по крайней мере, не менее, не более]
  grammar_prerequisites: [ru-g-larger-quantities, ru-g-qualified-generalization, ru-g-sufficient-necessary]
- id: ru-g-until-before
  ch: пока не [endpoint]; прежде чем [action]
  ds: Distinguish an until endpoint from a before relation
  level: 28
  topic: time
  english: Пока не with an event often marks the endpoint until it happens; its не need not mean the endpoint never occurs. Прежде чем places one action before another and can take an infinitive when the actor is shared. Compare these with simultaneous пока and retain appropriate aspect.
  examples:
  - {target: "Я подожду, пока вы не закончите.", english: "I will wait until you finish."}
  - {target: "Прежде чем ответить, я проверю источник.", english: "Before answering, I will check the source."}
  lexical_anchors: []
  fixed_forms: [пока не, прежде чем]
  grammar_prerequisites: [ru-g-temporal-clauses, ru-g-negated-aspect, ru-g-prior-completed-gerund]
- id: ru-g-instead-of-action
  ch: вместо того чтобы [infinitive / clause]
  ds: Contrast a chosen action with a displaced alternative
  level: 28
  topic: reasoning
  english: Вместо того чтобы contrasts an actual or proposed action with one not taken or not preferred. An infinitive often has the main clause's understood actor. Do not infer that the displaced alternative was impossible; the construction can convey criticism depending on context.
  examples:
  - {target: "Вместо того чтобы спорить, мы уточнили условия.", english: "Instead of arguing, we clarified the conditions."}
  - {target: "Вместо того чтобы повторять вывод, объясните метод.", english: "Instead of repeating the conclusion, explain the method."}
  lexical_anchors: []
  fixed_forms: [вместо того чтобы]
  grammar_prerequisites: [ru-g-purpose-chtoby, ru-g-phase-verb-aspect]
- id: ru-g-explicit-clarification
  ch: то есть / а именно [clarification]
  ds: Restate a meaning or specify its members precisely
  level: 28
  topic: communication
  english: То есть offers an equivalent restatement or correction, while а именно specifies what a preceding expression refers to. An example introduced by например is not necessarily an exhaustive definition. Make sure the clarification preserves rather than silently strengthens the original claim.
  examples:
  - {target: "Нужен письменный ответ, то есть письмо или сообщение.", english: "A written reply is needed, that is, a letter or message."}
  - {target: "Мы проверили два параметра, а именно время и объём.", english: "We checked two parameters, namely time and volume."}
  lexical_anchors: []
  fixed_forms: [то есть, а именно]
  grammar_prerequisites: [ru-g-correlative-reference, ru-g-sufficient-necessary]
- id: ru-g-rhetorical-questions
  ch: Разве ...? Неужели ...?
  ds: Interpret question particles without assuming neutrality
  level: 29
  topic: argument
  english: Разве often challenges an expectation or invites confirmation of a contrary view; неужели commonly signals surprise or disbelief. They can still occur in genuine questions. Infer stance cautiously from context and do not claim that a question proves the implied answer.
  examples:
  - {target: "Разве одного примера достаточно?", english: "Is one example really enough?"}
  - {target: "Неужели оба источника ошиблись?", english: "Could both sources really have been mistaken?"}
  lexical_anchors: []
  fixed_forms: [Разве, Неужели]
  grammar_prerequisites: [ru-g-indirect-li, ru-g-shared-ground-particles, ru-g-sufficient-necessary]
- id: ru-g-labelled-distance
  ch: так называемый [agreeing noun phrase]
  ds: Interpret a reported label and possible skeptical distance
  level: 29
  topic: media
  english: Так называемый can introduce a recognized term or distance the speaker from a label, depending on context. Agreement follows the noun. Quotation marks likewise do not always mean irony; distinguish a term being discussed from a claim that its referent is fraudulent.
  examples:
  - {target: Автор описывает так называемый эффект новизны., english: The author describes the so-called novelty effect.}
  - {target: Так называемое решение оставило главный вопрос открытым., english: The so-called solution left the main question unresolved.}
  lexical_anchors: []
  fixed_forms: [так называемый]
  grammar_prerequisites: [ru-g-full-participial-description, ru-g-alleged-report, ru-g-viewpoint-frame]
- id: ru-g-narrative-present
  ch: Вчера [present-tense narrative events]
  ds: Interpret a narrative present within a past setting
  level: 29
  topic: literature
  english: A speaker or narrator may shift to present tense to make a past scene vivid. The established time frame, not the isolated present ending, controls its temporal interpretation. Distinguish deliberate storytelling from an accidental tense inconsistency and offer a neutral past-tense paraphrase.
  examples:
  - {target: Вчера иду домой и вижу знакомого., english: Yesterday I am walking home and see someone I know. (vivid narrative)}
  - {target: В тот вечер Анна открывает письмо и сразу звонит другу., english: That evening Anna opens the letter and immediately calls a friend. (narrative present)}
  lexical_anchors: []
  fixed_forms: []
  grammar_prerequisites: [ru-g-present-conjugation, ru-g-narrative-aspect, ru-g-information-focus]
- id: ru-g-figurative-comparison
  ch: словно [image]; как [comparison]
  ds: Interpret an image without converting it into a factual claim
  level: 29
  topic: arts
  english: Словно and comparative как can create imagery, but как also has other grammatical functions. Identify the shared quality inferred in context and contrast the image with a literal paraphrase. Original examples here are teaching illustrations, not quotations from a literary source.
  examples:
  - {target: Город словно уснул под снегом., english: The city seemed to fall asleep under the snow.}
  - {target: Её слова звучали как приглашение к разговору., english: Her words sounded like an invitation to talk.}
  lexical_anchors: []
  fixed_forms: [словно, как]
  grammar_prerequisites: [ru-g-seeming-comparison, ru-g-viewpoint-frame]
- id: ru-g-even-if
  ch: даже если [condition], [maintained claim]
  ds: Keep a claim conditional while conceding a possibility
  level: 30
  topic: argument
  english: Даже если concedes a possible condition while maintaining the main claim. Contrast factual хотя with a condition not asserted to hold. A hypothetical counterexample should remain hypothetical throughout an extended explanation, rather than becoming an assumed fact in the conclusion.
  examples:
  - {target: "Даже если данные верны, вывод требует уточнения.", english: "Even if the data are correct, the conclusion needs qualification."}
  - {target: "Даже если сроки изменятся, мы сохраним порядок проверки.", english: "Even if the timing changes, we will keep the review procedure."}
  lexical_anchors: []
  fixed_forms: [даже если]
  grammar_prerequisites: [ru-g-real-condition, ru-g-concession, ru-g-focus-particle-scope]
- id: ru-g-otherwise-consequence
  ch: если не ..., то ...; иначе ...
  ds: State what follows if a requirement is not met
  level: 30
  topic: reasoning
  english: Иначе can mean otherwise in a conditional consequence or differently as a manner word. Make the relevant unmet condition explicit, especially in a sustained argument. Do not confuse an alternative outcome with a logically inevitable one unless the premises support that strength.
  examples:
  - {target: "Нужно назвать источник, иначе вывод нельзя проверить.", english: "The source must be named; otherwise the conclusion cannot be checked."}
  - {target: "Если условия не совпадают, то результаты нельзя сравнивать напрямую.", english: "If the conditions do not match, the results cannot be compared directly."}
  lexical_anchors: []
  fixed_forms: [иначе, если не, то]
  grammar_prerequisites: [ru-g-only-if, ru-g-nelzya-aspect, ru-g-formal-conclusion]
- id: ru-g-explicit-self-repair
  ch: точнее / вернее / иными словами [reformulation]
  ds: Revise a claim openly instead of silently changing its scope
  level: 30
  topic: communication
  english: Точнее narrows or improves precision, вернее can correct a previous formulation, and иными словами paraphrases. State whether a revision changes the claim or only its wording. Keep the corrected proposition recoverable for a reader following an extended argument.
  examples:
  - {target: "Все участники ответили, точнее, все присутствовавшие.", english: "All participants answered; more precisely, all those present did."}
  - {target: "Данных недостаточно; иными словами, вывод пока предварительный.", english: "The data are insufficient; in other words, the conclusion is still provisional."}
  lexical_anchors: []
  fixed_forms: [точнее, вернее, иными словами]
  grammar_prerequisites: [ru-g-explicit-clarification, ru-g-qualified-generalization, ru-g-epistemic-qualification]
- id: ru-g-framed-claim
  ch: речь идёт о [prepositional]; это не означает, что ...
  ds: Define an argument's scope and block an unwarranted inference
  level: 30
  topic: argument
  english: Речь идёт о identifies the subject under discussion, not literal motion of speech. Это не означает, что explicitly rejects an inference while leaving the previous claim intact. Use these frames to keep an extended project's scope and limitations stable through revision.
  examples:
  - {target: "Речь идёт о двух случаях, а не об общем правиле.", english: "We are discussing two cases, not a general rule."}
  - {target: "Результаты совпали, но это не означает, что методы одинаковы.", english: "The results matched, but this does not mean that the methods are identical."}
  lexical_anchors: []
  fixed_forms: [речь идёт о, это не означает, что]
  grammar_prerequisites: [ru-g-correlative-reference, ru-g-formal-conclusion, ru-g-qualified-generalization]
- id: ru-g-professional-request
  ch: Прошу вас [infinitive]. Просим [infinitive].
  ds: Write a clear formal request with a stated action
  level: professional
  topic: work
  english: Прошу or institutional просим can make a professional request explicit, usually with an infinitive and any necessary object, reason, or timing. It can sound directive, so choose a tentative alternative when the relationship calls for it. This productive branch practices language, not authority to impose a requirement.
  examples:
  - {target: Прошу вас подтвердить время встречи., english: Please confirm the meeting time. (formal)}
  - {target: Просим прислать ответ до пятницы., english: Please send your reply by Friday. (organizational request)}
  lexical_anchors: []
  fixed_forms: [Прошу вас, Просим]
  grammar_prerequisites: [ru-g-reported-request, ru-g-tentative-polite-request, ru-g-duration-deadline]
- id: ru-g-professional-agreement
  ch: договорились о [prepositional] / о том, что ...
  ds: Record a negotiated commitment without implying a contract
  level: professional
  topic: work
  english: Договориться о names what participants agreed on; о том, что introduces its explicit content. Distinguish a proposed action from an agreement actually reached and identify who accepted it. This language exercise makes no claim about a statement's legal enforceability.
  examples:
  - {target: Мы договорились о новой встрече., english: We agreed on another meeting.}
  - {target: "Мы договорились о том, что Анна подготовит список.", english: "We agreed that Anna would prepare the list."}
  lexical_anchors: [{lemma: договориться, hint: reach an agreement}]
  fixed_forms: [о, о том, что]
  grammar_prerequisites: [ru-g-location-prepositional, ru-g-reported-statement, ru-g-real-condition]
- id: ru-g-professional-status
  ch: готов / готова / готовы к [dative]; остаётся [infinitive]
  ds: Give a task status and identify the remaining action
  level: professional
  topic: work
  english: Готов agrees with the thing or person ready and к takes the dative of the next stage. Остаётся with an infinitive identifies what remains to be done. Separate work completed from readiness to proceed and specify unresolved dependencies rather than presenting a vague assurance.
  examples:
  - {target: Отчёт готов к обсуждению., english: The report is ready for discussion.}
  - {target: Нам остаётся проверить даты., english: We still need to check the dates.}
  lexical_anchors: []
  fixed_forms: [готов, готова, готовы, к, остаётся]
  grammar_prerequisites: [ru-g-needed-noun, ru-g-dependency-government, ru-g-managed-dative]
- id: ru-g-technical-operating-condition
  ch: при [prepositional condition] [system behaviour]
  ds: Interpret a condition on system behaviour
  level: technical
  topic: technology
  english: При with the prepositional can specify an operating condition or concurrent event in technical descriptions. It is not a promise that a system always behaves that way beyond the stated scope. Paraphrase with если or когда and check the source's actual conditions before acting.
  examples:
  - {target: "При низкой температуре прибор работает медленнее.", english: "At a low temperature, the device operates more slowly."}
  - {target: "При запуске программа проверяет файл.", english: "On startup, the program checks the file."}
  lexical_anchors: []
  fixed_forms: [при]
  grammar_prerequisites: [ru-g-location-prepositional, ru-g-real-condition, ru-g-comparative-frames]
- id: ru-g-technical-contingency
  ch: в случае [genitive event] [instruction]
  ds: Read an instruction tied to a specified event
  level: technical
  topic: technology
  english: В случае with a genitive event establishes a contingency. It introduces what an instruction applies to, not proof that the event occurred. Original examples are text-practice scenarios, not authoritative procedures for real equipment, data recovery, or safety-critical systems.
  examples:
  - {target: "В случае ошибки программа показывает сообщение.", english: "If an error occurs, the program displays a message."}
  - {target: "В случае изменения настроек проверьте результат.", english: "If the settings change, check the result."}
  lexical_anchors: []
  fixed_forms: [в случае]
  grammar_prerequisites: [ru-g-absence-genitive, ru-g-real-condition, ru-g-imperative-aspect]
- id: ru-g-technical-composition-purpose
  ch: состоит из [genitive]; предназначен для [genitive]
  ds: Distinguish a system's components from its intended function
  level: technical
  topic: technology
  english: Состоять из names composition, while предназначен для states intended use with agreement in the short passive form. A stated purpose does not guarantee suitability, compatibility, or successful performance. Keep the example's narrow function separate from professional operating advice.
  examples:
  - {target: Система состоит из трёх частей., english: The system consists of three parts.}
  - {target: Этот файл предназначен для проверки программы., english: This file is intended for testing the program.}
  lexical_anchors: [{lemma: состоять, hint: consist of}]
  fixed_forms: [из, предназначен для]
  grammar_prerequisites: [ru-g-origins-and-people, ru-g-short-passive-result, ru-g-larger-quantities]
- id: ru-g-scientific-assumption
  ch: при условии, что ...; если предположить, что ...
  ds: Identify an assumption that limits a scientific claim
  level: scientific
  topic: science
  english: These frames declare a condition or assumption under which reasoning proceeds. An assumption is not an observed result, and its truth must not be inferred from a valid conditional argument. Compare the claim with and without its stated limitation.
  examples:
  - {target: "Вывод верен при условии, что измерения точны.", english: "The conclusion is valid provided that the measurements are accurate."}
  - {target: "Если предположить, что скорость постоянна, расчёт упрощается.", english: "If we assume that the speed is constant, the calculation becomes simpler."}
  lexical_anchors: []
  fixed_forms: [при условии, что, если предположить]
  grammar_prerequisites: [ru-g-only-if, ru-g-real-condition, ru-g-impersonal-evidence-clause]
- id: ru-g-scientific-relation
  ch: связан с [instrumental]; обусловлен [instrumental]
  ds: Distinguish a stated association from causal attribution
  level: scientific
  topic: science
  english: Связан с can state an association; обусловлен presents something as determined or caused by a factor. The stronger causal wording needs stronger support and may be only the author's claim. Agreement follows the phenomenon described, and a grammatical distinction does not validate the science.
  examples:
  - {target: Изменение связано с температурой., english: The change is associated with temperature.}
  - {target: "По мнению автора, различие обусловлено методом измерения.", english: "In the author's view, the difference is caused by the measurement method."}
  lexical_anchors: []
  fixed_forms: [связан с, обусловлен, по мнению]
  grammar_prerequisites: [ru-g-short-passive-result, ru-g-instrumental-means, ru-g-source-attribution, ru-g-correlative-comparison]
- id: ru-g-scientific-ceteris-paribus
  ch: при прочих равных условиях; в пределах [genitive]
  ds: Read a restricted comparison or a stated measurement range
  level: scientific
  topic: science
  english: При прочих равных условиях holds other relevant conditions constant as an assumption. В пределах specifies bounds and takes the genitive. Identify which variables or range the source actually names; these fixed frames do not establish that real conditions were controlled or measurement uncertainty is negligible.
  examples:
  - {target: "При прочих равных условиях сравним два метода.", english: "With other conditions held equal, let us compare two methods."}
  - {target: Различие остаётся в пределах погрешности., english: The difference remains within the margin of error.}
  lexical_anchors: []
  fixed_forms: [при прочих равных условиях, в пределах]
  grammar_prerequisites: [ru-g-real-condition, ru-g-comparative-frames, ru-g-method-nominal-frames]
- id: ru-g-literary-kol
  ch: коль / коли [condition], [consequence]
  ds: Read literary or colloquial alternatives to если
  level: literary
  topic: literature
  english: Коль and коли can introduce a condition in older, literary, proverbial, or colloquial styles. They are not default replacements for если in neutral professional speech. The original examples illustrate a register contrast without quoting a literary work or claiming all historical usage is uniform.
  examples:
  - {target: "Коль обещал, сдержи слово.", english: "If you gave your word, keep it. (marked style)"}
  - {target: "Коли есть время, посиди со мной.", english: "If you have time, sit with me a while. (marked style)"}
  lexical_anchors: []
  fixed_forms: [коль, коли]
  grammar_prerequisites: [ru-g-real-condition, ru-g-imperative-aspect]
- id: ru-g-literary-negative-infinitive
  ch: не [dative person] [perfective infinitive]
  ds: Interpret an infinitival prediction of unattainability
  level: literary
  topic: literature
  english: A negative independent infinitive with a dative person can suggest that an outcome is not to be attained. It may sound fatalistic, literary, or expressive rather than like a neutral factual inability statement. Paraphrase with не сможет in context and do not mistake the rhetoric for certainty.
  examples:
  - {target: Не забыть мне этот вечер., english: I shall never forget this evening. (expressive)}
  - {target: Не вернуть ему прошедший день., english: He cannot bring back the day that has passed. (expressive)}
  lexical_anchors: []
  fixed_forms: [не]
  grammar_prerequisites: [ru-g-dative-need, ru-g-nelzya-aspect, ru-g-full-participial-description]
- id: ru-g-literary-bookish-connectors
  ch: ибо [reason]; дабы [purpose]
  ds: Read bookish reason and purpose connectors
  level: literary
  topic: literature
  english: Ибо introduces a reason in bookish or rhetorically elevated style; дабы introduces a purpose in older, literary, or deliberately formal style. Compare потому что and чтобы as less marked alternatives without assuming identical tone. These original sentences illustrate context, not a recommendation to imitate an older voice in ordinary conversation.
  examples:
  - {target: "Он сохранил письмо, ибо боялся забыть обещание.", english: "He kept the letter, for he feared forgetting the promise. (bookish)"}
  - {target: "Она записала имена, дабы никто не был забыт.", english: "She wrote down the names so that no one would be forgotten. (bookish)"}
  lexical_anchors: []
  fixed_forms: [ибо, дабы]
  grammar_prerequisites: [ru-g-cause-consequence, ru-g-purpose-chtoby, ru-g-short-passive-result, ru-g-negative-pronouns]
