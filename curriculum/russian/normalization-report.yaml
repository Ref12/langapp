- Part of speech, selected meanings, concise hints and teaching placement are separately authored judgments.
- No source word/sense IDs, corpus frequency ranks or underlying Wiktionary revision are supplied by this
  export.
- TSV quotes are literal. The known extra tab in others data-record 2676 is retained within its final
  German field; no source records are reordered.
