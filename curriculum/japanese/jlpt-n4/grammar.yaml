- id: ja-n4-g001
  pattern: 普通形
  english: plain-style predicates
  note: Teach dictionary, negative, past and negative-past verb forms; use appropriate relationships and
    embedding.
  examples:
  - target: 明日は家で勉強する。
    english: I will study at home tomorrow.
  - target: 昨日はどこにも行かなかった。
    english: I did not go anywhere yesterday.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g002
  pattern: 動詞こと／の
  english: nominalizing an action or event
  note: Choice depends on the following predicate; do not assume complete interchangeability.
  examples:
  - target: 泳ぐことが好きです。
    english: I like swimming.
  - target: 子供が走っているのを見ました。
    english: I saw a child running.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g003
  pattern: 動詞たことがある
  english: have experienced doing something
  note: Refers to life experience, not a single dated event; use the plain past form before the nominalizer.
  examples:
  - target: 富士山に登ったことがあります。
    english: I have climbed Mount Fuji.
  - target: この料理を食べたことがありますか。
    english: Have you ever eaten this dish?
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g004
  pattern: 動詞たり動詞たりする
  english: do things such as; representative actions
  note: Lists examples of activities and need not indicate chronological order.
  examples:
  - target: 休みの日は読んだり散歩したりします。
    english: On days off I do things such as read and take walks.
  - target: 旅行中は泳いだり写真を撮ったりしました。
    english: During the trip I did things such as swim and take photographs.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g005
  pattern: 動詞つもりだ
  english: intend to do; intend not to do
  note: Represents personal intention; distinguish it from an externally fixed schedule.
  examples:
  - target: 来年留学するつもりです。
    english: I intend to study abroad next year.
  - target: 今日は外で食べないつもりです。
    english: I intend not to eat out today.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g006
  pattern: 動詞／Nの予定だ
  english: be scheduled; have a plan
  note: Use the dictionary verb or noun plus the possessive linker; plans can involve other people.
  examples:
  - target: 会議は三時に終わる予定です。
    english: The meeting is scheduled to finish at three.
  - target: 来週は出張の予定です。
    english: I am scheduled to go on a business trip next week.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g007
  pattern: 動詞たがる
  english: show signs of wanting to do
  note: Reports observed desire, commonly of someone other than the speaker.
  examples:
  - target: 子供は外で遊びたがっています。
    english: The child is showing that they want to play outside.
  - target: 弟は新しいゲームを買いたがっています。
    english: My younger brother wants to buy a new game.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g008
  pattern: 動詞語幹／形容詞語幹そうだ
  english: look as if; seem about to
  note: Appearance-based judgment; teach irregular adjective forms and distinguish hearsay attachment.
  examples:
  - target: このケーキはおいしそうです。
    english: This cake looks delicious.
  - target: 雨が降りそうです。
    english: It looks as if it will rain.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g009
  pattern: 普通形そうだ
  english: I hear that; reportedly
  note: Hearsay follows a complete plain predicate; identify the source when relevant.
  examples:
  - target: 天気予報によると、明日は晴れるそうです。
    english: According to the weather forecast, it will be sunny tomorrow.
  - target: 田中さんは来月引っ越すそうです。
    english: I hear that Mr. Tanaka is moving next month.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g010
  pattern: 普通形ようだ／みたいだ
  english: seem; look like; infer from evidence
  note: The second form is conversational; noun attachment differs between the two.
  examples:
  - target: 誰もいないようです。
    english: It seems that no one is here.
  - target: この雲は魚みたいです。
    english: This cloud looks like a fish.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g011
  pattern: 動詞辞書形ことができる
  english: be able to do something
  note: Explicit ability or possibility; teach before contrasting inflected potential forms.
  examples:
  - target: ここで切符を買うことができます。
    english: You can buy tickets here.
  - target: 妹は漢字を読むことができます。
    english: My younger sister can read kanji.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g012
  pattern: 可能形
  english: potential verb form; can do
  note: Teach godan, ichidan and irregular formation; potential forms do not express permission by themselves.
  examples:
  - target: 私は百メートル泳げます。
    english: I can swim one hundred metres.
  - target: この席から海が見られます。
    english: You can see the sea from this seat.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g013
  pattern: 動詞たら
  english: if; when an event has happened
  note: Useful for specific conditions and completed-event sequencing; distinguish unreal and actual readings
    by context.
  examples:
  - target: 雨が降ったら、家にいます。
    english: If it rains, I will stay home.
  - target: 駅に着いたら、電話してください。
    english: Please call when you arrive at the station.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g014
  pattern: 普通形と
  english: if; whenever; automatic consequence
  note: Use with predictable results; avoid freely attaching requests or intentions as results.
  examples:
  - target: このボタンを押すと、ドアが開きます。
    english: If you press this button, the door opens.
  - target: 春になると、花が咲きます。
    english: When spring comes, flowers bloom.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g015
  pattern: 動詞ば／形容詞ければ
  english: if; conditional
  note: Teach conditional conjugation and restrictions through contrasts with other conditional forms.
  examples:
  - target: 時間があれば、手伝います。
    english: If I have time, I will help.
  - target: 安ければ、買いたいです。
    english: If it is cheap, I want to buy it.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g016
  pattern: N／普通形なら
  english: if that is the case; as for a proposed topic
  note: Responds to a premise or topic supplied by context rather than just temporal succession.
  examples:
  - target: 京都に行くなら、秋がいいですよ。
    english: If you are going to Kyoto, autumn is a good time.
  - target: 静かな店なら、駅の前にあります。
    english: If you want a quiet shop, there is one in front of the station.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g017
  pattern: (V-te / i-adjective-kute / na-adjective-de / N-de) + も
  english: even if; even though
  note: Attach to the verb's te-form, the i-adjective's connective form, or the na-adjective/noun copular
    connective. The result remains true despite the condition; distinguish concession from permission.
  examples:
  - target: 雨が降っても、試合はあります。
    english: Even if it rains, the game will take place.
  - target: 忙しくても、朝ご飯を食べます。
    english: Even when I am busy, I eat breakfast.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g018
  pattern: 動詞語幹ながら
  english: while doing another action
  note: The same person normally performs both actions; the final verb carries the main action.
  examples:
  - target: 音楽を聞きながら料理します。
    english: I cook while listening to music.
  - target: 歩きながら話しましょう。
    english: Let's talk while walking.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g019
  pattern: 普通形ので
  english: because; explanatory reason
  note: Often presents the reason more softly or objectively; nouns and na-adjectives need their linking
    form.
  examples:
  - target: 電車が遅れたので、遅刻しました。
    english: I was late because the train was delayed.
  - target: 静かなので、この部屋で勉強します。
    english: I study in this room because it is quiet.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g020
  pattern: 普通形のに
  english: although; contrary to expectation
  note: Often conveys disappointment or surprise; do not confuse with purpose uses of the same sequence.
  examples:
  - target: たくさん寝たのに、まだ眠いです。
    english: Although I slept a lot, I am still sleepy.
  - target: この店は高いのに、いつも混んでいます。
    english: Although this shop is expensive, it is always crowded.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g021
  pattern: 普通形んです／のです
  english: explanatory framing; the situation is that
  note: Connects a statement to context or requests an explanation; not a generic politeness suffix.
  examples:
  - target: どうして遅れたんですか。
    english: Why were you late?
  - target: 電車が止まったんです。
    english: The train stopped, so that is why.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g022
  pattern: 動詞なければならない
  english: must do; obligation
  note: A double-negative obligation pattern; also teach less formal spoken reductions through listening.
  examples:
  - target: 明日までに払わなければなりません。
    english: I must pay by tomorrow.
  - target: 今日は早く帰らなければなりません。
    english: I must go home early today.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g023
  pattern: 動詞なくてもいい
  english: do not have to do
  note: Expresses absence of necessity, not prohibition.
  examples:
  - target: 今日は来なくてもいいです。
    english: You do not have to come today.
  - target: 全部覚えなくてもいいですよ。
    english: You do not have to memorize everything.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g024
  pattern: 動詞た／ないほうがいい
  english: had better; should or should not
  note: Advice rather than an absolute rule; negative advice uses the nonpast negative.
  examples:
  - target: 少し休んだほうがいいです。
    english: You should rest a little.
  - target: 夜遅く食べないほうがいいです。
    english: You should not eat late at night.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g025
  pattern: 動詞てみる
  english: try doing; do as an experiment
  note: Describes trying an action to discover its result, not trying unsuccessfully to start it.
  examples:
  - target: この靴を履いてみます。
    english: I will try these shoes on.
  - target: 日本語で日記を書いてみました。
    english: I tried writing a diary in Japanese.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g026
  pattern: 動詞てしまう
  english: finish completely; regrettably do
  note: Context distinguishes completion from regret; introduce contractions for recognition later.
  examples:
  - target: 宿題を全部やってしまいました。
    english: I finished all my homework.
  - target: 財布を忘れてしまいました。
    english: I unfortunately forgot my wallet.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g027
  pattern: 動詞ておく
  english: do in advance; leave in a state
  note: An action prepares for a later need or deliberately maintains a state.
  examples:
  - target: 旅行の前に切符を買っておきます。
    english: I will buy the tickets before the trip.
  - target: 窓は開けておいてください。
    english: Please leave the window open.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g028
  pattern: 動詞てあげる
  english: do a favour for someone
  note: Marks outward benefit; avoid using it boastfully toward a senior or recipient.
  examples:
  - target: 妹に本を読んであげました。
    english: I read a book to my younger sister for her.
  - target: 友達の荷物を持ってあげました。
    english: I carried my friend's luggage for them.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g029
  pattern: 動詞てくれる
  english: someone does a favour for me or my group
  note: Subject is the benefactor; the benefit moves toward the speaker's perspective.
  examples:
  - target: 友達が駅まで送ってくれました。
    english: My friend kindly took me to the station.
  - target: 兄が料理を作ってくれました。
    english: My older brother cooked for me.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g030
  pattern: 動詞てもらう
  english: receive someone's help in doing
  note: The beneficiary is normally the topic or subject; the helper is marked as the agent.
  examples:
  - target: 先生に作文を見てもらいました。
    english: I had my teacher look over my composition.
  - target: 友達に写真を撮ってもらいました。
    english: I had my friend take a photograph.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g031
  pattern: 動詞ようになる
  english: come to do; become able to do
  note: Describes a change in ability or habitual behaviour, not a one-off decision.
  examples:
  - target: 漢字が読めるようになりました。
    english: I have become able to read kanji.
  - target: 毎朝走るようになりました。
    english: I have started running every morning.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g032
  pattern: 動詞ことにする
  english: decide to do
  note: Foregrounds a personal decision rather than an external arrangement.
  examples:
  - target: 毎日歩くことにしました。
    english: I decided to walk every day.
  - target: 今日は甘い物を食べないことにします。
    english: I have decided not to eat sweet things today.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g033
  pattern: 動詞ことになる
  english: it is decided; it turns out that
  note: Describes an arrangement or outcome without foregrounding the speaker as decision-maker.
  examples:
  - target: 来月大阪で働くことになりました。
    english: It has been decided that I will work in Osaka next month.
  - target: 会議は来週行うことになりました。
    english: The meeting has been arranged for next week.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g034
  pattern: 動詞ようにする
  english: make an effort to; make a habit of
  note: Focuses on deliberate practice, not a completed change of ability.
  examples:
  - target: 野菜を食べるようにしています。
    english: I make a point of eating vegetables.
  - target: 約束を忘れないようにしてください。
    english: Please make sure not to forget the appointment.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g035
  pattern: 動詞辞書形ところだ
  english: be just about to do
  note: Locates an action at its starting boundary; teach alongside ongoing and just-finished versions.
  examples:
  - target: 今から出かけるところです。
    english: I am just about to go out.
  - target: 昼ご飯を食べるところです。
    english: I am just about to eat lunch.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g036
  pattern: 動詞たばかりだ
  english: have only just done
  note: Recency is subjective and can cover more than a few moments.
  examples:
  - target: この町に来たばかりです。
    english: I have only just arrived in this town.
  - target: 先月この仕事を始めたばかりです。
    english: I only started this job last month.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g037
  pattern: 動詞語幹すぎる
  english: do too much; be excessively
  note: Attach to a verb stem or adjective stem; evaluate against a contextual standard.
  examples:
  - target: 昨日は食べすぎました。
    english: I ate too much yesterday.
  - target: この靴は小さすぎます。
    english: These shoes are too small.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g038
  pattern: 動詞語幹やすい／にくい
  english: easy to do; hard to do
  note: Describes ease or difficulty of the action, not the actor's ability alone.
  examples:
  - target: このペンは書きやすいです。
    english: This pen is easy to write with.
  - target: この地図は分かりにくいです。
    english: This map is hard to understand.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g039
  pattern: 文かどうか
  english: whether or not; embedded yes-no question
  note: Embed a plain question without treating the final predicate as another question particle.
  examples:
  - target: 店が開いているかどうか知りません。
    english: I do not know whether the shop is open.
  - target: 行けるかどうか、明日連絡します。
    english: I will let you know tomorrow whether I can go.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g040
  pattern: 普通形と思う
  english: think that; express an opinion
  note: Quote a plain predicate; distinguish speaker opinion from independently verified information.
  examples:
  - target: 明日は晴れると思います。
    english: I think it will be sunny tomorrow.
  - target: この方法がいいと思います。
    english: I think this method is good.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g041
  pattern: 普通形と言う
  english: say that; quotation
  note: Use plain form for indirect content; distinguish an exact quotation from a paraphrase.
  examples:
  - target: 先生は明日試験があると言いました。
    english: The teacher said that there would be a test tomorrow.
  - target: 弟は行かないと言っています。
    english: My younger brother says he will not go.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g042
  pattern: 動詞ている
  english: resulting state; continuing habit
  note: Extend the progressive beyond ongoing actions; intransitive change verbs often describe a resulting
    state.
  examples:
  - target: 窓が開いています。
    english: The window is open.
  - target: 私は東京に住んでいます。
    english: I live in Tokyo.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g043
  pattern: 動詞てある
  english: a state resulting from deliberate action
  note: Typically uses a transitive verb and implies that someone arranged the result.
  examples:
  - target: 机に資料が置いてあります。
    english: The documents have been placed on the desk.
  - target: 壁に地図が貼ってあります。
    english: A map has been put up on the wall.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g044
  pattern: 受身形
  english: passive voice; be affected by another's action
  note: Teach direct passives first and introduce affected-person passives with context.
  examples:
  - target: 私は先生に褒められました。
    english: I was praised by my teacher.
  - target: この本は多くの人に読まれています。
    english: This book is read by many people.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n4-g045
  pattern: お／ご〜になる
  english: respectful description of someone else's action
  note: Raises the subject's action; use an eligible verb stem or verbal noun with its appropriate honorific
    prefix. Introduce special respectful verbs separately and do not use for oneself.
  examples:
  - target: 先生はもうお帰りになりました。
    english: The teacher has already gone home.
  - target: 部長は資料をお読みになりました。
    english: The department manager read the documents.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
