- id: ja-n1-g001
  pattern: 動詞や否や
  english: as soon as; no sooner than
  note: A rapid actual sequence; literary or formal, with the dictionary form before the connector.
  examples:
  - target: 彼は席に着くや否や、資料を開きました。
    english: As soon as he sat down, he opened the documents.
  - target: ベルが鳴るや否や、子供たちは外へ走りました。
    english: As soon as the bell rang, the children ran outside.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g002
  pattern: 動詞が早いか
  english: no sooner than; immediately on
  note: A near-simultaneous sequence, typically describing observed rather than intended actions.
  examples:
  - target: ドアが開くが早いか、猫が飛び出しました。
    english: No sooner had the door opened than the cat darted out.
  - target: 彼は話を聞くが早いか、電話をかけました。
    english: As soon as he heard the news, he made a phone call.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g003
  pattern: 動詞なり
  english: as soon as; immediately after
  note: Usually the same subject performs a sudden next action; do not confuse with manner or alternative-list
    uses.
  examples:
  - target: 彼は帰宅するなり、ソファに座り込みました。
    english: As soon as he got home, he sank into the sofa.
  - target: 彼女は手紙を読むなり、泣き出しました。
    english: As soon as she read the letter, she began to cry.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g004
  pattern: 動詞そばから
  english: no sooner than; repeatedly undone
  note: A recurring action is immediately followed by a result that defeats its purpose.
  examples:
  - target: 片付けるそばから、子供がおもちゃを出します。
    english: No sooner do I tidy up than the child takes out toys again.
  - target: 覚えたそばから、単語を忘れてしまいます。
    english: I forget words almost as soon as I learn them.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g005
  pattern: 動詞てからというもの
  english: ever since a major turning point
  note: Emphasizes a lasting change beginning with the first event.
  examples:
  - target: この町に来てからというもの、毎日歩いています。
    english: Ever since moving to this town, I have walked every day.
  - target: 本を出版してからというもの、生活が変わりました。
    english: Ever since publishing the book, my life has changed.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g006
  pattern: 動詞たが最後
  english: once something happens, an inevitable result follows
  note: Usually warns of a difficult-to-reverse consequence; not simply a neutral chronological sequence.
  examples:
  - target: この秘密を話したが最後、もう取り消せません。
    english: Once you reveal this secret, you cannot take it back.
  - target: 彼と議論を始めたが最後、何時間も終わりません。
    english: Once you start arguing with him, it goes on for hours.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g007
  pattern: Nを皮切りに
  english: starting with; an initial event followed by a series
  note: Use where the first event launches a succession or expansion.
  examples:
  - target: 東京公演を皮切りに、全国を回ります。
    english: Starting with the Tokyo performance, they will tour the country.
  - target: 最初の成功を皮切りに、新しい事業が次々に始まりました。
    english: Starting with the first success, new businesses began one after another.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g008
  pattern: Nをもって
  english: as of; by means of, formal
  note: Explicitly distinguish formal completion-time use from formal means; teach completion first.
  examples:
  - target: 本日をもって、受付を終了します。
    english: Applications will close as of today.
  - target: この発表をもって、会議を終わります。
    english: With this presentation, we conclude the meeting.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g009
  pattern: Nを経て
  english: through; after passing through a stage
  note: Describes a route or process with meaningful intermediate stages.
  examples:
  - target: 何度もの話し合いを経て、合意に達しました。
    english: After several rounds of discussion, we reached agreement.
  - target: 大阪を経て、京都に向かいました。
    english: We headed to Kyoto via Osaka.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g010
  pattern: Nに至るまで
  english: even as far as; down to
  note: Emphasizes the farthest extent or finest detail within an inclusive range.
  examples:
  - target: 服装から話し方に至るまで、よく似ています。
    english: They are very similar, from their clothing right down to their way of speaking.
  - target: 小さな部品に至るまで、確認しました。
    english: We checked everything, down to the smallest parts.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g011
  pattern: Nに至っては
  english: when it comes to an extreme case
  note: Often singles out a striking example, frequently unfavourable; requires a broader comparison context.
  examples:
  - target: 皆遅れていましたが、彼に至っては一時間も遅刻しました。
    english: Everyone was late, but he was a full hour late.
  - target: 他の部屋も狭いですが、この部屋に至っては窓さえありません。
    english: The other rooms are small, but this room does not even have a window.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g012
  pattern: Nに即して
  english: in accordance with; closely reflecting
  note: Formal consistency with actual circumstances, evidence or an applicable standard.
  examples:
  - target: 現実に即して、計画を見直す必要があります。
    english: We need to revise the plan in line with reality.
  - target: 事実に即して説明してください。
    english: Please explain in accordance with the facts.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g013
  pattern: Nに照らして
  english: in light of; against a standard
  note: An evaluative comparison with law, precedent, evidence or criteria.
  examples:
  - target: 規則に照らして、判断しました。
    english: We made a judgment in light of the rules.
  - target: 過去の例に照らして、この対応は適切です。
    english: In light of past examples, this response is appropriate.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g014
  pattern: Nを踏まえて
  english: taking into account; building on
  note: Implies that known facts or prior discussion inform the next action.
  examples:
  - target: 調査結果を踏まえて、対策を考えます。
    english: We will consider measures based on the survey results.
  - target: 前回の反省を踏まえて、方法を変えました。
    english: We changed the method in light of what we learned last time.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g015
  pattern: Nに則って
  english: in conformity with established rules
  note: Formal compliance with a rule, procedure or custom, rather than mere similarity.
  examples:
  - target: 法律に則って、手続きを進めます。
    english: We will proceed with the procedure in accordance with the law.
  - target: 伝統に則って、式が行われました。
    english: The ceremony was conducted in accordance with tradition.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g016
  pattern: Nを余儀なくされる
  english: be compelled to; be forced into
  note: A formal passive emphasizing external circumstances rather than personal preference.
  examples:
  - target: 大雪で予定の変更を余儀なくされました。
    english: Heavy snow forced us to change the schedule.
  - target: 工場は操業停止を余儀なくされました。
    english: The factory was forced to suspend operations.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g017
  pattern: 動詞ずにはいられない
  english: cannot help doing; unable to resist
  note: An involuntary feeling or strong inner impulse motivates the action; not externally imposed duty.
  examples:
  - target: その話を聞くと、笑わずにはいられません。
    english: I cannot help laughing when I hear that story.
  - target: この写真を見ると、故郷を思い出さずにはいられません。
    english: When I see this photograph, I cannot help remembering my hometown.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g018
  pattern: 動詞ずにはおかない
  english: will inevitably cause; be sure to
  note: A powerful effect inevitably provokes an action or response; distinguish inner impulse from causal
    force.
  examples:
  - target: 彼女の演奏は聴衆を感動させずにはおきません。
    english: Her performance is sure to move the audience.
  - target: この発見は社会の関心を集めずにはおかないでしょう。
    english: This discovery will surely attract public interest.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g019
  pattern: 動詞ずにはすまない
  english: cannot get away without; must do to settle matters
  note: A social or practical obligation makes avoidance unacceptable; not a claim of inability.
  examples:
  - target: 大切な資料をなくしたので、謝らずにはすみません。
    english: Having lost the important documents, I cannot avoid apologizing.
  - target: これほど迷惑をかけた以上、説明せずにはすみません。
    english: After causing this much trouble, I cannot leave without explaining.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g020
  pattern: 動詞ないではすまない
  english: cannot avoid having to do
  note: Negative connective variant of unavoidable accountability; teach as a related but usable construction.
  examples:
  - target: 約束を破ったのだから、謝らないではすみません。
    english: Since I broke my promise, I cannot avoid apologizing.
  - target: この問題は、責任者が説明しないではすまないでしょう。
    english: The person in charge will have to explain this problem.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g021
  pattern: 動詞べく
  english: in order to; with the aim of
  note: Formal purpose attached to dictionary form; typically intentional written narration.
  examples:
  - target: 問題を解決すべく、専門家が集まりました。
    english: Experts gathered in order to solve the problem.
  - target: 真相を確かめるべく、現地へ向かいました。
    english: I headed to the site to establish the truth.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g022
  pattern: 動詞んがために
  english: in order to; with a firm aim
  note: Literary and emphatic purpose; formed from the negative stem and uncommon in ordinary conversation.
  examples:
  - target: 夢を実現せんがために、努力を重ねました。
    english: I worked persistently in order to realize my dream.
  - target: 技術を学ばんがために、海を渡りました。
    english: They crossed the sea in order to learn the technology.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g023
  pattern: 動詞べからず
  english: must not; formal prohibition
  note: Written notices or maxims; recognize rather than use as routine polite conversation.
  examples:
  - target: ここに立ち入るべからず。
    english: Do not enter this area.
  - target: 初心を忘れるべからず。
    english: Do not forget your original intentions.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g024
  pattern: 動詞まじき
  english: unbecoming; something that should never be
  note: Attributive condemnation, often attached to a role or professional norm; strongly judgmental.
  examples:
  - target: 教師にあるまじき発言です。
    english: It is a remark unbecoming of a teacher.
  - target: 責任者にあるまじき態度でした。
    english: It was conduct unbecoming of the person in charge.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g025
  pattern: 動詞に堪えない
  english: unbearable to; not worth enduring
  note: With perception verbs, the quality makes the experience intolerable; contrast separate emotional-noun
    use.
  examples:
  - target: その報告は聞くに堪えない内容でした。
    english: The report's contents were unbearable to hear.
  - target: その映像は見るに堪えませんでした。
    english: The footage was unbearable to watch.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g026
  pattern: Nに堪えない
  english: be overwhelmed by an emotion
  note: Formal emotional expression; distinguish this sense from an unbearable viewing or listening experience.
  examples:
  - target: 皆様のご支援を賜り、感謝に堪えません。
    english: Having received everyone's support, I am deeply grateful.
  - target: この知らせを聞き、喜びに堪えません。
    english: I am overwhelmed with joy at this news.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g027
  pattern: (V-dictionary / verbal noun) + に足る
  english: be worthy of; sufficient to
  note: Attach to a dictionary-form verb or a verbal noun expressing the relevant action. Formal attributive
    or predicative evaluation; identify what evidence supports the appraisal.
  examples:
  - target: 彼は信頼に足る人物です。
    english: He is a person worthy of trust.
  - target: 検討に足る提案だと思います。
    english: I think it is a proposal worthy of consideration.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g028
  pattern: 動詞に忍びない
  english: cannot bear to do for emotional reasons
  note: Compassion or emotional difficulty prevents the action, rather than physical inability.
  examples:
  - target: この古い手紙は捨てるに忍びません。
    english: I cannot bear to throw away these old letters.
  - target: 彼女の悲しむ姿は見るに忍びません。
    english: I cannot bear to see her looking so sad.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g029
  pattern: 普通形といえども
  english: even though; even in the case of
  note: Formal concession that rejects exemption for a category or circumstance.
  examples:
  - target: 専門家といえども、間違うことはあります。
    english: Even experts can make mistakes.
  - target: 子供といえども、規則は守る必要があります。
    english: Even children need to follow the rules.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g030
  pattern: 普通形とはいえ
  english: although admittedly; even so
  note: Acknowledges a proposition and then qualifies the expected conclusion.
  examples:
  - target: 春とはいえ、朝はまだ寒いです。
    english: Although it is spring, the mornings are still cold.
  - target: 便利とはいえ、費用がかかりすぎます。
    english: Although it is convenient, it costs too much.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g031
  pattern: 普通形ものを
  english: if only; although, with regret
  note: Highlights an unrealized better outcome or disappointment; literary or emotionally marked.
  examples:
  - target: 相談してくれれば、手伝えたものを。
    english: If only you had consulted me, I could have helped.
  - target: 早く出れば間に合ったものを、寝坊してしまいました。
    english: I would have been on time if I had left early, but I overslept.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g032
  pattern: (N / V-stem) + ながらに／ながらにして
  english: while remaining in a state; from a state
  note: Used in fixed state expressions with certain nouns or verb stems; the extended form occurs in
    established combinations. Do not freely substitute it for the ordinary simultaneous-action connective.
  examples:
  - target: 彼女は涙ながらに事情を説明しました。
    english: She explained the circumstances in tears.
  - target: このサービスなら、家にいながらにして買い物ができます。
    english: With this service, you can shop without leaving home.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g033
  pattern: Nならではの
  english: unique to; possible only through a special quality
  note: Praises or identifies a distinctive strength; typically modifies a noun.
  examples:
  - target: 地元ならではの料理を楽しみました。
    english: We enjoyed dishes unique to the local area.
  - target: 職人ならではの技術です。
    english: It is skill distinctive to an artisan.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g034
  pattern: Nと相まって
  english: together with; interacting with
  note: Two factors combine to strengthen an outcome rather than simply coexist.
  examples:
  - target: 努力が才能と相まって、大きな成果を生みました。
    english: Effort combined with talent to produce a major achievement.
  - target: 照明が音楽と相まって、特別な雰囲気を作りました。
    english: The lighting and music together created a special atmosphere.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g035
  pattern: Nをよそに
  english: disregarding; unaffected by
  note: A subject acts contrary to others' concerns or an external situation.
  examples:
  - target: 周囲の心配をよそに、彼は旅を続けました。
    english: Disregarding the concern of those around him, he continued his journey.
  - target: 不況をよそに、この店は売り上げを伸ばしています。
    english: Despite the recession, this shop is increasing its sales.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g036
  pattern: Nをものともせずに
  english: undaunted by; overcoming an obstacle
  note: Depicts determined action despite a substantial obstacle; often admiring in tone.
  examples:
  - target: 強風をものともせずに、選手たちは走り続けました。
    english: Undaunted by the strong wind, the athletes kept running.
  - target: 困難をものともせずに、研究を続けました。
    english: Undaunted by difficulties, they continued the research.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g037
  pattern: Nを押して
  english: despite; pushing past a constraint
  note: Usually expresses undertaking an action despite illness, opposition or a demanding schedule.
  examples:
  - target: 彼は病気を押して、会議に出席しました。
    english: He attended the meeting despite being ill.
  - target: 反対を押して、計画を進めました。
    english: They pressed ahead with the plan despite opposition.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g038
  pattern: Nを顧みず
  english: without regard for; disregarding consequences
  note: Highlights neglect of a consideration, which may be courageous or imprudent depending on context.
  examples:
  - target: 危険を顧みず、救助に向かいました。
    english: They went to help without regard for the danger.
  - target: 家族の心配を顧みず、彼は出発しました。
    english: He departed without regard for his family's concern.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g039
  pattern: Nいかんで
  english: depending on; according to the nature of
  note: Highly formal expression of dependence, common in institutional decisions.
  examples:
  - target: 結果いかんで、方針を見直します。
    english: We will revise the policy depending on the results.
  - target: 対応いかんで、信頼を取り戻せるかが決まります。
    english: Whether trust can be regained depends on the response.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g040
  pattern: Nのいかんにかかわらず
  english: regardless of the nature of
  note: Formal unconditional scope over a specified criterion; frequently used in rules.
  examples:
  - target: 理由のいかんにかかわらず、無断欠席は認めません。
    english: Unauthorized absence is not permitted regardless of the reason.
  - target: 結果のいかんにかかわらず、報告してください。
    english: Please report regardless of the outcome.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g041
  pattern: NといいNといい
  english: both in terms of one aspect and another
  note: Lists representative aspects supporting a broad appraisal.
  examples:
  - target: 色といい形といい、理想的なかばんです。
    english: In both colour and shape, it is an ideal bag.
  - target: 味といい香りといい、すばらしいお茶です。
    english: In both taste and aroma, it is excellent tea.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g042
  pattern: NであれNであれ
  english: whether one or the other; regardless which
  note: Formal paired alternatives with an invariant result.
  examples:
  - target: 学生であれ社会人であれ、学び続けることは大切です。
    english: Whether one is a student or a working adult, continuing to learn is important.
  - target: 晴天であれ雨天であれ、式は行われます。
    english: Whether the weather is fine or rainy, the ceremony will take place.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n1-g043
  pattern: 動詞ようが／ようと
  english: even if; no matter what one does
  note: Volitional-form concession expresses an unchanged outcome or strong resolve.
  examples:
  - target: 誰が反対しようと、私は意見を変えません。
    english: No matter who objects, I will not change my opinion.
