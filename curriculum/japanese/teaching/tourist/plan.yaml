schema_version: 1
id: ja-tourist
title: Japanese for a short visit
language: japanese
level_basis: Independent situation-based route with no prerequisite core level or kana course. The first
  five ordered units form a self-contained quick start; source bands are provenance only.
review_policy: Start with 5-8 new senses and a useful phrase. Teach the listed local construction prerequisites,
  then change a detail and reduce help. Retrieve earlier items later the same day and roughly 1, 3, 7
  and 14 days later, adapting to evidence. Kana readings are not audio or pitch-accent models. These original
  phrases do not guarantee safety, accepted payment, dietary suitability, medical accuracy, or current
  travel arrangements; confirm with an appropriate person.
quick_start:
- polite-repair
- food-basics
- finding-your-way
- paying
- asking-for-help
