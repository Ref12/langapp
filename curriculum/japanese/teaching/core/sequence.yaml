      - {id: ja-n5-00011-s001, ch: 朝, pr: あさ, ds: morning}
      - {id: ja-n5-00535-s001, ch: 昼, pr: ひる, ds: noon}
      - {id: ja-n5-00654-s001, ch: 夜, pr: よる, ds: night}
      - {id: ja-n5-00638-s001, ch: 夕方, pr: ゆうがた, ds: early evening (usu. from 3pm to 6pm)}
      - {id: ja-n5-00575-s001, ch: 毎朝, pr: まいあさ, ds: every morning}
      - {id: ja-n5-00579-s001, ch: 毎日, pr: まいにち, ds: every day}
      - {id: ja-n5-00426-s001, ch: 時々, pr: ときどき, ds: sometimes}
      - {id: ja-n5-00101-s001, ch: 起きる, pr: おきる, ds: to get up}
      - {id: ja-n5-00477-s001, ch: 寝る, pr: ねる, ds: to sleep (lying down)}
      - {id: ja-n5-00038-s001, ch: 洗う, pr: あらう, ds: to wash}
      - {id: ja-n5-00392-s001, ch: 作る, pr: つくる, ds: to make}
      - {id: ja-n5-00322-s001, ch: する, pr: する, ds: to do}
      - {id: ja-n5-00561-s001, ch: 勉強, pr: べんきょう, ds: study}
      - {id: ja-n5-00501-s001, ch: 働く, pr: はたらく, ds: to work}
      - {id: ja-n5-00255-s001, ch: 今週, pr: こんしゅう, ds: this week}
      - {id: ja-n5-00226-s001, ch: 月曜日, pr: げつようび, ds: Monday}
      - {id: ja-n5-00275-s001, ch: 時間, pr: じかん, ds: time}
      - {id: ja-n5-00238-s001, ch: 午後, pr: ごご, ds: afternoon}
      - {id: ja-n5-00241-s001, ch: 午前, pr: ごぜん, ds: morning}
      grammar:
      - {id: ja-n5-g014, ch: 時点に, ds: at a specific time}
      - {id: ja-n5-g025, ch: 動詞ました／ませんでした, ds: polite past verb; polite negative past verb}
      - {id: ja-n5-g022, ch: Nでした／ではありませんでした, ds: was a noun; was not a noun}
      review_vocabulary: []
      review_grammar:
      - {id: ja-n5-g023, ch: 動詞ます, ds: polite nonpast verb}
