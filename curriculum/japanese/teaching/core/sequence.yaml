schema_version: 3
id: ja-practical
title: Practical Japanese
language: japanese
level_basis: Independent communicative teaching progression; JLPT reference labels identify provenance, not admission requirements, competence, or guaranteed examination coverage.
review_policy: A topic module is a pool for several adaptive lessons, not a single sitting. Start with 5-8 new senses and one construction; retrieve relevant earlier items after a delay. Record the task, assistance, sense, and modality. Teach distinctions in meaningful exchanges rather than reciting source order. Exposure and module completion are not mastery.
kind: program
mastery_profile: ja-item-mastery
phases:
- id: first-exchanges
  title: First exchanges
  target_new_headwords: 250
  levels:
  - schema_version: 3
    id: ja-level-01
    title: First contact in Japanese
    language: japanese
    level_basis: Independent communicative teaching progression; JLPT reference labels identify provenance, not admission requirements, competence, or guaranteed examination coverage.
    review_policy: A topic module is a pool for several adaptive lessons, not a single sitting. Start with 5-8 new senses and one construction; retrieve relevant earlier items after a delay. Record the task, assistance, sense, and modality. Teach distinctions in meaningful exchanges rather than reciting source order. Exposure and module completion are not mastery.
    kind: level
    number: 1
    phase: first-exchanges
    prerequisites: []
    goals: &id001
    - Introduce yourself with a polite noun predicate.
    - Identify a drink or meal and state a preference.
    - Ask for repetition without pretending to understand.
    checkpoint:
      task: Meet a new partner and clarify a name and a meal choice with the details changed.
      criteria: *id001
    mastery_profile: ja-item-mastery
    mastery_target: independent-use
    units:
    - id: first-contact
      title: Meet someone and exchange names
      outcome: Introduce yourself, identify a name, and check a simple statement.
      vocabulary:
      - {id: ja-n5-00679-s001, ch: 私, pr: わたし, ds: I}
      - {id: ja-n5-00458-s001, ch: 名前, pr: なまえ, ds: name}
      - {id: ja-n5-00149-s001, ch: 学生, pr: がくせい, ds: student (esp. a university student)}
      - {id: ja-n5-00334-s001, ch: 先生, pr: せんせい, ds: teacher}
      - {id: ja-n5-00527-s001, ch: 人, pr: ひと, ds: person}
      - {id: ja-n5-00211-s001, ch: 国, pr: くに, ds: country}
      - {id: ja-n5-00088-s001, ch: 英語, pr: えいご, ds: English (language)}
      - {id: ja-n5-00663-s001, ch: 留学生, pr: りゅうがくせい, ds: overseas student}
      - {id: ja-n5-00485-s001, ch: はい, pr: はい, ds: 'yes'}
      - {id: ja-n5-00044-s001, ch: いいえ, pr: いいえ, ds: 'no'}
      - {id: ja-n5-00676-s001, ch: わかる, pr: わかる, ds: to understand}
      - {id: ja-n5-00645-s001, ch: ゆっくり, pr: ゆっくり, ds: slowly}
      - {id: ja-n5-00622-s001, ch: もう一度, pr: もういちど, ds: once more}
      - {id: ja-n5-00148-s001, ch: 書く, pr: かく, ds: to write}
      - {id: ja-n5-00282-s001, ch: 質問, pr: しつもん, ds: question}
      - {id: ja-n5-00066-s001, ch: 意味, pr: いみ, ds: meaning}
      - {id: ja-n5-00507-s001, ch: 話す, pr: はなす, ds: to talk}
      - {id: ja-n5-00180-s002, ch: 聞く, pr: きく, ds: listen to something}
      - {id: ja-n5-00045-s001, ch: 言う, pr: いう, ds: to say}
      - {id: ja-n5-00314-s001, ch: 少し, pr: すこし, ds: a little}
      - {id: ja-n5-00385-s001, ch: ちょっと, pr: ちょっと, ds: a little}
      - {id: ja-n3-00603-s001, ch: こんにちは, pr: こんにちは, ds: hello}
      - {id: ja-n2-01337-s001, ch: はじめまして, pr: はじめまして, ds: nice to meet you}
      grammar:
      - {id: ja-n5-g001, ch: Nです, ds: be a noun; polite identification}
      - {id: ja-n5-g004, ch: Nは, ds: topic; as for a noun}
      - {id: ja-n5-g003, ch: 文＋か, ds: polite question}
      review_vocabulary: []
      review_grammar: []
    - id: a-drink-and-a-meal
      title: Choose a drink and a simple meal
      outcome: Identify a drink or meal and state a simple preference.
      vocabulary:
      - {id: ja-n5-00600-s001, ch: 水, pr: みず, ds: water (esp. cool or cold)}
      - {id: ja-n5-00111-s001, ch: お茶, pr: おちゃ, ds: tea (esp. green or barley)}
      - {id: ja-n5-00236-s001, ch: コーヒー, pr: コーヒー, ds: coffee}
      - {id: ja-n5-00481-s001, ch: 飲む, pr: のむ, ds: to drink}
      - {id: ja-n5-00369-s001, ch: 食べる, pr: たべる, ds: to eat}
      - {id: ja-n5-00250-s001, ch: ご飯, pr: ごはん, ds: cooked rice}
      - {id: ja-n5-00516-s001, ch: パン, pr: パン, ds: bread}
      - {id: ja-n5-00370-s001, ch: 卵, pr: たまご, ds: eggs}
      - {id: ja-n5-00260-s001, ch: 魚, pr: さかな, ds: fish}
      - {id: ja-n5-00630-s001, ch: 野菜, pr: やさい, ds: vegetable}
