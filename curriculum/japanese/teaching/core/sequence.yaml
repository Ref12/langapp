      - {id: ja-n5-00247-s001, ch: 言葉, pr: ことば, ds: language}
      - {id: ja-n5-00675-s001, ch: 若い, pr: わかい, ds: young}
      - {id: ja-n5-00055-s001, ch: 痛い, pr: いたい, ds: painful}
      - {id: ja-n5-00352-s001, ch: 大丈夫, pr: だいじょうぶ, ds: safe}
      - {id: ja-n5-00228-s001, ch: 元気, pr: げんき, ds: lively}
      - {id: ja-n5-00652-s001, ch: 呼ぶ, pr: よぶ, ds: to call out (to)}
      - {id: ja-n5-00180-s001, ch: 聞く, pr: きく, ds: hear a sound}
      - {id: ja-n5-00371-s001, ch: 誰, pr: だれ, ds: who}
      - {id: ja-n5-00464-s001, ch: 何, pr: なに, ds: what}
      - {id: ja-n5-00435-s001, ch: どなた, pr: どなた, ds: who}
      - {id: ja-n5-00112-s001, ch: お手洗い, pr: おてあらい, ds: toilet}
