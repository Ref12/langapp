  - schema_version: 3
    id: ja-level-07
    title: Journeys and arrangements
    language: japanese
    level_basis: Independent communicative teaching progression; JLPT reference labels identify provenance, not admission requirements, competence, or guaranteed examination coverage.
    review_policy: A topic module is a pool for several adaptive lessons, not a single sitting. Start with 5-8 new senses and one construction; retrieve relevant earlier items after a delay. Record the task, assistance, sense, and modality. Teach distinctions in meaningful exchanges rather than reciting source order. Exposure and module completion are not mastery.
    kind: level
    number: 7
    phase: everyday-life
    prerequisites:
    - ja-level-01
    - ja-level-02
    - ja-level-03
    - ja-level-04
    - ja-level-05
    - ja-level-06
    goals: &id007
    - Describe a travel experience and an intention.
    - Compare accommodation or routes.
    - Revise an itinerary after a cancellation.
    checkpoint:
      task: Explain a revised itinerary and its tradeoff to a partner with different information.
      criteria: *id007
    mastery_profile: ja-item-mastery
    mastery_target: independent-use
    units:
    - id: level-07-time-01
      title: Time and sequencing - 1
      outcome: Explain when events occur and distinguish their sequence.
      vocabulary:
      - {id: ja-n5-00013-s001, ch: 明後日, pr: あさって, ds: day after tomorrow}
