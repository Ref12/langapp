      - {id: ja-n5-00093-s001, ch: おいしい, pr: おいしい, ds: good(-tasting)}
      - {id: ja-n5-00311-s001, ch: 好き, pr: すき, ds: liking}
      - {id: ja-n1-01115-s001, ch: これ, pr: これ, ds: this}
      - {id: ja-n1-01785-s001, ch: それ, pr: それ, ds: that}
      - {id: ja-n5-00421-s001, ch: どうぞ, pr: どうぞ, ds: please}
      - {id: ja-n5-00206-s001, ch: ください, pr: ください, ds: please (give me)}
      - {id: ja-n5-00467-s002, ch: 肉, pr: にく, ds: meat (food)}
      - {id: ja-n2-00202-s001, ch: お願いします, pr: おねがいします, ds: please}
      grammar:
      - {id: ja-n5-g023, ch: 動詞ます, ds: polite nonpast verb}
      - {id: ja-n5-g006, ch: Nを, ds: direct object}
      - {id: ja-n5-g018, ch: これ／それ／あれ, ds: this; that; that over there}
      - {id: ja-n5-g044, ch: Nが好き／上手, ds: like a thing; be good at a thing}
      review_vocabulary: []
      review_grammar: []
    - id: polite-repair
      title: Repair a misunderstanding politely
      outcome: Apologize, distinguish a word from its meaning, and request repetition.
      vocabulary:
      - {id: ja-n3-00876-s001, ch: すみません, pr: すみません, ds: excuse me; sorry (attention or apology)}
      - {id: ja-n3-00043-s001, ch: ありがとう, pr: ありがとう, ds: thank you}
      - {id: ja-n5-00610-s001, ch: 見る, pr: みる, ds: to see}
      - {id: ja-n5-00653-s001, ch: 読む, pr: よむ, ds: to read}
      - {id: ja-n5-00560-s001, ch: ペン, pr: ペン, ds: pen}
      - {id: ja-n5-00163-s001, ch: 紙, pr: かみ, ds: paper}
