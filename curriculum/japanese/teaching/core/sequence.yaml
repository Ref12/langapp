- id: analysis-argument
  title: Analysis and argument
  target_new_headwords: 1400
  levels:
  - schema_version: 3
    id: ja-level-19
    title: Evidence and uncertainty
    language: japanese
    level_basis: Independent communicative teaching progression; JLPT reference labels identify provenance, not admission requirements, competence, or guaranteed examination coverage.
    review_policy: A topic module is a pool for several adaptive lessons, not a single sitting. Start with 5-8 new senses and one construction; retrieve relevant earlier items after a delay. Record the task, assistance, sense, and modality. Teach distinctions in meaningful exchanges rather than reciting source order. Exposure and module completion are not mastery.
    kind: level
    number: 19
    phase: analysis-argument
    prerequisites:
    - ja-level-01
    - ja-level-02
    - ja-level-03
    - ja-level-04
    - ja-level-05
    - ja-level-06
    - ja-level-07
    - ja-level-08
    - ja-level-09
    - ja-level-10
    - ja-level-11
    - ja-level-12
    - ja-level-13
    - ja-level-14
    - ja-level-15
    - ja-level-16
    - ja-level-17
    - ja-level-18
    goals: &id019
    - Identify what supports a claim.
    - Distinguish an observation from an inference.
    - State what remains unknown.
    checkpoint:
      task: Explain what an unfamiliar short argument does and does not establish.
      criteria: *id019
    mastery_profile: ja-item-mastery
    mastery_target: independent-use
