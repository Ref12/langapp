goals: &id001
- Summarize a general-audience explanation.
- Keep a method separate from its conclusion.
- Identify an unanswered question.
checkpoint:
  task: Explain a source and identify a limitation without inventing technical certainty.
  criteria: *id001
mastery_profile: ja-item-mastery
mastery_target: independent-use
