goals: &id001
- Explain an institutional or commercial process.
- Compare effects on different stakeholders.
- Distinguish a stated aim from an observed consequence.
checkpoint:
  task: Present two plausible consequences of a fictional policy or market change.
  criteria: *id001
mastery_profile: ja-item-mastery
mastery_target: independent-use
