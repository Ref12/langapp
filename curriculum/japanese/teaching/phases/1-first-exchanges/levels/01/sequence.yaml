  - {id: ja-n5-00458-s001, ch: 名前, pr: なまえ, ds: name}
  - {id: ja-n5-00149-s001, ch: 学生, pr: がくせい, ds: student (esp. a university student)}
  - {id: ja-n5-00334-s001, ch: 先生, pr: せんせい, ds: teacher}
  - {id: ja-n5-00527-s001, ch: 人, pr: ひと, ds: person}
  - {id: ja-n5-00211-s001, ch: 国, pr: くに, ds: country}
  - {id: ja-n5-00088-s001, ch: 英語, pr: えいご, ds: English (language)}
  - {id: ja-n5-00663-s001, ch: 留学生, pr: りゅうがくせい, ds: overseas student}
  - {id: ja-n5-00485-s001, ch: はい, pr: はい, ds: 'yes'}
  - {id: ja-n5-00044-s001, ch: いいえ, pr: いいえ, ds: 'no'}
  - {id: ja-n5-00676-s001, ch: わかる, pr: わかる, ds: to understand}
  - {id: ja-n5-00645-s001, ch: ゆっくり, pr: ゆっくり, ds: slowly}
  - {id: ja-n5-00622-s001, ch: もう一度, pr: もういちど, ds: once more}
  - {id: ja-n5-00148-s001, ch: 書く, pr: かく, ds: to write}
  - {id: ja-n5-00282-s001, ch: 質問, pr: しつもん, ds: question}
  - {id: ja-n5-00066-s001, ch: 意味, pr: いみ, ds: meaning}
  - {id: ja-n5-00507-s001, ch: 話す, pr: はなす, ds: to talk}
  - {id: ja-n5-00180-s002, ch: 聞く, pr: きく, ds: listen to something}
  - {id: ja-n5-00045-s001, ch: 言う, pr: いう, ds: to say}
  - {id: ja-n5-00314-s001, ch: 少し, pr: すこし, ds: a little}
  - {id: ja-n5-00385-s001, ch: ちょっと, pr: ちょっと, ds: a little}
