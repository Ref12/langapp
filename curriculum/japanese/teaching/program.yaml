schema_version: 1
id: ja-practical
title: Practical Japanese
language: japanese
level_basis: Independent communicative teaching progression; JLPT reference labels identify provenance,
  not admission requirements, competence, or guaranteed examination coverage.
module_size: 25
review_policy: A topic module is a pool for several adaptive lessons, not a single sitting. Start with
  5-8 new senses and one construction; retrieve relevant earlier items after a delay. Record the task,
  assistance, sense, and modality. Teach distinctions in meaningful exchanges rather than reciting source
  order. Exposure and module completion are not mastery.
