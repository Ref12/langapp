grammar:
  - id: ja-par-g001
    pattern: Nは？
    english: What about N?; a contextual follow-up question
    note: The predicate is omitted when it is understood from context.
    source: parallel-authored
  - id: ja-par-g002
    pattern: Nはみんな＋predicate
    english: everyone in a group shares the predicate
    note: みんな comes before the predicate; for example, 私たちはみんな学生です。
    source: parallel-authored
  - id: ja-par-g003
    pattern: とても＋形容詞
    english: very; an intensifier placed before an adjective
    source: parallel-authored
  - id: ja-par-g004
    pattern: ちょっと＋形容詞
    english: a little; somewhat, placed before an adjective
    note: Often used for a mildly unpleasant state, as in ちょっと寒いです.
    source: parallel-authored
  - id: ja-par-g005
    pattern: 形容詞＋と感じます
    english: feel that something is a certain way
    note: と marks the impression; 感じます is the polite form of 感じる.
    source: parallel-authored
  - id: ja-par-g006
    pattern: 時間表現＋（は）＋主語＋動詞／主語＋時間表現＋動詞
    english: Put a time expression before the action, either before or after the subject.
    note: For example, 今日、働きます and 午後、料理します. Relative time expressions such as 今日 usually do not need に.
    source: parallel-authored
  - id: ja-par-g007
    pattern: 場所に着きます
    english: Arrive at a place
    note: Use に to mark the destination with 着きます.
    source: parallel-authored
  - id: ja-par-g008
    pattern: 時間の長さ＋動詞ます
    english: Put a length of time before the verb.
    note: For example, 五分休みます means “rest for five minutes.”
    source: parallel-authored
  - id: ja-par-g009
    pattern: い形容詞くないです
    english: Make an い-adjective politely negative.
    note: "欲しい changes to 欲しくないです: “do not want.”"
    source: parallel-authored
  - id: ja-par-g010
    pattern: Nを少し／Nが少し
    english: a small amount of a noun
    note: 少し expresses a small quantity; for example, ご飯が少し欲しいです。
    source: parallel-authored
  - id: ja-par-g011
    pattern: Nの前に
    english: before a noun or event
    note: For example, 授業の前に means before class.
    source: parallel-authored
  - id: ja-par-g012
    pattern: 数＋号室／番
    english: Use a number with 号室 for a numbered room, or 番 for a numbered label.
    note: For example, 三号室 means “room number three,” and 三番 can identify a numbered place.
    source: parallel-authored
  - id: ja-par-g013
    pattern: 時刻＋半
    english: half past the stated hour
    note: For example, 八時半 means half past eight.
    source: parallel-authored
  - id: ja-par-g014
    pattern: 場所にいます
    english: be at a place
    note: Use にいます to say where a person is.
    source: parallel-authored
  - id: ja-par-g015
    pattern: Nがあります／います
    english: There is/are; have something or someone.
    note: "Use が with あります for things and います for people or animals. For possession, the possessor can be the topic: 私は友達がいます。"
    source: parallel-authored
  - id: ja-par-g016
    pattern: N1はN2にN3をあげます／くれます
    english: give something to someone; use くれます when the recipient is the speaker or the speaker's group
    note: Use に for the recipient and を for the thing given.
    source: parallel-authored
  - id: ja-par-g017
    pattern: 十＋一の位の数
    english: form numbers from 11 to 19 by combining ten and the ones digit; larger tens follow the same pattern
    note: For example, 十五 is fifteen.
    source: parallel-authored
  - id: ja-par-g018
    pattern: 何＋助数詞＋Nですか／どれくらい＋Nですか
    english: ask how many with a counter, or ask how much/how long with どれくらい
    note: Use 何冊 for books, 何杯 for cups, and どれくらい for an amount such as water.
    source: parallel-authored
  - id: ja-par-g019
    pattern: Nの後ろ／前／隣に
    english: describe a location as behind, in front of, or beside a noun
    note: Japanese uses separate positional words after の, rather than a location suffix. Use に with います or あります to say something is at that location.
    source: parallel-authored
  - id: ja-par-g020
    pattern: い形容詞＋N
    english: An i-adjective directly modifies a noun.
    note: For example, 新しい服 means “new clothes.”
    source: parallel-authored
  - id: ja-par-g021
    pattern: 人に言う
    english: say something to someone
    note: Mark the person being spoken to with に.
    source: parallel-authored
  - id: ja-par-g022
    pattern: な形容詞＋です
    english: Polite predicate with a na-adjective
    note: For example, きれいです means it looks beautiful or attractive.
    source: parallel-authored
  - id: ja-par-g023
    pattern: Nに親切です
    english: be kind to someone
    note: Use に for the person who receives the kindness.
    source: parallel-authored
  - id: ja-par-g024
    pattern: 変化を表す文＋ました／ています
    english: Report a new situation or a resulting state using the Japanese form that fits the verb.
    note: Japanese has no general sentence-final particle for this meaning. For example, use 降り始めました for rain starting, or ついています for a light or television being on.
    source: parallel-authored
  - id: ja-par-g025
    pattern: 本当に＋形容詞です
    english: Emphasize an adjective with “really.”
    note: 本当に comes before an adjective, as in 本当においしいです.
    source: parallel-authored
  - id: ja-par-g026
    pattern: N＋たち
    english: Add たち to a person or animal noun to refer to a group.
    note: For example, 先生たち and 犬たち. Japanese often uses this suffix where Chinese uses a plural ending.
    source: parallel-authored
  - id: ja-par-g027
    pattern: また＋動詞ます
    english: do something again at a later time
    note: また can come before the verb for a future or intended repetition.
    source: parallel-authored
  - id: ja-par-g028
    pattern: Nがありません
    english: there is not; do not have
    note: Use the polite negative of あります to say something is absent or not available.
    source: parallel-authored
  - id: ja-par-g029
    pattern: 曜日名（〜曜日）
    english: Form weekday names with 曜日.
    note: Japanese weekday names are not formed by adding a number.
    source: parallel-authored
  - id: ja-par-g030
    pattern: 場所に住みます／住んでいます
    english: Live or stay at a place; mark the place with に.
    source: parallel-authored
  - id: ja-par-g031
    pattern: 数＋百＋（残りの数）
    english: Make a number in the hundreds by putting the remaining number after 百.
    note: Japanese usually omits 一 before 百, as in 百円.
    source: parallel-authored
  - id: ja-par-g032
    pattern: 数＋千＋（残りの数）
    english: Make a number in the thousands by putting the remaining number after 千.
    note: Japanese usually omits 一 before 千, as in 千円.
    source: parallel-authored
  - id: ja-par-g033
    pattern: 人と＋動詞
    english: Do an action with someone.
    note: と marks the person accompanying the subject.
    source: parallel-authored
  - id: ja-par-g034
    pattern: Nをください
    english: Please give me N.
    note: A polite way to request an item, as in パンを一切れください。
    source: parallel-authored
  - id: ja-par-g035
    pattern: どのくらい＋形容詞ですか
    english: Ask how + adjective, such as how big or how tall.
    note: どれくらい can also be used in place of どのくらい.
    source: parallel-authored
  - id: ja-par-g036
    pattern: NをVます／NをVました
    english: Keep the object before the verb; mark tense on the verb ending.
    note: Japanese does not split a verb-object expression to insert aspect or quantity.
    source: parallel-authored
  - id: ja-par-g037
    pattern: どの＋N
    english: which one or ones; which + noun
    note: Use どの before a noun to ask which item or items.
    source: parallel-authored
  - id: ja-par-g038
    pattern: い-adjective stem＋く＋verb
    english: Use an い-adjective adverbially before a verb.
    note: For example, 早い becomes 早く.
    source: parallel-authored
  - id: ja-par-g039
    pattern: plain-form verb＋N
    english: A plain-form verb can modify a noun, as in “the shop she opened.”
    note: Use the plain form directly before the noun; the main sentence can still be polite.
    source: parallel-authored
  - id: ja-par-g040
    pattern: Nの後に
    english: after a noun or event
    note: Use の to connect the event or noun to 後; に can mark when the next action happens.
    source: parallel-authored
  - id: ja-par-g041
    pattern: N1の上／下／中／外（に）
    english: describe a location relative to N1
    note: の links the place to its landmark; に can mark the location with あります or います.
    source: parallel-authored
  - id: ja-par-g042
    pattern: どうやって＋Vますか
    english: Ask how to do something
    note: Place どうやって before the action.
    source: parallel-authored
  - id: ja-par-g043
    pattern: 年＋月＋日
    english: Give a date in year-month-day order, putting each number before 年, 月, or 日.
    note: The reading of 日 varies for some dates, such as ついたち and みっか.
    source: parallel-authored
  - id: ja-par-g044
    pattern: Nはどうですか
    english: Ask how something is or what it is like.
    note: Put the topic before は; use どうですか to ask for an opinion or description.
    source: parallel-authored
  - id: ja-par-g045
    pattern: 数＋助数詞＋目＋の＋N
    english: Ordinal number before a noun, formed with a number, counter, and 目
    note: For example, 二冊目の本 means “the second book,” and 三日目 means “the third day.”
    source: parallel-authored
  - id: ja-par-g046
    pattern: 千＋一の位（十・百の位が0の場合）
    english: In Japanese, a number such as 1,008 is read 千八, omitting the zero places.
    note: For example, 千八円（せんはちえん）.
    source: parallel-authored
  - id: ja-par-g047
    pattern: Nを［容器］半分＋動詞
    english: Put 半分 after a container to say half a container of something.
    note: For example, 牛乳をコップ半分飲みます.
    source: parallel-authored
  - id: ja-par-g048
    pattern: ありがとう＋ございます
    english: polite form of “thank you”
    note: Use ございます after ありがとう to express thanks politely.
    source: parallel-authored
  - id: ja-par-g049
    pattern: 数＋歳（＋です）
    english: State someone's age in years.
    note: Use 歳 after the number of years; add です for a polite sentence.
    source: parallel-authored
  - id: ja-par-g050
    pattern: 数＋杯
    english: number of cups or glasses
    note: Use 杯 as a counter for drinks; the reading varies with the number.
    source: parallel-authored
  - id: ja-par-g051
    pattern: 動詞ない形＋くて
    english: Connect a negative verb form to a following description or feeling.
    note: For example, いる becomes いなくて in 家族がいなくて寂しいです。
    source: parallel-authored
  - id: ja-par-g052
    pattern: 疑問詞を含む文＋か
    english: Ask an open question with a question word such as who, what, where, or when.
    note: Use a question word in the answer slot and finish the polite question with か.
    source: parallel-authored
  - id: ja-par-g053
    pattern: 疑問詞＋文＋か
    english: Ask a question by putting a question word in the answer position; do not add a separate yes-no question marker.
    note: Use with question words such as 誰, 何, and どこ. The polite question ending か may still be used.
    source: parallel-authored
  - id: ja-par-g054
    pattern: 動詞語幹＋に来ます
    english: Come somewhere in order to do something.
    note: Put the verb stem for the purpose before に来ます.
    source: parallel-authored
  - id: ja-par-g055
    pattern: 動詞ない形＋N
    english: A plain negative verb modifies a noun.
    note: Use the negative plain form of a verb before a noun to describe someone or something that does not do the action.
    source: parallel-authored
  - id: ja-par-g056
    pattern: 引用する語句＋と＋言います
    english: Put と after a quoted word or phrase before 言います.
    note: Use と to mark the words being said.
    source: parallel-authored
  - id: ja-par-g057
    pattern: い形容詞くありません
    english: Polite negative form of an い-adjective
    note: Replace the adjective ending い with くありません.
    source: parallel-authored
  - id: ja-par-g058
    pattern: い形容詞語幹＋すぎます
    english: too; excessively
    note: Attach すぎます to an い-adjective stem to say that something is too much or excessive.
    source: parallel-authored
  - id: ja-par-g059
    pattern: もう＋否定
    english: no longer; not anymore
    note: もう precedes a negative predicate.
    source: parallel-authored
  - id: ja-par-g060
    pattern: Nができました
    english: N is ready
    note: A natural expression for saying something is ready.
    source: parallel-authored
  - id: ja-par-g061
    pattern: 場所に＋動詞
    english: Mark the place where an action or posture happens with に.
    note: Use for a location such as そこに座る; this is not the time-point に.
    source: parallel-authored
  - id: ja-par-g062
    pattern: Nで大丈夫です
    english: Say that something is acceptable or will do using Nで大丈夫です.
    note: Here で marks the acceptable choice or condition.
    source: parallel-authored
  - id: ja-par-g063
    pattern: Nから出る／降りる
    english: leave or get off N
    note: Use から for the place or vehicle one leaves when getting off.
    source: parallel-authored
  - id: ja-par-g064
    pattern: 午前／午後＋時刻＋時（＋分）
    english: Tell the time using the hour and, when needed, the minutes.
    note: Put the time of day before the hour. Use 時 after the hour and 分 after the minutes.
    source: parallel-authored
  - id: ja-par-g065
    pattern: 数＋つ
    english: Use つ as a general counter for things.
    note: After a number, つ counts things when no more specific counter is used.
    source: parallel-authored
  - id: ja-par-g066
    pattern: 乗り物に乗ります
    english: Get on or take a vehicle; mark the vehicle with に.
    note: Use に with a vehicle when saying that someone gets on or takes it.
    source: parallel-authored
  - id: ja-par-g067
    pattern: Nに会う
    english: Meet someone; に marks the person you meet.
    note: Use に after the person you meet.
    source: parallel-authored
  - id: ja-par-g068
    pattern: 乗り物に乗る
    english: Get on or board a vehicle; mark the vehicle with に.
    note: Use に before 乗る for vehicles such as a car, train, or airplane.
    source: parallel-authored
  - id: ja-par-g069
    pattern: Nに電話が来る
    english: A call comes in for someone.
    note: Use に to mark the person receiving an incoming call.
    source: parallel-authored
  - id: ja-par-g070
    pattern: 数＋日目
    english: A numbered day; the nth day.
    note: 日目 marks a day in a sequence. 三日目 is read みっかめ.
    source: parallel-authored
