    notes:
      - "phrase 1:30 (lesson 6) dropped after 2 rewrites: Meaning mismatch: the English and Chinese say 'You are classmates' (plural, 你们), but 同級生です is just 'is/am a classmate' with no subject. Natural Japanese would drop the subject only if context makes it clear, and a bare line is ambiguous. Also, 同級生 means a classmate in the same grade or year, while 同学 is looser. Write 皆さんは同級生です。 or 二人は同級生です。 so the plural 'you' is explicit. Tag 同級生 as a word too, since 'ja-par-00005' looks like a particle id."
