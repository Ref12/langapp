    notes:
      - "phrase 1:320 (lesson 58) dropped after 2 rewrites: The Chinese 他们 is rendered as 彼女たち (they, female), which is unnatural without context. Use 彼らは, or drop the subject: 大学に住んでいます. Also, 大学に住んでいます is odd, since people live in a dorm rather than at a university."
      - "phrase 1:1007 (lesson 58) dropped after 2 rewrites: The English says 'will stay' but 来年は大学にいます is awkward and ambiguous. The Chinese 住 means live, not be present. Use 来年は大学の寮に住みます."
      - "phrase 1:318 (lesson 58) dropped after 2 rewrites: The Japanese has no 'they', so ここに一週間います is 'I'll be here for a week'. The Chinese says 他们住. The mismatch makes it wrong. Use 彼らは一週間ここに泊まります."
      - "phrase 1:636 (lesson 58) dropped after 2 rewrites: 彼女たち means 'they (women)', which is unnatural here. Also, 来年は…も implies someone else too, but this doesn't match the Chinese. Use 来年、彼らは大学の寮に住みます."
