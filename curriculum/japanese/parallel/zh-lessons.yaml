      - "phrase 1:666 (lesson 68) dropped after 2 rewrites: 「彼女が開いた店です」は、文脈がないと断片的で不自然です。また、「開く」は店を開業する意味では「開いた」より「開いた店」が曖昧なので、「これは彼女の店です。」または「彼女が始めた店です。」にしてください。"
      - "phrase 1:370 (lesson 68) dropped after 2 rewrites: 「どの質問ですか。」は文脈のない断片的な疑問で、learner向けの自然な返答ではありません。また、英語の複数形「Which questions?」とも合いません。「どの質問ですか。」を使うなら文脈のある対話にし、「どんな質問ですか。」などにしてください。"
