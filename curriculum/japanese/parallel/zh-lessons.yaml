    notes:
      - "item 杯 (lesson 23) dropped after 2 rewrites: 杯 is read さかずき on its own, or はい/ばい/ぱい only as a counter suffix (一杯 いっぱい, 二杯 にはい, 三杯 さんばい). As a standalone word item, 'はい' is wrong and clashes with the common word はい (yes). Use a counter form such as 一杯 (いっぱい, 'one cupful') or 二杯 (にはい), or a sentence like コーヒーを二杯のみました."
      - "phrase 1:593 (lesson 23) dropped after 2 rewrites: 「何時間ですか」 is ambiguous and out of context; it could be read as asking about duration generally, and it does not say 'need'. Write 何時間ひつようですか or 何時間ほしいですか; more simply 何時間ありますか ('How many hours do you have?') to match the earlier lines."
      - "phrase 1:129 (lesson 23) dropped after 2 rewrites: どれくらい asks about amount in general, not 'how many cups', so it does not match the English. Write お茶を何ばいほしいですか or お茶は何杯ですか. Also the が grammar tag (g005) fits, but 杯 counting is the target point."
