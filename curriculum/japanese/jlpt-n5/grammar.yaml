- id: ja-n5-g001
  pattern: Nです
  english: be a noun; polite identification
  note: Use with nouns and nominal predicates; Japanese usually omits recoverable pronouns.
  examples:
  - target: 私は学生です。
    english: I am a student.
  - target: 今日は休みです。
    english: Today is a day off.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g002
  pattern: Nではありません
  english: not be a noun; polite negation
  note: Formal negative copula; introduce the common conversational contraction as a later variation.
  examples:
  - target: これは私の傘ではありません。
    english: This is not my umbrella.
  - target: 父は医者ではありません。
    english: My father is not a doctor.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g003
  pattern: 文＋か
  english: polite question
  note: Add the question particle to a polite sentence; teach who, what, when and where through vocabulary.
  examples:
  - target: ここは駅ですか。
    english: Is this the station?
  - target: 何時ですか。
    english: What time is it?
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g004
  pattern: Nは
  english: topic; as for a noun
  note: The topic particle is pronounced wa; contrast topic with the grammatical subject.
  examples:
  - target: 私は大阪に住んでいます。
    english: I live in Osaka.
  - target: この店は安いです。
    english: This shop is inexpensive.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g005
  pattern: Nが
  english: subject; newly identified information
  note: Use for the answer to a who-or-what question and with existence predicates.
  examples:
  - target: 誰が来ますか。
    english: Who is coming?
  - target: 妹が来ます。
    english: My younger sister is coming.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g006
  pattern: Nを
  english: direct object
  note: The object particle is normally pronounced o; it follows the affected object.
  examples:
  - target: 水を飲みます。
    english: I drink water.
  - target: 本を読みます。
    english: I read a book.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g007
  pattern: NのN
  english: possession; noun modification
  note: The first noun narrows or identifies the second; not all uses express ownership.
  examples:
  - target: これは母のかばんです。
    english: This is my mother's bag.
  - target: 日本語の先生です。
    english: They are a Japanese-language teacher.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g008
  pattern: Nも
  english: also; too
  note: Usually replaces the topic or subject particle in elementary affirmative clauses.
  examples:
  - target: 私も行きます。
    english: I will go too.
  - target: この本も面白いです。
    english: This book is interesting too.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g009
  pattern: 場所で
  english: at a place where an action happens
  note: Contrast action location with the location of existence.
  examples:
  - target: 図書館で勉強します。
    english: I study at the library.
  - target: 家で昼ご飯を食べます。
    english: I eat lunch at home.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g010
  pattern: 場所にNがあります
  english: an inanimate thing exists at a place
  note: Use for things and plants; not the ordinary existence predicate for people or animals.
  examples:
  - target: 机の上に本があります。
    english: There is a book on the desk.
  - target: 庭に木があります。
    english: There is a tree in the garden.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g011
  pattern: 場所にNがいます
  english: a person or animal exists at a place
  note: Use for people and animals; teach location and subject word order together.
  examples:
  - target: 公園に子供がいます。
    english: There are children in the park.
  - target: 部屋に猫がいます。
    english: There is a cat in the room.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g012
  pattern: 場所に／へ行きます
  english: go to; move toward a destination
  note: The directional particle written he is pronounced e; destination and purpose are distinct.
  examples:
  - target: 明日、京都へ行きます。
    english: I will go to Kyoto tomorrow.
  - target: 毎日学校に行きます。
    english: I go to school every day.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g013
  pattern: Nで
  english: by; using a means or instrument
  note: Contrast instrument or transport with action-location uses of the same particle.
  examples:
  - target: 電車で会社に行きます。
    english: I go to work by train.
  - target: ペンで名前を書きます。
    english: I write my name with a pen.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g014
  pattern: 時点に
  english: at a specific time
  note: Specific clock times and dates commonly take this particle; relative time words often do not.
  examples:
  - target: 七時に起きます。
    english: I get up at seven.
  - target: 月曜日に会いましょう。
    english: Let's meet on Monday.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g015
  pattern: NからNまで
  english: from a starting point to an endpoint
  note: Use for time or place boundaries; teach that an endpoint need not be a deadline.
  examples:
  - target: 九時から五時まで働きます。
    english: I work from nine to five.
  - target: 駅から学校まで歩きます。
    english: I walk from the station to the school.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g016
  pattern: NとN
  english: and; an exhaustive noun list
  note: Also introduces a companion, but distinguish that function in practice.
  examples:
  - target: パンと卵を買います。
    english: I will buy bread and eggs.
  - target: 兄と姉がいます。
    english: I have an older brother and an older sister.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g017
  pattern: NやNなど
  english: such things as; a non-exhaustive list
  note: The list gives examples rather than claiming to name every item.
  examples:
  - target: 机の上に本やノートがあります。
    english: There are things such as books and notebooks on the desk.
  - target: りんごやバナナなどを食べます。
    english: I eat fruit such as apples and bananas.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g018
  pattern: これ／それ／あれ
  english: this; that; that over there
  note: Standalone demonstrative pronouns; choose by physical or conversational distance.
  examples:
  - target: これは新しい時計です。
    english: This is a new watch.
  - target: あれは私の自転車です。
    english: That over there is my bicycle.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g019
  pattern: この／その／あの＋N
  english: this noun; that noun; that noun over there
  note: These demonstratives require a following noun.
  examples:
  - target: この道は静かです。
    english: This street is quiet.
  - target: そのかばんは重いですか。
    english: Is that bag heavy?
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g020
  pattern: い形容詞＋です
  english: polite i-adjective predicate
  note: 'The adjective itself inflects: negative in -kunai and past in -katta; do not attach a plain copula.'
  examples:
  - target: この部屋は広いです。
    english: This room is spacious.
  - target: 昨日は寒かったです。
    english: It was cold yesterday.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g021
  pattern: な形容詞＋な＋N
  english: na-adjective modifying a noun
  note: Use the linking na before nouns, not directly before the polite copula.
  examples:
  - target: 静かな部屋が好きです。
    english: I like quiet rooms.
  - target: ここは便利な町です。
    english: This is a convenient town.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g022
  pattern: Nでした／ではありませんでした
  english: was a noun; was not a noun
  note: Polite past copula; distinguish noun predicates from adjective and verb inflection.
  examples:
  - target: 昨日は雨でした。
    english: It was rainy yesterday.
  - target: 先週は休みではありませんでした。
    english: Last week was not a holiday.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g023
  pattern: 動詞ます
  english: polite nonpast verb
  note: Can describe a habit or a future event; teach verb groups and dictionary-form lookup together.
  examples:
  - target: 毎朝走ります。
    english: I run every morning.
  - target: 明日帰ります。
    english: I will return tomorrow.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g024
  pattern: 動詞ません
  english: polite negative nonpast verb
  note: Use for a negative habit or intention; the temporal context determines English tense.
  examples:
  - target: 私は肉を食べません。
    english: I do not eat meat.
  - target: 今日は出かけません。
    english: I will not go out today.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g025
  pattern: 動詞ました／ませんでした
  english: polite past verb; polite negative past verb
  note: Teach past affirmative and negative as a contrastive pair.
  examples:
  - target: 昨日映画を見ました。
    english: I watched a film yesterday.
  - target: 今朝は走りませんでした。
    english: I did not run this morning.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g026
  pattern: 動詞てください
  english: please do something
  note: A direct polite request; appropriateness depends on relationship and burden.
  examples:
  - target: ここに名前を書いてください。
    english: Please write your name here.
  - target: 少し待ってください。
    english: Please wait a little.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g027
  pattern: 動詞ています
  english: be doing; an ongoing action
  note: At this stage teach ongoing action; resulting states need separate instruction later.
  examples:
  - target: 今、夕飯を作っています。
    english: I am making dinner now.
  - target: 弟はテレビを見ています。
    english: My younger brother is watching television.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g028
  pattern: 動詞てもいい
  english: may do; it is acceptable to do
  note: Requests permission when used as a question; not the same as ability.
  examples:
  - target: ここに座ってもいいですか。
    english: May I sit here?
  - target: この辞書を使ってもいいです。
    english: You may use this dictionary.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g029
  pattern: 動詞てはいけない
  english: must not do; prohibition
  note: Stronger than a preference or suggestion; avoid overusing it with peers.
  examples:
  - target: ここで写真を撮ってはいけません。
    english: You must not take photographs here.
  - target: この水を飲んではいけません。
    english: You must not drink this water.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g030
  pattern: 動詞ないでください
  english: please do not do something
  note: Requires the plain negative form; scaffold that form before using the request.
  examples:
  - target: 窓を開けないでください。
    english: Please do not open the window.
  - target: ここで走らないでください。
    english: Please do not run here.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g031
  pattern: 動詞たい
  english: want to do something
  note: Attach to the polite-verb stem; generally states the speaker's desire or asks the listener's.
  examples:
  - target: 日本に行きたいです。
    english: I want to go to Japan.
  - target: 今日は早く寝たいです。
    english: I want to go to bed early today.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g032
  pattern: Nが欲しい
  english: want a thing
  note: Use for the speaker's desire; avoid reporting another person's internal state without evidence.
  examples:
  - target: 新しい辞書が欲しいです。
    english: I want a new dictionary.
  - target: 何が欲しいですか。
    english: What do you want?
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g033
  pattern: 動詞ませんか
  english: would you like to do; invitation
  note: A negative question can make an invitation rather than asking about a negative fact.
  examples:
  - target: 一緒に昼ご飯を食べませんか。
    english: Would you like to have lunch together?
  - target: 週末、映画を見ませんか。
    english: Would you like to watch a film this weekend?
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g034
  pattern: 動詞ましょう
  english: let's do; a polite proposal
  note: Use for joint action; do not translate every instance as a command.
  examples:
  - target: 駅で会いましょう。
    english: Let's meet at the station.
  - target: 少し休みましょう。
    english: Let's take a short break.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g035
  pattern: 文から
  english: because; giving a reason
  note: The reason precedes the result; a direct explanatory tone is common.
  examples:
  - target: 寒いですから、窓を閉めます。
    english: I will close the window because it is cold.
  - target: 明日は休みですから、出かけます。
    english: I will go out because tomorrow is a day off.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g036
  pattern: 文が文
  english: but; linking contrasting clauses
  note: At beginner level teach contrast; later distinguish soft introductory uses.
  examples:
  - target: この店は小さいですが、便利です。
    english: This shop is small, but it is convenient.
  - target: 行きたいですが、時間がありません。
    english: I want to go, but I do not have time.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g037
  pattern: 動詞辞書形前に
  english: before doing something
  note: The verb before this expression stays nonpast even in an account of past events.
  examples:
  - target: 寝る前に本を読みます。
    english: I read a book before going to bed.
  - target: 食べる前に手を洗います。
    english: I wash my hands before eating.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g038
  pattern: 動詞てから
  english: after doing; first do and then
  note: The first event must precede the second; teach a practical sequence.
  examples:
  - target: 宿題をしてから遊びます。
    english: I play after doing my homework.
  - target: 朝ご飯を食べてから出かけました。
    english: I went out after eating breakfast.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g039
  pattern: AはBより形容詞
  english: A is more adjective than B
  note: The comparison baseline follows the comparative particle; adjective forms do not become comparative.
  examples:
  - target: このかばんはあのかばんより軽いです。
    english: This bag is lighter than that bag.
  - target: 今日は昨日より暖かいです。
    english: Today is warmer than yesterday.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g040
  pattern: Nの中で一番
  english: the most within a stated group
  note: Define the comparison set before asking for or asserting a superlative.
  examples:
  - target: 果物の中でりんごが一番好きです。
    english: Of all fruits, I like apples best.
  - target: この町でどの店が一番安いですか。
    english: Which shop is the cheapest in this town?
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g041
  pattern: 動詞て、動詞
  english: do something and then do something
  note: Conjoins actions; teach te-form sound changes by verb group, including irregular verbs.
  examples:
  - target: 駅で切符を買って、電車に乗りました。
    english: I bought a ticket at the station and boarded the train.
  - target: 家に帰って、夕飯を作ります。
    english: I will go home and make dinner.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g042
  pattern: 数＋助数詞
  english: number plus counter
  note: Teach common object, person and age counters with their sound changes, not one universal counter.
  examples:
  - target: りんごを三つ買いました。
    english: I bought three apples.
  - target: 学生が二人います。
    english: There are two students.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g043
  pattern: 動詞語幹に行く
  english: go in order to do something
  note: Attach to the polite-verb stem; motion is part of the meaning.
  examples:
  - target: 本を借りに図書館へ行きます。
    english: I go to the library to borrow books.
  - target: 友達に会いに行きました。
    english: I went to meet a friend.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g044
  pattern: Nが好き／上手
  english: like a thing; be good at a thing
  note: These are adjectival predicates, not transitive verbs; avoid praising one's own skill insensitively.
  examples:
  - target: 私は音楽が好きです。
    english: I like music.
  - target: 姉は料理が上手です。
    english: My older sister is good at cooking.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
- id: ja-n5-g045
  pattern: 文ね／文よ
  english: seeking agreement; presenting information
  note: Sentence-final particles convey stance; tone matters, so do not treat them as interchangeable
    decoration.
  examples:
  - target: 今日は暑いですね。
    english: It is hot today, isn't it?
  - target: 次の駅ですよ。
    english: It is the next station, you know.
  source_id: original-ja
  level_basis: Original teaching selection; estimated JLPT band, not an official or exhaustive grammar
    syllabus
